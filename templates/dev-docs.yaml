# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/dev-docs/v{バージョン}/schemas/dev-docs.schema.json
# 配信元に置く dev-docs.yaml の雛形。/dev-docs:setup が 1 行目のタグと name・description・paths を書き換える
version: "3"
name: sample
description: 配信元の説明（1 文）
documents:
  - id: files
    paths: [files.yaml]
    title: ファイル
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
