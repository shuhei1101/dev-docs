$schema: https://json-schema.org/draft/2020-12/schema
title: 共通の型
description: 種類をまたいで使う型（ID・タグ・関連・項目・メタデータ）の定義。各種類のスキーマから `$ref` で指す。
$defs:
  id:
    title: ID
    description: ファイルの中や文書どうしで一意な、英小文字と数字のケバブケースの識別子。
    type: string
    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
  date:
    title: 日付
    description: '`YYYY-MM-DD` 形式の日付。'
    type: string
    pattern: ^\d{4}-\d{2}-\d{2}$
  tag:
    title: タグの付与
    description: '文書に付けるタグ。主題のタグには `main: true` を付ける。'
    type: object
    additionalProperties: false
    required:
      - name
    properties:
      name:
        title: タグ名
        description: タグ名（例 `scope:python`）。
        type: string
        minLength: 1
      main:
        title: 主題
        description: 文書の主題のタグに `true` を付ける。
        type: boolean
  tags:
    title: タグの一覧
    description: '文書に付けるタグ。主題のタグ（`main: true`）をちょうど 1 つ持つ。'
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/tag'
    contains:
      type: object
      required:
        - main
      properties:
        main:
          const: true
    minContains: 1
    maxContains: 1
  related_item:
    title: 関連
    description: 別の文書への関連。片側だけに記載し、逆向きはツールで出す。`change_together` だけは両側に記載する。
    type: object
    additionalProperties: false
    required:
      - to
      - type
      - when
    properties:
      to:
        title: 相手の ID
        description: 関連先の文書の ID。実在する文書を指す。
        $ref: '#/$defs/id'
      type:
        title: 関係の種類
        description: 関係の種類。
        enum:
          - requires
          - references
          - replaces
          - part_of
          - change_together
      when:
        title: いつ読むか
        description: 関連先をいつ読むかを 1 文で記載する。
        type: string
        minLength: 1
      paths:
        title: 対象のパス
        description: 機械で判定できるときだけ、関連が当たるファイルの glob を併記する。
        type: array
        items:
          type: string
  related:
    title: 関連の一覧
    description: 関連する文書。
    type: array
    maxItems: 8
    items:
      $ref: '#/$defs/related_item'
  source:
    title: 出典
    description: 文書が拠り所にした出典 1 件。公式ドキュメントなどの URL と、確かめたライブラリのバージョン・日付を持つ。
    type: object
    additionalProperties: false
    required:
      - title
      - url
    properties:
      id:
        title: 略号
        description: 本文や表の `出典` 列が出典を指す略号。1 つの略号が複数のページを指すときは、同じ略号を各要素に付ける。
        type: string
        minLength: 1
        examples:
          - GT
          - 'NN/g: Data Tables'
      title:
        title: 出典名
        description: 出典の名前。
        type: string
        minLength: 1
        examples:
          - Google Technical Writing One
      url:
        title: URL
        description: 出典の URL。
        type: string
        format: uri
        examples:
          - https://developers.google.com/tech-writing/one
      note:
        title: 拠り所にした箇所
        description: 出典のうち、どの部分を拠り所にしたか。
        type: string
        minLength: 1
        examples:
          - '`tools/list` の `cursor` / `nextCursor`'
      library:
        title: ライブラリ
        description: 出典がライブラリ・仕様の文書であるときの、ライブラリ・仕様の名前。
        type: string
        minLength: 1
        examples:
          - JSON Schema
      version:
        title: 確かめたバージョン
        description: 出典を確かめたときの、ライブラリ・仕様のバージョン。
        type: string
        minLength: 1
        examples:
          - '2020-12'
      checked:
        $ref: '#/$defs/date'
        title: 確かめた日
        description: 出典を確かめた日。
        examples:
          - '2026-10-30'
  item:
    title: 項目
    description: 文書の中の、取得・注入できる最小の単位。
    type: object
    additionalProperties: false
    required:
      - id
      - name
      - body
    properties:
      id:
        title: 項目の ID
        description: ファイルの中で一意な ID。`{group を英小文字のケバブケースにしたもの}-{2 桁の連番}` で、先頭のリードの項目だけ `overview`。
        $ref: '#/$defs/id'
      group:
        title: グループ
        description: '項目が属するまとまり。元の見出しの経路（最上位から親の見出しまで）を ` > ` でつないだ文言を記載する。'
        type: string
        minLength: 1
      name:
        title: 項目名
        description: 項目の中身を表す 15 字程度の見出し語。
        type: string
        minLength: 1
      body:
        title: 本文
        description: markdown の本文。他の文書へのリンクは `[{名前}](id:{文書の ID})`、項目まで指すときは `[{名前}](id:{文書の ID}#{項目の ID})` で記載する。
        type: string
        minLength: 1
  metadata:
    title: メタデータ
    description: 全ての文書が持つメタデータのキー。種類のスキーマが `kind` と `last_reviewed` の要否を決める。
    type: object
    required:
      - id
      - kind
      - name
      - description
      - tags
      - status
      - visibility
      - rev
      - items
    properties:
      id:
        title: 文書の ID
        description: 変わらない ID。ファイル名と同じ。
        $ref: '#/$defs/id'
      kind:
        title: 種類
        description: 文書の種類。
        type: string
      name:
        title: タイトル
        description: 文書のタイトル。元の markdown の見出しをそのまま記載する。
        type: string
        minLength: 1
      description:
        title: 概要文
        description: 本文を読まずに中身が分かる 1 文。何を受け持つか／何について書いてあるかと、どんなときに読むかを記載する。
        type: string
        minLength: 1
      aliases:
        title: 別名
        description: 本文や会話でこの文書を呼ぶ別の名前。
        type: array
        items:
          type: string
      tags:
        $ref: '#/$defs/tags'
      status:
        title: 状態
        description: 文書の状態。
        enum:
          - current
          - deprecated
      visibility:
        title: 公開範囲
        description: '`public` は GitHub Pages に公開する文書、`internal` は開発ドキュメントサーバーだけで配信する文書。'
        enum:
          - public
          - internal
      rev:
        title: バージョン
        description: 変更ごとに増えるバージョン。書き込みのツールが付ける。
        type: integer
        minimum: 1
      last_reviewed:
        $ref: '#/$defs/date'
        title: 最終確認日
        description: 最後に内容を確かめた日。
      related:
        $ref: '#/$defs/related'
      sources:
        title: 出典の一覧
        description: 文書が拠り所にした出典。本文には決めたことだけを記載し、参考にした公式ドキュメントの URL・ライブラリとバージョン・確かめた日はここに記載する。
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/source'
        examples:
          - - id: GT
              title: Google Technical Writing One
              url: https://developers.google.com/tech-writing/one
      items:
        title: 項目の一覧
        description: 文書を小分けにした項目。並びが元の見出しと本文の並び。
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/item'
