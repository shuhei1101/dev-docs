$schema: https://json-schema.org/draft/2020-12/schema
title: 端末の設定
description: dev-docs の端末の設定 `settings.yaml`。
type: object
additionalProperties: false
required:
  - version
  - clone
properties:
  version:
    type: string
    title: 設定のバージョン
    description: 設定を記載したときのスキーマのバージョン（整数の文字列）。
    pattern: ^[0-9]+$
  clone:
    type: string
    title: クローンの場所
    description: dev-docs のクローン。管理用プラグインのフックが `dev-docs serve` を起動する。
    minLength: 1
  port:
    type: integer
    title: 待ち受けのポート
    description: 画面・画面の API・管理の MCP を待ち受ける 1 つのポート。
    minimum: 1
    maximum: 65535
  bind:
    type: string
    title: 待ち受けのアドレス
    minLength: 1
  project_index:
    type: string
    title: project-index の接続先
    description: 文書・検索・リビジョン・配信元の状態を問い合わせる project-index のアドレス。
    pattern: ^https?://
  sources:
    title: 前のバージョンから残った配信元
    description: version 1 の端末の設定の配信元の行。dev-docs migrate が project-index へ移し、残った行は配信に使用しない。
  state_dir:
    type: string
    title: 状態の配置先
    minLength: 1
  log_dir:
    type: string
    title: ログの配置先
    minLength: 1
