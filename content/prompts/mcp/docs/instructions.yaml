# yaml-language-server: $schema=../../../../templates/prompt.schema.yaml
id: mcp/docs/instructions
name: 文書の MCP の instructions
description: 文書の MCP を使う場面と grep・Read が向く場面、調べ方、ツールの順序、タグの付け方を伝える
kind: instructions
lang: ja
parts:
  - id: overview
    texts:
      - lang: ja
        text: |
          dev-docs は、配信元（規約・設計書・テンプレートなどの文書のまとまり）の文書を、メタデータと本文で探す・読む・書く MCP です。
          使える配信元と、その警告は、引数なしの `describe()` の一覧にあります。
  - id: use-cases
    texts:
      - lang: ja
        text: |

          使う場面:
          - 規約・設計書・テンプレートを、タグ・種類・名前・本文の語で探して読む: `search_docs`
          - 設計書からそれを実装するコード・テストを、コードから設計書をたどる: `trace_related`
          - 前に読んだ後や 2 つのリビジョンの間に変わった文書を確かめる: `list_changes`
          - 配信元の文書を作る・書き換える（検査を通ったときだけ書く）: `write_docs`
  - id: native-tools
    texts:
      - lang: ja
        text: |

          grep・Read が向く場面:
          - コードの識別子・文字列の出現箇所を探す
          - 配信の範囲の外のファイル（ソースコード・ログ・設定ファイル）を読む
          - パスの分かっている 1 つのファイルを丸ごと読む
          - 変更をコミットの単位で追う（`git log`・`git diff`）
  - id: research
    texts:
      - lang: ja
        text: |

          調べ方:
          - コードや不具合の調査も、設計書から参照し、設計書が指すコードを参照する
          - 作業場所の外のリポジトリも、`source` に配信元の ID と `outside_scope: true` を指定すると、設計書から参照できる。読める配信元の ID は `describe(outside_scope: true)` で確認できる
  - id: order
    texts:
      - lang: ja
        text: |

          使い方:
          - 始めに `describe(source)` で種類と書き方を確かめる
          - 探すときは `search_docs`。配信元をまたぐときは `source="*"`、本文まで読むときは `view="full"`
          - 前に読んだ後の変更は `list_changes` で確かめる
          - 範囲のファイルを作った・消した・改名したら、管理用の YAML の行を修正する
  - id: tags
    texts:
      - lang: ja
        text: |

          タグ:
          - 付ける前に `search_docs` の `group_by="tags"` で使われているタグを見て、同じ意味のタグを使い回す
          - 複合語は単語まで分けてタグにする（`エラー処理` は `topic:エラー` と `action:処理`）
          - 動作は `action:`、題材は `topic:`、道具は `tool:` で始める
          - 配信元にタグの規約があれば、`describe(source)` の説明書に従う
