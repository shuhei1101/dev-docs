# yaml-language-server: $schema=../../../../../templates/prompt.schema.yaml
id: mcp/docs/tools/trace-related
name: trace_related の description
description: 文書の MCP の trace_related が何をするか・いつ使うか・いつ使わないか・何を返さないかを伝える
kind: tool
lang: ja
parts:
  - id: body
    texts:
      - lang: ja
        text: |-
          起点の文書やコードのパスから、related をたどって関連する文書を返す。設計書を起点に direction: in で呼ぶと、via.type が implements の文書がその設計書を実装するコード、コードを起点にすると tests の文書がそのテストになる。
          設計書から実装・テストを、コードから設計書をたどるときに使う。
          語や条件で文書を探すときは search_docs を使う。コードの中の呼び出し元は grep で探す。
          関連の相手の本文は返さない。この会話で返し済みの相手の名前・概要文は、repeat_seen: true で取り直せる。
