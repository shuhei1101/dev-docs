# yaml-language-server: $schema=../../../../../templates/prompt.schema.yaml
id: mcp/docs/tools/delete-docs
name: delete_docs の description
description: 文書の MCP の delete_docs が何をするか・いつ使うか・いつ使わないか・何を返さないかを伝える
kind: tool
lang: ja
parts:
  - id: body
    texts:
      - lang: ja
        text: |-
          文書を消す。参照されている文書は on_referenced に従って断るか、参照も外して消す。
          配信元の文書を消すときに使う。
          文書の一部を書き換えるときは write_docs を使う。
          消した文書の本文は返さない。
