title: "トップの転送"
entry:
  kind: endpoint
  value: GET `/`
flows:
  - name: 正常系
    summary: '`/` を `/_settings/` へ転送する'
    setup:
      - name: Mock
        description: なし（dev-docs のアプリを HTTP のテストのクライアントで呼ぶ）
      - name: 端末の設定
        description: '`sources` に sample の 1 行'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /

        C->>E: GET /
        E-->>C: 302 Location: /_settings/
      ```
    expected:
      - 302 で、`Location` が `/_settings/`
      - 配信元が 0 件の端末の設定でも同じ転送を返す
    test: test_normal
lead: トップを開いた利用者を設定画面へ転送する。
identifier: get_root
permissions: なし（`127.0.0.1` でだけ待ち受ける）
idempotent: true
side_effects: なし
callers:
  - dev/設計書/シナリオ/単一ユースケース/設定画面で端末の設定を変える#scenarios[正常シナリオ]
exclusivity: 排他しない
response:
  - name: Location
    type: str
    description: '`/_settings/`'
status_codes:
  - code: '302'
    condition: 常に `/_settings/` へ転送する
constraints:
  - item: 認可
    constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）
refs:
  - dev/設計書/シナリオ/単一ユースケース/設定画面で端末の設定を変える#scenarios[正常シナリオ]
