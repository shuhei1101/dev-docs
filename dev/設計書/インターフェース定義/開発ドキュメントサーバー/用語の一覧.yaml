title: "用語の一覧"
entry:
  kind: mcp_tool
  value: list_match_words
flows:
  - name: 正常系
    summary: '`alias_type` を持つ行の文書の `name` と `aliases` を、指す文書の ID とともに返す'
    setup:
      - name: Mock
        description: なし（一時フォルダに配信元を作り、dev-docs のアプリをテストのクライアントで呼ぶ）
      - name: 用語の種類
        description: sample の `alias_type` を持つ行の文書「作業範囲」
        notes: '`aliases` は `[scope, 担当範囲]`'
      - name: エイリアスのキーに違反する文書
        description: 同じ行の文書「壊れた用語」の `aliases` を数値（文字列でも文字列の並びでもない）にする
      - name: 入力
        description: '`source: sample`。`cwd` は sample のクローン本体'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as list_match_words

        C->>T: source: sample
        T->>T: alias_type を持つ行の文書のうちスキーマに通るものを集める
        T-->>C: 語と文書の ID の一覧
      ```
    expected:
      - '`words` に `作業範囲`（`name`）・`scope`・`担当範囲`（`alias`）が、文書「作業範囲」の ID とともに並ぶ'
      - 「壊れた用語」の語は `words` に載らない
    test: test_normal
  - name: 正常系（用語の種類が無い）
    summary: '`alias_type` を持つ行が無い配信元は空の一覧を返す'
    setup:
      - name: Mock
        description: なし
      - name: 用語の種類の無い配信元
        description: '`alias_type` を持つ行が無い配信元 `plain`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as list_match_words

        C->>T: source: plain
        T-->>C: 空の一覧
      ```
    expected:
      - '`words` が空で、エラーにしない'
    test: test_normal_when_no_alias_type
  - name: 異常系（作業範囲に当たらない・SourceNotReadableError）
    summary: '`cwd` が `scope` に当たらない配信元を断る'
    setup:
      - name: Mock
        description: なし
      - name: 配信元
        description: other（`scope.read` は other のフォルダだけ）
      - name: 入力
        description: '`source: other`。`cwd` は sample のクローン本体'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as list_match_words

        C->>T: source: other
        T->>T: scope に cwd が当たらない
        T-->>C: SourceNotReadableError
      ```
    expected:
      - '`SourceNotReadableError` で、今の作業場所から使える配信元の一覧を添える'
    test: test_error_when_source_not_readable
  - name: 異常系（配信していない配信元・SourceNotServedError）
    summary: 起動時の検証で外した配信元を断る
    setup:
      - name: Mock
        description: なし
      - name: 配信元
        description: '`enabled: false` の配信元 off'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as list_match_words

        C->>T: source: off
        T-->>C: SourceNotServedError
      ```
    expected:
      - '`SourceNotServedError` を返す'
    test: test_error_when_source_not_served
lead: 配信元の `alias_type` を持つ行の文書から、照合する語（`name` と `aliases`）を、指す文書の ID とともに返す。
identifier: list_match_words
permissions: その配信元の `scope.read` か `scope.write` に `cwd` が当たること
idempotent: true
side_effects: なし
callers:
  - dev/設計書/シナリオ/単一ユースケース/エージェントが調べる#scenarios[正常シナリオ（エイリアスの語で用語を引く）]
exclusivity: '読み取りだけで排他しない（`readOnlyHint: true`）'
request:
  - name: source
    type: str
    required: true
    location: argument
    description: 配信元の ID
  - name: worktree
    type: str
    required: false
    default: なし（`cwd` がワークツリーの中ならそのワークツリー）
    location: argument
    description: 文書を読むワークツリーのパス
  - name: format
    type: Literal['markdown', 'json']
    required: false
    default: '`markdown`'
    location: argument
    description: 返す形式
  - name: cwd
    type: str
    required: false
    default: なし（使える配信元が無い）
    location: argument
    description: 作業場所
    notes: フック（#4）が入れる
request_example: |-
  ```json
  {"source": "sample"}
  ```
response:
  - name: words[].word
    type: str
    description: 照合する語（文書の `name` か `aliases` の 1 要素）
  - name: words[].id
    type: str
    description: 語が指す文書の ID
  - name: words[].kind
    type: Literal['name', 'alias']
    description: 語が `name` から来たか `aliases` から来たか
response_example: |-
  ```markdown
  | 語 | 文書 | 種類 |
  | --- | --- | --- |
  | 作業範囲 | glossary/scope | name |
  | scope | glossary/scope | alias |
  | 担当範囲 | glossary/scope | alias |
  ```
exceptions:
  - name: なし（正常終了）
    condition: 返せた（`alias_type` を持つ行が無い配信元は空の一覧を返して正常終了）
  - name: SourceNotReadableError
    condition: '`cwd` が配信元の `scope.read`・`scope.write` に当たらない'
    notes: 今の作業場所から使える配信元の一覧を添える
  - name: SourceNotServedError
    condition: '起動時の検証で外したか `enabled: false` の配信元を指した'
constraints:
  - item: 注釈
    constraint: '`readOnlyHint: true`'
  - item: 載せる文書
    constraint: '`alias_type` を持つ行の文書のうち、エイリアスのキーが取り込んだエイリアスのスキーマに通るものだけ。`search_docs` の `term` と同じ関数で集める'
  - item: 件数
    constraint: 制限なし（配信元の用語を全て返す）
  - item: タイムアウト
    constraint: 制限なし
