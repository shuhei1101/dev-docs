title: "配信元の検査"
entry:
  kind: mcp_tool
  value: check_project
flows:
  - name: 正常系
    summary: 検証に通る配信元の違反 0 件と同期の件数を返す
    setup:
      - name: Mock
        description: なし（一時フォルダに配信元を作り、dev-docs のアプリをテストのクライアントで呼ぶ）
      - name: 配信元
        description: 検証に通る sample。管理用の YAML に無いファイル 1 件を置く
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as check_project
        participant F as 配信元のフォルダ

        C->>T: path
        T-->>F: dev-docs.yaml・管理用の YAML・スクリプトを読む
        T-->>C: 違反・設定のバージョン・同期の件数
      ```
    expected:
      - '`violations` と `missing_paths` と `script_errors` が空'
      - '`version_state` が `current`'
      - '`sync.unindexed_files` が 1 で、`sync.items` にそのパスがある'
      - 配信元のフォルダのファイルが変わらない
    test: test_normal
  - name: 正常系（違反がある）
    summary: スキーマに違反する設定と、書く前の `config` の違反を返す
    setup:
      - name: Mock
        description: なし
      - name: config
        description: '`documents[0].paths` を持たない YAML の文字列'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as check_project

        C->>T: path・config
        T-->>C: violations
      ```
    expected:
      - '`violations` に `documents[0].paths` と理由がある'
      - '`path` の `dev-docs.yaml` の中身ではなく `config` を検査している'
    test: test_normal_when_config_has_violations
  - name: 異常系（設定が無い・ConfigNotFoundError）
    summary: '`dev-docs.yaml` の無いフォルダを指すと断る'
    setup:
      - name: Mock
        description: なし
      - name: フォルダ
        description: 空の一時フォルダ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as check_project

        C->>T: path
        T-->>C: isError（ConfigNotFoundError）
      ```
    expected:
      - '`isError: true` で `dev-docs.yaml` が無いことと、探したパスを返す'
    test: test_error_when_config_not_found
  - name: 異常系（YAML として読めない・ConfigParseError）
    summary: 読めない `config` を渡すと、行と理由を返して断る
    setup:
      - name: Mock
        description: なし
      - name: config
        description: インデントが崩れた YAML の文字列
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as check_project

        C->>T: path・config
        T-->>C: isError（ConfigParseError）
      ```
    expected:
      - '`isError: true` で読めなかった行と理由を返す'
    test: test_error_when_config_unparsable
lead: 配信元の `dev-docs.yaml` と管理用の YAML・スクリプトを検証し、違反・設定のバージョンの新旧・索引の同期の件数を返す。端末の設定に無い配信元も検査できる。
identifier: check_project
permissions: なし（`127.0.0.1` でだけ待ち受ける）
idempotent: true
side_effects: なし（検査と確かめのスクリプトを実行するが、ファイルは書き換えない）
callers:
  - dev/設計書/シナリオ/単一ユースケース/配信元を追加する#scenarios[正常シナリオ]
  - dev/設計書/シナリオ/単一ユースケース/設定・スクリプトを変える#scenarios[正常シナリオ]
exclusivity: '読み取りだけで排他しない（`readOnlyHint: true`）'
request:
  - name: path
    type: str
    required: true
    location: argument
    description: 配信元のフォルダか、その `dev-docs.yaml` の絶対パス
  - name: config
    type: str
    required: false
    default: なし（`path` の `dev-docs.yaml` を読む）
    location: argument
    description: ファイルに書く前の `dev-docs.yaml` の中身（YAML の文字列）
    notes: setup が書く前の設定を確かめるため
  - name: format
    type: Literal['markdown', 'json']
    required: false
    default: '`markdown`'
    location: argument
    description: 返す形式
request_example: |-
  ```json
  {"path": "/home/u/repo/sample"}
  ```
response:
  - name: path
    type: str
    description: 検査した配信元のフォルダ
  - name: registered_id
    type: str | None
    description: 端末の設定の `sources` に同じフォルダの行があればその ID
  - name: config_version
    type: str | None
    description: '`dev-docs.yaml` の `version`'
  - name: version_state
    type: Literal['current', 'old', 'newer'] | None
    description: dev-docs が読めるバージョンとの比較
  - name: violations[].path
    type: str
    description: 違反したキーのパス（`documents[0].paths`）
  - name: violations[].rule
    type: str
    description: 違反の理由
  - name: missing_paths[]
    type: str
    description: '`documents[].paths` などが指して無いフォルダ・ファイル'
  - name: script_errors[].script
    type: str
    description: 確かめに失敗したスクリプトのパス
  - name: script_errors[].reason
    type: str
    description: 終了コードと stderr の要約
  - name: sync.missing_refs
    type: int
    description: '`ref` の列が無い文書の件数'
  - name: sync.unindexed_files
    type: int
    description: 管理用の YAML に無いファイルの件数
  - name: sync.missing_body_files
    type: int
    description: ファイルが無い行の件数
  - name: sync.items[]
    type: list[SyncItem]
    description: 件数の内訳（種類とパス）
    notes: 先頭 50 件まで
response_example: |-
  ```markdown
  /home/u/repo/sample（登録済み: sample）
  設定のバージョン: 1（current）

  違反: なし
  索引の同期: 管理用の YAML に無いファイル 1 件
  - unindexed_files: docs/memo.md
  ```
exceptions:
  - name: なし（正常終了）
    condition: 検査できた（違反があっても正常終了で違反を返す）
  - name: ConfigNotFoundError
    condition: '`path` に `dev-docs.yaml` が無く、`config` も渡していない'
    notes: '`isError: true`'
  - name: ConfigParseError
    condition: '`dev-docs.yaml` か `config` が YAML として読めない'
    notes: '`isError: true` で行と理由を返す'
constraints:
  - item: 注釈
    constraint: '`readOnlyHint: true`'
  - item: 検査の内容
    constraint: 起動・`reload` の配信元の検証と同じ関数を使う。結果は配信中の配信元の状態に反映しない
  - item: 件数の内訳
    constraint: 先頭 50 件まで返し、件数は全件を数える
  - item: タイムアウト
    constraint: スクリプトの確かめは `script_timeout_sec` で打ち切り、`script_errors` に入れる
test_file: tests/integration/server/test_check_project.py
