title: "画面の検索"
entry:
  kind: endpoint
  value: GET `/_api/sources/{source}/search`
flows:
  - name: 正常系
    summary: 語を含む文書だけを一致した箇所つきで返す
    setup:
      - name: Mock
        description: なし（一時フォルダに配信元を作り、dev-docs のアプリを HTTP のテストのクライアントで呼ぶ）
      - name: サンプルの配信元
        description: 文書 2 の本文だけが含む語を持つ sample
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/search
        participant ST as 配信元の文書

        C->>E: q: 文書 2 だけが含む語
        E-->>ST: 文書を読む
        E-->>C: 200 文書 2 と一致した箇所
      ```
    expected:
      - '`total_count` が 1 で、`items` が文書 2 だけ'
      - '`snippets` に語を含む行がある'
      - '`items[0].path` を `path` に渡した文書の取得が文書 2 を返す'
    test: test_normal
  - name: 異常系（語の誤り・400）
    summary: 空の語と長すぎる語を断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`q` が空と、201 文字'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/search

        C->>E: q: 空
        E-->>C: 400 problem+json（q の違反）
      ```
    expected:
      - どちらも 400 で、`errors[0].path` が `q`、`reason` に空か長すぎることがある
    test: test_error_when_query_invalid
  - name: 異常系（無い配信元・リビジョン・404）
    summary: 無い配信元・解決できないリビジョンを断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`/_api/sources/unknown/search?q=a` と `/_api/sources/sample/search?q=a&ref=no-such-branch`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/search

        C->>E: source: unknown
        E-->>C: 404 problem+json（無い配信元）
      ```
    expected:
      - '`unknown` が 404 で、`detail` に無いのが配信元であることがある'
      - '`no-such-branch` が 404 で、`detail` に解決できなかったリビジョンがある'
    test: test_error_when_not_found
lead: トップバーの検索が呼ぶ。語を含む文書と一致した箇所を返す。
identifier: search_page
permissions: なし（`127.0.0.1` でだけ待ち受ける）
idempotent: true
side_effects: なし
exclusivity: 読み取りだけで排他しない
request:
  - name: source
    type: str
    required: true
    location: path
    description: 配信元の ID
  - name: q
    type: str
    required: true
    location: query
    description: 検索する語。空白で区切った語を全て含む文書に当たる
    constraints: 1〜200 文字
    notes: 大文字小文字と全角半角（NFKC）を区別しない
  - name: ref
    type: str
    required: false
    default: なし（配信元の `default_ref`）
    location: query
    description: 検索するリビジョン
  - name: limit
    type: int
    required: false
    default: '`20`'
    location: query
    description: 返す件数
    constraints: 1〜100
request_example: |-
  ```text
  GET /_api/sources/sample/search?q=%E3%83%9A%E3%83%BC%E3%82%B8%E3%83%B3%E3%82%B0
  ```
response:
  - name: total_count
    type: int
    description: 一致した文書の総件数
  - name: items[].path
    type: str
    description: 文書のパス（文書の取得の `path` に渡す形）
  - name: items[].name
    type: str
    description: 文書の名前
  - name: items[].snippets
    type: list[str]
    description: 一致した行と前後の文字
    constraints: 文書ごとに 3 件まで
response_example: |-
  ```json
  {"total_count": 1, "items": [
    {"path": "docs/doc-2", "name": "文書 2", "snippets": ["…一覧のページングは…"]}
  ]}
  ```
status_codes:
  - code: '200'
    condition: 検索した（一致が 0 件のときも 200）
  - code: '400'
    condition: '`q` が空か 200 文字を超える'
  - code: '404'
    condition: 配信元が無い・配信していない、または `ref` を解決できない
error_format: RFC 9457 の `application/problem+json`（`type`・`title`・`status`・`detail`）。検証の違反は `errors[]` に `{path, reason}` で並べる
constraints:
  - item: 件数
    constraint: '`limit` は最大 100'
  - item: 認可
    constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）
  - item: タイムアウト
    constraint: 制限なし
