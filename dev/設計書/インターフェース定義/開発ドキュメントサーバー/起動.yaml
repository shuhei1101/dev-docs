title: "起動"
entry:
  kind: operation
  value: '`dev-docs serve`（CLI）'
flows:
  - name: 正常系
    summary: 端末の設定の 2 つの配信元を配信し始める
    setup:
      - name: Mock
        description: なし（`dev-docs serve` を子プロセスで起動し、空きポートを `DEV_DOCS_PORT` に入れる）
      - name: 配信元
        description: git リポジトリの sample と、Git 管理外のフォルダの notes
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す一時フォルダの `settings.yaml`。`sources` に 2 行'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as dev-docs serve
        participant CF as 端末の設定・配信元の設定

        U->>T: dev-docs serve
        T-->>CF: 端末の設定を読み、スキーマで検証する
        loop sources の各行
          T-->>CF: config を上から順に読んでマージする
          T->>T: スキーマとスクリプトを検証し、配信元に加える
        end
        T->>T: 127.0.0.1 で待ち受ける
        T-->>U: 待ち受けたアドレスと配信元を標準出力に出す
      ```
    expected:
      - '`127.0.0.1` で待ち受け、`0.0.0.0` では待ち受けない'
      - '`/_api/sources/sample/docs` と `/_api/sources/notes/docs` が 200 を返す'
      - '`/mcp` のツールが `search_docs`・`write_docs`・`delete_docs`・`describe`・`list_changes`・`trace_related` の 6 つ'
      - '`/_admin/mcp` に MCP のセッションを張れる'
      - 標準出力に待ち受けたアドレスと sample・notes が出る
    test: test_normal
  - name: 正常系（設定の YAML を重ねる）
    summary: '`config` の複数の YAML を上から順にマージする'
    setup:
      - name: Mock
        description: なし
      - name: サンプルの配信元
        description: '`dev-docs.yaml` と `dev-docs.local.yaml` を持つ sample。後の YAML が `description` を上書きし、`documents[]` に `id` が同じ行（`paths` を変える）と新しい行を持つ'
      - name: 端末の設定
        description: sample の `config` が `[dev-docs.yaml, dev-docs.local.yaml]`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as dev-docs serve
        participant CF as 配信元の設定

        U->>T: dev-docs serve
        T-->>CF: dev-docs.yaml と dev-docs.local.yaml を読む
        T->>T: 同じキーを上書きし、documents を id で行ごとに上書き・追加する
        T-->>U: sample を配信する
      ```
    expected:
      - '`describe(source: sample)` の説明が後の YAML の `description` になる'
      - '`id` が同じ `documents[]` の行は後の YAML の `paths` の文書だけを返す'
      - 後の YAML で追加した行の文書を `search_docs` が返す
    test: test_normal_when_configs_merged
  - name: 正常系（設定のバージョンが古い）
    summary: 古いバージョンの設定の配信元も配信し、警告を残す
    setup:
      - name: Mock
        description: なし
      - name: 古い配信元
        description: '`version` がサーバーが読めるバージョンより古く、今のスキーマは満たす配信元'
        notes: id `old`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as dev-docs serve

        U->>T: dev-docs serve
        T->>T: old の設定の version をサーバーが読めるバージョンと比べる
        T-->>U: old を配信し、警告のログを残す
      ```
    expected:
      - '`/_api/sources/old/docs` が 200 を返す'
      - 警告のログに old の id・設定のバージョン・サーバーが読めるバージョンがある
    test: test_normal_when_config_version_old
  - name: 正常系（配信元の検証に失敗する）
    summary: 設定がスキーマに違反する配信元と、スクリプトを実行できない配信元を外して配信する
    setup:
      - name: Mock
        description: なし
      - name: 壊れた配信元
        description: '`documents[]` の必須のキー `paths` が無い配信元'
        notes: id `broken`
      - name: スクリプトの無い配信元
        description: '`converters[]` が無いファイルを指す配信元'
        notes: id `noscript`
      - name: 端末の設定
        description: '`sources` に sample・broken・noscript の 3 行'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as dev-docs serve

        U->>T: dev-docs serve
        T->>T: broken のスキーマと noscript のスクリプトの検証に失敗する
        T->>T: 2 つを配信せず、エラーログに残す
        T-->>U: sample だけを配信する
      ```
    expected:
      - '`/_api/sources/broken/docs` と `/_api/sources/noscript/docs` が 404、`/_api/sources/sample/docs` と `/mcp` は応答する'
      - 'エラーログに `broken: documents[0].paths: 必須のキーが無い` と、noscript の `converters[0]` とスクリプトが見つからない理由がある'
      - '`/_admin/mcp` に MCP のセッションを張れる'
    test: test_normal_when_source_invalid
  - name: 異常系（端末の設定が違反する・TerminalConfigInvalidError）
    summary: 端末の設定がスキーマに違反すると待ち受けずに終わる
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`sources[0]` に必須のキー `config` が無く、`port` が文字列'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as dev-docs serve

        U->>T: dev-docs serve
        T->>T: 端末の設定の検証に失敗する
        T-->>U: 違反を標準エラーに出して終わる
      ```
    expected:
      - 終了コードが 2 で、ポートを待ち受けない
      - '標準エラーに `{ファイル}: sources[0].config` と `{ファイル}: port` の違反が両方並ぶ'
      - '`DEV_DOCS_CONFIG` が無いファイルを指すときも、そのパスを出して終了コード 2 で終わる'
    test: test_error_when_terminal_config_invalid
  - name: 異常系（ポートが使用中・PortInUseError）
    summary: ポートで待ち受けられないと終わる
    setup:
      - name: Mock
        description: なし
      - name: 使用中のポート
        description: テストが先に待ち受けたポートを `DEV_DOCS_PORT` に入れる
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as dev-docs serve

        U->>T: dev-docs serve
        T->>T: ポートで待ち受けられない
        T-->>U: ポートと DEV_DOCS_PORT を標準エラーに出して終わる
      ```
    expected:
      - 終了コードが 3
      - 標準エラーに使用中のポートの番号と、`DEV_DOCS_PORT` で変えられることが出る
    test: test_error_when_port_in_use
  - name: 正常系（メタデータと管理用の YAML がずれている）
    summary: '`metadata` に書いた列の欠けと管理用の YAML のずれがあっても配信し、件数を警告のログに残す'
    setup:
      - name: Mock
        description: なし
        notes: '-'
      - name: 列の欠けた文書
        description: 'sample の行 `rules` が `metadata: {name: title}` を持ち、2 件のうち 1 件に `title` が無い'
        notes: '`metadata` に書いていないキー（同じ名前の列）の欠けは数えない'
      - name: ずれた管理用の YAML
        description: 'sample の `src/files.yaml` が `a.py` と `c.py` の 2 行を持ち、`src/` には `a.py` と `d.py`、`src/sub/e.py` を置く。行 `src` は `records: files`・`body_file: path`'
        notes: '`c.py` はファイルが無い行、`d.py` と `sub/e.py` は索引に無いファイル'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as dev-docs serve
        participant ST as 配信元の文書

        U->>T: dev-docs serve
        T-->>ST: 文書を読む
        T->>T: 配信元を渡して件数を求める
        T-->>U: sample を配信し、件数を警告のログに残す
      ```
    expected:
      - '`/_api/sources/sample/docs` が 200 を返す'
      - 警告のログに sample の行 `rules` の `metadata` の列の欠け 1 件（`name` の `title`）がある
      - 警告のログに行 `src` の索引に無いファイル 2 件（`src/d.py`・`src/sub/e.py`）とファイルが無い行 1 件（`c.py`）があり、`src/files.yaml` 自身は数えない
      - ずれが無い配信元では件数の警告を残さない
    test: test_normal_when_metadata_out_of_sync
  - name: 正常系（前の形式の配信元）
    summary: 前の形式のキーを持つ配信元を外して配信し、違反と移し替えの案内をエラーログに残す
    setup:
      - name: Mock
        description: なし
        notes: '-'
      - name: 前の形式の配信元
        description: '`version: "1"` で、最上位にタグのマスター `tags: tags.yaml`、`documents[0]` が `paths`・`schema`・`type: markdown`、`documents[1]` が `paths`・`schema`・`type: yaml`・`metadata: {name: {type: ref, field: title}}`・`defaults: [{paths: [docs/**], tags: [doc]}]` を持つ配信元'
        notes: id `legacy`。`tags.yaml` を置く
      - name: 端末の設定
        description: '`sources` に sample と legacy の 2 行'
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as dev-docs serve

        U->>T: dev-docs serve
        T->>T: legacy の設定が tags・type・defaults・オブジェクトの metadata で検証に失敗する
        T->>T: legacy を配信せず、違反と移し替えの案内をエラーログに残す
        T-->>U: sample だけを配信する
      ```
    expected:
      - '`/_api/sources/legacy/docs` が 404、`/_api/sources/sample/docs` は応答する'
      - 'エラーログに `legacy: tags`・`legacy: documents[0].type`・`legacy: documents[1].type`・`legacy: documents[1].defaults`・`legacy: documents[1].metadata.name` の違反がある'
      - エラーログに、legacy の設定のバージョンが古く `dev-docs migrate --source` で移し替えられることがある
    test: test_normal_when_source_config_legacy
  - name: 正常系（設定とスキーマを default_ref から読む）
    summary: クローン本体が別のブランチを checkout していても、`default_ref` の設定とスキーマで配信元を組み立てる
    setup:
      - name: Mock
        description: なし（`dev-docs serve` を子プロセスで起動する）
      - name: default_ref のブランチ
        description: sample の `develop` に、文書の種類 `kind_a` を加えた `dev-docs.yaml` とそのスキーマを commit する
        notes: '`default_ref` は `develop`。クローン本体は `master` を checkout し、`master` の `dev-docs.yaml` は `kind_a` を持たない'
      - name: 端末の設定
        description: '`sources[].config` が sample のクローン本体の `dev-docs.yaml` を指す'
      - name: ワークツリー
        description: sample の `.claude/worktrees/develop`（`develop` を checkout）
        notes: '`worktrees` は既定（`[./.claude/worktrees/*]`）'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as テスト
        participant S as dev-docs serve
        participant G as sample のリポジトリ

        C->>S: 起動する
        S->>G: ディスクの dev-docs.yaml の default_ref を読む
        S->>G: develop の dev-docs.yaml とスキーマを読む
        S-->>C: 配信を始める
        C->>G: develop に種類 kind_b を commit する
        C->>S: describe(source: sample)
        S->>G: default_ref の commit を確かめ、変わっていれば組み立て直す
        S-->>C: 種類の一覧
      ```
    expected:
      - '起動直後の `describe(source: sample)` の種類の一覧に `kind_a` が載る'
      - '`kind_b` を commit した後の `describe(source: sample)` で、`reload` をしなくても `kind_a`・`kind_b` が載る'
      - '`describe(source: sample)` の `worktrees[]` に `.claude/worktrees/develop` が載る'
      - Git でない配信元はディスクの設定を読む
    test: test_normal_when_config_read_from_default_ref
  - name: 正常系（エイリアスのキーと nav の条件を警告する）
    summary: エイリアスのキーの違反と 0 件に当たる `nav` の条件を警告のログに出し、配信を始める
    setup:
      - name: Mock
        description: なし（`dev-docs serve` を子プロセスで起動する）
      - name: エイリアスのキーの違反
        description: sample の `alias_type` を持つ行の文書 1 件の `aliases` を文字列（配列でない）にする
      - name: 0 件に当たる nav の条件
        description: sample の `nav` に、`auto` の `filter` が `tags が none` のタブ `none` を置く
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as テスト
        participant S as dev-docs serve

        C->>S: 起動する
        S->>S: エイリアスのキーを取り込んだスキーマで検証する
        S->>S: nav の auto の条件に当たる文書を数える
        S-->>C: 警告のログと配信の開始
      ```
    expected:
      - 警告のログに、違反した文書のパスと `aliases` が配列でないことが出る
      - 警告のログに、タブ `none` と条件が出る
      - sample を配信し始める
      - 違反した文書は `search_docs` の `term`・`list_match_words` に載らない
    test: test_normal_when_alias_and_nav_warned
lead: 端末の設定を読み、検証に通った配信元を 1 プロセス・1 ポートで画面の API・`/mcp`・`/_admin/mcp` に配信し始める。
identifier: serve
permissions: なし
idempotent: false
side_effects: '`bind`:`port` で待ち受ける。`log_dir` に検証の失敗と警告のログを書く'
callers:
  - dev/設計書/シナリオ/単一ユースケース/起動する#scenarios[正常シナリオ]
  - dev/設計書/シナリオ/単一ユースケース/起動する#scenarios[正常シナリオ（設定とスキーマを default_ref から読む）]
  - dev/設計書/シナリオ/単一ユースケース/起動する#scenarios[正常シナリオ（エイリアスのキーと nav の条件を検証する）]
exclusivity: 同じポートで待ち受けるプロセスは 1 つだけ（後からの起動はポート使用中で終わる）
request:
  - name: DEV_DOCS_CONFIG
    type: str
    required: false
    default: '`~/.config/dev-docs/settings.yaml`'
    description: 端末の設定のパス
    notes: 環境変数で渡す
  - name: DEV_DOCS_PORT
    type: int
    required: false
    default: 端末の設定の `port`（既定 8781）
    description: 待ち受けのポート。設定の `port` より優先
    notes: 環境変数で渡す
request_example: |-
  ```bash
  DEV_DOCS_CONFIG=/tmp/x/settings.yaml DEV_DOCS_PORT=8781 dev-docs serve
  ```
response:
  - name: 標準出力
    type: str
    description: 待ち受けたアドレスと、配信している配信元の ID
  - name: エラーログ
    type: str
    description: '検証に失敗した配信元ごとに `{id}: {キーのパス}: {理由}`。その配信元の設定の `version` が古いときは、`dev-docs migrate --source` で移し替えられることも出す'
  - name: 警告のログ
    type: str
    description: 設定のバージョンが古い配信元の ID・設定のバージョン・サーバーが読めるバージョン。配信元と documents の行ごとに、`metadata` に書いた列が無い文書の件数・管理用の YAML に無いファイル・ファイルが無い行（`missing_body_file`）が 0 件でなければ、その件数とパス。`alias_type` を持つ行の文書のエイリアスのキーの違反（文書のパスと内容）と、どの文書にも当たらない `nav` の `auto` の条件（タブと条件）
  - name: 終了コード
    type: int
    description: 起動できないとき 0 以外
    notes: 待ち受けた後は停止の合図まで終わらない
exceptions:
  - name: なし（正常終了）
    condition: 待ち受けを始めた（検証に失敗した配信元があっても、その配信元を外して待ち受ける）
  - name: TerminalConfigInvalidError
    condition: 端末の設定が無い・スキーマに違反する
    notes: '標準エラーに `{ファイル}: {キーのパス}: {理由}` を全て出し、終了コード 2 で終わる'
  - name: PortInUseError
    condition: ポートで待ち受けられない
    notes: 標準エラーにポートの番号と `DEV_DOCS_PORT` で変えられることを出し、終了コード 3 で終わる
constraints:
  - item: 待ち受けのアドレス
    constraint: '`127.0.0.1`'
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[待ち受けのアドレス]
  - item: 待ち受けのポート
    constraint: 既定 8781
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[待ち受けのポート]
  - item: 配信する入口
    constraint: '画面の API `/_api/`（そのスキーマ `/_api/openapi.json`）、文書の MCP `/mcp`（ツール 7 つ）、管理の MCP `/_admin/mcp`（ツール 7 つ）、SessionStart のフックが呼ぶ `POST /_admin/session-context`'
  - item: 設定のマージ
    constraint: '`sources[].config` を上から順に読み、同じキーは後が優先、`documents[]` は `id` で行ごとに上書き・追加する'
  - item: タイムアウト
    constraint: 制限なし
  - item: 管理用の YAML の同期で比べる範囲
    constraint: 管理用の YAML のフォルダの配下（下のフォルダを含む）のファイルから、管理用の YAML 自身と `SKIP_DIRS` を除いたもの
    notes: 件数は配信元を受け取って求める関数で求め、配信元の状態には持たない。読み直しのときも同じ関数で求め直す
  - item: 設定・スキーマ・スクリプトの読み元
    constraint: Git の配信元は、ディスクの `dev-docs.yaml` から `default_ref` だけを読み、`dev-docs.yaml`・`documents[].schema` のスキーマ・`validators`・`converters`・`generators` のスクリプトを `default_ref` から読む。要求ごとに `default_ref` の commit を確かめ、変わっていれば配信元を組み立て直す。Git でない配信元はディスクの設定を読む
    notes: '`worktree` の引数で作業ツリー・ワークツリーを指して読むときは、そのフォルダの設定とスクリプトを使う'
  - item: ワークツリーの数え方
    constraint: '`worktrees[]` の相対パスは、`git rev-parse --git-common-dir` の親（メインのリポジトリの直下）から数える'
refs:
  - dev/設計書/シナリオ/単一ユースケース/起動する#scenarios[正常シナリオ]
test_file: tests/integration/server/test_serve.py
