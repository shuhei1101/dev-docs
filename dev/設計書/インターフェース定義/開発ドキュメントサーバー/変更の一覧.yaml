title: "変更の一覧"
entry:
  kind: mcp_tool
  value: '`list_changes`'
flows:
  - name: 正常系
    summary: 2 つの commit の間に変わった文書とキー、差分の行を返す
    setup:
      - name: Mock
        description: なし（一時フォルダに配信元を作り、dev-docs のアプリをテストのクライアントで呼ぶ）
      - name: サンプルの配信元
        description: 文書の種類を 1 つ（スキーマと YAML 2 件）と `dev-docs.yaml` を持つ git リポジトリ
        notes: id `sample`
      - name: 変更の commit
        description: 文書 1 の `name` を変えた commit
        notes: 親の commit を `from`、その commit を `to` に渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as list_changes
        participant G as sample の Git の履歴

        C->>T: from: 親の commit, to: 変更の commit, view: summary
        T-->>G: 区間を commit に解決し、両端の文書を読む
        T-->>C: 解決した commit と日時、変わった文書とキー
        C->>T: 同じ区間, view: full
        T-->>C: 差分の行
      ```
    expected:
      - 先頭に解決した 2 つの commit と日時がある
      - 変わった文書が文書 1 だけで、`change` が `modified`、`keys` が `name`
      - '`view: full` が `name` の前後の値を `-`・`+` の行で返す'
    test: test_normal
  - name: 正常系（日時とブランチで区間を指す）
    summary: 日時とブランチ名を commit に解決して比べる
    setup:
      - name: Mock
        description: なし
      - name: 変更の commit
        description: 正常系と同じ。親の commit と変更の commit の間の日時を `from`、変更の commit を先頭に持つブランチ名を `to` に渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as list_changes

        C->>T: from: 日時, to: ブランチ名
        T->>T: 日時をその時点の最後の commit、ブランチを先頭の commit に解決する
        T-->>C: 解決した commit と変わった文書
      ```
    expected:
      - '`range.from` が親の commit、`range.to` が変更の commit になる'
      - 変わった文書が正常系と同じになる
    test: test_normal_when_range_by_date_and_branch
  - name: 正常系（前回読んだ時点から）
    summary: '`from` を省き、この会話で前回読んだ内容と今の内容を比べる'
    setup:
      - name: Mock
        description: なし（`state_dir` は一時フォルダ）
      - name: 読んだ記録
        description: '`session_id: s1` で文書 1 と文書 2 を `view: full` で読んだ後、文書 1 だけを `write_docs` で変えた状態'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as list_changes
        participant SD as state_dir

        C->>T: view: summary, session_id: s1
        T-->>SD: 前回返した内容を読む
        T->>T: 今の内容と比べる
        T-->>C: 読んだ後に変わった文書
      ```
    expected:
      - 文書 1 だけを、変わったキーつきで返す
      - 文書 2 は返さない
      - Git 管理外の配信元でも同じように比べられる
    test: test_normal_when_since_last_read
  - name: 異常系（無いリビジョン・RefNotFoundError）
    summary: 解決できない区間を断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`from: no-such-branch`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as list_changes

        C->>T: from: no-such-branch
        T-->>C: isError（解決できなかった引数と値）
      ```
    expected:
      - '`isError: true` で、`from` の `no-such-branch` を解決できなかったことを返す'
      - 差分を返さない
    test: test_error_when_ref_not_found
  - name: 異常系（前回読んだ記録が無い・LastReadNotFoundError）
    summary: 読んだ記録の無い会話で `from` を省くと断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`session_id: s2`（何も読んでいない会話）で `from` を省く'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as list_changes

        C->>T: view: summary, session_id: s2
        T-->>C: isError（前回読んだ時点が無い、from を渡すこと）
      ```
    expected:
      - '`isError: true` で、この会話で読んだ記録が無いことと `from` を渡すことを返す'
    test: test_error_when_last_read_not_found
  - name: 異常系（引数の誤り・InvalidArgumentError）
    summary: Git 管理外の配信元への区間の指定と、`from` の無い `to` を断る
    setup:
      - name: Mock
        description: なし
      - name: 読み取りだけの配信元
        description: Git 管理外のフォルダ。`scope.read` は sample のフォルダ
        notes: id `notes`
      - name: 入力
        description: '1 回目は `source: notes, from: HEAD~1`、2 回目は `to` だけ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as list_changes

        C->>T: source: notes, from: HEAD~1
        T-->>C: isError（Git 管理外の配信元には区間を指せない）
      ```
    expected:
      - '1 回目が `isError: true` で、notes は Git 管理外で `from`・`to` を使えないことを返す'
      - '2 回目が `isError: true` で、`to` には `from` が要ることを返す'
    test: test_error_when_invalid_argument
  - name: 異常系（読めない配信元・SourceNotReadableError）
    summary: '`scope` に当たらない配信元の変更を返さない'
    setup:
      - name: Mock
        description: なし
      - name: 読めない配信元
        description: '`scope.read` が other のフォルダだけの配信元'
        notes: id `other`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as list_changes

        C->>T: source: other, from: HEAD~1
        T-->>C: isError（読めない配信元と、使える配信元の一覧）
      ```
    expected:
      - '`isError: true` で、other を読めないことと使える配信元の一覧を返す'
      - '`source: *` は other を対象に含めない'
    test: test_error_when_source_not_readable
lead: 区間（commit・日時・ブランチ・タグ）か、この会話で前回読んだ時点から今までに変わった文書・変わったキー・差分の行を返す。
identifier: list_changes
permissions: 対象の配信元の `scope.read` か `scope.write` に `cwd` が当たること
idempotent: true
side_effects: なし
callers:
  - dev/設計書/シナリオ/単一ユースケース/変更をレビューする#scenarios[正常シナリオ]
exclusivity: '読み取りだけで排他しない（`readOnlyHint: true`）'
request:
  - name: source
    type: str | list[str]
    required: false
    default: なし（作業中の配信元）
    location: argument
    description: 配信元の ID
    notes: 配列か `*`（読める全配信元）も受ける
  - name: worktree
    type: str
    required: false
    default: なし（`cwd` がワークツリーの中ならそのワークツリー）
    location: argument
    description: '`to` を省いたときに今の内容を読むワークツリーのパス'
  - name: from
    type: str
    required: false
    default: なし（この会話で前回読んだ時点）
    location: argument
    description: 区間の始点（commit・日時・ブランチ・タグ）
    constraints: Git 管理外の配信元では渡せない
    notes: 日時はその時点の最後の commit に解決する
  - name: to
    type: str
    required: false
    default: なし（今の作業ツリー）
    location: argument
    description: 区間の終点
    constraints: '`from` を渡したときだけ'
  - name: filter
    type: Group | Condition
    required: false
    default: なし（全件）
    location: argument
    description: '`search_docs` と同じ条件で、対象の文書を絞る'
  - name: view
    type: Literal['summary', 'full']
    required: false
    default: '`summary`'
    location: argument
    description: '`summary` は変わった文書と変わったキー、`full` は差分の行まで'
  - name: limit
    type: int
    required: false
    default: '`20`'
    location: argument
    description: 返す文書の数
    constraints: 1〜100
  - name: cursor
    type: str
    required: false
    default: なし
    location: argument
    description: 前回の `next_cursor`
  - name: max_chars
    type: int
    required: false
    default: '`20000`'
    location: argument
    description: 結果全体の文字数の上限
    constraints: 上限 40,000
  - name: format
    type: Literal['markdown', 'json']
    required: false
    default: '`markdown`'
    location: argument
    description: 返す形式
  - name: cwd
    type: str
    required: false
    default: なし（どの `scope` にも当たらない）
    location: argument
    description: 作業場所
    notes: フック（#4）が入れる
  - name: session_id
    type: str
    required: false
    default: なし（前回読んだ時点が無い）
    location: argument
    description: 会話キー
    notes: フックが入れる
  - name: agent_id
    type: str
    required: false
    default: なし（メインの会話）
    location: argument
    description: 会話キー（サブエージェント）
    notes: フックが入れる
request_example: |-
  ```json
  {"source": "sample", "from": "3f2a9c1", "to": "feat/x", "view": "summary"}
  ```
response:
  - name: range.from
    type: '{input: str, commit: str, date: str}'
    description: 始点に渡した値と、解決した commit と日時
    notes: 前回読んだ時点と比べたときは `前回読んだ時点`
  - name: range.to
    type: '{input: str, commit: str, date: str}'
    description: 終点に渡した値と、解決した commit と日時
    notes: 今の作業ツリーのときは `作業ツリー`
  - name: total_count
    type: int
    description: 変わった文書の総件数
  - name: next_cursor
    type: str
    description: 続きがあるときだけ
  - name: items[].id
    type: str
    description: 文書の ID
  - name: items[].change
    type: Literal['added', 'modified', 'deleted']
    description: 変更の種類
  - name: items[].keys
    type: list[str]
    description: 変わったキーのパス
  - name: items[].diff
    type: str
    description: git と同じ `+`・`-` の差分の行
    notes: '`view: full` のときだけ'
response_example: |-
  ```markdown
  sample: 3f2a9c1（2026-10-26 10:00）→ 8b1d4e0（2026-10-26 11:30）・変わった文書 1 件

  | id | 変更 | 変わったキー |
  | --- | --- | --- |
  | doc-1 | modified | name |
  ```
response_notes: '`format: json` では変わったキーと前後の値を返す。'
exceptions:
  - name: なし（正常終了）
    condition: 区間を解決して比べた（変わった文書が 0 件のときも正常終了）
  - name: RefNotFoundError
    condition: '`from`・`to` を commit に解決できない'
    notes: 解決できなかった引数と値を添える
  - name: LastReadNotFoundError
    condition: '`from` を省いたが、この会話で本文を読んだ記録が無い'
    notes: '`from` を渡すことを添える'
  - name: InvalidArgumentError
    condition: Git 管理外の配信元に `from`・`to` を渡した、`from` 無しで `to` を渡した、`filter` に知らない項目を渡した
  - name: SourceNotReadableError
    condition: '`cwd` が配信元の `scope.read`・`scope.write` に当たらない'
constraints:
  - item: 件数
    constraint: '`limit` は最大 100'
  - item: 文字数
    constraint: '`max_chars` は最大 40,000。達したら `truncated` と `next_cursor` を返す'
  - item: 注釈
    constraint: '`readOnlyHint: true`'
  - item: 前回読んだ時点
    constraint: '`search_docs` が `state_dir` に記録した、文書ごとの最後に返した内容と比べる。`/clear`・圧縮の後はフックが記録を捨てる'
  - item: タイムアウト
    constraint: 制限なし
refs:
  - dev/設計書/シナリオ/単一ユースケース/変更をレビューする#scenarios[正常シナリオ]
  - dev/設計書/シナリオ/単一ユースケース/変更をレビューする#scenarios[正常シナリオ（前回読んだ時点から）]
