    expected:
      - '`markdown` の表のセル・「項目 / 値」の表・箇条書きのどこでも、`D-1` が文書 6 のフォルダから `_decisions/D-1` への相対パスを指す `[D-1](…)` になる'
      - '`D-2`・`D-3` はリンクにならず、ID の文字のまま出る'
      - '`decisions` 以外の文字列の並びの出し方は変わらない'
      - '`conversionError` が `null`'
    test: test_normal_when_decision_linked
  - name: 正常系（検討事項の文書を返す）
    summary: '`path` が `_decisions/{ID}` のとき、話し合いの記録のフォルダの検討事項の文書を Markdown で返す'
    setup:
      - name: Mock
        description: なし
        notes: '-'
      - name: 話し合いの記録のフォルダ
        description: 正常系（decisions を検討事項のリンクにする）と同じフォルダと `decisions.folders`
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/docs/{path}
        participant WS as 話し合いの記録のフォルダ

        C->>E: GET /_api/sources/sample/docs/_decisions/D-1
        E-->>WS: tmp/a/.mindstella/docs/D-1.md を読む
        E-->>C: 200（検討事項 D-1）
        C->>E: GET /_api/sources/sample/docs/_decisions/D-2
        E-->>C: 404
      ```
    expected:
      - '`_decisions/D-1` が 200 で、`path` が `_decisions/D-1`、`markdown` が `tmp/a/.mindstella/docs/D-1.md` の本文のまま'
      - '`tabs` は sample の `nav` のタブで、どのサイドバーの項目も選ばれていない'
      - '`updatedAt`・`bodyPath`・`diff` が `null`'
      - '2 つのフォルダにある `_decisions/D-2` と、どこにも無い `_decisions/D-3` は 404 で、`missing` が `doc`'
    test: test_normal_when_decision_document_returned
lead: '#17 の画面が文書を開くときに呼ぶ。配信元の文書を変換した Markdown と、タブ・サイドバー・差分の項目・画面の状態を JSON で返す。`path` を省くと一番左のタブのサイドバーの一番上の文書を返す。'
identifier: get_document
permissions: なし（`127.0.0.1` でだけ待ち受ける）
idempotent: true
side_effects: 'なし。変換の結果は `state_dir` に保存し、文書が変わるまで使い回す（`converters[]` の `cache: false` の行の変換は保存しない）'
exclusivity: 読み取りだけで排他しない。同じ文書・同じバージョンの変換が同時に来たときは 1 回だけ変換する
request:
  - name: source
    type: str
    required: true
    location: path
    description: 配信元の ID
  - name: path
    type: str
    required: false
    default: なし（一番左のタブのサイドバーの一番上の文書）
    location: path
    description: 文書のパス（配信元の直下から、拡張子を落とした形）。画面のパスで当たる文書が無いときは、文書のファイルか本文のファイルのパス（拡張子つき）として引く
  - name: ref
    type: str
    required: false
    default: なし（配信元の `default_ref`。Git 管理外の配信元は今のフォルダ）
    location: query
    description: 開くリビジョン（ブランチ・コミット・タグ）
    constraints: Git 管理外の配信元では持たない
  - name: diff
    type: str
    required: false
    default: なし（変わった項目を返さない）
    location: query
    description: 比べるリビジョン。このリビジョンから変わった項目を返す
    constraints: Git 管理外の配信元では無視する
request_example: |-
  ```text
  GET /_api/sources/sample/docs/docs/doc-1?ref=8b1d4e0&diff=3f2a9c1
  ```
response:
  - name: source
    type: str
    description: 配信元の ID
  - name: ref
    type: str | None
    description: 開いているリビジョン。`ref` を省いたときは `default_ref` の名前
    notes: Git 管理外の配信元は `null`
  - name: path
    type: str
    description: 返した文書のパス
  - name: markdown
    type: str | None
    description: 変換した Markdown（埋め込みのマーカーは表に置き換え済み）
    notes: 変換に失敗したときは `null`
  - name: conversionError
    type: ConversionError | None
    description: 変換に失敗したときの種類・スクリプトのパス・原因。YAML を読めないときはファイルのパスと行と列
    notes: 成功したときは `null`
  - name: tabs[].title
    type: str
    description: タブの名前（`nav` が無いときは種類の名前）
  - name: tabs[].active
    type: bool
    description: 返した文書を含むタブか
  - name: tabs[].items
    type: list[NavItem]
    description: サイドバーの項目（group と page の入れ子）。page は文書のパスを持つ
  - name: github
    type: GitHubTarget | None
    description: '`dev-docs.yaml` に書いた GitHub のリポジトリと起票のラベル'
    notes: 書いていない配信元は `null`
  - name: columns
    type: dict[str, list[str]]
    description: 表ごとの隠す列（表の列の設定の保存で書いたもの）
  - name: tableKeys
    type: list[str]
    description: '`markdown` の表の出る順の表のキー。`columns` を表に当てるときと、表の列の設定の保存の `table` に使う'
    notes: 変換に失敗したときは空
  - name: tabs[].items[].change
    type: Literal['added', 'modified', 'deleted'] | None
    description: page の文書の `diff` のリビジョンからの変化。`deleted` の page は `diff` のリビジョンの `nav` の位置に並べる
    notes: '`diff` を省いたとき・変わっていない page・group は `null`'
  - name: diff
    type: DocumentDiff | None
    description: '`diff` のリビジョンと比べた結果'
    notes: '`diff` を省いたとき・Git 管理外の配信元は `null`'
  - name: diff.base
    type: str
    description: 比べたリビジョン（`diff` の値）
  - name: diff.change
    type: Literal['added', 'modified'] | None
    description: 返した文書の `diff` のリビジョンからの変化
    notes: 変わっていない文書は `null`
  - name: diff.changedItems
    type: list[str]
    description: '`diff` のリビジョンから変わった項目のパス'
    notes: 追加した文書・変わっていない文書は空
  - name: updatedAt
    type: str
    format: date-time
    description: 返した文書のファイルの更新日時。Git の配信元は開いているリビジョンでそのファイルを最後に変えた commit の日時、Git 管理外の配信元はファイルの更新日時
    notes: 文書の画面の文書の情報に出す
  - name: aliases
    type: list[AliasItem]
    description: 配信元の `alias_type` を持つ行の文書のエイリアス。要素は取り込んだエイリアスのスキーマ（alias-inject の「エイリアスの元の行」）の共通の形で、画面が mdmark の `mount`・`render` の引数へ読み替えて渡す
    notes: '`alias_type` を持つ行が無い配信元・変換に失敗したときは空。エイリアスのキーに違反する文書は載せない'
  - name: aliases[].id
    type: str
    description: 用語の文書の ID
  - name: aliases[].name
    type: str
    description: 用語の名前（共通のキー `name`）
  - name: aliases[].aliases
    type: list[str]
    description: 本文で用語に当てる語（取り込んだエイリアスの共通のスキーマの `aliases`）
  - name: aliases[].description
    type: str | None
    description: ツールチップに出す説明（共通のキー `description`）
    notes: 持たない文書は `null`
  - name: aliases[].alias_type
    type: Literal['term', 'doc', 'command', 'url', 'skill', 'tool', 'path', 'env', 'avoid']
    description: 文書の行の引用の種類（取り込んだスキーマの `alias_type` の enum）
    notes: 画面は `term` を用語、`doc` を文書の別名として mdmark へ分けて渡す
  - name: aliases[].avoid
    type: list[str] | None
    description: 用語のやめた言い方（エイリアスのキー `avoid`）
    notes: 持たない文書は `null`。`related`・`command`・`cwd`・`url`・`skill` など他のエイリアスのキーも、取り込んだスキーマの `metadata` のキー名で同じ階層に持ち、値を持たないキーは載せない
  - name: bodyPath
    type: str | None
    description: 本文のファイルのパス（配信元の直下から、拡張子つき）。管理用の YAML の行の文書は `body_file` が指すファイル
    notes: 本文のファイルを持たない文書（ファイル 1 つが 1 文書）は `null`。画面は本文の相対リンクを、これがあればこのパス、無ければ `path` を基準に解決する
response_notes: '本文の描画（mdmark）・リンクの組み立て・コメント・目次の変わった見出しのマーカーは #17 の画面が持つ。目次のマーカーは、`ref` を `diff.base` にして取った `markdown` と見出しごとに比べて付ける。'
status_codes:
  - code: '200'
    condition: 文書を返した（変換に失敗したとき・YAML を読めないときも `conversionError` を入れて 200）
  - code: '404'
    condition: 配信元が無い・配信していない、リビジョンを解決できない、文書が無い
    notes: '`missing`（`source`・`not_served`・`ref`・`doc`）と値、配信していない配信元は `errors[]` に外した理由'
constraints:
  - item: 変換の制限時間
    constraint: '`converters[]` のスクリプトを制限時間で止める'
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[スクリプトの制限時間]
  - item: 認可
    constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[待ち受けのアドレス]
  - item: 読み直し
    constraint: ファイルの更新日時か大きさが変わった文書は、次の要求で読み直す
  - item: operationId
    constraint: '`{tag}-{関数名}`。`path` を含む入口は `view-get_document`、`path` を省く入口は `view-get_document_default`'
  - item: JSON のキー
    constraint: レスポンスのキーは camelCase。パス・クエリのパラメータ名は変えない
  - item: nav の auto の絞り込み
    constraint: '`nav` の `auto` は `document`（種類）に加えて `filter` を持てる。`filter` は `search_docs` の `filter` と同じ書式で、`check_filter` で検証し `match_filter` で当たる文書だけをサイドバーに並べる。`filter` を書かない `auto` はその種類の文書を全て並べる。`document` を省いた `auto` は配信元の全ての行の文書を対象にする'
    notes: '`check_filter` に通らない `filter` はそのタブを空にし、起動と配信元の検査が違反を返す'
  - item: 文書の引き方
    constraint: '`path` を画面のパスで引き、当たらなければ文書のファイルか本文のファイルのパスが `path` と同じ最初の文書を返す'
    notes: 管理の MCP の `try_convert` と同じ引き方。同じ本文のファイルを複数の行が指すときは最初の文書に当たる
  - item: 変換の結果の控え
    constraint: '`converters[]` の行の `cache` が `true`（既定）なら、控えがあればスクリプトを動かさずに返し、無ければ動かして控えを書く。`false` なら控えを読まず書かず、要求のたびにスクリプトを動かす'
    notes: '控えのキーは本文の外のファイルを含まない。本文の外のファイルを読む変換は `cache: false` にする'
  - item: nav の auto のフォルダの束ね
    constraint: "`auto` の `group_by` が `'@folder'` のとき、文書が当たった行の `paths` の glob（複数当たるときは `paths` で先に並ぶ glob）のうちワイルドカードより前のフォルダを起点に、起点からのフォルダごとにフォルダ名の group を作り、入れ子のフォルダは入れ子の group にする。起点の直下の文書は group に入れない。各階層で page（フォルダの `index.yaml` の文書が先頭、残りはページのパスの順）を先に、入れ子の group をフォルダ名の順に後に並べる。管理用の YAML の行（`records`）の文書は束ねず、そのまま並べる。`'@folder'` 以外の `group_by` は今と同じく項目のパスとして読む"
    notes: "`nav` が無い配信元は、種類ごとのタブを `group_by: '@folder'` の `auto` として組み立てる"
  - item: スキーマ駆動の Markdown の表し方
    constraint: '`converters[]` を持たない種類の文書は、図を mdmark の部品（`x-diagram` の flow 系と `state`、Mermaid の文字列の `flowchart` はフロー図、Mermaid の文字列の `sequenceDiagram` はシーケンス図）で、スカラーが並ぶオブジェクトを「項目 / 値」の表で返す。`x-diagram: er` は ER 図の部品にする。mdmark に部品の無い Mermaid の文字列と、変換が読み取れない行を 1 つでも含む Mermaid の文字列は、図ごと `` ```mermaid `` のまま返す。図の元データの表は閉じた表にする。スキーマに `x-hidden: true` を持つ項目と、見出し・リードに使った項目は本文に出さない'
    notes: 表し方は knowledge の規約『表し方の優先順位』に沿う
  - item: データの図のフロー図
    constraint: '`x-diagram` の flow 系（`flowchart`・`dataflow`・`architecture`）は、ノードの `kind` を mdmark のノードの種類にする（`actor`・`external` は `external`、`process`・`system` は `script`、`store` は `data`、`start`・`question`・`action`・`result` は同じ値。`kind` が無いノードは `process`）。ノードの `hint`、辺の `line`（無ければ `flow`）・`tip` を mdmark の定義に入れ、戻る線は `loop` にする。`direction` が無ければ `flowchart` は `TD`、`dataflow`・`architecture` は `LR`。`frame` は、中のノードを余白つきで囲む mdmark の枠にする。`state` は、状態を `action` のノードにし、`start` のノードから `initial` の状態へ、`final` の各状態から `result` のノードへ線を描画する。`全状態` の元・`元の状態` の先の遷移は `representative` の状態との 1 本にし、元と先が同じ遷移は `loop` にする'
    notes: 対応は AI Monitor のインターフェース定義『設計書のMarkdown生成』の「図」の制約と同じ。ノードの `shape` と Mermaid の記法の `line`・`subgraphs` は参照しない（`shape` だけのノードは `script`、5 つの値に無い `line` は `flow` になる）
  - item: ER 図の部品
    constraint: '`x-diagram: er` の実体のうち `columns` を持たない実体は、同じ文書の `tables[]` のうち `title` が実体の `name` に当たるテーブルの `columns` から列（`name`・`type`・主キー・外部キー・NOT NULL）を作る。当たるテーブルが無い実体は列なしにする。関連は `from_column`・`to_column` を両端の列に、`from_cardinality`・`to_cardinality`（`1`・`0..1`・`1..n`・`0..n`）を両端の多重度にする'
    notes: 両端の列のどちらかが実体の列に無い関連と、多重度が 4 つの値に無い関連は、mdmark の図全体が書き方の警告になるため図から除外し、図の元データの表にだけ残す。Mermaid の記法の `cardinality` は参照しない。ER 図の部品は mdmark#298 から
  - item: 本文の id のリンク
    constraint: 'スキーマ駆動の変換で、Markdown の文字列の値のうちコードブロック・行内のコードの外の `[名前](id:{文書の ID})` を、同じ配信元のその文書への相対パスのリンクにする。`[名前](id:{文書の ID}#{項目のパス})` は、項目のパスがリンク先の文書で見出しになる項目（`x-heading` を持つ項目、`x-shape: sections` の要素）を指すとき、その見出しのアンカーを付ける。型 `ref` の値のリンクも同じアンカーを付ける'
    notes: どの文書の ID にも当たらないリンクは書き換えず、警告も出さない。見出しにならない項目を指すリンクはアンカーを付けずに文書を指す。`converters[]` の出力と Markdown の本文の文書は書き換えない
  - item: 手で書いた page と auto の重なり
    constraint: 同じタブの中で、手で書いた `page`（`group` の中を含む）が指す文書を `auto` の結果から除く。手で書いた `group`・`page` の並びは変えない
    notes: '-'
  - item: 検討事項のリンク
    constraint: 'スキーマ駆動の変換で、項目 `decisions` の要素（検討事項の ID）を、配信元の `decisions.folders` のうちちょうど 1 つのフォルダに `.mindstella/docs/{ID}.md` がある ID だけ、文書のフォルダから `_decisions/{ID}` への相対パスのリンクにする。0 個か 2 個以上のフォルダにある ID は ID の文字のまま出す。表のセルは `・` でつなぎ、それ以外は箇条書きにする今の並べ方は変えない'
    notes: '`decisions.folders` を持たない配信元は全ての ID を文字のまま出す。リンクの相対パスは本文の id のリンクと同じく画面が `/{source}@{ref}/_decisions/{ID}` に解決する'
  - item: 検討事項の文書
    constraint: '`path` が `_decisions/{ID}`（`{ID}` は `^[A-Z]+-[0-9]+$`）のとき、`decisions.folders` のうちちょうど 1 つのフォルダにある `.mindstella/docs/{ID}.md` の本文を、変換せずに `markdown` で返す。`ref` は解決するが、検討事項の文書は Git の管理外のためリビジョンによらず今のファイルを読む'
    notes: '当たるフォルダが 0 個か 2 個以上なら 404（`missing`: `doc`）。`diff` は求めず `null` を返す。フォルダの外を指す `{ID}` は形式で弾く'
