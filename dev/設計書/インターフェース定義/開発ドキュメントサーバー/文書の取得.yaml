title: "文書の取得"
entry:
  kind: endpoint
  value: GET `/_api/sources/{source}/docs[/{path}]`
flows:
  - name: 正常系
    summary: 配信元の一番左のタブの一番上の文書と、文書のパスで指した文書を返す
    setup:
      - name: Mock
        description: なし（一時フォルダに配信元を作り、dev-docs のアプリを HTTP のテストのクライアントで呼ぶ）
        notes: '-'
      - name: サンプルの配信元
        description: 文書の種類を 1 つ（スキーマと YAML 2 件）と、`nav` を持つ `dev-docs.yaml` を持つ git リポジトリ
        notes: id `sample`。`nav.tabs[]` は 2 つ（最初のタブに YAML 2 件）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/docs/{path}
        participant ST as 配信元のファイル

        C->>E: GET /_api/sources/sample/docs
        E-->>ST: nav と文書を読む
        E->>E: 一番左のタブの一番上の文書 1 をスキーマ駆動で Markdown にする
        E-->>C: 200（文書 1）
        C->>E: GET /_api/sources/sample/docs/{文書 2 のパス}
        E-->>C: 200（文書 2）
      ```
    expected:
      - '`/_api/sources/sample/docs` が 200 で、`path` が文書 1、`tabs` が `nav` の 2 つのタブで一番左だけが `active`'
      - '`markdown` に、スキーマの `x-heading` の項目が見出し、`x-key` の配列が表になった文書 1 がある'
      - '`conversionError` と `diff` が `null`、`tabs[].items[].change` が全て `null`'
      - '`updatedAt` が文書 1 のファイルを最後に変えた commit の日時'
      - '`/_api/sources/sample/docs/{文書 2 のパス}` が 200 で文書 2 の `markdown` を返す'
    test: test_normal
  - name: 正常系（nav が無い）
    summary: '`nav` が無い配信元は種類ごとにタブを作る'
    setup:
      - name: Mock
        description: なし
        notes: '-'
      - name: nav の無い配信元
        description: 文書の種類を 2 つ持ち、`nav` を持たない配信元
        notes: id `plain`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/docs/{path}

        C->>E: GET /_api/sources/plain/docs
        E->>E: 種類ごとにタブを作る
        E-->>C: 200（1 つ目の種類のタブの一番上の文書）
      ```
    expected:
      - '`tabs` が `documents[]` の 2 つの種類ごとに 1 つずつ並ぶ'
      - 各タブの `items` にその種類の文書だけが並ぶ
    test: test_normal_when_nav_missing
  - name: 正常系（リビジョンを指す）
    summary: '`ref` のリビジョンの文書を返す'
    setup:
      - name: Mock
        description: なし
      - name: 古い commit
        description: sample の文書 1 の `name` を変える前の commit
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/docs/{path}
        participant G as sample の Git の履歴

        C->>E: GET /_api/sources/sample/docs/{文書 1 のパス}?ref={古い commit}
        E-->>G: そのリビジョンを書き出して読む
        E-->>C: 200（古い commit の文書 1）
      ```
    expected:
      - '`markdown` の `name` が古い commit の値になる'
      - '`ref` が古い commit'
      - '`ref` を省くと、`ref` に `default_ref` の名前を返す'
    test: test_normal_when_ref_given
  - name: 正常系（差分を求める）
    summary: '`diff` のリビジョンから変わった項目と、サイドバーの page ごとの変化を返す'
    setup:
      - name: Mock
        description: なし
      - name: 変更の commit
        description: 文書 1 の `name` を変え、文書 3 を削除し、文書 4 を追加した commit とその親の commit
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/docs/{path}
        participant G as sample の Git の履歴

        C->>E: GET /_api/sources/sample/docs/{文書 1 のパス}?ref={変更の commit}&diff={親の commit}
        E-->>G: 両端の文書と nav を読んで変わった項目と page を求める
        E-->>C: 200（diff と change つき）
      ```
    expected:
      - '`diff.base` が親の commit、`diff.change` が `modified`、`diff.changedItems` が `name` だけになる'
      - '`markdown` は変更の commit の文書 1'
      - '`tabs[].items[]` の文書 1 の `change` が `modified`、文書 4 が `added`、変わっていない文書 2 が `null`'
      - '変更の commit に無い文書 3 が、親の commit の `nav` の位置に `change: deleted` で並ぶ'
    test: test_normal_when_diff_given
  - name: 正常系（配信元の変換を使う）
    summary: '`converters[]` のスクリプトの Markdown と、埋め込みのマーカーの表を返す'
    setup:
      - name: Mock
        description: なし
        notes: '-'
      - name: 変換を持つ配信元
        description: '`converters[]` に、標準入力の YAML から決まった見出しの Markdown を出すスクリプトを持ち、種類の 1 つがそれを指す配信元'
        notes: id `custom`
      - name: 埋め込みのマーカー
        description: custom の Markdown の文書。本文に別の YAML を表として入れるマーカーを置く
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/docs/{path}
        participant SC as 配信元のスクリプト

        C->>E: GET /_api/sources/custom/docs/{converters を指す種類の文書}
        E->>SC: 標準入力に YAML を渡す
        SC-->>E: 標準出力の Markdown
        E-->>C: 200
        C->>E: GET /_api/sources/custom/docs/{埋め込みのマーカーを持つ文書}
        E->>E: マーカーを YAML の表の Markdown に置き換える
        E-->>C: 200
      ```
    expected:
      - converters を指す種類の文書の `markdown` に、スクリプトが出した見出しがある
      - 埋め込みのマーカーの場所に指した YAML の表があり、マーカーの文字列は無い
    test: test_normal_when_custom_converter
  - name: 正常系（変換に失敗する）
    summary: 制限時間を超えたスクリプトを止め、`conversionError` に失敗を入れる
    setup:
      - name: Mock
        description: なし
        notes: '-'
      - name: 止まらないスクリプト
        description: custom の `converters[]` のスクリプトを、制限時間より長く待つものに差し替える
        notes: 制限時間はテストで短くしてよい
      - name: 壊れた YAML
        description: sample の文書 1 の YAML を、YAML として読めない内容にする
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/docs/{path}
        participant SC as 配信元のスクリプト

        C->>E: GET /_api/sources/custom/docs/{converters を指す種類の文書}
        E->>SC: 標準入力に YAML を渡す
        E->>SC: 制限時間を超えたので止める
        E-->>C: 200（conversionError つき）
      ```
    expected:
      - '`markdown` が `null` で、`conversionError` に種類・スクリプトのパス・制限時間を超えたことがある'
      - スクリプトのプロセスが残っていない
      - 同じ配信元のスキーマ駆動で変換する文書は 200 で `markdown` を返す
      - 壊れた YAML の文書 1 は、`conversionError` にファイルのパスと読めなかった行と列を入れて 200 を返す
    test: test_normal_when_conversion_failed
  - name: 異常系（無い配信元・リビジョン・文書・404）
    summary: 無いものを指すと 404 で何が無いかを返す
    setup:
      - name: Mock
        description: なし
        notes: '-'
      - name: 検証に失敗する配信元
        description: '`documents[0]` に必須のキー `paths` が無い配信元'
        notes: id `broken`
      - name: 入力
        description: '`/_api/sources/sample/docs/no-such-doc`・`/_api/sources/sample/docs?ref=no-such-branch`・`/_api/sources/broken/docs`・`/_api/sources/unknown/docs`'
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/docs/{path}

        C->>E: GET /_api/sources/sample/docs/no-such-doc
        E-->>C: 404（missing: doc）
        C->>E: GET /_api/sources/broken/docs
        E-->>C: 404（missing: not_served と外した理由）
      ```
    expected:
      - '`/_api/sources/sample/docs/no-such-doc` が 404 で、`missing` が `doc`、値が開こうとしたパス'
      - '`ref=no-such-branch` が 404 で、`missing` が `ref`、値が `no-such-branch`'
      - '`/_api/sources/broken/docs` が 404 で、`missing` が `not_served`、`errors[]` に `documents[0]` に必須のキー `paths` が無いことがある'
      - '`/_api/sources/unknown/docs` が 404 で、`missing` が `source`'
    test: test_error_when_not_found
  - name: 正常系（nav をタグの式で絞る）
    summary: '`auto` の `filter` に当たる文書だけをタブのサイドバーに並べる'
    setup:
      - name: Mock
        description: なし
      - name: nav の auto のタグの式
        description: sample の `nav` に、`auto` の `filter` が `tags が mcp かつ tags が 設計 でない` のタブ `mcp` と、`filter` を書かないタブ `すべて` を置く
        notes: 文書 1 の `tags` は `[mcp]`、文書 2 は `[mcp, 設計]`、文書 3 は `[設計]`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/docs/{path}

        C->>E: GET /_api/sources/sample/docs
        E->>E: auto の filter を check_filter で検証し、match_filter で当たる文書を並べる
        E-->>C: 200（tabs）
      ```
    expected:
      - タブ `mcp` の `items` に文書 1 だけが並ぶ
      - タブ `すべて` の `items` に文書 1〜3 が並ぶ
    test: test_normal_when_nav_filtered_by_tags
  - name: 正常系（エイリアスを返す）
    summary: 配信元の `alias_type` を持つ行の文書のエイリアスを、取り込んだスキーマの形で文書といっしょに返す
    setup:
      - name: Mock
        description: なし
      - name: 用語の種類
        description: 'sample の `alias_type: term` の行の文書「作業範囲」'
        notes: '`aliases` は `[scope, 担当範囲]`、`avoid` は `[担当領域]`、`description` を持つ'
      - name: 文書の別名の種類
        description: 'sample の `alias_type: doc` の行の文書「設定のリファレンス」'
        notes: '`aliases` は `[settings]`、`description` を持ち、`avoid` を持たない'
      - name: エイリアスの無い配信元
        description: '`alias_type` を持つ行が無い配信元 `plain`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/docs/{path}

        C->>E: GET /_api/sources/sample/docs/{文書 1 のパス}
        E->>E: alias_type を持つ行の文書のエイリアスを集める
        E-->>C: 200（markdown と aliases）
        C->>E: GET /_api/sources/plain/docs
        E-->>C: 200（aliases は空）
      ```
    expected:
      - sample の応答の `aliases` に、`alias_type` が `term`・`name` が `作業範囲`・`aliases` が `[scope, 担当範囲]`・`avoid` が `[担当領域]` で `description` を持つ要素がある
      - sample の応答の `aliases` に、`alias_type` が `doc`・`name` が `設定のリファレンス`・`aliases` が `[settings]` で `avoid` が `null` の要素がある
      - plain の応答の `aliases` が空
    test: test_normal_when_aliases_returned
lead: '#17 の画面が文書を開くときに呼ぶ。配信元の文書を変換した Markdown と、タブ・サイドバー・差分の項目・画面の状態を JSON で返す。`path` を省くと一番左のタブのサイドバーの一番上の文書を返す。'
identifier: get_document
permissions: なし（`127.0.0.1` でだけ待ち受ける）
idempotent: true
side_effects: なし。変換の結果は `state_dir` に保存し、文書が変わるまで使い回す
exclusivity: 読み取りだけで排他しない。同じ文書・同じバージョンの変換が同時に来たときは 1 回だけ変換する
request:
  - name: source
    type: str
    required: true
    location: path
    description: 配信元の ID
  - name: path
    type: str
    required: false
    default: なし（一番左のタブのサイドバーの一番上の文書）
    location: path
    description: 文書のパス（配信元の直下から、拡張子を落とした形）
  - name: ref
    type: str
    required: false
    default: なし（配信元の `default_ref`。Git 管理外の配信元は今のフォルダ）
    location: query
    description: 開くリビジョン（ブランチ・コミット・タグ）
    constraints: Git 管理外の配信元では持たない
  - name: diff
    type: str
    required: false
    default: なし（変わった項目を返さない）
    location: query
    description: 比べるリビジョン。このリビジョンから変わった項目を返す
    constraints: Git 管理外の配信元では無視する
request_example: |-
  ```text
  GET /_api/sources/sample/docs/docs/doc-1?ref=8b1d4e0&diff=3f2a9c1
  ```
response:
  - name: source
    type: str
    description: 配信元の ID
  - name: ref
    type: str | None
    description: 開いているリビジョン。`ref` を省いたときは `default_ref` の名前
    notes: Git 管理外の配信元は `null`
  - name: path
    type: str
    description: 返した文書のパス
  - name: markdown
    type: str | None
    description: 変換した Markdown（埋め込みのマーカーは表に置き換え済み）
    notes: 変換に失敗したときは `null`
  - name: conversionError
    type: ConversionError | None
    description: 変換に失敗したときの種類・スクリプトのパス・原因。YAML を読めないときはファイルのパスと行と列
    notes: 成功したときは `null`
  - name: tabs[].title
    type: str
    description: タブの名前（`nav` が無いときは種類の名前）
  - name: tabs[].active
    type: bool
    description: 返した文書を含むタブか
  - name: tabs[].items
    type: list[NavItem]
    description: サイドバーの項目（group と page の入れ子）。page は文書のパスを持つ
  - name: github
    type: GitHubTarget | None
    description: '`dev-docs.yaml` に書いた GitHub のリポジトリと起票のラベル'
    notes: 書いていない配信元は `null`
  - name: columns
    type: dict[str, list[str]]
    description: 表ごとの隠す列（表の列の設定の保存で書いたもの）
  - name: tableKeys
    type: list[str]
    description: '`markdown` の表の出る順の表のキー。`columns` を表に当てるときと、表の列の設定の保存の `table` に使う'
    notes: 変換に失敗したときは空
  - name: tabs[].items[].change
    type: Literal['added', 'modified', 'deleted'] | None
    description: page の文書の `diff` のリビジョンからの変化。`deleted` の page は `diff` のリビジョンの `nav` の位置に並べる
    notes: '`diff` を省いたとき・変わっていない page・group は `null`'
  - name: diff
    type: DocumentDiff | None
    description: '`diff` のリビジョンと比べた結果'
    notes: '`diff` を省いたとき・Git 管理外の配信元は `null`'
  - name: diff.base
    type: str
    description: 比べたリビジョン（`diff` の値）
  - name: diff.change
    type: Literal['added', 'modified'] | None
    description: 返した文書の `diff` のリビジョンからの変化
    notes: 変わっていない文書は `null`
  - name: diff.changedItems
    type: list[str]
    description: '`diff` のリビジョンから変わった項目のパス'
    notes: 追加した文書・変わっていない文書は空
  - name: updatedAt
    type: str
    format: date-time
    description: 返した文書のファイルの更新日時。Git の配信元は開いているリビジョンでそのファイルを最後に変えた commit の日時、Git 管理外の配信元はファイルの更新日時
    notes: 文書の画面の文書の情報に出す
  - name: aliases
    type: list[AliasEntry]
    description: 配信元の `alias_type` を持つ行の文書のエイリアス。要素は取り込んだエイリアスのスキーマ（alias-inject の「エイリアスの元の行」）の共通の形で、画面が mdmark の `mount`・`render` の引数へ読み替えて渡す
    notes: '`alias_type` を持つ行が無い配信元・変換に失敗したときは空。エイリアスのキーに違反する文書は載せない'
  - name: aliases[].id
    type: str
    description: 用語の文書の ID
  - name: aliases[].name
    type: str
    description: 用語の名前（共通のキー `name`）
  - name: aliases[].aliases
    type: list[str]
    description: 本文で用語に当てる語（取り込んだエイリアスの共通のスキーマの `aliases`）
  - name: aliases[].description
    type: str | None
    description: ツールチップに出す説明（共通のキー `description`）
    notes: 持たない文書は `null`
  - name: aliases[].alias_type
    type: Literal['term', 'doc', 'command', 'url', 'skill', 'tool', 'path', 'env', 'avoid']
    description: 文書の行の引用の種類（取り込んだスキーマの `alias_type` の enum）
    notes: 画面は `term` を用語、`doc` を文書の別名として mdmark へ分けて渡す
  - name: aliases[].avoid
    type: list[str] | None
    description: 用語のやめた言い方（エイリアスのキー `avoid`）
    notes: 持たない文書は `null`。`related`・`command`・`cwd`・`url`・`skill` など他のエイリアスのキーも、取り込んだスキーマの `metadata` のキー名で同じ階層に持ち、値を持たないキーは載せない
response_notes: '本文の描画（mdmark）・リンクの組み立て・コメント・目次の変わった見出しのマーカーは #17 の画面が持つ。目次のマーカーは、`ref` を `diff.base` にして取った `markdown` と見出しごとに比べて付ける。'
status_codes:
  - code: '200'
    condition: 文書を返した（変換に失敗したとき・YAML を読めないときも `conversionError` を入れて 200）
  - code: '404'
    condition: 配信元が無い・配信していない、リビジョンを解決できない、文書が無い
    notes: '`missing`（`source`・`not_served`・`ref`・`doc`）と値、配信していない配信元は `errors[]` に外した理由'
constraints:
  - item: 変換の制限時間
    constraint: '`converters[]` のスクリプトを制限時間で止める'
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[スクリプトの制限時間]
  - item: 認可
    constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[待ち受けのアドレス]
  - item: 読み直し
    constraint: ファイルの更新日時か大きさが変わった文書は、次の要求で読み直す
  - item: operationId
    constraint: '`{tag}-{関数名}`。`path` を含む入口は `view-get_document`、`path` を省く入口は `view-get_document_default`'
  - item: JSON のキー
    constraint: レスポンスのキーは camelCase。パス・クエリのパラメータ名は変えない
  - item: nav の auto の絞り込み
    constraint: '`nav` の `auto` は `document`（種類）に加えて `filter` を持てる。`filter` は `search_docs` の `filter` と同じ書式で、`check_filter` で検証し `match_filter` で当たる文書だけをサイドバーに並べる。`filter` を書かない `auto` はその種類の文書を全て並べる。`document` を省いた `auto` は配信元の全ての行の文書を対象にする'
    notes: '`check_filter` に通らない `filter` はそのタブを空にし、起動と配信元の検査が違反を返す'
refs:
  - dev/設計書/シナリオ/単一ユースケース/YAMLを直接編集した#scenarios[異常シナリオ（YAML を壊した）]
test_file: tests/integration/server/test_get_document.py
error_format: RFC 9457 の `application/problem+json`（`type`・`title`・`status`・`detail`）。拡張メンバーは camelCase（`nextSteps`・`missing`・`errors[]` の `{path, reason}`）
