      - name: 話し合いの記録のフォルダ
        description: 'sample のメインのリポジトリの `tmp/a/.mindstella/docs/` に `D-1.md`・`D-2.md`、`tmp/b/.mindstella/docs/` に `D-2.md` を配置し、`dev-docs.yaml` の `decisions.folders` を `[tmp/a, tmp/b]` にする'
        notes: '`D-2` は 2 つのフォルダにある ID、`D-3` はどちらにも無い ID'
      - name: decisions を持つ文書
        description: 'sample の文書 6 の表の行・「項目 / 値」の表の項目・見出しの要素に `decisions: [D-1, D-2, D-3]` を持たせる'
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
