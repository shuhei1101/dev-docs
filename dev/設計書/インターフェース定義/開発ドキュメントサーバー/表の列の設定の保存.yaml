title: "表の列の設定の保存"
entry:
  kind: endpoint
  value: PUT `/_api/sources/{source}/columns`
flows:
  - name: 正常系
    summary: 隠す列を書き、次の文書の取得でその列を返す
    setup:
      - name: Mock
        description: なし（一時フォルダに配信元と `state_dir` を作り、dev-docs のアプリを HTTP のテストのクライアントで呼ぶ）
      - name: サンプルの配信元
        description: 文書 1 の本文に 3 列の表がある sample
      - name: 入力
        description: 画面と同じ `Origin` で、2 列目を `hidden` に入れる
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /_api/sources/{source}/columns
        participant SD as state_dir

        C->>E: table, hidden: 2 列目
        E->>SD: 配信元・表ごとの列の設定を書く
        E-->>C: 200
        C->>E: GET /_api/sources/sample/docs/{文書 1 のパス}（文書の取得）
        E-->>SD: 列の設定を読む
        E-->>C: 200（columns に隠す列）
      ```
    expected:
      - 200 で、書いた `table` と `hidden` を返す
      - '`state_dir` に列の設定のファイルがあり、配信元のフォルダは変わらない'
      - 続けて取得した文書 1 の `columns` に、その表の隠す列として 2 列目がある
      - '`hidden` を空で書くと、次の取得の `columns` からその表のキーが消える（全ての列を出す）'
    test: test_normal
  - name: 異常系（本文の誤り・400）
    summary: 形の合わない本文を断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`hidden` が文字列 `notes`（配列でない）'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /_api/sources/{source}/columns

        C->>E: hidden: "notes"
        E-->>C: 400 problem+json
      ```
    expected:
      - 400 で、`errors[0].path` が `hidden`
      - '`state_dir` に列の設定を書かない'
    test: test_error_when_body_invalid
  - name: 異常系（別のオリジン・403）
    summary: 画面と別のオリジンからの書き込みを断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`Origin: http://127.0.0.1:9999`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /_api/sources/{source}/columns

        C->>E: Origin: 別のオリジン
        E-->>C: 403
      ```
    expected:
      - 403 を返す
      - '`state_dir` に列の設定を書かない'
    test: test_error_when_cross_origin
  - name: 異常系（無い配信元・404）
    summary: 無い配信元の列の設定を書かない
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`/_api/sources/unknown/columns`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /_api/sources/{source}/columns

        C->>E: source: unknown
        E-->>C: 404 problem+json
      ```
    expected:
      - 404 で、`detail` に無いのが配信元 `unknown` であることがある
      - '`state_dir` に列の設定を書かない'
    test: test_error_when_source_not_found
lead: '#17 の画面の表の列の表示が呼ぶ。配信元・表ごとに隠す列を `state_dir` に書き、文書の取得の `columns` で返す。'
identifier: put_columns
permissions: 画面と同じオリジンからの要求だけ
idempotent: true
side_effects: '`state_dir` の列の設定のファイルを書き換える。配信元のフォルダは変えない'
exclusivity: 列の設定のファイルごとの排他ロックの中で読み、書き換える
request:
  - name: source
    type: str
    required: true
    location: path
    description: 配信元の ID
  - name: table
    type: str
    required: true
    location: body
    description: 表のキー（種類と、表にした配列の項目のパス）
    example: '`sample:items`'
  - name: hidden
    type: list[str]
    required: true
    location: body
    description: 隠す列のキー。空なら全ての列を出す
  - name: Origin
    type: str
    required: false
    default: なし（`Sec-Fetch-Site` で判定する）
    location: header
    description: 要求元のオリジン
request_example: |-
  ```json
  {"table": "sample:items", "hidden": ["notes"]}
  ```
response:
  - name: table
    type: str
    description: 書いた表のキー
  - name: hidden
    type: list[str]
    description: 書いた隠す列
response_example: |-
  ```json
  {"table": "sample:items", "hidden": ["notes"]}
  ```
status_codes:
  - code: '200'
    condition: 書いた
  - code: '400'
    condition: '`table` が無い・`hidden` が文字列の配列でない'
  - code: '403'
    condition: 画面と別のオリジンからの要求
  - code: '404'
    condition: 配信元が無い・配信していない
error_format: RFC 9457 の `application/problem+json`。検証の違反は `errors[]` に `{path, reason}` で並べる
constraints:
  - item: オリジンの確認
    constraint: '`Origin` が画面のオリジンと同じか、`Origin` が無く `Sec-Fetch-Site` が `same-origin` のときだけ受ける'
  - item: 認可
    constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）
  - item: タイムアウト
    constraint: 制限なし
test_file: tests/integration/server/test_put_columns.py
