title: "状態の取得"
entry:
  kind: mcp_tool
  value: status
flows:
  - name: 正常系
    summary: 配信中・配信していない配信元の状態を返す
    setup:
      - name: Mock
        description: なし（一時フォルダに配信元を作り、dev-docs のアプリをテストのクライアントで呼ぶ）
      - name: 配信元
        description: 検証に通る sample（管理用の YAML に無いファイル 1 件）と、`documents[0].paths` が無い broken
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as status

        C->>T: 配信元の検査が済むのを待つ
        C->>T: 引数なし
        T->>T: 配信元ごとの状態と、検査の最後の同期の件数を読む
        T-->>C: アドレス・バージョン・配信元の表
      ```
    expected:
      - '`version` が配布のメタデータのバージョンと同じ'
      - sample が `serving`、`sync.unindexed_files` が 1
      - broken が `not_served` で、`errors` に `documents[0].paths` と理由がある
      - '`format: json` では同じ中身を structuredContent と text に入れる'
    test: test_normal
  - name: 正常系（配信元を読み込んでいる）
    summary: 配信元の読み込みを待たずに、読み込み中であることを返す
    setup:
      - name: Mock
        description: 配信元の読み込み（`load_source`）を、テストが合図を出すまで止めるものに差し替える
        notes: 合図は `threading.Event`
      - name: 配信元
        description: sample の 1 行
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as status

        C->>T: format: json
        T-->>C: loading: true・sources: []
        C->>T: 配信元の読み込みの合図を出す
        C->>T: format: json
        T-->>C: loading: false・sample が serving
      ```
    expected:
      - '合図の前の `status` が読み込みを待たずに `loading: true` と空の `sources` を返す'
      - 合図の前の markdown に、読み込み中であることと、読み込みが終わっていない配信元を指す文書の MCP の呼び出しが待たされることが出る
      - '合図の後の `status` が `loading: false` で、sample が `serving`'
    test: test_normal_when_loading
  - name: 正常系（配信元の検査が済んでいない）
    summary: 配信元のファイルをたどらず、検査が済んでいない配信元は同期の件数を持たずに返す
    setup:
      - name: Mock
        description: 配信元の検査（`check_sync`）を、呼んだ回数を数え、テストが合図を出すまで止めるものに差し替える
        notes: 合図は `threading.Event`
      - name: 配信元
        description: 検証に通る sample（管理用の YAML に無いファイル 1 件）の 1 行
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as status

        C->>T: format: json
        T-->>C: sample が serving・sync: null
        C->>T: 配信元の検査の合図を出す
        C->>T: format: json
        T-->>C: sample が serving・sync.unindexed_files: 1
      ```
    expected:
      - '合図の前の `status` が検査を待たずに、sample を `serving`・`sync: null` で返す'
      - 合図の前の markdown の索引の同期の列に、検査中であることが出る
      - '合図の後の `status` の `sync.unindexed_files` が 1'
      - '`status` を 2 回呼んでも、`check_sync` を呼んだ回数は起動の後の検査の 1 回のまま'
    test: test_normal_when_checking
lead: 待ち受けのアドレス・dev-docs のバージョン・端末の設定・配信元ごとの状態を返す。
identifier: status
permissions: なし（`127.0.0.1` でだけ待ち受ける）
idempotent: true
side_effects: なし
callers:
  - dev/設計書/シナリオ/単一ユースケース/dev-docsを更新する#scenarios[正常シナリオ]
exclusivity: '読み取りだけで排他しない（`readOnlyHint: true`）'
request:
  - name: format
    type: Literal['markdown', 'json']
    required: false
    default: '`markdown`'
    location: argument
    description: 返却する形式
request_example: |-
  ```json
  {}
  ```
response:
  - name: address
    type: str
    description: 待ち受けている URL（`http://127.0.0.1:8781/`）
  - name: version
    type: str
    description: 動いている dev-docs のバージョン
  - name: pid
    type: int
    description: サーバーのプロセス ID
  - name: terminal.file
    type: str
    description: 読んだ端末の設定のパス
  - name: terminal.version_state
    type: Literal['current', 'old', 'newer']
    description: 端末の設定の `version` と dev-docs が読めるバージョンの比較
  - name: sources[].id
    type: str
    description: 配信元の ID
  - name: sources[].status
    type: Literal['serving', 'not_served', 'disabled']
    description: '配信中・検証で外した・`enabled: false`'
  - name: sources[].errors[]
    type: str
    description: '配信しない理由（`{キーのパス}: {理由}`）'
    notes: '`not_served` のとき'
  - name: sources[].config_version
    type: str | None
    description: 配信元の設定の `version`
  - name: sources[].version_state
    type: Literal['current', 'old', 'newer'] | None
    description: 配信元の設定のバージョンの比較
  - name: sources[].sync
    type: SyncCounts | None
    description: 索引の同期の件数
    notes: '`serving` で、配信元の検査が済んでいるとき。検査が済んでいなければ `null` で、markdown に検査中であることを出す'
  - name: sources[].sync.missing_refs
    type: int
    description: '`metadata` に書いた列が無い文書の件数'
    notes: '`serving` のとき'
  - name: sources[].sync.unindexed_files
    type: int
    description: 管理用の YAML に無いファイルの件数。除外の条件に当たるファイルは数えない（`check_project` と同じ）
  - name: sources[].sync.missing_body_files
    type: int
    description: ファイルが無い行の件数
  - name: sources[].sync.unresolved_related
    type: int
    description: '`related[].to` が配信元のどの文書の ID にも当たらない関連の件数（`check_project` と同じ）'
  - name: loading
    type: bool
    description: 配信元を読み込んでいる間は `true`。その間は `sources` が空で、markdown に読み込み中であることと、読み込みが終わっていない配信元を指す文書の MCP の呼び出しが待たされることを出す
    notes: '-'
response_example: |-
  ```markdown
  http://127.0.0.1:8781/ dev-docs 0.2.0（pid 4242）
  端末の設定: /home/u/.config/dev-docs/settings.yaml（current）
  | source | 状態 | 設定のバージョン | 索引の同期 |
  | --- | --- | --- | --- |
  | sample | serving | 1（current） | 0 |
  | broken | not_served（documents[0].paths: 必須のキーが無い） | - | - |
  ```
exceptions:
  - name: なし（正常終了）
    condition: 返せた（配信元が 0 件のときも空の一覧）
constraints:
  - item: 注釈
    constraint: '`readOnlyHint: true`'
  - item: 同期の件数
    constraint: 配信元の読み込み・読み直し・`default_ref` の組み立て直しの後と、`write_docs`・`delete_docs` の後に裏で実行する検査の最後の結果を読み、`status` は配信元のファイルをたどらない
    notes: 直接編集したファイルのずれは、次の検査まで件数に出ない。今のファイルで求め直すときは `check_project`
  - item: 配信中の配信元の組
    constraint: 配信元ごとの `default_ref` の commit を確かめず、いま配信中の組の設定を読む（組み立て直さない）
    notes: '`default_ref` が進んだ配信元の設定のバージョンは、その配信元を使う次の要求で組み立て直した後に出る'
  - item: 権限
    constraint: 作業場所で絞らず、全ての配信元を返す
  - item: タイムアウト
    constraint: 制限なし
  - item: 配信元の読み込みの間
    constraint: 配信元の読み込みを待たずに答える（起動の待ち受けまでの順番）
test_file: tests/integration/server/test_get_status.py
