title: "Storybook"
kind: "フレームワーク"
version:
  current: 10.6.4
  latest: 10.6.4
  checked_on: '2026-10-27'
  source: package.json
  pinning: package.json に `10.6.4` を固定
catalogs:
  - name: 設定
    version: 10.6.4
    entries:
      - name: framework
        kind: 設定
        purpose: '`.storybook/main.js` で `@storybook/server-webpack5` を指す'
      - name: parameters.server.url
        kind: 設定
        purpose: '`.storybook/preview.js` で描画の口の URL を指す'
      - name: parameters.server.id
        kind: 設定
        purpose: ストーリーの YAML で描く部品を指す。`{url}/{id}` に args を query で付けて取る
      - name: parameters.server.fetchStoryHtml
        kind: 設定
        purpose: 断片の取り方を差し替え、`response.ok` でない応答をエラーにする
  - name: コマンド
    version: 10.6.4
    entries:
      - name: storybook dev
        kind: コマンド
        purpose: 部品のストーリーを手元で開く
      - name: storybook build
        kind: コマンド
        purpose: ストーリーを静的に書き出す
lead: UI の部品を状態ごとのストーリーとして一覧し、描いて確かめる開発ツール。framework `@storybook/server-webpack5` はストーリーの HTML をサーバーから取って描く。
purl: pkg:npm/%40storybook/server-webpack5
dependency_scope: 開発のみ
adoption: 採用
upstream: storybookjs/storybook
license: MIT
official_url: https://storybook.js.org/
docs_url: https://github.com/storybookjs/storybook/tree/next/code/renderers/server
verification:
  state: 済
  date: '2026-10-27'
  detail: Node 24 で `storybook`・`@storybook/server`・`@storybook/server-webpack5` 10.6.4 を入れ、`parameters.server.id` を持つ YAML のストーリーを `storybook build` し、`fetchStoryHtml` を差し替えた `preview.js` から fastapi と jinja2 の描画の口（`/render/{id}`）へ args を query で渡して、エスケープされた部品の断片が Edge で描かれることを確かめた
selection:
  candidates: 判定フローチャート『Storybookの描画の方式』で R3（server-webpack5 + 描画の口）に当たる。`@storybook/server-webpack5` と `@storybook/html-vite` + loaders を比べた（[案のレビュー](https://github.com/shuhei1101/dev-docs/pull/12#discussion_r4389749135)）。
  decision: 描画の口と YAML のストーリーだけで済み、ai-monitor の `.storybook/` の構成を移せるため。
  consequences: webpack5 一式が開発の依存に入る。
install: |-
  ```bash
  npm install --save-dev --save-exact storybook@10.6.4 @storybook/server@10.6.4 @storybook/server-webpack5@10.6.4
  ```
limitations:
  - item: ビルドツール
    content: server 向けの framework は webpack5 だけで、Vite 版は無い
  - item: 既定の取得
    content: 応答の状態を見ず、4xx・5xx の本文もそのまま描く
  - item: args の型
    content: query の文字列で届くため、真偽値・数値は描画の口で変換する
