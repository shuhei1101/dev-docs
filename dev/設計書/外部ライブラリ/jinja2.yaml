title: "jinja2"
kind: "ライブラリ"
version:
  current: 3.1.6
  latest: 3.1.6
  checked_on: '2026-10-27'
  source: pyproject.toml・uv.lock
  pinning: pyproject.toml に下限 `>=3.1.6`、uv.lock で固定
catalogs:
  - name: API
    version: 3.1.6
    entries:
      - name: Environment
        kind: クラス
        purpose: テンプレートの読み込み・自動エスケープ・未定義の扱いをまとめる
      - name: select_autoescape
        kind: 関数
        purpose: '`.html` のテンプレートで自動エスケープを有効にする'
      - name: StrictUndefined
        kind: クラス
        purpose: テンプレートで未定義の値を使ったときに例外にする
      - name: Template.module
        kind: 関数
        purpose: テンプレートのマクロを Python から引数つきで呼び、部品の断片を描く
lead: Python のテンプレートエンジン。マクロで引数つきの部品を作り、HTML を自動エスケープして組み立てる。
purl: pkg:pypi/jinja2
dependency_scope: 必須
adoption: 採用
upstream: pallets/jinja
license: BSD-3-Clause
official_url: https://jinja.palletsprojects.com/
docs_url: https://jinja.palletsprojects.com/en/stable/api/
verification:
  state: 済
  date: '2026-10-27'
  detail: Python 3.14 で `Environment(autoescape=select_autoescape(["html"]), undefined=StrictUndefined)` からマクロを `get_template(...).module.{マクロ}(**引数)` で呼び、引数の `<b>` がエスケープされた断片になることを確かめた。Storybook（server-webpack5）のストーリーからこの断片を取って描けることも確かめた
selection:
  candidates: jinja2 3.1.6・JinjaX 0.68.0・Mako 1.4.3 を比べた（[案のレビュー](https://github.com/shuhei1101/dev-docs/pull/12#discussion_r4389749135)）。
  decision: 部品 1 つを断片で描く仕組みを Jinja2 だけで作れ、ai-monitor のマクロをそのまま移せるため。下限は sandbox の勧告が直った 3.1.6。
  consequences: マクロの引数は型が付かないため、部品設計の引数と結合テストで守る。
install: |-
  ```bash
  uv add 'jinja2>=3.1.6'
  ```
limitations:
  - item: '`StrictUndefined` での `caller`'
    content: '`{% call %}` で呼ばれていないマクロの中で `{% if caller %}` と調べると例外になる。`caller is defined` で調べる'
