title: "pydantic"
kind: "ライブラリ"
version:
  current: 2.14.1
  latest: 2.14.1
  checked_on: '2026-10-28'
  source: pyproject.toml・uv.lock
  pinning: pyproject.toml に下限 `>=2.14.1`、uv.lock で固定
catalogs:
  - name: API
    version: 2.14.1
    entries:
      - name: BaseModel
        kind: クラス
        purpose: MCP のツールの引数・画面の API の本文を要求のモデルとして検証する
      - name: ConfigDict
        kind: クラス
        purpose: '`extra="forbid"`・`populate_by_name` など要求のモデルの設定'
      - name: Field
        kind: 関数
        purpose: '`from_` の別名 `from`・`schema_path` の別名 `schema` と既定値・範囲を付ける'
      - name: field_validator
        kind: 関数
        purpose: 文字列 1 つで書かれた値を配列にするなどの前処理
      - name: ValidationError
        kind: クラス
        purpose: 要求のモデルの検証の誤り。文書の MCP のツールのエラーの変換が `isError` の結果にする
lead: 型ヒントから値の検証と変換を行う Python のデータ検証ライブラリ。
purl: pkg:pypi/pydantic
dependency_scope: 必須
adoption: 採用
upstream: pydantic/pydantic
license: MIT
official_url: https://docs.pydantic.dev/
docs_url: https://docs.pydantic.dev/latest/api/base_model/
used_in:
  - src/dev_docs/features/
  - src/dev_docs/server/mcp/
verification:
  state: 未確認
  detail: モジュール構成設計で使い方を決めた段階で、まだ動かしていない
install: |-
  ```bash
  uv add 'pydantic>=2.14.1'
  ```
