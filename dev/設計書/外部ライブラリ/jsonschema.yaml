title: "jsonschema"
kind: "ライブラリ"
version:
  current: 4.26.0
  latest: 4.26.0
  checked_on: '2026-10-27'
  source: pyproject.toml・uv.lock
  pinning: pyproject.toml に下限 `>=4.26.0`（mcp の `>=4.20.0` の範囲の中）、uv.lock で固定
catalogs:
  - name: API
    version: 4.26.0
    entries:
      - name: Draft202012Validator
        kind: クラス
        purpose: 文書・端末の設定・`dev-docs.yaml` を Draft 2020-12 で検証する
      - name: Draft202012Validator.iter_errors
        kind: 関数
        purpose: 違反を全て取り、違反したキーのパス（`json_path`）と理由（`message`）を返す
      - name: referencing.Registry
        kind: クラス
        purpose: スキーマを `$id` で登録し、ファイルをまたぐ `$ref` を解決する
      - name: referencing.Resource.from_contents
        kind: 関数
        purpose: '`$schema` から仕様を判定してスキーマを登録できる形にする'
lead: Python の JSON Schema の検証のライブラリ。Draft 2020-12 に対応し、`referencing` でスキーマ間の `$ref` を解決する。
purl: pkg:pypi/jsonschema
dependency_scope: 必須
adoption: 採用
upstream: python-jsonschema/jsonschema
license: MIT
official_url: https://python-jsonschema.readthedocs.io/
docs_url: https://python-jsonschema.readthedocs.io/en/stable/api/
verification:
  state: 済
  date: '2026-10-27'
  detail: Python 3.14 で `$id` を持つ 2 つのスキーマを `referencing.Registry` に載せ、`Draft202012Validator` の `iter_errors` で、ファイルをまたぐ `$ref` の違反と必須のキーの欠けを `json_path`（`$.sources[0].port` など）と `message` の組で取れることを確かめた
selection:
  candidates: jsonschema 4.26.0・jsonschema-rs 0.60.3 を比べた（[案のレビュー](https://github.com/shuhei1101/dev-docs/pull/12#discussion_r4389749135)）。
  decision: mcp の依存として既に入り、ai-monitor と揃えられるため。jsonschema-rs の利点は速度だけで、設定と文書の検証では効きにくい。
  consequences: 型は開発の依存の `types-jsonschema` で補う。
install: |-
  ```bash
  uv add 'jsonschema>=4.26.0'
  uv add --dev types-jsonschema
  ```
limitations:
  - item: '`$schema` の無いスキーマ'
    content: '`Resource.from_contents` が仕様を判定できず例外にする。登録するスキーマに `$schema` を持たせる'
