title: "mdmark"
kind: "CDN の JS"
version:
  current: v0.8.0
  latest: v0.8.0
  checked_on: '2026-10-28'
  source: https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@v0.8.0/dist/index.js
  pinning: GitHub のタグを URL に固定して jsDelivr から読む（画面の `MDMARK_URL`・`MDMARK_CSS_URL`）
catalogs:
  - name: API
    version: v0.8.0
    entries:
      - name: mount
        kind: 関数
        purpose: 要素に Markdown を描く。差分の元を渡すとリビジョン間の差分を強調する
        params:
          - name: element
            type: HTMLElement
            required: true
            description: 描く先
          - name: options.markdown
            type: string
            required: true
            description: 描く Markdown
          - name: options.diffSource.revisions
            type: '() => Promise<{id: string, at: string, label: string}[]>'
            required: false
            description: 比べるリビジョンの一覧
          - name: options.diffSource.content
            type: ({revisionId}) => Promise<string | undefined>
            required: false
            description: リビジョンの Markdown
          - name: options.docId
            type: string
            required: false
            description: 差分の元を持つときの文書の識別子
lead: Markdown 文書の表示（拡張記法・図・差分・部品）を各アプリで共通に使うブラウザのライブラリ。
dependency_scope: 必須
adoption: 採用
upstream: shuhei1101/mdmark
official_url: https://github.com/shuhei1101/mdmark
used_in:
  - src/dev_docs/server/static/doc_view.ts
verification:
  state: 済
  date: '2026-10-28'
  detail: Edge 154 で、jsDelivr の `@v0.8.0/dist/index.js` を `import()` し `dist/index.css` を読んだページで `mount(element, {markdown, docId, diffSource})` を呼び、見出し・表が描かれ、`変更を見る` で 2 つのリビジョンの差分（削除した行・追加した行）が出ることを確かめた
install: |-
  ```html
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@v0.8.0/dist/index.css">
  <script type="module">
    const mdmark = await import("https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@v0.8.0/dist/index.js");
  </script>
  ```
