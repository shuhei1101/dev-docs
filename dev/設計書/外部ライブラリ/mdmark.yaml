title: "mdmark"
kind: "CDN の JS"
version:
  current: master
  latest: v0.8.0
  checked_on: '2026-10-31'
  source: https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@master/
  pinning: '固定しない。リリースのたびに `dist/` が入る master ブランチを読み、中身が変わるため integrity を付けない。jsDelivr は `@master` を CDN で 12 時間、ブラウザで 7 日キャッシュする（`cache-control: public, max-age=604800, s-maxage=43200`）。リリースをすぐ届けるときは purge.jsdelivr.net で CDN のキャッシュを削除する'
catalogs:
  - name: API
    version: v0.8.0
    entries:
      - name: mount
        kind: 関数
        purpose: 要素へ Markdown を描き、後片付けの関数を返す
      - name: commentStore.load / save
        kind: コールバック
        purpose: コメントの読み込みと追加
      - name: commentStore.update / remove
        kind: コールバック
        purpose: コメントの修正と削除
        status: planned
        description: '[mdmark#222](https://github.com/shuhei1101/mdmark/issues/222) で入る'
      - name: baseMarkdown
        kind: 引数
        purpose: 比較元の Markdown から変わった箇所を強調する
        status: planned
        description: '[mdmark#222](https://github.com/shuhei1101/mdmark/issues/222) で入る'
      - name: onColumnsChange
        kind: コールバック
        purpose: 表の列の出し入れを知らせる
        status: planned
        description: '[mdmark#222](https://github.com/shuhei1101/mdmark/issues/222) で入る'
      - name: reloadComments / focusComment
        kind: メソッド
        purpose: コメントのマーカーの描き直しとスクロール
        status: planned
        description: '[mdmark#222](https://github.com/shuhei1101/mdmark/issues/222) で入る'
      - name: opts.index
        kind: 引数
        purpose: 索引の `terms`（用語）と `docs`（文書の別名）で本文の語にツールチップを付ける
        description: '`mount` の `opts.index`。形は mdmark の `docs/リファレンス/索引.md`（`terms[]` は `id`・`term`・`meaning` が必須で `aliases`・`avoid` を持てる。`docs[]` は `id`・`path`・`title` が必須で `description`・`aliases` を持てる）。Schema に合わない項目は mdmark が除いて使う。文書の取得の `aliases` を `toMdmarkIndex` で読み替えて渡す'
        status: planned
lead: Markdown を描き、本文の文字列へコメントを付けられるようにするブラウザの JS。
dependency_scope: 必須
adoption: 採用
used_in:
  - frontend/src/features/docs/doc-view/hooks/use-mdmark.ts
upstream: shuhei1101/mdmark
verification:
  state: 済
  date: '2026-10-31'
  detail: '`dev-docs serve` を起動し、Chromium で文書の画面を開いて、jsDelivr の `dist/index.js`（200）を読み込み、`dist/index.css` を置き、見出し・表・コードブロックが本文に描かれ、目次が出ることを確かめた。本文の文字列を選んでコメントを追加すると、`commentStore.save` が呼ばれ、コメントのパネルに見出しつきで並ぶ。`mount` は `commentStore.load({docId})`・`save({docId, comment})` を受け、`update` は Markdown の文字列を受ける。`comments` の機能は既定でオフのため、`config.features.comments` を `true` にして渡す。`v0.8.0` のタグに `dist/mount.js` は無い。'
official_url: https://github.com/shuhei1101/mdmark
