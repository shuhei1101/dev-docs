title: "mdmark"
kind: "CDN の JS"
version:
  current: master
  latest: v0.9.0
  checked_on: '2026-11-01'
  source: https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@master/
  pinning: '固定しない。リリースのたびに `dist/` が入る master ブランチを読み、中身が変わるため integrity を付けない。jsDelivr は `@master` を CDN で 12 時間、ブラウザで 7 日キャッシュする（`cache-control: public, max-age=604800, s-maxage=43200`）。リリースをすぐ届けるときは purge.jsdelivr.net で CDN のキャッシュを削除する'
catalogs:
  - name: API
    version: v0.8.0
    entries:
      - name: mount
        kind: 関数
        purpose: 要素へ Markdown を描き、後片付けの関数を返す
      - name: commentStore.load / save
        kind: コールバック
        purpose: コメントの読み込みと追加
      - name: commentStore.update / remove
        kind: コールバック
        purpose: コメントの修正と削除
        status: planned
        description: '[mdmark#222](https://github.com/shuhei1101/mdmark/issues/222) で入る'
      - name: baseMarkdown
        kind: 引数
        purpose: 比較元の Markdown から変わった箇所を強調する
        status: planned
        description: '[mdmark#222](https://github.com/shuhei1101/mdmark/issues/222) で入る'
      - name: onColumnsChange
        kind: コールバック
        purpose: 表の列の出し入れを知らせる
        status: planned
        description: '[mdmark#222](https://github.com/shuhei1101/mdmark/issues/222) で入る'
      - name: reloadComments / focusComment
        kind: メソッド
        purpose: コメントのマーカーの描き直しとスクロール
        status: planned
        description: '[mdmark#222](https://github.com/shuhei1101/mdmark/issues/222) で入る'
      - name: opts.index
        kind: 引数
        purpose: 索引の `terms`（用語）と `docs`（文書の別名）で本文の語にツールチップを付ける
        description: '`mount` の `opts.index`。形は mdmark の `docs/リファレンス/索引.md`（`terms[]` は `id`・`term`・`meaning` が必須で `aliases`・`avoid` を持てる。`docs[]` は `id`・`path`・`title` が必須で `description`・`aliases` を持てる）。Schema に合わない項目は mdmark が除いて使う。文書の取得の `aliases` を `toMdmarkIndex` で読み替えて渡す'
        status: planned
      - name: '<!-- er -->'
        kind: 記法
        purpose: 'スキーマ駆動の変換の `x-diagram: er` を ER 図の部品で描く'
        status: planned
        description: '[mdmark#298](https://github.com/shuhei1101/mdmark/pull/298) で develop に入り、v0.9.0 の master には無い。定義は `title`・`scope`・`updated`・`width`・`tables[]`（`id`・`name`・`label`・`x`・`y`・`w`・`columns[]` の `name`・`type`・`pk`・`fk`・`nn`・`desc`）・`relations[]`（`from`・`fromColumn`・`fromCard`・`to`・`toColumn`・`toCard`・`label`）。関係の端の列は省けず、無い列を指すと図全体が書き方の警告になる'
  - name: コマンド
    version: develop（mdmark#328 のマージ後）
    entries:
      - name: mdmark check --text
        kind: コマンド
        purpose: Markdown の文字列を、描画時の書き方の警告・知らない印・図の配置のずれで点検する
        status: planned
        description: '[mdmark#328](https://github.com/shuhei1101/mdmark/pull/328) で develop に入り、v0.9.0 の master には無い。npm のレジストリに公開されず、Node 24 以降で動く。設定ファイルを渡さないときは、起動したフォルダから上へ `mdmark.config.yaml` を探し、無ければ既定の設定で点検する'
        params:
          - name: --text
            type: str
            required: true
            description: 点検する Markdown。`-` を渡すと標準入力から読む
          - name: --config
            type: str
            required: false
            default: なし（起動したフォルダから上へ `mdmark.config.yaml` を探す）
            description: 使う設定ファイルのパス
        returns:
          - name: 標準出力
            type: str
            description: 'ずれ 1 つを `-:{行}: {種類}: {内容}` の 1 行で並べ、最後に `ずれ {件数} 件` の行を出す'
            notes: 内容は、何が合わないかと直し方の日本語の 1 文。`diagram_invalid`・`syntax_warning` は描画時の書き方の警告と同じ文
          - name: 終了コード
            type: int
            description: '`0` はずれが 0 件。`1` はずれが 1 件以上'
            notes: 引数の誤りなどで点検しなかったときも `1` で、標準エラーに原因を出し、`ずれ {件数} 件` の行を出さない
lead: Markdown を描き、本文の文字列へコメントを付けられるようにするブラウザの JS。
dependency_scope: 必須
adoption: 採用
used_in:
  - frontend/src/features/docs/doc-view/hooks/use-mdmark.ts
  - src/dev_docs/integrations/mdmark.py
upstream: shuhei1101/mdmark
verification:
  state: 済
  date: '2026-11-01'
  detail: '`dev-docs serve` を起動し、Chromium で文書の画面を開いて、jsDelivr の `dist/index.js`（200）を読み込み、`dist/index.css` を置き、見出し・表・コードブロックが本文に描かれ、目次が出ることを確かめた。本文の文字列を選んでコメントを追加すると、`commentStore.save` が呼ばれ、コメントのパネルに見出しつきで並ぶ。`mount` は `commentStore.load({docId})`・`save({docId, comment})` を受け、`update` は Markdown の文字列を受ける。`comments` の機能は既定でオフのため、`config.features.comments` を `true` にして渡す。`v0.9.0` のタグに `dist/mount.js` は無い。v0.9.0 では、描く先の要素の幅が 48rem 未満のとき `.mdmark-content [id]` に `scroll-margin-block-start: calc(var(--mdmark-sticky-top, 0px) + 3.5rem)` が当たり、`side-toc`（右側の目次）の機能が既定でオンになる。E2E `test_利用者がコメントを渡す.py` の 4 件が v0.9.0 の master で pass する。'
official_url: https://github.com/shuhei1101/mdmark
