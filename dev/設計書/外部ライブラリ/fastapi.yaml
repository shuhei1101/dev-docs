title: "fastapi"
kind: "フレームワーク"
version:
  current: 0.162.0
  latest: 0.162.0
  checked_on: '2026-10-27'
  source: pyproject.toml・uv.lock
  pinning: pyproject.toml に下限、uv.lock で固定
catalogs:
  - name: API
    version: 0.162.0
    entries:
      - name: FastAPI
        kind: クラス
        purpose: 画面・設定の API・MCP をまとめる ASGI アプリ。`lifespan` で MCP のセッション管理を起動する
      - name: FastAPI.mount
        kind: 関数
        purpose: '`/mcp`・`/_admin/mcp` に MCP の ASGI アプリを載せる'
      - name: FastAPI.middleware
        kind: 関数
        purpose: 画面と別のオリジンからの書き込みを断るミドルウェアを登録する
      - name: FastAPI(generate_unique_id_function=...)
        kind: 引数
        purpose: OpenAPI の operationId を `view-{name}`・`settings-{name}` にする（orval が生成する関数の名前になる）
      - name: FileResponse
        kind: クラス
        purpose: 画面のビルドの `index.html` と `assets/` のファイルを `Cache-Control` つきで返す
      - name: FastAPI.exception_handler / StarletteHTTPException
        kind: 関数 / クラス
        purpose: 当たらないパス・メソッドの 404・405 を含め、例外を problem+json にする
lead: Starlette の上に作られた ASGI の Web フレームワーク。引数の型ヒントからリクエストを検証して受け取る。
purl: pkg:pypi/fastapi
dependency_scope: 必須
adoption: 採用
upstream: fastapi/fastapi
license: MIT
official_url: https://fastapi.tiangolo.com/
docs_url: https://fastapi.tiangolo.com/reference/
verification:
  state: 済
  date: '2026-10-27'
  detail: Python 3.14 で fastapi 0.162.0・mcp 2.3.0・uvicorn 0.54.0 を入れ、`FastAPI(lifespan=...)` の lifespan で 2 つの `session_manager.run()` に入り、`app.mount` で `/mcp` と `/_admin/mcp` に MCP を載せ、`HTMLResponse` で Jinja2 のマクロの断片を返すルートと同じポートで動くことを確かめた
selection:
  candidates: fastapi 0.162.0・Starlette 1.10.0・Litestar 2.25.0 を比べた（[案のレビュー](https://github.com/shuhei1101/dev-docs/pull/12#discussion_r4389749135)）。
  decision: ai-monitor の開発ドキュメントサーバーの画面のコードを書き換えずに移せ、設定画面の保存の JSON を Pydantic で受けられるため。starlette・pydantic・anyio・opentelemetry-api は mcp の依存として既に入り、増えるのは fastapi と annotated-doc の 2 件。
  consequences: Origin の検査は組み込みが無く、自前のミドルウェアで行う。
install: |-
  ```bash
  uv add 'fastapi>=0.162.0'
  ```
limitations:
  - item: マウントしたアプリの lifespan
    content: 実行されない。親の `lifespan` で MCP の `session_manager.run()` に入る
