title: "非機能要件"
requirements:
  - name: 実行する Python
    english_name: python_version
    category: 動作環境
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '3.14'
    rationale: '新規のプロジェクトは最新安定版か 1 つ下を使う規約に従い、最新安定版 3.15 の 1 つ下を選んだ。依存する MCP の Python SDK・FastAPI が対応しているかを #3 で確かめる'
    status: planned
  - name: 対応 OS
    english_name: supported_os
    category: 動作環境
    external_constraint: 未確定
    source_kind: 未確定
    value: 未確定
    rationale: 利用者の手元で動かす。管理用プラグインのフックがサーバーを切り離して起動する方法が OS ごとに違うため、#4 の設計で決める
    measurement: 決めた OS の端末で `dev-docs serve` を起動し、画面と MCP につながるかを確かめる
    status: planned
  - name: 対応ブラウザ
    english_name: supported_browser
    category: 動作環境
    external_constraint: 制限なし
    source_kind: 制限なし
    value: PC は Chrome・Edge の最新安定版で全ての操作、スマホは Android の Chrome・iOS の Safari の最新安定版で文書を読む・検索する・コメントを溜めてコピーするまで
    rationale: 'knowledge の規約『対応ブラウザ』の既定（PC は全ての操作、スマホは主な操作まで）に従う。スマホでは設定画面の編集を主な操作に含めない。対応ブラウザの指定は `package.json` の browserslist に置き、Safari 固有の代替の実装は入れない'
    measurement: 決めたブラウザで一覧・本文・差分の画面を開く
    status: planned
  - name: 対応する画面サイズ
    english_name: screen_size
    category: 動作環境
    external_constraint: 制限なし
    source_kind: 制限なし
    value: 幅 360px 以上。幅 48rem（768px）未満はサイドバーをドロワー、コメントのパネルを画面の下から出す面にし、幅 80rem（1280px）未満は目次を出さない
    rationale: 合意したモック（`dev/mock/pages/*/36/default/`）の切り替え幅に合わせる。360px は主なスマホの一番狭い幅
    measurement: 決めた幅で画面を開き、横スクロールが出ないことを確かめる
    status: planned
  - name: 待ち受けのアドレス
    english_name: bind_address
    category: セキュリティ
    external_constraint: 利用者の手元だけで使う（認証を持たない）
    source_kind: ユーザー要望
    source: 設定の資料 A-25（`bind` の既定値）
    value: 127.0.0.1
    rationale: 画面と MCP に認証が無く、書き込みも受けるため、既定では他の端末から届かないアドレスで待ち受ける
    status: planned
  - name: 待ち受けのポート
    english_name: listen_port
    category: 動作環境
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: 設定の資料 A-25（`port`・`DEV_DOCS_PORT` の既定値）
    value: '8781'
    rationale: 画面・文書の MCP・管理の MCP を 1 つのポートで待ち受ける。`.mcp.json` も同じ値を読むため `DEV_DOCS_PORT` で上書きする
    overflow: 使用中のときは起動を止め、ポートと `DEV_DOCS_PORT` で変えられることを出す。確かめる時点は起動時
    status: planned
  - name: スクリプトの制限時間
    english_name: script_timeout
    category: 耐障害
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '30'
    unit: 秒
    rationale: '検査・変換・生成のスクリプトは配信元の利用者が書くため、外部の上限は無い。画面と MCP を待たせすぎず、通常の検査・変換が終わる時間として、設定の資料 A-25 の既定値 30 秒をそのまま採用した。端末の設定の `script_timeout_sec` で変えられる'
    overflow: 制限時間を超えたスクリプトを止め、検査・変換の失敗として返す
    status: planned
    source: 設定の資料 A-25（`script_timeout_sec` の既定値）
  - name: 検索の件数の上限
    english_name: search_limit
    category: 性能
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '100'
    unit: 件
    rationale: エージェントの文脈に載せる量を抑えるため。`search_docs`・`list_changes` の `limit` の上限で、既定は 20
    overflow: 100 を超えた値は 100 に丸め、`notes` で知らせる。黙って切り捨てない
  - name: 結果全体の文字数の上限
    english_name: result_max_chars
    category: 性能
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '40000'
    unit: 文字
    rationale: エージェントの文脈に載せる量を抑えるため。`search_docs`・`list_changes` の `max_chars` の上限で、既定は 20,000
    overflow: 上限を超える手前で打ち切り、`truncated` と、続きを取る `next_cursor` を返す
  - name: 1 回の操作の件数の上限
    english_name: operations_max
    category: 性能
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '50'
    unit: 件
    rationale: 1 回の書き込み・削除で配信元の排他を握る時間と、検査の実行の時間を抑えるため。`write_docs` の `operations`・`delete_docs` の `targets` の件数の上限
    overflow: 50 件を超える要求は `InvalidArgumentError` で断り、何も書かない
  - name: Issue の作成画面の URL の長さ
    english_name: issue_url_length
    category: 動作環境
    external_constraint: GitHub の Issue の作成画面は、長すぎる URL を断る。公式の上限の記載は無い。未ログインの curl（2026-10-30）では、URL 全体 8000 文字は応答、8067 文字・8117 文字は接続が切られ、8267 文字以上は 414
    source_kind: 外部 API の制限
    source: https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/creating-an-issue#creating-an-issue-from-a-url-query
    value: '7200'
    unit: 文字（パーセントエンコード後の URL 全体）
    rationale: 応答があった最長の 8000 文字から 1 割の余裕を取った（[確認ログ](https://github.com/shuhei1101/dev-docs/pull/36#discussion_r4422112042)）。断られるのはリクエストの 1 行目の長さで、クッキーは別のヘッダーの行のため、ログインした状態でも上限は下がらないとして扱う。ログインした状態では測っていない
    overflow: '`body` の末尾を切り詰め、切り詰めたことを書き添える。全文は先にクリップボードへコピーする'
    measurement: 単体テストで、作った URL の長さが決定値以下であることを確かめる。ログインした PC の Chrome で `https://github.com/shuhei1101/dev-docs/issues/new?labels=docs&body=` に続ける `body` の長さを変えて開き、作成画面が出る最長の長さを測れば、この扱いを確かめられる
    status: planned
    refs:
      - dev/設計書/画面設計/文書の画面#elements[Issue を作成]
  - name: mdmark の読み込み元
    english_name: mdmark_source
    category: 保守性
    external_constraint: 'jsDelivr は `@master` を CDN で 12 時間、ブラウザで 7 日キャッシュする（`cache-control: public, max-age=604800, s-maxage=43200`）'
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/dev-docs/issues/15
    value: jsDelivr の mdmark の master ブランチ（`@master` の `dist/index.js`・`dist/index.css`）を読み、タグを固定せず integrity を付けない
    rationale: mdmark のリリースのたびに読み込み先を書き換えずに追従するため。develop はそのたびに `dist/` をビルドする手間がかかるので、リリースのたびに `dist/` が入る master を読む。中身が変わるため integrity は付けられない
    measurement: 文書の画面を開き、`@master` の `dist/index.js`・`dist/index.css` が 200 で読まれることを確かめる
    overflow: リリースはキャッシュが切れるまで届かない。すぐ届けるときは purge.jsdelivr.net で CDN のキャッシュを削除する
    refs:
      - dev/設計書/外部ライブラリ/mdmark#
      - dev/設計書/モジュール構成/画面/features/docs/doc-view/hooks/use-mdmark.ts#constants[MDMARK_URL]
    status: planned
  - name: 起動から接続を受け付けるまでの時間
    english_name: listen_start_time
    category: 可用性
    external_constraint: 再起動のスクリプト（#62）が待ち受けを待つ上限 60 秒
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/dev-docs/issues/65
    value: '20'
    unit: 秒
    rationale: 待ち受けの前に残るのは import と端末の設定・プロンプトの YAML の読み込みだけで、負荷のある端末の計測で約 8 秒。配信元の読み込み（計測で約 95 秒）と検査（約 125 秒）は待ち受けの後に回すため含めない。60 秒に対して計測値の 2 倍強を決定値にする
    measurement: '`dev-docs serve` を子プロセスで起動してから、待ち受けのポートへの TCP の接続が通るまでの時間'
    test_file: tests/nfr/test_listen_start_time.py
    overflow: 超えても起動は止めない。再起動のスクリプトが 60 秒で打ち切る
    breakdown:
      - part: import とプロンプトの YAML の読み込み
        value: 約 8 秒
        notes: 他のプロセスが動いている端末での計測
      - part: 配信元の読み込みと検査
        value: 0 秒
        notes: 待ち受けの後に回す
    tests:
      - name: test_listen_start_time
        summary: 配信元の読み込みが終わらなくても、決定値以内に接続を受け付ける
        condition: 配信元 1 つ。配信元の読み込み（`load_source`）を 60 秒止めるものに差し替えて、`dev-docs serve` を子プロセスで起動する
        measurement: 起動から TCP の接続が通るまでの時間を測る
        expected: 20 秒以内で、配信元の読み込みが終わる前に接続が通る
    status: planned
lead: 外部の制約から逆算した dev-docs の決定値。
