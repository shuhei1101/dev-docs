title: "設定画面"
elements:
  - name: ページのタイトル
    kind: label
    position: head > title
    description: ブラウザのタブに出すタイトル
    label: '`設定 | dev-docs`'
    visible_when: 常時
  - name: 画面名
    kind: link
    position: トップバー
    description: 配信元のトップへの入口
    label: '`dev-docs`'
    visible_when: 常時
    action: クリックで一覧の先頭の配信中の配信元のトップを開く（配信中の配信元が無いときはリンクにしない）
    action_ref: dev/設計書/インターフェース定義/開発ドキュメントサーバー/文書の画面#
  - name: 設定ボタン
    kind: link
    position: トップバー
    description: 設定画面を開く。この画面では現在地（`aria-current="page"`）として出す
    label: 歯車のアイコン
    visible_when: 常時
    action: クリックで設定画面を開き直す
    action_ref: dev/設計書/インターフェース定義/開発ドキュメントサーバー/設定画面の表示#
    notes:
      読み上げ名: '`設定`'
  - name: 明暗の切り替え
    kind: button
    position: トップバー
    description: ライトとダークを切り替える
    label: 半分を塗った円のアイコン
    visible_when: 常時
    action: クリックで明暗を切り替え、ブラウザに保存する（次に開いたときも当てる）
    notes:
      読み上げ名: '`明暗を切り替える`'
  - name: 戻るリンク
    kind: link
    position: 本文の上
    description: 配信元のトップへ戻る
    label: 左向きの矢印のアイコンと `{配信元の ID} のトップへ戻る`
    visible_when: 配信中の配信元があるとき
    source: 設定画面の表示.画面の状態
    action: クリックで一覧の先頭の配信中の配信元のトップを開く
    action_ref: dev/設計書/インターフェース定義/開発ドキュメントサーバー/文書の画面#
  - name: 見出し
    kind: label
    position: 本文
    description: 画面の見出し
    label: '`設定`'
    visible_when: 常時
  - name: 説明
    kind: label
    position: 本文 > 見出しの下
    description: 編集するファイルと保存の挙動
    label: '`端末の設定 {端末の設定のパス} の sources[] です。保存するとスキーマに通してから書き換え、配信元を読み直します。`'
    visible_when: 常時
    source: 設定画面の表示.画面の状態
  - name: 配信元の件数
    kind: label
    position: 本文 > 表の上
    description: 端末の設定の `sources[]` の行数
    label: '`配信元 {件数} 件`'
    type: 数値
    visible_when: 常時
    source: 設定画面の表示.画面の状態
  - name: 配信元を追加ボタン
    kind: button
    position: 本文 > 表の上
    description: 追加のダイアログを開く
    label: プラスのアイコンと `配信元を追加`
    visible_when: 常時
    action: クリックで追加のダイアログを開く
  - name: 配信元の一覧
    kind: table
    position: 本文
    description: 端末の設定の `sources[]` の行と状態
    label: 列は `配信元`・`設定ファイル`・`状態`・`操作`
    visible_when: 常時
    constraints: 端末の設定の `sources[]` の並び順
    source: 設定画面の表示.画面の状態
    notes:
      狭い幅: 表は横にスクロールする領域に入れ、読み上げ名を `配信元の一覧` にする
  - name: 配信元の ID
    kind: link
    position: 配信元の一覧 > 配信元
    description: 配信元の ID。配信中ならトップへのリンクにする
    label: '`{id}`'
    type: 文字列
    visible_when: 常時
    source: 設定画面の表示.画面の状態
    action: 配信中の行だけ、クリックでその配信元のトップを開く（配信していない・無効の行はリンクにせずコードで出す）
    action_ref: dev/設計書/インターフェース定義/開発ドキュメントサーバー/文書の画面#
  - name: 設定ファイル
    kind: label
    position: 配信元の一覧 > 設定ファイル
    description: 配信元の設定の YAML のパス
    label: '`config` のパスを 1 行に 1 つ'
    type: 文字列
    visible_when: 常時
    source: 設定画面の表示.画面の状態
  - name: 状態
    kind: badge
    position: 配信元の一覧 > 状態
    description: 配信元の今の状態
    label: '`配信中`（serving）/ `配信していません`（not_served）/ `無効`（disabled）'
    visible_when: 常時
    source: 設定画面の表示.状態.status
    notes:
      色: 配信中は成功、配信していないは危険、無効は弱めの色。文言でも区別する
  - name: 状態の補足
    kind: label
    position: 配信元の一覧 > 状態 > バッジの下
    description: 状態の理由と注意
    label: Git 管理外の配信元は `Git 管理外`。配信していないときは `起動時の検証で外しました（{path} に {reason}）`。設定のバージョンが古いときは `dev-docs.yaml の version が古い {config} です。このサーバーが読むのは {server} です`。無効のときは `enabled が false です`
    visible_when: Git 管理外・配信していない・設定のバージョンが古い・無効のいずれかのとき
    source: 設定画面の表示.状態.errors・設定画面の表示.状態.config_version
  - name: 編集ボタン
    kind: button
    position: 配信元の一覧 > 操作
    description: その行の編集のダイアログを開く
    label: '`編集`'
    visible_when: 常時
    action: クリックでその行の値を入れた編集のダイアログを開く
    notes:
      読み上げ名: '`{id} を編集`'
  - name: 削除ボタン
    kind: button
    position: 配信元の一覧 > 操作
    description: その行の削除の確認のダイアログを開く
    label: '`削除`（危険の色）'
    visible_when: 常時
    action: クリックで削除の確認のダイアログを開く
    notes:
      読み上げ名: '`{id} を削除`'
  - name: 追加・編集のダイアログのタイトル
    kind: label
    position: 追加・編集のダイアログ
    description: ダイアログの見出し
    label: 追加は `配信元を追加`、編集は `{id} を編集`
    visible_when: 追加・編集のダイアログを開いたとき
  - name: 保存の失敗のまとめ
    kind: alert
    position: 追加・編集のダイアログ > タイトルの下
    description: 保存できなかったときの違反の一覧
    label: '警告のアイコンと `保存できませんでした。{件数} 件の項目がスキーマに合いません。`。続けて違反ごとに `{path}: {reason}` を並べる'
    visible_when: 保存が 422 で返ったとき
    source: 端末の設定の保存.errors
    action: 違反の行のクリックでその入力欄へフォーカスを移す
    notes:
      読み上げ: '`role="alert"` で出たときに読み上げる'
  - name: 配信元の ID の入力欄
    kind: input
    position: 追加・編集のダイアログ
    description: 配信元の ID。追加のときだけ入力でき、編集のときは値だけを出す
    label: '`配信元の ID`'
    type: 文字列
    visible_when: 追加のダイアログのとき（編集のダイアログでは入力欄にせず値を出す）
    required: false
    required_label: '`※任意`'
    pattern: ^[a-z0-9-]+$
    charset: 英小文字・数字・ハイフン。変換はしない
    hint: '`英小文字・数字・ハイフン。画面の URL に使います。空なら配信元の設定の name を使います。`'
    initial_value: 空
    autocomplete: off
    target: 端末の設定の保存.sources[].id（空なら送らない）
  - name: 設定ファイルの入力欄
    kind: textarea
    position: 追加・編集のダイアログ
    description: 配信元の設定の YAML のパス
    label: '`設定ファイル（config）`'
    type: 文字列
    visible_when: 追加・編集のダイアログを開いたとき
    required: true
    required_label: '`※必須`'
    hint: '`1 行に 1 つ。上から順にマージします。`'
    initial_value: 追加は空、編集はその行の `config` を 1 行に 1 つ
    target: 端末の設定の保存.sources[].config（1 行のときは文字列、2 行以上は配列）
  - name: 配信のスイッチ
    kind: switch
    position: 追加・編集のダイアログ
    description: 配信するか
    label: '`配信（enabled）` と `配信する`'
    type: 真偽値
    visible_when: 追加・編集のダイアログを開いたとき
    initial_value: 追加はオン、編集はその行の `enabled`
    target: 端末の設定の保存.sources[].enabled
  - name: 読み取りの範囲の入力欄
    kind: textarea
    position: 追加・編集のダイアログ
    description: この配信元を読める作業場所の glob
    label: '`読み取りの範囲（scope.read）`'
    type: 文字列
    visible_when: 追加・編集のダイアログを開いたとき
    required: false
    required_label: '`※任意`'
    hint: '`1 行に 1 つの glob。空なら、どの作業場所からも読めません。`'
    initial_value: 追加は空、編集はその行の `scope.read` を 1 行に 1 つ
    target: 端末の設定の保存.sources[].scope.read
  - name: 書き込みの範囲の入力欄
    kind: textarea
    position: 追加・編集のダイアログ
    description: この配信元を読み書きできる作業場所の glob
    label: '`書き込みの範囲（scope.write）`'
    type: 文字列
    visible_when: 追加・編集のダイアログを開いたとき
    required: false
    required_label: '`※任意`'
    hint: '`1 行に 1 つの glob。空なら配信元のフォルダの中からだけ書き込めます。`'
    initial_value: 追加は空、編集はその行の `scope.write` を 1 行に 1 つ
    target: 端末の設定の保存.sources[].scope.write（空なら送らない）
  - name: 追加・編集のキャンセル
    kind: button
    position: 追加・編集のダイアログ > フッター
    description: 保存せずに閉じる
    label: '`キャンセル`'
    visible_when: 追加・編集のダイアログを開いたとき
    action: クリックか Esc で入力を捨ててダイアログを閉じる
  - name: 追加・保存ボタン
    kind: button
    position: 追加・編集のダイアログ > フッター
    description: 入力を反映した `sources[]` を保存する
    label: 追加は `追加`、編集は `保存`（プライマリ）
    visible_when: 追加・編集のダイアログを開いたとき
    action: クリックで今の一覧に入力を反映した `sources[]` を丸ごと送信する。200 ならダイアログを閉じて一覧を描き直し、422 ならダイアログを開いたまま保存の失敗のまとめと項目のエラーを出す
    action_ref: dev/設計書/インターフェース定義/開発ドキュメントサーバー/端末の設定の保存#
  - name: 削除のダイアログのタイトル
    kind: label
    position: 削除のダイアログ
    description: 削除の確認の見出し
    label: '`{id} を削除しますか？`'
    visible_when: 削除のダイアログを開いたとき
  - name: 削除の説明
    kind: label
    position: 削除のダイアログ
    description: 削除で起きることと起きないこと
    label: '`端末の設定から {id} の行を削除し、配信を止めます。{配信元のフォルダ} のフォルダと文書は削除しません。`'
    visible_when: 削除のダイアログを開いたとき
  - name: 削除のキャンセル
    kind: button
    position: 削除のダイアログ > フッター
    description: 削除せずに閉じる
    label: '`キャンセル`'
    visible_when: 削除のダイアログを開いたとき
    autofocus: true
    action: クリックか Esc でダイアログを閉じる
  - name: 削除の確定ボタン
    kind: button
    position: 削除のダイアログ > フッター
    description: その行を除いた `sources[]` を保存する
    label: '`削除`（危険の色）'
    visible_when: 削除のダイアログを開いたとき
    action: クリックでその行を除いた `sources[]` を丸ごと送信し、200 ならダイアログを閉じて一覧を描き直す
    action_ref: dev/設計書/インターフェース定義/開発ドキュメントサーバー/端末の設定の保存#
screen: src/dev_docs/server/templates/settings.html
mock: dev/mock/pages/settings/12/default/
lead: '`/_settings/` で、端末の設定の `sources[]` を配信元ごとの状態とともに並べ、追加・編集・削除をダイアログで行う画面。保存は `sources[]` を丸ごと送信し、スキーマに通ったときだけ書き換える。'
input_checks:
  - element: 配信元の ID の入力欄
    violation: 英小文字・数字・ハイフン以外の文字がある
    trigger: 追加ボタンのクリック（保存が 422 で返ったとき）
    message: '`{入力した値} は使えません。英小文字・数字・ハイフンで入力してください。`'
    position: 入力欄の下
  - element: 配信元の ID の入力欄
    violation: 他の行の ID と重なる
    trigger: 追加ボタンのクリック（保存が 422 で返ったとき）
    message: '`{入力した値} は既に使われています。別の ID を入力してください。`'
    position: 入力欄の下
  - element: 設定ファイルの入力欄
    violation: 空の行しか無い
    trigger: 追加・保存ボタンのクリック（保存が 422 で返ったとき）
    message: '`設定ファイルを 1 つ以上入力してください。`'
    position: 入力欄の下
  - element: 読み取りの範囲の入力欄
    violation: 空の行を含む
    trigger: 追加・保存ボタンのクリック（保存が 422 で返ったとき）
    message: '`{行番号} 行目が空です。空の行を削除してください。`'
    position: 入力欄の下
