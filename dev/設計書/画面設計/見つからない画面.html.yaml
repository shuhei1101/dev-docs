title: "見つからない画面"
elements:
  - name: ページのタイトル
    kind: label
    position: head > title
    description: ブラウザのタブに出すタイトル
    label: '`見つかりません | dev-docs`'
    visible_when: 常時
  - name: 画面名
    kind: link
    position: トップバー
    description: 配信元のトップへ戻る入口
    label: '`dev-docs`'
    visible_when: 常時
    action: クリックで開いていた配信元のトップを開く（配信元が無いときは設定画面）
    action_ref: dev/設計書/インターフェース定義/開発ドキュメントサーバー/文書の画面#
  - name: 配信元の切り替え
    kind: button
    position: トップバー
    description: 配信元のメニューを開く
    label: 開いていた配信元の ID（無い配信元のときは `配信元を選ぶ`）
    visible_when: 常時
    action: クリックで配信元のメニューを開く
    notes:
      読み上げ名: '`配信元を切り替える`'
  - name: 配信元のメニュー
    kind: menu
    position: トップバー > 配信元の切り替え
    description: 配信中の配信元と設定画面への入口
    label: 見出し `配信元`。配信中の配信元の ID と補足（`読み書き` / `Git 管理外`）を並べ、末尾に `設定`
    visible_when: 配信元の切り替えを押したとき
    source: 文書の画面.本文
    action: 行のクリックでその配信元のトップを開く（`設定` は設定画面）
    action_ref: dev/設計書/インターフェース定義/開発ドキュメントサーバー/文書の画面#
  - name: リビジョンの切り替え
    kind: button
    position: トップバー
    description: リビジョンのメニューを開く
    label: 開いていたリビジョン（指定が無いときは `作業ツリー`）
    visible_when: 配信元があり、Git で管理している配信元のとき
    action: クリックでリビジョンのメニューを開く
    notes:
      読み上げ名: '`リビジョンを切り替える`'
  - name: リビジョンのメニュー
    kind: menu
    position: トップバー > リビジョンの切り替え
    description: 開けるリビジョンの一覧
    label: 見出し `リビジョン`。先頭に `作業ツリー`（補足 `既定`）、続けてブランチ（補足 `ブランチ`）・タグ（補足 `タグ`）・最近の commit（補足は `MM/DD HH:mm JST` の日時）
    visible_when: リビジョンの切り替えを押したとき
    source: リビジョンの一覧.branches[].name・リビジョンの一覧.tags[].name・リビジョンの一覧.commits[].commit・リビジョンの一覧.commits[].date
    action: 開いたときにリビジョンの一覧を取り、行のクリックでそのリビジョンの配信元のトップを開く
    action_ref: dev/設計書/インターフェース定義/開発ドキュメントサーバー/リビジョンの一覧#
  - name: 検索ボタン
    kind: button
    position: トップバー
    description: 検索のポップオーバーを開く
    label: 虫眼鏡のアイコンと `検索`、キーの表示 `/`
    visible_when: 配信元があるとき
    action: クリックか `/` キーで検索のポップオーバーを開く
    notes:
      読み上げ名: '`検索`'
  - name: 検索欄
    kind: input
    position: トップバー > 検索のポップオーバー
    description: 検索する語
    label: '`{配信元の ID} の文書を検索`'
    type: 文字列
    visible_when: 検索のポップオーバーを開いたとき
    autofocus: true
    constraints: 1〜200 文字
    target: 画面の検索.q
    action: 入力で検索し、件数と結果を描き直す
    action_ref: dev/設計書/インターフェース定義/開発ドキュメントサーバー/画面の検索#
  - name: 検索の件数
    kind: label
    position: トップバー > 検索のポップオーバー
    description: 一致した文書の数
    label: '`{件数} 件`'
    type: 数値
    visible_when: 検索欄に語があるとき
    source: 画面の検索.total_count
  - name: 検索の結果
    kind: list
    position: トップバー > 検索のポップオーバー
    description: 一致した文書と一致した箇所
    label: 文書のパス（`{種類} / {名前}`）と、一致した箇所（語を強調）
    visible_when: 検索欄に語があり、1 件以上一致したとき
    source: 画面の検索.items[].path・画面の検索.items[].name・画面の検索.items[].snippets
    action: クリックでその文書を開く
    action_ref: dev/設計書/インターフェース定義/開発ドキュメントサーバー/文書の画面#
  - name: 設定ボタン
    kind: link
    position: トップバー
    description: 設定画面を開く
    label: 歯車のアイコン
    visible_when: 常時
    action: クリックで設定画面を開く
    action_ref: dev/設計書/インターフェース定義/開発ドキュメントサーバー/設定画面の表示#
    notes:
      読み上げ名: '`設定`'
  - name: 明暗の切り替え
    kind: button
    position: トップバー
    description: ライトとダークを切り替える
    label: 半分を塗った円のアイコン
    visible_when: 常時
    action: クリックで明暗を切り替え、ブラウザに保存する（次に開いたときも当てる）
    notes:
      読み上げ名: '`明暗を切り替える`'
  - name: 見出し
    kind: label
    position: 本文
    description: 画面の見出し
    label: '`見つかりません`'
    visible_when: 常時
  - name: 見つからなかったもの
    kind: section
    component: dev/設計書/部品設計/エラーの囲み.html#
    args:
      - name: label
        value: '`見つからなかったもの`'
      - name: rows
        value: '無い文書: `配信元` と `文書`（`` `{パス}` はありません。``）。無いリビジョン: `配信元` と `リビジョン`（`` `{ref}` を解決できませんでした。ブランチ・タグ・commit のどれにも当たりません。``）。無い配信元: `配信元`（`` `{ID}` は配信していません。``）と、検証で外した配信元だけ `理由`（`` 起動時の検証で外しました（{外した理由}）。``）'
    position: 本文
    description: 見つからなかったものと理由
    visible_when: 常時
    source: 文書の画面.本文
  - name: 次のリンク
    kind: list
    position: 本文 > 見つからなかったものの下
    description: 次に開ける画面へのリンク
    label: '無い文書: `{配信元の ID} のトップ`・`設定`。無いリビジョン: `{配信元の ID} のトップ（作業ツリー）`・`設定`。無い配信元: `設定で配信元を確かめる`'
    visible_when: 常時
    action: クリックでリンク先を開く（配信元のトップは文書の画面、`設定` は設定画面）
    action_ref: dev/設計書/インターフェース定義/開発ドキュメントサーバー/設定画面の表示#
screen: src/dev_docs/server/templates/not_found.html
mock: dev/mock/pages/not-found/12/default/
lead: 無い配信元・リビジョン・文書を開いたときに 404 で返す画面。見つからなかったものと理由を出し、配信元のトップと設定画面へ案内する。
