classes:
  - name: SlashlessMcpPathMiddleware
    title: MCP のパスの補い
    container: server/app.py
    usecase: 起動
    role: ASGI のミドルウェア
    summary: スラッシュ無しの MCP のパスへの要求を、ルーティングの前に末尾にスラッシュを付けたパスへ書き換え、マウントした MCP へ届ける
    description: Starlette のマウントは `/mcp/...` にだけ当たり、`/mcp` は画面の配信のルート（GET だけ）に当たって POST が 405 になる。画面の配信が無くても末尾のスラッシュへの 307 になるため、ルーティングの前でパスを補う
    kind: クラス
    properties:
      - name: app
        title: 次の ASGI アプリ
        type: ASGIApp
        access: 内部 (_)
        description: 書き換えた要求を渡す先
      - name: paths
        title: 補うパス
        type: frozenset[str]
        access: 内部 (_)
        description: 末尾にスラッシュを付けるパス（`DOCS_MCP_PATH`・`ADMIN_MCP_PATH`）
    methods:
      - name: __call__
        title: 要求の受け渡し
        kind: メソッド
        summary: パスが `paths` のどれかと一致する HTTP の要求だけ、末尾にスラッシュを付けて次のアプリへ渡す
        scope: public
        is_async: true
        args:
          - name: scope
            type: Scope
            required: true
            passing: positional
            description: ASGI の scope
          - name: receive
            type: Receive
            required: true
            passing: positional
            description: ASGI の receive
          - name: send
            type: Send
            required: true
            passing: positional
            description: ASGI の send
        returns:
          type: None
          description: なし
        process: |-
          1. `scope["type"]` が `http` で、`scope["path"]` が `paths` のどれかと一致するとき、`path` の末尾に `/`、`raw_path` の末尾に `b"/"` を付けた scope のコピーを作る（受け取った scope は書き換えない）
          2. scope（書き換えたときはそのコピー）と `receive`・`send` を次のアプリへ渡す
        unit_tests:
          - name: test_slashless_mcp_path_middleware
            case: 正常
            summary: スラッシュ無しの MCP のパスにスラッシュを補う
            condition: '`paths=("/mcp", "/_admin/mcp")` で、`type: http` の `path` が `/mcp` と `/_admin/mcp` の scope を渡す'
            mock: 次のアプリ（受け取った scope を控える偽物）
            expected: '次のアプリが受け取った `path` が `/mcp/`・`/_admin/mcp/`、`raw_path` が `b"/mcp/"`・`b"/_admin/mcp/"`。渡した元の scope の `path` は変わらない'
          - name: test_slashless_mcp_path_middleware_when_other_path
            case: 正常
            summary: 他のパスと HTTP でない要求はそのまま渡す
            condition: '`path` が `/mcp/`・`/mcpx`・`/sample/mcp` の HTTP の scope と、`type: lifespan` の scope を渡す'
            mock: 次のアプリ（受け取った scope を控える偽物）
            expected: 次のアプリが受け取った scope が渡した scope そのもの
constants:
  - name: DOCS_MCP_PATH
    title: 文書の MCP のパス
    container: server/app.py
    usecase: 起動
    summary: 文書の MCP をマウントするパス
    value: '"/mcp"'
  - name: ADMIN_MCP_PATH
    title: 管理の MCP のパス
    container: server/app.py
    usecase: 起動
    summary: 管理の MCP をマウントするパス
    value: '"/_admin/mcp"'
functions:
  - name: build_app
    title: アプリの組み立て
    kind: 関数
    container: server/app.py
    usecase: 起動
    role: 合成の起点
    summary: 画面の API・文書の MCP・管理の MCP・セッションの文脈を 1 つの FastAPI のアプリにまとめる
    scope: public
    args:
      - name: handlers
        title: 配線済みの関数
        type: Handlers
        required: true
        passing: positional
        description: 部品の配線の結果
      - name: screen_dir
        title: 画面のビルドの置き場所
        type: Path
        required: false
        default: SCREEN_DIST_DIR
        passing: keyword
        description: 画面の配信が返すビルドのフォルダ。テストで差し替える
    returns:
      type: fastapi.FastAPI
      description: 組み立てたアプリ
    process: |-
      1. 文書の MCP と管理の MCP を組み立てる（文書の MCP の組み立て・管理の MCP の組み立て）
      2. 2 つの MCP と会話の記録を渡して寿命を作り（アプリの寿命）、`FastAPI(lifespan=..., docs_url=None, redoc_url=None, openapi_url="/_api/openapi.json", generate_unique_id_function=route_operation_id)` を作る（操作の識別子）
      3. 例外の変換を登録する（例外の変換の登録）
      4. `DOCS_MCP_PATH` に文書の MCP、`ADMIN_MCP_PATH` に管理の MCP の `streamable_http_app(streamable_http_path="/", stateless_http=True, json_response=True)` をマウントする
      5. `app.add_middleware(SlashlessMcpPathMiddleware, paths=(DOCS_MCP_PATH, ADMIN_MCP_PATH))` で、スラッシュ無しの MCP のパスをルーティングの前に補う（MCP のパスの補い）
      6. 端末の設定の入口・画面の入口・セッションの文脈（セッションの文脈のルーター）のルーターを登録する
      7. 画面の配信のルーター（画面の配信、`screen_dir` を渡す）を最後に登録する（全てのパスに当たるため）
      8. アプリを返す
    unit_tests:
      - name: test_build_app
        case: 正常
        summary: 入口を全て持つ
        condition: 配線済みの関数を渡して `TestClient` で GET `/_api/openapi.json`
        mock: 配線済みの関数（配信元が空の偽物）
        expected: 200 で `paths` に `/_api/sources/{source}/docs`・`/_api/settings/sources` があり、アプリのルートに `/mcp`・`/_admin/mcp` のマウントと `POST /_admin/session-context` がある
      - name: test_build_app_when_openapi
        case: 正常
        summary: OpenAPI の画面を出さない
        condition: '`index.html` を置いた一時フォルダを `screen_dir` に渡し、GET `/docs` と `/_api/openapi.json`'
        mock: 配線済みの関数（偽物）
        expected: '`/docs` は Swagger UI でなく画面の配信が応える（`screen_dir` に置いた `index.html` の中身）、`/_api/openapi.json` の `paths` が全て `/_api/` で始まり、各入口の `operationId` が `{タグ}-{name}`（`view-get_document_default`・`view-get_document`・`view-search_page`・`view-list_refs`・`view-put_columns`・`settings-get_settings_sources`・`settings-put_settings_sources`）で重複が無く、画面の配信のパスを含まない'
      - name: test_build_app_when_screen
        case: 正常
        summary: API と MCP を画面の配信より先に当てる
        condition: '`index.html` を置いた一時フォルダを `screen_dir` に渡し、GET `/default/a.md` と GET `/_api/sources/none/docs`'
        mock: 配線済みの関数（配信元が空の偽物）
        expected: '`/default/a.md` は 200 で `index.html` の中身、`/_api/sources/none/docs` は 404 の problem+json'
      - name: test_build_app_when_mcp_without_slash
        case: 正常
        summary: スラッシュ無しの MCP のパスへの POST を画面の配信でなく MCP が受ける
        condition: '`index.html` を置いた一時フォルダを `screen_dir` に渡し、MCP が受け付けるホストを `base_url` にしてリダイレクトを追従しない `TestClient` で、`/mcp`・`/_admin/mcp` へ MCP の initialize を POST し、GET `/mcpx` を呼ぶ'
        mock: 配線済みの関数（配信元が空の偽物）
        expected: '`/mcp`・`/_admin/mcp` が 200 で本文の `result.serverInfo` を持ち、405・307 にならない。`/mcpx` は 200 で `index.html` の中身'
  - name: route_operation_id
    title: 操作の識別子
    kind: 関数
    container: server/app.py
    usecase: 起動
    role: 入口
    summary: OpenAPI の operationId をルートのタグと名前から作る
    scope: public
    args:
      - name: route
        title: ルート
        type: fastapi.routing.APIRoute
        required: true
        passing: positional
        description: 識別子を作るルート
    returns:
      type: str
      description: '`{route.tags[0]}-{route.name}`（タグが無いときは `route.name`）'
    process: 1. ルートの最初のタグと `name` を `-` で結んで返す。タグが無いときは `name` だけを返す
    unit_tests:
      - name: test_route_operation_id
        case: 正常
        summary: タグと名前を結ぶ
        condition: '`tags=["view"]`・`name="get_document"` のルート'
        mock: なし
        expected: '`view-get_document`'
      - name: test_route_operation_id_when_no_tag
        case: 正常
        summary: タグが無いと名前だけ
        condition: '`tags=[]`・`name="x"` のルート'
        mock: なし
        expected: '`x`'
test_files:
  - tests/unit/dev_docs/server/test_app.py
