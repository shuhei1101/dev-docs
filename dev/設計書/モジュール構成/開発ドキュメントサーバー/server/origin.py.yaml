title: 開発ドキュメントサーバー / 共通 / origin.py
lead: 画面と同じオリジンからの要求かの確認。
constants:
  - name: SAME_ORIGIN
    title: 同じオリジン
    container: server/origin.py
    usecase: 共通
    summary: '`Sec-Fetch-Site` で同じオリジンを表す値'
    value: '"same-origin"'
functions:
  - name: require_same_origin
    title: 同じオリジンの確認
    kind: 関数
    container: server/origin.py
    usecase: 共通
    role: 依存
    summary: 画面と別のオリジンからの書き込みの要求を断る（FastAPI の依存）
    scope: public
    args:
      - name: request
        title: 要求
        type: fastapi.Request
        required: true
        passing: positional
        description: 受けた要求
    returns:
      type: None
      description: 同じオリジンなら何も返さない
    process: |-
      1. `Origin` があれば、要求の `scheme://host:port` と比べ、違えば `CrossOriginError` を送る
      2. `Origin` が無ければ、`Sec-Fetch-Site` が `SAME_ORIGIN` でなければ `CrossOriginError` を送る（どちらも無いときも断る）
    exceptions:
      - name: CrossOriginError
        condition: '`Origin` が画面のオリジンと違う'
        message: '`画面と別のオリジン（{origin}）からの要求は受けません`'
        notes: '`DevDocsError` の子で HTTP 403'
      - name: CrossOriginError
        condition: '`Origin` が無く、`Sec-Fetch-Site` が `same-origin` でない'
        message: '`画面と同じオリジンからの要求か確かめられません`'
    unit_tests:
      - name: test_require_same_origin
        case: 正常
        summary: 同じオリジン
        condition: '`Origin: http://127.0.0.1:8781` を `http://127.0.0.1:8781/_api/...` へ'
        mock: なし（Starlette の Request を組み立てる）
        expected: 送らない
      - name: test_require_same_origin_when_fetch_site
        case: 正常
        summary: '`Origin` が無く `Sec-Fetch-Site` が same-origin'
        condition: '`Sec-Fetch-Site: same-origin` だけ'
        mock: なし
        expected: 送らない
      - name: test_require_same_origin_when_cross_origin
        case: 異常
        summary: 別のオリジン
        condition: '`Origin: http://evil.example`'
        mock: なし
        expected: '`CrossOriginError`'
        exception: '`Origin` が違う'
      - name: test_require_same_origin_when_unknown
        case: 異常
        summary: どちらのヘッダーも無い
        condition: ヘッダーなし
        mock: なし
        expected: '`CrossOriginError`'
        exception: '`Sec-Fetch-Site` が same-origin でない'
test_files:
  - tests/unit/dev_docs/server/test_origin.py
