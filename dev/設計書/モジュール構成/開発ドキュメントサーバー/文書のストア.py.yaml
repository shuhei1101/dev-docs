  - name: check_alias_document
    title: エイリアスのキーの検証
    kind: 関数
    container: features/documents/aliases.py
    usecase: 共通
    role: 検証
    summary: '`alias_type` を持つ行の文書 1 件のエイリアスのキーの値を、取り込んだスキーマのキーと引用の種類の必須で検証する'
    scope: public
    thread_safe: true
    args:
      - name: document
        title: 文書
        type: Document
        required: true
        passing: positional
        description: '`metadata` に `alias_type` を持つ文書'
    returns:
      type: list[Violation]
      description: 違反。`path` はエイリアスのキー、`doc` は文書のパス（配信元の直下から）
    process: |-
      1. 取り込んだエイリアスのスキーマの `$defs.alias.properties.metadata.properties` のキーをエイリアスのキーにする
      2. `ALIAS_REQUIRED_KEYS` の `metadata["alias_type"]` のキーごとに、値が無いか空文字なら `必須のキーが無い` の違反を加える。組（`("url", "port")`）は全て無いときに、組の先頭のキーのパスで `{キー} のどれか 1 つが要ります` の違反を加える
      3. 値を持つエイリアスのキーごとに型を確かめる
         - `ALIAS_LIST_KEYS` は文字列か、空でない文字列の並びでなければ `文字列か文字列の並びではありません`
         - `related` は並びで、要素が文字列か `to` を文字列で持つ辞書でなければ `related の要素は文書の ID か to を持つ辞書です`
         - `port` は整数か文字列でなければ `整数か文字列ではありません`
         - それ以外のキーは文字列でなければ `文字列ではありません`
      4. 違反を返す
    unit_tests:
      - name: test_check_alias_document
        case: 正常
        summary: 通る用語
        condition: '`alias_type: term`・`name: 作業範囲`・`aliases: [scope, 担当範囲]`・`description` あり'
        mock: なし
        expected: 違反が空
      - name: test_check_alias_document_when_aliases_number
        case: 異常
        summary: 別名が数値
        condition: '`alias_type: term`・`aliases: 3`'
        mock: なし
        expected: 違反が 1 件で、`path` が `aliases`、`rule` が `文字列か文字列の並びではありません`、`doc` が文書のパス
      - name: test_check_alias_document_when_required_missing
        case: 異常
        summary: 引用の種類の必須が無い
        condition: '`alias_type: command` で `command` が無い文書と、`alias_type: env` で `url`・`port` が無い文書'
        mock: なし
        expected: 1 つ目は `path` が `command` の `必須のキーが無い`、2 つ目は `path` が `url` の `url・port のどれか 1 つが要ります`
      - name: test_check_alias_document_when_aliases_string
        case: 正常
        summary: 別名が文字列
        condition: '`alias_type: doc`・`aliases: settings`・`description` あり'
        mock: なし
        expected: 違反が空
  - name: collect_aliases
    title: エイリアスの集め
    kind: 関数
    container: features/documents/aliases.py
    usecase: 共通
    role: 変換
    summary: 文書のうち `alias_type` を持つ行の文書を検証し、通った文書のエイリアスと違反を返す
    scope: public
    thread_safe: true
    args:
      - name: source
        title: 配信中の配信元
        type: ServedSource
        required: true
        passing: positional
        description: documents の行の `alias_type` を読む
      - name: documents
        title: 文書
        type: Sequence[Document]
        required: true
        passing: positional
        description: 集めた文書
    returns:
      type: AliasCollection
      description: エイリアスと違反
    process: |-
      1. 有効な documents の行に `alias_type` を持つ行があるかを `has_alias_rows` にする
      2. `metadata` に `alias_type` を持つ文書ごとにエイリアスのキーの検証をする
         - 違反があれば `violations` に加え、エイリアスにしない
         - 違反が無ければ `ALIAS_LIST_KEYS` の文字列を要素 1 つの並びにし、`AliasEntry` にして `entries` に加える（`extra` は取り込んだスキーマの `metadata` のキーのうち `AliasEntry` の項目以外で値を持つもの）
      3. `AliasCollection` を返す
    unit_tests:
      - name: test_collect_aliases
        case: 正常
        summary: 用語と文書の別名と違反
        condition: '`alias_type: term` の行の「作業範囲」（`aliases: [scope, 担当範囲]`・`avoid: [担当領域]`）と「壊れた用語」（`aliases: 3`）、`alias_type: doc` の行の「設定のリファレンス」（`aliases: settings`）、`alias_type` の無い行の文書'
        mock: なし
        expected: '`entries` が 2 件（作業範囲の `avoid` が `[担当領域]`、設定のリファレンスの `aliases` が `[settings]` で `avoid` が `None`）、`violations` が 1 件で `doc` が壊れた用語のパス、`has_alias_rows` が `True`'
      - name: test_collect_aliases_when_no_alias_rows
        case: 正常
        summary: エイリアスの行が無い
        condition: '`alias_type` を持つ行が無い配信元'
        mock: なし
        expected: '`entries`・`violations` が空で、`has_alias_rows` が `False`'
  - name: match_words
    title: 照合する語の一覧
    kind: 関数
    container: features/documents/aliases.py
    usecase: 用語の一覧
    role: 変換
    summary: エイリアスから、照合する語（`name` と `aliases`）を指す文書の ID とともに並べる
    scope: public
    thread_safe: true
    args:
      - name: entries
        title: エイリアス
        type: Sequence[AliasEntry]
        required: true
        passing: positional
        description: エイリアスの集めの `entries`
    returns:
      type: list[MatchWord]
      description: エイリアスの順に、`name`、`aliases` の順で並べた語
    process: |-
      1. エイリアスごとに `name` を `kind: name`、`aliases` の各要素を `kind: alias` の照合する語にする
      2. 並べて返す
    unit_tests:
      - name: test_match_words
        case: 正常
        summary: 名前と別名
        condition: '「作業範囲」（`aliases: [scope, 担当範囲]`）のエイリアス 1 件'
        mock: なし
        expected: '`作業範囲`（`name`）・`scope`（`alias`）・`担当範囲`（`alias`）の順で、`id` がどれも作業範囲の ID'
  - name: term_ids
    title: 用語に当たる文書の ID
    kind: 関数
    container: features/documents/aliases.py
    usecase: 検索
    role: 判定
    summary: '`name` か `aliases` が用語に一致するエイリアスの文書の ID を返す'
    scope: public
    thread_safe: true
    args:
      - name: entries
        title: エイリアス
        type: Sequence[AliasEntry]
        required: true
        passing: positional
        description: エイリアスの集めの `entries`
      - name: term
        title: 用語
        type: str
        required: true
        passing: positional
        description: '`search_docs` の `term`'
    returns:
      type: set[str]
      description: 当たった文書の ID
    process: |-
      1. 用語と各エイリアスの照合する語を、条件の比較と同じ正規化（NFKC と `casefold`）にする
      2. 完全一致する語を持つエイリアスの `id` を集めて返す
    unit_tests:
      - name: test_term_ids
        case: 正常
        summary: 正規化した完全一致
        condition: '「作業範囲」（`aliases: [scope, 担当範囲]`）のエイリアスに、`担当範囲`・`SCOPE`・`担当` を順に渡す'
        mock: なし
        expected: 1 つ目と 2 つ目は作業範囲の ID、3 つ目は空
classes:
  - name: DocumentStore
    title: 文書のストア
    container: features/documents/store.py
    usecase: 共通
    role: キャッシュ
    summary: 読む場所（`Target`）ごとに文書を集め、ファイルごとに結果をキャッシュする
    description: |-
      キャッシュのキーはファイルの絶対パスと文書の行の ID。更新日時（`st_mtime_ns`）と大きさが変わったファイルだけを読み直す。
      リビジョンの書き出しは書き換わらないので、同じ仕組みでそのままキャッシュに当たる。
      配信元の読み直しで文書の行が変わったときは、行の内容がキーに含まれないので、起動の設定の読み直しで `clear` を呼ぶ。
    kind: クラス
    properties:
      - name: snapshots
        title: リビジョンの書き出し
        type: SnapshotStore
        access: 公開
        description: '`ref` のある `Target` を読むときに使う'
      - name: _files
        title: ファイルのキャッシュ
        type: dict[tuple[Path, str], tuple[int, int, list[Document], list[LoadProblem], tuple[tuple[str, int, int], ...]]]
        access: 内部 (_)
        description: (絶対パス, 文書の行の ID) → (更新日時, 大きさ, 文書, 理由, 文書が指す本文のファイルの (パス, 更新日時, 大きさ) のパスの順の並び)
      - name: _schemas
        title: スキーマのキャッシュ
        type: dict[Path, tuple[int, int, dict[str, Any]]]
        access: 内部 (_)
        description: スキーマの絶対パス → (更新日時, 大きさ, 読んだスキーマ)
      - name: _dates
        title: 日時のキャッシュ
        type: dict[tuple[Path, str], dict[str, FileDates]]
        access: 内部 (_)
        description: (作業ツリー, 解いた commit) → 履歴の『ファイルの日時』の結果。commit が変わればキーが変わる
      - name: _lock
        title: 排他
        type: threading.Lock
        access: 内部 (_)
        description: キャッシュの辞書の読み書きを守る（ファイルの読み込みはロックの外で行う）
    methods:
      - name: load
        title: 文書を集める
        summary: 読む場所の文書を、文書の行ごとに集めて返す
        kind: メソッド
        scope: public
        thread_safe: true
        side_effects: キャッシュを更新する。`ref` があればリビジョンを書き出す
        args:
          - name: target
            title: 読む場所
            type: Target
            required: true
            passing: positional
            description: 権限と作業場所の『読む場所の解決』の結果
          - name: kinds
            title: 種類
            type: Sequence[str] | None
            required: false
            default: None
            passing: keyword
            description: 絞る文書の行の ID。`None` は有効な全ての行
        returns:
          type: LoadResult
          description: 集めた文書と読めなかったファイル
        process: |-
          1. 読むフォルダを決める
             - `target.ref` が `None` の場合、`target.base`
             - `target.ref` がある場合、履歴の『リビジョンの解決』（`date_base` は配信元の `default_ref`）で解いた commit を `snapshots.checkout` で書き出し、その下に `source.root` の `repo_root` からの相対パスをつなぐ
          2. 文書の行を決める。`kinds` があれば `source.table` で引き（無い種類は `UnknownKindError`）、無ければ `enabled` の全ての行
          3. Git の配信元の場合、履歴の『ファイルの日時』を `_dates` から引く。無ければ、作業ツリー（ワークツリーか `repo_root`）と commit（`ref` の commit、無ければ作業ツリーの `HEAD` を解いた SHA）で呼び、配信元の直下からのパスに直して控える
          4. 行ごとに『ファイルの収集』でファイルを集め、ファイルごとに `stat` を取る
             - `_files` の更新日時と大きさが同じで、理由に `missing_body_file` が無く、本文のファイルの (パス, 更新日時, 大きさ) も同じなら控えた結果を使う
             - それ以外は『ファイルの読み込み』で読み、`_files` を置き換える
          5. 収集で当たらなかった `_files` のキーのうち、読むフォルダの下にあるものを削除する（削除されたファイル）
          6. 行の順に文書を並べ、先に現れた ID を残して、後に現れた同じ ID の文書を `duplicate_id` にする（`detail` に ID と先の文書のファイル）
          7. `LoadResult` を返す
        exceptions:
          - name: UnknownKindError
            condition: '`kinds` に有効な文書の行に無い種類がある'
            message: 配信元の『文書の行を引く』のまま
          - name: RefNotFoundError
            condition: '`target.ref` を commit に解けない'
            message: 履歴の『リビジョンの解決』のまま
        unit_tests:
          - name: test_document_store_load
            case: 正常
            summary: 行ごとに集める
            condition: '行 `rules`（`rules/*.yaml`）と `notes`（`notes/files.yaml` の `records: files`・`body_file: path` で `.md`）に 2 件ずつ、Git の管理外の配信元'
            mock: なし（`tmp_path`）
            expected: '`rules` の 2 件、`notes` の 2 件の順で、`problems` が空'
            exception: '-'
          - name: test_document_store_load_when_cached
            case: 正常
            summary: 変わったファイルだけ読み直す
            condition: 2 回呼ぶ間に `rules/a.yaml` だけを書き換える
            mock: '`load_file`（本物を包んで呼ばれたパスを記録する）'
            expected: 2 回目に `load_file` が呼ばれたのは `rules/a.yaml` だけで、結果に書き換えた内容が載る
            exception: '-'
          - name: test_document_store_load_when_deleted
            case: 正常
            summary: 削除されたファイル
            condition: 2 回呼ぶ間に `rules/b.yaml` を削除する
            mock: なし（`tmp_path`）
            expected: 2 回目の結果に `rules/b.yaml` の文書が無い
            exception: '-'
          - name: test_document_store_load_when_duplicate_id
            case: 正常
            summary: 重なった ID
            condition: '`rules/a.yaml` と `rules/b.yaml` がどちらも `id: x`'
            mock: なし（`tmp_path`）
            expected: 文書は `rules/a.yaml` の 1 件で、`problems` に `rules/b.yaml` の `duplicate_id`
            exception: '-'
          - name: test_document_store_load_when_ref
            case: 正常
            summary: 過去のリビジョン
            condition: Git の配信元で `rules/a.yaml` を commit した後、作業ツリーで書き換え、`ref` に最初の commit を渡す
            mock: なし（`tmp_path` に `git init`）
            expected: commit した内容を返し、`updated` が commit の日時
            exception: '-'
          - name: test_document_store_load_when_unknown_kind
            case: 異常
            summary: 無い種類
            condition: '`kinds=["x"]`'
            mock: なし
            expected: '`UnknownKindError`'
            exception: '`kinds` に有効な文書の行に無い種類がある'
      - name: get
        title: ID で引く
        summary: ID の並びの順に文書を返す
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: target
            title: 読む場所
            type: Target
            required: true
            passing: positional
            description: 読む場所
          - name: ids
            title: 文書の ID
            type: Sequence[str]
            required: true
            passing: positional
            description: 引く ID の並び
          - name: kinds
            title: 種類
            type: Sequence[str] | None
            required: false
            default: None
            passing: keyword
            description: 絞る文書の行の ID
        returns:
          type: list[Document]
          description: '`ids` の順の文書（同じ ID を 2 回渡すと 2 回返す）'
        process: |-
          1. `load` で文書を集め、ID → 文書の辞書を作る
          2. `ids` の順に引く
          3. 無い ID がある場合、ID ごとに `difflib.get_close_matches`（`n=CANDIDATE_COUNT`、`cutoff=CANDIDATE_CUTOFF`）で近い ID を引き、`DocumentNotFoundError` を送る
          4. 文書の並びを返す
        exceptions:
          - name: DocumentNotFoundError
            condition: 無い ID がある
            message: '`{source}: 文書 {missing} はありません`。`candidates` に無い ID ごとの近い ID'
          - name: UnknownKindError
            condition: '`kinds` に無い種類がある'
            message: '`load` のまま'
        unit_tests:
          - name: test_document_store_get
            case: 正常
            summary: 渡した順
            condition: '`a`・`b` があり、`["b", "a"]`'
            mock: なし（`tmp_path`）
            expected: '`b`・`a` の順'
            exception: '-'
          - name: test_document_store_get_when_missing
            case: 異常
            summary: 無い ID と近い候補
            condition: '`rule-auth` があり、`["rule-auht", "zzz"]`'
            mock: なし（`tmp_path`）
            expected: '`DocumentNotFoundError` の `missing` が 2 件、`candidates["rule-auht"]` が `["rule-auth"]`、`candidates["zzz"]` が空'
            exception: 無い ID がある
      - name: schema
        title: 種類のスキーマ
        summary: 読む場所に合わせた種類のスキーマを返す
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: target
            title: 読む場所
            type: Target
            required: true
            passing: positional
            description: 読む場所
          - name: kind
            title: 種類
            type: str
            required: true
            passing: positional
            description: 文書の行の ID
        returns:
          type: dict[str, Any]
          description: JSON Schema
        process: |-
          1. `source.table(kind)` で行を引く
          2. `target.ref` と `target.worktree` がどちらも `None` の場合、起動時に読んだ `source.schemas[kind]` を使う
          3. それ以外は、`load` と同じ読むフォルダの `schema_path` を `_schemas` から引き、更新日時か大きさが違えば『YAMLの読み込み』で読み直す
             - ファイルが無い・読めない場合、手順 2 のスキーマを使う
          4. `$ref` を解いたスキーマを返す（スキーマの参照の解決。基準は手順 2・3 で使った `schema_path`）。解いた結果も `_schemas` に控える
        exceptions:
          - name: UnknownKindError
            condition: '`kind` が有効な文書の行に無い'
            message: 配信元の『文書の行を引く』のまま
        unit_tests:
          - name: test_document_store_schema_when_worktree
            case: 正常
            summary: ワークツリーのスキーマ
            condition: ワークツリーで `schemas/rule.schema.yaml` の `required` を書き換えた
            mock: なし（`tmp_path`）
            expected: 書き換えたスキーマを返し、クローン本体では起動時のスキーマを返す
            exception: '-'
          - name: test_document_store_schema_when_ref
            case: 正常
            summary: '`$ref` を解いて返す'
            condition: '`schemas/rule.schema.yaml` の `properties.body` が `共通.schema.yaml#/$defs/markdown`'
            mock: なし（`tmp_path`）
            expected: '`properties.body` が `$ref` を持たず `markdown` の中身'
            exception: '-'
      - name: invalidate
        title: キャッシュを捨てる
        summary: 書き込んだファイルのキャッシュを捨てる
        description: 更新日時の分解能より短い間に同じ大きさで書き換えたときも、書き込みの直後の読み取りで古い内容を返さないように、書き込みが呼ぶ。
        kind: メソッド
        scope: public
        thread_safe: true
        side_effects: '`_files` と `_schemas` から該当のキーを削除する'
        args:
          - name: paths
            title: ファイル
            type: Iterable[Path]
            required: true
            passing: positional
            description: 書き込んだ・削除したファイルの絶対パス
        returns:
          type: None
          description: '-'
        process: 1. 渡されたパスを持つ `_files` のキー（全ての文書の行）と `_schemas` のキーを削除する
        unit_tests:
          - name: test_document_store_invalidate
            case: 正常
            summary: 同じ大きさ・同じ更新日時の書き換え
            condition: '`load` の後、`rules/a.yaml` を同じ大きさで書き換えて `os.utime` で更新日時を戻し、`invalidate` してから `load`'
            mock: なし（`tmp_path`）
            expected: 書き換えた内容を返す
            exception: '-'
      - name: clear
        title: 全て捨てる
        summary: 全てのキャッシュを捨てる
        kind: メソッド
        scope: public
        thread_safe: true
        side_effects: '`_files`・`_schemas`・`_dates` を空にする'
        returns:
          type: None
          description: '-'
        process: 1. 3 つのキャッシュを空にする（起動の『配信元の読み直し』が呼ぶ）
      - name: location
        title: 文書の場所
        summary: 文書のファイルの絶対パスを返す。リビジョンを読んだ文書は返さない
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: target
            title: 読む場所
            type: Target
            required: true
            passing: positional
            description: 文書を読んだ場所
          - name: document
            title: 文書
            type: Document
            required: true
            passing: positional
            description: '`target` から読んだ文書'
        returns:
          type: str | None
          description: 絶対パス。`target.ref` があるときは `None`
        process: |-
          1. `target.ref` がある場合、`None` を返す
          2. 読むフォルダ（`read_root(target)`。ワークツリーはワークツリーの中）と `document.body_path`（無ければ `document.path`）を結んだ絶対パスを文字列で返す
        unit_tests:
          - name: test_document_store_location
            case: 正常
            summary: 作業ツリーと body_file
            condition: '`ref` の無い読む場所で、`path` が `rules/a.yaml` の文書と `body_path` が `src/a.py` の文書'
            mock: なし（`tmp_path`）
            expected: '`{tmp_path}/rules/a.yaml` と `{tmp_path}/src/a.py`'
            exception: '-'
          - name: test_document_store_location_when_worktree
            case: 正常
            summary: ワークツリー
            condition: '`worktree` を持つ読む場所'
            mock: なし
            expected: ワークツリーの中の絶対パス
            exception: '-'
          - name: test_document_store_location_when_ref
            case: 正常
            summary: リビジョン
