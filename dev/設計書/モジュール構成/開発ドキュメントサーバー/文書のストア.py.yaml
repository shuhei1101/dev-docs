        exception: '-'
  - name: walk_files
    title: 中をたどるファイルの列挙
    container: features/documents/indexable.py
    usecase: 共通
    role: 読み取り
    summary: フォルダの配下のファイルを、たどらないフォルダを飛ばして `root` からのパスで返す
    kind: 関数
    scope: public
    thread_safe: true
    args:
      - name: root
        title: 読むフォルダ
        type: Path
        required: true
        passing: positional
        description: 配信元の直下に当たるフォルダ
      - name: start
        title: たどり始めるフォルダ
        type: str
        required: false
        default: '"."'
        passing: keyword
        description: '`root` からのパス。このフォルダの配下だけをたどる'
    returns:
      type: Iterator[str]
      description: '`root` からのパス（`/` 区切り）。順は `os.walk` のまま'
    process: |-
      1. `root / start` を `os.walk` でたどる
      2. 各フォルダで、`SKIP_DIRS` の名前のフォルダ・`root` からのパスが `SKIP_PATHS` にあるフォルダ・シンボリックリンクのフォルダをたどる先から外す
      3. ファイルごとに `root` からのパスを作って返す
    unit_tests:
      - name: test_walk_files
        case: 正常
        summary: たどらないフォルダを飛ばす
        condition: '`a/x.md`・`.git/c`・`node_modules/m.js`・`.claude/worktrees/wt/y.md`・`.claude/z.md` を置く'
        mock: なし（`tmp_path`）
        expected: 昇順にして `[".claude/z.md", "a/x.md"]`
        exception: '-'
      - name: test_walk_files_when_start_given
        case: 正常
        summary: 始めるフォルダの配下だけをたどる
        condition: '`a/x.md`・`b/y.md` を置き、`start="a"`'
        mock: なし（`tmp_path`）
        expected: '`["a/x.md"]`'
        exception: '-'
      - name: test_walk_files_when_symlink_folder
        case: 正常
        summary: シンボリックリンクのフォルダをたどらない
        condition: '`a/x.md` と、`a` を指すシンボリックリンク `l` を置く'
        mock: なし（`tmp_path`）
        expected: '`["a/x.md"]`'
        exception: '-'
  - name: is_excluded_file
    title: 除外の条件の判定
    container: features/documents/indexable.py
    usecase: 共通
    role: 判定
    summary: ファイルが管理用の YAML に載せない除外の条件（生成物・ロック・バイナリ・ベンダーのコード・再エクスポートや空の `__init__`）に当たるか
    description: 配信元によらず同じ固定の判定を使う。配信元に固有の除外は `documents[].exclude[]` が担う。
    kind: 関数
    scope: public
    thread_safe: true
    args:
      - name: root
        title: 読むフォルダ
        type: Path
        required: true
        passing: positional
        description: 配信元の直下に当たるフォルダ
      - name: path
        title: ファイルのパス
        type: str
        required: true
        passing: positional
        description: '`root` からのパス'
    returns:
      type: bool
      description: 除外の条件に当たれば `True`
    process: |-
      1. パスの途中のフォルダ名に `VENDOR_DIRS` のどれかがあれば `True`
      2. ファイル名が `LOCK_FILES` にあるか、末尾が `.lock` なら `True`
      3. ファイル名の末尾が `GENERATED_SUFFIXES` のどれかなら `True`
      4. ファイルの先頭 `BINARY_SNIFF_BYTES` バイトを読み、NUL バイトがあれば `True`
      5. ファイル名が `__init__.py` の場合、UTF-8 で読んで `ast.parse` し、文が空か、import 文・先頭の docstring・`__all__` への代入だけなら `True`
      6. それ以外は `False`
         - 手順 4・5 で `OSError` の場合、`False`（読めないファイルは読み込みの問題として別に出る）
         - 手順 5 で `SyntaxError`・`UnicodeDecodeError` の場合、`False`
    unit_tests:
      - name: test_is_excluded_file_when_lock
        case: 正常
        summary: ロックファイル
        condition: '`uv.lock`・`package-lock.json` を置く'
        mock: なし（`tmp_path`）
        expected: どちらも `True`
        exception: '-'
      - name: test_is_excluded_file_when_vendor
        case: 正常
        summary: ベンダー・生成物のフォルダの下
        condition: '`src/vendor/a.py`・`web/dist/app.js` を置く'
        mock: なし（`tmp_path`）
        expected: どちらも `True`
        exception: '-'
      - name: test_is_excluded_file_when_generated_suffix
        case: 正常
        summary: 生成物のファイル名
        condition: '`api_pb2.py`・`app.min.js` を置く'
        mock: なし（`tmp_path`）
        expected: どちらも `True`
        exception: '-'
      - name: test_is_excluded_file_when_binary
        case: 正常
        summary: NUL バイトを持つファイル
        condition: 先頭に NUL バイトを持つ `logo.png` を置く
        mock: なし（`tmp_path`）
        expected: '`True`'
        exception: '-'
      - name: test_is_excluded_file_when_reexport_init
        case: 正常
        summary: 空・再エクスポートだけの `__init__.py`
        condition: 空の `a/__init__.py` と、docstring・`from .x import y`・`__all__ = ["y"]` だけの `b/__init__.py` を置く
        mock: なし（`tmp_path`）
        expected: どちらも `True`
        exception: '-'
      - name: test_is_excluded_file_when_init_has_logic
        case: 正常
        summary: 処理を持つ `__init__.py` は載せる
        condition: '`def f(): ...` を持つ `c/__init__.py` を置く'
        mock: なし（`tmp_path`）
        expected: '`False`'
        exception: '-'
      - name: test_is_excluded_file_when_source
        case: 正常
        summary: 通常のコードは載せる
        condition: '`src/a.py`・`docs/a.md` を置く'
        mock: なし（`tmp_path`）
        expected: どちらも `False`
        exception: '-'
  - name: indexable_files
    title: 載せるファイルの一覧
    container: features/documents/indexable.py
    usecase: 載せるファイルの一覧
    role: 読み取り
    summary: 範囲の glob に当たるファイルのうち、除外の名前と除外の条件に当たらないものを返す
    kind: 関数
    scope: public
    thread_safe: true
    args:
      - name: root
        title: 読むフォルダ
        type: Path
        required: true
        passing: positional
        description: 配信元の直下に当たるフォルダ
      - name: paths
        title: 範囲
        type: list[str]
        required: true
        passing: positional
        description: '`root` からの glob（`documents[].paths` と同じ書き方）'
      - name: exclude
        title: 除外の名前
        type: list[str]
        required: false
        default: '[]'
        passing: keyword
        description: ファイル名の glob（`documents[].exclude[]` と同じ書き方）
    returns:
      type: list[str]
      description: '`root` からのパスの昇順'
    process: |-
      1. `paths`・`exclude` を持つ文書の行（`DocumentTable`。`id` は `files`、`schema_path` は空）を作り、ファイルの収集（`collect_files`）で集める
      2. 除外の条件の判定（`is_excluded_file`）が `True` のパスを除いて返す
    unit_tests:
      - name: test_indexable_files
        case: 正常
        summary: 除外の条件に当たるファイルを除く
        condition: '`src/a.py`・`src/b.py`・空の `src/pkg/__init__.py`・`src/uv.lock`・`.claude/worktrees/wt/src/c.py` を置き、`paths=["**"]`'
        mock: なし（`tmp_path`）
        expected: '`["src/a.py", "src/b.py"]`'
        exception: '-'
      - name: test_indexable_files_when_exclude_given
        case: 正常
        summary: 除外の名前に当たるファイルも除く
        condition: '`src/a.py`・`src/b.py` を置き、`paths=["src/**"]`・`exclude=["b.py"]`'
        mock: なし（`tmp_path`）
        expected: '`["src/a.py"]`'
        exception: '-'
classes:
  - name: DocumentStore
    title: 文書のストア
    container: features/documents/store.py
    usecase: 共通
    role: キャッシュ
    summary: 読む場所（`Target`）ごとに文書を集め、ファイルごとに結果をキャッシュする
    description: |-
      キャッシュのキーはファイルの絶対パスと文書の行の ID。更新日時（`st_mtime_ns`）と大きさが変わったファイルだけを読み直す。
      リビジョンの書き出しは書き換わらないので、同じ仕組みでそのままキャッシュに当たる。
      配信元の読み直しで文書の行が変わったときは、行の内容がキーに含まれないので、起動の設定の読み直しで `clear` を呼ぶ。
    kind: クラス
    properties:
      - name: snapshots
        title: リビジョンの書き出し
        type: SnapshotStore
        access: 公開
        description: '`ref` のある `Target` を読むときに使う'
      - name: _files
        title: ファイルのキャッシュ
        type: dict[tuple[Path, str], tuple[int, int, list[Document], list[LoadProblem], tuple[tuple[str, int, int], ...]]]
        access: 内部 (_)
        description: (絶対パス, 文書の行の ID) → (更新日時, 大きさ, 文書, 理由, 文書が指す本文のファイルの (パス, 更新日時, 大きさ) のパスの順の並び)
      - name: _schemas
        title: スキーマのキャッシュ
        type: dict[Path, tuple[int, int, dict[str, Any]]]
        access: 内部 (_)
        description: スキーマの絶対パス → (更新日時, 大きさ, 読んだスキーマ)
      - name: _dates
        title: 日時のキャッシュ
        type: dict[tuple[Path, str], dict[str, FileDates]]
        access: 内部 (_)
        description: (作業ツリー, 解いた commit) → 履歴の『ファイルの日時』の結果。commit が変わればキーが変わる
      - name: _lock
        title: 排他
        type: threading.Lock
        access: 内部 (_)
        description: キャッシュの辞書の読み書きを守る（ファイルの読み込みはロックの外で行う）
    methods:
      - name: load
        title: 文書を集める
        summary: 読む場所の文書を、文書の行ごとに集めて返す
        kind: メソッド
        scope: public
        thread_safe: true
        side_effects: キャッシュを更新する。`ref` があればリビジョンを書き出す
        args:
          - name: target
            title: 読む場所
            type: Target
            required: true
            passing: positional
            description: 権限と作業場所の『読む場所の解決』の結果
          - name: kinds
            title: 種類
            type: Sequence[str] | None
            required: false
            default: None
            passing: keyword
            description: 絞る文書の行の ID。`None` は有効な全ての行
        returns:
          type: LoadResult
          description: 集めた文書と読めなかったファイル
        process: |-
          1. 読むフォルダを決める
             - `target.ref` が `None` の場合、`target.base`
             - `target.ref` がある場合、履歴の『リビジョンの解決』（`date_base` は配信元の `default_ref`）で解いた commit を `snapshots.checkout` で書き出し、その下に `source.root` の `repo_root` からの相対パスをつなぐ
          2. 文書の行を決める。`kinds` があれば `source.table` で引き（無い種類は `UnknownKindError`）、無ければ `enabled` の全ての行
          3. Git の配信元の場合、履歴の『ファイルの日時』を `_dates` から引く。無ければ、作業ツリー（ワークツリーか `repo_root`）と commit（`ref` の commit、無ければ作業ツリーの `HEAD` を解いた SHA）で呼び、配信元の直下からのパスに直して控える
          4. 行ごとに『ファイルの収集』でファイルを集め、ファイルごとに `stat` を取る
             - `_files` の更新日時と大きさが同じで、理由に `missing_body_file` が無く、本文のファイルの (パス, 更新日時, 大きさ) も同じなら控えた結果を使う
             - それ以外は『ファイルの読み込み』で読み、`_files` を置き換える
          5. 収集で当たらなかった `_files` のキーのうち、読むフォルダの下にあるものを削除する（削除されたファイル）
          6. 行の順に文書を並べ、先に現れた ID を残して、後に現れた同じ ID の文書を `duplicate_id` にする（`detail` に ID と先の文書のファイル）
          7. `LoadResult` を返す
        exceptions:
          - name: UnknownKindError
            condition: '`kinds` に有効な文書の行に無い種類がある'
            message: 配信元の『文書の行を引く』のまま
          - name: RefNotFoundError
            condition: '`target.ref` を commit に解けない'
            message: 履歴の『リビジョンの解決』のまま
        unit_tests:
          - name: test_document_store_load
            case: 正常
            summary: 行ごとに集める
            condition: '行 `rules`（`rules/*.yaml`）と `notes`（`notes/files.yaml` の `records: files`・`body_file: path` で `.md`）に 2 件ずつ、Git の管理外の配信元'
            mock: なし（`tmp_path`）
            expected: '`rules` の 2 件、`notes` の 2 件の順で、`problems` が空'
            exception: '-'
          - name: test_document_store_load_when_cached
            case: 正常
            summary: 変わったファイルだけ読み直す
            condition: 2 回呼ぶ間に `rules/a.yaml` だけを書き換える
            mock: '`load_file`（本物を包んで呼ばれたパスを記録する）'
            expected: 2 回目に `load_file` が呼ばれたのは `rules/a.yaml` だけで、結果に書き換えた内容が載る
            exception: '-'
          - name: test_document_store_load_when_deleted
            case: 正常
            summary: 削除されたファイル
            condition: 2 回呼ぶ間に `rules/b.yaml` を削除する
            mock: なし（`tmp_path`）
            expected: 2 回目の結果に `rules/b.yaml` の文書が無い
            exception: '-'
          - name: test_document_store_load_when_duplicate_id
            case: 正常
            summary: 重なった ID
            condition: '`rules/a.yaml` と `rules/b.yaml` がどちらも `id: x`'
            mock: なし（`tmp_path`）
            expected: 文書は `rules/a.yaml` の 1 件で、`problems` に `rules/b.yaml` の `duplicate_id`
            exception: '-'
          - name: test_document_store_load_when_ref
            case: 正常
            summary: 過去のリビジョン
            condition: Git の配信元で `rules/a.yaml` を commit した後、作業ツリーで書き換え、`ref` に最初の commit を渡す
            mock: なし（`tmp_path` に `git init`）
            expected: commit した内容を返し、`updated` が commit の日時
            exception: '-'
          - name: test_document_store_load_when_unknown_kind
            case: 異常
            summary: 無い種類
            condition: '`kinds=["x"]`'
            mock: なし
            expected: '`UnknownKindError`'
            exception: '`kinds` に有効な文書の行に無い種類がある'
      - name: get
        title: ID で引く
        summary: ID の並びの順に文書を返す
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: target
            title: 読む場所
            type: Target
            required: true
            passing: positional
            description: 読む場所
          - name: ids
            title: 文書の ID
            type: Sequence[str]
            required: true
            passing: positional
            description: 引く ID の並び
          - name: kinds
            title: 種類
            type: Sequence[str] | None
            required: false
            default: None
            passing: keyword
            description: 絞る文書の行の ID
        returns:
          type: list[Document]
          description: '`ids` の順の文書（同じ ID を 2 回渡すと 2 回返す）'
        process: |-
          1. `load` で文書を集め、ID → 文書の辞書を作る
          2. `ids` の順に引く
          3. 無い ID がある場合、ID ごとに `difflib.get_close_matches`（`n=CANDIDATE_COUNT`、`cutoff=CANDIDATE_CUTOFF`）で近い ID を引き、`DocumentNotFoundError` を送る
          4. 文書の並びを返す
        exceptions:
          - name: DocumentNotFoundError
            condition: 無い ID がある
            message: '`{source}: 文書 {missing} はありません`。`candidates` に無い ID ごとの近い ID'
          - name: UnknownKindError
            condition: '`kinds` に無い種類がある'
            message: '`load` のまま'
        unit_tests:
          - name: test_document_store_get
            case: 正常
            summary: 渡した順
            condition: '`a`・`b` があり、`["b", "a"]`'
            mock: なし（`tmp_path`）
            expected: '`b`・`a` の順'
            exception: '-'
          - name: test_document_store_get_when_missing
            case: 異常
            summary: 無い ID と近い候補
            condition: '`rule-auth` があり、`["rule-auht", "zzz"]`'
            mock: なし（`tmp_path`）
            expected: '`DocumentNotFoundError` の `missing` が 2 件、`candidates["rule-auht"]` が `["rule-auth"]`、`candidates["zzz"]` が空'
            exception: 無い ID がある
      - name: schema
        title: 種類のスキーマ
        summary: 読む場所に合わせた種類のスキーマを返す
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: target
            title: 読む場所
            type: Target
            required: true
            passing: positional
            description: 読む場所
          - name: kind
            title: 種類
            type: str
            required: true
            passing: positional
            description: 文書の行の ID
        returns:
          type: dict[str, Any]
          description: JSON Schema
        process: |-
          1. `source.table(kind)` で行を引く
          2. `target.ref` と `target.worktree` がどちらも `None` の場合、起動時に読んだ `source.schemas[kind]` を使う
          3. それ以外は、`load` と同じ読むフォルダの `schema_path` を `_schemas` から引き、更新日時か大きさが違えば『YAMLの読み込み』で読み直す
             - ファイルが無い・読めない場合、手順 2 のスキーマを使う
          4. `$ref` を解いたスキーマを返す（スキーマの参照の解決。基準は手順 2・3 で使った `schema_path`）。解いた結果も `_schemas` に控える
        exceptions:
          - name: UnknownKindError
            condition: '`kind` が有効な文書の行に無い'
            message: 配信元の『文書の行を引く』のまま
        unit_tests:
          - name: test_document_store_schema_when_worktree
            case: 正常
            summary: ワークツリーのスキーマ
            condition: ワークツリーで `schemas/rule.schema.yaml` の `required` を書き換えた
            mock: なし（`tmp_path`）
            expected: 書き換えたスキーマを返し、クローン本体では起動時のスキーマを返す
            exception: '-'
          - name: test_document_store_schema_when_ref
            case: 正常
            summary: '`$ref` を解いて返す'
            condition: '`schemas/rule.schema.yaml` の `properties.body` が `共通.schema.yaml#/$defs/markdown`'
            mock: なし（`tmp_path`）
            expected: '`properties.body` が `$ref` を持たず `markdown` の中身'
            exception: '-'
      - name: invalidate
        title: キャッシュを捨てる
        summary: 書き込んだファイルのキャッシュを捨てる
        description: 更新日時の分解能より短い間に同じ大きさで書き換えたときも、書き込みの直後の読み取りで古い内容を返さないように、書き込みが呼ぶ。
        kind: メソッド
        scope: public
        thread_safe: true
        side_effects: '`_files` と `_schemas` から該当のキーを削除する'
        args:
          - name: paths
            title: ファイル
            type: Iterable[Path]
            required: true
            passing: positional
            description: 書き込んだ・削除したファイルの絶対パス
        returns:
          type: None
          description: '-'
        process: 1. 渡されたパスを持つ `_files` のキー（全ての文書の行）と `_schemas` のキーを削除する
        unit_tests:
          - name: test_document_store_invalidate
            case: 正常
            summary: 同じ大きさ・同じ更新日時の書き換え
            condition: '`load` の後、`rules/a.yaml` を同じ大きさで書き換えて `os.utime` で更新日時を戻し、`invalidate` してから `load`'
            mock: なし（`tmp_path`）
            expected: 書き換えた内容を返す
            exception: '-'
      - name: clear
        title: 全て捨てる
        summary: 全てのキャッシュを捨てる
        kind: メソッド
        scope: public
        thread_safe: true
        side_effects: '`_files`・`_schemas`・`_dates` を空にする'
        returns:
          type: None
          description: '-'
        process: 1. 3 つのキャッシュを空にする（起動の『配信元の読み直し』が呼ぶ）
      - name: location
        title: 文書の場所
        summary: 文書のファイルの絶対パスを返す。リビジョンを読んだ文書は返さない
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: target
            title: 読む場所
            type: Target
            required: true
            passing: positional
            description: 文書を読んだ場所
          - name: document
            title: 文書
            type: Document
            required: true
            passing: positional
            description: '`target` から読んだ文書'
        returns:
          type: str | None
          description: 絶対パス。`target.ref` があるときは `None`
        process: |-
          1. `target.ref` がある場合、`None` を返す
          2. 読むフォルダ（`read_root(target)`。ワークツリーはワークツリーの中）と `document.body_path`（無ければ `document.path`）を結んだ絶対パスを文字列で返す
        unit_tests:
          - name: test_document_store_location
            case: 正常
            summary: 作業ツリーと body_file
            condition: '`ref` の無い読む場所で、`path` が `rules/a.yaml` の文書と `body_path` が `src/a.py` の文書'
            mock: なし（`tmp_path`）
            expected: '`{tmp_path}/rules/a.yaml` と `{tmp_path}/src/a.py`'
            exception: '-'
          - name: test_document_store_location_when_worktree
            case: 正常
            summary: ワークツリー
            condition: '`worktree` を持つ読む場所'
            mock: なし
            expected: ワークツリーの中の絶対パス
            exception: '-'
          - name: test_document_store_location_when_ref
            case: 正常
            summary: リビジョン
            condition: '`ref` を持つ読む場所'
            mock: なし
            expected: '`None`'
            exception: '-'
