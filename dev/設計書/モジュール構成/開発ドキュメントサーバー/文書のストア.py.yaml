      - name: InvalidArgumentError
        condition: パスが `[]`・`[{キー}]` を含む
        message: '{path}: `[]`・`[{キー}]` を含む項目のパスは削除できません'
    unit_tests:
      - name: test_delete_field
        case: 正常
        summary: キーと位置
        condition: '`{"a": {"b": 1}, "c": [1, 2]}` から `a.b` と `c[0]`'
        mock: なし
        expected: 'どちらも `True` で、`{"a": {}, "c": [2]}`'
        exception: '-'
      - name: test_delete_field_when_missing
        case: 正常
        summary: 無い値
        condition: '`{}` から `a.b`'
        mock: なし
        expected: '`False` で内容は変わらない'
        exception: '-'
  - name: resolve_metadata
    title: メタデータの解決
    kind: 関数
    container: features/documents/fields.py
    usecase: 共通
    role: 変換
    summary: 文書の行の `metadata` の対応で、文書の内容から共通のキーの値を取る
    scope: public
    thread_safe: true
    args:
      - name: data
        title: 内容
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 文書の内容
      - name: table
        title: 文書の行
        type: DocumentTable
        required: true
        passing: positional
        description: 文書の行
    returns:
      type: dict[str, Any]
      description: 共通のキー → 値。値が無いキーは含まない
    process: |-
      1. `METADATA_KEYS` のキーごとに、`table.metadata` の列名（書かれていないキーは同じ名前の列）の値を『項目の取得』で取る。列名が `[]`・`[{キー}]` を含むときは選んだ要素の値の配列になる（`tags: tags[].name`・`main_tags: tags[main].name`）
      2. `table.alias_type` がある場合、`alias_type` の値をその値にする
      3. 値が `None` のキーを除いて返す
    unit_tests:
      - name: test_resolve_metadata
        case: 正常
        summary: 列名の対応と同じ名前の列
        condition: '`metadata` が `{name: title}`、行の `alias_type` が `term`、内容が `{"id": "a", "title": "A", "tags": ["x"]}`'
        mock: なし
        expected: '`{"id": "a", "name": "A", "tags": ["x"], "alias_type": "term"}`'
        exception: '-'
      - name: test_resolve_metadata_when_nested_field
        case: 正常
        summary: 入れ子の列
        condition: '`metadata` が `{description: meta.summary}`、内容が `{"meta": {"summary": "s"}}`'
        mock: なし
        expected: '`description` が `s`'
        exception: '-'
      - name: test_resolve_metadata_when_object_array
        case: 正常
        summary: オブジェクトの配列のタグ
        condition: '`metadata` が `{tags: tags[].name, main_tags: tags[main].name}`、内容が `{"tags": [{"name": "mcp", "main": true}, {"name": "設計"}]}`'
        mock: なし
        expected: '`tags` が `["mcp", "設計"]`、`main_tags` が `["mcp"]`'
        exception: '-'
  - name: collect_files
    title: ファイルの収集
    kind: 関数
    container: features/documents/loader.py
    usecase: 共通
    role: 読み取り
    summary: 文書の行に当たるファイルを配信元の直下から集める
    scope: public
    thread_safe: true
    args:
      - name: root
        title: 読むフォルダ
        type: Path
        required: true
        passing: positional
        description: 配信元の直下に当たるフォルダ（作業ツリー・ワークツリー・リビジョンの書き出し）
      - name: table
        title: 文書の行
        type: DocumentTable
        required: true
        passing: positional
        description: 集める行（`paths`・`exclude`）
    returns:
      type: list[str]
      description: '`root` からのパス（`/` 区切り）の昇順。重複は含まない'
    process: |-
      1. 中をたどるファイルの列挙（`walk_files`）で `root` の配下のファイルを `root` からのパスで得る
      2. 文書の行.行に当たるかが `True` のパスを加える
      3. 昇順に並べて返す
    unit_tests:
      - name: test_collect_files
        case: 正常
        summary: glob で集める
        condition: '`a/x.yaml`・`a/b/y.yaml`・`a/z.md`・`.git/c.yaml` を置き、`paths: ["a/**/*.yaml"]` の行'
        mock: なし（`tmp_path`）
        expected: '`["a/b/y.yaml", "a/x.yaml"]`'
        exception: '-'
      - name: test_collect_files_when_overlapping_patterns
        case: 正常
        summary: 重なる glob
        condition: '`a/x.yaml` を置き、`paths: ["a/*.yaml", "**/x.yaml"]` の行'
        mock: なし（`tmp_path`）
        expected: '`["a/x.yaml"]`'
        exception: '-'
      - name: test_collect_files_when_excluded
        case: 正常
        summary: 除外の名前に当たるファイルを外す
        condition: '`a/x.md`・`a/README.md`・`a/b/README.md` を置き、`paths: ["a/**/*.md"]`・`exclude: [README.md]` の行'
        mock: なし（`tmp_path`）
        expected: '`["a/x.md"]`'
        exception: '-'
      - name: test_collect_files_when_worktrees
        case: 正常
        summary: ワークツリーのフォルダをたどらない
        condition: '`a/x.md`・`.claude/worktrees/wt/a/x.md`・`.claude/a.md` を置き、`paths: ["**/*.md"]` の行'
        mock: なし（`tmp_path`）
        expected: '`[".claude/a.md", "a/x.md"]`'
        exception: '-'
  - name: load_file
    title: ファイルの読み込み
    kind: 関数
    container: features/documents/loader.py
    usecase: 共通
    role: 読み取り
    summary: 1 つのファイルを読み、文書の行に従って 1 件以上の文書にする
    scope: public
    thread_safe: true
    args:
      - name: root
        title: 読むフォルダ
        type: Path
        required: true
        passing: positional
        description: 配信元の直下に当たるフォルダ
      - name: path
        title: ファイル
        type: str
        required: true
        passing: positional
        description: '`root` からのパス'
      - name: table
        title: 文書の行
        type: DocumentTable
        required: true
        passing: positional
        description: ファイルが当たった文書の行
      - name: source_id
        title: 配信元の ID
        type: str
        required: true
        passing: keyword
        description: 文書に載せる配信元の ID
      - name: dates
        title: git の日時
        type: Mapping[str, FileDates]
        required: false
        default: '{}'
        passing: keyword
        description: '`root` からのパス → 履歴の『ファイルの日時』。Git の管理外は空'
    returns:
      type: tuple[list[Document], list[LoadProblem]]
      description: 作った文書と、文書にできなかった理由
    process: |-
      1. ファイルを UTF-8 で読む
      2. 文字列からの文書の組み立てに渡し、その結果を返す
    unit_tests:
      - name: test_load_file_when_yaml
        case: 正常
        summary: YAML の 1 ファイル 1 文書
        condition: '`rules/a.yaml` が `id: rule-a\ntitle: A\n`、行の `metadata` が `{name: title}`'
        mock: なし（`tmp_path`）
        expected: 1 件で、`id` が `rule-a`、`metadata.name` が `A`、`version` が内容の『内容のハッシュ』、`record_index` が `None`
        exception: '-'
      - name: test_load_file_when_records
        case: 正常
        summary: records と body_file
        condition: '`src/files.yaml` が `files: [{path: a.py, tags: [x]}, {path: b.py}]`、`src/a.py`・`src/b.py` を置き、行は `records: files`・`body_file: path`'
        mock: なし（`tmp_path`）
        expected: 2 件で、`id` が `src/a`・`src/b`、`body` が各ファイルの内容、`body_path` が `src/a.py`・`src/b.py`、`record_index` が 0・1、`version` が要素の『値のハッシュ』
        exception: '-'
      - name: test_load_file_when_dates
        case: 正常
        summary: 日時の優先順位
        condition: '`a.yaml` と `b.yaml` がどちらも `updated: 2026-01-02T00:00:00+09:00` を持ち、`dates` は `a.yaml` だけが `created` 2025-12-01・`updated` 2025-12-05。`c.yaml` はどちらも無い'
        mock: なし（`tmp_path`）
        expected: '`a.yaml` は 2025-12-01・2025-12-05、`b.yaml` は `created` が `None`・`updated` が 2026-01-02、`c.yaml` はどちらも `None`'
        exception: '-'
      - name: test_load_file_when_unreadable
        case: 異常
        summary: 読めない YAML
        condition: '`a.yaml` が `a: [1`'
        mock: なし（`tmp_path`）
        expected: 文書は 0 件で、`LoadProblem` の `reason` が `unreadable`、`detail` に理由、`line`・`column` に行と列
        exception: '-'
      - name: test_load_file_when_missing_body_file
        case: 異常
        summary: 無い本文のファイル
        condition: '`records` の要素が `{path: none.py}` と `{path: ../../x.py}`'
        mock: なし（`tmp_path`）
        expected: 文書は 0 件で、`missing_body_file` が 2 件
        exception: '-'
      - name: test_load_file_when_default_name
        case: 正常
        summary: 名前の既定
        condition: '`rules/a.yaml` が `id: rule-a` だけ。`src/files.yaml` が `files: [{path: a.py}, {path: b.py, name: 部品 B}]`（行は `records: files`・`body_file: path`）。`list.yaml` が `items: [{x: 1}]`（行は `records: items`）'
        mock: なし（`tmp_path`）
        expected: '`metadata.name` が `a`（`rules/a.yaml`）、`a`・`部品 B`（`src`）、`list#0`（`list.yaml`）'
        exception: '-'
  - name: documents_from_text
    title: 文字列からの文書の組み立て
    kind: 関数
    container: features/documents/loader.py
    usecase: 共通
    role: 読み取り
    summary: 1 つのファイルの内容の文字列を、文書の行に従って 1 件以上の文書にする
    description: ファイルの読み込みと、書き込みが変更を当てた後の内容から検査用の文書を作るときと、変更の一覧が commit のファイルから文書を作るときに使う。
    scope: public
    thread_safe: true
    args:
      - name: text
        title: 内容
        type: str
        required: true
        passing: positional
        description: ファイルの内容
      - name: root
        title: 読むフォルダ
        type: Path
        required: true
        passing: positional
        description: 配信元の直下に当たるフォルダ（`body_file` を解く）
      - name: path
        title: ファイル
        type: str
        required: true
        passing: positional
        description: '`root` からのパス'
      - name: table
        title: 文書の行
        type: DocumentTable
        required: true
        passing: positional
        description: ファイルが当たった文書の行
      - name: source_id
        title: 配信元の ID
        type: str
        required: true
        passing: keyword
        description: 文書に載せる配信元の ID
      - name: dates
        title: git の日時
        type: Mapping[str, FileDates]
        required: false
        default: '{}'
        passing: keyword
        description: ファイルの読み込みと同じ
      - name: read_body
        title: 本文の読み方
        type: Callable[[str], str | None] | None
        required: false
        default: None
        passing: keyword
        description: '`body_file` の本文を読む関数（`root` からのパスを受け、内容か、無ければ `None` を返す）。`None` は `root` のファイルを読む'
    returns:
      type: tuple[list[Document], list[LoadProblem]]
      description: 作った文書と、文書にできなかった理由
    process: |-
      1. 『YAMLの読み込み』で読む
         - `YamlLoadError` の場合、`unreadable` の `LoadProblem` だけを返す
      2. `table.records` が無い場合、1 件の文書を作る
         - 内容が辞書でない場合、`not_mapping` を返す
         - 本文はファイルの内容。バージョンはファイルの内容の『内容のハッシュ』
      3. `table.records` がある場合、『項目の取得』で配列を取り、要素ごとに文書を作る（配列が無ければ 0 件）
         - 要素が辞書でない場合、その要素は `not_mapping` にして飛ばす
         - `table.body_file` があれば、要素のその列のパスを YAML のファイルのフォルダから解き、`read_body`（`None` なら `root` のファイル）で読んで本文と `body_path` にする。無いファイル（`read_body` が `None` を返す）・`root` の外を指す場合、その要素は `missing_body_file` にして飛ばす
         - `body_file` が無ければ、要素を YAML に書き出した文字列を本文にする
         - バージョンは要素の『値のハッシュ』
      4. 文書ごとに『メタデータの解決』を当てる
      5. ID はメタデータの `id`。無ければ、`body_path` か `path` から拡張子を除いた値（`records` で `body_file` が無ければ末尾に `#{位置}`）にする
         - メタデータの `name` が空なら、`body_path`（無ければ `path`）のファイル名から拡張子を除いた名前を入れる。`records` で `body_file` が無ければ ID を入れる
      6. `created` / `updated` は、`dates` の `body_path`（無ければ `path`）の値、内容の同じ名前の項目（ISO 8601 の文字列か日時）の順に最初にある値を使う。どちらも無ければ `None`
      7. 文書と理由を返す
    unit_tests:
      - name: test_documents_from_text_when_read_body
        case: 正常
        summary: '`body_file` の本文の読み方'
        condition: '`records`・`body_file` の行の索引の YAML（要素の `body_file` が `a.md`）に、`a.md` を受けると `過去の本文` を返す `read_body` を渡す（`root` の `a.md` は `今の本文`）。もう 1 つは `a.md` に `None` を返す `read_body`'
        mock: なし（`tmp_path`）
        expected: 1 つ目は文書の `body` が `過去の本文`、`body_path` が `a.md`。2 つ目は文書が 0 件で、`missing_body_file` の `LoadProblem` が 1 件
  - name: resolve_schema_refs
    title: スキーマの参照の解決
    kind: 関数
    container: features/documents/schema.py
    usecase: 共通
    role: 変換
    summary: 種類のスキーマの `$ref` を参照先の中身で置き換えたスキーマを返す
    scope: public
    args:
      - name: schema
        title: スキーマ
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 読んだ種類のスキーマ
      - name: base
        title: スキーマのファイル
        type: Path
        required: true
        passing: positional
        description: '相対の `$ref`（`共通.schema.yaml#/$defs/markdown` など）を解く基準のファイル'
    returns:
      type: dict[str, Any]
      description: '`$ref` を解いたスキーマ（`$defs` はそのまま残す）'
    process: |-
      1. `referencing.Registry` に `base` の URI でスキーマを載せ、参照先のファイルは `retrieve` で `base` のフォルダから『YAMLの読み込み』で読む
      2. 値を先頭からたどり、`$ref` を持つオブジェクトは参照先の中身に、`$ref` 以外のキーを重ねたものに置き換えて続けてたどる
      3. たどっている途中の `$ref` に戻る（循環する）場合、その `$ref` は解かずに残す
         - `[warning]` スキーマの循環する参照を解かずに残した（ファイル・`$ref`）
      4. 参照先が無い・読めない場合、その `$ref` は解かずに残す
         - `[warning]` スキーマの参照を解けなかった（ファイル・`$ref`・理由）
    unit_tests:
      - name: test_resolve_schema_refs
        case: 正常
        summary: 同じファイルと別のファイルの参照
        condition: '`properties.a` が `#/$defs/x`、`properties.b` が `共通.schema.yaml#/$defs/markdown` で `title: B` を重ねる'
        mock: なし（`tmp_path`）
        expected: '`a` が `$defs.x` の中身、`b` が `markdown` の中身に `title: B` を重ねたもの'
      - name: test_resolve_schema_refs_when_cycle
        case: 正常
        summary: 循環する参照
        condition: '`$defs.node.properties.children.items` が `#/$defs/node`'
        mock: なし
        expected: '`children.items` が `$ref` のまま残り、`[warning]` が 1 件'
      - name: test_resolve_schema_refs_when_missing
        case: 正常
        summary: 参照先が無い
        condition: '`無い.schema.yaml#/$defs/x`'
        mock: なし
        expected: '`$ref` のまま残り、`[warning]` が 1 件'
