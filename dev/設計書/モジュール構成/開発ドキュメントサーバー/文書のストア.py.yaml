        condition: '`src/files.yaml`・`src/a.py`・`src/d.py`・空の `src/pkg/__init__.py`・`src/uv.lock`・`src/vendor/v.py` を置き、`body_paths` が `[src/a.py]`'
        mock: なし（`tmp_path`）
        expected: '`["src/d.py"]`'
        exception: '-'
  - name: check_sync
    title: メタデータのずれの確かめ
    container: features/documents/store.py
    usecase: 起動
    role: サービス
    summary: 配信元のクローン本体の文書を読み、`metadata` の列の欠けと管理用の YAML のずれを求める
    description: 起動時と読み直しのときに呼ぶ。#4 の `check_project` も呼ばれるたびにこの関数で求め直す。
    kind: 関数
    scope: public
    thread_safe: true
    args:
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: 文書を読む
      - name: source
        title: 配信中の配信元
        type: ServedSource
        required: true
        passing: positional
        description: 確かめる配信元
    returns:
      type: SyncReport
      description: ずれの並び（ずれが無ければ空）
    process: |-
      1. `Target(source, source.root, None, None, "read")` で文書を集める（文書のストア.文書を集める）
      2. 文書ごとに、その行で metadataの列の欠けを求め、`{行の id}: {文書の id}: {キー}（{列名}）` で `missing_refs` に加える
      3. `records` と `body_file` を持つ行ごとに、行に当たる管理用の YAML（ファイルの収集）ごとに、その YAML から作った文書の `body_path` と行を渡して索引に無いファイルを求め、`{行の id}: {パス}` で `unindexed_files` に加える
      4. 手順 1 の `problems` のうち `reason` が `missing_body_file` のものを `{path}: {detail}` で `missing_body_files` に加える
      5. `SyncReport` を返す
    unit_tests:
      - name: test_check_sync
        case: 正常
        summary: 3 種のずれ
        condition: '行 `rules` が `metadata: {name: title}` で 2 件中 1 件に `title` が無い。行 `src` の `src/files.yaml` が `a.py`・`c.py` を持ち、`src/` に `a.py`・`d.py` を置く'
        mock: なし（一時フォルダの配信元）
        expected: '`missing_refs` が 1 件（`name` の `title`）、`unindexed_files` が `["src: src/d.py"]`、`missing_body_files` が 1 件（`c.py`）'
        exception: '-'
      - name: test_check_sync_when_clean
        case: 正常
        summary: ずれが無い
        condition: 全ての文書に `title` があり、管理用の YAML とファイルがそろう
        mock: なし
        expected: 3 つの並びが空
        exception: '-'
