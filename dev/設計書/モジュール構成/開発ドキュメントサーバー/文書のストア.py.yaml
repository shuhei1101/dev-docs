title: "開発ドキュメントサーバー / 文書のストア"
lead: |-
  配信元の `documents[]` の行ごとにファイルを集め、ファイルか `records` の要素を 1 件の文書にして、メタデータ・バージョン・日時を付けて返す。
  読んだ文書はファイルの更新日時と大きさでキャッシュし、変わったファイルだけを読み直す。
directory: |
  ```text
  src/dev_docs/features/documents/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ types.py      # Document / LoadProblem / LoadResult / SyncReport
  ├─ fields.py     # get_field / set_field / delete_field / resolve_metadata / missing_ref_fields / is_markdown_body
  ├─ loader.py     # collect_files / load_file / unindexed_files（ファイルから文書を作る）
  ├─ indexable.py  # walk_files / is_excluded_file / indexable_files（たどるフォルダと載せるファイルの判定）
  ├─ schema.py     # resolve_schema_refs（種類のスキーマの $ref を解く）
  └─ store.py      # DocumentStore（キャッシュ・ID の引き当て・種類のスキーマ・文書の場所）/ check_sync（メタデータのずれ）
  ```
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        文書のストア ..> ファイルの収集
        文書のストア ..> ファイルの読み込み
        文書のストア ..> 文書 : 返す
        文書のストア ..> 読み込みの結果 : 返す
        ファイルの読み込み ..> メタデータの解決
        文書のストア ..> スキーマの参照の解決
        メタデータの解決 ..> 項目の取得
        読み込みの結果 o-- 文書
        読み込みの結果 o-- 読めなかったファイル
        メタデータのずれの確かめ ..> 文書のストア
        メタデータのずれの確かめ ..> metadataの列の欠け
        メタデータのずれの確かめ ..> 索引に無いファイル
        メタデータのずれの確かめ ..> メタデータのずれ : 返す
        class メタデータのずれの確かめ {
          <<function>>
        }
        class metadataの列の欠け {
          <<function>>
        }
        class 索引に無いファイル {
          <<function>>
        }
        class メタデータのずれ {
          <<dataclass>>
        }
        class 文書のストア {
          <<class>>
        }
        class スキーマの参照の解決 {
          <<function>>
        }
        class ファイルの収集 {
          <<function>>
        }
        class ファイルの読み込み {
          <<function>>
        }
        class メタデータの解決 {
          <<function>>
        }
        class 項目の取得 {
          <<function>>
        }
        class 文書 {
          <<dataclass>>
        }
        class 読み込みの結果 {
          <<dataclass>>
        }
        class 読めなかったファイル {
          <<dataclass>>
        }
data_models:
  - name: Document
    title: 文書
    container: features/documents/types.py
    usecase: 共通
    role: DTO
    summary: ファイル 1 つか `records` の要素 1 つから作った 1 件の文書
    description: '`dataclass(frozen=True)`。`data` は読み込みの結果を共有するので、書き換えるときは複製してから書き換える。'
    properties:
      - name: id
        title: 文書の ID
        type: str
        access: 公開
        description: メタデータの `id`。無ければ文書のファイルの配信元の直下からのパスから拡張子を除いた値
      - name: kind
        title: 種類
        type: str
        access: 公開
        description: 文書の行の ID（`documents[].id`）
      - name: source_id
        title: 配信元の ID
        type: str
        access: 公開
        description: '`ServedSource.id`'
      - name: path
        title: ファイル
        type: str
        access: 公開
        description: 文書を持つファイルの配信元の直下からのパス（`/` 区切り）
      - name: record_index
        title: 要素の位置
        type: int | None
        access: 公開
        description: '`records` の配列の中の位置。ファイル 1 つで 1 件の文書は `None`'
      - name: data
        title: 内容
        type: dict[str, Any]
        access: 公開
        description: ファイルか要素の内容
      - name: body
        title: 本文
        type: str
        access: 公開
        description: ファイルの内容か、要素を YAML に書き出した文字列。`body_file` のある要素は指したファイルの内容
      - name: body_path
        title: 本文のファイル
        type: str | None
        access: 公開
        description: '`body_file` が指したファイルの配信元の直下からのパス。無ければ `None`'
      - name: metadata
        title: メタデータ
        type: dict[str, Any]
        access: 公開
        description: '`metadata` の列名の対応で取った共通のキーの値（`METADATA_KEYS` のうち値のあるキー。`alias_type` は行の属性があればその値）'
      - name: version
        title: バージョン
        type: str
        access: 公開
        description: ファイル 1 つの文書はファイルの内容の『内容のハッシュ』、`records` の要素は要素の『値のハッシュ』
      - name: created
        title: 作成日時
        type: datetime | None
        access: 公開
        description: git の最初の commit の日時、無ければ文書の `created` の項目。どちらも無ければ `None`（並べ替えの末尾）
      - name: updated
        title: 更新日時
        type: datetime | None
        access: 公開
        description: git の最後の commit の日時、無ければ文書の `updated` の項目。どちらも無ければ `None`（並べ替えの末尾）
  - name: LoadProblem
    title: 読めなかったファイル
    container: features/documents/types.py
    usecase: 共通
    role: DTO
    summary: 文書にできなかったファイルと理由
    description: '`dataclass(frozen=True)`。検索・画面は `notes` と画面の知らせに出し、処理は止めない。'
    properties:
      - name: path
        title: ファイル
        type: str
        access: 公開
        description: 配信元の直下からのパス
      - name: reason
        title: 理由
        type: Literal['unreadable', 'duplicate_id', 'missing_body_file', 'not_mapping']
        access: 公開
        description: '`unreadable` は YAML として読めない、`duplicate_id` は先に読んだ文書と ID が重なる、`missing_body_file` は `body_file` の指すファイルが無い、`not_mapping` は文書にする値が辞書でない'
      - name: detail
        title: 詳細
        type: str
        access: 公開
        description: '`YamlLoadError` の位置と理由、重なった ID と先の文書のファイルなど'
      - name: line
        title: 行
        type: int | None
        access: 公開
        default: None
        description: '`unreadable` のときの `YamlLoadError.line`'
      - name: column
        title: 列
        type: int | None
        access: 公開
        default: None
        description: '`unreadable` のときの `YamlLoadError.column`'
  - name: LoadResult
    title: 読み込みの結果
    container: features/documents/types.py
    usecase: 共通
    role: DTO
    summary: 読めた文書と読めなかったファイル
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: documents
        title: 文書
        type: list[Document]
        access: 公開
        description: '`documents[]` の行の順、行の中はファイルのパスの昇順、ファイルの中は要素の順'
      - name: problems
        title: 読めなかったファイル
        type: list[LoadProblem]
        access: 公開
        description: ファイルのパスの昇順
  - name: SyncReport
    title: メタデータのずれ
    container: features/documents/types.py
    usecase: 起動
    role: DTO
    summary: 1 つの配信元の `metadata` の列の欠けと、管理用の YAML とファイルのずれ
    description: '`dataclass(frozen=True)`。配信元の状態には持たず、求めるたびに作る。'
    properties:
      - name: source_id
        title: 配信元の ID
        type: str
        access: 公開
        description: '`ServedSource.id`'
      - name: missing_refs
        title: '`metadata` の列の欠け'
        type: list[str]
        access: 公開
        default: '[]'
        description: '`{行の id}: {文書の id}: {キー}（{列名}）` の並び。`metadata` に書いた列だけを数える'
      - name: unindexed_files
        title: 索引に無いファイル
        type: list[str]
        access: 公開
        default: '[]'
        description: '`{行の id}: {ファイルのパス}` の並び'
      - name: missing_body_files
        title: ファイルが無い行
        type: list[str]
        access: 公開
        default: '[]'
        description: '読み込みの `missing_body_file` の `LoadProblem` の `{path}: {detail}` の並び'
constants:
  - name: METADATA_KEYS
    title: 共通のキー
    container: features/documents/fields.py
    usecase: 共通
    summary: '`documents[].metadata` で列名を対応づける共通のキー（エイリアスのキーを含む）'
    value: ("id", "name", "description", "tags", "related", "status", "alias_type", "aliases", "command", "cwd", "url", "avoid", "skill", "tool", "path", "port", "replacement")
  - name: CANDIDATE_COUNT
    title: 近い ID の候補の数
    container: features/documents/store.py
    usecase: 共通
    summary: 無い ID ごとに添える近い ID の数の上限
    value: '5'
  - name: CANDIDATE_CUTOFF
    title: 近さの下限
    container: features/documents/store.py
    usecase: 共通
    summary: 近い ID とみなす `difflib.get_close_matches` の `cutoff`
    value: '0.6'
  - name: SKIP_DIRS
    title: たどらないフォルダ
    container: features/documents/indexable.py
    usecase: 共通
    summary: ファイルをたどるときに中に入らないフォルダ名
    value: frozenset({".git", "node_modules", "__pycache__", ".venv"})
  - name: SKIP_PATHS
    title: たどらないパス
    container: features/documents/indexable.py
    usecase: 共通
    summary: ファイルをたどるときに中に入らないフォルダの `root` からのパス（配信元の設定の `worktrees` の既定と同じ場所）
    value: frozenset({".claude/worktrees"})
  - name: LOCK_FILES
    title: ロックファイルの名前
    container: features/documents/indexable.py
    usecase: 共通
    summary: 依存のロックファイルとみなすファイル名。末尾が `.lock` のファイルもロックとみなす
    value: frozenset({"package-lock.json", "pnpm-lock.yaml", "go.sum", "bun.lockb", "npm-shrinkwrap.json"})
  - name: VENDOR_DIRS
    title: ベンダー・生成物のフォルダ名
    container: features/documents/indexable.py
    usecase: 共通
    summary: パスの途中にこの名前のフォルダがあるファイルを、ベンダーのコードか生成物とみなす
    value: frozenset({"vendor", "third_party", "generated", "__generated__", "dist"})
  - name: GENERATED_SUFFIXES
    title: 生成物のファイル名の末尾
    container: features/documents/indexable.py
    usecase: 共通
    summary: ファイル名がこの末尾のファイルを生成物とみなす
    value: ("_pb2.py", "_pb2_grpc.py", ".min.js", ".min.css", ".map")
  - name: BINARY_SNIFF_BYTES
    title: バイナリの判定で読む長さ
    container: features/documents/indexable.py
    usecase: 共通
    summary: 先頭のこのバイト数に NUL バイトがあればバイナリとみなす
    value: '8192'
functions:
  - name: parse_field_path
    title: 項目のパスの分解
    kind: 関数
    container: features/documents/fields.py
    usecase: 共通
    role: 変換
    summary: ドット記法と `[n]` の項目のパスをキーと位置の並びにする
    scope: public
    thread_safe: true
    args:
      - name: path
        title: 項目のパス
        type: str
        required: true
        passing: positional
        description: '`a.b[0].c` の形の項目のパス'
    returns:
      type: list[str | int]
      description: 辞書のキーは `str`、配列の位置は `int`
    process: |-
      1. `.` で区切り、各区切りの末尾の `[n]` を位置として切り出す（`b[0][1]` は `b`・`0`・`1`）
      2. 空のキー・閉じていない `[`・数字でない位置がある場合、`InvalidArgumentError` を送る
      3. 並びを返す
    exceptions:
      - name: InvalidArgumentError
        condition: パスの書式が誤っている
        message: 項目のパス {path} の書き方が誤っています（例 `a.b[0].c`）
    unit_tests:
      - name: test_parse_field_path
        case: 正常
        summary: キーと位置
        condition: '`a.b[0][1].c`'
        mock: なし
        expected: '`["a", "b", 0, 1, "c"]`'
        exception: '-'
      - name: test_parse_field_path_when_invalid
        case: 異常
        summary: 空のキー
        condition: '`a..b` と `a[x]`'
        mock: なし
        expected: どちらも `InvalidArgumentError` で、`violations[0].path` が渡したパス
        exception: パスの書式が誤っている
  - name: get_field
    title: 項目の取得
    kind: 関数
    container: features/documents/fields.py
    usecase: 共通
    role: 読み取り
    summary: 項目のパスで指した値を返す
    scope: public
    thread_safe: true
    args:
      - name: data
        title: 内容
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 文書の内容
      - name: path
        title: 項目のパス
        type: str
        required: true
        passing: positional
        description: ドット記法と `[n]`
      - name: default
        title: 無いときの値
        type: Any
        required: false
        default: None
        passing: keyword
        description: 途中のキーが無い・位置が範囲の外・型が辞書や配列でないときに返す値
    returns:
      type: Any
      description: 指した値か `default`
    process: |-
      1. 『項目のパスの分解』で分ける
      2. 先頭からたどり、キーは辞書から、位置は配列から引く。たどれない場合は `default` を返す
      3. たどり着いた値を返す
    exceptions:
      - name: InvalidArgumentError
        condition: パスの書式が誤っている
        message: 『項目のパスの分解』のまま
    unit_tests:
      - name: test_get_field
        case: 正常
        summary: 入れ子と位置
        condition: '`{"a": {"b": [{"c": 1}]}}` を `a.b[0].c`'
        mock: なし
        expected: '`1`'
        exception: '-'
      - name: test_get_field_when_missing
        case: 正常
        summary: たどれない
        condition: 同じ内容を `a.x`・`a.b[3].c`・`a.b.c`
        mock: なし
        expected: どれも `None`
        exception: '-'
  - name: set_field
    title: 項目の書き込み
    kind: 関数
    container: features/documents/fields.py
    usecase: 共通
    role: 書き込み
    summary: 項目のパスで指した場所へ値を書く
    scope: public
    thread_safe: false
    side_effects: '`data` を書き換える'
    args:
      - name: data
        title: 内容
        type: MutableMapping[str, Any]
        required: true
        passing: positional
        description: 書き換える内容（往復編集の `CommentedMap` も受ける）
      - name: path
        title: 項目のパス
        type: str
        required: true
        passing: positional
        description: ドット記法と `[n]`
      - name: value
        title: 値
        type: Any
        required: true
        passing: positional
        description: 書く値
    returns:
      type: None
      description: '-'
    process: |-
      1. 『項目のパスの分解』で分ける
      2. 最後の手前までたどり、途中のキーが無ければ空の辞書を作って進む
      3. 途中の値が辞書でない（キーのとき）・配列でない（位置のとき）場合、`InvalidArgumentError` を送る
      4. 位置が配列の長さと同じなら末尾へ追加し、長さより大きければ `InvalidArgumentError` を送る
      5. 最後のキーか位置へ値を書く
    exceptions:
      - name: InvalidArgumentError
        condition: 途中の値の型が合わない
        message: '{path}: {途中のパス} は {辞書 / 配列} ではありません'
      - name: InvalidArgumentError
        condition: 位置が配列の長さを超える
        message: '{path}: 位置 {n} は配列の長さ {length} を超えています'
    unit_tests:
      - name: test_set_field
        case: 正常
        summary: 途中の辞書を作る
        condition: '`{}` へ `a.b.c` = `1`'
        mock: なし
        expected: '`{"a": {"b": {"c": 1}}}`'
        exception: '-'
      - name: test_set_field_when_append
        case: 正常
        summary: 末尾へ追加
        condition: '`{"a": [1]}` へ `a[1]` = `2`'
        mock: なし
        expected: '`{"a": [1, 2]}`'
        exception: '-'
      - name: test_set_field_when_type_mismatch
        case: 異常
        summary: 途中が文字列
        condition: '`{"a": "x"}` へ `a.b` = `1`'
        mock: なし
        expected: '`InvalidArgumentError`'
        exception: 途中の値の型が合わない
      - name: test_set_field_when_out_of_range
        case: 異常
        summary: 飛んだ位置
        condition: '`{"a": [1]}` へ `a[3]` = `2`'
        mock: なし
        expected: '`InvalidArgumentError`'
        exception: 位置が配列の長さを超える
  - name: delete_field
    title: 項目の削除
    kind: 関数
    container: features/documents/fields.py
    usecase: 共通
    role: 書き込み
    summary: 項目のパスで指した値を削除する
    scope: public
    thread_safe: false
    side_effects: '`data` を書き換える'
    args:
      - name: data
        title: 内容
        type: MutableMapping[str, Any]
        required: true
        passing: positional
        description: 書き換える内容
      - name: path
        title: 項目のパス
        type: str
        required: true
        passing: positional
        description: ドット記法と `[n]`
    returns:
      type: bool
      description: 削除したら `True`、指した値が無ければ `False`
    process: |-
      1. 『項目のパスの分解』で分ける
      2. 最後の手前までたどり、たどれない場合は `False` を返す
      3. 最後がキーなら辞書から、位置なら配列から削除して `True` を返す
    exceptions:
      - name: InvalidArgumentError
        condition: パスの書式が誤っている
        message: 『項目のパスの分解』のまま
    unit_tests:
      - name: test_delete_field
        case: 正常
        summary: キーと位置
        condition: '`{"a": {"b": 1}, "c": [1, 2]}` から `a.b` と `c[0]`'
        mock: なし
        expected: 'どちらも `True` で、`{"a": {}, "c": [2]}`'
        exception: '-'
      - name: test_delete_field_when_missing
        case: 正常
        summary: 無い値
        condition: '`{}` から `a.b`'
        mock: なし
        expected: '`False` で内容は変わらない'
        exception: '-'
  - name: resolve_metadata
    title: メタデータの解決
    kind: 関数
    container: features/documents/fields.py
    usecase: 共通
    role: 変換
    summary: 文書の行の `metadata` の対応で、文書の内容から共通のキーの値を取る
    scope: public
    thread_safe: true
    args:
      - name: data
        title: 内容
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 文書の内容
      - name: table
        title: 文書の行
        type: DocumentTable
        required: true
        passing: positional
        description: 文書の行
    returns:
      type: dict[str, Any]
      description: 共通のキー → 値。値が無いキーは含まない
    process: |-
      1. `METADATA_KEYS` のキーごとに、`table.metadata` の列名（書かれていないキーは同じ名前の列）の値を『項目の取得』で取る
      2. `table.alias_type` がある場合、`alias_type` の値をその値にする
      3. 値が `None` のキーを除いて返す
    unit_tests:
      - name: test_resolve_metadata
        case: 正常
        summary: 列名の対応と同じ名前の列
        condition: '`metadata` が `{name: title}`、行の `alias_type` が `term`、内容が `{"id": "a", "title": "A", "tags": ["x"]}`'
        mock: なし
        expected: '`{"id": "a", "name": "A", "tags": ["x"], "alias_type": "term"}`'
        exception: '-'
      - name: test_resolve_metadata_when_nested_field
        case: 正常
        summary: 入れ子の列
        condition: '`metadata` が `{description: meta.summary}`、内容が `{"meta": {"summary": "s"}}`'
        mock: なし
        expected: '`description` が `s`'
        exception: '-'
  - name: collect_files
    title: ファイルの収集
    kind: 関数
    container: features/documents/loader.py
    usecase: 共通
    role: 読み取り
    summary: 文書の行に当たるファイルを配信元の直下から集める
    scope: public
    thread_safe: true
    args:
      - name: root
        title: 読むフォルダ
        type: Path
        required: true
        passing: positional
        description: 配信元の直下に当たるフォルダ（作業ツリー・ワークツリー・リビジョンの書き出し）
      - name: table
        title: 文書の行
        type: DocumentTable
        required: true
        passing: positional
        description: 集める行（`paths`・`exclude`）
    returns:
      type: list[str]
      description: '`root` からのパス（`/` 区切り）の昇順。重複は含まない'
    process: |-
      1. 中をたどるファイルの列挙（`walk_files`）で `root` の配下のファイルを `root` からのパスで得る
      2. 文書の行.行に当たるかが `True` のパスを加える
      3. 昇順に並べて返す
    unit_tests:
      - name: test_collect_files
        case: 正常
        summary: glob で集める
        condition: '`a/x.yaml`・`a/b/y.yaml`・`a/z.md`・`.git/c.yaml` を置き、`paths: ["a/**/*.yaml"]` の行'
        mock: なし（`tmp_path`）
        expected: '`["a/b/y.yaml", "a/x.yaml"]`'
        exception: '-'
      - name: test_collect_files_when_overlapping_patterns
        case: 正常
        summary: 重なる glob
        condition: '`a/x.yaml` を置き、`paths: ["a/*.yaml", "**/x.yaml"]` の行'
        mock: なし（`tmp_path`）
        expected: '`["a/x.yaml"]`'
        exception: '-'
      - name: test_collect_files_when_excluded
        case: 正常
        summary: 除外の名前に当たるファイルを外す
        condition: '`a/x.md`・`a/README.md`・`a/b/README.md` を置き、`paths: ["a/**/*.md"]`・`exclude: [README.md]` の行'
        mock: なし（`tmp_path`）
        expected: '`["a/x.md"]`'
        exception: '-'
      - name: test_collect_files_when_worktrees
        case: 正常
        summary: ワークツリーのフォルダをたどらない
        condition: '`a/x.md`・`.claude/worktrees/wt/a/x.md`・`.claude/a.md` を置き、`paths: ["**/*.md"]` の行'
        mock: なし（`tmp_path`）
        expected: '`[".claude/a.md", "a/x.md"]`'
        exception: '-'
