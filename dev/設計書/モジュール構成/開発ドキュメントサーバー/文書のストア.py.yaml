title: "開発ドキュメントサーバー / 文書のストア"
lead: |-
  配信元の `documents[]` の行ごとにファイルを集め、ファイルか `records` の要素を 1 件の文書にして、メタデータ・バージョン・日時を付けて返す。
  読んだ文書はファイルの更新日時と大きさでキャッシュし、変わったファイルだけを読み直す。
directory: |
  ```text
  src/dev_docs/features/documents/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ types.py      # Document / LoadProblem / LoadResult / SyncReport / AliasEntry / MatchWord / AliasCollection
  ├─ fields.py     # ArraySelector / parse_field_path / get_field / set_field / delete_field / resolve_metadata / missing_ref_fields / is_markdown_body
  ├─ loader.py     # collect_files / load_file / unindexed_files（ファイルから文書を作る）
  ├─ indexable.py  # walk_files / is_excluded_file / indexable_files（たどるフォルダと載せるファイルの判定）
  ├─ schema.py     # resolve_schema_refs（種類のスキーマの $ref を解く）
  ├─ aliases.py    # alias_schema / alias_schema_version / check_alias_document / collect_aliases / match_words / term_ids（エイリアスのキーの検証と用語）
  └─ store.py      # DocumentStore（キャッシュ・ID の引き当て・種類のスキーマ・文書の場所）/ check_sync（メタデータのずれ）
  src/dev_docs/schemas/
  ├─ aliases.schema.yaml   # alias-inject の `schemas/aliases.schema.yaml`（エイリアスの元の行）の複製
  └─ aliases.source.yaml   # 取り込み元のリポジトリ・タグ・パス
  ```
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        文書のストア ..> ファイルの収集
        文書のストア ..> ファイルの読み込み
        文書のストア ..> 文書 : 返す
        文書のストア ..> 読み込みの結果 : 返す
        ファイルの読み込み ..> メタデータの解決
        文書のストア ..> スキーマの参照の解決
        メタデータの解決 ..> 項目の取得
        読み込みの結果 o-- 文書
        読み込みの結果 o-- 読めなかったファイル
        メタデータのずれの確かめ ..> 文書のストア
        メタデータのずれの確かめ ..> metadataの列の欠け
        メタデータのずれの確かめ ..> 索引に無いファイル
        メタデータのずれの確かめ ..> メタデータのずれ : 返す
        class メタデータのずれの確かめ {
          <<function>>
        }
        class metadataの列の欠け {
          <<function>>
        }
        class 索引に無いファイル {
          <<function>>
        }
        class メタデータのずれ {
          <<dataclass>>
        }
        class 文書のストア {
          <<class>>
        }
        class スキーマの参照の解決 {
          <<function>>
        }
        class ファイルの収集 {
          <<function>>
        }
        class ファイルの読み込み {
          <<function>>
        }
        class メタデータの解決 {
          <<function>>
        }
        class 項目の取得 {
          <<function>>
        }
        class 文書 {
          <<dataclass>>
        }
        class 読み込みの結果 {
          <<dataclass>>
        }
        class 読めなかったファイル {
          <<dataclass>>
        }
data_models:
  - name: Document
    title: 文書
    container: features/documents/types.py
    usecase: 共通
    role: DTO
    summary: ファイル 1 つか `records` の要素 1 つから作った 1 件の文書
    description: '`dataclass(frozen=True)`。`data` は読み込みの結果を共有するので、書き換えるときは複製してから書き換える。'
    properties:
      - name: id
        title: 文書の ID
        type: str
        access: 公開
        description: メタデータの `id`。無ければ文書のファイルの配信元の直下からのパスから拡張子を除いた値
      - name: kind
        title: 種類
        type: str
        access: 公開
        description: 文書の行の ID（`documents[].id`）
      - name: source_id
        title: 配信元の ID
        type: str
        access: 公開
        description: '`ServedSource.id`'
      - name: path
        title: ファイル
        type: str
        access: 公開
        description: 文書を持つファイルの配信元の直下からのパス（`/` 区切り）
      - name: record_index
        title: 要素の位置
        type: int | None
        access: 公開
        description: '`records` の配列の中の位置。ファイル 1 つで 1 件の文書は `None`'
      - name: data
        title: 内容
        type: dict[str, Any]
        access: 公開
        description: ファイルか要素の内容
      - name: body
        title: 本文
        type: str
        access: 公開
        description: ファイルの内容か、要素を YAML に書き出した文字列。`body_file` のある要素は指したファイルの内容
      - name: body_path
        title: 本文のファイル
        type: str | None
        access: 公開
        description: '`body_file` が指したファイルの配信元の直下からのパス。無ければ `None`'
      - name: metadata
        title: メタデータ
        type: dict[str, Any]
        access: 公開
        description: '`metadata` の列名の対応で取った共通のキーの値（`METADATA_KEYS` のうち値のあるキー。`alias_type` は行の属性があればその値）'
      - name: version
        title: バージョン
        type: str
        access: 公開
        description: ファイル 1 つの文書はファイルの内容の『内容のハッシュ』、`records` の要素は要素の『値のハッシュ』
      - name: created
        title: 作成日時
        type: datetime | None
        access: 公開
        description: git の最初の commit の日時、無ければ文書の `created` の項目。どちらも無ければ `None`（並べ替えの末尾）
      - name: updated
        title: 更新日時
        type: datetime | None
        access: 公開
        description: git の最後の commit の日時、無ければ文書の `updated` の項目。どちらも無ければ `None`（並べ替えの末尾）
  - name: LoadProblem
    title: 読めなかったファイル
    container: features/documents/types.py
    usecase: 共通
    role: DTO
    summary: 文書にできなかったファイルと理由
    description: '`dataclass(frozen=True)`。検索・画面は `notes` と画面の知らせに出し、処理は止めない。'
    properties:
      - name: path
        title: ファイル
        type: str
        access: 公開
        description: 配信元の直下からのパス
      - name: reason
        title: 理由
        type: Literal['unreadable', 'duplicate_id', 'missing_body_file', 'not_mapping']
        access: 公開
        description: '`unreadable` は YAML として読めない、`duplicate_id` は先に読んだ文書と ID が重なる、`missing_body_file` は `body_file` の指すファイルが無い、`not_mapping` は文書にする値が辞書でない'
      - name: detail
        title: 詳細
        type: str
        access: 公開
        description: '`YamlLoadError` の位置と理由、重なった ID と先の文書のファイルなど'
      - name: line
        title: 行
        type: int | None
        access: 公開
        default: None
        description: '`unreadable` のときの `YamlLoadError.line`'
      - name: column
        title: 列
        type: int | None
        access: 公開
        default: None
        description: '`unreadable` のときの `YamlLoadError.column`'
  - name: LoadResult
    title: 読み込みの結果
    container: features/documents/types.py
    usecase: 共通
    role: DTO
    summary: 読めた文書と読めなかったファイル
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: documents
        title: 文書
        type: list[Document]
        access: 公開
        description: '`documents[]` の行の順、行の中はファイルのパスの昇順、ファイルの中は要素の順'
      - name: problems
        title: 読めなかったファイル
        type: list[LoadProblem]
        access: 公開
        description: ファイルのパスの昇順
  - name: SyncReport
    title: メタデータのずれ
    container: features/documents/types.py
    usecase: 起動
    role: DTO
    summary: 1 つの配信元の `metadata` の列の欠けと、管理用の YAML とファイルのずれ
    description: '`dataclass(frozen=True)`。配信元の状態には持たず、求めるたびに作る。'
    properties:
      - name: source_id
        title: 配信元の ID
        type: str
        access: 公開
        description: '`ServedSource.id`'
      - name: missing_refs
        title: '`metadata` の列の欠け'
        type: list[str]
        access: 公開
        default: '[]'
        description: '`{行の id}: {文書の id}: {キー}（{列名}）` の並び。`metadata` に書いた列だけを数える'
      - name: unindexed_files
        title: 索引に無いファイル
        type: list[str]
        access: 公開
        default: '[]'
        description: '`{行の id}: {ファイルのパス}` の並び'
      - name: missing_body_files
        title: ファイルが無い行
        type: list[str]
        access: 公開
        default: '[]'
        description: '読み込みの `missing_body_file` の `LoadProblem` の `{path}: {detail}` の並び'
      - name: alias_violations
        title: エイリアスのキーの違反
        type: list[Violation]
        access: 公開
        default: '[]'
        description: エイリアスの集めの違反（`doc` に文書のパス）
  - name: ArraySelector
    title: 要素の選び方
    container: features/documents/fields.py
    usecase: 共通
    role: 値オブジェクト
    summary: 項目のパスの `[]`・`[{キー}]` が表す、配列から選ぶ要素
    properties:
      - name: key
        title: 真偽値のキー
        type: str | None
        access: 公開
        description: '`None` は全ての要素（`[]`）。文字列は、そのキーの値が真の辞書の要素（`[main]`）'
  - name: AliasEntry
    title: エイリアス
    container: features/documents/types.py
    usecase: 共通
    role: DTO
    summary: '`alias_type` を持つ行の文書 1 件のエイリアスのキーの値'
    description: '`dataclass(frozen=True, slots=True, kw_only=True)`。エイリアスのキーの検証に通った文書だけから作る。'
    properties:
      - name: id
        title: 文書の ID
        type: str
        access: 公開
        description: 用語の文書の ID
      - name: name
        title: 名前
        type: str
        access: 公開
        description: 共通のキー `name`
      - name: aliases
        title: 別名
        type: list[str]
        access: 公開
        default: '[]'
        description: '`aliases` を並びにしたもの。無ければ空'
      - name: description
        title: 説明
        type: str | None
        access: 公開
        default: None
        description: 共通のキー `description`
      - name: alias_type
        title: 引用の種類
        type: Literal['term', 'doc', 'command', 'url', 'skill', 'tool', 'path', 'env', 'avoid']
        access: 公開
        description: 行の `alias_type`
      - name: avoid
        title: やめた言い方
        type: list[str] | None
        access: 公開
        default: None
        description: '`avoid` を並びにしたもの。持たない文書は `None`'
      - name: extra
        title: ほかのエイリアスのキー
        type: dict[str, Any]
        access: 公開
        default: '{}'
        description: 取り込んだスキーマの `metadata` のキーのうち上の項目以外で値を持つもの（`related`・`command`・`cwd`・`url`・`skill`・`tool`・`path`・`port`・`replacement`）
  - name: MatchWord
    title: 照合する語
    container: features/documents/types.py
    usecase: 用語の一覧
    role: DTO
    summary: 照合する語と、語が指す文書の ID
    description: '`dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: word
        title: 語
        type: str
        access: 公開
        description: 文書の `name` か `aliases` の 1 要素
      - name: id
        title: 文書の ID
        type: str
        access: 公開
        description: 語が指す文書の ID
      - name: kind
        title: 語の出所
        type: Literal['name', 'alias']
        access: 公開
        description: '`name` から来たか `aliases` から来たか'
  - name: AliasCollection
    title: エイリアスの集め
    container: features/documents/types.py
    usecase: 共通
    role: DTO
    summary: 検証に通ったエイリアスと違反
    description: '`dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: entries
        title: エイリアス
        type: list[AliasEntry]
        access: 公開
        default: '[]'
        description: 検証に通った文書のエイリアス（文書を渡した順）
      - name: violations
        title: 違反
        type: list[Violation]
        access: 公開
        default: '[]'
        description: 検証に通らなかった文書の違反（`doc` に文書のパス）
      - name: has_alias_rows
        title: エイリアスの行があるか
        type: bool
        access: 公開
        default: 'False'
        description: 有効な documents の行に `alias_type` を持つ行があるか
constants:
  - name: METADATA_KEYS
    title: 共通のキー
    container: features/documents/fields.py
    usecase: 共通
    summary: '`documents[].metadata` で列名を対応づける共通のキー（エイリアスのキーを含む）'
    value: ("id", "name", "description", "tags", "main_tags", "related", "status", "alias_type", "aliases", "command", "cwd", "url", "avoid", "skill", "tool", "path", "port", "replacement")
  - name: CANDIDATE_COUNT
    title: 近い ID の候補の数
    container: features/documents/store.py
    usecase: 共通
    summary: 無い ID ごとに添える近い ID の数の上限
    value: '5'
  - name: CANDIDATE_CUTOFF
    title: 近さの下限
    container: features/documents/store.py
    usecase: 共通
    summary: 近い ID とみなす `difflib.get_close_matches` の `cutoff`
    value: '0.6'
  - name: SKIP_DIRS
    title: たどらないフォルダ
    container: features/documents/indexable.py
    usecase: 共通
    summary: ファイルをたどるときに中に入らないフォルダ名
    value: frozenset({".git", "node_modules", "__pycache__", ".venv"})
  - name: SKIP_PATHS
    title: たどらないパス
    container: features/documents/indexable.py
    usecase: 共通
    summary: ファイルをたどるときに中に入らないフォルダの `root` からのパス（配信元の設定の `worktrees` の既定と同じ場所）
    value: frozenset({".claude/worktrees"})
  - name: LOCK_FILES
    title: ロックファイルの名前
    container: features/documents/indexable.py
    usecase: 共通
    summary: 依存のロックファイルとみなすファイル名。末尾が `.lock` のファイルもロックとみなす
    value: frozenset({"package-lock.json", "pnpm-lock.yaml", "go.sum", "bun.lockb", "npm-shrinkwrap.json"})
  - name: VENDOR_DIRS
    title: ベンダー・生成物のフォルダ名
    container: features/documents/indexable.py
    usecase: 共通
    summary: パスの途中にこの名前のフォルダがあるファイルを、ベンダーのコードか生成物とみなす
    value: frozenset({"vendor", "third_party", "generated", "__generated__", "dist"})
  - name: GENERATED_SUFFIXES
    title: 生成物のファイル名の末尾
    container: features/documents/indexable.py
    usecase: 共通
    summary: ファイル名がこの末尾のファイルを生成物とみなす
    value: ("_pb2.py", "_pb2_grpc.py", ".min.js", ".min.css", ".map")
  - name: BINARY_SNIFF_BYTES
    title: バイナリの判定で読む長さ
    container: features/documents/indexable.py
    usecase: 共通
    summary: 先頭のこのバイト数に NUL バイトがあればバイナリとみなす
    value: '8192'
  - name: ALIAS_SCHEMA_PATH
    title: 取り込んだエイリアスのスキーマ
    container: features/documents/aliases.py
    usecase: 共通
    summary: 配布に同梱する alias-inject の「エイリアスの元の行」のスキーマのパス（`importlib.resources` で引く）。alias-inject の `schemas/aliases.schema.yaml` を書き換えずに置く
    value: '"schemas/aliases.schema.yaml"'
  - name: ALIAS_SOURCE_PATH
    title: エイリアスのスキーマの取り込み元
    container: features/documents/aliases.py
    usecase: 共通
    summary: 取り込み元を記録したファイルのパス。`repository`（`shuhei1101/alias-inject`）・`tag`（`v0.3.0`）・`path`（`schemas/aliases.schema.yaml`）を持つ。スキーマを取り込み直すときに一緒に書き換える
    value: '"schemas/aliases.source.yaml"'
  - name: ALIAS_REQUIRED_KEYS
    title: 引用の種類ごとの必須のキー
    container: features/documents/aliases.py
    usecase: 共通
    summary: 取り込んだスキーマの `metadata` の各キーの説明に書かれた必須を、引用の種類ごとに並べたもの。`env` の `("url", "port")` は 1 つ以上が必須
    value: '{"term": ("id", "name", "description"), "doc": ("id", "name", "description"), "command": ("id", "name", "command"), "url": ("id", "name", "url"), "skill": ("id", "name", "skill"), "tool": ("id", "name", "tool"), "path": ("id", "name", "path"), "env": ("id", "name", ("url", "port")), "avoid": ("id", "name", "replacement")}'
  - name: ALIAS_LIST_KEYS
    title: 文字列か文字列の並びのキー
    container: features/documents/aliases.py
    usecase: 共通
    summary: 値に文字列か文字列の並びを許すエイリアスのキー。返すときは文字列 1 つを要素 1 つの並びにする
    value: ("aliases", "avoid")
functions:
  - name: parse_field_path
    title: 項目のパスの分解
    kind: 関数
    container: features/documents/fields.py
    usecase: 共通
    role: 変換
    summary: ドット記法・`[n]`・`[]`・`[{キー}]` の項目のパスを、キー・位置・要素の選び方の並びにする
    scope: public
    thread_safe: true
    args:
      - name: path
        title: 項目のパス
        type: str
        required: true
        passing: positional
        description: '`a.b[0].c`・`tags[].name`・`tags[main].name` の形の項目のパス'
    returns:
      type: list[str | int | ArraySelector]
      description: 辞書のキーは `str`、配列の位置は `int`、`[]`・`[{キー}]` は `ArraySelector`
    process: |-
      1. `.` で区切り、各区切りの末尾の `[...]` を切り出す（`b[0][1]` は `b`・`0`・`1`）
      2. `[n]` は位置、`[]` は `ArraySelector(key=None)`、`[{キー}]`（英字で始まる英数字と `_`）は `ArraySelector(key={キー})` にする
      3. 空のキー・閉じていない `[`・位置にもキーにも当たらない中身がある場合、`InvalidArgumentError` を送る
      4. 並びを返す
    exceptions:
      - name: InvalidArgumentError
        condition: パスの書式が誤っている
        message: 項目のパス {path} の書き方が誤っています（例 `a.b[0].c`・`tags[].name`・`tags[main].name`）
    unit_tests:
      - name: test_parse_field_path
        case: 正常
        summary: キーと位置
        condition: '`a.b[0][1].c`'
        mock: なし
        expected: '`["a", "b", 0, 1, "c"]`'
        exception: '-'
      - name: test_parse_field_path_when_selector
        case: 正常
        summary: 全ての要素と真偽値のキーで選ぶ要素
        condition: '`tags[].name` と `tags[main].name`'
        mock: なし
        expected: '`["tags", ArraySelector(key=None), "name"]` と `["tags", ArraySelector(key="main"), "name"]`'
        exception: '-'
      - name: test_parse_field_path_when_invalid
        case: 異常
        summary: 空のキー
        condition: '`a..b` と `a[x-y]`'
        mock: なし
        expected: どちらも `InvalidArgumentError` で、`violations[0].path` が渡したパス
        exception: パスの書式が誤っている
  - name: get_field
    title: 項目の取得
    kind: 関数
    container: features/documents/fields.py
    usecase: 共通
    role: 読み取り
    summary: 項目のパスで指した値を返す
    scope: public
    thread_safe: true
    args:
      - name: data
        title: 内容
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 文書の内容
      - name: path
        title: 項目のパス
        type: str
        required: true
        passing: positional
        description: ドット記法・`[n]`・`[]`・`[{キー}]`
      - name: default
        title: 無いときの値
        type: Any
        required: false
        default: None
        passing: keyword
        description: 途中のキーが無い・位置が範囲の外・型が辞書や配列でないときに返す値
    returns:
      type: Any
      description: 指した値か `default`。パスが `ArraySelector` を含むときは、選んだ要素ごとに残りのパスをたどった値の配列（たどれない要素は除く）
    process: |-
      1. 『項目のパスの分解』で分ける
      2. 先頭からたどり、キーは辞書から、位置は配列から引く。たどれない場合は `default` を返す
      3. `ArraySelector` に当たった場合、値が配列でなければ `default` を返す。配列なら、`key` が `None` は全ての要素、`key` があればそのキーの値が真の辞書の要素を選び、要素ごとに残りのパスをたどった値を並べた配列を返す（残りのパスに `ArraySelector` があれば、その配列を平らにつなぐ）
      4. たどり着いた値を返す
    exceptions:
      - name: InvalidArgumentError
        condition: パスの書式が誤っている
        message: 『項目のパスの分解』のまま
    unit_tests:
      - name: test_get_field
        case: 正常
        summary: 入れ子と位置
        condition: '`{"a": {"b": [{"c": 1}]}}` を `a.b[0].c`'
        mock: なし
        expected: '`1`'
        exception: '-'
      - name: test_get_field_when_missing
        case: 正常
        summary: たどれない
        condition: 同じ内容を `a.x`・`a.b[3].c`・`a.b.c`
        mock: なし
        expected: どれも `None`
        exception: '-'
      - name: test_get_field_when_selector
        case: 正常
        summary: 要素を選んで取り出す
        condition: '`{"tags": [{"name": "a", "main": true}, {"name": "b"}, "c"]}` を `tags[].name` と `tags[main].name`、`{"tags": "x"}` を `tags[].name`'
        mock: なし
        expected: '`["a", "b"]`・`["a"]`・`None`'
        exception: '-'
  - name: set_field
    title: 項目の書き込み
    kind: 関数
    container: features/documents/fields.py
    usecase: 共通
    role: 書き込み
    summary: 項目のパスで指した場所へ値を書く
    scope: public
    thread_safe: false
    side_effects: '`data` を書き換える'
    args:
      - name: data
        title: 内容
        type: MutableMapping[str, Any]
        required: true
        passing: positional
        description: 書き換える内容（往復編集の `CommentedMap` も受ける）
      - name: path
        title: 項目のパス
        type: str
        required: true
        passing: positional
        description: ドット記法と `[n]`
      - name: value
        title: 値
        type: Any
        required: true
        passing: positional
        description: 書く値
    returns:
      type: None
      description: '-'
    process: |-
      1. 『項目のパスの分解』で分ける。`ArraySelector` を含む場合、`InvalidArgumentError` を送る
      2. 最後の手前までたどり、途中のキーが無ければ空の辞書を作って進む
      3. 途中の値が辞書でない（キーのとき）・配列でない（位置のとき）場合、`InvalidArgumentError` を送る
      4. 位置が配列の長さと同じなら末尾へ追加し、長さより大きければ `InvalidArgumentError` を送る
      5. 最後のキーか位置へ値を書く
    exceptions:
      - name: InvalidArgumentError
        condition: 途中の値の型が合わない
        message: '{path}: {途中のパス} は {辞書 / 配列} ではありません'
      - name: InvalidArgumentError
        condition: 位置が配列の長さを超える
        message: '{path}: 位置 {n} は配列の長さ {length} を超えています'
      - name: InvalidArgumentError
        condition: パスが `[]`・`[{キー}]` を含む
        message: '{path}: `[]`・`[{キー}]` を含む項目のパスには書き込めません'
    unit_tests:
      - name: test_set_field
        case: 正常
        summary: 途中の辞書を作る
        condition: '`{}` へ `a.b.c` = `1`'
        mock: なし
        expected: '`{"a": {"b": {"c": 1}}}`'
        exception: '-'
      - name: test_set_field_when_append
        case: 正常
        summary: 末尾へ追加
        condition: '`{"a": [1]}` へ `a[1]` = `2`'
        mock: なし
        expected: '`{"a": [1, 2]}`'
        exception: '-'
      - name: test_set_field_when_type_mismatch
        case: 異常
        summary: 途中が文字列
        condition: '`{"a": "x"}` へ `a.b` = `1`'
        mock: なし
        expected: '`InvalidArgumentError`'
        exception: 途中の値の型が合わない
      - name: test_set_field_when_out_of_range
        case: 異常
        summary: 飛んだ位置
        condition: '`{"a": [1]}` へ `a[3]` = `2`'
        mock: なし
        expected: '`InvalidArgumentError`'
        exception: 位置が配列の長さを超える
      - name: test_set_field_when_selector
        case: 異常
        summary: 要素の選び方を含むパス
        condition: '`{"tags": []}` へ `tags[].name` = `a`'
        mock: なし
        expected: '`InvalidArgumentError`'
        exception: パスが `[]`・`[{キー}]` を含む
  - name: delete_field
    title: 項目の削除
    kind: 関数
    container: features/documents/fields.py
    usecase: 共通
    role: 書き込み
    summary: 項目のパスで指した値を削除する
    scope: public
    thread_safe: false
    side_effects: '`data` を書き換える'
    args:
      - name: data
        title: 内容
        type: MutableMapping[str, Any]
        required: true
        passing: positional
        description: 書き換える内容
      - name: path
        title: 項目のパス
        type: str
        required: true
        passing: positional
        description: ドット記法と `[n]`
    returns:
      type: bool
      description: 削除したら `True`、指した値が無ければ `False`
    process: |-
      1. 『項目のパスの分解』で分ける。`ArraySelector` を含む場合、`InvalidArgumentError` を送る
      2. 最後の手前までたどり、たどれない場合は `False` を返す
      3. 最後がキーなら辞書から、位置なら配列から削除して `True` を返す
    exceptions:
      - name: InvalidArgumentError
        condition: パスの書式が誤っている
