      - name: test_load_file_when_records
        case: 正常
        summary: records と body_file
        condition: '`src/files.yaml` が `files: [{path: a.py, tags: [x]}, {path: b.py}]`、`src/a.py`・`src/b.py` を置き、行は `records: files`・`body_file: path`'
        mock: なし（`tmp_path`）
        expected: 2 件で、`id` が `src/a`・`src/b`、`body` が各ファイルの内容、`body_path` が `src/a.py`・`src/b.py`、`record_index` が 0・1、`version` が要素の『値のハッシュ』
