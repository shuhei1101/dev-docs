constants:
  - name: MDMARK_URL
    title: mdmark の読み込み元
    container: features/view/page.py
    usecase: 文書の画面
    summary: 画面のスクリプトが読む mdmark の配布物（GitHub のタグを固定した jsDelivr）
    value: '"https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@v0.8.0/dist/index.js"'
  - name: SEARCH_QUERY_MAX
    title: 検索の語の文字数の上限
    container: features/view/search.py
    usecase: 画面の検索
    summary: '`q` の文字数の上限'
    value: '200'
  - name: SEARCH_LIMIT_DEFAULT
    title: 画面の検索の件数の既定
    container: features/view/search.py
    usecase: 画面の検索
    summary: '`limit` を省いたときの件数'
    value: '20'
  - name: SEARCH_LIMIT_MAX
    title: 画面の検索の件数の上限
    container: features/view/search.py
    usecase: 画面の検索
    summary: '`limit` の上限'
    value: '100'
  - name: SNIPPETS_PER_DOC
    title: 文書ごとの一致した箇所の数
    container: features/view/search.py
    usecase: 画面の検索
    summary: '`items[].snippets` の上限'
    value: '3'
  - name: REFS_COMMITS_DEFAULT
    title: 最近の commit の数の既定
    container: features/view/route.py
    usecase: リビジョンの一覧
    summary: '`commits` を省いたときの数'
    value: '20'
  - name: REFS_COMMITS_MAX
    title: 最近の commit の数の上限
    container: features/view/route.py
    usecase: リビジョンの一覧
    summary: '`commits` の上限'
    value: '100'
  - name: COLUMNS_DIR
    title: 表の列の設定のフォルダ
    container: features/view/columns.py
    usecase: 表の列の設定の保存
    summary: '`state_dir` の下の、配信元ごとの列の設定（`{source}.json`）を置くフォルダ'
    value: '"columns"'
  - name: PAGE_STATE_ID
    title: 画面の状態の要素の ID
    container: features/view/page.py
    usecase: 共通
    summary: 画面の状態を埋め込む `<script type="application/json">` の `id`
    value: '"page-state"'
data_models:
  - name: ScreenPath
    title: 画面のパス
    container: features/view/types.py
    usecase: 文書の画面
    role: DTO
    summary: '`/{source}[@{ref}]/{path}` を分けたもの'
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: source_id
        title: 配信元の ID
        type: str
        access: 公開
        description: '`@` より前'
      - name: ref
        title: リビジョン
        type: str | None
        access: 公開
        description: '`@` より後（URL のデコード後）。無ければ `None`'
      - name: page
        title: 文書のページのパス
        type: str
        access: 公開
        description: 末尾の `/` を除いた残り。空は配信元のトップ
  - name: NavLink
    title: サイドバーの文書
    container: features/view/types.py
    usecase: 文書の画面
    role: DTO
    summary: サイドバーの 1 行
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: title
        title: 名前
        type: str
        access: 公開
        description: '`title` の上書きか、文書のメタデータの `name`、無ければ ID'
      - name: page
        title: 文書のページのパス
        type: str
        access: 公開
        description: 文書のページのパス
  - name: NavGroup
    title: サイドバーの見出し
    container: features/view/types.py
    usecase: 文書の画面
    role: DTO
    summary: 見出しと、その下の行・入れ子の見出し
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: title
        title: 見出し
        type: str | None
        access: 公開
        description: '`None` は見出しを出さない（タブの直下の行）'
      - name: links
        title: 文書
        type: list[NavLink]
        access: 公開
        description: 見出しの下の文書
      - name: groups
        title: 入れ子の見出し
        type: list[NavGroup]
        access: 公開
        description: '`group` の入れ子と `auto` の `group_by`'
  - name: NavTab
    title: 種類のタブ
    container: features/view/types.py
    usecase: 文書の画面
    role: DTO
    summary: 上のタブ 1 つとそのサイドバー
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: title
        title: タブの名前
        type: str
        access: 公開
        description: '`nav.tabs[].title`。nav が無ければ文書の行の `title`（無ければ `id`）'
      - name: sidebar
        title: サイドバー
        type: NavGroup
        access: 公開
        description: 見出しの無い根の見出し
  - name: PageState
    title: 画面の状態
    container: features/view/types.py
    usecase: 共通
    role: DTO
    summary: 画面のスクリプトへ JSON で埋め込む値
    description: '`dataclass(frozen=True)`。見つからない画面は `doc` に関わる値を空にして同じ形で埋め込む。'
    properties:
      - name: source_id
        title: 配信元の ID
        type: str | None
        access: 公開
        description: 開いている配信元。配信元が無い見つからない画面は `None`
      - name: sources
        title: 配信元のメニュー
        type: 'list[dict[str, str]]'
        access: 公開
        description: '配信中の配信元の `{id, title}`（`title` は設定の `name`）'
      - name: git
        title: Git の配信元か
        type: bool
        access: 公開
        description: '`False` のときはリビジョンの切り替えを出さない'
      - name: ref
        title: リビジョンの表示
        type: str | None
        access: 公開
        description: '`@{ref}` の値。無ければ `default_ref` の名前（Git 管理外は `None`）'
      - name: ref_in_url
        title: URL のリビジョン
        type: str | None
        access: 公開
        description: '`@{ref}` で開いたときだけ。リンクと検索に同じリビジョンを付ける'
      - name: default_ref
        title: 既定のリビジョン
        type: str | None
        access: 公開
        description: 配信元の `default_ref`
      - name: doc_page
        title: 文書のページのパス
        type: str | None
        access: 公開
        description: 開いている文書。コメントの場所と Issue のタイトルに使う
      - name: diff
        title: 差分
        type: dict[str, str] | None
        access: 公開
        description: '`?diff=` のときの `{ref, commit, date, current_commit, current_date}`'
      - name: github_repository
        title: GitHub のリポジトリ
        type: str | None
        access: 公開
        description: '`None` は Issue を起票のボタンを出さない'
      - name: issue_labels
        title: 起票のラベル
        type: list[str]
        access: 公開
        description: '`github.issue_labels`'
      - name: table_keys
        title: 表のキー
        type: list[str]
        access: 公開
        description: 変換の結果の `table_keys`
      - name: hidden_columns
        title: 隠す列
        type: dict[str, list[str]]
        access: 公開
        description: 表のキー → 隠す列（この配信元の表の列の設定）
  - name: ScreenSearchItem
    title: 画面の検索の結果の文書
    container: features/view/types.py
    usecase: 画面の検索
    role: DTO
    summary: '`items[]` の 1 件'
    description: '`pydantic.BaseModel`。'
    properties:
      - name: path
        title: 文書のページのパス
        type: str
        access: 公開
        description: '`/{source}[@{ref}]/` に続ける形'
      - name: name
        title: 名前
        type: str
        access: 公開
        description: メタデータの `name`、無ければ ID
      - name: snippets
        title: 一致した箇所
        type: list[str]
        access: 公開
        description: '`SNIPPETS_PER_DOC` 件まで'
  - name: ScreenSearchResult
    title: 画面の検索の結果
    container: features/view/types.py
    usecase: 画面の検索
    role: DTO
    summary: GET `/_api/sources/{source}/search` の応答
    description: '`pydantic.BaseModel`。'
    properties:
      - name: total_count
        title: 総件数
        type: int
        access: 公開
        description: 一致した文書の数
      - name: items
        title: 文書
        type: list[ScreenSearchItem]
        access: 公開
        description: '`limit` 件まで'
  - name: ColumnsRequest
    title: 表の列の設定の保存の要求
    container: features/view/types.py
    usecase: 表の列の設定の保存
    role: DTO
    summary: PUT `/_api/sources/{source}/columns` の本文と応答
    description: '`pydantic.BaseModel`（`extra="forbid"`）。応答も同じ形。'
    properties:
      - name: table
        title: 表のキー
        type: str
        access: 公開
        description: '`{種類}:{項目のパス}` か `{種類}:table[{n}]`（変換の『表の組み立て』）。1 文字以上'
      - name: hidden
        title: 隠す列
        type: list[str]
        access: 公開
        description: 空なら全ての列を出す
classes:
  - name: ColumnSettings
    title: 表の列の設定
    container: features/view/columns.py
    usecase: 表の列の設定の保存
    role: リポジトリ
    summary: 配信元・表ごとの隠す列を `state_dir` の JSON に読み書きする
    properties:
      - name: dir
        title: フォルダ
        type: Path
        access: 公開
        description: '`{state_dir}/{COLUMNS_DIR}`'
      - name: _lock
        title: 書き込みの排他
        type: threading.Lock
        access: 内部 (_)
        description: 読んで書き戻す間を 1 つずつにする
    methods:
      - name: get
        title: 列の設定を読む
        kind: メソッド
        summary: 配信元の表のキー → 隠す列を返す
        scope: public
        thread_safe: true
        args:
          - name: source_id
            title: 配信元の ID
            type: str
            required: true
            passing: positional
            description: 配信元
        returns:
          type: dict[str, list[str]]
          description: ファイルが無い・読めないときは空（読めないときは `[warning]` 列の設定を読めない（パス・理由）を書く）
        process: 1. `{dir}/{source_id}.json` を読んで返す
      - name: save
        title: 列の設定を書く
        kind: メソッド
        summary: 1 つの表の隠す列を書き、他の表の設定は残す
        scope: public
        thread_safe: true
        side_effects: '`{dir}/{source_id}.json` を書き換える'
        args:
          - name: source_id
            title: 配信元の ID
            type: str
            required: true
            passing: positional
            description: 配信元
          - name: table
            title: 表のキー
            type: str
            required: true
            passing: positional
            description: 書く表
          - name: hidden
            title: 隠す列
            type: list[str]
            required: true
            passing: positional
            description: 空なら表のキーを消す
        returns:
          type: None
          description: '-'
        process: |-
          1. ロックを握り、今の設定を読む
          2. `hidden` が空なら表のキーを消し、そうでなければ重複を除いて置く
          3. フォルダを作り、ファイルの置き換え（共通）で書く
        unit_tests:
          - name: test_save
            case: 正常
            summary: 他の表を残す
            condition: '`a:x` を書いた後に `a:y` を書き、`a:x` を空で書く'
            mock: なし（一時フォルダ）
            expected: '`get` が `{"a:y": [...]}`'
functions:
  - name: parse_screen_path
    title: 画面のパスの分解
    kind: 関数
    container: features/view/paths.py
    usecase: 文書の画面
    role: 変換
    summary: ルートの `{source_part}` と `{page}` を画面のパスにする
    scope: public
    thread_safe: true
    args:
      - name: source_part
        title: 配信元の部分
        type: str
        required: true
        passing: positional
        description: '`{source}` か `{source}@{ref}`'
      - name: page
        title: 残り
        type: str
        required: true
        passing: positional
        description: パスの残り（空を含む）
    returns:
      type: ScreenPath
      description: 画面のパス
    process: |-
      1. 最初の `@` で分ける。`@` の後ろが空なら `ref` を `None` にする
      2. `page` の前後の `/` を除く
    unit_tests:
      - name: test_parse_screen_path
        case: 正常
        summary: リビジョンつき
        condition: '`("sample@feat/a", "docs/x/")`'
        mock: なし
        expected: '`ScreenPath("sample", "feat/a", "docs/x")`'
  - name: page_path
    title: 文書のページのパス
    kind: 関数
    container: features/view/paths.py
    usecase: 文書の画面
    role: 変換
    summary: 文書を URL のパスにする
    scope: public
    thread_safe: true
    args:
      - name: document
        title: 文書
        type: Document
        required: true
        passing: positional
        description: 文書
    returns:
      type: str
      description: '`path` から拡張子を落とした形。`records` の文書は `{拡張子を落とした path}/{id}`'
    process: 1. `PurePosixPath(path).with_suffix("")` にし、`record_index` があれば `/{id}` を続ける
    unit_tests:
      - name: test_page_path
        case: 正常
        summary: ファイルと records
        condition: '`docs/a.yaml` の文書と、`docs/rules.yaml` の `records` の `r-1`'
        mock: なし
        expected: '`docs/a` と `docs/rules/r-1`'
  - name: find_page
    title: 文書のページの特定
    kind: 関数
    container: features/view/paths.py
    usecase: 文書の画面
    role: 判定
    summary: 文書のページのパスに当たる文書を探す
    scope: public
    thread_safe: true
    args:
      - name: documents
        title: 文書
        type: Sequence[Document]
        required: true
        passing: positional
        description: 配信元の文書
      - name: page
        title: 文書のページのパス
        type: str
        required: true
        passing: positional
        description: 探すパス
    returns:
      type: Document | None
      description: 無ければ `None`
    process: 1. 文書のページのパスが `page` と同じ文書を返す
  - name: screen_target
    title: 画面の読む場所
    kind: 関数
    container: features/view/paths.py
    usecase: 文書の画面
    role: 判定
    summary: 画面のパスの配信元とリビジョンから読む場所を作る
    scope: public
    thread_safe: true
    args:
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 配信中の配信元
      - name: source_id
        title: 配信元の ID
        type: str
        required: true
        passing: positional
        description: 開く配信元
      - name: ref
        title: リビジョン
        type: str | None
        required: true
        passing: positional
        description: '`@{ref}` の値'
    returns:
      type: tuple[Target, ResolvedRef | None]
      description: 読む場所と、Git の配信元のとき解いたリビジョン
    process: |-
      1. 配信元を引く（配信元の一覧.引く。`UnknownSourceError`・`SourceNotServedError` はそのまま伝える）
      2. Git 管理外の配信元は `ref` を無視し、`root` を `ref` なしで読む場所にする（`access` は `read`。画面は `127.0.0.1` だけで待ち受けるので作業場所の権限を見ない）
      3. Git の配信元は、`ref`（無ければ `default_ref`）をリビジョンの解決で解き、`root` をその commit で読む場所にする
    exceptions:
      - name: UnknownSourceError
        condition: 無い配信元
        message: '`配信元がありません: {id}`'
      - name: SourceNotServedError
        condition: 配信していない配信元
        message: '`{id} は配信していません`'
      - name: RefNotFoundError
        condition: 解決できないリビジョン
        message: '`ref を解決できません: {value}`'
    unit_tests:
      - name: test_screen_target
        case: 正常
        summary: 既定のリビジョン
        condition: Git の配信元で `ref=None`
        mock: なし（一時フォルダのリポジトリ）
        expected: '`Target.ref` が `default_ref` の commit'
      - name: test_screen_target_when_not_git
        case: 正常
        summary: Git 管理外
        condition: Git 管理外の配信元で `ref="main"`
        mock: なし
        expected: '`Target.ref` が `None` で、解いたリビジョンが `None`'
  - name: breadcrumbs
    title: パンくず
    kind: 関数
    container: features/view/paths.py
    usecase: 文書の画面
    role: 変換
    summary: 文書のページのパスを階層ごとの名前とリンク先にする
    scope: public
    thread_safe: true
    args:
      - name: page
        title: 文書のページのパス
        type: str
        required: true
        passing: positional
        description: 開いている文書
      - name: pages
        title: サイドバーの順の文書のページのパス
        type: Sequence[str]
        required: true
        passing: positional
        description: タブとサイドバーの組み立ての全ての行の順
    returns:
      type: list[tuple[str, str | None]]
      description: (名前, リンク先)。末尾のリンク先は `None`
    process: 1. `/` で分けた階層ごとに、その階層の下でサイドバーの順の最初の文書をリンク先にする（無ければ `None`）
  - name: build_nav
    title: タブとサイドバーの組み立て
    kind: 関数
    container: features/view/nav.py
    usecase: 文書の画面
    role: 変換
    summary: 配信元の `nav` と文書から、上のタブとサイドバーを作る
    scope: public
    thread_safe: true
    args:
      - name: source
        title: 配信中の配信元
        type: ServedSource
        required: true
        passing: positional
        description: '`config.nav` と文書の行を読む'
      - name: documents
        title: 文書
        type: Sequence[Document]
        required: true
        passing: positional
        description: 読む場所の文書
    returns:
      type: list[NavTab]
      description: タブの並び
    process: |-
      1. `nav` が無い場合、有効な文書の行ごとに 1 つのタブを作り、`auto: {document: 行の id}` と同じ並びにする
      2. `nav.tabs[]` ごとに `items[]` を上から次のように読む
         - `group` は見出しを作り、子の `items[]` を同じ読み方で入れ子にする
         - `page` は、文書の行が 1 ファイルだけならその文書、`{行の id}/{文書の ID}` ならその文書の行にする。無い文書は飛ばし、`[warning]` nav の文書が無い（配信元・値）を書く
         - `auto` は `document` の行の文書を文書のページのパスの昇順で並べる。`group_by` があれば、その項目のパスの値（配列は要素ごと、無ければ `その他`）ごとの見出しにする
         - `title` があれば行の名前を上書きする
      3. タブの並びを返す
    unit_tests:
      - name: test_build_nav
        case: 正常
        summary: group・page・auto
        condition: 'A-25 の例の `nav`（`auto: {document: rules, group_by: tags.lang}`・`group: アーキテクチャ`・`page: architecture`）'
        mock: なし
        expected: 3 つのタブ。規約のタブは `tags.lang` の値ごとの見出し、設計書のタブは見出し `アーキテクチャ` の下に architecture
      - name: test_build_nav_when_no_nav
        case: 正常
        summary: nav が無い
        condition: 文書の行が 2 つで `nav` が無い
        mock: なし
        expected: 行ごとに 2 つのタブ
  - name: first_page
    title: タブの最初の文書
    kind: 関数
    container: features/view/nav.py
    usecase: 文書の画面
    role: 判定
    summary: タブのサイドバーの一番上の文書のページのパスを返す
    scope: public
    thread_safe: true
    args:
      - name: tab
        title: タブ
        type: NavTab
        required: true
        passing: positional
        description: 調べるタブ
    returns:
      type: str | None
      description: 文書が無いタブは `None`
    process: 1. 見出しの `links` と入れ子の `groups` を表示の順（`links` が先）にたどり、最初の行を返す
  - name: screen_search
    title: 画面の検索
    kind: 関数
    container: features/view/search.py
    usecase: 画面の検索
    role: サービス
    summary: 語を全て含む文書と一致した箇所を返す
    scope: public
    thread_safe: true
    args:
      - name: documents
        title: 文書
        type: Sequence[Document]
        required: true
        passing: positional
        description: '読む場所の文書（`search: false` の行の文書を除いたもの）'
      - name: q
        title: 検索する語
        type: str
        required: true
        passing: positional
        description: 1〜`SEARCH_QUERY_MAX` 文字（入口が確かめる）
      - name: limit
        title: 件数
        type: int
        required: true
        passing: positional
        description: 1〜`SEARCH_LIMIT_MAX`
    returns:
      type: ScreenSearchResult
      description: 文書のページのパスの昇順
    process: |-
      1. `q` を NFKC と `casefold` をして空白で分ける
      2. 語の照合に当たる文書を文書のページのパスの昇順に並べ、総件数を数える
      3. 先頭から `limit` 件を、本文の一致した箇所の抜き出し（前後 1 行、`SNIPPETS_PER_DOC` 件）つきで返す
    unit_tests:
      - name: test_screen_search
        case: 正常
        summary: 全ての語を含む文書だけ
        condition: '`q="foo bar"`、foo と bar を含む文書 1 つと foo だけの文書 1 つ'
        mock: なし
        expected: '`total_count` が 1、`snippets` に foo か bar を含む行'
  - name: build_page_state
    title: 画面の状態
    kind: 関数
    container: features/view/page.py
    usecase: 共通
    role: 変換
    summary: 画面のスクリプトへ埋め込む値を作る
    scope: public
    thread_safe: true
    args:
      - name: handlers
        title: 配線済みの関数
        type: Handlers
        required: true
        passing: injected
        description: 配信元の一覧・表の列の設定
      - name: source
        title: 配信中の配信元
        type: ServedSource | None
        required: true
        passing: positional
        description: 開いている配信元
      - name: screen
        title: 画面のパス
        type: ScreenPath | None
        required: true
        passing: positional
        description: 開いたパス
      - name: doc_page
        title: 文書のページのパス
        type: str | None
        required: true
        passing: keyword
        description: 開いている文書
      - name: converted
        title: 変換の結果
        type: Converted | None
        required: true
        passing: keyword
        description: 表のキーに使う
      - name: diff
        title: 差分
        type: dict[str, str] | None
        required: true
        passing: keyword
        description: '`?diff=` のときの値'
    returns:
      type: PageState
      description: 画面の状態
    process: |-
      1. 配信中の配信元を `sources` に並べる
      2. 配信元があれば、`git`・`default_ref`・GitHub のキー・表の列の設定.列の設定を読む の結果を入れる
      3. `ref` は `@{ref}` の値、無ければ `default_ref`（Git 管理外は `None`）
  - name: render_doc_view
    title: 文書の画面の描画
    kind: 関数
    container: features/view/page.py
    usecase: 文書の画面
    role: 入口
    summary: 文書の画面の HTML を作る
    scope: public
    args:
      - name: request
        title: 要求
        type: fastapi.Request
        required: true
        passing: positional
        description: テンプレートに渡す
      - name: handlers
        title: 配線済みの関数
        type: Handlers
        required: true
        passing: injected
        description: 配信元の一覧・文書のストア・変換・リビジョンの書き出し・画面のテンプレート
      - name: screen
        title: 画面のパス
        type: ScreenPath
        required: true
        passing: positional
        description: 開いたパス
      - name: diff_ref
        title: 比べるリビジョン
        type: str | None
        required: true
        passing: keyword
        description: '`?diff=` の値'
    returns:
      type: fastapi.responses.HTMLResponse
      description: 200 の doc-view
    process: |-
      1. 画面の読む場所を作り、文書を集める（文書のストア.文書を集める）
      2. タブとサイドバーを組み立てる
      3. 開く文書を決める
         - `page` が空なら、一番左のタブのタブの最初の文書。文書が 1 つも無ければ、文書が無いことの表示だけの画面を返す
         - `page` があれば文書のページの特定。無ければ `DocumentNotFoundError`（`missing` に `page`）を送る
      4. 文書を変換する（変換.変換する）。失敗は `converted.failure` として本文の場所に出す
      5. `diff_ref` があり Git の配信元なら、そのリビジョンの読む場所で同じ ID の文書を引いて変換し、差分の元にする（無い文書は空の Markdown）。Git 管理外は無視する
      6. `doc_view.html` を、タブ（開いた文書を含むタブを選ぶ）・サイドバー・パンくず・文書の情報（種類・ID・`updated`）・本文・差分の元・画面の状態・`MDMARK_URL` で描く
    exceptions:
      - name: DocumentNotFoundError
        condition: 無い文書
        message: '`文書がありません: {page}`'
      - name: RefNotFoundError
        condition: '`@{ref}` か `?diff=` を解決できない'
        message: '`ref を解決できません: {value}`'
    unit_tests:
      - name: test_render_doc_view
        case: 正常
        summary: 配信元のトップ
        condition: '`/sample/`'
        mock: なし（一時フォルダの配信元）
        expected: 一番左のタブの一番上の文書の本文が `data-mdmark-source` に入る
      - name: test_render_doc_view_when_diff
        case: 正常
        summary: 差分の元
        condition: '`/sample/docs/a?diff=HEAD~1`'
        mock: なし
        expected: '`data-mdmark-diff-source` に 1 つ前の commit の本文、画面の状態の `diff.commit` が 1 つ前の commit'
      - name: test_render_doc_view_when_convert_failed
        case: 正常
        summary: 変換の失敗
        condition: 制限時間を超えるスクリプトの行の文書
        mock: なし
        expected: 200 で本文の場所に `timeout` の失敗
      - name: test_render_doc_view_when_missing
        case: 異常
        summary: 無い文書
        condition: '`/sample/docs/none`'
        mock: なし
        expected: '`DocumentNotFoundError`'
        exception: 無い文書
  - name: render_error_page
    title: エラーの画面
    kind: 関数
    container: features/view/page.py
    usecase: 共通
    role: 入口
    summary: 画面の GET の `DevDocsError` を見つからない画面の HTML にする
    scope: public
    args:
      - name: request
        title: 要求
        type: fastapi.Request
        required: true
        passing: positional
        description: 開いたパスを読む
      - name: error
        title: エラー
        type: DevDocsError
        required: true
        passing: positional
        description: 送られた例外
      - name: handlers
        title: 配線済みの関数
        type: Handlers
        required: true
        passing: injected
        description: 配信元の一覧・画面のテンプレート
    returns:
      type: fastapi.responses.HTMLResponse
      description: '`error.status` の not-found'
    process: |-
      1. パスを画面のパスの分解で分け、配信元が配信中なら、その配信元を見つからなかったものの文脈にする
      2. 見つからなかったものを次のように決める
         - `UnknownSourceError`・`SourceNotServedError` は配信元（配信していない配信元は違反の理由も）
         - `RefNotFoundError` はリビジョン
         - `DocumentNotFoundError` は文書
         - それ以外はエラーの名前と `message`
      3. 次のリンクに、配信中の配信元のトップと設定画面を並べる
      4. `not_found.html` を画面の状態と描く
    unit_tests:
      - name: test_render_error_page
        case: 正常
        summary: 無い配信元
        condition: '`UnknownSourceError("none")`、配信中は sample'
        mock: 画面のテンプレート（偽物）
        expected: 404 で、見つからなかったものが配信元の none、次のリンクに sample と設定
  - name: build_view_router
    title: 画面の入口
    kind: 関数
    container: features/view/route.py
    usecase: 共通
    role: 入口
    summary: 文書の画面と画面の API のルートを持つ `APIRouter` を作る
    scope: public
    args:
      - name: handlers
        title: 配線済みの関数
        type: Handlers
        required: true
        passing: positional
        description: 起動の『配線済みの関数』
    returns:
      type: fastapi.APIRouter
      description: 4 つのルートを持つルーター
    process: |-
      1. GET `/_api/sources/{source}/search` は、`q`（1〜`SEARCH_QUERY_MAX` 文字）・`ref`・`limit`（1〜`SEARCH_LIMIT_MAX`）を受け、画面の読む場所の文書で画面の検索を返す
      2. GET `/_api/sources/{source}/refs` は、`commits`（0〜`REFS_COMMITS_MAX`）を受け、リビジョンの一覧を返す（無い配信元は 404）
      3. PUT `/_api/sources/{source}/columns` は、同じオリジンの確認を依存に持ち、配信元を引いてから、本文を `ColumnsRequest` で受けて表の列の設定.列の設定を書く を呼び、同じ値を返す
      4. GET `/{source_part}/{page:path}`（と末尾の `/` の無い `/{source_part}`）は、画面のパスの分解をして文書の画面の描画を返す
      5. 画面のルートで起きた `DevDocsError` は、例外の変換の登録がエラーの画面にする（配信元が無い → 404）
      6. サービスは `asyncio.to_thread` で呼ぶ
    unit_tests:
      - name: test_build_view_router_when_search
        case: 正常
        summary: 画面の検索
        condition: GET `/_api/sources/sample/search?q=foo`
        mock: なし（一時フォルダの配信元）
        expected: 200 で `total_count` と `items[].path`
      - name: test_build_view_router_when_query_too_long
        case: 異常
        summary: 長すぎる語
        condition: '`q` が 201 文字'
        mock: なし
        expected: 400 の problem+json
      - name: test_build_view_router_when_refs
        case: 正常
        summary: Git 管理外のリビジョンの一覧
        condition: Git 管理外の配信元で GET `/_api/sources/notes/refs`
        mock: なし
        expected: 200 で `git` が `false`
      - name: test_build_view_router_when_columns
        case: 正常
        summary: 列の設定の保存
        condition: 'PUT `/_api/sources/sample/columns` を `Sec-Fetch-Site: same-origin` で'
        mock: なし
        expected: 200 で、次の GET の画面の状態の `hidden_columns` に入る
      - name: test_build_view_router_when_cross_origin
        case: 異常
        summary: 別のオリジン
        condition: '`Origin: http://evil.example`'
        mock: なし
        expected: 403 で、ファイルを書かない
      - name: test_build_view_router_when_unknown_source
        case: 異常
        summary: 配信元が無い
        condition: '`Accept: text/html` で GET `/none/`'
        mock: なし
        expected: 404 の not-found の HTML
components:
  - name: doc_view.html
    title: 文書の画面のテンプレート
    container: server/templates/doc_view.html
    usecase: 文書の画面
    kind: 画面
    summary: トップバー・タブ・サイドバー・本文・目次・コメントのパネルを描く
    description: '`base.html` を継ぐ。本文は `<textarea hidden data-mdmark-source>`、差分の元は `<textarea hidden data-mdmark-diff-source>` に入れ、画面のスクリプトが mdmark で描く。要素は画面設計『文書の画面』。'
    props:
      - name: tabs
        type: list[NavTab]
        required: true
        description: タブとサイドバー
      - name: current_tab
        type: int
        required: true
        description: 選んだタブの位置
      - name: doc
        type: Document | None
        required: true
        description: '`None` は文書が無いことの表示'
      - name: crumbs
        type: list[tuple[str, str | None]]
        required: true
        description: パンくず
      - name: converted
        type: Converted | None
        required: true
        description: 本文か変換の失敗
      - name: diff_markdown
        type: str | None
        required: true
        description: 差分の元
      - name: state
        type: PageState
        required: true
        description: '`PAGE_STATE_ID` の要素に JSON で埋め込む'
      - name: mdmark_url
        type: str
        required: true
        description: '`MDMARK_URL`'
  - name: not_found.html
    title: 見つからない画面のテンプレート
    container: server/templates/not_found.html
    usecase: 共通
    kind: 画面
    summary: 何が見つからなかったかと次のリンクを描く
    description: '`base.html` を継ぐ。要素は画面設計『見つからない画面』。'
    props:
      - name: missing
        type: dict[str, str]
        required: true
        description: '`{kind, value, reason}`（`kind` は source・ref・document・error）'
      - name: links
        type: list[tuple[str, str]]
        required: true
        description: (名前, URL) の次のリンク
      - name: state
        type: PageState
        required: true
        description: 画面の状態
  - name: settings.html
    title: 設定画面のテンプレート
    container: server/templates/settings.html
    usecase: 設定画面で端末の設定を変える
    kind: 画面
    summary: 配信元の一覧と、追加・編集・削除のダイアログを描く
    description: '`base.html` を継ぐ。端末の設定の入口が描く。要素は画面設計『設定画面』。'
    props:
      - name: config_path
        type: str
        required: true
        description: 端末の設定のパス
      - name: sources
        type: list[dict[str, Any]]
        required: true
        description: '`sources[]` の各行に配信元の状態（`status`・`errors`・`config_version`）を重ねたもの。画面の状態にも同じ値を埋め込む'
  - name: error_panel
    title: エラーのパネル
    container: server/templates/components/error_panel.html
    usecase: 共通
    kind: コンポーネント
    summary: 見出しと違反の行の並びを描く Jinja2 のマクロ（変換の失敗・保存の失敗のまとめ）
    props:
      - name: title
        type: str
        required: true
        description: 見出し
      - name: rows
        type: list[dict[str, str]]
        required: true
        description: '`{path, reason}` の並び。`path` は省ける'
      - name: detail
        type: str | None
        required: false
        default: None
        description: 標準エラーの末尾など `<pre>` で出す補足
refs:
  - dev/設計書/インターフェース定義/開発ドキュメントサーバー/文書の画面#
  - dev/設計書/インターフェース定義/開発ドキュメントサーバー/画面の検索#
  - dev/設計書/インターフェース定義/開発ドキュメントサーバー/リビジョンの一覧#
  - dev/設計書/インターフェース定義/開発ドキュメントサーバー/表の列の設定の保存#
  - dev/設計書/画面設計/文書の画面.html#
  - dev/設計書/画面設計/見つからない画面.html#
