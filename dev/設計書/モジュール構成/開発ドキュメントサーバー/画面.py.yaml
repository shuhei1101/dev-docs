title: "開発ドキュメントサーバー / 画面"
lead: |-
  文書の画面（doc-view）・見つからない画面と、画面のスクリプトが呼ぶ API（検索・リビジョンの一覧・表の列の設定の保存）。
  トップの転送と設定画面は端末の設定の入口が持つ。
directory: |-
  ```text
  src/dev_docs/features/view/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ types.py      # ScreenPath / NavLink / NavGroup / NavTab / PageState / ScreenSearchItem / ScreenSearchResult / ColumnsRequest
  ├─ paths.py      # parse_screen_path / page_path / find_page / screen_target / breadcrumbs
  ├─ nav.py        # build_nav / first_page
  ├─ columns.py    # ColumnSettings
  ├─ search.py     # screen_search
  ├─ page.py       # build_page_state / render_doc_view / render_error_page
  └─ route.py      # build_view_router（GET /{source}[@{ref}]/{path}・/_api/sources/{source}/...）
  src/dev_docs/server/templates/
  ├─ base.html                    # トップバー・明暗の切り替え・画面の状態の埋め込み
  ├─ doc_view.html                # 文書の画面
  ├─ not_found.html               # 見つからない画面
  ├─ settings.html                # 設定画面（端末の設定の入口が描く）
  └─ components/error_panel.html  # error_panel マクロ（変換の失敗・保存の失敗のまとめ）
  ```
