constants:
  - name: LAST_READ_LABEL
    title: 前回読んだ時点の表示
    container: features/changes/types.py
    usecase: 変更
    summary: '`from` を省いたときの `range.from.input`'
    value: '"前回読んだ時点"'
  - name: WORKTREE_LABEL
    title: 作業ツリーの表示
    container: features/changes/types.py
    usecase: 変更
    summary: '`to` を省いたときの `range.to.input`'
    value: '"作業ツリー"'
data_models:
  - name: ChangesRequest
    title: 変更の一覧の要求
    container: features/changes/types.py
    usecase: 変更
    role: DTO
    summary: '`list_changes` の引数'
    description: '`pydantic.BaseModel`（`extra="forbid"`）。キーの意味と既定値はインターフェース定義『変更の一覧』の `request`。`from` は Python の属性を `from_` にした別名。`limit`・`max_chars` の既定と上限は検索の定数を使う。'
    properties:
      - name: source
        title: 配信元
        type: str | list[str] | None
        access: 公開
        default: None
        description: '`*` も受ける'
      - name: worktree
        title: ワークツリー
        type: str | None
        access: 公開
        default: None
        description: '`to` を省いたときに読むワークツリー'
      - name: from_
        title: 始点
        type: str | None
        access: 公開
        default: None
        description: 別名 `from`。`None` は前回読んだ時点
      - name: to
        title: 終点
        type: str | None
        access: 公開
        default: None
        description: '`None` は今の作業ツリー'
      - name: filter
        title: 条件
        type: Condition | Group | None
        access: 公開
        default: None
        description: 検索と同じ条件
      - name: view
        title: 返す量
        type: Literal['summary', 'full']
        access: 公開
        default: '"summary"'
        description: '`full` は差分の行まで'
      - name: limit
        title: 件数
        type: int
        access: 公開
        default: LIMIT_DEFAULT
        description: 返す文書の数
      - name: cursor
        title: 続きの位置
        type: str | None
        access: 公開
        default: None
        description: 前回の `next_cursor`
      - name: max_chars
        title: 文字数
        type: int
        access: 公開
        default: MAX_CHARS_DEFAULT
        description: 結果全体の文字数の上限
      - name: format
        title: 形式
        type: Literal['markdown', 'json']
        access: 公開
        default: '"markdown"'
        description: 返す形式
      - name: cwd
        title: 作業場所
        type: str | None
        access: 公開
        default: None
        description: フックが入れる
      - name: session_id
        title: セッションの ID
        type: str | None
        access: 公開
        default: None
        description: フックが入れる
      - name: agent_id
        title: エージェントの ID
        type: str | None
        access: 公開
        default: None
        description: フックが入れる
      - name: contains
        title: 語
        type: ContainsQuery | None
        access: 公開
        default: None
        description: 語の出現数が変わった文書だけを返す。`None` は語で絞らない
  - name: RangePoint
    title: 区間の端
    container: features/changes/types.py
    usecase: 変更
    role: DTO
    summary: 区間の始点か終点
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: input
        title: 渡した値
        type: str
        access: 公開
        description: 引数の値か `LAST_READ_LABEL`・`WORKTREE_LABEL`
      - name: commit
        title: commit
        type: str | None
        access: 公開
        description: 解決した commit（短縮）。作業ツリー・前回読んだ時点は `None`
      - name: date
        title: 日時
        type: datetime | None
        access: 公開
        description: commit の日時。前回読んだ時点は最も古い読んだ日時
  - name: ChangeItem
    title: 変わった文書
    container: features/changes/types.py
    usecase: 変更
    role: DTO
    summary: 変わった文書 1 件
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: id
        title: 文書の ID
        type: str
        access: 公開
        description: 文書の ID
      - name: source
        title: 配信元
        type: str | None
        access: 公開
        description: 複数の配信元を指したときだけ
      - name: change
        title: 変更の種類
        type: Literal['added', 'modified', 'deleted', 'unchanged']
        access: 公開
        description: 足した・変えた・消した。`unchanged` は `contains` を渡し、区間の中で語が入って消えて両端の内容が同じ（両端に無い場合も含む）文書だけ
      - name: keys
        title: 変わったキー
        type: list[str]
        access: 公開
        description: 変わったキーのパス
      - name: values
        title: 前後の値
        type: dict[str, tuple[Any, Any]]
        access: 公開
        description: 'キーのパス → (前の値, 後の値)。`format: json` で返す'
      - name: diff
        title: 差分の行
        type: str | None
        access: 公開
        default: None
        description: '`view: full` のときだけ'
      - name: path
        title: 文書の場所
        type: str | None
        access: 公開
        default: None
        description: 変わった文書の今の場所（文書のストア.文書の場所）。終点が今の作業ツリーのときだけ持ち、`deleted` では `None`
      - name: scope
        title: 返した範囲
        type: Literal['section', 'summary'] | None
        access: 公開
        default: None
        description: '`view: full` は `section`、`view: summary` は `summary`。`path` が `None` のときは `None`'
      - name: contains_changes
        title: 語の増減
        type: list[ContainsChange] | None
        access: 公開
        default: None
        description: 語の出現数が変わった区間の古い順。`contains` を渡したときだけ
  - name: ChangesResult
    title: 変更の結果
    container: features/changes/types.py
    usecase: 変更
    role: DTO
    summary: '`list_changes` が返すもの'
    description: '`dataclass(frozen=True)`。複数の配信元を指したときの区間は配信元ごとに `notes` の先頭へ並べ、`range_from`・`range_to` は最初の配信元のもの。'
    properties:
      - name: range_from
        title: 始点
        type: RangePoint
        access: 公開
        description: JSON では `range.from`
      - name: range_to
        title: 終点
        type: RangePoint
        access: 公開
        description: JSON では `range.to`
      - name: total_count
        title: 総件数
        type: int
        access: 公開
        description: 変わった文書の数
      - name: items
        title: 変わった文書
        type: list[ChangeItem]
        access: 公開
        description: 配信元の順・`id` の昇順
      - name: next_cursor
        title: 続きの位置
        type: str | None
        access: 公開
        description: 続きがあるときだけ
      - name: truncated
        title: 打ち切ったか
        type: bool
        access: 公開
        description: '`max_chars` で打ち切ったか'
      - name: notes
        title: 知らせ
        type: list[str]
        access: 公開
        description: 丸めた・打ち切った知らせと次の手
  - name: ContainsQuery
    title: 変更の中身の語
    container: features/changes/types.py
    usecase: 変更
    role: DTO
    summary: '`list_changes` の `contains`'
    description: '`pydantic.BaseModel`（`extra="forbid"`）。`value` の空文字は `Field(min_length=1)` で弾く（ツールの引数の検証のエラーになる）。'
    properties:
      - name: value
        title: 語
        type: str
        access: 公開
        description: 探す語か正規表現。1 文字以上
      - name: regex
        title: 正規表現
        type: bool
        access: 公開
        default: 'False'
        description: '`value` を正規表現として当てるか'
      - name: case_sensitive
        title: 区別する
        type: bool
        access: 公開
        default: 'False'
        description: 大文字小文字と全角半角（NFKC）を区別するか
    status: planned
  - name: ContainsChange
    title: 語の増減
    container: features/changes/types.py
    usecase: 変更
    role: DTO
    summary: 語の出現数が変わった区間 1 つ
    description: '`dataclass(frozen=True)`。commit の端は `RangePoint` の `input` を空にし、commit（短縮）と日時を持つ。作業ツリーの端は `RangePoint(WORKTREE_LABEL)`。前回読んだ時点と比べた呼び出しは `range` と同じ端を持つ。'
    properties:
      - name: kind
        title: 増減
        type: Literal['added', 'removed']
        access: 公開
        description: 出現数が増えた（`added`）か減った（`removed`）か
      - name: from_
        title: 前
        type: RangePoint
        access: 公開
        description: 区間の前の端（親の commit）。JSON では `from`
      - name: to
        title: 後
        type: RangePoint
        access: 公開
        description: 区間の後の端（語が入った・消えた commit か作業ツリー）
      - name: count_before
        title: 前の数
        type: int
        access: 公開
        description: 前の端の文書の出現数（文書が無ければ 0）
      - name: count_after
        title: 後の数
        type: int
        access: 公開
        description: 後の端の文書の出現数（文書が無ければ 0）
    status: planned
functions:
  - name: changed_keys
    title: 変わったキー
    kind: 関数
    container: features/changes/compare.py
    usecase: 共通
    role: 判定
    summary: 2 つの内容を比べ、変わったキーのパスと前後の値を返す
    scope: public
    thread_safe: true
    args:
      - name: before
        title: 前
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 前の内容（足した文書は空）
      - name: after
        title: 後
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 後の内容（消した文書は空）
      - name: ignore
        title: 無視するキー
        type: Collection[str]
        required: false
        default: ()
        passing: keyword
        description: '`diff.ignore_keys`。最上位のキーの名前'
    returns:
      type: dict[str, tuple[Any, Any]]
      description: キーのパス → (前の値, 後の値)。パスの出る順
    process: |-
      1. 辞書は両方のキーの和を、後の内容の順（前にだけあるキーは末尾）でたどる。`ignore` の最上位のキーは飛ばす
      2. 両方が辞書なら再帰する
      3. 両方がリストで、要素が全て `id` か `name` を持つ辞書なら、そのキーで要素を突き合わせて `a[{キー}].b` のパスで再帰する。それ以外のリストは丸ごと比べる
      4. 値が違えば、そのパスと前後の値を入れる
    unit_tests:
      - name: test_changed_keys
        case: 正常
        summary: 入れ子と要素の突き合わせ
        condition: '`{name: a, items: [{id: x, v: 1}], updated: d1}` と `{name: b, items: [{id: x, v: 2}], updated: d2}`、`ignore=["updated"]`'
        mock: なし
        expected: '`{"name": ("a", "b"), "items[x].v": (1, 2)}`'
  - name: diff_lines
    title: 差分の行
    kind: 関数
    container: features/changes/compare.py
    usecase: 共通
    role: 変換
    summary: 2 つの文字列の違う行を、git と同じ `-`・`+` の行にする
    scope: public
    thread_safe: true
    args:
      - name: before
        title: 前
        type: str
        required: true
        passing: positional
        description: 前の文字列
      - name: after
        title: 後
        type: str
        required: true
        passing: positional
        description: 後の文字列
    returns:
      type: str
      description: '`- {行}`・`+ {行}` の並び。違いが無ければ空'
    process: |-
      1. `difflib.unified_diff(n=0)` の結果から `---`・`+++` の行を除く
      2. `@@` の行は 2 つ目以降のかたまりの区切りとして `…` の行にし、`-`・`+` の行は記号の後に空白を入れて並べる
    unit_tests:
      - name: test_diff_lines
        case: 正常
        summary: 変えた行
        condition: '`"name: 文書 1\nx: 1\n"` と `"name: 新しい名前\nx: 1\n"`'
        mock: なし
        expected: '`"- name: 文書 1\n+ name: 新しい名前"`'
  - name: list_changes
    title: 変更の一覧
    kind: 関数
    container: features/changes/service.py
    usecase: 変更
    role: サービス
    summary: '`list_changes` の要求を処理して変更の結果を返す'
    scope: public
    thread_safe: true
    args:
      - name: request
        title: 変更の一覧の要求
        type: ChangesRequest
        required: true
        passing: positional
        description: ツールの引数
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 配信中の配信元
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: 今の文書を読む
      - name: seen
        title: 会話の記録
        type: SeenStore
        required: true
        passing: injected
        description: 前回読んだ内容
    returns:
      type: ChangesResult
      description: 変更の結果
    process: |-
      1. `to` があって `from_` が無い場合、`InvalidArgumentError`（`to` には `from` が要ります）を送る
      2. `contains.regex` が真で `contains.value` を `compile_regex` で読めない場合、`InvalidArgumentError`（`path` は `contains.value`、`rule` は `正規表現として読めません（{エラー}）`）を送る
      3. 読む場所を解く（読む場所の解決。`ref` は渡さない）。`from_` があり Git 管理外の配信元を含む場合、`InvalidArgumentError` を送る
      4. 配信元ごとに前と後の文書を作る
         - `from_` がある場合、始点・終点をリビジョンの解決（`argument` は `from`・`to`）で commit にし、2 つの commit（終点が無ければ作業ツリー）の間の前後の文書を作る。文書の行に当たる変わったファイル（`enabled` の行を上から見て、文書の行.行に当たるかが `True` の最初の行）ごとに、前はリビジョンのファイル、後は終点の commit のリビジョンのファイルか作業ツリーのファイルを、文字列からの文書の組み立てで文書にする（この組み立ては次の `contains` の commit ごとの比較でも使う）。`body_file` の本文は、ファイルと同じ端（前は始点の commit、後は終点の commit のリビジョンのファイルか作業ツリーのファイル）から読む（文字列からの文書の組み立ての `read_body`）。変わったファイルが今の文書（文書のストア.読み込み）の `body_path` に当たる場合、その文書の索引のファイル（`path`）も変わったファイルに加える
         - `from_` が無い場合、会話の記録.前回読んだ内容を引く（会話キーが無い・全ての配信元で空なら `LastReadNotFoundError`）。前は記録の内容（`doc_kind` の行が YAML なら YAML として、Markdown なら front matter と本文として読む）、後は今の文書（文書のストア.ID で引く。無ければ消した）
      5. `contains` がある場合、文書ごとに語の増減を集める
         - `from_` がある場合、区間の commit（`to` が無ければ終点は作業ツリーの `HEAD`）の commit ごとに、親とその commit の間の前後の文書を作り、両方の文書の本文（`Document.body`）の語の出現数が違う文書へ `ContainsChange` を足す。`to` が無い場合、最後に `HEAD` と作業ツリーの間も比べる（後の端は `RangePoint(WORKTREE_LABEL)`）
         - `from_` が無い場合、前と後の文書の出現数が違う文書へ、区間の端と同じ端の `ContainsChange` を 1 つ足す
         - 出現数が増えたら `added`、減ったら `removed`。文書が無い側の数は 0
      6. ID で突き合わせ、前にだけある文書を `deleted`、後にだけある文書を `added`、両方にあって変わったキー（無視するキーは `diff_ignore_keys`、Markdown の文書は `body` も 1 つのキーとして比べる）が空でない文書を `modified` にする。`contains` がある場合は語の増減を持つ文書だけを残し、`added`・`deleted`・`modified` のどれにも当たらない文書を `unchanged` にする
      7. `filter` があれば、後の文書（無ければ前の文書、両方に無ければ語の増減を比べたときに最後に見た文書）を条件の照合にかけ、当たる文書だけを残す（条件の確かめは検索と同じ）
      8. 配信元の順・`id` の昇順に並べ、検索と同じ `limit` の丸め・続きの位置・`max_chars` の打ち切りをする
      9. `view` が `full` の場合、前と後の本文の差分の行を入れる
      10. `to` が無く（終点が今の作業ツリー）、`deleted` でない文書は、`path` を後の文書の場所（文書のストア.文書の場所）にし、`scope` を `view` が `full` なら `section`、それ以外は `summary` にする
      11. 区間の端を入れて返す
    exceptions:
      - name: RefNotFoundError
        condition: '`from`・`to` を解決できない'
        message: '`{argument} の {value} を解決できません`'
      - name: LastReadNotFoundError
        condition: '`from` を省き、この会話で本文を読んだ記録が無い'
        message: '`この会話で読んだ記録がありません。from を渡してください`'
      - name: InvalidArgumentError
        condition: Git 管理外の配信元への区間・`from` の無い `to`・知らない項目・正規表現として読めない `contains.value`
        message: '`引数が正しくありません: {違反の数} 件`'
      - name: SourceNotReadableError
        condition: 読む場所の解決が送る
        message: '`{id} はこの作業場所（{cwd}）から読めません`'
    unit_tests:
      - name: test_list_changes
        case: 正常
        summary: 2 つの commit の間
        condition: '文書 1 の `name` を変えた commit とその親を `from`・`to` に、`view: full`'
        mock: なし（一時フォルダの git リポジトリ）
        expected: '`range` に 2 つの commit と日時、`items` が文書 1 だけで `modified`・`keys: [name]`、`diff` に `-`・`+` の行。`to` を渡したため `path`・`scope` が `None`'
      - name: test_list_changes_when_last_read
        case: 正常
        summary: 前回読んだ時点から
        condition: '`search_docs` で本文を返した後、文書 1 のファイルを直接書き換えて `from` を省く'
        mock: なし
        expected: '`range.from.input` が `前回読んだ時点`、`items` が文書 1 だけで、`path` が文書 1 の絶対パス、`scope` が `summary`'
      - name: test_list_changes_when_added_and_deleted
        case: 正常
        summary: 足した文書と消した文書
        condition: 区間の中で文書 3 を足し、文書 2 を消す
        mock: なし
        expected: 文書 2 が `deleted`、文書 3 が `added`。`to` を省いたとき、文書 2 は `path` が `None`、文書 3 は `path` を持つ
      - name: test_list_changes_when_no_last_read
        case: 異常
        summary: 読んだ記録が無い
        condition: '`session_id` のある新しい会話で `from` を省く'
        mock: なし
        expected: '`LastReadNotFoundError`'
        exception: '`from` を省き、この会話で本文を読んだ記録が無い'
      - name: test_list_changes_when_to_without_from
        case: 異常
        summary: '`from` の無い `to`'
        condition: '`to: HEAD` だけ'
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `to`'
        exception: Git 管理外の配信元への区間・`from` の無い `to`・知らない項目・正規表現として読めない `contains.value`
      - name: test_list_changes_when_contains
        case: 正常
        summary: 語が入って消えた文書
        condition: 'commit 1 で文書 1 に `廃止予定` を追加、commit 2 で文書 2 の `name` を変えて文書 1 の `廃止予定` を含む行を書き換え（出現数は同じ）、commit 3 で文書 1 から `廃止予定` を削除して commit 1 の親と同じ内容に戻す。commit 1 の親を `from`、commit 3 を `to`、`contains: {value: 廃止予定}`'
        mock: なし（一時フォルダの git リポジトリ）
        expected: '`items` が文書 1 だけで `unchanged`、`contains_changes` が `added`（`to.commit` が commit 1、数 0 → 1）と `removed`（`to.commit` が commit 3、数 1 → 0）の順'
      - name: test_list_changes_when_contains_regex
        case: 正常
        summary: 正規表現の語
        condition: '`test_list_changes_when_contains` と同じ commit で `contains: {value: 廃止.定, regex: true}`'
        mock: なし（一時フォルダの git リポジトリ）
        expected: '`test_list_changes_when_contains` と同じ結果'
      - name: test_list_changes_when_contains_merge
        case: 正常
        summary: マージ commit を見ない
        condition: ブランチの commit で文書 2 に `廃止予定` を追加し、`--no-ff` でマージした区間
        mock: なし（一時フォルダの git リポジトリ）
        expected: 文書 2 の `contains_changes` がブランチの commit の `added` 1 要素だけ
      - name: test_list_changes_when_contains_worktree
        case: 正常
        summary: 作業ツリーの区間
        condition: '`test_list_changes_when_contains` の commit の後、作業ツリーで文書 1 に `廃止予定` を戻し、`to` を省く'
        mock: なし（一時フォルダの git リポジトリ）
        expected: 文書 1 の `contains_changes` の最後が `added` で、`to.input` が `作業ツリー`
      - name: test_list_changes_when_contains_last_read
        case: 正常
        summary: 前回読んだ時点からの語
        condition: '`search_docs` で文書 1 の本文を返した後、文書 1 のファイルに `廃止予定` を追加して `from` を省き `contains: {value: 廃止予定}`'
        mock: なし
        expected: 文書 1 の `contains_changes` が `added` の 1 要素で、`from_`・`to` が `range_from`・`range_to` と同じ
      - name: test_list_changes_when_invalid_regex
        case: 異常
        summary: 読めない正規表現
        condition: '`contains: {value: "(", regex: true}`'
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `contains.value`'
        exception: Git 管理外の配信元への区間・`from` の無い `to`・知らない項目・正規表現として読めない `contains.value`
      - name: test_list_changes_when_excluded
        case: 正常
        summary: 除外の名前に当たるファイルは次の行へ進む
        condition: '行 `rule`（`paths: [docs/rule/*.md]`・`exclude: [README.md]`）と行 `index`（`paths: [docs/**/README.md]`）。区間の中で `docs/rule/README.md` を足す'
        mock: なし（一時フォルダの git リポジトリ）
        expected: '`items` が `docs/rule/README.md` の文書 1 件だけで、`kind` が `index`・`added`'
        exception: '-'
      - name: test_list_changes_when_contains_body_file
        case: 正常
        summary: '`body_file` の文書の語'
        condition: '`records`・`body_file` の行（索引 `index.yaml` の要素が `a.md` を指す）で、commit 1 で `a.md` だけに `廃止予定` を追加、commit 2 で索引に `b.md`（語を含まない）を指す要素を追加、commit 3 で `b.md` に `廃止予定` を追加。commit 1 の親を `from`、commit 3 を `to`、`contains: {value: 廃止予定}`'
        mock: なし（一時フォルダの git リポジトリ）
        expected: '`a` の `contains_changes` が commit 1 の `added` 1 要素だけ、`b` の `contains_changes` が commit 3 の `added` 1 要素だけ（commit 2 では返らない）'
  - name: render_changes_markdown
    title: 変更の結果の Markdown
    kind: 関数
    container: features/changes/render.py
    usecase: 変更
    role: 変換
    summary: '`format: markdown` の本文を作る'
    scope: public
    thread_safe: true
    args:
      - name: result
        title: 変更の結果
        type: ChangesResult
        required: true
        passing: positional
        description: 描く結果
      - name: source_label
        title: 配信元の表示
        type: str
        required: true
        passing: keyword
        description: 先頭の行に出す配信元
    returns:
      type: str
      description: Markdown
    process: |-
      1. 先頭の行に `{配信元}: {始点}（{日時}）→ {終点}（{日時}）・変わった文書 {total_count} 件` を置く（始点・終点は commit、無ければ渡した値）
      2. `| id | 変更 | 変わったキー |` の表を置く。`contains_changes` を持つ文書があれば `語の増減` の列を加え、区間ごとに `{kind} {後の端の commit（無ければ渡した値）}` を `・` で並べる
      3. 差分の行があれば、文書ごとに `## {id}` と ```diff のかたまりを置く。`path` を持つ文書は ```diff のかたまりを `<document path="{path}" scope="section">` と `</document>` で包む
      4. `notes` と `next_cursor` を検索と同じに置く
    unit_tests:
      - name: test_render_changes_markdown
        case: 正常
        summary: 区間と表
        condition: 文書 1 が `modified` の結果
        mock: なし
        expected: '`sample: 3f2a9c1（...）→ 8b1d4e0（...）・変わった文書 1 件` と表の行 `| doc-1 | modified | name |`'
      - name: test_render_changes_markdown_when_location
        case: 正常
        summary: 場所を持つ差分を包む
        condition: '`diff` を持つ 2 件で、文書 1 は `path`・`scope: section` を持ち、文書 2 は `path` が `None`'
        mock: なし
        expected: 文書 1 の差分だけが `<document path="{path}" scope="section">` で包まれる
        exception: '-'
      - name: test_render_changes_markdown_when_contains
        case: 正常
        summary: 語の増減の列
        condition: 文書 1 が `unchanged` で、`contains_changes` が commit `3f2a9c1` の `added` と commit `8b1d4e0` の `removed`
        mock: なし
        expected: 表の見出しに `語の増減` があり、文書 1 の行が `\| doc-1 \| unchanged \|  \| added 3f2a9c1・removed 8b1d4e0 \|`
  - name: count_occurrences
    title: 語の出現数
    kind: 関数
    container: features/changes/compare.py
    usecase: 変更
    role: 判定
    summary: 文字列の中の語の出現数（正規表現なら当たった数）を返す
    scope: public
    thread_safe: true
    args:
      - name: text
        title: 文字列
        type: str
        required: true
        passing: positional
        description: 文書の本文
      - name: query
        title: 語
        type: ContainsQuery
        required: true
        passing: positional
        description: '`list_changes` の `contains`'
    returns:
      type: int
      description: 出現数
    process: |-
      1. `regex` が偽の場合、`case_sensitive` が真なら `text.count(value)`、偽なら両方を `normalize`（NFKC と `casefold`）にしてから数える
      2. `regex` が真の場合、`compile_regex(value, case_sensitive=...)` の `finditer` の数を返す。区別しないときは `text` だけを NFKC にしてから当てる（検索の正規表現の条件と同じ）
    exceptions:
      - name: re.error
        condition: '`value` が正規表現として読めない（呼び出し元が先に確かめる）'
        message: re の既定
    unit_tests:
      - name: test_count_occurrences
        case: 正常
        summary: 大文字小文字と全角半角を区別しない
        condition: '`"ＡＢＣ abc Abc"` と `{value: abc}`'
        mock: なし
        expected: '3'
      - name: test_count_occurrences_when_case_sensitive
        case: 正常
        summary: 区別する
        condition: '`"ＡＢＣ abc Abc"` と `{value: abc, case_sensitive: true}`'
        mock: なし
        expected: '1'
      - name: test_count_occurrences_when_regex
        case: 正常
        summary: 正規表現の当たった数
        condition: '`"廃止予定\n廃止の予定\n廃止予定"` と `{value: 廃止.定, regex: true}`'
        mock: なし
        expected: '2'
    status: planned
