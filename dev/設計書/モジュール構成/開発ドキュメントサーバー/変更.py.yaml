title: "開発ドキュメントサーバー / 変更"
lead: |-
  `list_changes` の処理。区間（commit・日時・ブランチ・タグ）か、この会話で前回読んだ時点から今までに変わった文書・変わったキー・差分の行を返す。
  変わったキーと差分の行は、書き込みの差分と文書の取得の `diff` も使う。
directory: |-
  ```text
  src/dev_docs/features/changes/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ types.py      # ChangesRequest / RangePoint / ChangeItem / ChangesResult
  ├─ compare.py    # changed_keys / diff_lines
  ├─ render.py     # render_changes_markdown
  └─ service.py    # list_changes
  ```
