title: "開発ドキュメントサーバー / 書き込み"
lead: |-
  `write_docs`・`delete_docs` の処理。操作を全て当てた後の文書を検査に通し、通ったときだけ作業ツリー（Git 管理外の配信元はそのフォルダ）のファイルを書き換える。
  書き込み・削除は配信元ごとに 1 つずつ行い、commit はしない。
directory: |-
  ```text
  src/dev_docs/features/write/
  ├─ __init__.py    # 公開する型と関数の再エクスポート
  ├─ types.py       # Operation / TextEdit / WriteRequest / WriteResult / DeleteTarget / DeleteRequest / DeleteResult
  ├─ apply.py       # apply_operation（項目の操作を当てる）
  ├─ ids.py         # generate_id（ids.format から ID を作る）
  ├─ placement.py   # new_document_path（新しい文書の置き場所）
  ├─ locks.py       # SourceLocks（配信元ごとの排他）
  └─ service.py     # write_docs / delete_docs / check_version
  ```
