title: "開発ドキュメントサーバー / 関連"
lead: |-
  `trace_related` の処理。起点の文書かコードのパスから、メタデータの `related` を深さと向きの指定でたどる。
  `suggest` では、同じ commit での変更と会話の中の編集・閲覧から、まだ `related` に無い関連の候補を返す。
directory: |-
  ```text
  src/dev_docs/features/related/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ types.py      # RelatedRequest / RelatedLink / RelatedItem / Suggestion / RelatedResult
  ├─ graph.py      # related_links / walk_related
  ├─ suggest.py    # suggest_related
  ├─ render.py     # render_related_markdown
  └─ service.py    # trace_related
  ```
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        関連のたどり ..> 読む場所の解決
        関連のたどり ..> 文書を集める
        関連のたどり ..> 関連をたどる
        関連のたどり ..> 関連の候補
        関連のたどり ..> 会話の記録 : 返し済み
        関連をたどる ..> 関連の行
        関連の候補 ..> 一緒に変わったファイル
        関連の候補 ..> 会話の記録 : 閲覧と編集
        class 関連のたどり {
          <<function>>
        }
        class 読む場所の解決 {
          <<function>>
        }
        class 文書を集める {
          <<method>>
        }
        class 関連をたどる {
          <<function>>
        }
        class 関連の行 {
          <<function>>
        }
        class 関連の候補 {
          <<function>>
        }
        class 一緒に変わったファイル {
          <<function>>
        }
        class 会話の記録 {
          <<class>>
        }
        click 読む場所の解決 href "./権限と作業場所.py.yaml#読む場所の解決"
        click 文書を集める href "./文書のストア.py.yaml#文書のストア"
        click 一緒に変わったファイル href "./履歴.py.yaml#一緒に変わったファイル"
        click 会話の記録 href "./会話の記録.py.yaml#会話の記録"
constants:
  - name: DEPTH_DEFAULT
    title: 深さの既定
    container: features/related/types.py
    usecase: 関連
    summary: '`depth` を省いたときの深さ'
    value: '2'
  - name: DEPTH_MAX
    title: 深さの上限
    container: features/related/types.py
    usecase: 関連
    summary: '`depth` の上限。超えた値は丸めて `notes` で知らせる'
    value: '4'
  - name: SUGGEST_COUNT
    title: 候補の数
    container: features/related/types.py
    usecase: 関連
    summary: 返す関連の候補の数
    value: '3'
  - name: SIGNAL_WEIGHTS
    title: 信号の重み
    container: features/related/suggest.py
    usecase: 関連
    summary: 候補の順位の値に足す信号ごとの重み
    entries:
      - key: co_change
        value: '1.0'
        description: 起点と同じ commit で変わった回数を、最も多い候補を 1 にそろえた値に掛ける
      - key: edited
        value: '0.6'
        description: この会話で編集した
      - key: viewed
        value: '0.3'
        description: この会話で本文を返した
data_models:
  - name: RelatedRequest
    title: 関連のたどりの要求
    container: features/related/types.py
    usecase: 関連
    role: DTO
    summary: '`trace_related` の引数'
    description: '`pydantic.BaseModel`（`extra="forbid"`）。キーの意味と既定値はインターフェース定義『関連のたどり』の `request`。`depth` は丸めるので型だけを確かめる。'
    properties:
      - name: source
        title: 配信元
        type: str | None
        access: 公開
        default: None
        description: 起点の配信元
      - name: ref
        title: リビジョン
        type: str | None
        access: 公開
        default: None
        description: 読むリビジョン
      - name: worktree
        title: ワークツリー
        type: str | None
        access: 公開
        default: None
        description: 読むワークツリー
      - name: from_ids
        title: 起点の文書
        type: list[str] | None
        access: 公開
        default: None
        description: '`code_paths` とどちらか 1 つ'
      - name: code_paths
        title: 起点のコードのパス
        type: list[str] | None
        access: 公開
        default: None
        description: 配信元の直下からのパス
      - name: depth
        title: 深さ
        type: int
        access: 公開
        default: DEPTH_DEFAULT
        description: たどる深さ
      - name: direction
        title: 向き
        type: Literal['out', 'in', 'both']
        access: 公開
        default: '"both"'
        description: たどる向き
      - name: suggest
        title: 候補を返すか
        type: bool
        access: 公開
        default: 'False'
        description: '`True` で関連の候補を返す'
      - name: repeat_seen
        title: 返し済みも返す
        type: bool
        access: 公開
        default: 'False'
        description: '`True` で名前・概要文を省かない'
      - name: format
        title: 形式
        type: Literal['markdown', 'json']
        access: 公開
        default: '"markdown"'
        description: 返す形式
      - name: cwd
        title: 作業場所
        type: str | None
        access: 公開
        default: None
        description: フックが入れる
      - name: session_id
        title: セッションの ID
        type: str | None
        access: 公開
        default: None
        description: フックが入れる
      - name: agent_id
        title: エージェントの ID
        type: str | None
        access: 公開
        default: None
        description: フックが入れる
  - name: RelatedLink
    title: 関連の行
    container: features/related/types.py
    usecase: 関連
    role: DTO
    summary: メタデータの `related` の 1 行
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: to
        title: 相手
        type: str
        access: 公開
        description: 相手の文書の ID
      - name: type
        title: 関係の種類
        type: str
        access: 公開
        description: '`related.types` の語'
      - name: source
        title: 相手の配信元
        type: str | None
        access: 公開
        description: 別の配信元の文書を指すときだけ
  - name: RelatedItem
    title: たどった文書
    container: features/related/types.py
    usecase: 関連
    role: DTO
    summary: たどった 1 件の文書
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: id
        title: 文書の ID
        type: str
        access: 公開
        description: たどった文書
      - name: source
        title: 配信元
        type: str | None
        access: 公開
        description: 起点と違う配信元のときだけ
      - name: depth
        title: 深さ
        type: int
        access: 公開
        description: 起点からの深さ（1 始まり）
      - name: via_from
        title: たどった元
        type: str
        access: 公開
        description: JSON では `via.from`
      - name: via_type
        title: 関係の種類
        type: str
        access: 公開
        description: JSON では `via.type`
      - name: via_direction
        title: 向き
        type: Literal['out', 'in']
        access: 公開
        description: JSON では `via.direction`
      - name: name
        title: 名前
        type: str
        access: 公開
        description: 返し済みなら `SEEN_MARK`
      - name: description
        title: 概要文
        type: str
        access: 公開
        description: 返し済みなら `SEEN_MARK`
  - name: Suggestion
    title: 関連の候補
    container: features/related/types.py
    usecase: 関連
    role: DTO
    summary: まだ `related` に無い関連の候補
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: id
        title: 文書の ID
        type: str
        access: 公開
        description: 候補の文書
      - name: signals
        title: 信号
        type: list[Literal['co_change', 'edited', 'viewed']]
        access: 公開
        description: 候補にした信号
      - name: score
        title: 順位の値
        type: float
        access: 公開
        description: 信号の重みの和（小数 2 桁に丸める）
  - name: RelatedResult
    title: 関連のたどりの結果
    container: features/related/types.py
    usecase: 関連
    role: DTO
    summary: '`trace_related` が返すもの'
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: start
        title: 起点
        type: list[str]
        access: 公開
        description: 起点の文書の ID
      - name: items
        title: たどった文書
        type: list[RelatedItem]
        access: 公開
        description: 深さの昇順・たどった順
      - name: suggestions
        title: 関連の候補
        type: list[Suggestion]
        access: 公開
        description: '`suggest` のときだけ。順位の値の降順'
      - name: notes
        title: 知らせ
        type: list[str]
        access: 公開
        description: 丸めた・読めなかった文書の知らせ
functions:
  - name: related_links
    title: 関連の行
    kind: 関数
    container: features/related/graph.py
    usecase: 関連
    role: 読み取り
    summary: 文書のメタデータの `related` を関連の行の並びにする
    scope: public
    thread_safe: true
    args:
      - name: document
        title: 文書
        type: Document
        required: true
        passing: positional
        description: 読む文書
    returns:
      type: list[RelatedLink]
      description: 形の合わない行（辞書でない・`to` が無い）は除く
    process: 1. `metadata["related"]` の各行から `to`・`type`（無ければ空）・`source` を取り、関連の行にする
  - name: walk_related
    title: 関連をたどる
    kind: 関数
    container: features/related/graph.py
    usecase: 関連
    role: 判定
    summary: 起点から幅優先で `related` をたどり、たどった文書を深さつきで返す
    scope: public
    thread_safe: true
    args:
      - name: start
        title: 起点
        type: Sequence[Document]
        required: true
        passing: positional
        description: 起点の文書
      - name: documents
        title: 配信元の文書
        type: Mapping[str, Document]
        required: true
        passing: positional
        description: ID → 起点の配信元の文書
      - name: depth
        title: 深さ
        type: int
        required: true
        passing: keyword
        description: 1〜`DEPTH_MAX`
      - name: direction
        title: 向き
        type: Literal['out', 'in', 'both']
        required: true
        passing: keyword
        description: たどる向き
      - name: resolve_other
        title: 別の配信元の文書を引く
        type: Callable[[str, str], Document | None]
        required: true
        passing: keyword
        description: (配信元の ID, 文書の ID) → 文書。読めない・無いときは `None`
    returns:
      type: tuple[list[tuple[Document, int, str, str, Literal['out', 'in']]], list[str]]
      description: ((文書, 深さ, 元の ID, 関係の種類, 向き) の並び, 読めなかった相手の知らせ)
    process: |-
      1. 起点の ID を訪れた集合に入れる
      2. 深さ 1 から `depth` まで、前の深さの文書ごとに次をたどる。訪れた文書は飛ばす（循環を防ぐ）
         - `out` は関連の行の `to`。`source` があれば別の配信元の文書を引き、引けなければ `{source}:{to} は読めないので除きました` を知らせる。同じ配信元に無い ID は `{to} がありません` を知らせる
         - `in` は、同じ配信元の文書のうち、関連の行の `to` がその文書の ID で `source` の無い行を持つ文書（逆引きの辞書を 1 回だけ作る）
      3. たどった順の並びと知らせを返す
    unit_tests:
      - name: test_walk_related
        case: 正常
        summary: 深さと向き
        condition: 文書 1 → 文書 2 → 文書 3 の `related`、起点 文書 1、`depth=2`・`out`
        mock: なし
        expected: 文書 2（深さ 1）・文書 3（深さ 2）。`depth=1` では文書 2 だけ
      - name: test_walk_related_when_cycle
        case: 正常
        summary: 循環
        condition: 文書 1 ⇄ 文書 2 の `related`、起点 文書 2、`in`・`depth=4`
        mock: なし
        expected: 文書 1 を深さ 1 で 1 回だけ返す
      - name: test_walk_related_when_other_source
        case: 正常
        summary: 読めない別の配信元
        condition: '`related: [{to: x, type: references, source: other}]`、`resolve_other` が `None`'
        mock: なし
        expected: たどった文書が空で、知らせに `other:x`
  - name: suggest_related
    title: 関連の候補
    kind: 関数
    container: features/related/suggest.py
    usecase: 関連
    role: 判定
    summary: 同じ commit での変更と、この会話の編集・閲覧から関連の候補を選ぶ
    scope: public
    thread_safe: true
    args:
      - name: start
        title: 起点
        type: Sequence[Document]
        required: true
        passing: positional
        description: 起点の文書
      - name: documents
        title: 配信元の文書
        type: Sequence[Document]
        required: true
        passing: positional
        description: 起点の配信元の文書
      - name: exclude
        title: 除く文書
        type: Collection[str]
        required: true
        passing: keyword
        description: 起点と、`related` で既に繋がる文書の ID
      - name: co_changed
        title: 一緒に変わったファイル
        type: Mapping[str, int]
        required: true
        passing: keyword
        description: 履歴の一緒に変わったファイルの結果（Git 管理外は空）
      - name: activity
        title: 閲覧と編集
        type: Sequence[Activity]
        required: true
        passing: keyword
        description: 会話の記録.閲覧と編集の結果
    returns:
      type: list[Suggestion]
      description: 順位の値の降順・ID の昇順で `SUGGEST_COUNT` 件まで
    process: |-
      1. 一緒に変わったファイルを、`body_path`（無ければ `path`）がそのファイルの文書に結び付け、回数を最大の回数で割った値に `co_change` の重みを掛ける
      2. 閲覧と編集の文書に `edited`・`viewed` の重みを足す
      3. `exclude` の文書を除き、上位を返す
    unit_tests:
      - name: test_suggest_related
        case: 正常
        summary: 信号の和と除く文書
        condition: 文書 4 が 2 回一緒に変わり、文書 5 を閲覧、文書 2 は `exclude`、文書 2 も一緒に変わった
        mock: なし
        expected: 文書 4（`co_change`、1.0）・文書 5（`viewed`、0.3）の順で、文書 2 は無い
  - name: trace_related
    title: 関連のたどり
    kind: 関数
    container: features/related/service.py
    usecase: 関連
    role: サービス
    summary: '`trace_related` の要求を処理して関連のたどりの結果を返す'
    scope: public
    thread_safe: true
    side_effects: 名前・概要文を返した相手を会話の記録に残す
    args:
      - name: request
        title: 関連のたどりの要求
        type: RelatedRequest
        required: true
        passing: positional
        description: ツールの引数
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 配信中の配信元
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: 文書を読む
      - name: seen
        title: 会話の記録
        type: SeenStore
        required: true
        passing: injected
        description: 返し済みの省略・閲覧と編集
    returns:
      type: RelatedResult
      description: 関連のたどりの結果
    process: |-
      1. `from_ids` と `code_paths` の両方がある・どちらも無い場合、`InvalidArgumentError`（`from_ids` か `code_paths` のどちらか 1 つを渡してください）を送る
      2. `depth` が 1 未満なら `InvalidArgumentError`、`DEPTH_MAX` を超えれば丸めて `notes` で知らせる
      3. 読む場所を解き（読む場所の解決）、文書を集めて ID の辞書にする
      4. 起点を決める
         - `from_ids` の場合、無い ID があれば近い候補を添えた `DocumentNotFoundError`
         - `code_paths` の場合、正規化したパスと `body_path` が同じ文書。文書の無いパスがあれば `DocumentNotFoundError`（`missing` にパス）
      5. 関連をたどる。別の配信元の文書は、その配信元を読む場所の解決（同じ `cwd`）で解き、ID で引く（`SourceNotReadableError` など解けないときは `None`）
      6. `repeat_seen` が `False` なら、会話の記録.返し済み（`related`）に当たる相手の名前・概要文を `SEEN_MARK` にする
      7. `suggest` なら、起点の `body_path`（無ければ `path`）で一緒に変わったファイル（Git の配信元だけ）と、会話の記録.閲覧と編集を引き、関連の候補を選ぶ（`exclude` は起点とたどった文書）
      8. 名前・概要文を返した相手を会話の記録に `related` で残す
      9. 結果を返す
    exceptions:
      - name: InvalidArgumentError
        condition: 起点の指定の誤り・`depth` が 1 未満
        message: '`from_ids か code_paths のどちらか 1 つを渡してください`'
      - name: DocumentNotFoundError
        condition: 無い起点
        message: '`文書がありません: {id}`'
      - name: SourceNotReadableError
        condition: 読む場所の解決が送る
        message: '`{id} はこの作業場所（{cwd}）から読めません`'
    unit_tests:
      - name: test_trace_related
        case: 正常
        summary: 起点からたどる
        condition: '文書 1 → 文書 2 → 文書 3、`from_ids: [doc-1]`'
        mock: なし（一時フォルダの配信元）
        expected: 文書 2（深さ 1、`via.from` が doc-1）と文書 3（深さ 2）
      - name: test_trace_related_when_code_paths
        case: 正常
        summary: コードのパスから
        condition: '`records`・`body_file` の行で、`code_paths: [src/a.py]`'
        mock: なし
        expected: '`src/a.py` を本文に持つ文書を起点にたどる'
      - name: test_trace_related_when_seen
        case: 正常
        summary: 返し済みの相手
        condition: '同じ `session_id` で 2 回、3 回目は `repeat_seen: true`'
        mock: なし
        expected: 2 回目の名前・概要文が `SEEN_MARK`、3 回目は名前
      - name: test_trace_related_when_depth_over
        case: 正常
        summary: 深さの丸め
        condition: '`depth: 5`'
        mock: なし
        expected: '`notes` に 4 に丸めたこと'
      - name: test_trace_related_when_both_given
        case: 異常
        summary: 起点の指定の誤り
        condition: '`from_ids` と `code_paths` の両方'
        mock: なし
        expected: '`InvalidArgumentError`'
        exception: 起点の指定の誤り・`depth` が 1 未満
      - name: test_trace_related_when_missing
        case: 異常
        summary: 無い起点
        condition: '`from_ids: [doc-9]`'
        mock: なし
        expected: '`DocumentNotFoundError` の `candidates` に近い ID'
        exception: 無い起点
  - name: render_related_markdown
    title: 関連のたどりの結果の Markdown
    kind: 関数
    container: features/related/render.py
    usecase: 関連
    role: 変換
    summary: '`format: markdown` の本文を作る'
    scope: public
    thread_safe: true
    args:
      - name: result
        title: 結果
        type: RelatedResult
        required: true
        passing: positional
        description: 描く結果
    returns:
      type: str
      description: Markdown
    process: |-
      1. 先頭の行に `{起点の ID を , で繋いだもの} から {件数} 件` を置く
      2. `| id | 深さ | たどった関連 | name | description |` の表を置く（たどった関連は `{元} → {種類}`、`in` は `{元} ← {種類}`。別の配信元の文書は `id` を `{source}:{id}`）
      3. 候補があれば `| 候補 | 信号 | 順位の値 |` の表と、採用するときは `write_docs` で `related` に追加することを置く
      4. `notes` を `> ` の行で置く
refs:
  - dev/設計書/インターフェース定義/開発ドキュメントサーバー/関連のたどり#
