title: 開発ドキュメントサーバー / 配信元 / registry.py
lead: 配信する配信元の一覧と読み直し。
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        配信元の一覧 ..> 配信元の読み込み : 行ごとに
        class 配信元の一覧 {
          +読み直す(端末の設定) list
          +引く(配信元の ID) 配信中の配信元
          +配信中() list
          +状態の一覧() list
        }
        class 配信元の読み込み {
          <<function>>
        }
        click 配信元の読み込み href "./service.py.yaml#配信元の読み込み"
classes:
  - name: SourceRegistry
    title: 配信元の一覧
    container: features/sources/registry.py
    usecase: 共通
    role: レジストリ
    summary: 配信中の配信元と状態を持ち、読み直しで一覧ごと差し替える
    description: |-
      一覧は `dict[str, ServedSource]` と `list[SourceStatus]` の組を 1 つの属性で持ち、読み直しは新しい組を作り終えてから属性を入れ替える。
      読む側は入れ替えの前後どちらかの組だけを見るので、ロックを取らない。読み直し同士は `_reload_lock` で順にする。
    kind: クラス
    properties:
      - name: _snapshot
        title: 一覧
        type: tuple[dict[str, ServedSource], list[SourceStatus]]
        access: 内部 (_)
        default: ({}, [])
        description: 配信中の配信元（ID → 配信元）と、`sources[]` の順の状態
      - name: _reload_lock
        title: 読み直しの排他
        type: threading.Lock
        access: 内部 (_)
        description: 読み直しを 1 つずつにする
      - name: _entries
        title: 行の控え
        type: dict[str, tuple[SourceEntry, int]]
        access: 内部 (_)
        default: '{}'
        description: 配信中の ID → 読んだ端末の設定の行と位置。`default_ref` が進んだときの組み立て直しに使う
      - name: _on_rebuilt
        title: 組み立て直した後の処理
        type: Callable[[ServedSource], None] | None
        access: 内部 (_)
        default: None
        description: 初期化の引数 `on_rebuilt` で受け取り、`get` が配信元を組み立て直して差し替えた後に、新しい配信元を渡して呼ぶ。`None` なら呼ばない
      - name: _ready
        title: 読み込みの済み
        type: threading.Event
        access: 内部 (_)
        description: 初回の読み直しが終わったか。初期化の引数 `loading` が `True` なら立てずに作り、`False`（既定）なら立てて作る。`reload` が終わるとき（例外で止まったときも）に立てる
    methods:
      - name: reload
        title: 読み直す
        kind: メソッド
        summary: 端末の設定の全行を読み直し、一覧を差し替える
        scope: public
        thread_safe: true
        side_effects: 一覧を入れ替える
        args:
          - name: terminal
            title: 端末の設定
            type: TerminalConfig
            required: true
            passing: positional
            description: 読んだ端末の設定
        returns:
          type: list[SourceStatus]
          description: '`sources[]` の順の状態'
        process: |-
          1. `_reload_lock` を取る
          2. `sources[]` の行ごとに配信元を読む（配信元の読み込み）
          3. 配信する配信元の ID が先の行と重なる場合（`id` を省いて設定の `name` が同じなど）、後の行を `sources[{n}].id` の重複の違反を持つ `not_served` にする
          4. 新しい組を作り、`_snapshot` を入れ替える
             - `[info]` 配信元を読み直した（配信中の ID の並び・外した数）
          5. `_ready` を立て、状態を返す
             - 手順 2〜4 で例外が起きた場合も `_ready` を立ててから送り直す（`_snapshot` は入れ替えない）
        unit_tests:
          - name: test_source_registry_reload
            case: 正常
            summary: 状態を行の順に返す
            condition: '`sources` に配信できる行・検証に失敗する行・無効の行'
            mock: 配信元の読み込み（行ごとに決めた結果を返す偽物）
            expected: 状態が `serving`・`not_served`・`disabled` の順で、`served()` は 1 つ
          - name: test_source_registry_reload_when_duplicate_name
            case: 正常
            summary: 既定の ID が重なる
            condition: '`id` を省いた 2 行の設定の `name` がどちらも `a`'
            mock: 配信元の読み込み（偽物）
            expected: 後の行が `not_served` で違反が `sources[1].id`
          - name: test_source_registry_reload_when_reading
            case: 正常
            summary: 読み直しの間は古い一覧で応える
            condition: 読み込みの偽物が `threading.Event` で止まっている間に別のスレッドから `get("a")`
            mock: 配信元の読み込み（止められる偽物）
            expected: '`get` が待たずに古い配信元を返し、読み直しの後は新しい配信元を返す'
          - name: test_source_registry_reload_when_loading
            case: 正常
            summary: 初回の読み込みまで get と served を待たせる
            condition: '`SourceRegistry(loading=True)`。読み込みの偽物が `threading.Event` で止まっている間に、別のスレッドから `get("a")` と `served()` を呼ぶ'
            mock: 配信元の読み込み（止められる偽物）
            expected: 合図の前は `loading` が `True` で `get`・`served` が戻らず、`statuses()` は待たずに空を返す。合図の後は `get` が配信元を、`served` が 1 つを返し、`loading` が `False`
          - name: test_source_registry_reload_when_failed
            case: 異常
            summary: 読み込みが例外で止まっても待ちを解く
            condition: '`SourceRegistry(loading=True)`。読み込みの偽物が `RuntimeError` を送る'
            mock: 配信元の読み込み（例外を送る偽物）
            expected: '`reload` が `RuntimeError` を送り、その後 `loading` が `False` で `served()` が待たずに空を返す'
      - name: get
        title: 引く
        kind: メソッド
        summary: 配信中の配信元を ID で引く
        scope: public
        thread_safe: true
        args:
          - name: source_id
            title: 配信元の ID
            type: str
            required: true
            passing: positional
            description: 引く ID
        returns:
          type: ServedSource
          description: 配信中の配信元
        process: |-
          1. `_ready` が立つまで待ち、`_snapshot` を 1 回だけ読み、配信中にあれば、設定の commit を持つ配信元は `default_ref` を commit に解いて比べる。違う場合、`_reload_lock` を取ってその行だけを配信元の読み込みで読み直し、`_snapshot` のその配信元と状態を差し替え、`_reload_lock` を持ったまま `_on_rebuilt` を新しい配信元で呼んでから返す（`[info]` default_ref が進んだので配信元を組み立て直した（ID・前と後の commit））。同じなら配信中の配信元を返す
          2. 状態の一覧にその ID が `not_served` か `disabled` である場合、`SourceNotServedError`（`violations` に状態の違反、`disabled` に無効か）を送る
          3. どちらにも無い場合、`UnknownSourceError` を送る
        exceptions:
          - name: SourceNotServedError
            condition: 検証で外したか無効の配信元
            message: '`{id} は配信していません（{理由}）`'
          - name: UnknownSourceError
            condition: 端末の設定に無い ID
            message: '`配信元 {id} はありません`'
        unit_tests:
          - name: test_source_registry_get
            case: 正常
            summary: 配信中を引く
            condition: '`a` が配信中'
            mock: なし（`_snapshot` を直に入れる）
            expected: '`a` の配信元'
          - name: test_source_registry_get_when_not_served
            case: 異常
            summary: 外した配信元
            condition: '`b` が `not_served`'
            mock: なし
            expected: '`SourceNotServedError` の `violations` が `b` の違反、`disabled` が `False`'
            exception: 検証で外した
          - name: test_source_registry_get_when_unknown
            case: 異常
            summary: 無い配信元
            condition: '`get("z")`'
            mock: なし
            expected: '`UnknownSourceError`'
            exception: 無い ID
          - name: test_source_registry_get_when_default_ref_moved
            case: 正常
            summary: default_ref が進んだら組み立て直す
            condition: '`a` を読んだ後に `default_ref` へ設定の行を足す commit を積む'
            mock: なし（一時フォルダで `git init`）
            expected: '`get("a")` が足した行を持つ配信元を返し、2 回目の `get` は読み直さない'
            exception: '-'
          - name: test_source_registry_get_when_default_ref_moved_with_on_rebuilt
            case: 正常
            summary: 組み立て直した後の処理を呼ぶ
            condition: '`on_rebuilt` に呼ばれた配信元を記録する関数を渡し、`a` を読んだ後に `default_ref` へ設定の行を足す commit を積む'
            mock: なし（一時フォルダで `git init`）
            expected: '`get("a")` の後に `on_rebuilt` が新しい配信元で 1 回呼ばれ、2 回目の `get` では呼ばれない'
            exception: '-'
      - name: served
        title: 配信中
        kind: メソッド
        summary: 配信中の配信元を `sources[]` の順に返す
        scope: public
        thread_safe: true
        returns:
          type: list[ServedSource]
          description: 配信中の配信元
        process: 1. `_ready` が立つまで待ち、`_snapshot` を 1 回だけ読み、状態の順に `serving` の配信元を返す
      - name: statuses
        title: 状態の一覧
        kind: メソッド
        summary: '`sources[]` の順の状態を返す'
        scope: public
        thread_safe: true
        returns:
          type: list[SourceStatus]
          description: 状態の並び
        process: 1. 待たずに `_snapshot` の状態を返す（初回の読み込みの間は空）
      - name: loading
        title: 読み込み中
        summary: 初回の読み込みが終わっていないかを待たずに返す
        description: '`@property`。'
        kind: メソッド
        scope: public
        thread_safe: true
        returns:
          type: bool
          description: '`_ready` が立っていないとき `True`'
        process: 1. `_ready` が立っていなければ `True` を返す
test_files:
  - tests/unit/dev_docs/features/sources/test_registry.py
