title: 開発ドキュメントサーバー / 説明 / source_checks.py
lead: 配信元ごとの検査（同期のずれ・エイリアスのキーの違反・`nav` の警告）の結果を持ち、`describe` の警告に渡す。
data_models:
  - name: SourceCheck
    title: 配信元の検査の結果
    container: features/describe/source_checks.py
    usecase: 説明
    role: DTO
    summary: 1 つの配信元の同期のずれと `nav` の警告
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: report
        title: 同期のずれ
        type: SyncReport
        description: '`check_sync` の結果'
      - name: nav
        title: nav の警告
        type: list[Violation]
        description: '`nav_warnings` の結果'
classes:
  - name: SourceChecks
    title: 配信元の検査の控え
    container: features/describe/source_checks.py
    usecase: 説明
    role: 状態
    summary: 配信元の ID ごとに最後の検査の結果を持つ
    description: 起動のときに 1 つだけ作り、`Handlers.checks` に持たせる。読み書きは 1 つのロックで行う。
    methods:
      - name: refresh
        title: 検査の流し直し
        summary: 配信元を検査し、結果を持って返す
        kind: メソッド
        scope: public
        thread_safe: true
        side_effects: その配信元の結果を置き換える
        args:
          - name: store
            title: 文書のストア
            type: DocumentStore
            required: true
            passing: positional
            description: 配信元の文書を読む
          - name: source
            title: 配信元
            type: ServedSource
            required: true
            passing: positional
            description: 検査する配信元
        returns:
          type: SourceCheck
          description: 検査の結果
        process: |-
          1. 同期のずれ（`check_sync`）と `nav` の警告（`nav_warnings`）を求める（ロックの外）
          2. ロックを取り、配信元の ID の結果を置き換えて返す
        unit_tests:
          - name: test_source_checks_refresh
            case: 正常
            summary: 検査して結果を持つ
            condition: 管理用の YAML に無いファイルが 1 件ある配信元 sample
            mock: なし（一時フォルダの配信元）
            expected: 返した結果と `get("sample")` の `report.unindexed_files` が 1 件
      - name: get
        title: 結果の取得
        summary: 配信元の ID の最後の検査の結果を返す
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: source_id
            title: 配信元の ID
            type: str
            required: true
            passing: positional
            description: 配信元の ID
        returns:
          type: SourceCheck | None
          description: まだ検査していなければ `None`
        unit_tests:
          - name: test_source_checks_get_when_unchecked
            case: 正常
            summary: 検査していない配信元
            condition: 何も検査していない
            mock: なし
            expected: '`None`'
      - name: refresh_later
        title: 裏での検査の流し直し
        summary: 配信元を裏のスレッドで検査し直し、待たずに戻る
        kind: メソッド
        scope: public
        thread_safe: true
        side_effects: スレッドを 1 つ起動する
        args:
          - name: store
            title: 文書のストア
            type: DocumentStore
            required: true
            passing: positional
            description: 配信元の文書を読む
          - name: sources
            title: 配信元
            type: list[ServedSource]
            required: true
            passing: positional
            description: 検査し直す配信元
        returns:
          type: threading.Thread
          description: 起動したスレッド
        process: |-
          1. 配信元ごとに検査の流し直しを呼ぶ daemon のスレッドを起動して返す
             - 検査が例外を送った場合、`[ERROR]` 配信元の検査に失敗した（配信元の ID）をログに書き、残りの配信元を続ける
        unit_tests:
          - name: test_source_checks_refresh_later
            case: 正常
            summary: 裏で検査し直す
            condition: 配信元 sample を渡し、返したスレッドを `join` する
            mock: なし
            expected: '`get("sample")` が結果を返す'
refs:
  - dev/設計書/インターフェース定義/開発ドキュメントサーバー/配信元の説明#
test_files:
  - tests/unit/dev_docs/features/describe/test_source_checks.py
