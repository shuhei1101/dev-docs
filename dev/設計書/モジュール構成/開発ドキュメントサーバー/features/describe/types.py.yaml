title: 開発ドキュメントサーバー / 説明 / types.py
lead: '`describe` の要求と結果の型。'
data_models:
  - name: DescribeRequest
    title: 説明の要求
    container: features/describe/types.py
    usecase: 説明
    role: DTO
    summary: '`describe` の引数'
    description: '`pydantic.BaseModel`（`extra="forbid"`）。キーの意味はインターフェース定義『配信元の説明』の `request`。'
    properties:
      - name: source
        title: 配信元
        type: str | None
        access: 公開
        default: None
        description: '`None` は使える配信元の一覧'
      - name: kind
        title: 種類
        type: str | None
        access: 公開
        default: None
        description: '`source` を渡したときだけ'
      - name: worktree
        title: ワークツリー
        type: str | None
        access: 公開
        default: None
        description: 設定とスキーマを読むワークツリー
      - name: format
        title: 形式
        type: Literal['markdown', 'json']
        access: 公開
        default: '"markdown"'
        description: 返す形式
      - name: cwd
        title: 作業場所
        type: str | None
        access: 公開
        default: None
        description: フックが入れる
      - name: outside_scope
        title: 作業範囲の外も読むか
        type: bool
        access: 公開
        default: 'False'
        description: '`True` のとき、`scope` に当たらない配信元を `outside_read` が真なら作業範囲の外（参考）として読む（`source` が ID 1 つのときだけ効く）。引数なしの一覧には効かない'
  - name: KindSummary
    title: 種類の概要
    container: features/describe/types.py
    usecase: 説明
    role: DTO
    summary: 種類の一覧の 1 行
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: id
        title: 種類の ID
        type: str
        access: 公開
        description: '`documents[].id`'
      - name: description
        title: 説明
        type: str
        access: 公開
        description: スキーマの `description`。無ければ行の `title`、どちらも無ければ空
  - name: SourceListResult
    title: 使える配信元の一覧
    container: features/describe/types.py
    usecase: 説明
    role: DTO
    summary: 引数なしの結果
    description: '`dataclass(frozen=True)`。SessionStart で注入する一覧（#4）と同じ中身。'
    properties:
      - name: workplace
        title: 作業場所
        type: Workplace
        access: 公開
        description: 作業場所の説明の結果
      - name: sources
        title: 配信元
        type: list[SourceAccess]
        access: 公開
        description: 使える配信元の結果
  - name: SourceGuideResult
    title: 配信元の説明書
    container: features/describe/types.py
    usecase: 説明
    role: DTO
    summary: '`source` だけの結果'
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: source_id
        title: 配信元の ID
        type: str
        access: 公開
        description: 配信元の ID
      - name: instructions
        title: 説明書
        type: str
        access: 公開
        description: 配信元の設定の `instructions` をそのまま
      - name: kinds
        title: 種類
        type: list[KindSummary]
        access: 公開
        description: 有効な文書の行の順
      - name: outside_scope
        title: 作業範囲の外から読んだか
        type: bool
        access: 公開
        default: 'False'
        description: 読んだ場所の `outside_scope`
      - name: refs
        title: ブランチとタグ
        type: dict[str, list[str]] | None
        access: 公開
        description: '`{branches, tags}`（リビジョンの一覧の名前だけ）。Git でない配信元は `None`'
        default: None
      - name: worktrees
        title: ワークツリー
        type: list[WorktreeInfo] | None
        access: 公開
        description: ワークツリーの一覧。Git でない配信元は `None`
        default: None
  - name: KindSchemaResult
    title: 種類のスキーマ
    container: features/describe/types.py
    usecase: 説明
    role: DTO
    summary: '`source`・`kind` の結果'
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: source_id
        title: 配信元の ID
        type: str
        access: 公開
        description: 配信元の ID
      - name: kind
        title: 種類
        type: str
        access: 公開
        description: 種類の ID
      - name: schema_text
        title: スキーマの YAML
        type: str
        access: 公開
        description: スキーマのファイルの内容そのまま（`markdown` で返す）
      - name: schema
        title: スキーマ
        type: dict[str, Any]
        access: 公開
        description: 読んだスキーマ（`json` で返す）
      - name: metadata
        title: メタデータの対応
        type: dict[str, str]
        access: 公開
        description: 行の `metadata`（共通のキー → 列名）。持たない行は空
      - name: outside_scope
        title: 作業範囲の外から読んだか
        type: bool
        access: 公開
        default: 'False'
        description: 読んだ場所の `outside_scope`
