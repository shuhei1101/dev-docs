title: 開発ドキュメントサーバー / 書き込み / ids.py
lead: '`ids.format` からの ID の生成。'
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        文書の書き込み ..> IDを作る
        class 文書の書き込み {
          <<function>>
        }
        class IDを作る {
          <<function>>
        }
        click 文書の書き込み href "./service.py.yaml#文書の書き込み"
constants:
  - name: ID_FALLBACK_SLUG
    title: slug の代わり
    container: features/write/ids.py
    usecase: 書き込み
    summary: '`name` から slug を作れないときに使う語'
    value: '"doc"'
functions:
  - name: generate_id
    title: IDを作る
    kind: 関数
    container: features/write/ids.py
    usecase: 書き込み
    role: 変換
    summary: '`ids.format` の `{kind}`・`{slug}` を埋めて、配信元の中で重ならない ID を作る'
    scope: public
    thread_safe: true
    args:
      - name: fmt
        title: ID の付け方
        type: str
        required: true
        passing: positional
        description: '`SourceConfig.ids_format`'
      - name: kind
        title: 種類
        type: str
        required: true
        passing: keyword
        description: '`{kind}` に入れる'
      - name: data
        title: 内容
        type: Mapping[str, Any]
        required: true
        passing: keyword
        description: '`name` から slug を作る'
      - name: existing
        title: 使われている ID
        type: Collection[str]
        required: true
        passing: keyword
        description: 配信元の ID（同じ呼び出しで先に作った ID を含む）
    returns:
      type: str
      description: 作った ID
    process: |-
      1. slug は `name` を NFKC と小文字にし、`[a-z0-9]` 以外の並びを `-` にして前後の `-` を除いたもの。空なら `ID_FALLBACK_SLUG`
      2. `fmt` の `{kind}`・`{slug}` を置き換える
      3. `existing` にあれば、末尾に `-2`・`-3`… を付けて重ならない最初の ID にする
    unit_tests:
      - name: test_generate_id
        case: 正常
        summary: slug と重なり
        condition: '`{kind}-{slug}`、`kind="sample"`、`name: "Doc Three!"`、`existing` に `sample-doc-three`'
        mock: なし
        expected: '`sample-doc-three-2`'
      - name: test_generate_id_when_no_ascii
        case: 正常
        summary: slug を作れない
        condition: '`name: 文書`'
        mock: なし
        expected: '`sample-doc`'
test_files:
  - tests/unit/dev_docs/features/write/test_ids.py
