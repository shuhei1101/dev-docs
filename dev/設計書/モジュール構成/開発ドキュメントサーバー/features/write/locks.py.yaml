title: 開発ドキュメントサーバー / 書き込み / locks.py
lead: 配信元ごとの書き込みの排他。
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        文書の書き込み ..> 配信元ごとの排他
        文書の削除 ..> 配信元ごとの排他
        class 文書の書き込み {
          <<function>>
        }
        class 文書の削除 {
          <<function>>
        }
        class 配信元ごとの排他 {
          +握る(配信元の ID) ContextManager
        }
        click 文書の書き込み href "./service.py.yaml#文書の書き込み"
        click 文書の削除 href "./service.py.yaml#文書の削除"
classes:
  - name: SourceLocks
    title: 配信元ごとの排他
    container: features/write/locks.py
    usecase: 書き込み
    role: 排他
    summary: 書き込み・削除を配信元ごとに 1 つずつにする
    description: プロセスの中だけの排他。dev-docs の外からの直接の編集は、バージョンの確かめで防ぐ。
    kind: クラス
    properties:
      - name: _locks
        title: 排他
        type: dict[str, threading.Lock]
        access: 内部 (_)
        description: 配信元の ID → 排他
      - name: _guard
        title: 辞書の排他
        type: threading.Lock
        access: 内部 (_)
        description: '`_locks` を守る'
    methods:
      - name: hold
        title: 握る
        summary: 配信元の排他を握るコンテキストマネージャを返す
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: source_id
            title: 配信元の ID
            type: str
            required: true
            passing: positional
            description: 書く配信元
        returns:
          type: ContextManager[None]
          description: 抜けるときに放す
        process: 1. `_guard` の中で配信元の排他を引き（無ければ作り）、それを握って返す
        unit_tests:
          - name: test_source_locks_hold
            case: 正常
            summary: 同じ配信元は待つ
            condition: 2 つのスレッドが同じ配信元を握り、片方が 0.2 秒眠る
            mock: なし
            expected: もう片方は眠り終わるまで入らない。別の配信元は待たない
test_files:
  - tests/unit/dev_docs/features/write/test_locks.py
