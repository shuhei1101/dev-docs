title: 開発ドキュメントサーバー / 変換 / diagrams.py
lead: '`x-diagram` の値と手で書く Mermaid の、mdmark の図の部品か Mermaid のコードブロックへの描画。'
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        スキーマ駆動の変換 ..> 図の組み立て
        スキーマ駆動の変換 ..> テーブルの論理名の引き方
        図の組み立て ..> テーブルの論理名の引き方
        本文の書き換え ..> 手で書く図の組み立て
        図の組み立て ..> フロー図の配置
        手で書く図の組み立て ..> Mermaidの読み取り
        手で書く図の組み立て ..> フロー図の配置
        class スキーマ駆動の変換 {
          <<function>>
        }
        class 本文の書き換え {
          <<function>>
        }
        class 図の組み立て {
          <<function>>
        }
        class テーブルの論理名の引き方 {
          <<function>>
        }
        class 手で書く図の組み立て {
          <<function>>
        }
        class フロー図の配置 {
          <<function>>
        }
        class Mermaidの読み取り {
          <<function>>
        }
        click スキーマ駆動の変換 href "./markdown.py.yaml#スキーマ駆動の変換"
        click 本文の書き換え href "./inline.py.yaml#本文の書き換え"
        click フロー図の配置 href "./flow_layout.py.yaml#フロー図の配置"
        click Mermaidの読み取り href "./mermaid.py.yaml#Mermaid の読み取り"
constants:
  - name: FLOW_KINDS
    title: フロー図にする種類
    container: features/convert/diagrams.py
    usecase: 文書の取得
    summary: mdmark のフロー図にする `x-diagram`
    value: '`flowchart`・`dataflow`・`architecture`・`state`'
  - name: NODE_KINDS
    title: 箱の種類の対応
    container: features/convert/diagrams.py
    usecase: 文書の取得
    summary: '`x-diagram` のノードの `kind`・`shape` から mdmark の箱の種類を決める。どれにも当たらなければ `script`'
    value: '`kind` の `actor`・`external` と `shape` の `stadium`・`circle` は `external`、`kind` の `store` と `shape` の `cylinder` は `data`、`shape` の `diamond` は `dm`'
  - name: ER_CARDINALITIES
    title: ER 図の多重度の対応
    container: features/convert/diagrams.py
    usecase: 文書の取得
    summary: Mermaid の多重度の片端の記号から、mdmark の ER 図の部品の多重度
    entries:
      - key: '`||`'
        value: '`1`'
      - key: '`|o`・`o|`'
        value: '`0..1`'
      - key: '`|{`・`}|`'
        value: '`1..n`'
      - key: '`o{`・`}o`'
        value: '`0..n`'
  - name: ER_FOREIGN_KEY_COMMENT
    title: 実体の列の外部キーの注記
    container: features/convert/diagrams.py
    usecase: 文書の取得
    summary: '`key: FK` の実体の列の `comment` から、指す実体と列を取り出す正規表現'
    value: '`^参照: (?P<entity>.+)\.(?P<column>[^.\s]+)$`'
  - name: ER_LAYOUT
    title: ER 図の配置の寸法
    container: features/convert/diagrams.py
    usecase: 文書の取得
    summary: ER 図のテーブルを格子に置く寸法（px）。`head`・`row`・`frame` は mdmark の ER 図の寸法（`ER_METRICS`）と同じ値
    entries:
      - key: per_row
        value: '3'
        description: 1 段に並べるテーブルの数
      - key: width
        value: '240'
        description: テーブルの幅
      - key: gap_x
        value: '96'
        description: テーブルの横の間隔（関連の線の縦の部分を通す）
      - key: gap_y
        value: '48'
        description: 段の縦の間隔
      - key: margin
        value: '24'
        description: 図の端の余白
      - key: head
        value: '44'
        description: テーブルの見出しの高さ
      - key: row
        value: '26'
        description: 列の行の高さ
      - key: frame
        value: '4'
        description: テーブルの枠と余白
functions:
  - name: render_diagram
    title: 図の組み立て
    kind: 関数
    container: features/convert/diagrams.py
    usecase: 文書の取得
    role: 変換
    summary: '`x-diagram` の種類で、値から本文に置く図のブロックを組み立てる'
    scope: public
    thread_safe: true
    args:
      - name: value
        title: 値
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 図の値
      - name: kind
        title: 図の種類
        type: DiagramKind
        required: true
        passing: positional
        description: スキーマの `x-diagram`
      - name: head
        title: 図の見出し
        type: DiagramHead
        required: true
        passing: positional
        description: mdmark の図の部品の定義の `title`・`scope`・`updated`
      - name: tables
        title: テーブル
        type: Sequence[Mapping[str, Any]]
        required: false
        default: ()
        passing: keyword
        description: '`er` のとき、同じ文書の `tables[]`。`columns` を持たない実体の列を補う'
      - name: classification
        title: 分類
        type: str | None
        required: false
        default: None
        passing: keyword
        description: '`er` のとき、描画中の文書の分類（文書のファイル名の拡張子を除いた名前）。`foreign_key.table` の `{分類}/` が同じ分類かを判定する'
    returns:
      type: str
      description: '`<!-- flow -->`・`<!-- er -->` で囲んだ定義の JSON のコードブロック'
    process: |-
      1. `flowchart`・`dataflow`・`architecture` は、`nodes` を箱（名前は `label`、無ければ `id`。種類は `NODE_KINDS`）、`edges` を線（`from`・`to`・`label`）にしたフロー図の中間データにする。向きは `direction` が `LR` か、`direction` が無く種類が `dataflow`・`architecture` なら `LR`、それ以外は `TD`。`subgraphs`・`clicks` は mdmark のフロー図に置き場が無いため描かず、図の元データの表に残す
      2. `state` は、`states` と遷移の端に出た状態を出た順に箱（種類は `script`）にし、`initial` の箱の補足を `初期状態`、`final` の箱の補足を `終了状態` にする。遷移は線で、ラベルは `{trigger} [{condition}]`（どちらも無ければ無し）。向きは `TD`
      3. 中間データをフロー図の配置にかけ、定義を JSON（`ensure_ascii=False`・字下げ 2）にして `<!-- flow -->`・```json・定義・```・`<!-- /flow -->` の順に置く
      4. `er` は、mdmark の ER 図の部品の定義（`title`・`scope`・`updated`・`width`・`tables`・`relations`）を組み立て、JSON にして `<!-- er -->` で囲む
         - 実体（`entities[]`）を出た順にテーブルにする。`id`・`label` は実体の `name`。`tables` のうち `title` が実体の `name` に当たるテーブルがあれば、`name` をそのテーブルの `name`（物理名）、`desc` をその `summary` にする（無ければ `name` は実体の `name`）
         - 列は、実体が `columns` を持てばその要素（`name`・`type`、`key` の `PK` は `pk: true`、`FK` は `fk: true`）、持たなければ当たったテーブルの `columns` の要素（`name`・`type`・`desc` は `title`、`primary_key` は `pk`、`foreign_key` は `fk`、`not_null` は `nn` を `true`）にする。どちらも無ければ空
         - 関連（`relations[]`）ごとに、`cardinality` を `--`（か `..`）の前後に分け、`ER_CARDINALITIES` で `fromCard`・`toCard` にする。両端の列は、先（`to`）の実体の列のうち外部キーが元（`from`）の実体の列を指す列を `toColumn`、指された列を `fromColumn` にし、無ければ元の実体の列のうち外部キーが先の実体の列を指す列を `fromColumn`、指された列を `toColumn` にする。`label` はそのまま
           - 外部キーが指す実体と列は、テーブルの列は `foreign_key.table` を最後の `.` でテーブルと列に分け（テーブルが `{分類}/{テーブル名}` のとき、`{分類}` が `classification` と同じなら `{テーブル名}` を同じ文書のテーブルとして当て、違えば他の分類のテーブルなので当てない）、そのテーブル名から引いた論理名（`tables` のテーブルの論理名の引き方）の実体にする。実体の列は `key` が `FK` で `comment` が `ER_FOREIGN_KEY_COMMENT` に当たるとき、その `entity`・`column`
           - 多重度を読み替えられない関連と、両端の列が決まらない関連は `relations` に入れない
         - テーブルの位置は `ER_LAYOUT` で格子に置く。`per_row` 個ずつ段にし、`x` は `margin + 列の番号 * (width + gap_x)`、`y` は前の段の `y` に前の段で一番高いテーブルの高さ（`head + 列の数 * row + frame`）と `gap_y` を足した値（最初の段は `margin`）。`w` は `width`。図の `width` は `margin * 2 + 段のテーブルの数の最大 * width + (その数 - 1) * gap_x`
    exceptions:
      - name: ValueError
        condition: 知らない図の種類
        message: '`x-diagram {kind} は描けません`'
    unit_tests:
      - name: test_render_diagram
        case: 正常
        summary: フローチャート
        condition: '`nodes` 2 つ（`label` が `A`・`B`）・ラベル `x` の `edges` 1 つ・`direction` 無し'
        mock: なし
        expected: '`<!-- flow -->` で囲んだ JSON で、`title`・`scope`・`updated` が見出しの値、`nodes` の `name` が `A`・`B`、`wires` 1 本の `label` が `x`。```mermaid が無い'
      - name: test_render_diagram_when_node_kinds
        case: 正常
        summary: 箱の種類
        condition: '`kind` が `actor`・`store`・`process` のノード'
        mock: なし
        expected: '箱の `kind` が `external`・`data`・`script`'
      - name: test_render_diagram_when_state
        case: 正常
        summary: 状態遷移
        condition: '`initial: 下書き`・`final: [公開]`・`transitions` 2 つ（1 つは `trigger` と `condition` を持つ）'
        mock: なし
        expected: '箱 `下書き` の `sub` が `初期状態`、箱 `公開` の `sub` が `終了状態`、線のラベルが `{trigger} [{condition}]`'
      - name: test_render_diagram_when_er
        case: 正常
        summary: ER 図
        condition: '`kind="er"`、実体 `顧客`（`columns` 無し）・`注文`（`columns` に `id`（`key: PK`）と `customer_id`（`key: FK`・`comment: 参照: 顧客.id`））、関連 `顧客` → `注文`（`||--o{`・`label: 注文する`）、`tables` に `name: customers`・`title: 顧客` のテーブル（`id`（`primary_key: true`・`not_null: true`）と `email`）'
        mock: なし
        expected: '`<!-- er -->` で囲んだ JSON で、`tables` の `顧客` の `name` が `customers`・`columns` が `id`（`pk`・`nn`）と `email`、`注文` の `columns` が `id`（`pk`）と `customer_id`（`fk`）。`relations` 1 件が `fromColumn: id`・`toColumn: customer_id`・`fromCard: 1`・`toCard: 0..n`・`label: 注文する`。```mermaid が無い'
      - name: test_render_diagram_when_er_table_foreign_key
        case: 正常
        summary: テーブルの列の外部キー
        condition: '`kind="er"`、実体 `顧客`・`支払い`（どちらも `columns` 無し）と関連 `顧客` → `支払い`（`||--o{`）、`tables` に `customers`（`顧客`。列 `id`）と `payments`（`支払い`。列 `customer_id` の `foreign_key.table` が `customers.id`）'
        mock: なし
        expected: '`relations` 1 件が `fromColumn: id`・`toColumn: customer_id`。`foreign_key.table` を論理名の `顧客.id` にしても同じ'
      - name: test_render_diagram_when_er_own_classification
        case: 正常
        summary: 自分の分類を付けたテーブルの列の外部キー
        condition: '`test_render_diagram_when_er_table_foreign_key` と同じ値で、`customer_id` の `foreign_key.table` が `注文/customers.id`。`classification` が `注文` の場合と `請求` の場合'
        mock: なし
        expected: '`注文` では `relations` 1 件が `fromColumn: id`・`toColumn: customer_id`。`請求` では `relations` が空'
      - name: test_render_diagram_when_er_reverse_foreign_key
        case: 正常
        summary: 元の実体が外部キーを持つ
        condition: '`kind="er"`、関連 `注文` → `顧客`（`}o--||`）で、`注文` の列 `customer_id` が `参照: 顧客.id`'
        mock: なし
        expected: '`relations` 1 件が `fromColumn: customer_id`・`toColumn: id`・`fromCard: 0..n`・`toCard: 1`'
      - name: test_render_diagram_when_er_unresolved
        case: 正常
        summary: 端の列が決まらない関連と読み替えられない多重度
        condition: '`kind="er"`、名前だけの実体 `商品` への関連（`}o--||`）と、多重度が `||..xx` の関連'
        mock: なし
        expected: '`relations` が空で、`tables` に `商品` が `columns` 空で入る'
      - name: test_render_diagram_when_er_layout
        case: 正常
        summary: 格子の配置
        condition: '`kind="er"`、列 2 つの実体 4 つ'
        mock: なし
        expected: '1 段目の 3 つの `y` が 24、`x` が 24・360・696。4 つ目の `x` が 24、`y` が `24 + 44 + 2 * 26 + 4 + 48`。図の `width` が `24 * 2 + 3 * 240 + 2 * 96`'
      - name: test_render_diagram_when_unknown
        case: 異常
        summary: 知らない種類
        condition: '`kind="gantt"`'
        mock: なし
        expected: '`ValueError`'
        exception: 知らない図の種類
  - name: er_table_titles
    title: テーブルの論理名の引き方
    kind: 関数
    container: features/convert/diagrams.py
    usecase: 文書の取得
    role: 変換
    summary: 同じ文書の `tables[]` から、テーブルの物理名（`name`）と論理名（`title`）のどちらからも論理名を引く表を作る
    description: ER 図の部品の外部キーの端と、表の外部キーのセルのリンクが、同じ引き方でテーブル名を当てる。
    scope: public
    thread_safe: true
    args:
      - name: tables
        title: テーブル
        type: Sequence[Mapping[str, Any]]
        required: true
        passing: positional
        description: 同じ文書の `tables[]`
    returns:
      type: dict[str, str]
      description: 物理名か論理名から、そのテーブルの論理名
    process: |-
      1. `title` を持つテーブルを出た順に見て、`name` と `title` の値（文字列にする）をそれぞれキーに、`title` を値にして入れる。同じキーが既にあるときは先に入れた値を残す
      2. `title` を持たないテーブルは入れない
    unit_tests:
      - name: test_er_table_titles
        case: 正常
        summary: 物理名と論理名
        condition: '`name: customers`・`title: 顧客` と `name: payments`・`title: 支払い` のテーブル'
        mock: なし
        expected: '`{customers: 顧客, 顧客: 顧客, payments: 支払い, 支払い: 支払い}`'
      - name: test_er_table_titles_when_duplicated_or_untitled
        case: 正常
        summary: 重なるキーと論理名の無いテーブル
        condition: '`name: a`・`title: A` のテーブル、`name: A`・`title: B` のテーブル、`name: c` だけのテーブル'
        mock: なし
        expected: '`A` の値が `A`（先に入れた値）で、`c` のキーが無い'
  - name: render_mermaid
    title: 手で書く図の組み立て
    kind: 関数
    container: features/convert/diagrams.py
    usecase: 文書の取得
    role: 変換
    summary: 手で書く Mermaid のコードを、読み取れれば mdmark の図の部品に、読み取れなければ Mermaid のコードブロックのまま組み立てる
    scope: public
    thread_safe: true
    args:
      - name: code
        title: コード
        type: str
        required: true
        passing: positional
        description: '```mermaid のコードブロックの中身'
      - name: head
        title: 図の見出し
        type: DiagramHead
        required: true
        passing: positional
        description: mdmark の図の部品の定義の `title`・`scope`・`updated`
    returns:
      type: str
      description: '`<!-- flow -->`・`<!-- sequence -->` で囲んだ定義の JSON のコードブロックか、元の ```mermaid のコードブロック'
    process: |-
      1. Mermaid の読み取りにかける
      2. フロー図の中間データは、フロー図の配置にかけて `<!-- flow -->` で囲む
      3. シーケンス図の中間データは、`participants`（`id`・`kind`・`name`）と `steps`（`from`・`to`・`label`、返す線は `reply: true`）の定義にして `<!-- sequence -->` で囲む
      4. `None` なら、`code` を ```mermaid のコードブロックにして返す
    unit_tests:
      - name: test_render_mermaid
        case: 正常
        summary: シーケンス図
        condition: '`participant A as 画面` と `A->>B: 読む` のコード'
        mock: なし
        expected: '`<!-- sequence -->` で囲んだ JSON で、`participants` の `name` が `画面`・`B`、`steps` 1 つの `label` が `読む`'
      - name: test_render_mermaid_when_flowchart
        case: 正常
        summary: フローチャート
        condition: '`flowchart TD` と `a --> b` のコード'
        mock: なし
        expected: '`<!-- flow -->` で囲んだ JSON'
      - name: test_render_mermaid_when_unreadable
        case: 正常
        summary: 読み取れないコード
        condition: '`Note over A: 補足` の行を含む `sequenceDiagram`'
        mock: なし
        expected: '元のコードの全ての行を持つ ```mermaid のコードブロック'
test_files:
  - tests/unit/dev_docs/features/convert/test_diagrams.py
