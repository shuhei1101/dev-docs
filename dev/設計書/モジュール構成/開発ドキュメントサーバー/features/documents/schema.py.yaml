title: 開発ドキュメントサーバー / 文書のストア / schema.py
lead: 種類のスキーマの `$ref` の解決と、`records` の行のスキーマ。
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        文書のストア ..> スキーマの参照の解決
        class 文書のストア {
          <<class>>
        }
        class スキーマの参照の解決 {
          <<function>>
        }
        click 文書のストア href "./store.py.yaml#文書のストア"
functions:
  - name: resolve_schema_refs
    title: スキーマの参照の解決
    kind: 関数
    container: features/documents/schema.py
    usecase: 共通
    role: 変換
    summary: 種類のスキーマの `$ref` を参照先の中身で置き換えたスキーマを返す
    scope: public
    args:
      - name: schema
        title: スキーマ
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 読んだ種類のスキーマ
      - name: base
        title: スキーマのファイル
        type: Path
        required: true
        passing: positional
        description: '相対の `$ref`（`共通.schema.yaml#/$defs/markdown` など）を解く基準のファイル'
    returns:
      type: dict[str, Any]
      description: '`$ref` を解いたスキーマ（`$defs` はそのまま残す）'
    process: |-
      1. `referencing.Registry` に `base` の URI でスキーマを載せ、参照先のファイルは `retrieve` で `base` のフォルダから『YAMLの読み込み』で読む
      2. 値を先頭からたどり、`$ref` を持つオブジェクトは参照先の中身に、`$ref` 以外のキーを重ねたものに置き換えて続けてたどる
      3. たどっている途中の `$ref` に戻る（循環する）場合、その `$ref` は解かずに残す
         - `[warning]` スキーマの循環する参照を解かずに残した（ファイル・`$ref`）
      4. 参照先が無い・読めない場合、その `$ref` は解かずに残す
         - `[warning]` スキーマの参照を解けなかった（ファイル・`$ref`・理由）
    unit_tests:
      - name: test_resolve_schema_refs
        case: 正常
        summary: 同じファイルと別のファイルの参照
        condition: '`properties.a` が `#/$defs/x`、`properties.b` が `共通.schema.yaml#/$defs/markdown` で `title: B` を重ねる'
        mock: なし（`tmp_path`）
        expected: '`a` が `$defs.x` の中身、`b` が `markdown` の中身に `title: B` を重ねたもの'
      - name: test_resolve_schema_refs_when_cycle
        case: 正常
        summary: 循環する参照
        condition: '`$defs.node.properties.children.items` が `#/$defs/node`'
        mock: なし
        expected: '`children.items` が `$ref` のまま残り、`[warning]` が 1 件'
      - name: test_resolve_schema_refs_when_missing
        case: 正常
        summary: 参照先が無い
        condition: '`無い.schema.yaml#/$defs/x`'
        mock: なし
        expected: '`$ref` のまま残り、`[warning]` が 1 件'
  - name: records_item_schema
    title: records の行の 1 行のスキーマ
    container: features/documents/schema.py
    usecase: 共通
    role: 変換
    summary: ファイル全体のスキーマから `records` の要素 1 つのスキーマを取り出す
    description: 文書に当てるスキーマ（`row_schema`）と `check_project` の食い違いの検出が使う。
    kind: 関数
    scope: public
    args:
      - name: schema
        title: スキーマ
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: '`$ref` を解いた行のスキーマ'
      - name: records
        title: 要素のキー
        type: str
        required: true
        passing: positional
        description: 行の `records`
    returns:
      type: dict[str, Any] | None
      description: '`properties.{records}.items`。辞書でない・無いときは `None`'
    process: |-
      1. `schema` の `properties` が辞書で、その `records` の値が辞書で、その `items` が辞書なら `items` を返す
      2. それ以外は `None` を返す
    unit_tests:
      - name: test_records_item_schema
        case: 正常
        summary: 要素のスキーマを取り出す
        condition: '`templates/files.schema.yaml` を読んだスキーマと `files`'
        mock: なし
        expected: '`required` が `[path]` の `items`'
      - name: test_records_item_schema_when_missing
        case: 正常
        summary: 要素のスキーマが無い
        condition: '`properties.files` が `{type: array}` だけのスキーマ、`properties` が無いスキーマ、`files` 以外の `records`'
        mock: なし
        expected: どれも `None`
test_files:
  - tests/unit/dev_docs/features/documents/test_schema.py
