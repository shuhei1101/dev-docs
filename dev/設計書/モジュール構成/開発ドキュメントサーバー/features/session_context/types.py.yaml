title: "開発ドキュメントサーバー / セッションの文脈 / types.py"
lead: '`POST /_admin/session-context` の本文と応答の型と、文脈の文の字数の上限・プロンプトの ID。文はプロンプトの YAML が持ち、コードは持たない。'
data_models:
  - name: SessionContextRequest
    title: セッションの文脈の要求
    container: features/session_context/types.py
    usecase: セッションの文脈
    role: DTO
    summary: SessionStart のフックが送信する本文
    description: '`pydantic.BaseModel`（`extra="ignore"`）。フックの入力に増えたキーを断らないため、知らないキーは捨てる。'
    properties:
      - name: cwd
        title: 作業場所
        type: str
        description: セッションの作業場所の絶対パス
      - name: session_id
        title: セッション ID
        type: str | None
        default: None
        description: Claude Code のセッション ID
      - name: agent_id
        title: サブエージェントの ID
        type: str | None
        default: None
        description: メインのセッションは `None`
      - name: reason
        title: 始まった理由
        type: Literal['startup', 'resume', 'clear', 'compact', 'fork']
        default: "'startup'"
        description: SessionStart の入力の `source`
  - name: ContextSource
    title: 使える配信元
    container: features/session_context/types.py
    usecase: セッションの文脈
    role: DTO
    summary: 応答の `sources[]` の 1 行
    description: '`pydantic.BaseModel`。'
    properties:
      - name: id
        title: 配信元の ID
        type: str
        description: '`SourceAccess.source_id`'
      - name: access
        title: 権限
        type: Literal['read_write', 'read']
        description: '`SourceAccess.access` が `write` なら `read_write`'
  - name: SessionContextResponse
    title: セッションの文脈の応答
    container: features/session_context/types.py
    usecase: セッションの文脈
    role: DTO
    summary: フックが文脈に入れる文と内訳
    description: '`pydantic.BaseModel`。'
    properties:
      - name: context
        title: 文脈の文
        type: str
        description: '`CONTEXT_MAX_CHARS` 字以内'
      - name: sources
        title: 使える配信元
        type: list[ContextSource]
        description: 作業場所から使える配信元
      - name: warnings
        title: 警告
        type: list[str]
        description: 同期のずれ・古い設定・配信していない配信元
      - name: forgotten
        title: 記録を削除したか
        type: bool
        description: 返し済みの記録を削除したら `True`
      - name: loading
        title: 読み込み中
        type: bool
        default: 'False'
        description: 配信元の初回の読み込みが終わっていないとき `True`（その間は `sources`・`warnings` が空）
constants:
  - name: CONTEXT_MAX_CHARS
    title: 文脈の文の上限
    container: features/session_context/types.py
    usecase: セッションの文脈
    summary: '`context` の字数の上限'
    value: '1000'
  - name: FORGET_REASONS
    title: 記録を削除する理由
    container: features/session_context/types.py
    usecase: セッションの文脈
    summary: 返し済みの記録を削除する `reason`
    value: frozenset({'clear', 'compact'})
  - name: SESSION_CONTEXT_PROMPT_ID
    title: 文脈の文のプロンプト
    container: features/session_context/types.py
    usecase: セッションの文脈
    summary: '文脈の文を描画するプロンプトの YAML（`content/prompts/session-context.yaml`、`kind: hook`）の ID'
    value: '"session-context"'
