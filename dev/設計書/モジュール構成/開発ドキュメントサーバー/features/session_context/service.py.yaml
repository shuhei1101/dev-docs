title: "開発ドキュメントサーバー / セッションの文脈 / service.py"
lead: SessionStart のフックが文脈に入れる文（使える配信元・警告）をプロンプトの YAML で描画し、`/clear`・圧縮の後は返し済みの記録を削除する。
functions:
  - name: build_session_context
    title: セッションの文脈の組み立て
    kind: 関数
    container: features/session_context/service.py
    usecase: セッションの文脈
    role: サービス
    summary: 作業場所から使える配信元と警告を集めて文脈の文を作る
    scope: public
    is_async: false
    thread_safe: true
    side_effects: '`reason` が `FORGET_REASONS` で `session_id` があれば、その会話キーの返し済みの記録を削除する'
    args:
      - name: request
        title: 要求
        type: SessionContextRequest
        required: true
        passing: positional
        description: 検証済みの本文
      - name: handlers
        title: 部品
        type: Handlers
        required: true
        passing: keyword
        description: 登録簿・文書のストア・会話の記録・プロンプトの一式を使う
    returns:
      type: SessionContextResponse
      description: 文脈の文と内訳
    process: |-
      1. `reason` が `FORGET_REASONS` で `SessionKey.of(session_id, agent_id)` が `None` でなければ、記録を削除し `forgotten` を `True` にする（`SeenStore.forget`）
         - `[INFO]` 返し済みの記録を削除した（セッション ID・件数）
      2. 配信元の一覧が読み込み中（`handlers.registry.loading`）の場合、配信元を引かずに、`loading` を `True` にして描画した文（文脈の文）と空の `sources`・`warnings` を返す（以降の手順は実行しない）
      3. 作業場所から使える配信元と権限を引く（`available_sources`）
      4. 警告を集める（警告の収集）
      5. 使える配信元と警告で文を描画する（文脈の文、プロンプトは `handlers.prompts`）
    unit_tests:
      - name: test_build_session_context
        case: 正常
        summary: 使える配信元・使い方・警告を返す
        condition: 書ける sample（管理用の YAML に無いファイル 1 件）と読める notes、`reason` は `startup`
        mock: なし（一時ディレクトリ）
        expected: '`sources` が sample（`read_write`）と notes（`read`）、`context` に両方の ID と警告と `instructions` の語を含み `describe(source)` を含まない、`warnings` が 1 件、`forgotten` が `False`'
      - name: test_build_session_context_when_cleared
        case: 正常
        summary: '`/clear` の後は返し済みの記録を削除する'
        condition: '`reason` が `clear`、`session_id` の記録がある'
        mock: なし
        expected: '`forgotten` が `True`、その会話キーの記録が 0 件'
      - name: test_build_session_context_when_resumed
        case: 正常
        summary: 再開では記録を削除しない
        condition: '`reason` が `resume`、`session_id` の記録がある'
        mock: なし
        expected: '`forgotten` が `False`、記録が残る'
      - name: test_build_session_context_when_no_source_available
        case: 正常
        summary: 使える配信元が無い
        condition: '`cwd` がどの配信元の範囲にも当たらない'
        mock: なし
        expected: '`sources` が空、`context` が `/dev-docs:setup` を含み `instructions` の語を含まない'
      - name: test_build_session_context_when_loading
        case: 正常
        summary: 読み込み中は配信元を待たずに案内を返す
        condition: '`SourceRegistry(loading=True)` でまだ読み直していない配信元の一覧を持つ `Handlers`、`cwd` は sample の範囲'
        mock: なし
        expected: 待たずに戻り、`loading` が `True`、`sources`・`warnings` が空、`context` が読み込み中の案内を含み `/dev-docs:setup` を含まない
    callers:
      - dev/設計書/モジュール構成/開発ドキュメントサーバー/features/session_context/route.py#functions[build_session_context_router]
    callees:
      - '#functions[_collect_warnings]'
      - '#functions[_context_text]'
  - name: _collect_warnings
    title: 警告の収集
    kind: 関数
    container: features/session_context/service.py
    usecase: セッションの文脈
    role: 組み立て
    summary: 使える配信元の同期のずれ・古い設定と、配信していない配信元を警告の文にする
    scope: internal
    is_async: false
    thread_safe: true
    args:
      - name: available
        title: 使える配信元
        type: list[SourceAccess]
        required: true
        passing: positional
        description: '`available_sources` の結果'
      - name: handlers
        title: 部品
        type: Handlers
        required: true
        passing: keyword
        description: 登録簿・文書のストア・端末の設定を使う
    returns:
      type: list[str]
      description: 警告の文
    process: |-
      1. 使える配信元ごとに索引の同期を求め、件数が 0 でない並びごとに `{id}: {並びの名前}が {件数} 件あります（check_project で確かめられます）` を加える（`check_sync`）
      2. 使える配信元の設定のバージョンが `old` なら `{id}: 設定のバージョンが古い（{設定}・読める {現在}）。dev-docs migrate で移し替えます` を加える（バージョンの新旧）
      3. 端末の設定のバージョンが `old` なら同じ形の文を加える
      4. 使える配信元ごとに、`alias_violations` が 0 件でなければ `{id}: エイリアスのキーの違反が {件数} 件あります（check_project で確かめられます）` を加え、nav の警告（画面の API）ごとに `{id}: {path}: {rule}` を加える
      5. `not_served` の配信元ごとに `{id}: 配信していません（{先頭の理由}）。check_project で確かめられます` を加える
    unit_tests:
      - name: test_collect_warnings
        case: 正常
        summary: 同期のずれ・古い設定・配信していない配信元を並べる
        condition: 使える配信元 a（ファイルが無い行 2 件・古い設定）、`not_served` の b
        mock: なし
        expected: 警告が 3 件（a の同期・a の古い設定・b の配信していない）
      - name: test_collect_warnings_when_unavailable_source
        case: 正常
        summary: 使えない配信元の同期のずれは載せない
        condition: 配信中だが `available` に無い配信元に同期のずれ 1 件
        mock: なし
        expected: 警告が空
      - name: test_collect_warnings_when_alias_and_nav
        case: 正常
        summary: エイリアスのキーの違反と nav の警告
        condition: 使える配信元 a に、`aliases` が `3` の用語の文書 1 件と、どの文書にも当たらない `auto` の条件 1 つ
        mock: なし
        expected: 警告が 2 件（a のエイリアスのキーの違反 1 件・a の nav の条件）
    callers:
      - '#functions[build_session_context]'
    callees:
      - dev/設計書/モジュール構成/開発ドキュメントサーバー/features/admin/service.py#functions[version_state]
  - name: _context_text
    title: 文脈の文
    kind: 関数
    container: features/session_context/service.py
    usecase: セッションの文脈
    role: 表示
    summary: 配信元と警告をプロンプトの YAML で `CONTEXT_MAX_CHARS` 字以内の文に描画する
    scope: internal
    is_async: false
    thread_safe: true
    args:
      - name: available
        title: 使える配信元
        type: list[SourceAccess]
        required: true
        passing: positional
        description: '`available_sources` の結果（0 件もある）'
      - name: warnings
        title: 警告
        type: list[str]
        required: true
        passing: positional
        description: 警告の収集の結果
      - name: prompts
        title: プロンプトの一式
        type: PromptSet
        required: true
        passing: keyword
        description: '`handlers.prompts`'
      - name: loading
        title: 読み込み中
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: 配信元の一覧が読み込み中か
    returns:
      type: str
      description: 文脈の文
    process: |-
      1. 配信元ごとに `{id, access, description}`（`access` は `read_write` か `read`）を作り、`sources`・`omitted`（0）・`warnings`・`loading` を渡して `SESSION_CONTEXT_PROMPT_ID` を描画する。見出し・配信元の行・権限の表示・instructions を指す行・配信元が無いときの `/dev-docs:setup` の案内・読み込み中の案内・警告の見出しは YAML（`content/prompts/session-context.yaml`）が持つ。YAML は変数 `loading`（真偽値、既定 `false`）を受け、`loading` のときだけ「配信元を読み込んでいることと、終わるまで文書の MCP の呼び出しが待たされること」を出し、`/dev-docs:setup` の案内は `loading` でないときだけ出す
      2. `CONTEXT_MAX_CHARS` を超える場合、`description` を `None` にして描画し直す
      3. それでも超える場合、収まるまで配信元を末尾から 1 件ずつ減らし、減らした件数を `omitted` に入れて描画し直す
    unit_tests:
      - name: test_context_text
        case: 正常
        summary: 配信元の行・警告・instructions を指す行を描画する
        condition: 配信元 2 件（書ける 1 件・読める 1 件）・警告 1 件、プロンプトは同梱した YAML（`load_prompts(DEFAULT_PROMPTS_DIR, required=[SESSION_CONTEXT_PROMPT_ID])`）
        mock: なし
        expected: 配信元の ID・`description`・警告・`instructions` の語を含み、`describe(source)`・`group_by="tags"`・`action:` を含まない
      - name: test_context_text_when_too_long
        case: 正常
        summary: 上限を超えるときは説明を省き、配信元を減らす
        condition: 24 字の ID と 100 字の `description` を持つ書ける配信元 40 件、同梱した YAML
        mock: なし
        expected: 1,000 字以内で、`description` を含まず、減らした件数と `instructions` の語を含む
      - name: test_context_text_when_no_source
        case: 正常
        summary: 使える配信元が無い
        condition: 配信元 0 件・警告なし、同梱した YAML
        mock: なし
        expected: '`/dev-docs:setup` を含み、`instructions` の語を含まない'
      - name: test_context_text_when_loading
        case: 正常
        summary: 読み込み中の案内
        condition: 配信元 0 件・警告なし・`loading=True`、同梱した YAML
        mock: なし
        expected: 読み込み中であることと文書の MCP の呼び出しが待たされることを含み、`/dev-docs:setup` を含まない
    callers:
      - '#functions[build_session_context]'
test_files:
  - tests/unit/dev_docs/features/session_context/test_service.py
