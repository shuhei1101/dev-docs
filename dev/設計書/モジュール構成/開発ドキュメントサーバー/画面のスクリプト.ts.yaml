title: "開発ドキュメントサーバー / 画面のスクリプト"
lead: |-
  画面のブラウザ側の振る舞い。手本はモック `dev/mock/refs/12/assets/mock.js`（モック専用の状態の切り替えは持たない）。
  `.ts` を `tsc` で同じフォルダの `.js` にし、配布に同梱するため生成した `.js` もコミットする（コミットする生成物はディレクトリ構成の `.js` の行に限る）。
  単体テストは `tests/` の `.test.ts` が生成した `.js` を import し、`node --test` で動かす（`tsconfig.json` の `include` に入れない）。
test_files:
  - tests/unit/server/static/comments.test.ts
directory: |-
  ```text
  src/dev_docs/server/static/
  ├─ state.ts / state.js         # PageState の型と readPageState
  ├─ shared.ts / shared.js       # 明暗の切り替え・配信元とリビジョンのメニュー・検索・通知（doc-view・not-found・settings が読む）
  ├─ doc_view.ts / doc_view.js   # 本文の描画・目次・表の件数と列の表示
  ├─ comments.ts / comments.js   # コメント・コピー・Issue の起票
  ├─ settings.ts / settings.js   # 設定画面の一覧と追加・編集・削除のダイアログ
  └─ style.css                   # 画面の CSS（モックの assets/style.css を元にする）
  ```
