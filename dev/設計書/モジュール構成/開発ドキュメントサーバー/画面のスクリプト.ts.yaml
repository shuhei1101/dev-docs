constants:
  - name: SCHEME_KEY
    title: 明暗の保存のキー
    container: server/static/shared.ts
    usecase: 共通
    summary: 明暗を保存する `localStorage` のキー
    value: '"dev-docs-color-scheme"'
  - name: SEARCH_DEBOUNCE_MS
    title: 検索の待ち
    container: server/static/shared.ts
    usecase: 画面の検索
    summary: 入力が止まってから検索を呼ぶまでの時間（ミリ秒）
    value: '200'
  - name: TOAST_MS
    title: 通知を出す時間
    container: server/static/shared.ts
    usecase: 共通
    summary: 通知を出しておく時間（ミリ秒）
    value: '2400'
  - name: COMMENTS_KEY
    title: コメントの保存のキー
    container: server/static/comments.ts
    usecase: 文書の画面
    summary: コメントを溜める `sessionStorage` のキー（ブラウザのタブごと）
    value: '"dev-comments"'
  - name: QUOTE_MAX
    title: 引用を短くし始める字数
    container: server/static/comments.ts
    usecase: 文書の画面
    summary: これを超える引用は先頭と末尾だけを残す
    value: '30'
  - name: QUOTE_KEEP
    title: 短くした引用に残す字数
    container: server/static/comments.ts
    usecase: 文書の画面
    summary: 先頭と末尾にそれぞれ残す字数
    value: '12'
  - name: ADD_BUTTON_ROOM
    title: コメントを追加ボタンの右端からの幅
    container: server/static/comments.ts
    usecase: 文書の画面
    summary: 選択の下に出すボタンを画面の右端から離す幅（px）
    value: '160'
  - name: ISSUE_URL_MAX
    title: 起票画面の URL の上限
    container: server/static/comments.ts
    usecase: 文書の画面
    summary: GitHub の Issue の起票画面の URL の長さの上限
    value: '8000'
  - name: ISSUE_TRUNCATED
    title: 切り詰めた本文の末尾の文
    container: server/static/comments.ts
    usecase: 文書の画面
    summary: URL の上限に収めるため本文を切り詰めたときに末尾へ付ける文
    value: '"\n\n…（長さの上限を超えたため、本文の末尾を切り詰めました。全文はクリップボードにコピーしています）"'
  - name: COMMENT_LABELS
    title: コメントまわりの文言
    container: server/static/comments.ts
    usecase: 文書の画面
    summary: コメントのパネル・通知の文言（モックの `COMMENT_LABELS` と同じ）
    entries:
      - key: add
        value: '"コメントを追加"'
        description: 選択の下に出すボタン
      - key: empty
        value: '"コメントを入力してください"'
        description: 入力欄の検査の文言（画面設計の `input_checks`）
      - key: noSelection
        value: '"コメントを選んでください"'
        description: 選択が無いときの通知
      - key: copied
        value: '"コメントをコピーしました"'
        description: コピーできたときの通知
      - key: copyFailed
        value: '"コピーできませんでした"'
        description: クリップボードに書けないときの通知
data_models:
  - name: PageState
    title: 画面の状態
    container: server/static/state.ts
    usecase: 共通
    role: DTO
    summary: サーバーが埋め込んだ画面の状態の型
    description: TS の `type`。フィールドは画面の『画面の状態』と同じ名前（snake_case）にする。
  - name: StoredComment
    title: コメント
    container: server/static/comments.ts
    usecase: 文書の画面
    role: DTO
    summary: タブに溜める 1 件のコメント
    description: TS の `type`。
    properties:
      - name: id
        title: ID
        type: string
        description: '`crypto.randomUUID()`'
      - name: file
        title: 文書のページのパス
        type: string
        description: 画面の状態の `doc_page`
      - name: heading
        title: 直前の見出し
        type: string | null
        description: 選んだ文字列の前の見出し
      - name: quote
        title: 引用
        type: string
        description: 短くした選んだ文字列
      - name: body
        title: 本文
        type: string
        description: 書いたコメント
      - name: selected
        title: 選択
        type: boolean
        description: コピー・起票の対象か
functions:
  - name: readPageState
    title: 画面の状態の読み取り
    kind: 関数
    container: server/static/state.ts
    usecase: 共通
    summary: '`#page-state` の JSON を読む'
    scope: public
    returns:
      type: PageState
      description: 画面の状態
    process: 1. `document.getElementById("page-state")` の `textContent` を `JSON.parse` して返す
  - name: initScheme
    title: 明暗の切り替え
    kind: 関数
    container: server/static/shared.ts
    usecase: 共通
    summary: 明暗の切り替えのボタンで、システムの設定とその反対を切り替えて保存する
    scope: public
    side_effects: '`meta[name=color-scheme]`・`html[data-scheme]`・`localStorage` を書き換える'
    process: |-
      1. 保存した値があれば先に当てる（`base.html` の `<head>` の小さなスクリプトが描画前に当てる）
      2. クリックで、`light dark` ならシステムの反対を当てて保存し、それ以外なら `light dark` に戻して保存を消す
      3. `aria-pressed` をそろえる
  - name: initSourceMenu
    title: 配信元のメニュー
    kind: 関数
    container: server/static/shared.ts
    usecase: 共通
    summary: 配信元の切り替えのメニューを画面の状態の `sources` で描く
    scope: public
    args:
      - name: state
        type: PageState
        required: true
        description: 画面の状態
    process: 1. 配信元ごとに `/{id}/` の行と、末尾に `設定`（`/_settings/`）の行を並べ、開いている配信元に `aria-current` を付ける
  - name: initRefMenu
    title: リビジョンのメニュー
    kind: 関数
    container: server/static/shared.ts
    usecase: リビジョンの一覧
    summary: 開いたときにリビジョンの一覧を取り、行のクリックでそのリビジョンの同じ文書を開く
    scope: public
    is_async: true
    args:
      - name: state
        type: PageState
        required: true
        description: '`git` が `false` ならボタンを出さない'
    process: |-
      1. 初めて開いたときに GET `/_api/sources/{source}/refs` を呼ぶ
      2. 先頭に `default_ref`（補足 `既定`）、続けてブランチ・タグ・最近の commit を並べる
      3. 行のリンクは `/{source}@{encodeURIComponent(ref)}/{doc_page}`（`default_ref` は `@` なし）。見つからない画面では `{doc_page}` を付けない
      4. 取得に失敗したら、メニューに `リビジョンを取得できませんでした` を出す
  - name: initSearch
    title: 検索
    kind: 関数
    container: server/static/shared.ts
    usecase: 画面の検索
    summary: 検索のポップオーバーと `/` キー、入力ごとの検索と結果の描画
    scope: public
    args:
      - name: state
        type: PageState
        required: true
        description: 配信元と `ref_in_url`
    process: |-
      1. `/` キー（入力欄の外）でポップオーバーを開き、検索欄にフォーカスする
      2. 入力が `SEARCH_DEBOUNCE_MS` 止まったら、空でなければ GET `/_api/sources/{source}/search?q=...&ref=...` を呼ぶ（前の要求は `AbortController` で止める）
      3. 件数と、名前・一致した箇所の結果を描く。リンクは `/{source}[@{ref}]/{path}`
  - name: showToast
    title: 通知
    kind: 関数
    container: server/static/shared.ts
    usecase: 共通
    summary: 通知の要素に文言を `TOAST_MS` だけ出す
    scope: public
    args:
      - name: text
        type: string
        required: true
        description: 文言
  - name: renderBody
    title: 本文の描画
    kind: 関数
    container: server/static/doc_view.ts
    usecase: 文書の画面
    summary: 本文の Markdown を mdmark で描き、差分の元があれば差分を強調する
    scope: public
    is_async: true
    args:
      - name: state
        type: PageState
        required: true
        description: '`diff` と `mdmark_url` の読み込み元'
    process: |-
      1. `article.markdown-body` が無ければ何もしない（文書が無い・変換の失敗）
      2. `import(MDMARK_URL)` で mdmark を読む（URL は `data-mdmark-url` から取る）
         - 読めない場合、`console.error` に URL と例外を出して終える
      3. `data-mdmark-diff-source` があれば、`revisions` が `current`（`diff.current_commit`・`diff.current_date`）と `previous`（`diff.commit`・`diff.date`）を返し、`content` が各 Markdown を返す差分の元で `mount` する。無ければ `markdown` だけで `mount` する
      4. 描いた後、目次の組み立てと列の表示を呼ぶ
  - name: buildToc
    title: 目次の組み立て
    kind: 関数
    container: server/static/doc_view.ts
    usecase: 文書の画面
    summary: 本文の `h2[id]` から右の目次と本文の上の目次を作る
    scope: public
    args:
      - name: article
        type: HTMLElement
        required: true
        description: 描いた本文
    process: |-
      1. `[data-toc-list]` ごとに見出しへのリンクを並べる
      2. 右の目次は `IntersectionObserver` で今いる見出しに `aria-current="location"` を付ける
  - name: initColumns
    title: 列の表示
    kind: 関数
    container: server/static/doc_view.ts
    usecase: 表の列の設定の保存
    summary: 本文の表の前に件数と列の表示を置き、隠す列を当てて保存する
    scope: public
    args:
      - name: article
        type: HTMLElement
        required: true
        description: 描いた本文
      - name: state
        type: PageState
        required: true
        description: '`table_keys`・`hidden_columns`'
    process: |-
      1. 本文の `table` を出る順に `table_keys` と組にする（数が合わない表はキーを持たせず、件数だけ出す）
      2. 表ごとに、見出しの行と同じ数のセルを持つ行を数えて件数を出す
      3. 列ごとのチェックを作り、`hidden_columns[key]` の列を隠す
      4. チェックの切り替えでその場で出し入れし、表の列の設定の保存を呼ぶ。`既定に戻す` は全ての列を出して空で保存する
  - name: saveColumns
    title: 表の列の設定の保存
    kind: 関数
    container: server/static/doc_view.ts
    usecase: 表の列の設定の保存
    summary: PUT `/_api/sources/{source}/columns` を呼ぶ
    scope: public
    is_async: true
    args:
      - name: source
        type: string
        required: true
        description: 配信元の ID
      - name: table
        type: string
        required: true
        description: 表のキー
      - name: hidden
        type: string[]
        required: true
        description: 隠す列（見出しの文字列）
    process: 1. `fetch` で JSON を送る。失敗したら通知で `列の設定を保存できませんでした` を出す（表示はそのまま）
  - name: loadComments
    title: コメントの読み込み
    kind: 関数
    container: server/static/comments.ts
    usecase: 文書の画面
    summary: '`sessionStorage` の `COMMENTS_KEY` を読む'
    scope: public
    returns:
      type: StoredComment[]
      description: 読めないときは空
  - name: saveComments
    title: コメントの保存
    kind: 関数
    container: server/static/comments.ts
    usecase: 文書の画面
    summary: '`sessionStorage` に書き、コメントのボタンの数を描き直す'
    scope: public
    args:
      - name: comments
        type: StoredComment[]
        required: true
        description: 全てのコメント
  - name: shortenQuote
    title: 引用を短くする
    kind: 関数
    container: server/static/comments.ts
    usecase: 文書の画面
    summary: '`QUOTE_MAX` を超える引用を先頭と末尾の `QUOTE_KEEP` 字と `…` にする'
    scope: public
    args:
      - name: text
        type: string
        required: true
        description: 選んだ文字列
    returns:
      type: string
      description: 空白を 1 つにまとめた引用
    unit_tests:
      - name: test_shorten_quote
        case: 正常
        summary: 長い引用
        condition: 40 字の文字列
        mock: なし
        expected: 先頭 12 字・`…`・末尾 12 字
  - name: initCommentPanel
    title: コメントのパネル
    kind: 関数
    container: server/static/comments.ts
    usecase: 文書の画面
    summary: 選択の下のコメントを追加ボタン・パネルの開閉・追加・修正・削除・選択を組む
    scope: public
    args:
      - name: state
        type: PageState
        required: true
        description: '`doc_page`・`github_repository`'
    process: |-
      1. 本文の中の選択で、場所（`doc_page`・直前の見出し）と引用を控え、選択の下にボタンを出す（Esc で隠す）
      2. ボタンでパネルを開き、書く枠に引用を入れる。空白だけの本文は `COMMENT_LABELS.empty` を入力欄の下に出して保存しない
      3. 一覧は溜めた順に、選択・場所・見出しへ移動・引用・本文・修正・削除を描く。`すべて選択` で選択をそろえる
      4. `github_repository` が無ければ `Issue を起票` を出さない
  - name: formatComments
    title: コメントをまとめる
    kind: 関数
    container: server/static/comments.ts
    usecase: 文書の画面
    summary: 選んだコメントを場所・引用・本文の順に区切り線でつなぐ
    scope: public
    args:
      - name: comments
        type: StoredComment[]
        required: true
        description: 選んだコメント
    returns:
      type: string
      description: '`{場所}\n> {引用}\n\n{本文}` を `\n\n---\n\n` でつないだもの'
  - name: copyComments
    title: コメントのコピー
    kind: 関数
    container: server/static/comments.ts
    usecase: 文書の画面
    summary: 選んだコメントをまとめてクリップボードへ書き、結果を通知する
    scope: public
    is_async: true
    returns:
      type: Promise<boolean>
      description: 書けたか
  - name: fitIssueUrl
    title: 起票画面の URL
    kind: 関数
    container: server/static/comments.ts
    usecase: 文書の画面
    summary: '`ISSUE_URL_MAX` に収まるまで本文の末尾を切り詰めた起票画面の URL を返す'
    scope: public
    args:
      - name: repository
        type: string
        required: true
        description: '`owner/name`'
      - name: labels
        type: string[]
        required: true
        description: 起票のラベル（`,` でつなぐ）
      - name: title
        type: string
        required: true
        description: タイトル（文書のページのパスを `、` でつないだもの）
      - name: body
        type: string
        required: true
        description: まとめたコメント
    returns:
      type: string
      description: '`https://github.com/{repository}/issues/new?title=&body=&labels=`'
    process: 1. 収まらなければ、`body` の長さを二分探索で縮め、末尾に `ISSUE_TRUNCATED` を付ける
    unit_tests:
      - name: test_fit_issue_url
        case: 正常
        summary: 長い本文の切り詰め
        condition: 本文が 20,000 字
        mock: なし
        expected: URL が 8,000 字以下で、`body` の末尾が `ISSUE_TRUNCATED`
      - name: test_fit_issue_url_when_short
        case: 正常
        summary: 収まる本文
        condition: 本文が 100 字
        mock: なし
        expected: 本文を切り詰めない
  - name: openIssue
    title: Issue の起票
    kind: 関数
    container: server/static/comments.ts
    usecase: 文書の画面
    summary: 選んだコメントをコピーしてから起票画面を別のタブで開く
    scope: public
    is_async: true
    process: 1. コメントのコピーに失敗したら開かない。成功したら起票画面の URL を `window.open(url, "_blank", "noopener")` で開く
  - name: initSettings
    title: 設定画面
    kind: 関数
    container: server/static/settings.ts
    usecase: 設定画面で端末の設定を変える
    summary: 配信元の一覧と、追加・編集・削除のダイアログを組む
    scope: public
    process: |-
      1. 画面の状態の `sources` で一覧を描く（配信中の行だけ ID をリンクにする）
      2. 追加・編集は `<dialog>` に行の値を入れて開く。設定ファイル・読み取りの範囲・書き込みの範囲は 1 行 1 値
      3. 保存・削除の確定は、今の一覧に入力を反映した `sources[]` を配信元の保存の送信で送る
      4. 200 ならダイアログを閉じて一覧を応答の状態で描き直す。422 なら開いたまま、保存の失敗のまとめと、`errors[].path`（`sources[{n}].{key}`）に当たる入力欄の下にエラーを出す
  - name: putSources
    title: 配信元の保存の送信
    kind: 関数
    container: server/static/settings.ts
    usecase: 設定画面で端末の設定を変える
    summary: PUT `/_api/settings/sources` を呼ぶ
    scope: public
    is_async: true
    args:
      - name: sources
        type: SourceEntry[]
        required: true
        description: '`sources[]` の全行（空の `id`・`scope.read`・`scope.write` は送らない）'
    returns:
      type: 'Promise<{ok: true, sources: SourceStatusItem[]} | {ok: false, errors: {path: string, reason: string}[]}>'
      description: 成功は状態、422・400 は problem+json の `errors`
refs:
  - dev/設計書/画面設計/文書の画面.html#
  - dev/設計書/画面設計/見つからない画面.html#
  - dev/設計書/画面設計/設定画面.html#
