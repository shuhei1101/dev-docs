title: 開発ドキュメントサーバー / 画面のAPI
lead: |-
  #17 の画面が呼ぶ画面の API（文書の取得・画面の検索・リビジョンの一覧・表の列の設定の保存）。
  端末の設定の取得・保存は端末の設定の入口が持つ。
directory: |-
  ```text
  src/dev_docs/features/view/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ types.py      # NavItem / NavTab / ConversionError / GitHubTarget / AliasItem / NavAutoCount / DocumentResponse / DocumentDiff / ScreenSearchItem / ScreenSearchResult / ColumnsRequest
  ├─ paths.py      # page_path / find_page / screen_target
  ├─ nav.py        # build_nav / first_page / mark_nav_changes / nav_auto_counts / check_nav_filters / nav_warnings
  ├─ columns.py    # ColumnSettings
  ├─ search.py     # screen_search
  ├─ document.py   # get_document / not_found_fields
  └─ route.py      # build_view_router（/_api/sources/{source}/docs・search・refs・columns）
  ```
