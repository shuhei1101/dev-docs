title: 開発ドキュメントサーバー / 権限と作業場所
lead: 作業場所（`cwd`）と配信元の `scope` を照らして使える配信元と権限を決め、MCP の引数（`source`・`ref`・`worktree`）から読み書きする場所を解く。
directory: |-
  ```text
  src/dev_docs/features/access/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ types.py      # SourceAccess / Workplace / Target / AccessLevel
  └─ service.py    # access_of / available_sources / describe_workplace / resolve_read_targets / resolve_write_target
  ```
