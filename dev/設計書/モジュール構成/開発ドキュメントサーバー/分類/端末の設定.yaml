title: 開発ドキュメントサーバー / 端末の設定
lead: |-
  端末の設定 `settings.yaml` をスキーマで検証して読み、設定画面から送られた `sources[]` を、他のキーとコメントを保って書き換える。
  端末の設定の取得・保存の入口も持つ。
directory: |-
  ```text
  src/dev_docs/features/settings/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ types.py      # TerminalConfig / SourceEntry / SourceScope / SettingsSourceRow / SettingsSourcesView / SettingsSourcesRequest / SettingsSourcesResponse
  ├─ query.py      # config_path / load_terminal_config / listen_port
  ├─ service.py    # save_sources
  └─ route.py      # build_settings_router（GET・PUT /_api/settings/sources）
  schemas/
  └─ settings.schema.yaml   # 端末の設定のスキーマ（JSON Schema 2020-12）
  ```
