        click 開発ドキュメントサーバーのエラー href "../shared/errors.py.yaml#開発ドキュメントサーバーのエラー"
        click YAMLの読み込み href "../shared/yaml_io.py.yaml#YAMLの読み込み"
        click YAMLを読めない href "../shared/yaml_io.py.yaml#YAMLを読めない"
