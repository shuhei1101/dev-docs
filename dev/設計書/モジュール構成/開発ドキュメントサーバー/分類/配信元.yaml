title: 開発ドキュメントサーバー / 配信元
lead: |-
  端末の設定の `sources[]` の行ごとに、配信元の設定の YAML をマージして検証し、配信する配信元の一覧を作る。
  読み直しは新しい一覧を作ってから差し替え、その間の要求には古い一覧で応える。
directory: |-
  ```text
  src/dev_docs/features/sources/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ types.py      # SourceConfig / DocumentTable / ScriptEntry / ServedSource / SourceStatus
  ├─ merge.py      # merge_configs（設定の YAML のマージ）
  ├─ service.py    # load_source / load_source_at / validate_source_config / check_scripts / compare_config_version / source_schema_json
  └─ registry.py   # SourceRegistry（配信元の一覧と読み直し）
  schemas/
  └─ dev-docs.schema.yaml   # 配信元の設定のスキーマ（JSON Schema 2020-12）
  ```
diagrams:
