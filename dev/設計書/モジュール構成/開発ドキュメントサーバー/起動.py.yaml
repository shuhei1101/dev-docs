title: "開発ドキュメントサーバー / 起動"
lead: |-
  `dev-docs serve` と `dev-docs migrate` の処理。端末の設定と配信元を読み、部品を配線して、画面の API・文書の MCP・管理の MCP・セッションの文脈を 1 つのアプリとして待ち受ける。
  再起動を要求されて止まったときは、同じプロセスを `serve` で置き換える。
  例外から problem+json への変換もここで登録する。
directory: |-
  ```text
  src/dev_docs/
  ├─ main.py                    # Handlers / build_handlers / reload_sources / run_serve / run_migrate / PortInUseError
  └─ server/
     ├─ app.py                  # build_app / route_operation_id（ルートと MCP のマウント）
     ├─ lifespan.py             # build_lifespan（MCP のセッションの管理と記録の削除）
     ├─ error_handlers.py       # register_error_handlers（problem+json）
     └─ screen.py               # build_screen_router / SCREEN_DIST_DIR（画面のビルドの配信）
  ```
