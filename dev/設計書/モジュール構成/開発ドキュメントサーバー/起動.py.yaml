data_models:
  - name: Handlers
    title: 配線済みの関数
    container: main.py
    usecase: 共通
    role: 合成の起点
    summary: 入口（画面の API・MCP）が使う部品を 1 回だけ作って束ねたもの
    description: |-
      `dataclass(frozen=True)`。入口はこの属性から部品を引き、部品を自分で作らない。
      サービスは同期の関数で、入口は `asyncio.to_thread` で呼ぶ。テストは属性を偽物に差し替えた `Handlers` を作る。
    properties:
      - name: terminal
        title: 端末の設定
        type: TerminalConfig
        access: 公開
        description: 起動時に読んだ端末の設定（`sources` の保存後は `registry` が新しい値で動く。`port` など再起動が要るキーはこの値のまま）
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        access: 公開
        description: 配信中の配信元
      - name: store
        title: 文書のストア
        type: DocumentStore
        access: 公開
        description: 文書を読む（文書のストア）
      - name: snapshots
        title: リビジョンの書き出し
        type: SnapshotStore
        access: 公開
        description: リビジョンを `state_dir` へ書き出す（履歴）
      - name: converter
        title: 変換
        type: ConvertService
        access: 公開
        description: 文書を Markdown にする（変換）
      - name: seen
        title: 会話の記録
        type: SeenStore
        access: 公開
        description: 会話ごとの返し済み・前回読んだ内容（会話の記録）
      - name: locks
        title: 配信元ごとの排他
        type: SourceLocks
        access: 公開
        description: 書き込み・削除を配信元ごとに 1 つずつにする（書き込み）
      - name: settings_lock
        title: 端末の設定の排他
        type: threading.Lock
        access: 公開
        description: 端末の設定の保存と読み直しを 1 つずつにする
      - name: checker
        title: 文書の検査
        type: DocumentChecker
        access: 公開
        description: 検索の検査の結果と、書き込み・削除の検査（検査）
      - name: columns
        title: 表の列の設定
        type: ColumnSettings
        access: 公開
        description: 画面の表の隠す列（画面のAPI）
      - name: reload_sources
        title: 配信元の読み直し
        type: Callable[[TerminalConfig], list[SourceStatus]]
        access: 公開
        description: '『配信元の読み直し』をこの `Handlers` の部品で束ねたもの。配信元の保存が呼ぶ'
      - name: restart
        title: 再起動の制御
        type: RestartControl
        access: 公開
        description: 再起動と更新の要求を 1 つずつにし、`run_serve` が止まった後に同じプロセスを置き換えるかを持つ（再起動と更新）
classes:
  - name: PortInUseError
    title: ポートが使用中
    container: main.py
    usecase: 起動
    role: 例外
    summary: 待ち受けのアドレスとポートで待ち受けられないことを表す
    kind: クラス
    inherits: OSError
    properties:
      - name: bind
        title: 待ち受けのアドレス
        type: str
        access: 公開
        description: 待ち受けようとしたアドレス
      - name: port
        title: ポート
        type: int
        access: 公開
        description: 待ち受けようとしたポート
constants:
  - name: EXIT_CONFIG_INVALID
    title: 設定の違反の終了コード
    container: main.py
    usecase: 起動
    summary: 端末の設定が無い・違反するときの終了コード
    value: '2'
  - name: EXIT_PORT_IN_USE
    title: ポート使用中の終了コード
    container: main.py
    usecase: 起動
    summary: ポートで待ち受けられないときの終了コード
    value: '3'
  - name: DOCS_MCP_PATH
    title: 文書の MCP のパス
    container: server/app.py
    usecase: 起動
    summary: 文書の MCP をマウントするパス
    value: '"/mcp"'
  - name: ADMIN_MCP_PATH
    title: 管理の MCP のパス
    container: server/app.py
    usecase: 起動
    summary: 管理の MCP をマウントするパス
    value: '"/_admin/mcp"'
  - name: PROBLEM_TYPE_BASE
    title: problem+json の type の頭
    container: server/error_handlers.py
    usecase: 共通
    summary: problem+json の `type` に置く URI の頭（末尾にエラーの名前を付ける）
    value: '"urn:dev-docs:error:"'
  - name: SCREEN_DIST_DIR
    title: 画面のビルドの置き場所
    container: server/screen.py
    usecase: 起動
    summary: 画面のビルド（Vite の出力先）のフォルダ。パッケージの中の `screen/`
    value: Path(__file__).parent.parent / "screen"
  - name: EXCLUDED_PREFIXES
    title: 画面を返さないパスの頭
    container: server/screen.py
    usecase: 起動
    summary: 画面の配信が 404 にするパスの最初の区切り
    value: ("_api", "mcp", "_admin")
  - name: IMMUTABLE_CACHE
    title: assets のキャッシュの指定
    container: server/screen.py
    usecase: 起動
    summary: ファイル名にハッシュを持つ assets の `Cache-Control`
    value: '"public, max-age=31536000, immutable"'
functions:
  - name: run_serve
    title: 待ち受けの開始
    kind: 関数
    container: main.py
    usecase: 起動
    role: 入口
    summary: 端末の設定を読み、配信元を配線して待ち受け、停止の合図まで動く。再起動を要求されて止まったときは同じプロセスを置き換える
    scope: public
    side_effects: ポートで待ち受ける。`log_dir` にログを書く。標準出力・標準エラーに書く。再起動のときはプロセスを `os.execv` で置き換える
    args:
      - name: args
        title: 解析結果
        type: argparse.Namespace
        required: true
        passing: positional
        description: '`serve` の解析結果（使う値は無い）'
    returns:
      type: int
      description: 終了コード。停止の合図で止まったとき 0
    process: |-
      1. 端末の設定のパスを決め（端末の設定のパス）、端末の設定を読み（端末の設定の読み込み）、待ち受けのポートを決める（待ち受けのポート）
         - `TerminalConfigInvalidError` の場合、違反ごとに `{ファイル}: {パス}: {理由}`（違反が無ければ例外の本文）を標準エラーに出し、`EXIT_CONFIG_INVALID` を返す
      2. `log_dir` を作り、`logging` を設定する。ログは標準エラーと `{log_dir}/dev-docs.log`（`RotatingFileHandler`）に書く
      3. ポートで待ち受けられるか確かめる（ポートの確かめ）
         - `PortInUseError` の場合、`{bind}:{port} は使用中です。DEV_DOCS_PORT で別のポートを指定できます` を標準エラーに出し、`EXIT_PORT_IN_USE` を返す
      4. 部品を配線し（部品の配線）、アプリを組み立てる（アプリの組み立て）
      5. 標準出力に `http://{bind}:{port}/` と配信中の配信元の ID を 1 行ずつ出す
      6. `uvicorn.Server(uvicorn.Config(app, host=bind, port=port, log_config=None, timeout_graceful_shutdown=script_timeout_sec * SHUTDOWN_WAIT_FACTOR))` を作り、再起動の制御に取り付けて（サーバーの取り付け）`run()` する
         - 確かめた後に他のプロセスがポートを取り、uvicorn が待ち受けに失敗して止まった場合（`server.started` が `False`）、手順 3 と同じ本文を出して `EXIT_PORT_IN_USE` を返す
      7. 止まった後、再起動を要求済み（`handlers.restart.requested`）かで分ける
         - 要求済みの場合、ログのハンドラーを閉じ、`os.execv(sys.executable, [sys.executable, *SERVE_ARGV])` で同じプロセスを置き換える
         - 要求が無い場合、0 を返す
    exceptions:
      - name: なし（終了コード 2）
        condition: 端末の設定が無い・違反する
        message: '標準エラーに `{ファイル}: {パス}: {理由}` を全て'
      - name: なし（終了コード 3）
        condition: ポートで待ち受けられない
        message: '`{bind}:{port} は使用中です。DEV_DOCS_PORT で別のポートを指定できます`'
    unit_tests:
      - name: test_run_serve
        case: 正常
        summary: 待ち受けて配信元を出す
        condition: 配信できる配信元 1 つの端末の設定を `DEV_DOCS_CONFIG` に入れる
        mock: '`uvicorn.Server.run`（何もせず戻る。`started` を `True` にする）'
        expected: 0 を返し、標準出力に `http://127.0.0.1:{port}/` と配信元の ID、`uvicorn.Config` の `host` が `127.0.0.1`
      - name: test_run_serve_when_config_invalid
        case: 異常
        summary: 端末の設定が違反する
        condition: '`sources[0]` に `config` が無く `port` が文字列'
        mock: なし
        expected: 2 を返し、標準エラーに `sources[0].config` と `port` の 2 行
        exception: 端末の設定が違反する
      - name: test_run_serve_when_port_in_use
        case: 異常
        summary: ポートが使用中
        condition: テストが先に待ち受けたポートを `DEV_DOCS_PORT` に入れる
        mock: なし
        expected: 3 を返し、標準エラーにポートの番号と `DEV_DOCS_PORT`
        exception: ポートで待ち受けられない
      - name: test_run_serve_when_restart
        case: 正常
        summary: 再起動の要求で同じプロセスを置き換える
        condition: 配信できる配信元 1 つの端末の設定。`uvicorn.Server.run` の中で `handlers.restart.request()` を呼ぶ
        mock: '`uvicorn.Server.run`（`started` を `True` にして再起動を要求して戻る）・`os.execv`（呼ばれた引数を記録する偽物）'
        expected: '`os.execv` が `sys.executable` と `[sys.executable, "-m", "dev_docs", "serve"]` で 1 回呼ばれる。`uvicorn.Config` の `timeout_graceful_shutdown` が `script_timeout_sec * 1.5`'
  - name: check_port
    title: ポートの確かめ
    kind: 関数
    container: main.py
    usecase: 起動
    role: 検証
    summary: 待ち受けのアドレスとポートで待ち受けられるかを、一度 bind して確かめる
    scope: public
    args:
      - name: bind
        title: 待ち受けのアドレス
        type: str
        required: true
        passing: positional
        description: 端末の設定の `bind`
      - name: port
        title: ポート
        type: int
        required: true
        passing: positional
        description: 待ち受けのポート
    returns:
      type: None
      description: 待ち受けられるときは何も返さない
    process: |-
      1. `socket.socket(AF_INET, SOCK_STREAM)` に uvicorn と同じく `SO_REUSEADDR` を付けて `(bind, port)` へ bind し、すぐに閉じる
         - `OSError`（`EADDRINUSE`・`EACCES`）の場合、`PortInUseError` を送る
    exceptions:
      - name: PortInUseError
        condition: bind に失敗する
        message: '`{bind}:{port} は使用中です`'
    unit_tests:
      - name: test_check_port
        case: 正常
        summary: 空いているポート
        condition: OS が払い出して閉じたポート
        mock: なし
        expected: 送らない
      - name: test_check_port_when_in_use
        case: 異常
        summary: 使用中のポート
        condition: テストが `listen` しているポート
        mock: なし
        expected: '`PortInUseError` の `port` がそのポート'
        exception: bind に失敗する
      - name: test_check_port_when_time_wait
        case: 正常
        summary: 閉じたばかりの接続が残るポート
        condition: '`SO_REUSEADDR` 付きで待ち受けて 1 本受け、サーバー側から接続と待ち受けを閉じた直後のポート'
        mock: なし
        expected: 送らない
  - name: build_handlers
    title: 部品の配線
    kind: 関数
    container: main.py
    usecase: 起動
    role: 合成の起点
    summary: 端末の設定から部品を 1 回だけ作り、配信元を読んで配線済みの関数にする
    scope: public
    side_effects: '`state_dir` の下にフォルダを作る。配信元を読む'
    args:
      - name: terminal
        title: 端末の設定
        type: TerminalConfig
        required: true
        passing: positional
        description: 読んだ端末の設定
    returns:
      type: Handlers
      description: 配線済みの関数
    process: |-
      1. `state_dir` を作る
      2. 配信元の一覧・リビジョンの書き出し（`{state_dir}/snapshots`）・文書のストア・変換（`{state_dir}/converted`、制限時間は `script_timeout_sec`）・会話の記録（`{state_dir}/seen.sqlite3`、保持日数は `seen_retention_days`）・文書の検査（制限時間は `script_timeout_sec`）・配信元ごとの排他・表の列の設定（`{state_dir}/columns`）・再起動の制御を作る
      3. 『配信元の読み直し』をこれらの部品で束ねた関数を作り、端末の設定で 1 回呼ぶ（配信元を読み、メタデータのずれを警告のログに書く）。検証で外した配信元があっても続ける
      4. これらと手順 3 の関数を持つ `Handlers` を返す
    unit_tests:
      - name: test_build_handlers
        case: 正常
        summary: 部品を作り配信元を読む
        condition: '`state_dir` が無い一時フォルダの下、配信できる配信元 1 つと検証に失敗する配信元 1 つ'
        mock: なし
        expected: '`state_dir` ができ、`registry.served()` が 1 つ、`registry.statuses()` が 2 つ'
      - name: test_build_handlers_when_out_of_sync
        case: 正常
        summary: 初回の読み込みでもずれを警告のログに書く
        condition: 行 `rules` に `title` の無い文書が 1 件ある配信元 `sample` 1 つ
        mock: なし（一時フォルダの配信元と `caplog`）
        expected: '`sample` の `metadata` の列の欠けの警告が 1 件あり、`registry.served()` が 1 つ'
        exception: '-'
  - name: reload_sources
    title: 配信元の読み直し
    kind: 関数
    container: main.py
    usecase: 端末の設定の保存
    role: 合成の起点
    summary: 配信元の一覧を読み直し、配信元の内容を控えた部品の控えを捨てる
    scope: public
    thread_safe: true
    side_effects: 配信元の一覧を入れ替え、文書のストア・文書の検査・変換の控えを捨てる。メタデータのずれを警告のログに書く
    args:
      - name: terminal
        title: 端末の設定
        type: TerminalConfig
        required: true
        passing: positional
        description: 読み直す端末の設定
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 読み直す配信元の一覧
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: 控えを捨てる
      - name: checker
        title: 文書の検査
        type: DocumentChecker
        required: true
        passing: injected
        description: 控えを捨てる
      - name: converter
        title: 変換
        type: ConvertService
        required: true
        passing: injected
        description: 控えを捨てる
    returns:
      type: list[SourceStatus]
      description: 読み直した後の配信元ごとの状態
    process: |-
      1. 配信元の一覧を読み直す（配信元の一覧.読み直す）
      2. 文書のストア・文書の検査・変換の控えを捨てる（文書のストア.全て捨てる・文書の検査.控えを捨てる・変換.控えを捨てる）
      3. 配信中の配信元ごとにメタデータのずれを確かめ（文書のストア.メタデータのずれの確かめ）、3 つの並びのうち 0 件でないものを、配信元の ID・ずれの種類・件数・並びの値で警告のログに書く。結果は状態に持たない
      4. 手順 1 の状態を返す
    unit_tests:
      - name: test_reload_sources
        case: 正常
        summary: 読み直してから控えを捨てる
        condition: 配信元 1 つの端末の設定
        mock: 配信元の一覧・文書のストア・文書の検査・変換（呼ばれた順を記録する偽物）
        expected: '`registry.reload` が端末の設定で 1 回呼ばれた後に `store.clear`・`checker.clear`・`converter.clear` が 1 回ずつ呼ばれ、`reload` の状態を返す'
      - name: test_reload_sources_when_out_of_sync
        case: 正常
        summary: メタデータのずれを警告のログに書く
        condition: 配信元 `sample` の行 `rules` に `title` の無い文書が 1 件、行 `src` の管理用の YAML に無いファイルが 2 件、ファイルが無い行が 1 件。配信元 `clean` はずれが無い
        mock: なし（一時フォルダの配信元と `caplog`）
        expected: '`sample` の警告が 3 件（件数と並びの値を含む）、`clean` の警告は無い。両方の配信元が `serving`'
        exception: '-'
  - name: build_app
    title: アプリの組み立て
    kind: 関数
    container: server/app.py
    usecase: 起動
    role: 合成の起点
    summary: 画面の API・文書の MCP・管理の MCP・セッションの文脈を 1 つの FastAPI のアプリにまとめる
    scope: public
    args:
      - name: handlers
        title: 配線済みの関数
        type: Handlers
        required: true
        passing: positional
        description: 部品の配線の結果
      - name: screen_dir
        title: 画面のビルドの置き場所
        type: Path
        required: false
        default: SCREEN_DIST_DIR
        passing: keyword
        description: 画面の配信が返すビルドのフォルダ。テストで差し替える
    returns:
      type: fastapi.FastAPI
      description: 組み立てたアプリ
    process: |-
      1. 文書の MCP と管理の MCP を組み立てる（文書の MCP の組み立て・管理の MCP の組み立て）
      2. 2 つの MCP と会話の記録を渡して寿命を作り（アプリの寿命）、`FastAPI(lifespan=..., docs_url=None, redoc_url=None, openapi_url="/_api/openapi.json", generate_unique_id_function=route_operation_id)` を作る（操作の識別子）
      3. 例外の変換を登録する（例外の変換の登録）
      4. `DOCS_MCP_PATH` に文書の MCP、`ADMIN_MCP_PATH` に管理の MCP の `streamable_http_app(streamable_http_path="/", stateless_http=True, json_response=True)` をマウントする
      5. 端末の設定の入口・画面の入口・セッションの文脈（セッションの文脈のルーター）のルーターを登録する
      6. 画面の配信のルーター（画面の配信、`screen_dir` を渡す）を最後に登録する（全てのパスに当たるため）
      7. アプリを返す
    unit_tests:
      - name: test_build_app
        case: 正常
        summary: 入口を全て持つ
        condition: 配線済みの関数を渡して `TestClient` で GET `/_api/openapi.json`
        mock: 配線済みの関数（配信元が空の偽物）
        expected: 200 で `paths` に `/_api/sources/{source}/docs`・`/_api/settings/sources` があり、アプリのルートに `/mcp`・`/_admin/mcp` のマウントと `POST /_admin/session-context` がある
      - name: test_build_app_when_openapi
        case: 正常
        summary: OpenAPI の画面を出さない
        condition: GET `/docs` と `/_api/openapi.json`
        mock: 配線済みの関数（偽物）
        expected: '`/docs` は 404、`/_api/openapi.json` の `paths` が全て `/_api/` で始まり、各入口の `operationId` が `{タグ}-{name}`（`view-get_document_default`・`view-get_document`・`view-search_page`・`view-list_refs`・`view-put_columns`・`settings-get_settings_sources`・`settings-put_settings_sources`）で重複が無く、画面の配信のパスを含まない'
      - name: test_build_app_when_screen
        case: 正常
        summary: API と MCP を画面の配信より先に当てる
        condition: '`index.html` を置いた一時フォルダを `screen_dir` に渡し、GET `/default/a.md` と GET `/_api/sources/none/docs`'
        mock: 配線済みの関数（配信元が空の偽物）
        expected: '`/default/a.md` は 200 で `index.html` の中身、`/_api/sources/none/docs` は 404 の problem+json'
  - name: build_lifespan
    title: アプリの寿命
    kind: 関数
    container: server/lifespan.py
    usecase: 起動
    role: 寿命
    summary: マウントした MCP のセッションの管理を親のアプリの寿命で動かし、起動時に古い会話の記録を削除する
    scope: public
    args:
      - name: mcps
        title: MCP
        type: Sequence[MCPServer]
        required: true
        passing: positional
        description: 文書の MCP と管理の MCP
      - name: seen
        title: 会話の記録
        type: SeenStore
        required: true
        passing: keyword
        description: 保持日数を過ぎた記録を削除する
    returns:
      type: Callable[[FastAPI], AbstractAsyncContextManager[None]]
      description: FastAPI の `lifespan` に渡す関数
    process: |-
      1. 返す関数は、`contextlib.AsyncExitStack` に各 MCP の `session_manager.run()` を入れる（マウントした子のアプリの寿命は動かないため）
      2. 会話の記録の古い記録を `asyncio.to_thread` で削除する（会話の記録.古い記録の削除）
         - `[info]` 古い会話の記録を削除した（件数）
      3. `yield` し、止まるときにスタックを閉じる
    unit_tests:
      - name: test_build_lifespan
        case: 正常
        summary: MCP のセッションの管理を動かす
        condition: 2 つの MCP を渡して寿命に入る
        mock: MCP（`session_manager.run()` が入った・出たを記録する偽物）・会話の記録（偽物）
        expected: 入ると 2 つとも run が入り、古い記録の削除が 1 回呼ばれ、出ると 2 つとも出る
  - name: register_error_handlers
    title: 例外の変換の登録
    kind: 関数
    container: server/error_handlers.py
    usecase: 共通
    role: 入口
    summary: 画面の API・画面の配信の例外を RFC 9457 の problem+json にするハンドラを登録する
    scope: public
    side_effects: アプリに例外のハンドラを登録する
    args:
      - name: app
        title: アプリ
        type: fastapi.FastAPI
        required: true
        passing: positional
        description: 登録先
    returns:
      type: None
      description: 何も返さない
    process: |-
      1. `DevDocsError` は、`application/problem+json` で `{type: PROBLEM_TYPE_BASE + name, title: name, status, detail: message, nextSteps: next_steps, ...details()}` を返す。`details()` のキーは入れ子も含めて `pydantic.alias_generators.to_camel` で camelCase にする。`violations` を持つときは `errors[]`（`{path, reason}`、`reason` は `rule`）にも並べる
      2. `RequestValidationError` は、400 で `type` が `InvalidArgumentError` の problem+json を返す。`errors[]` は誤りごとに `loc` の `body` を除いたパス（`sources[1].id` の形）と `msg`
      3. `starlette.exceptions.HTTPException`（ルートの無いパス・画面の配信の 404 を含む）は、その `status_code` で `type` が `PROBLEM_TYPE_BASE + "HttpError"`、`detail` が例外の `detail` の problem+json を返す
      4. これら以外の例外は FastAPI の既定の 500 に任せ、`[error]` 要求の処理に失敗した（メソッド・パス・例外）を書く
    unit_tests:
      - name: test_register_error_handlers
        case: 正常
        summary: DevDocsError を problem+json にする
        condition: '`ValidationFailedError(violations=[Violation(path="name", rule="必須")])` を送る API のルートを POST'
        mock: なし（テスト用のルート）
        expected: '422、`Content-Type` が `application/problem+json`、`type` が `urn:dev-docs:error:ValidationFailedError`、`errors` が `[{path: name, reason: 必須}]`'
      - name: test_register_error_handlers_when_request_invalid
        case: 正常
        summary: 本文の型の誤りを 400 にする
        condition: '`hidden: "x"`（配列でない）を PUT'
        mock: なし（テスト用のルート）
        expected: 400、`errors[0].path` が `hidden`
      - name: test_register_error_handlers_when_http_error
        case: 正常
        summary: ルートの無いパスを problem+json の 404 にする
        condition: どのルートにも当たらない GET `/_api/none`
        mock: なし（テスト用のルート）
        expected: 404、`Content-Type` が `application/problem+json`、`type` が `urn:dev-docs:error:HttpError`
      - name: test_register_error_handlers_when_details_snake
        case: 正常
        summary: 詳細のキーを camelCase にする
        condition: '`details()` が `{"settings_path": "x", "missing": {"source_id": "a"}}` を返す `DevDocsError` を送るルートを GET'
        mock: なし（テスト用のルート）
        expected: 本文に `settingsPath`・`missing.sourceId`・`nextSteps` があり、snake_case のキーが無い
  - name: run_migrate
    title: 設定の移し替えの実行
    container: main.py
    usecase: 設定の移し替え
    role: 入口
    summary: '`dev-docs migrate` の解析結果で対象を決め、当てる手順を表示するか当てる'
    kind: 関数
    scope: public
    side_effects: 対象の設定とバックアップを書く。標準出力・標準エラーに書く
    args:
      - name: args
        title: 解析結果
        type: argparse.Namespace
        required: true
        passing: positional
        description: '`migrate` の解析結果（`plan`・`record`・`source`・`allow_destructive`）'
    returns:
      type: int
      description: 終了コード。移し替えた・要らなかった・表示したとき 0
    process: |-
      1. 対象を決め（対象の決定。`env` は `os.environ`）、当てる手順を求める（当てる手順の一覧）
      2. `plan` の場合、手順ごとに `{version}: {description}` を標準出力に 1 行ずつ出し（破壊的な手順は末尾に ` [destructive]`）、0 を返す。手順が空なら何も出さない
      3. `record` の場合、手順を空にして適用し（移し替えの適用）、`{ファイル} の version を {current} にしました（バックアップ: {パス}）` を標準出力に出して 0 を返す
      4. それ以外で手順が空の場合、`移し替えは要りません（version {current}）` を標準出力に出して 0 を返す
      5. 手順を当て（移し替えの適用。`allow_destructive` は解析結果、`now` は現在時刻）、`{ファイル} を version {current} に移し替えました（バックアップ: {パス}）` を標準出力に出して 0 を返す
         - 手順 1〜5 で `MigrationError` の場合、本文を標準エラーに出し、例外の `exit_code` を返す
    exceptions:
      - name: なし（終了コード 2）
        condition: 対象が無い・読めない・`version` が無い（`MigrationConfigInvalidError`）
        message: '`{ファイル}: {理由}`'
      - name: なし（終了コード 4）
        condition: 当てた結果が新しいスキーマに違反する・読んだ後に変わった（`MigrationFailedError`）
        message: '違反を `{キーのパス}: {理由}` で 1 行ずつ'
      - name: なし（終了コード 5）
        condition: 破壊的な手順があり `--allow-destructive` が無い（`DestructiveStepBlockedError`）
        message: 破壊的な手順と `--allow-destructive` の案内
      - name: なし（終了コード 6）
        condition: 対象の `version` が dev-docs の読めるバージョンより新しい（`ConfigNewerError`）
        message: '`{ファイル}: 設定のバージョン {対象} が dev-docs の読める {現在} より新しい。dev-docs を更新してください`'
    unit_tests:
      - name: test_run_migrate_when_plan
        case: 正常
        summary: 当てる手順を表示するだけで書き換えない
        condition: '`version: "1"` の端末の設定。`2` の手順に `rename` と `delete`。`--plan`'
        mock: 手順の置き場所（一時フォルダ）・`SETTINGS_VERSION`（`2`）
        expected: '0 を返し、標準出力が `2: ` で始まる 2 行で `delete` の行だけ末尾が `[destructive]`。対象は変わらない'
      - name: test_run_migrate
        case: 正常
        summary: 手順を当ててバックアップを取る
        condition: '`version: "1"` の端末の設定。`2` の手順に `rename` だけ'
        mock: 手順の置き場所・`SETTINGS_VERSION`（`2`）
        expected: '0 を返し、対象が改名後で `version: "2"`。標準出力にバックアップのパス'
      - name: test_run_migrate_when_current
        case: 正常
        summary: 同じバージョンなら何もしない
        condition: '`version` が `SETTINGS_VERSION` と同じ'
        mock: なし
        expected: 0 を返し、標準出力に `移し替えは要りません`。バックアップを作らない
      - name: test_run_migrate_when_record
        case: 正常
        summary: '`--record` は version だけを書き換える'
        condition: '`version: "1"`、`--record`'
        mock: 手順の置き場所・`SETTINGS_VERSION`（`2`）
        expected: 0 を返し、`version` だけが `2` に変わる
      - name: test_run_migrate_when_destructive
        case: 異常
        summary: 破壊的な手順で止める
        condition: '`2` の手順に `delete`。`--allow-destructive` なし'
        mock: 手順の置き場所・`SETTINGS_VERSION`（`2`）
        expected: 5 を返し、標準エラーに `--allow-destructive`。対象は変わらない
        exception: なし（終了コード 5）
      - name: test_run_migrate_when_newer
        case: 異常
        summary: 新しすぎる設定を書き換えない
        condition: '`version: "9"` の端末の設定'
        mock: なし
        expected: 6 を返し、標準エラーに `dev-docs を更新してください`
        exception: なし（終了コード 6）
      - name: test_run_migrate_when_config_invalid
        case: 異常
        summary: 対象が無い
        condition: '`--source` に無いファイル'
        mock: なし
        expected: 2 を返し、標準エラーにファイルのパス
        exception: なし（終了コード 2）
    callees:
      - dev/設計書/モジュール構成/開発ドキュメントサーバー/features/migrate/service.py#functions[resolve_target]
      - dev/設計書/モジュール構成/開発ドキュメントサーバー/features/migrate/service.py#functions[plan_migration]
      - dev/設計書/モジュール構成/開発ドキュメントサーバー/features/migrate/service.py#functions[apply_migration]
  - name: run_files
    title: 載せるファイルの一覧の実行
    container: main.py
    usecase: 載せるファイルの一覧
    role: 入口
    summary: '`dev-docs files` の解析結果で範囲を集め、載せるファイルを 1 行ずつ出す'
    kind: 関数
    scope: public
    side_effects: 標準出力・標準エラーに書く
    args:
      - name: args
        title: 解析結果
        type: argparse.Namespace
        required: true
        passing: positional
        description: '`files` の解析結果（`root`・`paths`・`exclude`）'
    returns:
      type: int
      description: 終了コード。出し終えたとき 0
    process: |-
      1. `root` を `Path` にし、フォルダでなければ「`{root}: フォルダがありません`」を標準エラーに出して 2 を返す
      2. 載せるファイルの一覧（`indexable_files`。`paths`・`exclude` は解析結果）で集め、パスを 1 行ずつ標準出力に出して 0 を返す
    exceptions:
      - name: なし（終了コード 2）
        condition: '`--root` が無いかフォルダでない（インターフェース定義の `RootNotFound`）'
        message: '`{root}: フォルダがありません`'
    unit_tests:
      - name: test_run_files
        case: 正常
        summary: 載せるファイルを 1 行ずつ出す
        condition: '`src/a.py`・`src/uv.lock` を置き、`paths=["src/**"]`・`exclude=[]`'
        mock: なし（`tmp_path`・`capsys`）
        expected: 0 を返し、標準出力が `src/a.py` の 1 行だけ
        exception: '-'
      - name: test_run_files_when_root_not_found
        case: 異常
        summary: フォルダが無い
        condition: '`root` に無いパス'
        mock: なし（`capsys`）
        expected: 2 を返し、標準出力が空で、標準エラーに渡したパス
        exception: なし（終了コード 2）
    refs:
      - dev/設計書/モジュール構成/開発ドキュメントサーバー/文書のストア.py#functions[indexable_files]
  - name: route_operation_id
    title: 操作の識別子
    kind: 関数
    container: server/app.py
    usecase: 起動
    role: 入口
    summary: OpenAPI の operationId をルートのタグと名前から作る
    scope: public
    args:
      - name: route
        title: ルート
        type: fastapi.routing.APIRoute
        required: true
        passing: positional
        description: 識別子を作るルート
    returns:
      type: str
      description: '`{route.tags[0]}-{route.name}`（タグが無いときは `route.name`）'
    process: 1. ルートの最初のタグと `name` を `-` で結んで返す。タグが無いときは `name` だけを返す
    unit_tests:
      - name: test_route_operation_id
        case: 正常
        summary: タグと名前を結ぶ
        condition: '`tags=["view"]`・`name="get_document"` のルート'
        mock: なし
        expected: '`view-get_document`'
      - name: test_route_operation_id_when_no_tag
        case: 正常
        summary: タグが無いと名前だけ
        condition: '`tags=[]`・`name="x"` のルート'
        mock: なし
        expected: '`x`'
  - name: build_screen_router
    title: 画面の配信
    kind: 関数
    container: server/screen.py
    usecase: 起動
    role: 入口
    summary: 画面（React の SPA）のビルドを返すルーターを作る
    scope: public
    args:
      - name: dist_dir
        title: 画面のビルドの置き場所
        type: Path
        required: true
        passing: positional
        description: Vite の出力先（`index.html` と `assets/`）
    returns:
      type: fastapi.APIRouter
      description: GET `/{path:path}` を持つルーター（`include_in_schema=False`）
    process: |-
      1. パスの最初の区切りが `EXCLUDED_PREFIXES` のどれかなら、`HTTPException(404)` を送る（API・MCP の誤ったパスに画面を返さない）
      2. パスが `assets/` で始まるときは、`dist_dir` の下のファイルを `FileResponse` で返し、`Cache-Control` を `IMMUTABLE_CACHE` にする。ファイルが無い・解決したパスが `dist_dir` の外のときは `HTTPException(404)` を送る
      3. それ以外のパスは、`dist_dir / "index.html"` を `Cache-Control: no-cache` で返す（どの URL も SPA が描く）
      4. `index.html` が無いときは `ScreenBuildMissingError` を送る
    exceptions:
      - name: ScreenBuildMissingError
        condition: '`dist_dir` に `index.html` が無い'
    unit_tests:
      - name: test_build_screen_router
        case: 正常
        summary: 文書の URL に index.html を返す
        condition: '`index.html` を置いた一時フォルダで GET `/default/設計書/a.md`'
        mock: なし（一時フォルダ）
        expected: 200、本文が `index.html` の中身、`Cache-Control` が `no-cache`
      - name: test_build_screen_router_when_asset
        case: 正常
        summary: assets のファイルを長く持たせて返す
        condition: '`assets/index-abc.js` を置いて GET `/assets/index-abc.js`'
        mock: なし（一時フォルダ）
        expected: 200、`Cache-Control` が `IMMUTABLE_CACHE`
      - name: test_build_screen_router_when_asset_missing
        case: 異常
        summary: 無い assets と外へ出るパスを 404 にする
        condition: GET `/assets/none.js` と GET `/assets/..%2F..%2Fsecret`
        mock: なし（一時フォルダ）
        expected: どちらも 404
        exception: HTTPException(404)
      - name: test_build_screen_router_when_excluded
        case: 異常
