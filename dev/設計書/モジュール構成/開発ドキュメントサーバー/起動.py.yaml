title: "開発ドキュメントサーバー / 起動"
lead: |-
  `dev-docs serve` の処理。端末の設定と配信元を読み、部品を配線して、画面・文書の MCP・管理の MCP を 1 つのアプリとして待ち受ける。
  例外から problem+json への変換もここで登録する。
directory: |-
  ```text
  src/dev_docs/
  ├─ main.py                    # Handlers / build_handlers / reload_sources / run_serve / PortInUseError
  └─ server/
     ├─ app.py                  # build_app（ルートと MCP のマウント）
     ├─ lifespan.py             # build_lifespan（MCP のセッションの管理と記録の削除）
     └─ error_handlers.py       # register_error_handlers（problem+json）
  ```
