title: "開発ドキュメントサーバー / 検査"
lead: |-
  文書を種類のスキーマ・`ids.format`・`related.types`・タグのマスター・配信元の `validators[]` で検査し、違反の並びを返す。
  書き込みは違反があれば書かず、読み取りは違反を警告として添える。
directory: |-
  ```text
  src/dev_docs/features/validation/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ rules.py      # check_schema / check_id_format / check_related / check_tags
  ├─ scripts.py    # parse_validator_output（validators[] の出力の解釈）
  └─ service.py    # DocumentChecker（検査をまとめて通す・読み取りの結果のキャッシュ）
  ```
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        文書の検査 ..> スキーマの検査
        文書の検査 ..> IDの形の検査
        文書の検査 ..> 関連の種類の検査
        文書の検査 ..> タグの検査
        文書の検査 ..> スクリプトの実行 : validators[]
        文書の検査 ..> 検査の出力の解釈
        文書の検査 ..> 違反 : 返す
        class 文書の検査 {
          <<class>>
        }
        class スキーマの検査 {
          <<function>>
        }
        class IDの形の検査 {
          <<function>>
        }
        class 関連の種類の検査 {
          <<function>>
        }
        class タグの検査 {
          <<function>>
        }
        class 検査の出力の解釈 {
          <<function>>
        }
        class スクリプトの実行 {
          <<function>>
        }
        class 違反 {
          <<dataclass>>
        }
constants:
  - name: SLUG_PATTERN
    title: slug の形
    container: features/validation/rules.py
    usecase: 共通
    summary: '`ids.format` の `{slug}` に当てる正規表現'
    value: '"[a-z0-9]+(?:-[a-z0-9]+)*"'
  - name: VALIDATOR_ON_READ_CACHE
    title: 読み取りの検査の結果の数
    container: features/validation/service.py
    usecase: 共通
    summary: 読み取りの `validators[]` の結果を控える件数の上限。超えたら使ったのが古いものから捨てる
    value: '4096'
functions:
  - name: check_schema
    title: スキーマの検査
    kind: 関数
    container: features/validation/rules.py
    usecase: 共通
    role: 検証
    summary: 文書の内容を種類の JSON Schema で検査する
    scope: public
    thread_safe: true
    args:
      - name: data
        title: 内容
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 文書の内容
      - name: schema
        title: スキーマ
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 文書のストアの『種類のスキーマ』。空の辞書は検査しない
    returns:
      type: list[Violation]
      description: 違反。項目のパスの昇順
    process: |-
      1. `schema` が空なら空の並びを返す
      2. `jsonschema.validators.validator_for` でスキーマの `$schema` に合う検査器を選び（無ければ Draft 2020-12）、`format_checker` を付けて `iter_errors` で全ての誤りを取る
      3. 誤りごとに、`absolute_path` を `a.b[0]` の形の項目のパス（最上位は `$`）に、`message` を決まりにした `Violation` を作る。`fix` には `validator` が `required`・`enum`・`type` のとき、足りないキー・許す値・期待する型を書く
      4. 項目のパスの昇順に並べて返す
    unit_tests:
      - name: test_check_schema
        case: 正常
        summary: 合格
        condition: '`{"type": "object", "required": ["id"]}` に `{"id": "a"}`'
        mock: なし
        expected: 空の並び
        exception: '-'
      - name: test_check_schema_when_violations
        case: 正常
        summary: 違反のパスと直し方
        condition: '`required: [id]` と `properties.items.items.type: integer` に `{"items": [1, "x"]}`'
        mock: なし
        expected: 2 件で、`$` の `fix` に `id`、`items[1]` の `fix` に `integer`
        exception: '-'
      - name: test_check_schema_when_empty
        case: 正常
        summary: スキーマが無い
        condition: '`{}` に任意の内容'
        mock: なし
        expected: 空の並び
        exception: '-'
  - name: check_id_format
    title: IDの形の検査
    kind: 関数
    container: features/validation/rules.py
    usecase: 共通
    role: 検証
    summary: 新しく作る文書の ID が `ids.format` に合うかを確かめる
    scope: public
    thread_safe: true
    args:
      - name: doc_id
        title: 文書の ID
        type: str
        required: true
        passing: positional
        description: 作る文書の ID
      - name: fmt
        title: ID の付け方
        type: str | None
        required: true
        passing: positional
        description: '`SourceConfig.ids_format`。`None` は制約なし'
      - name: kind
        title: 種類
        type: str
        required: true
        passing: keyword
        description: 作る文書の行の ID（`{kind}` に当てる）
    returns:
      type: list[Violation]
      description: 合えば空、合わなければ `id` の違反 1 件
    process: |-
      1. `fmt` が `None` なら空の並びを返す
      2. `fmt` を正規表現にする。`{kind}` は `kind` をエスケープした文字列、`{slug}` は `SLUG_PATTERN`、それ以外の文字はエスケープしてそのまま。知らない `{...}` は `[^/]+` にする
      3. `re.fullmatch` で合わなければ、`path` が `id`、`rule` が `ids.format`、`fix` が `{fmt} の形にしてください（例 {kind を入れた例}）` の `Violation` を返す
    unit_tests:
      - name: test_check_id_format
        case: 正常
        summary: 合う ID
        condition: '`rule-python-testing` を `{kind}-{slug}`、`kind="rule"`'
        mock: なし
        expected: 空の並び
        exception: '-'
      - name: test_check_id_format_when_mismatch
        case: 正常
        summary: 合わない ID
        condition: '`Python_Testing` を同じ形で'
        mock: なし
        expected: 1 件で、`path` が `id`、`rule` が `ids.format`
        exception: '-'
      - name: test_check_id_format_when_none
        case: 正常
        summary: 制約なし
        condition: 任意の ID を `fmt=None` で
        mock: なし
        expected: 空の並び
        exception: '-'
  - name: check_related
    title: 関連の種類の検査
    kind: 関数
    container: features/validation/rules.py
    usecase: 共通
    role: 検証
    summary: メタデータの `related` の各行が `to`（相手の文書の ID）と `related.types` の語の `type` を持つかを確かめる
    scope: public
    thread_safe: true
    args:
      - name: metadata
        title: メタデータ
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 文書のメタデータ
      - name: types
        title: 関連の種類
        type: Sequence[str]
        required: true
        passing: positional
        description: '`SourceConfig.related_types`'
    returns:
      type: list[Violation]
      description: 違反。`related` が無ければ空
    process: |-
      1. `related` が無ければ空の並びを返す
      2. 配列でなければ `related` の違反を返す
      3. 行ごとに、辞書でない・`to` が文字列でない・`source`（別の配信元の文書を指すときの配信元の ID）が文字列でない行、`type` が `types` に無い行を `related[{n}].type` などの違反にする（`fix` に使える語の並び）
      4. 違反を返す
    unit_tests:
      - name: test_check_related
        case: 正常
        summary: 知らない種類
        condition: '`related: [{to: a, type: references}, {to: b, type: blocks}]`、`types` が既定'
        mock: なし
        expected: 1 件で、`path` が `related[1].type`、`fix` に `references, depends_on, see_also`
        exception: '-'
      - name: test_check_related_when_malformed
        case: 正常
        summary: 行の形の誤り
        condition: '`related: ["a", {type: references}]`'
        mock: なし
        expected: '`related[0]` と `related[1].to` の 2 件'
        exception: '-'
  - name: check_tags
    title: タグの検査
    kind: 関数
    container: features/validation/rules.py
    usecase: 共通
    role: 検証
    summary: メタデータの `tags` がタグのマスターにあるかを確かめる
    scope: public
    thread_safe: true
    args:
      - name: metadata
        title: メタデータ
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 文書のメタデータ
      - name: tag_master
        title: タグのマスター
        type: Mapping[str, str]
        required: true
        passing: positional
        description: '`ServedSource.tag_master`。空なら検査しない'
    returns:
      type: list[Violation]
      description: マスターに無いタグごとの違反
    process: |-
      1. `tag_master` が空か `tags` が無ければ空の並びを返す
      2. `tags` が文字列の配列でなければ `tags` の違反を返す
      3. マスターに無いタグごとに `tags[{n}]` の違反を作る。`fix` には `difflib.get_close_matches` で近いタグを書く（無ければマスターへの追加を案内する）
      4. 違反を返す
    unit_tests:
      - name: test_check_tags
        case: 正常
        summary: マスターに無いタグ
        condition: 'マスターが `{python: ..., mcp: ...}`、`tags: [python, pyton]`'
        mock: なし
        expected: 1 件で、`path` が `tags[1]`、`fix` に `python`
        exception: '-'
      - name: test_check_tags_when_no_master
        case: 正常
        summary: マスターが無い
        condition: 'マスターが空、`tags: [x]`'
        mock: なし
        expected: 空の並び
        exception: '-'
  - name: parse_validator_output
    title: 検査の出力の解釈
    kind: 関数
    container: features/validation/scripts.py
    usecase: 共通
    role: 変換
    summary: '`validators[]` の標準出力の JSON を違反の並びにする'
    scope: public
    thread_safe: true
    args:
      - name: stdout
        title: 標準出力
        type: str
        required: true
        passing: positional
        description: スクリプトの標準出力
      - name: validator_id
        title: 検査の ID
        type: str
        required: true
        passing: keyword
        description: 決まりに添える `validators[].id`
    returns:
      type: list[Violation]
      description: 違反。空の出力と `[]` は合格
    process: |-
      1. 前後の空白を除いて空なら空の並びを返す
      2. JSON として読む。配列でない・読めない場合、`path` が `$`、`rule` が `{validator_id}: 出力が違反の配列の JSON ではありません` の違反 1 件を返す
      3. 要素ごとに `path`（無ければ `$`）・`rule`（無ければ `message`）・`fix` を取り、`rule` の頭に `{validator_id}: ` を付けた `Violation` にする。文字列の要素は `rule` だけの違反にする
      4. 並びを返す
    unit_tests:
      - name: test_parse_validator_output
        case: 正常
        summary: 違反の配列
        condition: '`[{"path": "links[0]", "rule": "無いリンク先", "fix": "x"}, "本文が空"]`、`validator_id="check-links"`'
        mock: なし
        expected: '2 件で、`rule` が `check-links: 無いリンク先` と `check-links: 本文が空`、2 件目の `path` が `$`'
        exception: '-'
      - name: test_parse_validator_output_when_empty
        case: 正常
        summary: 合格
        condition: '`""` と `"[]\n"`'
        mock: なし
        expected: どちらも空の並び
        exception: '-'
      - name: test_parse_validator_output_when_invalid
        case: 正常
        summary: JSON でない出力
        condition: '`ok`'
        mock: なし
        expected: 1 件で、`rule` に「配列の JSON ではありません」
        exception: '-'
classes:
  - name: DocumentChecker
    title: 文書の検査
    container: features/validation/service.py
    usecase: 共通
    role: サービス
    summary: 1 件の文書に全ての検査を通し、違反をまとめて返す
    description: |-
      読み取りの `validators[]` の結果は (配信元, 種類, 検査の ID, 文書のバージョン) で控え、同じ内容でスクリプトを動かし直さない。
      書き込みの検査は控えず、毎回動かす。
    kind: クラス
    properties:
      - name: store
        title: 文書のストア
        type: DocumentStore
        access: 公開
        description: 種類のスキーマを引く
      - name: timeout_sec
        title: 制限時間
        type: float
        access: 公開
        description: 端末の設定の `script_timeout_sec`
      - name: _read_cache
        title: 読み取りの結果
        type: OrderedDict[tuple[str, str, str, str], list[Violation]]
        access: 内部 (_)
        description: 上限は `VALIDATOR_ON_READ_CACHE`
      - name: _lock
        title: 排他
        type: threading.Lock
        access: 内部 (_)
        description: '`_read_cache` を守る'
    methods:
      - name: check
        title: 検査する
        summary: スキーマ・ID の形・関連の種類・タグ・`validators[]` を順に通す
        kind: メソッド
        scope: public
        thread_safe: true
        side_effects: '`validators[]` のスクリプトを動かす'
        args:
          - name: target
            title: 読み書きの場所
            type: Target
            required: true
            passing: positional
            description: スクリプトを動かす場所（`target.base`）とスキーマを読む場所
          - name: document
            title: 文書
            type: Document
            required: true
            passing: positional
            description: 検査する文書（書き込みでは、書こうとしている内容で作った文書）
          - name: 'on'
            title: 通す時点
            type: Literal['read', 'write']
            required: true
            passing: keyword
            description: '`validators[].on` と照らす'
          - name: new
            title: 新しい文書か
            type: bool
            required: false
            default: 'False'
            passing: keyword
            description: '`True` のときだけ `ids.format` を確かめる'
        returns:
          type: list[Violation]
          description: 違反。検査の順に並ぶ
        process: |-
          1. `store.schema(target, kind)` でスキーマを引いて『スキーマの検査』を通す（`records` の行は要素を、それ以外はファイルの内容を検査する）
          2. `new` なら『IDの形の検査』を通す
          3. 『関連の種類の検査』と『タグの検査』をメタデータに通す
          4. 行の `validators` の ID ごとに `source.script("validators", id)` を引き、`on` が行の `on` にあるものだけを通す
             - `on` が `read` の場合、`_read_cache` に控えがあればそれを使う
             - スクリプトの実行の『スクリプトの実行』を `cwd=target.base`・`stdin`（`body`）・`timeout_sec` で呼び、『検査の出力の解釈』で違反にする
             - `ScriptError` の場合、`path` が `$`、`rule` が `{id}: 検査を実行できませんでした（{メッセージ}）` の違反にする（控えない）
          5. 違反を返す
        unit_tests:
          - name: test_document_checker_check
            case: 正常
            summary: 検査の順とまとめ
            condition: スキーマ違反 1 件・知らない関連の種類 1 件・`validators` が 1 件の違反を出す文書を `on="write"`
            mock: なし（検査は `sys.executable -c` のスクリプト）
            expected: 3 件をスキーマ・関連・スクリプトの順で返す
            exception: '-'
          - name: test_document_checker_check_when_on_read
            case: 正常
            summary: 通す時点と控え
            condition: '`on: [read]` の検査と `on: [write]` の検査を持つ行で、同じ文書を `on="read"` で 2 回'
            mock: '`run_script`（呼ばれた数を数える）'
            expected: '`read` の検査だけが 1 回呼ばれる'
            exception: '-'
          - name: test_document_checker_check_when_script_fails
            case: 正常
            summary: 検査が動かない
            condition: 終了コード 1 で終わる検査
            mock: なし
            expected: 1 件で、`rule` に「検査を実行できませんでした」
            exception: '-'
          - name: test_document_checker_check_when_new
            case: 正常
            summary: 新しい文書の ID
            condition: '`ids.format` が `{kind}-{slug}` で ID が `X`、`new=True` と `new=False`'
            mock: なし
            expected: '`new=True` だけ `id` の違反がある'
            exception: '-'
      - name: clear
        title: 控えを捨てる
        summary: 読み取りの結果の控えを捨てる
        kind: メソッド
        scope: public
        thread_safe: true
        side_effects: '`_read_cache` を空にする'
        returns:
          type: None
          description: '-'
        process: 1. `_read_cache` を空にする（起動の『配信元の読み直し』が呼ぶ）
test_files:
  - tests/unit/dev_docs/features/validation/test_rules.py
  - tests/unit/dev_docs/features/validation/test_scripts.py
  - tests/unit/dev_docs/features/validation/test_service.py
