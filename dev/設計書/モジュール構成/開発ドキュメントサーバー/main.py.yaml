data_models:
  - name: Handlers
    title: 配線済みの関数
    container: main.py
    usecase: 共通
    role: 合成の起点
    summary: 入口（画面の API・MCP）が使う部品を 1 回だけ作って束ねたもの
    description: |-
      `dataclass(frozen=True)`。入口はこの属性から部品を引き、部品を自分で作らない。
      サービスは同期の関数で、入口は `asyncio.to_thread` で呼ぶ。テストは属性を偽物に差し替えた `Handlers` を作る。
    properties:
      - name: terminal
        title: 端末の設定
        type: TerminalConfig
        access: 公開
        description: 起動時に読んだ端末の設定（`sources` の保存後は `registry` が新しい値で動く。`port` など再起動が要るキーはこの値のまま）
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        access: 公開
        description: 配信中の配信元
      - name: store
        title: 文書のストア
        type: DocumentStore
        access: 公開
        description: 文書を読む（文書のストア）
      - name: snapshots
        title: リビジョンの書き出し
        type: SnapshotStore
        access: 公開
        description: リビジョンを `state_dir` へ書き出す（履歴）
      - name: converter
        title: 変換
        type: ConvertService
        access: 公開
        description: 文書を Markdown にする（変換）
      - name: seen
        title: 会話の記録
        type: SeenStore
        access: 公開
        description: 会話ごとの返し済み・前回読んだ内容（会話の記録）
      - name: locks
        title: 配信元ごとの排他
        type: SourceLocks
        access: 公開
        description: 書き込み・削除を配信元ごとに 1 つずつにする（書き込み）
      - name: settings_lock
        title: 端末の設定の排他
        type: threading.Lock
        access: 公開
        description: 端末の設定の保存と読み直しを 1 つずつにする
      - name: checker
        title: 文書の検査
        type: DocumentChecker
        access: 公開
        description: 検索の検査の結果と、書き込み・削除の検査（検査）
      - name: columns
        title: 表の列の設定
        type: ColumnSettings
        access: 公開
        description: 画面の表の隠す列（画面のAPI）
      - name: reload_sources
        title: 配信元の読み直し
        type: Callable[[TerminalConfig], list[SourceStatus]]
        access: 公開
        description: '『配信元の読み直し』をこの `Handlers` の部品で束ねたもの。配信元の保存が呼ぶ'
      - name: restart
        title: 再起動の制御
        type: RestartControl
        access: 公開
        description: 再起動と更新の要求を 1 つずつにし、`run_serve` が止まった後に同じプロセスを置き換えるかを持つ（再起動と更新）
      - name: prompts
        title: プロンプトの一式
        type: PromptSet
        access: 公開
        description: 起動のときに読んだプロンプトの YAML（セッションの文脈・文書の MCP・管理の MCP が描画する。書き換えは再起動で効かせる）
classes:
  - name: PortInUseError
    title: ポートが使用中
    container: main.py
    usecase: 起動
    role: 例外
    summary: 待ち受けのアドレスとポートで待ち受けられないことを表す
    kind: クラス
    inherits: OSError
    properties:
      - name: bind
        title: 待ち受けのアドレス
        type: str
        access: 公開
        description: 待ち受けようとしたアドレス
      - name: port
        title: ポート
        type: int
        access: 公開
        description: 待ち受けようとしたポート
constants:
  - name: EXIT_CONFIG_INVALID
    title: 設定の違反の終了コード
    container: main.py
    usecase: 起動
    summary: 端末の設定が無い・違反するときの終了コード
    value: '2'
  - name: EXIT_PORT_IN_USE
    title: ポート使用中の終了コード
    container: main.py
    usecase: 起動
    summary: ポートで待ち受けられないときの終了コード
    value: '3'
  - name: EXIT_PROMPT_INVALID
    title: プロンプトの違反の終了コード
    container: main.py
    usecase: 起動
    summary: プロンプトの YAML が無い・違反するときの終了コード
    value: '4'
functions:
  - name: run_serve
    title: 待ち受けの開始
    kind: 関数
    container: main.py
    usecase: 起動
    role: 入口
    summary: 端末の設定を読み、配信元を配線して待ち受け、停止の合図まで動く。再起動を要求されて止まったときは同じプロセスを置き換える
    scope: public
    side_effects: ポートで待ち受ける。`log_dir` にログを書く。標準出力・標準エラーに書く。再起動のときはプロセスを `os.execv` で置き換える
    args:
      - name: args
        title: 解析結果
        type: argparse.Namespace
        required: true
        passing: positional
        description: '`serve` の解析結果（使う値は無い）'
    returns:
      type: int
      description: 終了コード。停止の合図で止まったとき 0
    process: |-
      1. 端末の設定のパスを決め（端末の設定のパス）、端末の設定を読み（端末の設定の読み込み）、待ち受けのポートを決める（待ち受けのポート）
         - `TerminalConfigInvalidError` の場合、違反ごとに `{ファイル}: {パス}: {理由}`（違反が無ければ例外の本文）を標準エラーに出し、`EXIT_CONFIG_INVALID` を返す
      2. `log_dir` を作り、`logging` を設定する。ログは標準エラーと `{log_dir}/dev-docs.log`（`RotatingFileHandler`）に書く
      3. ポートで待ち受けられるか確かめる（ポートの確かめ）
         - `PortInUseError` の場合、`{bind}:{port} は使用中です。DEV_DOCS_PORT で別のポートを指定できます` を標準エラーに出し、`EXIT_PORT_IN_USE` を返す
      4. 部品を配線し（部品の配線）、アプリを組み立てる（アプリの組み立て）
         - `PromptInvalidError` の場合、違反ごとに `{file}: {path}: {reason}` を標準エラーに出し、`EXIT_PROMPT_INVALID` を返す
      5. 標準出力に `http://{bind}:{port}/` と配信中の配信元の ID を 1 行ずつ出す
      6. `uvicorn.Server(uvicorn.Config(app, host=bind, port=port, log_config=None, timeout_graceful_shutdown=script_timeout_sec * SHUTDOWN_WAIT_FACTOR))` を作り、再起動の制御に取り付けて（サーバーの取り付け）`run()` する
         - 確かめた後に他のプロセスがポートを取り、uvicorn が待ち受けに失敗して止まった場合（`server.started` が `False`）、手順 3 と同じ本文を出して `EXIT_PORT_IN_USE` を返す
      7. 止まった後、再起動を要求済み（`handlers.restart.requested`）かで分ける
         - 要求済みの場合、ログのハンドラーを閉じ、`os.execv(sys.executable, [sys.executable, *SERVE_ARGV])` で同じプロセスを置き換える
         - 要求が無い場合、0 を返す
    exceptions:
      - name: なし（終了コード 2）
        condition: 端末の設定が無い・違反する
        message: '標準エラーに `{ファイル}: {パス}: {理由}` を全て'
      - name: なし（終了コード 3）
        condition: ポートで待ち受けられない
        message: '`{bind}:{port} は使用中です。DEV_DOCS_PORT で別のポートを指定できます`'
      - name: なし（終了コード 4）
        condition: プロンプトの YAML が無い・読めない・スキーマに違反する・描画できない
        message: '標準エラーに `{ファイル}: {キーのパス}: {理由}` を全て'
    unit_tests:
      - name: test_run_serve
        case: 正常
        summary: 待ち受けて配信元を出す
        condition: 配信できる配信元 1 つの端末の設定を `DEV_DOCS_CONFIG` に入れる
        mock: '`uvicorn.Server.run`（何もせず戻る。`started` を `True` にする）'
        expected: 0 を返し、標準出力に `http://127.0.0.1:{port}/` と配信元の ID、`uvicorn.Config` の `host` が `127.0.0.1`
      - name: test_run_serve_when_config_invalid
        case: 異常
        summary: 端末の設定が違反する
        condition: '`sources[0]` に `config` が無く `port` が文字列'
        mock: なし
        expected: 2 を返し、標準エラーに `sources[0].config` と `port` の 2 行
        exception: 端末の設定が違反する
      - name: test_run_serve_when_port_in_use
        case: 異常
        summary: ポートが使用中
        condition: テストが先に待ち受けたポートを `DEV_DOCS_PORT` に入れる
        mock: なし
        expected: 3 を返し、標準エラーにポートの番号と `DEV_DOCS_PORT`
        exception: ポートで待ち受けられない
      - name: test_run_serve_when_prompt_invalid
        case: 異常
        summary: プロンプトの YAML が違反する
        condition: 配信できる配信元 1 つの端末の設定。同梱した YAML を一時フォルダへ複製して `mcp/docs/tools/search-docs.yaml` から `kind` を削除し、そのフォルダを `DEV_DOCS_PROMPTS_DIR` に入れる
        mock: '`uvicorn.Server.run`（呼ばれた数を数える）'
        expected: 4 を返し、標準エラーに `search-docs.yaml` のパスと `kind` があり、`uvicorn.Server.run` が呼ばれない
        exception: プロンプトの YAML が違反する
      - name: test_run_serve_when_restart
        case: 正常
        summary: 再起動の要求で同じプロセスを置き換える
        condition: 配信できる配信元 1 つの端末の設定。`uvicorn.Server.run` の中で `handlers.restart.request()` を呼ぶ
        mock: '`uvicorn.Server.run`（`started` を `True` にして再起動を要求して戻る）・`os.execv`（呼ばれた引数を記録する偽物）'
        expected: '`os.execv` が `sys.executable` と `[sys.executable, "-m", "dev_docs", "serve"]` で 1 回呼ばれる。`uvicorn.Config` の `timeout_graceful_shutdown` が `script_timeout_sec * 1.5`'
  - name: check_port
    title: ポートの確かめ
    kind: 関数
    container: main.py
    usecase: 起動
    role: 検証
    summary: 待ち受けのアドレスとポートで待ち受けられるかを、一度 bind して確かめる
    scope: public
    args:
      - name: bind
        title: 待ち受けのアドレス
        type: str
        required: true
        passing: positional
        description: 端末の設定の `bind`
      - name: port
        title: ポート
        type: int
        required: true
        passing: positional
        description: 待ち受けのポート
    returns:
      type: None
      description: 待ち受けられるときは何も返さない
    process: |-
      1. `socket.socket(AF_INET, SOCK_STREAM)` に uvicorn と同じく `SO_REUSEADDR` を付けて `(bind, port)` へ bind し、すぐに閉じる
         - `OSError`（`EADDRINUSE`・`EACCES`）の場合、`PortInUseError` を送る
    exceptions:
      - name: PortInUseError
        condition: bind に失敗する
        message: '`{bind}:{port} は使用中です`'
    unit_tests:
      - name: test_check_port
        case: 正常
        summary: 空いているポート
        condition: OS が払い出して閉じたポート
        mock: なし
        expected: 送らない
      - name: test_check_port_when_in_use
        case: 異常
        summary: 使用中のポート
        condition: テストが `listen` しているポート
        mock: なし
        expected: '`PortInUseError` の `port` がそのポート'
        exception: bind に失敗する
      - name: test_check_port_when_time_wait
        case: 正常
        summary: 閉じたばかりの接続が残るポート
        condition: '`SO_REUSEADDR` 付きで待ち受けて 1 本受け、サーバー側から接続と待ち受けを閉じた直後のポート'
        mock: なし
        expected: 送らない
  - name: build_handlers
    title: 部品の配線
    kind: 関数
    container: main.py
    usecase: 起動
    role: 合成の起点
    summary: 端末の設定から部品を 1 回だけ作り、配信元を読んで配線済みの関数にする
    scope: public
    side_effects: '`state_dir` の下にフォルダを作る。配信元を読む'
    args:
      - name: terminal
        title: 端末の設定
        type: TerminalConfig
        required: true
        passing: positional
        description: 読んだ端末の設定
    returns:
      type: Handlers
      description: 配線済みの関数
    process: |-
      1. プロンプトの一式を読む（`load_prompts(prompts_dir(os.environ), required=[SESSION_CONTEXT_PROMPT_ID, *mcp_prompt_ids()])`）。`PromptInvalidError` はそのまま送る
      2. `state_dir` を作る
      3. 配信元の一覧・リビジョンの書き出し（`{state_dir}/snapshots`）・文書のストア・変換（`{state_dir}/converted`、制限時間は `script_timeout_sec`）・会話の記録（`{state_dir}/seen.sqlite3`、保持日数は `seen_retention_days`）・文書の検査（制限時間は `script_timeout_sec`）・配信元ごとの排他・表の列の設定（`{state_dir}/columns`）・再起動の制御を作る。配信元の一覧には、組み立て直した配信元を 1 つ受け取って『配信元の控えの破棄』をこれらの部品で呼ぶ関数を `on_rebuilt` に渡す
      4. 『配信元の読み直し』をこれらの部品で束ねた関数を作り、端末の設定で 1 回呼ぶ（配信元を読み、メタデータのずれを警告のログに書く）。検証で外した配信元があっても続ける
      5. プロンプトの一式・これらの部品・手順 4 の関数を持つ `Handlers` を返す
    exceptions:
      - name: PromptInvalidError
        condition: プロンプトの YAML が無い・読めない・スキーマに違反する・描画できない
        message: 違反を全て `problems` に持つ
    unit_tests:
      - name: test_build_handlers
        case: 正常
        summary: 部品を作り配信元を読む
        condition: '`state_dir` が無い一時フォルダの下、配信できる配信元 1 つと検証に失敗する配信元 1 つ'
        mock: なし
        expected: '`state_dir` ができ、`registry.served()` が 1 つ、`registry.statuses()` が 2 つ、`prompts` が `session-context` と `mcp/docs/instructions` を持つ'
      - name: test_build_handlers_when_out_of_sync
        case: 正常
        summary: 初回の読み込みでもずれを警告のログに書く
        condition: 行 `rules` に `title` の無い文書が 1 件ある配信元 `sample` 1 つ
        mock: なし（一時フォルダの配信元と `caplog`）
        expected: '`sample` の `metadata` の列の欠けの警告が 1 件あり、`registry.served()` が 1 つ'
        exception: '-'
      - name: test_build_handlers_when_default_ref_moved
        case: 正常
        summary: default_ref が進んだ後は新しい設定で文書を読む
        condition: '`default_ref` の `rules` の行に `metadata` が無い Git の配信元 `a` と、`name: 文書 1`・`title: タイトル` の文書 1 件。1 回読んだ後に、`rules` の行へ `metadata: {name: title}` を足す commit を積む'
        mock: なし（一時フォルダで `git init`）
        expected: '`registry.get("a")` の後に `store` で読んだ文書の `metadata.name` が `タイトル`'
        exception: '-'
      - name: test_build_handlers_when_prompt_invalid
        case: 異常
        summary: プロンプトの YAML が違反すると部品を作らない
        condition: '`state_dir` が無い一時フォルダの下、`DEV_DOCS_PROMPTS_DIR` が空の一時フォルダ'
        mock: なし
        expected: '`PromptInvalidError` を送り、`state_dir` ができない'
        exception: プロンプトの YAML が違反する
  - name: reload_sources
    title: 配信元の読み直し
    kind: 関数
    container: main.py
    usecase: 端末の設定の保存
    role: 合成の起点
    summary: 配信元の一覧を読み直し、配信元の内容を控えた部品の控えを捨てる
    scope: public
    thread_safe: true
    side_effects: 配信元の一覧を入れ替え、文書のストア・文書の検査・変換の控えを捨てる。メタデータのずれを警告のログに書く
    args:
      - name: terminal
        title: 端末の設定
        type: TerminalConfig
        required: true
        passing: positional
        description: 読み直す端末の設定
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 読み直す配信元の一覧
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: 控えを捨てる
      - name: checker
        title: 文書の検査
        type: DocumentChecker
        required: true
        passing: injected
        description: 控えを捨てる
      - name: converter
        title: 変換
        type: ConvertService
        required: true
        passing: injected
        description: 控えを捨てる
    returns:
      type: list[SourceStatus]
      description: 読み直した後の配信元ごとの状態
    process: |-
      1. 配信元の一覧を読み直す（配信元の一覧.読み直す）
      2. 配信中の配信元で『配信元の控えの破棄』を呼ぶ
      3. 手順 1 の状態を返す
    unit_tests:
      - name: test_reload_sources
        case: 正常
        summary: 読み直してから控えを捨てる
        condition: 配信元 1 つの端末の設定
        mock: 配信元の一覧・文書のストア・文書の検査・変換（呼ばれた順を記録する偽物）
        expected: '`registry.reload` が端末の設定で 1 回呼ばれた後に `store.clear`・`checker.clear`・`converter.clear` が 1 回ずつ呼ばれ、`reload` の状態を返す'
      - name: test_reload_sources_when_out_of_sync
        case: 正常
        summary: メタデータのずれを警告のログに書く
        condition: 配信元 `sample` の行 `rules` に `title` の無い文書が 1 件、行 `src` の管理用の YAML に無いファイルが 2 件、ファイルが無い行が 1 件、どの文書にも当たらない `related[].to` が 1 件。配信元 `clean` はずれが無い
        mock: なし（一時フォルダの配信元と `caplog`）
        expected: '`sample` の警告が 4 件（件数と並びの値を含む）、`clean` の警告は無い。両方の配信元が `serving`'
        exception: '-'
      - name: test_reload_sources_when_alias_and_nav
        case: 正常
        summary: エイリアスのキーと nav の条件の警告
        condition: 配信元 `sample` の用語の文書 1 件の `aliases` が `3`、`nav` に `auto` の `filter` が `tags が none` のタブ `none`
        mock: なし（一時フォルダの配信元）
        expected: 警告のログに違反した文書のパスと `aliases` が文字列か文字列の並びでないことと、タブ `none` の条件が出て、`sample` が `serving`
        exception: '-'
  - name: discard_source_caches
    title: 配信元の控えの破棄
    kind: 関数
    container: main.py
    usecase: 共通
    role: 合成の起点
    summary: 配信元の内容を控えた部品の控えを捨て、渡した配信元ごとにメタデータのずれ・エイリアス・nav の警告をログに書く
    scope: public
    thread_safe: true
    side_effects: 文書のストア・文書の検査・変換の控えを捨てる。メタデータのずれを警告のログに書く
    args:
      - name: sources
        title: 配信元
        type: list[ServedSource]
        required: true
        passing: positional
        description: 警告を確かめる配信元
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: 控えを捨てる
      - name: checker
        title: 文書の検査
        type: DocumentChecker
        required: true
        passing: injected
        description: 控えを捨てる
      - name: converter
        title: 変換
        type: ConvertService
        required: true
        passing: injected
        description: 控えを捨てる
    returns:
      type: None
      description: なし
    process: |-
      1. 文書のストア・文書の検査・変換の控えを捨てる（文書のストア.全て捨てる・文書の検査.控えを捨てる・変換.控えを捨てる）
      2. 渡した配信元ごとにメタデータのずれを確かめ（文書のストア.メタデータのずれの確かめ）、3 つの並びのうち 0 件でないものを、配信元の ID・ずれの種類・件数・並びの値で警告のログに書く。`alias_violations` は文書のパス・キー・理由で、nav の警告（画面の API）はキーのパスと理由で警告のログに書く。結果は状態に持たない
  - name: run_migrate
    title: 設定の移し替えの実行
    container: main.py
    usecase: 設定の移し替え
    role: 入口
    summary: '`dev-docs migrate` の解析結果で対象を決め、当てる手順を表示するか当てる'
    kind: 関数
    scope: public
    side_effects: 対象の設定とバックアップを書く。標準出力・標準エラーに書く
    args:
      - name: args
        title: 解析結果
        type: argparse.Namespace
        required: true
        passing: positional
        description: '`migrate` の解析結果（`plan`・`record`・`source`・`allow_destructive`）'
    returns:
      type: int
      description: 終了コード。移し替えた・要らなかった・表示したとき 0
    process: |-
      1. 対象を決め（対象の決定。`env` は `os.environ`）、当てる手順を求める（当てる手順の一覧）
      2. `plan` の場合、手順ごとに `{version}: {description}` を標準出力に 1 行ずつ出し（破壊的な手順は末尾に ` [destructive]`）、0 を返す。手順が空なら何も出さない
      3. `record` の場合、手順を空にして適用し（移し替えの適用）、`{ファイル} の version を {current} にしました（バックアップ: {パス}）` を標準出力に出して 0 を返す
      4. それ以外で手順が空の場合、`移し替えは要りません（version {current}）` を標準出力に出して 0 を返す
      5. 手順を当て（移し替えの適用。`allow_destructive` は解析結果、`now` は現在時刻）、`{ファイル} を version {current} に移し替えました（バックアップ: {パス}）` を標準出力に出して 0 を返す
         - 手順 1〜5 で `MigrationError` の場合、本文を標準エラーに出し、例外の `exit_code` を返す
    exceptions:
      - name: なし（終了コード 2）
        condition: 対象が無い・読めない・`version` が無い（`MigrationConfigInvalidError`）
        message: '`{ファイル}: {理由}`'
      - name: なし（終了コード 4）
        condition: 当てた結果が新しいスキーマに違反する・読んだ後に変わった（`MigrationFailedError`）
        message: '違反を `{キーのパス}: {理由}` で 1 行ずつ'
      - name: なし（終了コード 5）
        condition: 破壊的な手順があり `--allow-destructive` が無い（`DestructiveStepBlockedError`）
        message: 破壊的な手順と `--allow-destructive` の案内
      - name: なし（終了コード 6）
        condition: 対象の `version` が dev-docs の読めるバージョンより新しい（`ConfigNewerError`）
        message: '`{ファイル}: 設定のバージョン {対象} が dev-docs の読める {現在} より新しい。dev-docs を更新してください`'
    unit_tests:
      - name: test_run_migrate_when_plan
        case: 正常
        summary: 当てる手順を表示するだけで書き換えない
        condition: '`version: "1"` の端末の設定。`2` の手順に `rename` と `delete`。`--plan`'
        mock: 手順の置き場所（一時フォルダ）・`SETTINGS_VERSION`（`2`）
        expected: '0 を返し、標準出力が `2: ` で始まる 2 行で `delete` の行だけ末尾が `[destructive]`。対象は変わらない'
      - name: test_run_migrate
        case: 正常
        summary: 手順を当ててバックアップを取る
        condition: '`version: "1"` の端末の設定。`2` の手順に `rename` だけ'
        mock: 手順の置き場所・`SETTINGS_VERSION`（`2`）
        expected: '0 を返し、対象が改名後で `version: "2"`。標準出力にバックアップのパス'
      - name: test_run_migrate_when_current
        case: 正常
        summary: 同じバージョンなら何もしない
        condition: '`version` が `SETTINGS_VERSION` と同じ'
        mock: なし
        expected: 0 を返し、標準出力に `移し替えは要りません`。バックアップを作らない
      - name: test_run_migrate_when_record
        case: 正常
        summary: '`--record` は version だけを書き換える'
        condition: '`version: "1"`、`--record`'
        mock: 手順の置き場所・`SETTINGS_VERSION`（`2`）
        expected: 0 を返し、`version` だけが `2` に変わる
      - name: test_run_migrate_when_destructive
        case: 異常
        summary: 破壊的な手順で止める
        condition: '`2` の手順に `delete`。`--allow-destructive` なし'
        mock: 手順の置き場所・`SETTINGS_VERSION`（`2`）
        expected: 5 を返し、標準エラーに `--allow-destructive`。対象は変わらない
        exception: なし（終了コード 5）
      - name: test_run_migrate_when_newer
        case: 異常
        summary: 新しすぎる設定を書き換えない
        condition: '`version: "9"` の端末の設定'
        mock: なし
        expected: 6 を返し、標準エラーに `dev-docs を更新してください`
        exception: なし（終了コード 6）
      - name: test_run_migrate_when_config_invalid
        case: 異常
        summary: 対象が無い
        condition: '`--source` に無いファイル'
        mock: なし
        expected: 2 を返し、標準エラーにファイルのパス
        exception: なし（終了コード 2）
    callees:
      - dev/設計書/モジュール構成/開発ドキュメントサーバー/features/migrate/service.py#functions[resolve_target]
      - dev/設計書/モジュール構成/開発ドキュメントサーバー/features/migrate/service.py#functions[plan_migration]
      - dev/設計書/モジュール構成/開発ドキュメントサーバー/features/migrate/service.py#functions[apply_migration]
  - name: run_files
    title: 載せるファイルの一覧の実行
    container: main.py
    usecase: 載せるファイルの一覧
    role: 入口
    summary: '`dev-docs files` の解析結果で範囲を集め、載せるファイルを 1 行ずつ出す'
    kind: 関数
    scope: public
    side_effects: 標準出力・標準エラーに書く
    args:
      - name: args
        title: 解析結果
        type: argparse.Namespace
        required: true
        passing: positional
        description: '`files` の解析結果（`root`・`paths`・`exclude`）'
    returns:
      type: int
      description: 終了コード。出し終えたとき 0
    process: |-
      1. `root` を `Path` にし、フォルダでなければ「`{root}: フォルダがありません`」を標準エラーに出して 2 を返す
      2. 載せるファイルの一覧（`indexable_files`。`paths`・`exclude` は解析結果）で集め、パスを 1 行ずつ標準出力に出して 0 を返す
    exceptions:
      - name: なし（終了コード 2）
        condition: '`--root` が無いかフォルダでない（インターフェース定義の `RootNotFound`）'
        message: '`{root}: フォルダがありません`'
    unit_tests:
      - name: test_run_files
        case: 正常
        summary: 載せるファイルを 1 行ずつ出す
        condition: '`src/a.py`・`src/uv.lock` を置き、`paths=["src/**"]`・`exclude=[]`'
        mock: なし（`tmp_path`・`capsys`）
        expected: 0 を返し、標準出力が `src/a.py` の 1 行だけ
        exception: '-'
      - name: test_run_files_when_root_not_found
        case: 異常
        summary: フォルダが無い
        condition: '`root` に無いパス'
        mock: なし（`capsys`）
        expected: 2 を返し、標準出力が空で、標準エラーに渡したパス
        exception: なし（終了コード 2）
    refs:
      - dev/設計書/モジュール構成/開発ドキュメントサーバー/features/documents/indexable.py#functions[indexable_files]
refs:
  - dev/設計書/インターフェース定義/開発ドキュメントサーバー/起動#
test_files:
  - tests/unit/dev_docs/test_serve.py
