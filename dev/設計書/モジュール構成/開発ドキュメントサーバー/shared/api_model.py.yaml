title: 開発ドキュメントサーバー / 共通 / api_model.py
lead: 画面の API の DTO の基底（キーは camelCase）。
data_models:
  - name: ApiModel
    title: 画面の API のモデル
    container: shared/api_model.py
    usecase: 共通
    role: DTO
    summary: 画面の API の入出力の DTO の基底。JSON のキーを camelCase にする
    description: '`pydantic.BaseModel` を継承し、`model_config = ConfigDict(alias_generator=to_camel, validate_by_name=True, serialize_by_alias=True)` を持つ（`to_camel` は `pydantic.alias_generators`）。画面の API（`/_api/`）の要求の本文と応答の DTO だけが継承する。パス・クエリのパラメータ名と、端末の設定・配信元の設定の YAML を読むモデルは対象にしない。'
