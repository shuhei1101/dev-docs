constants:
  - name: LIMIT_DEFAULT
    title: 件数の既定
    container: features/search/types.py
    usecase: 検索
    summary: '`limit` を省いたときの件数'
    value: '20'
  - name: LIMIT_MAX
    title: 件数の上限
    container: features/search/types.py
    usecase: 検索
    summary: '`limit` の上限。超えた値は丸めて `notes` で知らせる'
    value: '100'
  - name: MAX_CHARS_DEFAULT
    title: 文字数の既定
    container: features/search/types.py
    usecase: 検索
    summary: '`max_chars` を省いたときの結果全体の文字数'
    value: '20000'
  - name: MAX_CHARS_LIMIT
    title: 文字数の上限
    container: features/search/types.py
    usecase: 検索
    summary: '`max_chars` の上限。超えた値は丸めて `notes` で知らせる'
    value: '40000'
  - name: FIELD_CHARS_DEFAULT
    title: 項目の文字数の既定
    container: features/search/types.py
    usecase: 検索
    summary: '`max_chars_per_field` を省いたときの 1 項目の文字数'
    value: '2000'
  - name: FIELD_CHARS_FULL
    title: 本文込みの項目の文字数の既定
    container: features/search/types.py
    usecase: 検索
    summary: '`view: full` で `max_chars_per_field` を省いたときの 1 項目の文字数'
    value: '10000'
  - name: SUMMARY_FIELDS
    title: 一覧の項目
    container: features/search/types.py
    usecase: 検索
    summary: '`view: summary` で返す項目（`id`・`source` の後ろに並べる）'
    value: '("kind", "name", "description", "@chars", "version")'
  - name: COMPUTED_FIELDS
    title: 計算項目
    container: features/search/fields.py
    usecase: 検索
    summary: 文書から計算する項目
    value: '("@chars", "@path", "@sections")'
  - name: DATE_FIELDS
    title: 日時の項目
    container: features/search/fields.py
    usecase: 検索
    summary: 値を日時として比べ、空なら並べ替えの末尾にする項目
    value: '("created", "updated")'
data_models:
  - name: Condition
    title: 条件
    container: features/search/types.py
    usecase: 検索
    role: DTO
    summary: 1 つの項目を比べる条件
    description: '`pydantic.BaseModel`（`extra="forbid"`）。MCP の入力スキーマもこのモデルから作る。'
    properties:
      - name: field
        title: 項目
        type: str
        access: 公開
        description: メタデータのキー・種類ごとの項目のパス・`body`・`*`・計算項目
      - name: op
        title: 比べ方
        type: Literal['eq', 'ne', 'prefix', 'suffix', 'contains', 'not_contains', 'regex', 'gt', 'gte', 'lt', 'lte', 'exists', 'not_exists']
        access: 公開
        description: 比べ方。`regex` は値の各行に当たる（`^`・`$` は各行の先頭・末尾。値全体の先頭・末尾は `\A`・`\Z`）
        notes: 説明は `Field(description=...)` で入力のスキーマに出す
      - name: values
        title: 値
        type: list[str]
        access: 公開
        default: '[]'
        description: '比べる値。`exists`・`not_exists` 以外では 1 つ以上'
      - name: match
        title: 複数の値の扱い
        type: Literal['any', 'all']
        access: 公開
        default: '"any"'
        description: '`values` を OR か AND で比べる'
      - name: case_sensitive
        title: 区別するか
        type: bool
        access: 公開
        default: 'False'
        description: '`False` は NFKC と `casefold` をした後に比べる（`regex` はパターンに正規化をかけず、`re.IGNORECASE` と NFKC にした値で比べる）'
  - name: Group
    title: 条件のまとまり
    container: features/search/types.py
    usecase: 検索
    role: DTO
    summary: 条件を AND か OR で束ねる
    description: '`pydantic.BaseModel`（`extra="forbid"`）。`and` と `or` のどちらか 1 つだけを持つ（Python の属性は `all_of`・`any_of`、別名が `and`・`or`）。'
    properties:
      - name: all_of
        title: AND
        type: list[Condition | Group] | None
        access: 公開
        default: None
        description: 別名 `and`
      - name: any_of
        title: OR
        type: list[Condition | Group] | None
        access: 公開
        default: None
        description: 別名 `or`
  - name: OrderKey
    title: 並べ替えのキー
    container: features/search/types.py
    usecase: 検索
    role: DTO
    summary: 並べ替えの 1 つのキー
    description: '`pydantic.BaseModel`（`extra="forbid"`）。'
    properties:
      - name: field
        title: 項目
        type: str
        access: 公開
        description: 並べる項目
      - name: direction
        title: 向き
        type: Literal['asc', 'desc']
        access: 公開
        default: '"asc"'
        description: 昇順か降順
  - name: Snippets
    title: 一致した箇所
    container: features/search/types.py
    usecase: 検索
    role: DTO
    summary: 本文の代わりに条件に当たった行と前後の行だけを行番号つきで返す指定
    description: '`pydantic.BaseModel`（`extra="forbid"`）。各項目の説明は `Field(description=...)` で入力のスキーマに出す。'
    properties:
      - name: context_lines
        title: 前後の行数
        type: int
        access: 公開
        default: '1'
        description: '`before`・`after` を省いたときの前と後ろの行の数（0〜10）'
      - name: max_per_doc
        title: 1 件の箇所の数
        type: int
        access: 公開
        default: '3'
        description: 1 つの文書で返す箇所の数（1〜20）
      - name: before
        title: 前の行数
        type: int | None
        access: 公開
        default: None
        description: 当たった行の前に返す行の数（`Field(ge=0)`）。`None` は `context_lines`
      - name: after
        title: 後ろの行数
        type: int | None
        access: 公開
        default: None
        description: 当たった行の後ろに返す行の数（`Field(ge=0)`）。`None` は `context_lines`
  - name: SearchRequest
    title: 検索の要求
    container: features/search/types.py
    usecase: 検索
    role: DTO
    summary: '`search_docs` の引数'
    description: '`pydantic.BaseModel`（`extra="forbid"`）。キーの意味と既定値はインターフェース定義『文書の検索』の `request`。`limit` と `max_chars` は丸めるので型だけを確かめる。'
    properties:
      - name: source
        title: 配信元
        type: str | list[str] | None
        access: 公開
        default: None
        description: '`*` も受ける'
      - name: ref
        title: リビジョン
        type: str | None
        access: 公開
        default: None
        description: 読むリビジョン
      - name: worktree
        title: ワークツリー
        type: str | None
        access: 公開
        default: None
        description: 読むワークツリー
      - name: filter
        title: 条件
        type: Condition | Group | None
        access: 公開
        default: None
        description: 条件の木
      - name: view
        title: 返す量
        type: Literal['ids', 'summary', 'full', 'count']
        access: 公開
        default: '"summary"'
        description: 返す量
      - name: fields
        title: 加える項目
        type: list[str]
        access: 公開
        default: '[]'
        description: 返す項目に加える
      - name: exclude_fields
        title: 除く項目
        type: list[str]
        access: 公開
        default: '[]'
        description: 返す項目から除く
      - name: order_by
        title: 並べ替え
        type: list[OrderKey] | None
        access: 公開
        default: None
        description: 先のキーが優先。`None`（渡していない）は `id` の昇順
      - name: group_by
        title: 集計の項目
        type: str | None
        access: 公開
        default: None
        description: 値ごとの件数を返す
      - name: limit
        title: 件数
        type: int
        access: 公開
        default: LIMIT_DEFAULT
        description: 返す件数
      - name: cursor
        title: 続きの位置
        type: str | None
        access: 公開
        default: None
        description: 前回の `next_cursor`
      - name: skip
        title: 飛ばす件数
        type: int
        access: 公開
        default: '0'
        description: 先頭から飛ばす件数
      - name: max_chars
        title: 文字数
        type: int
        access: 公開
        default: MAX_CHARS_DEFAULT
        description: 結果全体の文字数の上限
      - name: max_chars_per_field
        title: 項目の文字数
        type: int | None
        access: 公開
        default: None
        description: '`None` は `view` で決める（`FIELD_CHARS_DEFAULT`・`FIELD_CHARS_FULL`）'
      - name: snippets
        title: 一致した箇所
        type: Snippets | None
        access: 公開
        default: None
        description: 一致した行の前後だけを返す
      - name: repeat_seen
        title: 返し済みも返す
        type: bool
        access: 公開
        default: 'False'
        description: '`True` で会話の記録の省略をしない'
      - name: format
        title: 形式
        type: Literal['markdown', 'json']
        access: 公開
        default: '"markdown"'
        description: 返す形式
      - name: cwd
        title: 作業場所
        type: str | None
        access: 公開
        default: None
        description: フックが入れる
      - name: session_id
        title: セッションの ID
        type: str | None
        access: 公開
        default: None
        description: フックが入れる
      - name: agent_id
        title: エージェントの ID
        type: str | None
        access: 公開
        default: None
        description: フックが入れる
  - name: SearchItem
    title: 検索の結果の文書
    container: features/search/types.py
    usecase: 検索
    role: DTO
    summary: 返す 1 件の文書の項目
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: id
        title: 文書の ID
        type: str
        access: 公開
        description: 文書の ID
      - name: source
        title: 配信元
        type: str | None
        access: 公開
        description: 複数の配信元を指したときだけ
      - name: values
        title: 項目
        type: dict[str, Any]
        access: 公開
        description: 返す項目 → 値（長い文字列は末尾を切って `…（残り {n} 文字）` を付けたもの）。`body` は返し済みなら `SEEN_MARK`
      - name: snippets
        title: 一致した箇所
        type: list[Snippet]
        access: 公開
        default: '[]'
        description: '`snippets` を指定したときだけ'
      - name: path
        title: 文書の場所
        type: str | None
        access: 公開
        default: None
        description: '文書の場所（文書のストア.文書の場所）。`view: ids`・`count`、`ref` を渡した呼び出し、返し済みの文書では `None`'
      - name: scope
        title: 返した範囲
        type: Literal['full', 'section', 'summary'] | None
        access: 公開
        default: None
        description: '`path` が `None` のときは `None`'
  - name: GroupCount
    title: 集計の行
    container: features/search/types.py
    usecase: 検索
    role: DTO
    summary: '`group_by` の値ごとの件数'
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: value
        title: 値
        type: str
        access: 公開
        description: 項目の値。値が無い文書は `（なし）`
      - name: count
        title: 件数
        type: int
        access: 公開
        description: その値を持つ文書の数
  - name: SearchResult
    title: 検索の結果
    container: features/search/types.py
    usecase: 検索
    role: DTO
    summary: '`search_docs` が返すもの'
    description: '`dataclass(frozen=True)`。JSON にするときは `None` と空の項目を落とす。'
    properties:
      - name: total_count
        title: 総件数
        type: int
        access: 公開
        description: 条件に当たった数
      - name: per_source
        title: 配信元ごとの件数
        type: dict[str, int]
        access: 公開
        description: 複数の配信元を指したときだけ中身を持つ
      - name: returned
        title: 返した件数
        type: int
        access: 公開
        description: '`items` の数'
      - name: next_cursor
        title: 続きの位置
        type: str | None
        access: 公開
        description: 続きがあるときだけ
      - name: truncated
        title: 打ち切ったか
        type: bool
        access: 公開
        description: '`max_chars` で打ち切ったか'
      - name: notes
        title: 知らせ
        type: list[str]
        access: 公開
        description: 丸めた・打ち切った・読めなかったファイル・読み取りの検査の警告と次の手
      - name: groups
        title: 集計
        type: list[GroupCount]
        access: 公開
        description: '`group_by` のときだけ。件数の降順・値の昇順'
      - name: items
        title: 文書
        type: list[SearchItem]
        access: 公開
        description: '`view: count` では空'
      - name: view
        title: 返す量
        type: str
        access: 公開
        description: 描き方を決めるために要求の `view` を持つ
      - name: source_label
        title: 配信元の表示
        type: str
        access: 公開
        default: '""'
        description: Markdown の先頭の行に出す、読んだ配信元の ID（複数なら `,` で繋ぐ）。JSON には出さない
  - name: SnippetLine
    title: 抜粋の行
    container: features/search/types.py
    usecase: 検索
    role: DTO
    summary: 抜粋の 1 行
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: line
        title: 行番号
        type: int
        access: 公開
        description: 本文の行番号（1 始まり）
      - name: text
        title: 行
        type: str
        access: 公開
        description: 行の文字列（改行を含まない）
      - name: hit
        title: 当たった行か
        type: bool
        access: 公開
        description: '`False` は前後の行'
  - name: Snippet
    title: 抜粋
    container: features/search/types.py
    usecase: 検索
    role: DTO
    summary: 重なる範囲をまとめた 1 つの抜粋
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: lines
        title: 行
        type: list[SnippetLine]
        access: 公開
        description: 本文の順の行
functions:
  - name: field_values
    title: 項目の値
    kind: 関数
    container: features/search/fields.py
    usecase: 検索
    role: 読み取り
    summary: 文書から項目の値を引き、比べられる値の並びにする
    scope: public
    thread_safe: true
    args:
      - name: document
        title: 文書
        type: Document
        required: true
        passing: positional
        description: 引く文書
      - name: field
        title: 項目
        type: str
        required: true
        passing: positional
        description: 項目
    returns:
      type: list[Any]
      description: 値の並び。配列の項目は要素、値が無ければ空
    process: |-
      1. 項目で引き方を決める
         - `id`・`kind` の場合、文書の属性
         - `created`・`updated` の場合、文書の日時（無ければ空）
         - メタデータのキー（`METADATA_KEYS`）の場合、`document.metadata`
         - `body` の場合、本文
         - `*` の場合、`data` の全ての文字列の葉と本文
         - `@chars` は本文の文字数、`@path` は `document.path`（`records` の行は `{path}#{record_index}`）、`@sections` は Markdown の文書なら本文の見出しの文字列、YAML の文書なら `data` の最上位のキーの並び
         - それ以外は `data` を項目の取得で引く
      2. 値が配列なら要素を、`None` なら空、それ以外は 1 要素の並びを返す
    unit_tests:
      - name: test_field_values
        case: 正常
        summary: 項目の種類ごとの値
        condition: '`tags: [a, b]`・`data.owner.name: x`・本文 `# 見出し`'
        mock: なし
        expected: '`tags` が `[a, b]`、`owner.name` が `[x]`、`@chars` が本文の文字数、`missing` が `[]`'
  - name: known_fields
    title: 使える項目
    kind: 関数
    container: features/search/fields.py
    usecase: 検索
    role: 読み取り
    summary: 配信元の種類のスキーマから、条件・並べ替え・集計に使える項目の一覧を作る
    scope: public
    thread_safe: true
    args:
      - name: schemas
        title: 種類のスキーマ
        type: Iterable[Mapping[str, Any]]
        required: true
        passing: positional
        description: 読む種類のスキーマ
    returns:
      type: dict[str, str]
      description: 項目のパス → 型（`string`・`number`・`boolean`・`array`・`object`・`date`）
    process: |-
      1. `id`・`kind`・`created`・`updated`・`METADATA_KEYS`・`body`・`*`・`COMPUTED_FIELDS` を入れる
      2. スキーマの `properties` を再帰でたどり、`a.b` のパスと `type`（`format: date`・`date-time` は `date`）を足す。配列の要素の `properties` は `a.b` の形で足す
      3. 型の食い違う同じパスは `string` にする
  - name: check_filter
    title: 条件の確かめ
    kind: 関数
    container: features/search/filters.py
    usecase: 検索
    role: 検証
    summary: 条件・並べ替え・集計の項目と値が使えるかを確かめる
    scope: public
    thread_safe: true
    args:
      - name: request
        title: 検索の要求
        type: SearchRequest
        required: true
        passing: positional
        description: 確かめる要求
      - name: fields
        title: 使える項目
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 使える項目の結果
    returns:
      type: list[Violation]
      description: 違反。項目のパスは引数のパス（`filter.and[1].field`）
    process: |-
      1. 条件の木をたどり、`field` が `fields` に無い・`exists` 以外で `values` が空・`regex` が正規表現にならない（正規表現の組み立て）・`gt` などで値が項目の型に合わない（比べる値の解釈）を違反にする。`fix` には近い項目（`difflib.get_close_matches`）か期待する型
      2. `order_by[].field`・`group_by` が `fields` に無いものを違反にする
      3. `Group` が `and`・`or` を両方持つ・どちらも持たないものを違反にする
  - name: parse_compare_value
    title: 比べる値の解釈
    kind: 関数
    container: features/search/filters.py
    usecase: 検索
    role: 変換
    summary: 条件の値を項目の型で解釈する
    scope: public
    thread_safe: true
    args:
      - name: value
        title: 値
        type: str
        required: true
        passing: positional
        description: 条件の値
      - name: field_type
        title: 項目の型
        type: str
        required: true
        passing: positional
        description: 使える項目の型
      - name: today
        title: 今日
        type: date
        required: true
        passing: keyword
        description: '`today`・`-7d` の基準'
    returns:
      type: Any
      description: '`date` は `datetime`（UTC）、`number` は `float`、それ以外は文字列'
    process: |-
      1. `date` の場合、`today` は今日の 0 時、`-{n}d`・`+{n}d` は今日から `n` 日、それ以外は `datetime.fromisoformat`（タイムゾーンが無ければ UTC）
      2. `number` の場合、`float`
      3. 解釈できない場合、`ValueError` を送る
    exceptions:
      - name: ValueError
        condition: 型に合わない値
        message: '`{value} を {field_type} として読めません`'
    unit_tests:
      - name: test_parse_compare_value
        case: 正常
        summary: 日付の相対の値
        condition: '`today=2026-10-28` で `today`・`-7d`・`2026-10-01`'
        mock: なし
        expected: 10-28・10-21・10-01 の 0 時（UTC）
      - name: test_parse_compare_value_when_invalid
        case: 異常
        summary: 読めない値
        condition: '`("x", "number")`'
        mock: なし
        expected: '`ValueError`'
        exception: 型に合わない値
  - name: match_filter
    title: 条件の照合
    kind: 関数
    container: features/search/filters.py
    usecase: 検索
    role: 判定
    summary: 文書が条件の木に当たるかを判定する
    scope: public
    thread_safe: true
    args:
      - name: node
        title: 条件
        type: Condition | Group | None
        required: true
        passing: positional
        description: '`None` は全てに当たる'
      - name: document
        title: 文書
        type: Document
        required: true
        passing: positional
        description: 判定する文書
      - name: fields
        title: 使える項目
        type: Mapping[str, str]
        required: true
        passing: keyword
        description: 値を解釈する型
      - name: today
        title: 今日
        type: date
        required: true
        passing: keyword
        description: 日付の相対の値の基準
    returns:
      type: bool
      description: 当たるか
    process: |-
      1. `Group` は `all_of` なら全て、`any_of` ならどれかが当たるとき `True`
      2. `Condition` は項目の値を引き、`values` の各値と比べる（`match` が `any` ならどれか、`all` なら全て）
         - `exists`・`not_exists` は値の並びが空でないか
         - `eq`・`ne`・`prefix`・`suffix`・`contains`・`not_contains` は、値の並びのどれかとの文字列の比較（`case_sensitive` が `False` なら両方を NFKC と `casefold`）。`ne`・`not_contains` は値の並びのどれとも当たらないとき `True`
         - `regex` は正規表現の組み立ての `search`。`case_sensitive` が `False` なら文書の値を NFKC にして比べる（パターンには正規化をかけない）
         - `gt`・`gte`・`lt`・`lte` は比べる値の解釈で型をそろえて比べ、解釈できない文書の値は当たらない
    unit_tests:
      - name: test_match_filter
        case: 正常
        summary: AND と OR の入れ子
        condition: '`{and: [{field: tags, op: eq, values: [mcp]}, {or: [{field: name, op: contains, values: [ＭＣＰ]}, {field: updated, op: gte, values: [-7d]}]}]}`'
        mock: なし
        expected: '`tags: [mcp]` で `name` が `mcp の決まり` の文書が `True`、`tags: [x]` の文書が `False`'
      - name: test_match_filter_when_match_all
        case: 正常
        summary: 複数の値の AND
        condition: '`{field: tags, op: eq, values: [a, b], match: all}`'
        mock: なし
        expected: '`tags: [a, b, c]` が `True`、`tags: [a]` が `False`'
      - name: test_match_filter_when_case_sensitive
        case: 正常
        summary: 区別する
        condition: '`{field: name, op: eq, values: [Doc], case_sensitive: true}`'
        mock: なし
        expected: '`name: doc` が `False`'
      - name: test_match_filter_when_regex_lines
        case: 正常
        summary: 正規表現は各行に当たる
        condition: '`{field: body, op: regex, values: ["^## "]}` と `{field: body, op: regex, values: ["\\A## "]}`'
        mock: なし
        expected: 本文 `# x\n## y` の文書が 1 つ目で `True`、2 つ目で `False`
  - name: match_words
    title: 語の照合
    kind: 関数
    container: features/search/filters.py
    usecase: 画面
    role: 判定
    summary: 空白で区切った語を全て含む文書かを判定する（画面の検索）
    scope: public
    thread_safe: true
    args:
      - name: document
        title: 文書
