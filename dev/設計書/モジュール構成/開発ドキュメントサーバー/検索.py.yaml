functions:
  - name: field_values
    title: 項目の値
    kind: 関数
    container: features/search/fields.py
    usecase: 検索
    role: 読み取り
    summary: 文書から項目の値を引き、比べられる値の並びにする
    scope: public
    thread_safe: true
    args:
      - name: document
        title: 文書
        type: Document
        required: true
        passing: positional
        description: 引く文書
      - name: field
        title: 項目
        type: str
        required: true
        passing: positional
        description: 項目
    returns:
      type: list[Any]
      description: 値の並び。配列の項目は要素、値が無ければ空
    process: |-
      1. 項目で引き方を決める
         - `id`・`kind` の場合、文書の属性
         - `created`・`updated` の場合、文書の日時（無ければ空）
         - メタデータのキー（`METADATA_KEYS`）の場合、`document.metadata`
         - `body` の場合、本文
         - `*` の場合、`data` の全ての文字列の葉と本文
         - `@chars` は本文の文字数、`@path` は `document.path`（`records` の行は `{path}#{record_index}`）、`@sections` は Markdownの本文かが `True` の文書なら本文の見出しの文字列、それ以外は `data` の最上位のキーの並び
         - `@matches` は条件で決まり文書だけでは決まらないので、値を持たない（文書の検索が当たった行の数で数える）
         - それ以外は `data` を項目の取得で引く
      2. 値が配列なら要素を、`None` なら空、それ以外は 1 要素の並びを返す
    unit_tests:
      - name: test_field_values
        case: 正常
        summary: 項目の種類ごとの値
        condition: '`tags: [a, b]`・`data.owner.name: x`・本文 `# 見出し`'
        mock: なし
        expected: '`tags` が `[a, b]`、`owner.name` が `[x]`、`@chars` が本文の文字数、`missing` が `[]`'
  - name: known_fields
    title: 使える項目
    kind: 関数
    container: features/search/fields.py
    usecase: 検索
    role: 読み取り
    summary: 配信元の種類のスキーマから、条件・並べ替え・集計に使える項目の一覧を作る
    scope: public
    thread_safe: true
    args:
      - name: schemas
        title: 種類のスキーマ
        type: Iterable[Mapping[str, Any]]
        required: true
        passing: positional
        description: 読む種類のスキーマ
    returns:
      type: dict[str, str]
      description: 項目のパス → 型（`string`・`number`・`boolean`・`array`・`object`・`date`）
    process: |-
      1. `id`・`kind`・`created`・`updated`・`METADATA_KEYS`・`body`・`*`・`COMPUTED_FIELDS` を入れる
      2. スキーマの `properties` を再帰でたどり、`a.b` のパスと `type`（`format: date`・`date-time` は `date`）を足す。配列の要素の `properties` は `a.b` の形で足す
      3. 型の食い違う同じパスは `string` にする
  - name: check_filter
    title: 条件の確かめ
    kind: 関数
    container: features/search/filters.py
    usecase: 検索
    role: 検証
    summary: 条件・並べ替え・集計の項目と値、本文の範囲の引数が使えるかを確かめる
    scope: public
    thread_safe: true
    args:
      - name: request
        title: 検索の要求
        type: SearchRequest
        required: true
        passing: positional
        description: 確かめる要求
      - name: fields
        title: 使える項目
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 使える項目の結果
    returns:
      type: list[Violation]
      description: 違反。項目のパスは引数のパス（`filter.and[1].field`・`filter.not.field`）
    process: |-
      1. 条件の木を `and`・`or`・`not` の下までたどり、`field` が `fields` に無い・`exists` 以外で `values` が空・`regex` が正規表現にならない（正規表現の組み立て）・`gt` などで値が項目の型に合わない（比べる値の解釈）を違反にする。`fix` には近い項目（`difflib.get_close_matches`）か期待する型
      2. `field` が `@matches` の条件を違反にする（`rule`: `@matches は条件に使えません`、`fix`: `fields か order_by に渡してください`）
      3. `Group` が `and`・`or`・`not` のうち 1 つだけを持たないものを違反にする（`rule`: `and・or・not のどれか 1 つだけを持ってください`）
      4. `order_by[].field` が `fields` に無いもの、`group_by` が `fields` に無いか `@matches` のものを違反にする
      5. `sections` と `lines` を両方持つ場合、`sections` のパスで違反にする（`rule`: `sections と lines は同時に渡せません`）
      6. `view` が `full` 以外で `sections`・`lines` を持つ場合、そのパスで違反にする（`rule`: `view: full のときだけ渡せます`）
    unit_tests:
      - name: test_check_filter_when_group_keys
        case: 異常
        summary: 束のキーが 2 つ
        condition: '`{and: [{field: name, op: eq, values: [a]}], not: {field: tags, op: eq, values: [x]}}`'
        mock: なし
        expected: 違反が 1 件で、`path` が `filter`、`rule` が `and・or・not のどれか 1 つだけを持ってください`
      - name: test_check_filter_when_not_child
        case: 異常
        summary: '`not` の下の知らない項目'
        condition: '`{not: {field: nmae, op: eq, values: [x]}}`'
        mock: なし
        expected: 違反の `path` が `filter.not.field`
      - name: test_check_filter_when_matches
        case: 異常
        summary: '`@matches` を条件に使う'
        condition: '`filter: {field: "@matches", op: gt, values: ["1"]}` と、`order_by: [{field: "@matches"}]` だけの要求'
        mock: なし
        expected: 1 つ目は違反の `path` が `filter.field`、2 つ目は違反が無い
      - name: test_check_filter_when_body_range
        case: 異常
        summary: 本文の範囲の引数の組み合わせ
        condition: '`view: full` で `sections: [a]` と `lines: {offset: 1}` を両方と、`view: summary` で `sections: [a]`'
        mock: なし
        expected: '1 つ目は違反の `path` が `sections`、2 つ目は `path` が `sections` で `rule` が `view: full のときだけ渡せます`'
  - name: parse_compare_value
    title: 比べる値の解釈
    kind: 関数
    container: features/search/filters.py
    usecase: 検索
    role: 変換
    summary: 条件の値を項目の型で解釈する
    scope: public
    thread_safe: true
    args:
      - name: value
        title: 値
        type: str
        required: true
        passing: positional
        description: 条件の値
      - name: field_type
        title: 項目の型
        type: str
        required: true
        passing: positional
        description: 使える項目の型
      - name: today
        title: 今日
        type: date
        required: true
        passing: keyword
        description: '`today`・`-7d` の基準'
    returns:
      type: Any
      description: '`date` は `datetime`（UTC）、`number` は `float`、それ以外は文字列'
    process: |-
      1. `date` の場合、`today` は今日の 0 時、`-{n}d`・`+{n}d` は今日から `n` 日、それ以外は `datetime.fromisoformat`（タイムゾーンが無ければ UTC）
      2. `number` の場合、`float`
      3. 解釈できない場合、`ValueError` を送る
    exceptions:
      - name: ValueError
        condition: 型に合わない値
        message: '`{value} を {field_type} として読めません`'
    unit_tests:
      - name: test_parse_compare_value
        case: 正常
        summary: 日付の相対の値
        condition: '`today=2026-10-28` で `today`・`-7d`・`2026-10-01`'
        mock: なし
        expected: 10-28・10-21・10-01 の 0 時（UTC）
      - name: test_parse_compare_value_when_invalid
        case: 異常
        summary: 読めない値
        condition: '`("x", "number")`'
        mock: なし
        expected: '`ValueError`'
        exception: 型に合わない値
  - name: match_filter
    title: 条件の照合
    kind: 関数
    container: features/search/filters.py
    usecase: 検索
    role: 判定
    summary: 文書が条件の木に当たるかを判定する
    scope: public
    thread_safe: true
    args:
      - name: node
        title: 条件
        type: Condition | Group | None
        required: true
        passing: positional
        description: '`None` は全てに当たる'
      - name: document
        title: 文書
        type: Document
        required: true
        passing: positional
        description: 判定する文書
      - name: fields
        title: 使える項目
        type: Mapping[str, str]
        required: true
        passing: keyword
        description: 値を解釈する型
      - name: today
        title: 今日
        type: date
        required: true
        passing: keyword
        description: 日付の相対の値の基準
    returns:
      type: bool
      description: 当たるか
    process: |-
      1. `Group` は `all_of` なら全て、`any_of` ならどれかが当たるとき、`not_` なら中が当たらないとき `True`
      2. `Condition` は項目の値を引き、`values` の各値と比べる（`match` が `any` ならどれか、`all` なら全て）
         - `exists`・`not_exists` は値の並びが空でないか
         - `eq`・`ne`・`prefix`・`suffix`・`contains`・`not_contains` は、値の並びのどれかとの文字列の比較（`case_sensitive` が `False` なら両方を NFKC と `casefold`）。`ne`・`not_contains` は値の並びのどれとも当たらないとき `True`
         - `regex` は正規表現の組み立ての `search`。`case_sensitive` が `False` なら文書の値を NFKC にして比べる（パターンには正規化をかけない）
         - `glob` は値の並びのどれかに `PurePosixPath(値).full_match(パターン)` を当てる（`**` は `/` をまたぎ、`*`・`?` はまたがない）。`case_sensitive` が `False` なら値とパターンの両方を NFKC と `casefold` にしてから当てる
         - `gt`・`gte`・`lt`・`lte` は比べる値の解釈で型をそろえて比べ、解釈できない文書の値は当たらない
    unit_tests:
      - name: test_match_filter
        case: 正常
        summary: AND と OR の入れ子
        condition: '`{and: [{field: tags, op: eq, values: [mcp]}, {or: [{field: name, op: contains, values: [ＭＣＰ]}, {field: updated, op: gte, values: [-7d]}]}]}`'
        mock: なし
        expected: '`tags: [mcp]` で `name` が `mcp の決まり` の文書が `True`、`tags: [x]` の文書が `False`'
      - name: test_match_filter_when_match_all
        case: 正常
        summary: 複数の値の AND
        condition: '`{field: tags, op: eq, values: [a, b], match: all}`'
        mock: なし
        expected: '`tags: [a, b, c]` が `True`、`tags: [a]` が `False`'
      - name: test_match_filter_when_case_sensitive
        case: 正常
        summary: 区別する
        condition: '`{field: name, op: eq, values: [Doc], case_sensitive: true}`'
        mock: なし
        expected: '`name: doc` が `False`'
      - name: test_match_filter_when_regex_lines
        case: 正常
        summary: 正規表現は各行に当たる
        condition: '`{field: body, op: regex, values: ["^## "]}` と `{field: body, op: regex, values: ["\\A## "]}`'
        mock: なし
        expected: 本文 `# x\n## y` の文書が 1 つ目で `True`、2 つ目で `False`
      - name: test_match_filter_when_not
        case: 正常
        summary: 束の否定と入れ子
        condition: '`{and: [{field: tags, op: eq, values: [a]}, {not: {or: [{field: name, op: eq, values: [x]}, {field: name, op: eq, values: [y]}]}}]}`'
        mock: なし
        expected: '`tags: [a]`・`name: z` が `True`、`tags: [a]`・`name: y` が `False`'
      - name: test_match_filter_when_glob
        case: 正常
        summary: パスの glob
        condition: '`{field: "@path", op: glob, values: ["notes/*.md"]}` と `{field: "@path", op: glob, values: ["NOTES/**"]}`'
        mock: なし
        expected: 1 つ目は `notes/a.md` が `True`、`notes/archive/c.md` が `False`。2 つ目（`case_sensitive` を省く）はどちらも `True`
  - name: match_words
    title: 語の照合
    kind: 関数
    container: features/search/filters.py
    usecase: 画面
    role: 判定
    summary: 空白で区切った語を全て含む文書かを判定する（画面の検索）
    scope: public
    thread_safe: true
    args:
      - name: document
        title: 文書
        type: Document
        required: true
        passing: positional
        description: 判定する文書
      - name: words
        title: 語
        type: Sequence[str]
        required: true
        passing: positional
        description: NFKC と `casefold` をした語
    returns:
      type: bool
      description: 全ての語が `*` の値か ID のどれかに含まれるか
    process: 1. `*` の値と ID を NFKC と `casefold` をして改行で繋ぎ、全ての語を含むかを返す
  - name: snippet_lines
    title: 一致した箇所の抜き出し
    kind: 関数
    container: features/search/snippets.py
    usecase: 共通
    role: 変換
    summary: 本文から語を含む行と前後の行を抜き出す（画面の検索）
    scope: public
    thread_safe: true
    args:
      - name: text
        title: 本文
        type: str
        required: true
        passing: positional
        description: 抜き出す元
      - name: words
        title: 語
        type: Sequence[str]
        required: true
        passing: positional
        description: NFKC と `casefold` をした語
      - name: context_lines
        title: 前後の行数
        type: int
        required: true
        passing: keyword
        description: 添える行数
      - name: max_count
        title: 箇所の数
        type: int
        required: true
        passing: keyword
        description: 返す箇所の上限
    returns:
      type: list[str]
      description: 箇所ごとに前後の行を改行で繋いだもの。重なる箇所は 1 つにまとめる
    process: |-
      1. 語を `values` にした `{field: body, op: contains}` の条件で抜粋の検索をする（`before`・`after` は `context_lines`）
      2. 抜粋ごとに行の `text` を改行で繋いで返す
    unit_tests:
      - name: test_snippet_lines
        case: 正常
        summary: 前後の行と重なり
        condition: 10 行のうち 3・4 行目に語、`context_lines=1`、`max_count=3`
        mock: なし
        expected: 2〜5 行目の 1 箇所
  - name: encode_cursor
    title: 続きの位置を作る
    kind: 関数
    container: features/search/cursor.py
    usecase: 共通
    role: 変換
    summary: 次の位置と要求の指紋を `next_cursor` の文字列にする
    scope: public
    thread_safe: true
    args:
      - name: offset
        title: 位置
        type: int
        required: true
        passing: positional
        description: 次に返す文書の、並べ替えた後の位置
      - name: fingerprint
        title: 要求の指紋
        type: str
        required: true
        passing: positional
        description: '`cursor`・`limit`・`max_chars` を除いた要求の値のハッシュ'
    returns:
      type: str
      description: '`{"o": offset, "f": fingerprint}` の JSON を URL セーフの Base64 にしたもの'
    process: 1. JSON にして Base64 にする
  - name: decode_cursor
    title: 続きの位置を読む
    kind: 関数
    container: features/search/cursor.py
    usecase: 共通
    role: 検証
    summary: '`cursor` から位置を取り出し、要求が前回と同じかを確かめる'
    scope: public
    thread_safe: true
    args:
      - name: cursor
        title: 続きの位置
        type: str
        required: true
        passing: positional
        description: 前回の `next_cursor`
      - name: fingerprint
        title: 要求の指紋
        type: str
        required: true
        passing: positional
        description: 今回の要求の指紋
    returns:
      type: int
      description: 位置
    process: |-
      1. Base64 と JSON を読む。読めない場合、`InvalidArgumentError`（`cursor` を読めません）を送る
      2. 指紋が違う場合、`InvalidArgumentError`（`cursor` は前回と同じ引数で渡してください）を送る
    exceptions:
      - name: InvalidArgumentError
        condition: 読めない・前回と引数が違う
        message: '`cursor は前回と同じ引数で渡してください`'
    unit_tests:
      - name: test_decode_cursor
        case: 正常
        summary: 往復
        condition: '`encode_cursor(40, "f1")` を `"f1"` で読む'
        mock: なし
        expected: '40'
      - name: test_decode_cursor_when_other_request
        case: 異常
        summary: 引数が違う
        condition: 同じ `cursor` を `"f2"` で読む
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `cursor`'
        exception: 前回と引数が違う
  - name: search_docs
    title: 文書の検索
    kind: 関数
    container: features/search/service.py
    usecase: 検索
    role: サービス
    summary: '`search_docs` の要求を処理して検索の結果を返す'
    scope: public
    thread_safe: true
    side_effects: 本文を返した文書を会話の記録に残す（`sections`・`lines` を渡した呼び出しを除く）。読み取りの `validators[]` を動かす
    args:
      - name: request
        title: 検索の要求
        type: SearchRequest
        required: true
        passing: positional
        description: ツールの引数
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 配信中の配信元
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: 文書を読む
      - name: checker
        title: 文書の検査
        type: DocumentChecker
        required: true
        passing: injected
        description: 読み取りの `validators[]`
      - name: seen
        title: 会話の記録
        type: SeenStore
        required: true
        passing: injected
        description: 返し済みの省略と記録
      - name: today
        title: 今日
        type: date | None
        required: false
        default: None
        passing: keyword
        description: テスト用。`None` は今日（ローカル）
    returns:
      type: SearchResult
      description: 検索の結果
    process: |-
      1. 読む場所を解く（読む場所の解決。`source`・`ref`・`worktree`・`cwd`・`outside_scope`）。結果の `outside_scope` は読んだ場所のどれかが作業範囲の外なら `True`
      2. 場所ごとに文書を集める（文書のストア.文書を集める）。`problems` は `notes` に `{path} を読めないので除きました（{detail}）` で足す
      3. 集めた種類のスキーマで使える項目を作り、条件の確かめをする
         - 違反がある場合、違反と `describe(source, kind)` でスキーマを見ることを添えた `InvalidArgumentError` を送る
      4. `limit` が `LIMIT_MAX` を超えれば丸め、`max_chars` が `MAX_CHARS_LIMIT` を超えれば丸めて、それぞれ `notes` で知らせる。`limit` が 1 未満なら `InvalidArgumentError` を送る
      5. 条件の照合で当たった文書を集め（`term` がある場合は、場所ごとにエイリアスの集め（文書のストア）をし、用語に当たる文書の ID（文書のストア）に入る文書だけを残す。`has_alias_rows` が `False` の場所は `{id}: alias_type を持つ documents の行が無いので term に当たる文書はありません` を `notes` に足す）、`total_count` と（複数の配信元なら）`per_source` を数える。読んだ配信元の ID を `,` で繋いで `source_label` にする
      6. 条件の木から、`field` が `body`・`*` の条件を `and`・`or` の下だけたどって集める（`not` の下はたどらない。以下、本文の条件）
      7. `fields` か `order_by` に `@matches` がある場合、当たった文書ごとに本文の全文と本文の条件で当たった行の数を数える（本文の条件が無ければ 0）
      8. `group_by` がある場合、当たった文書の値ごとの件数を `groups` にする（配列は要素ごとに数え、値が無い文書は `（なし）`）
         - 値は条件の比較と同じ `normalize`（NFKC と `casefold`）をした値でまとめ、1 つの文書の同じ値は 1 件と数える
         - `value` は、まとめた元の表記のうち付いている文書が最も多いもの（同数なら値の昇順で先のもの）にする
      9. `view` が `count` の場合、ここで返す
      10. `order_by` のキーの順に並べる（`order_by` が `None` なら `id` の昇順。`@matches` は 7 で数えた数。日時の項目の空と値が無い文書は向きによらず末尾。同じ順位は配信元の順・`id` の昇順）。`order_by` が `None` で、`filter` が `id` の `eq` の条件 1 つのときは、その `values` の順に並べる
      11. 始まりの位置を `skip` と、`cursor` があれば続きの位置を読む（指紋は要求のハッシュ）の和にし、`limit` 件を取り出す
      12. 文書ごとに返す項目を作る
          - `ids` は `id`、`summary` は `id` と `SUMMARY_FIELDS`、`full` はさらに `body` と全てのメタデータ。`fields` を足し `exclude_fields` を除く。`@matches` は 7 で数えた数
          - 本文を返す場合、`repeat_seen` が `False` で `sections`・`lines` が無いなら、会話の記録.返し済みに当たる文書の `body` を `SEEN_MARK` にする
          - `sections`・`lines` がある場合、本文を行の分割で分け、本文の範囲の選択で範囲を決める（Markdownの本文かが `False` の文書には `sections` を渡さず空の範囲にする）。`ranges` に範囲、`total_lines` に行数を入れ、本文を範囲の本文にする。`sections` で範囲が空の文書は、`False` の文書なら `{id}: YAML の文書は sections で切り出せません。lines を使ってください`、`True` の文書なら `{id}: sections に当たる見出しがありません（{sections}）` を `notes` に足す
          - `snippets` がある場合、本文の条件で抜粋の検索をし（`before`・`after` は `None` なら `context_lines`、`max_count` は `max_per_doc`、`ranges` は切り出した範囲）、`body` を返さない
          - 文字列の値が項目の文字数を超えたら切る（切り出した本文は切り出した後に切る）
          - `view` が `summary`・`full` で `ref` が無く、`body` を `SEEN_MARK` にしていない場合、`path` を文書の場所（文書のストア.文書の場所）にし、`scope` を次のとおり決める。`body` を返さない（`snippets` も無い）なら `summary`、`snippets` を返すか `sections`・`lines` で切り出したか `body` を切ったか `records` の要素で `body_path` が無いなら `section`、それ以外は `full`
      13. 返した文書を順に読み取りの検査（文書の検査.検査する、`on="read"`）にかけ、違反を `{id}: {rule}（{path}）` で `notes` に足す
      14. 文書を足すごとに結果の文字数（抜粋は各行の `{行番号}:{行}` の文字数）を数え、`max_chars` を超える文書の手前で止める。止めたら `truncated` を `True` にし、`notes` に打ち切ったことと、`cursor` で続きを取るか `fields` を絞るか `view: ids` で取り直すことを足す
      15. 返していない文書が残れば、続きの位置を作る（`next_cursor`）
      16. `sections`・`lines` が無い場合、本文を返した文書（`SEEN_MARK` にしたものを除く）を会話の記録に `body` で残す（会話キーは `session_id`・`agent_id`）
      17. 検索の結果を返す
    exceptions:
      - name: SourceNotReadableError
        condition: 読む場所の解決が送る
        message: '`{id} はこの作業場所（{cwd}）から読めません`'
      - name: SourceNotServedError
        condition: 読む場所の解決が送る
        message: '`{id} は配信していません`'
      - name: WorktreeNotMatchedError
        condition: 読む場所の解決が送る
        message: '`{worktree} は {id} のワークツリーに当たりません`'
      - name: RefNotFoundError
        condition: 文書のストアが送る
        message: '`ref {value} を解決できません`'
      - name: InvalidArgumentError
        condition: '知らない項目・型の合わない値・読めない `cursor`・`limit` が 1 未満・束のキーが 1 つでない・`@matches` を条件に使う・`sections` と `lines` を同時に渡す・`view: full` 以外で `sections`・`lines` を渡す'
        message: '`引数が正しくありません: {違反の数} 件`'
    unit_tests:
      - name: test_search_docs
        case: 正常
        summary: 作業中の配信元の一覧
        condition: '`cwd` が sample のクローンで、引数なし'
        mock: なし（一時フォルダの配信元）
        expected: '`total_count` が 2、`items` の `values` が `SUMMARY_FIELDS`、`id` の昇順'
      - name: test_search_docs_when_full_and_seen
        case: 正常
        summary: 本文と返し済み
        condition: '`view: full`・`session_id` ありで 2 回、3 回目は `repeat_seen: true`'
        mock: なし
        expected: 1 回目と 3 回目は本文で `scope` が `full`、2 回目は `SEEN_MARK` で `path`・`scope` が `None`
      - name: test_search_docs_when_count_grouped
        case: 正常
        summary: 件数と集計
        condition: '`view: count`・`group_by: tags`（`[a, b]`・`[a]`・無し）'
        mock: なし
        expected: '`items` が空、`groups` が `a: 2`・`b: 1`・`（なし）: 1`'
      - name: test_search_docs_when_limited
        case: 正常
        summary: 上限と打ち切りと続き
        condition: '`limit: 150` と、本文が 9,000 文字の文書 5 件を `view: full`・`max_chars: 20000`'
        mock: なし
        expected: '`notes` に 100 に丸めたこと、`returned` が 2、`truncated` が `True`、`next_cursor` で残りの 3 件のうち 2 件が返る'
      - name: test_search_docs_when_order_by_dates
        case: 正常
        summary: 日時の空は末尾
        condition: '`order_by: [{field: updated, direction: desc}]` で `updated` が無い文書を含む'
        mock: なし
        expected: 日時の降順の後ろに `updated` の無い文書
      - name: test_search_docs_when_unreadable_file
        case: 正常
        summary: 読めないファイル
        condition: 壊れた YAML を 1 つ含む配信元
        mock: なし
        expected: 残りの文書を返し、`notes` に壊れたファイルのパス
      - name: test_search_docs_when_read_validator
        case: 正常
        summary: 読み取りの検査の警告
        condition: '`on: [read]` の検査が違反を 1 件出す'
        mock: なし
        expected: 文書を返し、`notes` に違反
      - name: test_search_docs_when_unknown_field
        case: 異常
        summary: 知らない項目
        condition: '`{field: nmae, op: eq, values: [x]}`'
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `filter.field`、`fix` に `name`'
        exception: 知らない項目
      - name: test_search_docs_when_sources_all
        case: 正常
        summary: 全ての配信元
        condition: '`source: "*"` で、sample と notes は読め、other は読めない'
        mock: なし
        expected: '`per_source` が sample と notes だけで、`items` に `source` がある'
      - name: test_search_docs_when_id_values
        case: 正常
        summary: '`id` の `eq` の `values` の順'
        condition: '`order_by` なしで `filter: {field: id, op: eq, values: [b, a]}`'
        mock: なし
        expected: '`items` の `id` が `b`・`a` の順'
      - name: test_search_docs_when_id_values_and_order_by
        case: 正常
        summary: '`order_by` を明示した `id` の `eq`'
        condition: '`order_by: [{field: id}]` と `filter: {field: id, op: eq, values: [b, a]}`'
        mock: なし
        expected: '`items` の `id` が `a`・`b` の順'
      - name: test_search_docs_when_location
        case: 正常
        summary: 文書の場所と範囲
        condition: '同じ配信元を `view: full`、`view: full`・`max_chars_per_field: 10`、`snippets` あり、`view: summary`、`view: ids`、`ref: HEAD` で呼ぶ。`body_file` の無い `records` の要素を含む'
        mock: なし（一時フォルダの git リポジトリ）
        expected: '`path` が文書の絶対パスで、`scope` が順に `full`（`records` の要素は `section`）・`section`・`section`・`summary`。`ids` と `ref` では `path`・`scope` が `None`'
        exception: '-'
      - name: test_search_docs_when_snippets_regex
        case: 正常
        summary: 正規表現で当てた文書の抜粋
        condition: '本文の 2 行目が `# TODO x` の文書に `filter: {field: body, op: regex, values: ["^#\\s*TODO"]}`、`snippets: {before: 0, after: 0}`'
        mock: なし
        expected: '`items[0].snippets` が 1 つで、行が `(2, "# TODO x", True)`'
        exception: '-'
      - name: test_search_docs_when_ordered_by_matches
        case: 正常
        summary: 当たった数で並べる
        condition: '`notes/a.md`（`検索` を含む行が 3 行）・`notes/b.md`（同 1 行）・`notes/archive/c.md`（同 2 行）に、`filter: {and: [{field: body, op: contains, values: [検索]}, {not: {field: "@path", op: glob, values: ["notes/archive/**"]}}]}`・`fields: ["@matches"]`・`order_by: [{field: "@matches", direction: desc}]`'
        mock: なし
        expected: '`items` が `notes/a`（`values["@matches"]` が 3）・`notes/b`（同 1）の順。`fields` に `@matches` を渡さない呼び出しの `values` は `@matches` を持たない'
      - name: test_search_docs_when_matches_under_not
        case: 正常
        summary: '`not` の下の本文の条件は数えない'
        condition: '同じ 3 件に `filter: {not: {and: [{field: body, op: contains, values: [検索]}, {field: tags, op: eq, values: [x]}]}}`・`fields: ["@matches"]`（`a` だけがタグ `x`）'
        mock: なし
        expected: '`items` が `b`・`c` で、`values["@matches"]` がどちらも 0'
      - name: test_search_docs_when_part_of_body
        case: 正常
        summary: 本文の一部と返し済み
        condition: '10 行の `notes/a.md`（6 行目 `## 決まったこと`、9 行目 `## 残り`）を `session_id: s1`・`view: full` で、`sections: [決まったこと]`、`lines: {offset: 3, limit: 2}`、どちらも無し、もう一度 `sections: [決まったこと]` の順に呼ぶ'
        mock: なし
        expected: '1 回目は `body` が 6〜8 行目で `scope` が `section`、`ranges` が `[BodyRange(6, 8)]`、`total_lines` が 10。2 回目は `ranges` が `[BodyRange(3, 4)]`。3 回目は全文を `scope: full` で返し `SEEN_MARK` にならず、`ranges`・`total_lines` が `None`。4 回目は返し済みでも 6〜8 行目を返す'
      - name: test_search_docs_when_part_of_body_with_snippets
        case: 正常
        summary: 切り出した範囲の抜粋と当たる見出しの無い文書
        condition: '同じ文書（7 行目と 2 行目に `検索`）に `filter: {field: body, op: contains, values: [検索]}`・`sections: [決まったこと]`・`snippets: {context_lines: 0}` と、YAML の文書と、`body_file` が `.md` を指す文書に `sections: [無い見出し]`'
        mock: なし
        expected: 1 つ目は抜粋が行番号 7 の 1 行だけ。2 つ目はどちらも `body` が空で `ranges` が `[]`、`notes` に YAML の文書と当たる見出しが無いことの 2 行
      - name: test_search_docs_when_grouped_normalized
        case: 正常
        summary: 表記だけが違う値をまとめる
        condition: '`view: count`・`group_by: tags`（`[mcp]`・`[MCP, mcp, 設計]`・`[ｍｃｐ]`）'
        mock: なし
        expected: '`groups` が `mcp: 3`・`設計: 1` だけ'
        exception: '-'
      - name: test_search_docs_when_grouped_tie
        case: 正常
        summary: 表記の文書の数が同じ
        condition: '`view: count`・`group_by: status`（`Draft`・`draft`）'
        mock: なし
        expected: '`groups` が `Draft: 2` だけ（値の昇順で先の表記）'
        exception: '-'
      - name: test_search_docs_when_term
        case: 正常
        summary: 用語で引く
        condition: '`alias_type: term` の行の「作業範囲」（`aliases: [scope, 担当範囲]`）を持つ配信元に `term: 担当範囲`、`term: SCOPE`、`term: 担当` と、`alias_type` の行が無い配信元に `term: 担当範囲`'
        mock: なし（一時フォルダの配信元）
        expected: 1 つ目と 2 つ目は作業範囲だけ、3 つ目は 0 件、4 つ目は 0 件で `notes` に `alias_type を持つ documents の行が無い` ことがある
        exception: '-'
  - name: render_search_markdown
    title: 検索の結果の Markdown
    kind: 関数
    container: features/search/render.py
    usecase: 検索
    role: 変換
    summary: '`format: markdown` の本文を作る'
    scope: public
    thread_safe: true
    args:
      - name: result
        title: 検索の結果
        type: SearchResult
        required: true
        passing: positional
        description: 描く結果
      - name: source_label
        title: 配信元の表示
        type: str
        required: true
        passing: keyword
        description: 先頭の行に出す配信元の ID（複数なら `,` で繋ぐ）
    returns:
      type: str
      description: Markdown
    process: |-
      1. `outside_scope` が `True` なら先頭に `作業範囲の外（参考）` の行を置く
      2. 次の行に `{配信元}: 該当 {total_count} 件・返した {returned} 件` を置く（複数の配信元は配信元ごとの件数も添える）
      3. `groups` があれば `| 値 | 件数 |` の表を置く
      4. `view` が `full` の場合、文書ごとに `<document path="{path}" scope="{scope}">`（`path` が `None` なら属性の無い `<document>`。`outside_scope` が `True` なら `outside_scope="true"` の属性を加える）と `</document>` で包み、中に項目の箇条書きと本文を置く。`total_lines` を持つ文書は、`<document>` の前の行に `{id}: {start_line}-{end_line} 行目 / 全 {total_lines} 行` を置く（範囲が複数なら `{start_line}-{end_line} 行目` を `・` で並べ、空なら `{id}: 返す行なし / 全 {total_lines} 行`）。抜粋は、当たった行を `{行番号}:{行}`、前後の行を `{行番号}-{行}` で出し、抜粋の間に `--` の行を置く。それ以外は項目を列にした表にする（列名は項目の名前。`@chars` は `chars`）
      5. `notes` があれば末尾に `> ` の行で並べ、`next_cursor` があれば `続き: cursor={next_cursor}` を置く
    unit_tests:
      - name: test_render_search_markdown
        case: 正常
        summary: 一覧の表
        condition: '`view: summary` の 2 件'
        mock: なし
        expected: '`sample: 該当 2 件・返した 2 件` の行と、`| id | kind | name | description | chars | version |` の表'
      - name: test_render_search_markdown_when_full
        case: 正常
        summary: 場所と範囲を属性にする
        condition: '`view: full` で `path`・`scope: full` を持つ項目と、`path` が `None` の項目'
        mock: なし
        expected: 1 件目が `<document path="{path}" scope="full">`、2 件目が属性の無い `<document>` で包まれる
        exception: '-'
      - name: test_render_search_markdown_when_snippets
        case: 正常
        summary: 抜粋の書式
        condition: '`view: full` で抜粋 2 つ（`(3, "## a", True)`・`(4, "b", False)` と `(9, "## c", True)`）を持つ項目'
        mock: なし
        expected: '`<document>` の中に `3:## a`・`4-b`・`--`・`9:## c` の順の行'
        exception: '-'
      - name: test_render_search_markdown_when_ranges
        case: 正常
        summary: 切り出した範囲の行
        condition: '`view: full` で `ranges: [BodyRange(6, 8)]`・`total_lines: 10` の `notes/a` と、`ranges: [BodyRange(1, 2), BodyRange(5, 5)]`・`total_lines: 5` の `notes/b`'
        mock: なし
        expected: '`<document` の前の行が `notes/a: 6-8 行目 / 全 10 行` と `notes/b: 1-2 行目・5-5 行目 / 全 5 行`'
      - name: test_render_search_markdown_when_outside_scope
        case: 正常
        summary: 作業範囲の外の表示
        condition: '`outside_scope: true` の `view: full` の結果'
        mock: なし
        expected: 先頭の行が `作業範囲の外（参考）`、`<document>` に `outside_scope="true"`
        exception: '-'
  - name: compile_regex
    title: 正規表現の組み立て
    kind: 関数
    container: features/search/filters.py
    usecase: 検索
    role: 変換
    summary: '`regex` の値を、各行に当たる正規表現にする'
    scope: public
    thread_safe: true
    args:
      - name: value
        title: 値
        type: str
        required: true
        passing: positional
        description: 条件の `values` の 1 つ
      - name: case_sensitive
        title: 区別するか
        type: bool
        required: true
        passing: keyword
        description: 条件の `case_sensitive`
    returns:
      type: re.Pattern[str]
      description: コンパイルした正規表現
    process: 1. フラグを `re.MULTILINE` にし、`case_sensitive` が `False` なら `re.IGNORECASE` を加えて `re.compile(value, flags)` を返す（`re.error` はそのまま送る）
    exceptions:
      - name: re.error
        condition: 正規表現にならない値
        message: '`re` の既定'
    unit_tests:
      - name: test_compile_regex
        case: 正常
        summary: 各行と大文字小文字
        condition: '`compile_regex("^b", case_sensitive=False)` と `compile_regex("^B", case_sensitive=True)` を `a\nb` に `search`'
        mock: なし
        expected: 1 つ目が当たり、2 つ目は当たらない
  - name: find_snippets
    title: 抜粋の検索
    kind: 関数
    container: features/search/snippets.py
    usecase: 共通
    role: 変換
    summary: 本文から条件に当たる行と前後の行を、行番号つきの抜粋にする
    scope: public
    thread_safe: true
    args:
      - name: text
        title: 本文
        type: str
        required: true
        passing: positional
        description: 抜き出す元
      - name: conditions
        title: 条件
        type: Sequence[Condition]
        required: true
        passing: positional
        description: 抜粋を探す条件
      - name: before
        title: 前の行数
        type: int
        required: true
        passing: keyword
        description: 当たった行の前に添える行数
      - name: after
        title: 後ろの行数
        type: int
        required: true
        passing: keyword
        description: 当たった行の後ろに添える行数
      - name: max_count
        title: 抜粋の数
        type: int
        required: true
        passing: keyword
        description: 返す抜粋の上限
      - name: ranges
        title: 探す範囲
        type: Sequence[BodyRange] | None
        required: false
        default: None
        passing: keyword
        description: '`sections`・`lines` で切り出した範囲。`None` は本文の全文'
    returns:
      type: list[Snippet]
      description: 本文の先頭からの抜粋。重なる範囲は 1 つにまとめる
    process: |-
      1. 本文を行の分割で行に分ける。行番号は 1 始まり
      2. 当たった行を集める（当たった行の数と共通の内部の関数 `_hit_lines`）
         - `regex` は正規表現の組み立てで本文全体に `finditer` をかけ、当たった範囲の始まりの行から終わりの行までを当たった行にする。`case_sensitive` が `False` なら行ごとに NFKC をした本文にかける
         - `eq`・`prefix`・`suffix`・`contains` は値を含む行（`case_sensitive` が `False` なら行と値に NFKC と `casefold`）
         - それ以外の `op` は飛ばす
      3. `ranges` がある場合、どれかの範囲の中の当たった行だけを残す
      4. 当たった行ごとに前 `before`・後ろ `after` の範囲を作る。`ranges` がある場合は、その行を含む範囲の中に切り詰める
      5. 重なる範囲をまとめ、先頭から `max_count` 個を `Snippet` にして返す（`hit` は当たった行か。行番号は本文の行番号）
    unit_tests:
      - name: test_find_snippets
        case: 正常
        summary: 正規表現は行の頭に当たる
        condition: '3 行目が `## 手順`、8 行目が `a ## b` の本文に `{field: body, op: regex, values: ["^## "]}`、`before=0`・`after=1`・`max_count=3`'
        mock: なし
        expected: 1 つの抜粋で、行が `(3, "## 手順", True)`・`(4, …, False)`
      - name: test_find_snippets_when_anchor
        case: 正常
        summary: 値全体の先頭
        condition: '1 行目・3 行目が空白で始まらない本文に `{field: body, op: regex, values: ["\\A\\S"]}`、`before=0`・`after=0`'
        mock: なし
        expected: 行番号 1 の抜粋だけ
      - name: test_find_snippets_when_overlap
        case: 正常
        summary: 重なりと上限
        condition: '10 行のうち 3・4・9 行目に `foo` の本文に `{field: body, op: contains, values: [ＦＯＯ]}`、`before=1`・`after=1`・`max_count=1`'
        mock: なし
        expected: 2〜5 行目の 1 つの抜粋で、`hit` が 3・4 行目だけ `True`
      - name: test_find_snippets_when_trailing_newline
        case: 正常
        summary: 末尾の改行と CRLF
        condition: 本文 `a\r\nfoo\r\n` に `contains` の `foo`、`before=0`・`after=5`
        mock: なし
        expected: 行が `(2, "foo", True)` だけ
      - name: test_find_snippets_when_ranges
        case: 正常
        summary: 切り出した範囲の中だけ
        condition: 10 行のうち 2・7 行目に `foo` の本文に `contains` の `foo`、`before=2`・`after=2`、`ranges=[BodyRange(6, 8)]`
        mock: なし
        expected: 1 つの抜粋で、行番号が 6・7・8（2 行目と範囲の外の 5・9 行目を含まない）
  - name: split_lines
    title: 行の分割
    kind: 関数
    container: features/search/snippets.py
    usecase: 検索
    role: 変換
    summary: 本文を行に分ける（抜粋・当たった行の数・本文の切り出しが同じ行番号を使う）
    description: 今の `_split_lines` を公開にする。`str.splitlines` は `\n` 以外の区切りでも分けて行番号がずれるので使わない。
    scope: public
    thread_safe: true
    args:
      - name: text
        title: 本文
        type: str
        required: true
        passing: positional
        description: 分ける本文
    returns:
      type: list[str]
      description: 行の並び（改行を含まない）
    process: |-
      1. `\n` で分け、行末の `\r` を除く
      2. 本文が改行で終わる場合、最後の空の要素を除く
    status: planned
  - name: count_matches
    title: 当たった行の数
    kind: 関数
    container: features/search/snippets.py
    usecase: 検索
    role: 判定
    summary: 本文のうち、条件のどれかに当たった行の数を返す（`@matches`）
    scope: public
    thread_safe: true
    args:
      - name: text
        title: 本文
        type: str
        required: true
        passing: positional
        description: 数える本文の全文
      - name: conditions
        title: 条件
        type: Sequence[Condition]
        required: true
        passing: positional
        description: '`not` の下を除いた `body`・`*` の条件'
    returns:
      type: int
      description: 当たった行の数。条件が空なら 0
    process: 1. 本文を行の分割で分け、抜粋の検索と同じ `_hit_lines` で当たった行を集め、その数を返す（同じ行が複数の条件に当たっても 1 と数える）
    unit_tests:
      - name: test_count_matches
        case: 正常
        summary: 行の数と重なり
        condition: 1・3・4 行目に `検索` を含み、4 行目は `^#` にも当たる本文に、`contains` の `検索` と `regex` の `^#`（4 行目だけが `#` で始まる）
        mock: なし
        expected: '3'
      - name: test_count_matches_when_no_conditions
        case: 正常
        summary: 条件が無い
        condition: 任意の本文と空の条件
        mock: なし
        expected: '0'
    status: planned
  - name: heading_lines
    title: 見出しの行
    kind: 関数
    container: features/search/fields.py
    usecase: 検索
    role: 読み取り
    summary: Markdown の行の並びから、見出しの行番号・階層・文字列を集める（コードブロックの中は除く）
    description: '`@sections` の見出しの文字列（内部の `_headings`）もこの関数で作る。`HEADING` は `#` の並びを名前つきのグループで取り、階層にする。'
    scope: public
    thread_safe: true
    args:
      - name: lines
        title: 行
        type: Sequence[str]
        required: true
        passing: positional
        description: 本文の行の並び
    returns:
      type: list[Heading]
      description: 本文の先頭からの見出し
    process: |-
      1. 行を先頭からたどり、`FENCE` に当たる行でコードブロックの内外を切り替える
      2. コードブロックの外で `HEADING` に当たる行を、行番号（1 始まり）・`#` の数・見出しの文字列の `Heading` にする
    unit_tests:
      - name: test_heading_lines
        case: 正常
        summary: 階層とコードブロック
        condition: '`["# a", "", "## b ##", "```", "## c", "```", "### d"]`'
        mock: なし
        expected: '`Heading(1, 1, "a")`・`Heading(3, 2, "b")`・`Heading(7, 3, "d")`（`c` を含まない）'
    status: planned
  - name: select_ranges
    title: 本文の範囲の選択
    kind: 関数
    container: features/search/body_parts.py
    usecase: 検索
    role: 変換
    summary: '`sections`・`lines` から、本文の切り出す行の範囲を決める'
    scope: public
    thread_safe: true
    args:
      - name: lines
        title: 行
        type: Sequence[str]
        required: true
        passing: positional
        description: 本文の行の並び（行の分割の結果）
      - name: sections
        title: 返す節
        type: Sequence[str] | None
        required: true
        passing: keyword
        description: 要求の `sections`。Markdown の文書のときだけ渡す
      - name: line_range
        title: 返す行
        type: LineRange | None
        required: true
        passing: keyword
        description: 要求の `lines`
    returns:
      type: list[BodyRange]
      description: 本文の先頭からの、重ならない範囲。当たるものが無ければ空
    process: |-
      1. `sections` がある場合、見出しの行を引き、文字列が `sections` のどれかと完全一致する見出しごとに、見出しの行から、次の同じか上の階層の見出しの前の行（無ければ本文の最後の行）までを範囲にする
      2. `line_range` がある場合、`offset` から `limit` 行（`None` なら本文の最後の行）までを、本文の行数で切り詰めて範囲にする。`offset` が行数を超えれば空
      3. 始まりの行の順に並べ、重なる範囲（親と子の節を両方渡したときなど）を 1 つにまとめて返す
    unit_tests:
      - name: test_select_ranges_when_sections
        case: 正常
        summary: 節の範囲
        condition: 1 行目 `# a`、3 行目 `## 経緯`、6 行目 `## 決まったこと`、7 行目 `### 細目`、9 行目 `## 残り` の 10 行に、`sections=["決まったこと", "細目"]`
        mock: なし
        expected: '`[BodyRange(6, 8)]`（子の `細目` は親の範囲にまとめる）'
      - name: test_select_ranges_when_lines
        case: 正常
        summary: 行の範囲と末尾
        condition: 10 行に `LineRange(offset=3, limit=2)`、`LineRange(offset=8)`、`LineRange(offset=11)`
        mock: なし
        expected: '`[BodyRange(3, 4)]`・`[BodyRange(8, 10)]`・`[]`'
      - name: test_select_ranges_when_no_heading
        case: 正常
        summary: 当たる見出しが無い
        condition: '`sections=["無い見出し"]`'
        mock: なし
        expected: '`[]`'
    status: planned
  - name: join_ranges
    title: 範囲の本文
    kind: 関数
    container: features/search/body_parts.py
    usecase: 検索
    role: 変換
    summary: 範囲の行をつないだ本文を作る
    scope: public
    thread_safe: true
    args:
      - name: lines
        title: 行
        type: Sequence[str]
        required: true
        passing: positional
        description: 本文の行の並び
      - name: ranges
        title: 範囲
        type: Sequence[BodyRange]
        required: true
        passing: positional
        description: 本文の範囲の選択の結果
    returns:
      type: str
      description: 範囲の行を先頭から `\n` でつないだ文字列。範囲が空なら空文字
    process: 1. 範囲ごとに `start_line`〜`end_line` の行を取り出し、全ての行を `\n` でつなぐ
    unit_tests:
      - name: test_join_ranges
        case: 正常
        summary: 複数の範囲
        condition: '`["a", "b", "c", "d"]` に `[BodyRange(1, 1), BodyRange(3, 4)]`'
        mock: なし
        expected: '`"a\nc\nd"`'
    status: planned
  - name: list_match_words
    title: 用語の一覧
    kind: 関数
    container: features/search/terms.py
    usecase: 用語の一覧
    role: サービス
    summary: '`alias_type` を持つ行の文書から、照合する語を指す文書の ID とともに返す'
    scope: public
    thread_safe: true
    args:
      - name: request
        title: 用語の一覧の要求
        type: MatchWordsRequest
        required: true
        passing: positional
        description: ツールの引数
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 配信中の配信元
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: 文書を読む
    returns:
      type: MatchWordsResult
      description: 照合する語の並び
    process: |-
      1. 読む場所を解く（読む場所の解決。`source`・`worktree`・`cwd`）
      2. 文書を集める（文書のストア.文書を集める）
      3. エイリアスの集め（文書のストア）をし、`entries` で照合する語の一覧を作って返す（`alias_type` を持つ行が無い配信元は空）
    exceptions:
      - name: SourceNotReadableError
        condition: 読む場所の解決が送る
        message: '`{id} はこの作業場所（{cwd}）から読めません`'
      - name: SourceNotServedError
        condition: 読む場所の解決が送る
        message: '`{id} は配信していません`'
    unit_tests:
      - name: test_list_match_words
        case: 正常
        summary: 用語の語と違反した文書の除外
        condition: '「作業範囲」（`aliases: [scope, 担当範囲]`）と「壊れた用語」（`aliases: 3`）を持つ sample'
        mock: なし（一時フォルダの配信元）
        expected: '`words` が `作業範囲`・`scope`・`担当範囲` の 3 件で、壊れた用語の語が無い'
        exception: '-'
      - name: test_list_match_words_when_no_alias_rows
        case: 正常
        summary: 用語の種類が無い
        condition: '`alias_type` を持つ行が無い配信元'
        mock: なし（一時フォルダの配信元）
        expected: '`words` が空'
        exception: '-'
  - name: render_match_words_markdown
    title: 用語の一覧の文
    kind: 関数
    container: features/search/terms.py
    usecase: 用語の一覧
    role: 表示
    summary: 用語の一覧の結果を `| 語 | 文書 | 種類 |` の表にする
    scope: public
    thread_safe: true
    args:
      - name: result
        title: 用語の一覧の結果
        type: MatchWordsResult
        required: true
        passing: positional
        description: 用語の一覧の戻り値
    returns:
      type: str
      description: Markdown。語が無ければ `用語はありません`
    process: |-
      1. 語が無ければ `用語はありません` を返す
      2. `| 語 | 文書 | 種類 |` の表に語ごとの行を並べて返す
    unit_tests:
      - name: test_render_match_words_markdown
        case: 正常
        summary: 表と空
        condition: 語 3 件と、空の結果
        mock: なし
        expected: インターフェース定義の返り値例と同じ表と、`用語はありません`
