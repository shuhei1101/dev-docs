title: "開発ドキュメントサーバー / 検索"
lead: |-
  `search_docs` の処理。条件の木で文書を絞り、並べ替え・集計・量の上限をかけて、指定した項目だけを返す。
  語で探す部分（`match_words`・`snippet_lines`）は画面の検索も使う。
directory: |-
  ```text
  src/dev_docs/features/search/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ types.py      # Condition / Group / OrderKey / Snippets / SearchRequest / Snippet / SnippetLine / SearchItem / GroupCount / SearchResult
  ├─ fields.py     # field_values / known_fields（項目の値・計算項目・使える項目）
  ├─ filters.py    # check_filter / match_filter / match_words / compile_regex / parse_compare_value
  ├─ snippets.py   # find_snippets / snippet_lines（抜粋の検索・一致した箇所の抜き出し）
  ├─ cursor.py     # encode_cursor / decode_cursor
  ├─ render.py     # render_search_markdown
  └─ service.py    # search_docs
  ```
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        文書の検索 ..> 読む場所の解決
        文書の検索 ..> 文書を集める
        文書の検索 ..> 条件の確かめ
        文書の検索 ..> 条件の照合
        文書の検索 ..> 続きの位置
        文書の検索 ..> 文書の検査 : on read
        文書の検索 ..> 会話の記録 : 返し済み
        文書の検索 ..> 検索の結果 : 返す
        条件の確かめ ..> 使える項目
        条件の照合 ..> 項目の値
        条件の照合 ..> 比べる値の解釈
        条件の照合 ..> 正規表現の組み立て
        条件の確かめ ..> 正規表現の組み立て
        文書の検索 ..> 抜粋の検索
        抜粋の検索 ..> 正規表現の組み立て
        一致した箇所の抜き出し ..> 抜粋の検索
        検索の結果の Markdown ..> 検索の結果
        class 文書の検索 {
          <<function>>
        }
        class 読む場所の解決 {
