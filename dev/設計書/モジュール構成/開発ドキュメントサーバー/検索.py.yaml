    returns:
      type: bool
      description: 全ての語が `*` の値か ID のどれかに含まれるか
    process: 1. `*` の値と ID を NFKC と `casefold` をして改行で繋ぎ、全ての語を含むかを返す
  - name: snippet_lines
    title: 一致した箇所の抜き出し
    kind: 関数
    container: features/search/snippets.py
    usecase: 共通
    role: 変換
    summary: 本文から語を含む行と前後の行を抜き出す（画面の検索）
    scope: public
    thread_safe: true
    args:
      - name: text
        title: 本文
        type: str
        required: true
        passing: positional
        description: 抜き出す元
      - name: words
        title: 語
        type: Sequence[str]
        required: true
        passing: positional
        description: NFKC と `casefold` をした語
      - name: context_lines
        title: 前後の行数
        type: int
        required: true
        passing: keyword
        description: 添える行数
      - name: max_count
        title: 箇所の数
        type: int
        required: true
