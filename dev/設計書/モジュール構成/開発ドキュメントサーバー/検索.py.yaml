      - name: fingerprint
        title: 要求の指紋
        type: str
        required: true
        passing: positional
        description: '`cursor`・`limit`・`max_chars` を除いた要求の値のハッシュ'
    returns:
      type: str
      description: '`{"o": offset, "f": fingerprint}` の JSON を URL セーフの Base64 にしたもの'
    process: 1. JSON にして Base64 にする
  - name: decode_cursor
    title: 続きの位置を読む
    kind: 関数
    container: features/search/cursor.py
    usecase: 共通
    role: 検証
    summary: '`cursor` から位置を取り出し、要求が前回と同じかを確かめる'
    scope: public
    thread_safe: true
    args:
      - name: cursor
        title: 続きの位置
        type: str
        required: true
        passing: positional
        description: 前回の `next_cursor`
      - name: fingerprint
        title: 要求の指紋
        type: str
        required: true
        passing: positional
        description: 今回の要求の指紋
    returns:
      type: int
      description: 位置
    process: |-
      1. Base64 と JSON を読む。読めない場合、`InvalidArgumentError`（`cursor` を読めません）を送る
      2. 指紋が違う場合、`InvalidArgumentError`（`cursor` は前回と同じ引数で渡してください）を送る
    exceptions:
      - name: InvalidArgumentError
        condition: 読めない・前回と引数が違う
        message: '`cursor は前回と同じ引数で渡してください`'
    unit_tests:
      - name: test_decode_cursor
        case: 正常
        summary: 往復
        condition: '`encode_cursor(40, "f1")` を `"f1"` で読む'
        mock: なし
        expected: '40'
      - name: test_decode_cursor_when_other_request
        case: 異常
        summary: 引数が違う
        condition: 同じ `cursor` を `"f2"` で読む
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `cursor`'
        exception: 前回と引数が違う
  - name: search_docs
    title: 文書の検索
    kind: 関数
    container: features/search/service.py
    usecase: 検索
    role: サービス
    summary: '`search_docs` の要求を処理して検索の結果を返す'
    scope: public
    thread_safe: true
    side_effects: 本文を返した文書を会話の記録に残す。読み取りの `validators[]` を動かす
    args:
      - name: request
        title: 検索の要求
        type: SearchRequest
        required: true
        passing: positional
        description: ツールの引数
      - name: registry
        title: 配信元の一覧
        type: SourceRegistry
        required: true
        passing: injected
        description: 配信中の配信元
      - name: store
        title: 文書のストア
        type: DocumentStore
        required: true
        passing: injected
        description: 文書を読む
      - name: checker
        title: 文書の検査
        type: DocumentChecker
        required: true
        passing: injected
        description: 読み取りの `validators[]`
      - name: seen
        title: 会話の記録
        type: SeenStore
        required: true
        passing: injected
        description: 返し済みの省略と記録
      - name: today
        title: 今日
        type: date | None
        required: false
        default: None
        passing: keyword
        description: テスト用。`None` は今日（ローカル）
    returns:
      type: SearchResult
      description: 検索の結果
    process: |-
      1. 読む場所を解く（読む場所の解決。`source`・`ref`・`worktree`・`cwd`）
      2. 場所ごとに文書を集める（文書のストア.文書を集める）。`problems` は `notes` に `{path} を読めないので除きました（{detail}）` で足す
      3. 集めた種類のスキーマで使える項目を作り、条件の確かめをする
         - 違反がある場合、違反と `describe(source, kind)` でスキーマを見ることを添えた `InvalidArgumentError` を送る
      4. `limit` が `LIMIT_MAX` を超えれば丸め、`max_chars` が `MAX_CHARS_LIMIT` を超えれば丸めて、それぞれ `notes` で知らせる。`limit` が 1 未満なら `InvalidArgumentError` を送る
      5. 条件の照合で当たった文書を集め、`total_count` と（複数の配信元なら）`per_source` を数える。読んだ配信元の ID を `,` で繋いで `source_label` にする
      6. `group_by` がある場合、当たった文書の値ごとの件数を `groups` にする（配列は要素ごとに数え、値が無い文書は `（なし）`）
      7. `view` が `count` の場合、ここで返す
      8. `order_by` のキーの順に並べる（`order_by` が `None` なら `id` の昇順。日時の項目の空と値が無い文書は向きによらず末尾。同じ順位は配信元の順・`id` の昇順）。`order_by` が `None` で、`filter` が `id` の `eq` の条件 1 つのときは、その `values` の順に並べる
      9. 始まりの位置を `skip` と、`cursor` があれば続きの位置を読む（指紋は要求のハッシュ）の和にし、`limit` 件を取り出す
      10. 文書ごとに返す項目を作る
          - `ids` は `id`、`summary` は `id` と `SUMMARY_FIELDS`、`full` はさらに `body` と全てのメタデータ。`fields` を足し `exclude_fields` を除く
          - 本文を返す場合、`repeat_seen` が `False` なら会話の記録.返し済みに当たる文書の `body` を `SEEN_MARK` にする
          - `snippets` がある場合、条件の木から `field` が `body`・`*` の条件を集めて抜粋の検索をし（`before`・`after` は `None` なら `context_lines`、`max_count` は `max_per_doc`）、`body` を返さない
          - 文字列の値が項目の文字数を超えたら切る
          - `view` が `summary`・`full` で `ref` が無く、`body` を `SEEN_MARK` にしていない場合、`path` を文書の場所（文書のストア.文書の場所）にし、`scope` を次のとおり決める。`body` を返さない（`snippets` も無い）なら `summary`、`snippets` を返すか `body` を切ったか `records` の要素で `body_path` が無いなら `section`、それ以外は `full`
      11. 返した文書を順に読み取りの検査（文書の検査.検査する、`on="read"`）にかけ、違反を `{id}: {rule}（{path}）` で `notes` に足す
      12. 文書を足すごとに結果の文字数（抜粋は各行の `{行番号}:{行}` の文字数）を数え、`max_chars` を超える文書の手前で止める。止めたら `truncated` を `True` にし、`notes` に打ち切ったことと、`cursor` で続きを取るか `fields` を絞るか `view: ids` で取り直すことを足す
      13. 返していない文書が残れば、続きの位置を作る（`next_cursor`）
      14. 本文を返した文書（`SEEN_MARK` にしたものを除く）を会話の記録に `body` で残す（会話キーは `session_id`・`agent_id`）
      15. 検索の結果を返す
    exceptions:
      - name: SourceNotReadableError
        condition: 読む場所の解決が送る
        message: '`{id} はこの作業場所（{cwd}）から読めません`'
      - name: SourceNotServedError
        condition: 読む場所の解決が送る
        message: '`{id} は配信していません`'
      - name: WorktreeNotMatchedError
        condition: 読む場所の解決が送る
        message: '`{worktree} は {id} のワークツリーに当たりません`'
      - name: RefNotFoundError
        condition: 文書のストアが送る
        message: '`ref {value} を解決できません`'
      - name: InvalidArgumentError
        condition: 知らない項目・型の合わない値・読めない `cursor`・`limit` が 1 未満
        message: '`引数が正しくありません: {違反の数} 件`'
    unit_tests:
      - name: test_search_docs
        case: 正常
        summary: 作業中の配信元の一覧
        condition: '`cwd` が sample のクローンで、引数なし'
        mock: なし（一時フォルダの配信元）
        expected: '`total_count` が 2、`items` の `values` が `SUMMARY_FIELDS`、`id` の昇順'
      - name: test_search_docs_when_full_and_seen
        case: 正常
        summary: 本文と返し済み
        condition: '`view: full`・`session_id` ありで 2 回、3 回目は `repeat_seen: true`'
        mock: なし
        expected: 1 回目と 3 回目は本文で `scope` が `full`、2 回目は `SEEN_MARK` で `path`・`scope` が `None`
      - name: test_search_docs_when_count_grouped
        case: 正常
        summary: 件数と集計
        condition: '`view: count`・`group_by: tags`（`[a, b]`・`[a]`・無し）'
        mock: なし
        expected: '`items` が空、`groups` が `a: 2`・`b: 1`・`（なし）: 1`'
      - name: test_search_docs_when_limited
        case: 正常
        summary: 上限と打ち切りと続き
        condition: '`limit: 150` と、本文が 9,000 文字の文書 5 件を `view: full`・`max_chars: 20000`'
        mock: なし
        expected: '`notes` に 100 に丸めたこと、`returned` が 2、`truncated` が `True`、`next_cursor` で残りの 3 件のうち 2 件が返る'
      - name: test_search_docs_when_order_by_dates
        case: 正常
        summary: 日時の空は末尾
        condition: '`order_by: [{field: updated, direction: desc}]` で `updated` が無い文書を含む'
        mock: なし
        expected: 日時の降順の後ろに `updated` の無い文書
      - name: test_search_docs_when_unreadable_file
        case: 正常
        summary: 読めないファイル
        condition: 壊れた YAML を 1 つ含む配信元
        mock: なし
        expected: 残りの文書を返し、`notes` に壊れたファイルのパス
      - name: test_search_docs_when_read_validator
        case: 正常
        summary: 読み取りの検査の警告
        condition: '`on: [read]` の検査が違反を 1 件出す'
        mock: なし
        expected: 文書を返し、`notes` に違反
      - name: test_search_docs_when_unknown_field
        case: 異常
        summary: 知らない項目
        condition: '`{field: nmae, op: eq, values: [x]}`'
        mock: なし
        expected: '`InvalidArgumentError` の違反の `path` が `filter.field`、`fix` に `name`'
        exception: 知らない項目
      - name: test_search_docs_when_sources_all
        case: 正常
        summary: 全ての配信元
        condition: '`source: "*"` で、sample と notes は読め、other は読めない'
        mock: なし
        expected: '`per_source` が sample と notes だけで、`items` に `source` がある'
      - name: test_search_docs_when_id_values
        case: 正常
        summary: '`id` の `eq` の `values` の順'
        condition: '`order_by` なしで `filter: {field: id, op: eq, values: [b, a]}`'
        mock: なし
        expected: '`items` の `id` が `b`・`a` の順'
      - name: test_search_docs_when_id_values_and_order_by
        case: 正常
        summary: '`order_by` を明示した `id` の `eq`'
        condition: '`order_by: [{field: id}]` と `filter: {field: id, op: eq, values: [b, a]}`'
        mock: なし
        expected: '`items` の `id` が `a`・`b` の順'
      - name: test_search_docs_when_location
        case: 正常
        summary: 文書の場所と範囲
        condition: '同じ配信元を `view: full`、`view: full`・`max_chars_per_field: 10`、`snippets` あり、`view: summary`、`view: ids`、`ref: HEAD` で呼ぶ。`body_file` の無い `records` の要素を含む'
        mock: なし（一時フォルダの git リポジトリ）
        expected: '`path` が文書の絶対パスで、`scope` が順に `full`（`records` の要素は `section`）・`section`・`section`・`summary`。`ids` と `ref` では `path`・`scope` が `None`'
        exception: '-'
      - name: test_search_docs_when_snippets_regex
        case: 正常
        summary: 正規表現で当てた文書の抜粋
        condition: '本文の 2 行目が `# TODO x` の文書に `filter: {field: body, op: regex, values: ["^#\\s*TODO"]}`、`snippets: {before: 0, after: 0}`'
        mock: なし
        expected: '`items[0].snippets` が 1 つで、行が `(2, "# TODO x", True)`'
        exception: '-'
  - name: render_search_markdown
    title: 検索の結果の Markdown
    kind: 関数
    container: features/search/render.py
    usecase: 検索
    role: 変換
    summary: '`format: markdown` の本文を作る'
    scope: public
    thread_safe: true
    args:
      - name: result
        title: 検索の結果
        type: SearchResult
        required: true
        passing: positional
        description: 描く結果
      - name: source_label
        title: 配信元の表示
        type: str
        required: true
        passing: keyword
        description: 先頭の行に出す配信元の ID（複数なら `,` で繋ぐ）
    returns:
      type: str
      description: Markdown
    process: |-
      1. 先頭の行に `{配信元}: 該当 {total_count} 件・返した {returned} 件` を置く（複数の配信元は配信元ごとの件数も添える）
      2. `groups` があれば `| 値 | 件数 |` の表を置く
      3. `view` が `full` の場合、文書ごとに `<document path="{path}" scope="{scope}">`（`path` が `None` なら属性の無い `<document>`）と `</document>` で包み、中に項目の箇条書きと本文（YAML の文書は YAML、Markdown の文書は Markdown のまま）を置く。抜粋は、当たった行を `{行番号}:{行}`、前後の行を `{行番号}-{行}` で出し、抜粋の間に `--` の行を置く。それ以外は項目を列にした表にする（列名は項目の名前。`@chars` は `chars`）
      4. `notes` があれば末尾に `> ` の行で並べ、`next_cursor` があれば `続き: cursor={next_cursor}` を置く
    unit_tests:
      - name: test_render_search_markdown
        case: 正常
        summary: 一覧の表
        condition: '`view: summary` の 2 件'
        mock: なし
        expected: '`sample: 該当 2 件・返した 2 件` の行と、`| id | kind | name | description | chars | version |` の表'
      - name: test_render_search_markdown_when_full
        case: 正常
        summary: 場所と範囲を属性にする
        condition: '`view: full` で `path`・`scope: full` を持つ項目と、`path` が `None` の項目'
        mock: なし
        expected: 1 件目が `<document path="{path}" scope="full">`、2 件目が属性の無い `<document>` で包まれる
        exception: '-'
      - name: test_render_search_markdown_when_snippets
        case: 正常
        summary: 抜粋の書式
        condition: '`view: full` で抜粋 2 つ（`(3, "## a", True)`・`(4, "b", False)` と `(9, "## c", True)`）を持つ項目'
        mock: なし
        expected: '`<document>` の中に `3:## a`・`4-b`・`--`・`9:## c` の順の行'
        exception: '-'
  - name: compile_regex
    title: 正規表現の組み立て
    kind: 関数
    container: features/search/filters.py
    usecase: 検索
    role: 変換
    summary: '`regex` の値を、各行に当たる正規表現にする'
    scope: public
    thread_safe: true
    args:
      - name: value
        title: 値
        type: str
        required: true
        passing: positional
        description: 条件の `values` の 1 つ
      - name: case_sensitive
        title: 区別するか
        type: bool
        required: true
        passing: keyword
        description: 条件の `case_sensitive`
    returns:
      type: re.Pattern[str]
      description: コンパイルした正規表現
    process: 1. フラグを `re.MULTILINE` にし、`case_sensitive` が `False` なら `re.IGNORECASE` を加えて `re.compile(value, flags)` を返す（`re.error` はそのまま送る）
    exceptions:
      - name: re.error
        condition: 正規表現にならない値
        message: '`re` の既定'
    unit_tests:
      - name: test_compile_regex
        case: 正常
        summary: 各行と大文字小文字
        condition: '`compile_regex("^b", case_sensitive=False)` と `compile_regex("^B", case_sensitive=True)` を `a\nb` に `search`'
        mock: なし
        expected: 1 つ目が当たり、2 つ目は当たらない
  - name: find_snippets
    title: 抜粋の検索
    kind: 関数
    container: features/search/snippets.py
    usecase: 共通
    role: 変換
    summary: 本文から条件に当たる行と前後の行を、行番号つきの抜粋にする
    scope: public
    thread_safe: true
    args:
      - name: text
        title: 本文
        type: str
        required: true
        passing: positional
        description: 抜き出す元
      - name: conditions
        title: 条件
        type: Sequence[Condition]
        required: true
        passing: positional
        description: 抜粋を探す条件
      - name: before
        title: 前の行数
        type: int
        required: true
        passing: keyword
        description: 当たった行の前に添える行数
      - name: after
        title: 後ろの行数
        type: int
        required: true
        passing: keyword
        description: 当たった行の後ろに添える行数
      - name: max_count
        title: 抜粋の数
        type: int
        required: true
        passing: keyword
        description: 返す抜粋の上限
    returns:
      type: list[Snippet]
      description: 本文の先頭からの抜粋。重なる範囲は 1 つにまとめる
    process: |-
      1. 本文を `\n` で行に分け、行末の `\r` を除く（本文が改行で終わるときの最後の空の要素は除く）。行番号は 1 始まり
      2. 条件ごとに、`values` のどれかに当たった行を集める
         - `regex` は正規表現の組み立てで本文全体に `finditer` をかけ、当たった範囲の始まりの行から終わりの行までを当たった行にする。`case_sensitive` が `False` なら行ごとに NFKC をした本文にかける
         - `eq`・`prefix`・`suffix`・`contains` は値を含む行（`case_sensitive` が `False` なら行と値に NFKC と `casefold`）
         - それ以外の `op` は飛ばす
      3. 当たった行ごとに前 `before`・後ろ `after` の範囲を作り、重なる範囲をまとめ、先頭から `max_count` 個を `Snippet` にして返す（`hit` は当たった行か）
    unit_tests:
      - name: test_find_snippets
        case: 正常
        summary: 正規表現は行の頭に当たる
        condition: '3 行目が `## 手順`、8 行目が `a ## b` の本文に `{field: body, op: regex, values: ["^## "]}`、`before=0`・`after=1`・`max_count=3`'
        mock: なし
        expected: 1 つの抜粋で、行が `(3, "## 手順", True)`・`(4, …, False)`
      - name: test_find_snippets_when_anchor
        case: 正常
        summary: 値全体の先頭
        condition: '1 行目・3 行目が空白で始まらない本文に `{field: body, op: regex, values: ["\\A\\S"]}`、`before=0`・`after=0`'
        mock: なし
        expected: 行番号 1 の抜粋だけ
      - name: test_find_snippets_when_overlap
        case: 正常
        summary: 重なりと上限
        condition: '10 行のうち 3・4・9 行目に `foo` の本文に `{field: body, op: contains, values: [ＦＯＯ]}`、`before=1`・`after=1`・`max_count=1`'
        mock: なし
        expected: 2〜5 行目の 1 つの抜粋で、`hit` が 3・4 行目だけ `True`
      - name: test_find_snippets_when_trailing_newline
        case: 正常
        summary: 末尾の改行と CRLF
        condition: 本文 `a\r\nfoo\r\n` に `contains` の `foo`、`before=0`・`after=5`
        mock: なし
        expected: 行が `(2, "foo", True)` だけ
