functions:
  - name: to_tool_result
    title: ツールの結果
    kind: 関数
    container: server/mcp/result.py
    usecase: 共通
    role: 変換
    summary: サービスの結果を `format` に合わせて MCP の `CallToolResult` にする
    scope: public
    thread_safe: true
    args:
      - name: result
        title: 結果
        type: Any
        required: true
        passing: positional
        description: サービスの結果（dataclass）
      - name: fmt
        title: 形式
        type: Literal['markdown', 'json']
        required: true
        passing: positional
        description: 要求の `format`
      - name: render
        title: Markdown の組み立て
        type: Callable[[Any], str] | None
        required: true
        passing: positional
        description: '`render_*_markdown`。`None` は常に JSON（書き込み・削除）'
    returns:
      type: mcp.types.CallToolResult
      description: ツールの結果
    process: |-
      1. `fmt` が `markdown` で `render` がある場合、`content` に `render(result)` の text を 1 つ入れ、`structuredContent` を持たない結果を返す
      2. それ以外は、結果を JSON にできる辞書にし（`dataclasses.asdict`、`None` のキーは落とす。`from_` などの別名は別名のキーで出す。`SnippetLine` は `text` が空でも `line`・`text`・`hit` を全て出す。`total_lines` を持つ検索の項目は `ranges` が空でも `ranges: []` を出す。`ContainsChange` は `from_` を `from` のキーで出し、commit の端は `input` が空なので `{commit, date}` になる）、`structuredContent` にその辞書を、`content` に同じ JSON の text を入れる
    unit_tests:
      - name: test_to_tool_result
        case: 正常
        summary: markdown
        condition: '`fmt="markdown"`、`render` が `"# x"` を返す'
        mock: なし
        expected: '`content[0].text` が `"# x"`、`structuredContent` が無い'
      - name: test_to_tool_result_when_json
        case: 正常
        summary: json
        condition: '`fmt="json"`'
        mock: なし
        expected: '`structuredContent` と `json.loads(content[0].text)` が同じ'
      - name: test_to_tool_result_when_location
        case: 正常
        summary: 場所と範囲は項目の直下
        condition: '`fmt="json"` で、`path`・`scope: full`・`values: {path: a.py}` を持つ検索の項目と、`path`・`scope` が `None` の項目'
        mock: なし
        expected: 1 件目は `path`・`scope` が `values` の外にあり `values.path` が `a.py` のまま、2 件目は `path`・`scope` のキーを持たない
        exception: '-'
      - name: test_to_tool_result_when_snippet_empty_line
        case: 正常
        summary: 抜粋の空の行
        condition: '`fmt="json"` で、抜粋の行に `SnippetLine(line=2, text="", hit=False)` を持つ検索の項目'
        mock: なし
        expected: '`snippets[0].lines` の要素が `{line: 2, text: "", hit: false}`'
        exception: '-'
      - name: test_to_tool_result_when_empty_ranges
        case: 正常
        summary: 返す行の無い本文の範囲
        condition: '`fmt="json"` で、`ranges=[]`・`total_lines=10` の検索の項目と、`ranges`・`total_lines` が `None` の項目'
        mock: なし
        expected: '1 件目が `ranges: []`・`total_lines: 10` を持ち、2 件目は `ranges`・`total_lines` のキーを持たない'
      - name: test_to_tool_result_when_contains_changes
        case: 正常
        summary: 語の増減の区間
        condition: '`fmt="json"` で、`contains_changes` に commit の端の `added` と、`to` が `RangePoint(WORKTREE_LABEL)` の `removed` を持つ変更の項目'
        mock: なし
        expected: '1 つ目が `{kind: added, from: {commit, date}, to: {commit, date}, count_before, count_after}`（`from_`・`input` のキーを持たない）、2 つ目の `to` が `{input: 作業ツリー}`'
  - name: tool_error
    title: ツールのエラーの変換
    kind: 関数
    container: server/mcp/result.py
    usecase: 共通
    role: 変換
    summary: '`DevDocsError` と要求のモデルの検証の誤りを `isError: true` の結果にする'
    scope: public
    thread_safe: true
    args:
      - name: error
        title: エラー
        type: DevDocsError | pydantic.ValidationError
        required: true
        passing: positional
        description: サービスか要求のモデルが送った例外
    returns:
      type: mcp.types.CallToolResult
      description: '`isError: true` の結果'
    process: |-
      1. `DevDocsError` の場合、text の 1 行目を `{name}: {message}`、次に `details()` を YAML で、最後に `next_steps` を `- ` の行で並べる
      2. `pydantic.ValidationError` の場合、`InvalidArgumentError` として、誤りごとに `{loc を . で繋いだパス}: {msg}` の行と、`describe` で使い方を見ることを並べる
      3. どちらも `isError=True` で返す（`ToolError` は送らない。内容を text に残すため）
    unit_tests:
      - name: test_tool_error
        case: 正常
        summary: DevDocsError
        condition: '`SourceNotReadableError(available=[...])`'
        mock: なし
        expected: '`isError` が `True`、text の 1 行目が `SourceNotReadableError: ...`、使える配信元の一覧を含む'
      - name: test_tool_error_when_validation
        case: 正常
        summary: 引数の誤り
        condition: '`SearchRequest(limit="x")` の検証の誤り'
        mock: なし
        expected: text に `limit:` の行と `describe` の案内
  - name: tool_prompt_id
    title: ツールのプロンプトの ID
    kind: 関数
    container: server/mcp/result.py
    usecase: 共通
    role: 変換
    summary: ツールの description を描画するプロンプトの ID を作る
    scope: public
    is_async: false
    thread_safe: true
    args:
      - name: server
        title: MCP
        type: str
        required: true
        passing: positional
        description: 文書の MCP は `docs`、管理の MCP は `admin`
      - name: tool
        title: ツール名
        type: str
        required: true
        passing: positional
        description: '`DOCS_TOOL_NAMES`・`ADMIN_TOOL_NAMES` の名前'
    returns:
      type: str
      description: '`mcp/{server}/tools/{ツール名の _ を - にした名前}`'
    process: 1. ツール名の `_` を `-` にして `mcp/{server}/tools/` に続ける（プロンプトの `id` は小文字とハイフンだけを許す）
    unit_tests:
      - name: test_tool_prompt_id
        case: 正常
        summary: ツール名をハイフンにする
        condition: '`tool_prompt_id("docs", "search_docs")`'
        mock: なし
        expected: '`mcp/docs/tools/search-docs`'
  - name: mcp_prompt_ids
    title: MCP のプロンプトの ID
    kind: 関数
    container: server/mcp/result.py
    usecase: 共通
    role: 変換
    summary: 2 つの MCP が描画するプロンプトの ID を並べる（起動の `required` に渡す）
    scope: public
    is_async: false
    thread_safe: true
    returns:
      type: list[str]
      description: '`DOCS_INSTRUCTIONS_PROMPT_ID` と、両方の MCP のツールごとの `tool_prompt_id`'
    process: 1. `DOCS_INSTRUCTIONS_PROMPT_ID`、`DOCS_TOOL_NAMES` の `tool_prompt_id("docs", …)`、`ADMIN_TOOL_NAMES` の `tool_prompt_id("admin", …)` をこの順に並べる
    unit_tests:
      - name: test_mcp_prompt_ids
        case: 正常
        summary: instructions と 14 のツール
        condition: 引数なし
        mock: なし
        expected: 15 件で、先頭が `mcp/docs/instructions`、`mcp/admin/tools/check-project` を含む
  - name: build_docs_mcp
    title: 文書の MCP の組み立て
    kind: 関数
    container: server/mcp/docs.py
    usecase: 共通
    role: 入口
    summary: 7 つのツールを持つ文書の MCP を作る
    scope: public
    args:
      - name: handlers
        title: 配線済みの関数
        type: Handlers
        required: true
        passing: positional
        description: 起動の『配線済みの関数』
    returns:
      type: mcp.server.mcpserver.MCPServer
      description: 文書の MCP（`stateless_http`・`json_response` はアプリの組み立てが `streamable_http_app()` の引数で渡す）
    process: |-
      1. `MCPServer(DOCS_MCP_NAME, instructions=handlers.prompts.render(DOCS_INSTRUCTIONS_PROMPT_ID))` を作る
      2. `DOCS_TOOL_NAMES` のツールを、`description` を `handlers.prompts.render(tool_prompt_id("docs", 名前))` にして `TOOL_ANNOTATIONS` の注釈で登録する。引数はインターフェース定義の `request` をキーワード引数で受ける（`list_changes` の `from` は `from_: Annotated[str | None, Field(validation_alias="from")]` で受け、ツールの入力のスキーマでは `from` を出す。`alias` は関数の呼び出しで `TypeError` になるため使わない）
         - 要求のモデルのフィールドが `description` を持つ場合、その説明を入力のスキーマの項目の説明に出す（`Annotated[型, Field(description=...)]`）
         - 今のツールの説明（`search_docs`・`write_docs`・`list_changes` の引数の説明の文と `trace_related` の説明を含む）は、削らずに各ツールの YAML へ移す
         - 引数の型の誤り・`Literal` に無い値は、SDK が関数を呼ぶ前に `isError` の結果にする。入力のスキーマに無いキーは SDK が捨てる
      3. 各ツールは次の順で処理する
         - 引数で要求のモデル（`SearchRequest` など）を作る
         - サービスを `asyncio.to_thread` で呼ぶ（引数は `handlers` の属性）
         - 結果をツールの結果にする（`write_docs`・`delete_docs` の `render` は `None`。`search_docs` は `functools.partial(render_search_markdown, source_label=result.source_label)`、`list_changes` は `functools.partial(render_changes_markdown, source_label=request.source or "作業中の配信元")`、`list_match_words` は用語の一覧の文を渡す）
         - `DevDocsError` と `pydantic.ValidationError` はツールのエラーの変換の `CallToolResult(is_error=True)` をそのまま返す。それ以外の例外は `[error]` ツールの処理に失敗した（ツール名・例外）を書いて MCP の既定に任せる
      4. 作った MCP を返す
    unit_tests:
      - name: test_build_docs_mcp
        case: 正常
        summary: ツールと注釈
        condition: '`list_tools` を呼ぶ'
        mock: 配線済みの関数（偽物）
        expected: 7 つのツールが並び、`list_match_words` の `readOnlyHint` が `True`、`delete_docs` の `destructiveHint` が `True`、`search_docs` の `readOnlyHint` が `True`
      - name: test_build_docs_mcp_when_call
        case: 正常
        summary: サービスへの受け渡し
        condition: '`search_docs(source="sample", format="json")` を呼ぶ'
        mock: '`search_docs`（結果を返す偽物）'
        expected: サービスに `SearchRequest(source="sample")` が渡り、`structuredContent` を返す
      - name: test_build_docs_mcp_when_error
        case: 正常
        summary: エラーの変換
        condition: サービスが `UnknownKindError` を送る
        mock: '`write_docs`（送る偽物）'
        expected: '`isError` が `True`'
      - name: test_build_docs_mcp_when_descriptions
        case: 正常
        summary: ツールの説明をプロンプトの YAML から描画する
        condition: '`list_tools` を呼ぶ'
        mock: 配線済みの関数（偽物。`prompts` は同梱した YAML を読んだ一式）
        expected: '7 つのツールの説明がそれぞれ `prompts.render(tool_prompt_id("docs", 名前))` と同じ。`search_docs` の説明に `not`・`glob`・`@matches`・`sections`・`lines`・`describe(source, kind)`・`group_by: tags`、`list_changes` の説明に `contains`、`write_docs` の説明に `describe(source, kind)`、`trace_related` の説明に `implements` があり、入力のスキーマの `sections`・`lines`・`contains` の項目が `description` を持つ'
      - name: test_build_docs_mcp_when_instructions
        case: 正常
        summary: instructions をプロンプトの YAML から描画する
        condition: '`initialize` を呼ぶ'
        mock: 配線済みの関数（偽物。`prompts` は同梱した YAML を読んだ一式）
        expected: '`instructions` が `prompts.render(DOCS_INSTRUCTIONS_PROMPT_ID)` と同じで、`grep`・`action:`・`topic:`・`tool:` を含む'
  - name: build_admin_mcp
    title: 管理の MCP の組み立て
    kind: 関数
    container: server/mcp/admin.py
    usecase: 共通
    role: 入口
    summary: '7 つのツールを持つ管理の MCP を作る'
    scope: public
    args:
      - name: handlers
        title: 配線済みの関数
        type: Handlers
        required: true
        passing: positional
        description: 起動の『配線済みの関数』
    returns:
      type: mcp.server.mcpserver.MCPServer
      description: 管理の MCP
    process: |-
      1. `MCPServer(ADMIN_MCP_NAME)` を作る
      2. `ADMIN_TOOL_NAMES` のツールを、`description` を `handlers.prompts.render(tool_prompt_id("admin", 名前))` にして `TOOL_ANNOTATIONS` の注釈で登録する（今の説明の文は各ツールの YAML へ移す）。引数はインターフェース定義の `request` をキーワード引数で受ける
      3. 各ツールは次のサービスを `asyncio.to_thread` で呼び、結果をツールの結果にする
         - `status`: 状態の取得（`env` は `os.environ`）。`render` は状態の文
         - `reload`: 設定の読み直し。`render` は読み直しの文
         - `restart`: 再起動の制御の再起動の要求（`handlers.restart.request()`）。`render` は `None`
         - `update`: クローンの更新（クローンは端末の設定の `clone`、`control` は `handlers.restart`）。`render` は `None`
         - `check_project`: 配信元の検査。`render` は検査の文
         - `try_convert`: 試しの変換。`render` は `None`
         - `write_nav`: 画面の構成の書き込み。`render` は画面の構成の書き込みの文
         - `DevDocsError` と `pydantic.ValidationError` はツールのエラーの変換の結果を返す。それ以外の例外は `[error]` ツールの処理に失敗した（ツール名・例外）を書いて MCP の既定に任せる
      4. 作った MCP を返す
    unit_tests:
      - name: test_build_admin_mcp
        case: 正常
        summary: ツールと注釈
        condition: '`list_tools` を呼ぶ'
        mock: 配線済みの関数（偽物）
        expected: 7 つのツールが並び、`write_nav` の `destructiveHint` が `False`、`restart`・`update` の `destructiveHint` が `True`、`status`・`check_project`・`try_convert` の `readOnlyHint` が `True`
      - name: test_build_admin_mcp_when_call
        case: 正常
        summary: サービスへの受け渡し
        condition: '`check_project(path="/tmp/a", format="json")` を呼ぶ'
        mock: 配信元の検査（結果を返す偽物）
        expected: サービスに `CheckProjectRequest(path="/tmp/a")` が渡り、`structuredContent` を返す
      - name: test_build_admin_mcp_when_restart_in_progress
        case: 正常
        summary: 再起動の途中をエラーにする
        condition: '`restart` を 2 回呼ぶ'
        mock: 再起動の制御（uvicorn のサーバーはスタブ）
        expected: 1 回目の `restarting` が `True`、2 回目の `isError` が `True` で text が `RestartInProgressError` で始まる
      - name: test_build_admin_mcp_when_descriptions
        case: 正常
        summary: ツールの説明をプロンプトの YAML から描画する
        condition: '`list_tools` と `initialize` を呼ぶ'
        mock: 配線済みの関数（偽物。`prompts` は同梱した YAML を読んだ一式）
        expected: 7 つのツールの説明がそれぞれ `prompts.render(tool_prompt_id("admin", 名前))` と同じで、`instructions` が無い
