summary: "開発ドキュメントサーバー（`src/dev_docs`）の分類ごとの構成"
docs_index: true
items:
  - page: 入口.py.yaml
    summary: '`dev-docs` コマンドの引数の組み立てと main'
  - page: 起動.py.yaml
    summary: '`dev-docs serve` の部品の配線と、画面・文書の MCP・管理の MCP を 1 つにまとめたアプリ'
  - page: 端末の設定.py.yaml
    summary: '端末の設定の検証と読み込み、設定画面からの `sources[]` の保存'
  - page: 配信元.py.yaml
    summary: '配信元の設定のマージと検証、配信する配信元の一覧'
  - page: 権限と作業場所.py.yaml
    summary: '作業場所からの権限と、MCP の引数からの読み書きする場所の解決'
  - page: 共通.py.yaml
    summary: '例外の階層・YAML の読み書き・ハッシュ・パスの照合・オリジンの確認'
  - page: スクリプトの実行.py.yaml
    summary: '`validators[]`・`converters[]`・`generators[]` の制限時間つきの実行'
  - page: 履歴.py.yaml
    summary: 'git によるリビジョンの解決・一覧・変わったファイル・ファイルの日時'
  - page: 文書のストア.py.yaml
    summary: '文書のファイルの収集と、メタデータ・バージョン・日時を付けた文書'
  - page: 検査.py.yaml
    summary: 'スキーマ・ID の形・関連の種類・タグ・`validators[]` による文書の検査'
  - page: 変換.py.yaml
    summary: 'スキーマ駆動か `converters[]` による画面の Markdown への変換'
  - page: 会話の記録.py.yaml
    summary: '会話キーごとの返し済み・前回読んだ内容・閲覧と編集の記録'
  - page: 検索.py.yaml
    summary: '`search_docs` の条件の木・並べ替え・集計・量の上限'
  - page: 書き込み.py.yaml
    summary: '`write_docs`・`delete_docs` の操作の適用・検査・書き換え'
  - page: 変更.py.yaml
    summary: '`list_changes` の区間か前回読んだ時点からの変わった文書と差分'
  - page: 関連.py.yaml
    summary: '`trace_related` の関連のたどりと関連の候補'
  - page: 説明.py.yaml
    summary: '`describe` の使える配信元・説明書と種類・種類のスキーマ'
  - page: 文書のMCP.py.yaml
    summary: '文書の MCP と管理の MCP の組み立てと、ツールの結果・エラーの変換'
  - page: 画面.py.yaml
    summary: '文書の画面・見つからない画面のテンプレートと、画面の検索・リビジョンの一覧・表の列の設定の API'
  - page: 画面のスクリプト.ts.yaml
    summary: '明暗・検索・メニュー・本文の描画・列の表示・コメントと起票・設定画面のブラウザ側の振る舞い'
