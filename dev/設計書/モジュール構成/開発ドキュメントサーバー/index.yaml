summary: "開発ドキュメントサーバー（`src/dev_docs`）の分類ごとの構成"
docs_index: true
items:
  - page: __init__.py.yaml
    summary: インストール済みのパッケージからバージョンを引くときの配布名
  - page: __main__.py.yaml
    summary: '`dev-docs` コマンドの引数の組み立てと main'
  - page: main.py.yaml
    summary: '`dev-docs serve`・`dev-docs migrate` の部品の配線と、配信元の読み直し'
  - page: features/
    summary: 文書の読み込み・検査・変換・検索・書き込み・履歴と、画面の API・管理の MCP・再起動と更新・設定の移し替え
  - page: server/
    summary: アプリの組み立て・例外の変換・MCP のセッションの管理・画面の配信と、文書の MCP・管理の MCP
  - page: shared/
    summary: 例外の階層・YAML の読み書き・ファイルの置き換え・ハッシュ・パスの照合・API の DTO の基底
  - page: integrations/
    summary: git の実行とスクリプトの実行
