title: "画面 / 共通 / use-media-query.ts"
lead: CSS のメディアクエリに今当たっているかを返すフック。
functions:
  - name: useMediaQuery
    title: メディアクエリの判定
    kind: フック
    container: shared/hooks/use-media-query.ts
    usecase: 共通
    role: フック
    summary: '`window.matchMedia` の結果を `useSyncExternalStore` で読み、画面幅の変化に追従する'
    scope: public
    args:
      - name: query
        type: string
        required: true
        passing: positional
        description: 'メディアクエリ（例 `(max-width: 47.99rem)`）'
    returns:
      type: boolean
      description: 今当たっているか。サーバーでの描画では false
    process: |-
      1. `matchMedia(query)` の `change` を購読し、外れるときに購読を外す
      2. 描画のたびに `matchMedia(query).matches` を読む
    unit_tests:
      - name: test_use_media_query
        case: 正常
        summary: 当たっているか
        condition: '`matches` が true の `matchMedia`'
        mock: '`window.matchMedia`（`change` を手で送る偽物）'
        expected: 'true'
      - name: test_use_media_query_when_changed
        case: 正常
        summary: 幅の変化に追従する
        condition: '`matches` を false にして `change` を送る'
        mock: '`window.matchMedia`（偽物）'
        expected: false に変わる
