title: "画面 / 共通 / topbar.tsx"
lead: 3 画面に共通のトップバー。引数・イベント・状態は部品設計『トップバー』が持つ。
components:
  - name: Topbar
    title: トップバー
    kind: コンポーネント
    container: shared/components/topbar/topbar.tsx
    usecase: 共通
    role: 部品
    summary: 配信元・リビジョンの切り替え、検索、コメント、設定、明暗の切り替えを並べる
    description: props は部品設計の `args`、イベントは `on{イベント名}` のコールバックの props にする。配信元・リビジョンのメニューは shadcn/ui の `DropdownMenu`、ボタンは `Button`（アイコンは lucide-react）
    props:
      - name: screen
        type: ScreenId
        required: true
        description: 出し分けの画面
      - name: sources
        type: '{id: string; writable: boolean}[]'
        required: false
        description: 配信中の配信元
      - name: currentSource
        type: string
        required: false
        description: 開いている配信元
      - name: refs
        type: RefsResponse
        required: false
        description: リビジョンの一覧
      - name: currentRef
        type: string
        required: false
        description: 開いているリビジョン
      - name: commentCount
        type: number
        required: false
        default: '0'
        description: 溜めたコメントの件数
      - name: colorScheme
        type: '"light" | "dark" | "system"'
        required: true
        description: 明暗
      - name: onSourceSelect
        type: '(id: string) => void'
        required: false
        description: '`sourceSelect`'
      - name: onRefSelect
        type: '(ref: string) => void'
        required: false
        description: '`refSelect`'
      - name: onCompareStart
        type: () => void
        required: false
        description: '`compareStart`'
      - name: onSearchOpen
        type: () => void
        required: false
        description: '`searchOpen`'
      - name: onCommentPanelToggle
        type: () => void
        required: false
        description: '`commentPanelToggle`'
      - name: onSidebarOpen
        type: () => void
        required: false
        description: '`sidebarOpen`'
      - name: onColorSchemeToggle
        type: () => void
        required: true
        description: '`colorSchemeToggle`'
refs:
  - dev/設計書/部品設計/トップバー#
