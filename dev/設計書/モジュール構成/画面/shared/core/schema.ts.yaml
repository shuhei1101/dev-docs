title: "画面 / 共通 / schema.ts"
lead: 画面の中で共通に使う zod のスキーマ。API の型は orval が生成し、ここには生成しないものだけを置く。
constants:
  - name: ProblemSchema
    title: 問題の詳細のスキーマ
    container: shared/core/schema.ts
    usecase: 共通
    summary: problem+json の本文（`type`・`title`・`status`・`detail`・`nextSteps`・`errors[]`、他のキーは `passthrough`）
    value: z.object({...}).passthrough()
  - name: MissingSchema
    title: 見つからなかったもののスキーマ
    container: shared/core/schema.ts
    usecase: 共通
    summary: 文書の取得の 404 の `missing`（`kind` が `source`・`not_served`・`ref`・`doc` の判別共用体）
    value: z.discriminatedUnion("kind", [...])
