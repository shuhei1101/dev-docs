title: "画面 / 文書の画面 / conversion-error-alert.tsx"
lead: 本文の代わりに出す変換の失敗。
components:
  - name: ConversionErrorAlert
    title: 変換の失敗
    kind: コンポーネント
    container: features/docs/doc-view/components/conversion-error-alert.tsx
    usecase: 文書を読む
    role: 部品
    summary: shadcn/ui の `Alert` で見出し・原因ごとの説明・`種類`・`スクリプト`・`原因`（YAML を読めないときは `ファイル`・`場所`・`原因`）の一覧と「再読み込み」を出す
    props:
      - name: error
        type: ConversionError
        required: true
        description: 文書の取得の `conversionError`
      - name: onRetry
        type: () => void
        required: true
        description: 再読み込み（問い合わせの `refetch`）
    unit_tests:
      - name: test_conversion_error_alert
        case: 正常
        summary: 制限時間の超過
        condition: 原因が制限時間の超過の `conversionError`
        mock: なし
        expected: 画面設計の制限時間の超過の文言と `種類`・`スクリプト`・`原因` が出る
      - name: test_conversion_error_alert_when_yaml
        case: 正常
        summary: YAML を読めない
        condition: 行・列を持つ `conversionError`
        mock: なし
        expected: '`場所` が `{行} 行 {列} 列`'
test_files:
  - tests/unit/frontend/src/features/docs/doc-view/components/conversion-error-alert.test.tsx
