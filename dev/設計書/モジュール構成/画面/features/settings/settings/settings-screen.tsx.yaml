title: "画面 / 設定画面 / settings-screen.tsx"
lead: 設定画面。要素と振る舞いは画面設計『設定画面』が持つ。
components:
  - name: SettingsScreen
    title: 設定画面
    kind: 画面
    container: features/settings/settings/settings-screen.tsx
    usecase: 配信元を設定する
    role: 画面
    summary: 端末の設定の取得を `useSuspenseQuery` で読み、配信元の一覧・キーボードのセクション・ダイアログを並べる
    state:
      - name: dialog
        type: '{kind: "edit"; index: number | null} | {kind: "remove"; index: number} | null'
        initial: 'null'
        description: 開いているダイアログ
        notes: '`useState`'
      - name: helpOpen
        type: boolean
        initial: 'false'
        description: ショートカットの一覧
        notes: '`useState`'
    description: 読み込み中の表示はルートの `pendingComponent`（`pendingMs` 1000）。1 文字のショートカットのスイッチは `usePreferencesStore` の `singleKey`。文書の画面に戻るは `usePreferencesStore` の直前の文書の URL（無ければ配信中の先頭の配信元のトップ）
    unit_tests:
      - name: test_settings_screen
        case: 正常
        summary: 一覧を出す
        condition: 2 行の端末の設定
        mock: MSW の端末の設定の取得のハンドラ
        expected: 表に 2 行、`配信元を追加` が出る
      - name: test_settings_screen_when_empty
        case: 正常
        summary: 配信元が無い
        condition: '`sources` が空'
        mock: MSW のハンドラ
        expected: '`配信元はありません。`、表は出ない'
      - name: test_settings_screen_when_single_key_off
        case: 正常
        summary: 1 文字のショートカットを止める
        condition: スイッチを外して `?` を押す
        mock: MSW のハンドラ
        expected: ショートカットの一覧が開かない
refs:
  - dev/設計書/画面設計/設定画面#
test_files:
  - tests/unit/frontend/src/features/settings/settings/settings-screen.test.tsx
