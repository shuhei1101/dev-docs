title: "管理用プラグイン / セッション開始のフック / session_start.py"
lead: |-
  SessionStart のフック。ポートにつながらなければ `dev-docs serve` を切り離して起動し、つながれば `POST /_admin/session-context` の文をセッションの文脈に入れる。
  Python 3.14 の標準ライブラリだけで書き、どの失敗でも終了コード 0 で戻る。
directory: |-
  ```text
  plugins/dev-docs/
  ├─ hooks/
  │  ├─ hooks.json          # SessionStart（timeout 18）・PreToolUse（timeout 5）の登録
  │  └─ session_start.py    # main / is_listening / read_clone / start_server / fetch_context
  ```
constants:
  - name: DEFAULT_PORT
    title: 既定のポート
    container: hooks/session_start.py
    usecase: 起動
    summary: '`DEV_DOCS_PORT` が無いときのポート'
    value: '8781'
  - name: DEFAULT_CONFIG
    title: 既定の端末の設定
    container: hooks/session_start.py
    usecase: 起動
    summary: '`DEV_DOCS_CONFIG` が無いときの端末の設定のパス'
    value: '"~/.config/dev-docs/settings.yaml"'
  - name: CONNECT_TIMEOUT_SEC
    title: 接続の打ち切り
    container: hooks/session_start.py
    usecase: 起動
    summary: ポートへの TCP 接続を打ち切る秒数
    value: '0.5'
  - name: CONTEXT_TIMEOUT_SEC
    title: 文脈の取得の打ち切り
    container: hooks/session_start.py
    usecase: 起動
    summary: '`POST /_admin/session-context` を打ち切る秒数'
    value: '11'
  - name: RECONNECT_GUIDE
    title: つなぎ直しの案内
    container: hooks/session_start.py
    usecase: 起動
    summary: 起動したときに文脈に入れる文
    value: '"dev-docs を起動しました。このセッションで文書の MCP を使うには /mcp で dev-docs につなぎ直してください。"'
functions:
  - name: main
    title: フックの入口
    container: hooks/session_start.py
    usecase: 起動
    role: 入口
    summary: stdin の JSON を読み、文脈を取るかサーバーを起動して、`additionalContext` を標準出力に出す
    kind: 関数
    scope: public
    is_async: false
    side_effects: 標準出力に書く。サーバーのプロセスを起動することがある
    returns:
      type: int
      description: 常に 0
    process: |-
      1. stdin を JSON として読み、`session_id`・`cwd`・`source`・`agent_id` を取る。ポートは `DEV_DOCS_PORT`（無ければ `DEFAULT_PORT`）
         - JSON として読めない場合、何も出さず 0 を返す
      2. ポートにつながるか確かめる（待ち受けの確かめ）
      3. つながる場合、文脈を取り（文脈の取得。`reason` に `source`）、その文を `additionalContext` にする
         - `TimeoutError`、または `reason` が `TimeoutError` の `urllib.error.URLError` の場合、`dev-docs の文脈を取れませんでした（{CONTEXT_TIMEOUT_SEC} 秒で打ち切りました）。管理の MCP の status で状態を確かめてください。` を `additionalContext` にする
         - そのほかの `OSError`・`ValueError` の場合、`dev-docs の文脈を取れませんでした（{理由}）。管理の MCP の status で状態を確かめてください。` を `additionalContext` にする
      4. つながらない場合、端末の設定（`DEV_DOCS_CONFIG`、無ければ `DEFAULT_CONFIG`）からクローンを読み（クローンの読み取り）、サーバーを起動し（サーバーの起動）、`RECONNECT_GUIDE` を `additionalContext` にする
         - 端末の設定・`clone`・`{clone}/.venv/bin/python` のどれかが無い場合、`dev-docs を起動できませんでした（{無いもののパス}）。/dev-docs:global-setup で端末の設定を作ってください。` を `additionalContext` にする
         - 起動が `OSError` の場合、理由を添えて同じ文を `additionalContext` にする
      5. `{"hookSpecificOutput": {"hookEventName": "SessionStart", "additionalContext": ...}}` を標準出力に出し、予期しない例外も含め 0 を返す
    unit_tests:
      - name: test_main_when_listening
        case: 正常
        summary: つながれば文脈を入れる
        condition: 'stdin に `source: clear` の JSON'
        mock: 待ち受けの確かめ（`True`）・文脈の取得（`"ctx"` を返す）
        expected: '0 を返し、標準出力の `additionalContext` が `ctx`、文脈の取得に `reason: clear` が渡る'
      - name: test_main_when_down
        case: 正常
        summary: つながらなければ起動して案内する
        condition: '`clone:` を持つ端末の設定と `{clone}/.venv/bin/python` がある'
        mock: 待ち受けの確かめ（`False`）・サーバーの起動（呼ばれた引数を記録する）
        expected: 0 を返し、起動がそのクローンで 1 回呼ばれ、`additionalContext` が `RECONNECT_GUIDE`
      - name: test_main_when_config_missing
        case: 異常
        summary: 端末の設定が無ければ global-setup を案内する
        condition: '`DEV_DOCS_CONFIG` が無いファイル'
        mock: 待ち受けの確かめ（`False`）・サーバーの起動（呼ばれないことを確かめる）
        expected: 0 を返し、`additionalContext` にパスと `/dev-docs:global-setup`。起動を呼ばない
      - name: test_main_when_context_failed
        case: 異常
        summary: 文脈を取れなければ status を案内する
        condition: 'stdin に `source: startup` の JSON'
        mock: 待ち受けの確かめ（`True`）・文脈の取得（`TimeoutError` を送出する）
        expected: 0 を返し、`additionalContext` に `11 秒で打ち切りました` と `status` の案内
      - name: test_main_when_input_unparsable
        case: 異常
        summary: 読めない入力では何も出さない
        condition: stdin が `{`
        mock: なし
        expected: 0 を返し、標準出力が空
      - name: test_main_when_context_refused
        case: 異常
        summary: 打ち切り以外の失敗は秒数を入れない
        condition: 'stdin に `source: startup` の JSON'
        mock: 待ち受けの確かめ（`True`）・文脈の取得（`reason` が `ConnectionRefusedError` の `urllib.error.URLError` を送出する）
        expected: 0 を返し、`additionalContext` に理由と `status` の案内があり、`秒で打ち切りました` が無い
  - name: is_listening
    title: 待ち受けの確かめ
    container: hooks/session_start.py
    usecase: 起動
    role: 検証
    summary: '`127.0.0.1:{port}` に TCP でつながるかを返す'
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: port
        title: ポート
        type: int
        required: true
        passing: positional
        description: サーバーのポート
    returns:
      type: bool
      description: つながれば `True`
    process: |-
      1. `socket.create_connection(("127.0.0.1", port), timeout=CONNECT_TIMEOUT_SEC)` でつなぎ、すぐに閉じて `True` を返す
         - `OSError` の場合、`False` を返す
    unit_tests:
      - name: test_is_listening
        case: 正常
        summary: 待ち受けているポート
        condition: テストが `listen` しているポート
        mock: なし
        expected: '`True`'
      - name: test_is_listening_when_closed
        case: 正常
        summary: 待ち受けていないポート
        condition: OS が払い出して閉じたポート
        mock: なし
        expected: '`False`'
  - name: read_clone
    title: クローンの読み取り
    container: hooks/session_start.py
    usecase: 起動
    role: 解決
    summary: 端末の設定のトップレベルの `clone:` の行だけを読む
    description: 標準ライブラリに YAML のパーサーが無いため、行を読む。
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: config
        title: 端末の設定
        type: Path
        required: true
        passing: positional
        description: 端末の設定のパス（`~` を展開済み）
    returns:
      type: Path | None
      description: '`~` を展開したクローンのパス。ファイルか行が無ければ `None`'
    process: |-
      1. ファイルを UTF-8 で読む
         - `OSError` の場合、`None` を返す
      2. 行頭が `clone:` の最初の行の値を取り、`#` 以降のコメントと前後の空白・引用符を外して `~` を展開する
      3. 行が無いか値が空なら `None` を返す
    unit_tests:
      - name: test_read_clone
        case: 正常
        summary: 引用符と ~ を扱う
        condition: '`clone: "~/dev-docs"  # クローン` の行と、字下げした `clone:` を持つ `sources` の行'
        mock: なし
        expected: ホームの下の `dev-docs`
      - name: test_read_clone_when_missing
        case: 正常
        summary: 行かファイルが無い
        condition: '`clone:` の無いファイルと、無いファイル'
        mock: なし
        expected: どちらも `None`
  - name: start_server
    title: サーバーの起動
    container: hooks/session_start.py
    usecase: 起動
    role: 外部との境界
    summary: クローンの `.venv` で `dev-docs serve` を切り離して起動し、待たずに戻る
    kind: 関数
    scope: public
    is_async: false
    side_effects: プロセスを 1 つ起動する
    args:
      - name: clone
        title: クローン
        type: Path
        required: true
        passing: positional
        description: dev-docs のクローン
    returns:
      type: None
      description: なし
    process: |-
      1. `{clone}/.venv/bin/python` が無ければ `FileNotFoundError` を送出する
      2. `subprocess.Popen([python, "-m", "dev_docs", "serve"], cwd=clone, start_new_session=True, stdin/stdout/stderr=DEVNULL)` を呼び、待たずに戻る（環境変数はフックのものを引き継ぐ）
    exceptions:
      - name: FileNotFoundError
        condition: '`{clone}/.venv/bin/python` が無い'
        message: パス
    unit_tests:
      - name: test_start_server
        case: 正常
        summary: 切り離して起動する
        condition: '`.venv/bin/python` を受けた引数をファイルに書いて終わるスクリプトにした一時フォルダ'
        mock: なし
        expected: 戻った後にファイルが `-m dev_docs serve` になる
      - name: test_start_server_when_no_venv
        case: 異常
        summary: .venv が無い
        condition: 空のフォルダ
        mock: なし
        expected: '`FileNotFoundError`'
        exception: FileNotFoundError
  - name: fetch_context
    title: 文脈の取得
    container: hooks/session_start.py
    usecase: 起動
    role: 外部との境界
    summary: '`POST /_admin/session-context` を 1 回呼び、`context` を返す'
    kind: 関数
    scope: public
    is_async: false
    side_effects: サーバーが `clear`・`compact` のとき会話の記録を削除する
    args:
      - name: port
        title: ポート
        type: int
        required: true
        passing: positional
        description: サーバーのポート
      - name: payload
        title: 本文
        type: dict[str, str]
        required: true
        passing: positional
        description: '`cwd`・`session_id`・`agent_id`（あれば）・`reason`'
    returns:
      type: str
      description: 応答の `context`
    process: |-
      1. `urllib.request.Request` で `http://127.0.0.1:{port}/_admin/session-context` に `Content-Type: application/json` で本文を POST し、`timeout=CONTEXT_TIMEOUT_SEC` で開く
      2. 応答を JSON として読み、`context` を返す
         - 200 以外は `urllib.error.HTTPError`、打ち切りは `TimeoutError` のまま伝える
         - `context` が文字列でない場合、`ValueError` を送出する
    exceptions:
      - name: urllib.error.URLError
        condition: つながらない・200 以外を返した（`HTTPError`）
        message: urllib の理由
      - name: TimeoutError
        condition: '`CONTEXT_TIMEOUT_SEC` で返らない'
        message: urllib の理由
      - name: ValueError
        condition: 応答が JSON でない・`context` が文字列でない
        message: '`context がありません`'
    unit_tests:
      - name: test_fetch_context
        case: 正常
        summary: context を返す
        condition: '一時のポートの HTTP サーバーが `{"context": "ctx"}` を返す'
        mock: '`POST /_admin/session-context` を真似る HTTP サーバー'
        expected: '`ctx` を返し、サーバーが受けた本文が渡した `payload`'
      - name: test_fetch_context_when_timeout
        case: 異常
        summary: '`CONTEXT_TIMEOUT_SEC` で打ち切る'
        condition: '`CONTEXT_TIMEOUT_SEC` を 1 に差し替え、2 秒応答しない HTTP サーバー'
        mock: 応答しない HTTP サーバー
        expected: 2 秒以内に `TimeoutError`
        exception: TimeoutError
refs:
  - dev/設計書/インターフェース定義/管理用プラグイン/セッション開始のフック#
test_files:
