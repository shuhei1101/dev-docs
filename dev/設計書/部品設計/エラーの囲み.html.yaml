title: "エラーの囲み"
implementation: "src/dev_docs/server/templates/components/error_panel.html#error_panel"
story: "Shared/ErrorPanel"
states:
  - name: ConvertTimeout
    description: 変換のスクリプトが制限時間を超えた。見出し・種類・スクリプト・原因・次にできること
    args:
      - name: label
        value: 変換の失敗（制限時間の超過）
      - name: title
        value: この文書を変換できませんでした
      - name: rows
        value: '[{"label": "種類", "value": "設定"}, {"label": "スクリプト", "value": "`scripts/convert/settings.py`"}, {"label": "原因", "value": "制限時間（10 秒）を超えたため、スクリプトを止めました。"}]'
      - name: next
        value: スクリプトを修正して保存すると、次に開いたときに変換し直します。同じ配信元の他の文書は読めます。
  - name: ConvertExitError
    description: 変換のスクリプトが異常終了した。原因に終了コードと標準エラーの末尾を改行して出す
    args:
      - name: label
        value: 変換の失敗（スクリプトの異常終了）
      - name: title
        value: この文書を変換できませんでした
      - name: rows
        value: "[{\"label\": \"種類\", \"value\": \"設定\"}, {\"label\": \"スクリプト\", \"value\": \"`scripts/convert/settings.py`\"}, {\"label\": \"原因\", \"value\": \"終了コード 1 で終わりました。\\n`KeyError: 'columns'`\"}]"
      - name: next
        value: スクリプトを修正して保存すると、次に開いたときに変換し直します。同じ配信元の他の文書は読めます。
  - name: NotFound
    description: 見出しと次にできることを持たない。404 の画面で見つからなかったものを出す
    args:
      - name: label
        value: 見つからなかったもの
      - name: rows
        value: '[{"label": "配信元", "value": "sample"}, {"label": "文書", "value": "`設計書/無い文書` はありません。"}]'
  - name: LongValue
    description: 長いパスの値が囲みの幅で折り返し、横にはみ出さない
    args:
      - name: label
        value: 長い値
      - name: title
        value: この文書を変換できませんでした
      - name: rows
        value: '[{"label": "種類", "value": "インターフェース定義"}, {"label": "スクリプト", "value": "`scripts/convert/very/deeply/nested/directory/structure/for/interface_definition_converter_with_long_name.py`"}, {"label": "原因", "value": "制限時間（10 秒）を超えたため、スクリプトを止めました。"}]'
lead: 文書を変換できなかった理由と、404 で見つからなかったものを、項目と値の組で出す囲み。
status: planned
introduced:
  pr: 12
args:
  - name: label
    type: 文字列
    required: true
    description: 囲みの読み上げ名（`aria-label`）
  - name: title
    type: 文字列
    required: false
    default: なし（見出しを出さない）
    description: 警告のアイコンを付けて先頭に出す見出し
  - name: rows
    type: オブジェクトの配列
    required: true
    description: 項目と値の組を並べた一覧。各要素は `label`（項目）と `value`（値）を持つ
    notes:
      値の描き方: '`value` はエスケープしてから、バッククォートで囲んだ部分をコード、改行を改行として描く'
  - name: next
    type: 文字列
    required: false
    default: なし（出さない）
    description: 利用者が次にできることの案内。項目の一覧の下に出す
accessibility:
  - '`section` に `aria-label` を付け、囲みを 1 つの領域として読ませる'
  - 警告のアイコンは `aria-hidden` にし、失敗は見出しの文言で伝える（色とアイコンだけに頼らない）
  - 自動では消さない
