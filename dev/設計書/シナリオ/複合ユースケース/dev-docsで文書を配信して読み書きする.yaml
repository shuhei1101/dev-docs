title: "dev-docsで文書を配信して読み書きする"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実環境で実行。Claude Code は `claude -p` で動かす）
      - name: Claude Code の設定の場所
        description: '`CLAUDE_CONFIG_DIR` が指すテスト用の一時フォルダ。dev-docs のマーケットプレイスとプラグイン `dev-docs` を、この場所のユーザースコープに入れておく'
        notes: テストを流した端末の `~/.claude` は変わらない。S0 の global-setup はこの場所の `settings.json` の env に `DEV_DOCS_CONFIG` を書く
      - name: dev-docs のクローン
        description: テスト用の一時フォルダにクローンした dev-docs
        notes: ポート 8781 が空き。S0 の `/dev-docs:global-setup` にこのパスを渡す
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す場所（テスト用の一時フォルダの `settings.yaml`）'
        notes: ファイルは無い。S0 が作る
      - name: サンプルの配信元
        description: 文書の種類を 1 つ（スキーマと YAML 2 件）と `dev-docs.yaml` を持つ git リポジトリと、そのワークツリー（`.claude/worktrees/x`）
        notes: id `sample`。S1 の `/dev-docs:setup` で `scope.read`・`scope.write` に sample のフォルダを答える
      - name: 読み取りだけの配信元
        description: 文書の種類を 1 つと `dev-docs.yaml` を持つ Git 管理外のフォルダ
        notes: id `notes`。S1 の `/dev-docs:setup` で `scope.read` に sample のフォルダを答え、`scope.write` は答えない
    flow: |-
      ```mermaid
      flowchart TD
        subgraph P1["導入"]
          S0["dev-docsを入れる:正常シナリオ"]
        end
        subgraph P2["起動と登録"]
          S2["起動する:正常シナリオ（SessionStart で起動する）"]
          S1["配信元を追加する:正常シナリオ"]
        end
        subgraph P3["読み書き"]
          S3["エージェントが調べる:正常シナリオ"]
          S4["エージェントが書き込む:正常シナリオ"]
          S5["変更をレビューする:正常シナリオ"]
          S6["利用者が画面で読む:正常シナリオ"]
        end
        subgraph P4["保守"]
          S7["YAMLを直接編集した:正常シナリオ"]
          S8["設定・スクリプトを変える:正常シナリオ"]
          S9["dev-docsを更新する:正常シナリオ"]
        end
        S0 --> S2 --> S1 --> S3 --> S4 --> S5 --> S6 --> S7 --> S8 --> S9
        click S0 "../単一ユースケース/dev-docsを入れる.yaml#正常シナリオ"
        click S2 "../単一ユースケース/起動する.yaml#正常シナリオsessionstart-で起動する"
        click S1 "../単一ユースケース/配信元を追加する.yaml#正常シナリオ"
        click S3 "../単一ユースケース/エージェントが調べる.yaml#正常シナリオ"
        click S4 "../単一ユースケース/エージェントが書き込む.yaml#正常シナリオ"
        click S5 "../単一ユースケース/変更をレビューする.yaml#正常シナリオ"
        click S7 "../単一ユースケース/YAMLを直接編集した.yaml#正常シナリオ"
        click S8 "../単一ユースケース/設定・スクリプトを変える.yaml#正常シナリオ"
        click S9 "../単一ユースケース/dev-docsを更新する.yaml#正常シナリオ"
      ```
    expected:
      - '`DEV_DOCS_CONFIG` が指す `settings.yaml` が `version`・`clone` を持ち、Claude Code の設定の場所の `settings.json` の env に `DEV_DOCS_CONFIG` が入っている'
      - '`127.0.0.1:8781` を待ち受ける dev-docs のプロセスが 1 つだけある'
      - sample のワークツリーで始めたセッションの文脈に、使える配信元 `sample`（読み書き）・`notes`（読み取りだけ）と短い使い方が入る
      - 端末の設定の `sources` に sample と notes の行があり、`check_project` が違反と索引の同期の件数を 0 で返す
      - '`try_convert` が sample の文書を変換した Markdown を返し、sample のフォルダは変わらない'
      - 管理の MCP の `status` が `sample` と `notes` を配信中として返す
      - '`/mcp` のツールは `search_docs`・`write_docs`・`delete_docs`・`describe`・`list_changes`・`trace_related` の 6 つで、配信元を追加しても変わらない'
      - sample のワークツリーで呼んだ `describe` が、使える配信元として `sample`（読み書き）と `notes`（読み取りだけ）を返す
      - 'sample のワークツリーで `source` を省いて呼んだ `search_docs` がワークツリーの文書を返し、`source: *` が sample と notes の結果を各行の `source` つきで返す'
      - '`write_docs` の変更は sample のワークツリーの YAML だけに入り、sample のクローン本体は変わらない。dev-docs は commit しない（ワークツリーに増えた commit は、エージェントが commit した 1 件だけ）'
      - '`notes` を指した `write_docs` は断られ、notes のフォルダは変わらない'
      - '`list_changes` がエージェントの commit の変更を返し、`/_api/sources/sample/docs/{パス}?ref={その commit}&diff={親の commit}` の `changed_items` が変わった項目を返す'
      - '`/_api/sources/sample/docs` が `tabs` と、YAML を変換した `markdown` を返す'
      - 直接編集した YAML の内容と新しいバージョンを、次の `search_docs` が返す
      - '`dev-docs.yaml` で変えた配信元の説明が、`reload` の後の `describe` に出る'
      - '`update` の後、`status` が新しいバージョンを返し、`sample` と `notes` を配信している'
    test: test_normal
    notes:
      順序: S1 の `check_project` と `reload` は管理の MCP を呼ぶため、A-23 の番号と違い、S2（起動）を S1 の前に置く。
      commit: S4 と S5 の間で、エージェントが `write_docs` の変更をワークツリーで `git commit` する。dev-docs は commit しない（D-105）。
      起動したセッション: フックがサーバーを起動したそのセッションでは MCP の接続が間に合わず、`/mcp` でつなぎ直す（PoC 2 の結果）。
    uses:
      - dev/設計書/シナリオ/単一ユースケース/dev-docsを入れる#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/起動する#scenarios[正常シナリオ（SessionStart で起動する）]
      - dev/設計書/シナリオ/単一ユースケース/配信元を追加する#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/エージェントが調べる#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/エージェントが書き込む#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/変更をレビューする#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/YAMLを直接編集した#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/設定・スクリプトを変える#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/dev-docsを更新する#scenarios[正常シナリオ]
  - name: 異常シナリオ（配信できない配信元がある）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: dev-docs のクローン
        description: テスト用の一時フォルダにクローンした dev-docs
        notes: ポート 8781 が空き
      - name: サンプルの配信元
        description: 正常シナリオと同じ、検証に通る配信元
        notes: id `sample`
      - name: 壊れた配信元
        description: '`dev-docs.yaml` がスキーマに違反する配信元'
        notes: id `broken`。`documents[]` の必須のキーが無い
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す `settings.yaml`'
        notes: '`sources` に sample と broken の 2 行'
    flow: |-
      ```mermaid
      flowchart TD
        subgraph P1["起動"]
          S2["起動する:異常シナリオ（設定の検証に失敗する）"]
        end
        subgraph P2["読み書き"]
          S3["エージェントが調べる:正常シナリオ"]
        end
        subgraph P3["直す"]
          S8["設定・スクリプトを変える:正常シナリオ"]
        end
        S2 --> S3 --> S8
        click S2 "../単一ユースケース/起動する.yaml#異常シナリオ設定の検証に失敗する"
        click S3 "../単一ユースケース/エージェントが調べる.yaml#異常シナリオ配信していない配信元を指す"
        click S8 "../単一ユースケース/設定・スクリプトを変える.yaml#正常シナリオ"
      ```
    expected:
      - 起動の直後、`/_api/sources/broken/docs` が 404 を返し、`/_api/sources/sample/docs` と `/mcp` は応答する
      - '`source: broken` を指した `search_docs` は配信していない配信元としてエラーを返し、`source: sample` は文書を返す'
      - 管理の MCP の `status` が broken を配信していない配信元として、違反したキーのパスと理由つきで返す
      - エラーログに broken の違反が残る
      - 'broken の `dev-docs.yaml` を直して `reload` した後、`source: broken` の `search_docs` が文書を返す'
      - '`reload` の前後で `/mcp` のセッションが切れない'
    test: test_error_when_source_config_invalid
    uses:
      - dev/設計書/シナリオ/単一ユースケース/起動する#scenarios[異常シナリオ（設定の検証に失敗する）]
      - dev/設計書/シナリオ/単一ユースケース/エージェントが調べる#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/エージェントが調べる#scenarios[異常シナリオ（配信していない配信元を指す）]
      - dev/設計書/シナリオ/単一ユースケース/設定・スクリプトを変える#scenarios[正常シナリオ]
lead: 利用者が dev-docs を入れて端末の設定に配信元を並べ、エージェントが文書の MCP で、利用者が画面で、その配信元の YAML の文書を読み書きする。設定・スクリプトの変更と dev-docs の更新を経ても配信が続く。
issue: 2
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 手元の配信元の文書を画面で読み、エージェントの変更を差分でレビューできる。どの作業場所からどの配信元を読み書きできるかを端末の設定で決められる
  - name: エージェント（Claude Code）
    interest: 1 つの文書の MCP で、今の作業場所から使える配信元の文書を探して読み、作業ツリーの YAML を検査に通してから書き換えられる
  - name: 各配信元
    interest: サーバーのコードもプラグインも持たず、`dev-docs.yaml`・スキーマ・検査と変換のスクリプトだけで配信される
trigger: 利用者が dev-docs のプラグインを入れ、`/dev-docs:global-setup` を実行する
preconditions:
  - 端末に uv・git・Claude Code がある
  - dev-docs のマーケットプレイスを追加し、プラグイン `dev-docs` をユーザースコープで入れてある
  - 配信する配信元が、YAML の文書とそのスキーマを持つフォルダ（git リポジトリか Git 管理外のフォルダ）である
success_guarantee: 端末の設定に並べた配信元の文書が、`/mcp` の文書の MCP と `/_api/sources/{配信元の id}/docs` の画面の API で読める。エージェントの書き込みは、`scope.write` に当たる作業場所から呼んだセッションの作業ツリーにだけ反映される。
minimal_guarantee: 設定・スクリプトの検証に失敗した配信元があっても、他の配信元の配信と管理の MCP は止まらない。検査に通らない書き込みと、`scope` に当たらない作業場所からの呼び出しは、ファイルを書き換えない。
frequency: 導入は端末ごとに 1 回。起動はセッションごと。読み書きは作業のたび
priority: 高
notes:
  単一ユースケース: '箱が指す単一ユースケースのうち、S6 は #17（画面）が書く。書いた時点で箱に `click` と `uses` を付ける。'
  E2E テスト: 'テストのファイルは、通す機能が #3・#4 でそろってから作り、その時点で `test_file` を付ける。'
