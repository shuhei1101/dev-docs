title: "設定画面で端末の設定を変える"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実環境で実行。ブラウザで画面を開く）
      - name: サンプルの配信元
        description: 文書の種類を 1 つと `dev-docs.yaml` を持つ git リポジトリ
        notes: id `sample`
      - name: 追加する配信元
        description: 文書の種類を 1 つと `dev-docs.yaml` を持つ git リポジトリ。端末の設定にはまだ無い
        notes: id `extra`
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す一時フォルダの `settings.yaml`'
        notes: '`sources` に sample の 1 行'
      - name: dev-docs
        description: 端末の設定で起動した dev-docs
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant CF as 端末の設定

        U->>UI: GET /
        UI-->>U: /_settings/ へ転送する
        UI->>CF: 端末の設定を読む
        UI-->>U: settings（配信元の一覧と状態）
        U->>UI: 配信元を追加し、extra の id・config・scope.read を入れて保存する
        UI->>UI: 追加した後の端末の設定をスキーマで検証する
        UI->>CF: settings.yaml を書き換える
        UI->>UI: 配信元を読み直す
        UI-->>U: settings（extra を加えた一覧）
      ```
    expected:
      - '`/` が `/_settings/` へ転送する'
      - 一覧に sample と extra が配信中で並ぶ
      - '`settings.yaml` の `sources` に extra の行が追加され、sample の行は変わらない'
      - dev-docs を再起動せずに `/extra/` が 200 を返す
    test: test_normal
  - name: 正常シナリオ（配信していない配信元がある）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 検証に失敗する配信元
        description: '`dev-docs.yaml` の `documents[0]` に必須のキー `paths` が無い配信元'
        notes: id `broken`
      - name: 設定のバージョンが古い配信元
        description: '`dev-docs.yaml` の `version` が、サーバーが読めるバージョンより古い配信元'
        notes: id `legacy`
      - name: 無効の配信元
        description: '端末の設定で `enabled: false` の配信元'
        notes: id `archive`
      - name: dev-docs
        description: sample・broken・legacy・archive を端末の設定に並べて起動した dev-docs
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面

        U->>UI: GET /_settings/
        UI-->>U: settings（配信元ごとの状態）
      ```
    expected:
      - sample と legacy が配信中で並ぶ
      - broken が配信していない状態で、起動時の検証で外した理由（`documents[0]` に必須のキー `paths` が無い）が出る
      - legacy に、設定のバージョンとサーバーが読めるバージョンが出る
      - archive が無効で、`enabled` が `false` であることが出る
    test: test_normal_when_source_not_served
  - name: 正常シナリオ（配信を止める）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す一時フォルダの `settings.yaml`'
        notes: '`sources` に sample と extra の 2 行'
      - name: dev-docs
        description: 端末の設定で起動した dev-docs
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant CF as 端末の設定

        U->>UI: extra を編集し、配信するを外して保存する
        UI->>UI: 編集した後の端末の設定をスキーマで検証する
        UI->>CF: settings.yaml を書き換える
        UI->>UI: 配信元を読み直す
        UI-->>U: settings（extra が無効）
      ```
    expected:
      - '`settings.yaml` の extra の行の `enabled` が `false` になる'
      - 一覧の extra が無効になる
      - '`/extra/` が 404 の not-found を返し、`/sample/` は 200 を返す'
    test: test_normal_when_source_disabled
  - name: 正常シナリオ（配信元を削除する）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す一時フォルダの `settings.yaml`'
        notes: '`sources` に sample と extra の 2 行'
      - name: dev-docs
        description: 端末の設定で起動した dev-docs
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant CF as 端末の設定

        U->>UI: extra を削除する
        UI-->>U: 削除の確認のダイアログ
        U->>UI: 削除する
        UI->>UI: 削除した後の端末の設定をスキーマで検証する
        UI->>CF: settings.yaml を書き換える
        UI->>UI: 配信元を読み直す
        UI-->>U: settings（extra の無い一覧）
      ```
    expected:
      - 確認のダイアログに、extra のフォルダと文書は削除しないことが出る
      - '`settings.yaml` の `sources` から extra の行が消え、sample の行は変わらない'
      - extra のフォルダのファイルは変わらない
      - '`/extra/` が 404 の not-found を返す'
    test: test_normal_when_source_deleted
  - name: 異常シナリオ（スキーマに通らない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す一時フォルダの `settings.yaml`'
        notes: '`sources` に sample の 1 行'
      - name: dev-docs
        description: 端末の設定で起動した dev-docs
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面

        U->>UI: 配信元を追加し、id を Sample Docs、scope.read に空の行を含めて保存する
        UI->>UI: 追加した後の端末の設定をスキーマで検証して失敗する
        UI-->>U: 違反したキーと理由
      ```
    expected:
      - 保存できなかったことと、違反したキー `sources[1].id`・`sources[1].scope.read` とそれぞれの理由が出る
      - 入れた値が入力欄に残る
      - '`settings.yaml` が変わらず、`/sample/` は 200 を返す'
    test: test_error_when_schema_invalid
  - name: 異常シナリオ（別のオリジンから書き込む）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す一時フォルダの `settings.yaml`'
        notes: '`sources` に sample の 1 行'
      - name: 別のオリジンのページ
        description: dev-docs と別のポートで配信したページ。端末の設定の保存を dev-docs へ送信する
        notes: 送信する内容はスキーマに通る端末の設定
      - name: dev-docs
        description: 端末の設定で起動した dev-docs
    flow: |-
      ```mermaid
      sequenceDiagram
        participant OP as 別のオリジンのページ
        participant DD as dev-docs

        OP->>DD: 端末の設定の保存を送信する
        DD-->>OP: 403 で断る
      ```
    expected:
      - 応答が 403
      - '`settings.yaml` が変わらず、`/sample/` は 200 を返す'
    test: test_error_when_cross_origin
  - name: 正常シナリオ（追加した配信元が検証に通らない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 検証に失敗する配信元
        description: '`dev-docs.yaml` の `documents[0]` に必須のキー `paths` が無い配信元。端末の設定にはまだ無い'
        notes: id `broken`
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す一時フォルダの `settings.yaml`'
        notes: '`sources` に sample の 1 行'
      - name: dev-docs
        description: 端末の設定で起動した dev-docs
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant CF as 端末の設定

        U->>UI: 配信元を追加し、broken の id・config・scope.read を入れて保存する
        UI->>UI: 追加した後の端末の設定をスキーマで検証する
        UI->>CF: settings.yaml を書き換える
        UI->>UI: 配信元を読み直し、起動時と同じ検証で broken を配信から外す
        UI-->>U: settings（broken を配信していない一覧）
      ```
    expected:
      - '`settings.yaml` の `sources` に broken の行が追加される'
      - 一覧の broken が配信していない状態で、検証で外した理由（`documents[0]` に必須のキー `paths` が無い）が出る
      - '`/broken/` が 404 の not-found を返し、`/sample/` は 200 を返す'
    test: test_normal_when_added_source_invalid
lead: 利用者が `/_settings/` で端末の設定の `sources[]` を追加・削除・編集し、保存して配信元を読み直す。
issue: 3
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: '`settings.yaml` を手で開かずに配信元を追加・削除でき、配信していない配信元とその理由が画面で分かる'
  - name: エージェント（Claude Code）
    interest: 保存した後、dev-docs を再起動せずに追加した配信元の文書を読める
trigger: 利用者がブラウザで `/_settings/` か `/` を開く
preconditions:
  - dev-docs が起動している
success_guarantee: スキーマに通った端末の設定だけを `settings.yaml` に書き、書いた設定で配信元を読み直す。
minimal_guarantee: スキーマに通らない保存と、画面と別のオリジンからの書き込みでは `settings.yaml` を書き換えず、配信中の配信元はそのまま配信する。
frequency: 配信元を追加・削除するたび
priority: 中
refs:
  - dev/設計書/シナリオ/複合ユースケース/dev-docsで文書を配信して読み書きする#scenarios[正常シナリオ]
