title: "配信元を追加する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実環境で実行。Claude Code は `claude -p` で動かし、AskUserQuestion には既定の選択肢で答える）
      - name: dev-docs
        description: '端末の設定（`sources: []`）で待ち受けている dev-docs'
      - name: サンプルの配信元
        description: 文書の種類を 1 つ（スキーマと YAML 2 件）と `dev-docs.yaml` を持つ git リポジトリ
        notes: 引数に渡すパス。id `sample`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant SK as setup のスキル
        participant AD as 管理の MCP
        participant CF as 端末の設定

        U->>SK: /dev-docs:setup {sample のパス}
        SK->>AD: check_project（sample のパス）
        AD-->>SK: 設定のバージョンの新旧（同じ）・違反 0 件・索引の同期の件数
        SK->>U: scope.write・scope.read を既定の値つきで聞く
        U-->>SK: 既定の値（scope.write は sample のパス、scope.read は {path}/**）
        SK-->>U: 書き込む行を表で示して確かめる
        U-->>SK: 了承
        SK->>CF: sources に sample の行を書く
        SK->>AD: reload
        SK-->>U: 追加した配信元と check_project の結果を出す
      ```
    expected:
      - 端末の設定の `sources` に sample の行があり、`scope.write` が sample のパス、`scope.read` が `{sample のパス}/**` になっている
      - '`check_project` が違反と索引の同期の件数を 0 で返す'
      - sample のフォルダで呼んだ `describe` が `sample`（読み書き）を返す
      - '`reload` の前後で `/mcp` のセッションが切れず、ツールは 6 つのまま'
      - スキルの応答に、書き込んだ行の表と `check_project` の結果がある
    test: test_normal
  - name: 正常シナリオ（YAML でない範囲を加える）
    setup:
      - name: Mock
        description: なし（実環境で実行）
        notes: '-'
      - name: dev-docs
        description: 正常シナリオと同じ
        notes: '-'
      - name: Markdown を持つ配信元
        description: '`docs/` に Markdown 2 件と、ベンダーのコードの Markdown `docs/vendor/lib.md` を持ち、`dev-docs.yaml` も管理用の YAML も無い git リポジトリ'
        notes: 範囲の質問に既定の `**/*.md` を答える
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant SK as setup のスキル
        participant CL as dev-docs の CLI
        participant FS as 配信元のフォルダ
        participant AD as 管理の MCP
        participant CF as 端末の設定

        U->>SK: /dev-docs:setup {配信元のパス}
        SK->>FS: dev-docs.yaml が無いことを確かめる（バージョンの比較を飛ばす）
        SK->>U: scope・範囲・仮のメタデータを聞く
        U-->>SK: 既定の値
        SK->>CL: dev-docs files --root {配信元のパス} --paths **/*.md
        CL-->>SK: 載せるファイル（docs/vendor/ の下を含まない）
        SK-->>U: dev-docs.yaml・管理用の YAML・sources の行を表で示して確かめる
        U-->>SK: 了承
        SK->>FS: 雛形から dev-docs.yaml を作る（1 行目にクローンのバージョンのタグのスキーマの行。管理用の YAML を読む documents の行。records: files）
        SK->>FS: templates/files.schema.yaml に沿って管理用の YAML を書く
        SK->>AD: check_project（配信元のパス）
        AD-->>SK: 違反 0 件・索引の同期の件数 0
        SK->>CF: sources に行を書く
        SK->>AD: reload
        SK-->>U: 追加した配信元と結果を出す
      ```
    expected:
      - 配信元に `dev-docs.yaml` と管理用の YAML ができ、管理用の YAML に Markdown 2 件の行が仮のメタデータつきで並ぶ
      - '`dev-docs.yaml` の 1 行目が `# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/dev-docs/v{クローンのバージョン}/schemas/dev-docs.schema.json` で、`documents[]` の行が `type` を持たない'
      - 管理用の YAML の行が `templates/files.schema.yaml` の検証に通る
      - '`reload` の後、`search_docs` が Markdown 2 件を返す'
      - 範囲から `.git`・`node_modules`・`.claude/worktrees` の下のファイルは除かれる
      - 管理用の YAML に `docs/vendor/lib.md` の行は無い（初回の setup でも除外の条件が当たる）
    test: test_normal_when_non_yaml_range
  - name: 正常シナリオ（2 回目以降）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 登録済みの配信元
        description: YAML でない範囲の正常シナリオを済ませた配信元
        notes: その後に Markdown を 1 件追加・1 件削除し、1 件を `git mv` で改名して commit する。その commit でワークツリーを作る（クローン本体には `write_docs` で書き込めない）
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant SK as setup のスキル
        participant DM as 文書の MCP
        participant AD as 管理の MCP

        U->>SK: 配信元のワークツリーで /dev-docs:setup
        SK->>SK: 既にある sources の行と管理用の YAML を読む
        SK->>SK: 範囲のファイルと管理用の YAML の行を突き合わせる（Git はリネームを検出する）
        SK-->>U: 追加・削除・改名の行を表で示して確かめる
        U-->>SK: 了承
        SK->>DM: write_docs（管理用の YAML の行を直す）
        SK->>AD: check_project
        SK->>AD: reload
        SK-->>U: 直した行と結果を出す
      ```
    expected:
      - 管理用の YAML に追加したファイルの行が増え、削除したファイルの行が消える
      - 改名したファイルの行は、パスだけが新しくなり、メタデータは元の値を保つ
      - scope・範囲の質問はしない
      - '`check_project` が索引の同期の件数を 0 で返す'
    test: test_normal_when_rerun
  - name: 正常シナリオ（Git 管理外の配信元の 2 回目以降）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 登録済みの Git 管理外の配信元
        description: Markdown を持つ Git 管理外のフォルダを登録した後、1 件を中身を変えずに改名する
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant SK as setup のスキル
        participant DM as 文書の MCP

        U->>SK: /dev-docs:setup {配信元のパス}
        SK->>SK: 消えた行のファイルと新しいファイルを内容のハッシュで突き合わせる
        SK-->>U: 改名の行を表で示して確かめる
        U-->>SK: 了承
        SK->>DM: write_docs（行のパスを直す）
        SK-->>U: 直した行を出す
      ```
    expected:
      - 改名したファイルの行は、パスだけが新しくなり、メタデータは元の値を保つ
    test: test_normal_when_rerun_outside_git
  - name: 異常シナリオ（配信元の設定が検証に通らない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 壊れた配信元
        description: '`dev-docs.yaml` がスキーマに違反するフォルダ'
        notes: '`documents[]` の必須のキー `paths` が無い'
      - name: 端末の設定
        description: '`sources` に sample の 1 行'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant SK as setup のスキル
        participant AD as 管理の MCP

        U->>SK: /dev-docs:setup {壊れた配信元のパス}
        SK->>U: scope・範囲を聞き、表で確かめる
        U-->>SK: 了承
        SK->>AD: check_project
        AD-->>SK: 違反（キーのパスと理由）
        SK-->>U: 違反を示して止まる
      ```
    expected:
      - 端末の設定は変わらず、sample の配信は続く
      - スキルの応答に `documents[0].paths` と理由が出る
    test: test_error_when_source_config_invalid
  - name: 正常シナリオ（スキーマの行のタグが古い）
    setup:
      - name: Mock
        description: なし（実環境で実行）
        notes: '-'
      - name: 登録済みの配信元
        description: '`dev-docs.yaml` の 1 行目のスキーマの行のタグが、クローンのバージョンより古い配信元'
        notes: タグは `v0.0.1`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant SK as setup のスキル
        participant FS as 配信元のフォルダ
        participant AD as 管理の MCP

        U->>SK: /dev-docs:setup {配信元のパス}
        SK->>FS: dev-docs.yaml の 1 行目のスキーマの行を読む
        SK->>SK: タグをクローンのバージョンと比べる
        SK-->>U: スキーマの行の書き換えを候補の表で示して確かめる
        U-->>SK: 了承
        SK->>FS: 1 行目をクローンのバージョンのタグのスキーマの行にする
        SK->>AD: check_project
        SK-->>U: 書き換えた行と結果を出す
      ```
    expected:
      - '`dev-docs.yaml` の 1 行目のタグが `v{クローンのバージョン}` になり、2 行目以降は変わらない'
      - '`check_project` が違反を 0 件で返す'
    test: test_normal_when_schema_line_outdated
  - name: 正常シナリオ（スキーマの行が無い）
    setup:
      - name: Mock
        description: なし（実環境で実行）
        notes: '-'
      - name: 登録済みの配信元
        description: '`dev-docs.yaml` の 1 行目にスキーマの行が無い配信元'
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant SK as setup のスキル
        participant FS as 配信元のフォルダ
        participant AD as 管理の MCP

        U->>SK: /dev-docs:setup {配信元のパス}
        SK->>FS: dev-docs.yaml の 1 行目を読み、スキーマの行が無いことを確かめる
        SK-->>U: スキーマの行の追加を候補の表で示して確かめる
        U-->>SK: 了承
        SK->>FS: クローンのバージョンのタグのスキーマの行を 1 行目に入れる
        SK->>AD: check_project
        SK-->>U: 追加した行と結果を出す
      ```
    expected:
      - '`dev-docs.yaml` の 1 行目が `v{クローンのバージョン}` のタグのスキーマの行になり、元の 1 行目以降はそのまま続く'
      - '`check_project` が違反を 0 件で返す'
    test: test_normal_when_schema_line_missing
  - name: 正常シナリオ（移せなかった設定を移す）
    setup:
      - name: Mock
        description: なし（実環境で実行）
        notes: '-'
      - name: 移せない設定を持つ配信元
        description: '`version: "1"` の `dev-docs.yaml` の `documents[0]` が `type: markdown`・`paths: [docs/**/*.md]`・`defaults: [{paths: [docs/**], tags: [doc]}]` を持ち、`docs/` にフロントマターで `name` を持つ Markdown 2 件を置く配信元'
        notes: '`dev-docs migrate --source` が違反で止まった後の状態'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant SK as setup のスキル
        participant AD as 管理の MCP
        participant FS as 配信元のフォルダ

        U->>SK: /dev-docs:setup {配信元のパス}
        SK->>AD: check_project
        AD-->>SK: 設定のバージョンが古いことと、documents[0] の type・defaults の違反
        SK->>FS: 範囲の Markdown のフロントマターと defaults の値を読む
        SK-->>U: 管理用の YAML の行と、書き換えた documents の行を候補の表で示して確かめる
        U-->>SK: 了承
        SK->>FS: 管理用の YAML を書き、documents[0] を管理用の YAML を読む行にし、version とスキーマの行を新しくする
        SK->>FS: Markdown からフロントマターを消す
        SK->>AD: check_project
        SK->>AD: reload
        SK-->>U: 移した行と結果を出す
      ```
    expected:
      - '管理用の YAML に Markdown 2 件の行が並び、各行がフロントマターの `name` と `defaults` の `tags: [doc]` を持つ'
      - '`documents[0]` が `type`・`defaults` を持たず、`records: files`・`body_file: path` で管理用の YAML を読む行になる'
      - '`dev-docs.yaml` の `version` が新しいバージョンになり、1 行目が `v{クローンのバージョン}` のタグのスキーマの行になる'
      - Markdown 2 件がフロントマターを持たず、本文は変わらない
      - '`check_project` が違反を 0 件で返し、`reload` の後の `search_docs` が 2 件を元の `name` で返す'
    test: test_normal_when_source_config_unmigratable
  - name: 正常シナリオ（除外の条件と関連の候補）
    setup:
      - name: Mock
        description: なし（実環境で実行）
        notes: '-'
      - name: 設計書を配信している配信元
        description: '`dev-docs.yaml` が設計書の行 `design`（YAML の文書。`design/repo.yaml` が id `design/repo` と `implementation: src/tasks/repo.py` を持つ）と、管理用の YAML を読む行 `src`（`paths: [src/files.yaml]`・`records: files`・`body_file: path`）を持ち、端末の設定に登録済みの git リポジトリ。`src/files.yaml` は `files: []`'
        notes: '`dev-docs.yaml` は `related.types[]` を書かない'
      - name: 範囲のファイル
        description: '`src/` に `tasks/repo.py`・`tasks/test_repo.py`・空の `tasks/__init__.py`・`uv.lock`・`logo.png` を置き commit する。その commit でワークツリーを作る'
        notes: 実装のパスを持つ設計書の質問に、種類 `design`・キー `implementation` を答える
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant SK as setup のスキル
        participant CL as dev-docs の CLI
        participant DM as 文書の MCP
        participant AD as 管理の MCP

        U->>SK: 配信元のワークツリーで /dev-docs:setup
        SK->>CL: dev-docs files --root {配信元のパス} --paths src/**
        CL-->>SK: 載せるファイル（除外の条件に当たるファイルは含まない）
        SK->>SK: 載せるファイルのうち管理用の YAML に行が無いものを追加する行にする
        SK->>U: 実装のパスを持つ設計書の種類とキーを聞く（既定は無し）
        U-->>SK: 種類 design、キー implementation
        SK->>DM: search_docs(filter: kind が design, format: json)
        DM-->>SK: design/repo（implementation は src/tasks/repo.py）
        SK->>SK: テストに tests、キーの値とパスが一致するコードに implements の候補を付ける
        SK-->>U: 追加する行と関連の候補を表で示して確かめる
        U-->>SK: 了承
        SK->>DM: write_docs（管理用の YAML の行を追加する）
        SK->>AD: check_project
        AD-->>SK: 違反 0 件・索引の同期の件数 0
        SK->>AD: reload
        SK-->>U: 追加した行と結果を出す
      ```
    expected:
      - 管理用の YAML に `tasks/repo.py` と `tasks/test_repo.py` の 2 行だけが並び、`tasks/__init__.py`・`uv.lock`・`logo.png` の行は無い
      - '`tasks/repo.py` の行が `related: [{to: design/repo, type: implements}]` を持つ'
      - '`tasks/test_repo.py` の行が `related: [{to: src/tasks/repo, type: tests}]` を持つ'
      - 確認の表に `implements`・`tests` の候補が出る
      - '`check_project` が違反と索引の同期の件数を 0 で返す（除外した 3 件を索引に無いファイルとして数えない）'
      - '`reload` の後、`design/repo` を起点にした `direction: in` の `trace_related` が `src/tasks/repo` を返す'
    test: test_normal_when_excluded_and_related_candidates
lead: 利用者が `/dev-docs:setup [path]` で、フォルダを配信元として端末の設定に並べ、文書の MCP で読めるようにする。2 回目以降は範囲のファイルの増減・改名を管理用の YAML に合わせる。
issue: 4
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: どの作業場所から読み書きできるかを質問に答えるだけで決められ、書き込む前に内容を表で確かめられる
  - name: エージェント（Claude Code）
    interest: 追加した配信元を、セッションを張り直さずに `describe` と `search_docs` で使える
trigger: 利用者が `/dev-docs:setup [path]` を実行する（path を省くと今の作業場所）
preconditions:
  - '`/dev-docs:global-setup` を済ませ、dev-docs が待ち受けている'
  - path のフォルダが YAML の文書とそのスキーマを持つ（git リポジトリか Git 管理外のフォルダ）
success_guarantee: 端末の設定の `sources` に配信元の行があり、`check_project` が違反を返さない。`reload` の後、`scope.read` に当たる作業場所の `describe` がその配信元を返す。
minimal_guarantee: '`check_project` が違反を返したときと、利用者が確認の表を断ったときは、端末の設定を書き換えない。既にある配信元の配信は止まらない。'
frequency: 配信元ごとに 1 回。範囲のファイルを大きく増減・改名したとき
priority: 高
refs:
  - dev/設計書/シナリオ/複合ユースケース/dev-docsで文書を配信して読み書きする#scenarios[正常シナリオ]
test_file: tests/e2e/単一ユースケース/test_配信元を追加する.py
