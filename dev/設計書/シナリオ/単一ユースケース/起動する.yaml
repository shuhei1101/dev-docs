title: "起動する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実環境で実行。`dev-docs serve` を子プロセスで起動する）
      - name: サンプルの配信元
        description: 文書の種類を 1 つ（スキーマと YAML 2 件）と `dev-docs.yaml` を持つ git リポジトリ
        notes: id `sample`
      - name: 読み取りだけの配信元
        description: 文書の種類を 1 つと `dev-docs.yaml` を持つ Git 管理外のフォルダ
        notes: id `notes`
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す `settings.yaml`'
        notes: '`sources` に sample と notes の 2 行'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant DD as dev-docs
        participant CF as 端末の設定・配信元の設定

        U->>DD: dev-docs serve
        DD->>CF: 端末の設定を読み、スキーマで検証する
        loop sources の各行
          DD->>CF: config の YAML を上から順に読んでマージする
          DD->>DD: マージした設定をスキーマで検証し、検査・変換・生成のスクリプトを実行できるか確かめる
          DD->>DD: 画面の API と文書の MCP の配信元に加える
        end
        DD->>DD: 127.0.0.1:8781 で待ち受ける
        DD-->>U: 待ち受けたアドレスと配信している配信元を標準出力に出す
      ```
    expected:
      - '`127.0.0.1:8781` で待ち受け、`0.0.0.0` では待ち受けない'
      - '`/_api/sources/sample/docs` と `/_api/sources/notes/docs` が 200 を返す'
      - '`/_api/`・`/mcp`・`/_admin/` 以外のパスが画面の `index.html` を返す'
      - '`/mcp` のツールが `search_docs`・`write_docs`・`delete_docs`・`describe`・`list_changes`・`trace_related` の 6 つ'
      - '`/_admin/mcp` のツールが `status`・`reload`・`restart`・`update`・`check_project`・`try_convert` の 6 つ'
      - 標準出力に待ち受けたアドレスと、配信している配信元の id（sample・notes）が出る
    test: test_normal
  - name: 正常シナリオ（設定の YAML を重ねる）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: サンプルの配信元
        description: '`dev-docs.yaml` と、その環境だけの設定の YAML（`dev-docs.local.yaml`）を持つ git リポジトリ'
        notes: 後の YAML が `description` を上書きし、`documents[]` に `id` が同じ行（`paths` を変える）と新しい行を 1 つずつ持つ
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す `settings.yaml`'
        notes: sample の `config` が `[dev-docs.yaml, dev-docs.local.yaml]` の順
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant DD as dev-docs
        participant CF as 配信元の設定

        U->>DD: dev-docs serve
        DD->>CF: dev-docs.yaml を読む
        DD->>CF: dev-docs.local.yaml を読み、同じキーを上書きし、documents を id で行ごとに上書き・追加する
        DD->>DD: マージした設定をスキーマで検証する
        DD-->>U: sample を配信する
      ```
    expected:
      - '`describe(source: sample)` の説明が後の YAML の `description` になる'
      - '`id` が同じ `documents[]` の行は後の YAML の `paths` の文書を返し、前の YAML だけにある `paths` の文書は返さない'
      - 後の YAML で追加した `documents[]` の行の文書を `search_docs` が返す
    test: test_normal_when_configs_merged
  - name: 正常シナリオ（設定のバージョンが古い）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 古い配信元
        description: '`version` がサーバーが読めるバージョンより古い `dev-docs.yaml` を持つ配信元'
        notes: id `old`。マージした設定は今のスキーマを満たす
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す `settings.yaml`'
        notes: '`sources` に old の 1 行'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant DD as dev-docs

        U->>DD: dev-docs serve
        DD->>DD: old の設定の version をサーバーが読めるバージョンと比べる
        DD->>DD: 古い設定の配信元として状態に持つ
        DD-->>U: old を配信する
      ```
    expected:
      - '`/_api/sources/old/docs` が 200 を返す'
      - 警告のログに old の id・設定のバージョン・サーバーが読めるバージョンが残る
    test: test_normal_when_config_version_old
    notes:
      知らせる経路: '古い設定の配信元は、管理の MCP の `check_project` と、正常シナリオ（待ち受けているサーバーの文脈を追加する）の SessionStart の文脈でも知らせる。'
  - name: 異常シナリオ（設定の検証に失敗する）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: サンプルの配信元
        description: 検証に通る配信元
        notes: id `sample`
      - name: 壊れた配信元
        description: '`dev-docs.yaml` がスキーマに違反する配信元'
        notes: id `broken`。`documents[]` の必須のキー `paths` が無い
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す `settings.yaml`'
        notes: '`sources` に sample と broken の 2 行'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant DD as dev-docs

        U->>DD: dev-docs serve
        DD->>DD: sample の設定を検証して配信元に加える
        DD->>DD: broken の設定の検証に失敗する
        DD->>DD: broken を配信せず、エラーログに残す
        DD-->>U: sample だけを配信する
      ```
    expected:
      - '`/_api/sources/broken/docs` が 404 を返し、`/_api/sources/sample/docs` と `/mcp` は応答する'
      - 'エラーログに `broken: documents[0].paths: 必須のキーが無い` の形で、配信元の id・違反したキーのパス・理由が残る'
      - '`/_admin/mcp` に MCP のセッションを張れる'
    test: test_error_when_source_config_invalid
  - name: 異常シナリオ（スクリプトを実行できない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: サンプルの配信元
        description: 検証に通る配信元
        notes: id `sample`
      - name: スクリプトの無い配信元
        description: '`converters[]` が無いファイルを指す配信元'
        notes: id `noscript`
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す `settings.yaml`'
        notes: '`sources` に sample と noscript の 2 行'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant DD as dev-docs

        U->>DD: dev-docs serve
        DD->>DD: noscript の converters のスクリプトを実行できるか確かめ、失敗する
        DD->>DD: noscript を配信せず、エラーログに残す
        DD-->>U: sample だけを配信する
      ```
    expected:
      - '`/_api/sources/noscript/docs` が 404 を返し、`/_api/sources/sample/docs` は応答する'
      - エラーログに noscript の id・`converters[0]` のキーのパス・スクリプトが見つからない理由が残る
    test: test_error_when_script_not_executable
  - name: 異常シナリオ（端末の設定がスキーマに違反する）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す `settings.yaml`'
        notes: '`sources[0]` に必須のキー `config` が無く、`port` が整数でない'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant DD as dev-docs

        U->>DD: dev-docs serve
        DD->>DD: 端末の設定の検証に失敗する
        DD-->>U: 違反を標準エラーに出して終わる
      ```
    expected:
      - プロセスが 0 以外の終了コードで終わり、ポートを待ち受けない
      - '標準エラーに `{ファイル}: sources[0].config: 必須のキーが無い` の形で違反が全て並ぶ'
    test: test_error_when_terminal_config_invalid
  - name: 異常シナリオ（ポートが使用中）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 使用中のポート
        description: テストが先に待ち受けたポート
        notes: '`DEV_DOCS_PORT` にそのポートを入れる'
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す `settings.yaml`'
        notes: '`sources` に検証に通る 1 行'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant DD as dev-docs

        U->>DD: dev-docs serve
        DD->>DD: ポートで待ち受けられない
        DD-->>U: ポートと DEV_DOCS_PORT を標準エラーに出して終わる
      ```
    expected:
      - プロセスが 0 以外の終了コードで終わる
      - 標準エラーに使用中のポートの番号と、`DEV_DOCS_PORT` で変えられることが出る
    test: test_error_when_port_in_use
  - name: 正常シナリオ（文書のメタデータと管理用の YAML がずれている）
    setup:
      - name: Mock
        description: なし（実環境で実行）
        notes: '-'
      - name: 列の欠けた文書
        description: '配信元 sample の文書の行 `rules` が `metadata: {name: title}` を持ち、2 件のうち 1 件に `title` が無い'
        notes: '`metadata` に書いていないキー（同じ名前の列）の欠けは数えない'
      - name: ずれた管理用の YAML
        description: 'sample の `src/files.yaml` が `a.py` と `c.py` の 2 行を持ち、`src/` には `a.py` と `d.py` を置く。行 `src` は `records: files`・`body_file: path`'
        notes: '`c.py` はファイルが無い行、`d.py` は索引に無いファイル'
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す `settings.yaml`'
        notes: '`sources` に sample の 1 行'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant DD as dev-docs
        participant ST as 配信元の文書

        U->>DD: dev-docs serve
        DD->>DD: sample の設定を検証して配信元に加える
        DD->>ST: 文書を読む
        DD->>DD: metadata に書いた列が無い文書を数える
        DD->>DD: 管理用の YAML のフォルダの配下で files に無いファイルを数え、読み込みの missing_body_file を数える
        DD->>DD: 件数を警告のログに残す（配信元の状態には持たない）
        DD-->>U: sample を配信する
      ```
    expected:
      - '`/_api/sources/sample/docs` が 200 を返す'
      - 警告のログに sample の id と、行 `rules` の `metadata` の列の欠け 1 件（`name` の `title`）が残る
      - 警告のログに行 `src` の索引に無いファイル 1 件（`src/d.py`）とファイルが無い行 1 件（`c.py`）が残る
      - '`search_docs` が `title` の無い文書も返し、その `name` はファイル名から拡張子を除いた名前になる'
    test: test_normal_when_metadata_out_of_sync
  - name: 正常シナリオ（SessionStart で起動する）
    setup:
      - name: Mock
        description: なし（実環境で実行。Claude Code は `claude -p` で動かす）
      - name: Claude Code の設定の場所
        description: '`CLAUDE_CONFIG_DIR` が指すテスト用の一時フォルダ。プラグイン `dev-docs` をユーザースコープに入れ、env の `DEV_DOCS_CONFIG` が端末の設定を指す'
      - name: 端末の設定
        description: '`clone` がテスト用のクローン、`sources` に sample（読み書き）と notes（読み取りだけ）の 2 行'
        notes: dev-docs は待ち受けていない。ポート 8781 が空き
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code
        participant HK as SessionStart のフック
        participant DD as dev-docs

        U->>CC: sample のワークツリーでセッションを始める
        CC->>HK: SessionStart
        HK->>DD: ポートにつながるか確かめる（つながらない）
        HK->>DD: 端末の設定の clone で dev-docs serve を切り離して起動する
        HK-->>CC: 待たずに戻り、/mcp のつなぎ直しの案内を文脈に追加する
        U->>CC: /mcp でつなぎ直す
        CC->>DD: /mcp のツールの一覧を取る
      ```
    expected:
      - フックが 0 の終了コードで戻り、セッションの文脈に `/mcp` のつなぎ直しの案内が入る
      - '`127.0.0.1:8781` を待ち受ける dev-docs のプロセスが 1 つだけあり、セッションを終えても残る'
      - つなぎ直した後、`/mcp` のツールが 6 つ返る
    test: test_normal_when_started_by_session_start
  - name: 正常シナリオ（待ち受けているサーバーの文脈を追加する）
    setup:
      - name: Mock
        description: なし（実環境で実行。Claude Code は `claude -p` で動かす）
      - name: dev-docs
        description: SessionStart で起動する正常シナリオと同じ端末の設定で待ち受けている dev-docs
        notes: sample のワークツリーで、管理用の YAML の `files` に無いファイルを 1 件置き、配信元 old（設定が古い）も `sources` に並べる
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code
        participant HK as SessionStart のフック
        participant DD as dev-docs

        U->>CC: sample のワークツリーでセッションを始める
        CC->>HK: SessionStart
        HK->>DD: ポートにつながる
        HK->>DD: cwd で使える配信元・索引の同期の件数・設定のバージョンの新旧を取る
        HK-->>CC: 配信元の一覧と短い使い方を文脈に追加する
        CC->>DD: /mcp につながる
      ```
    expected:
      - セッションの文脈に、使える配信元 `sample`（読み書き）・`notes`（読み取りだけ）の名前・権限・`description` が 1 行ずつ入る
      - 文脈に `describe(source)` で種類と書き方を確かめること、タグは `search_docs` の `group_by="tags"` で使われているタグを見て同じ意味のタグを使い回すこと、`source="*"`・`view="full"`・`list_changes` の使い方と、範囲のファイルを作った・消した・改名したら管理用の YAML の行を直す 1 文が入る
      - 文脈に sample の索引の同期の件数 1 と、old の設定が古いことが入る
      - dev-docs のプロセスは増えず、つなぎ直しの案内は入らない
    test: test_normal_when_session_context_added
  - name: 異常シナリオ（SessionStart で起動できない）
    setup:
      - name: Mock
        description: なし（実環境で実行。Claude Code は `claude -p` で動かす）
      - name: Claude Code の設定の場所
        description: env の `DEV_DOCS_CONFIG` が無いファイルを指す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code
        participant HK as SessionStart のフック

        U->>CC: セッションを始める
        CC->>HK: SessionStart
        HK->>HK: ポートにつながらず、端末の設定を読めない
        HK-->>CC: 0 の終了コードで戻り、理由と /dev-docs:global-setup の案内を文脈に追加する
      ```
    expected:
      - フックが 0 の終了コードで戻り、セッションは続く
      - セッションの文脈に、端末の設定を読めなかった理由と `/dev-docs:global-setup` の案内が入る
      - dev-docs のプロセスは起動しない
    test: test_error_when_session_start_cannot_start
  - name: 異常シナリオ（配信元の設定が前の形式）
    setup:
      - name: Mock
        description: なし（実環境で実行）
        notes: '-'
      - name: サンプルの配信元
        description: 検証に通る配信元
        notes: id `sample`
      - name: 前の形式の配信元
        description: '`version: "1"` の `dev-docs.yaml` を持ち、最上位にタグのマスター `tags: tags.yaml` を持ち、`documents[0]` が `paths`・`schema`・`type: markdown`、`documents[1]` が `paths`・`schema`・`type: yaml`・`metadata: {name: {type: ref, field: title}}`・`defaults: [{paths: [docs/**], tags: [doc]}]` を持つ配信元'
        notes: id `legacy`。`tags.yaml` は置く。違反は `tags`・`type`・`defaults`・オブジェクトの `metadata` だけになる
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す `settings.yaml`'
        notes: '`sources` に sample と legacy の 2 行'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant DD as dev-docs

        U->>DD: dev-docs serve
        DD->>DD: sample の設定を検証して配信元に加える
        DD->>DD: legacy の設定が tags・type・defaults・オブジェクトの metadata で検証に失敗する
        DD->>DD: legacy を配信せず、違反と設定のバージョンが古いことをエラーログに残す
        DD-->>U: sample だけを配信する
      ```
    expected:
      - '`/_api/sources/legacy/docs` が 404 を返し、`/_api/sources/sample/docs` は応答する'
      - エラーログに legacy の id と、`tags`・`documents[0].type`・`documents[1].type`・`documents[1].defaults`・`documents[1].metadata.name` のそれぞれの違反が残る
      - エラーログに、legacy の設定のバージョンが古く `dev-docs migrate --source` で移し替えられることが残る
    test: test_error_when_source_config_legacy
  - name: 正常シナリオ（設定とスキーマを default_ref から読む）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: default_ref のブランチ
        description: sample の `develop` ブランチに、文書の種類 `kind_a` を加えた `dev-docs.yaml` とそのスキーマを commit する
        notes: '`dev-docs.yaml` の `default_ref` は `develop`。クローン本体は `master` を checkout したままで、`master` の `dev-docs.yaml` は `kind_a` を持たない'
      - name: 端末の設定
        description: '`sources[].config` が sample のクローン本体の `dev-docs.yaml` を指す'
      - name: ワークツリー
        description: sample の `.claude/worktrees/develop`（`develop` を checkout）
        notes: 配信元の設定の `worktrees` は既定（`[./.claude/worktrees/*]`）
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant S as dev-docs のサーバー
        participant G as sample のリポジトリ

        U->>S: 起動する
        S->>G: ディスクの dev-docs.yaml の default_ref を読む
        S->>G: develop の dev-docs.yaml とスキーマを読む
        S->>S: develop の設定で配信元を組み立てる
        S-->>U: 配信を始める
        U->>G: develop に文書の種類 kind_b を commit する
        U->>S: describe(source: sample)
        S->>G: default_ref の commit を確かめ、変わっていれば組み立て直す
        S-->>U: 種類の一覧（kind_a・kind_b を含む）
      ```
    expected:
      - 'クローン本体が `master` のままでも、起動直後の `describe(source: sample)` の種類の一覧に `kind_a` が載る'
      - '`documents[].schema` のスキーマを `develop` から読む'
      - '`develop` に `kind_b` を commit した後の `describe(source: sample)` で、`reload` をしなくても種類の一覧に `kind_a`・`kind_b` が載る'
      - '`worktrees[]` の相対パスをメインのリポジトリの直下から数え、ワークツリー `.claude/worktrees/develop` に当たる'
      - Git でない配信元はディスクの設定を読む
    test: test_normal_when_config_read_from_default_ref
  - name: 正常シナリオ（エイリアスのキーと nav の条件を検証する）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: エイリアスのキーの違反
        description: sample の `alias_type` を持つ行の文書 1 件の `aliases` を数値（文字列でも文字列の並びでもない）にする
      - name: 0 件に当たる nav の条件
        description: sample の `nav` に、どの文書にも付いていないタグ `none` を `auto` の `filter`（`tags` が `none`）に記載したタブを置く
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant S as dev-docs のサーバー

