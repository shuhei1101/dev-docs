summary: ユーザーの 1 操作の範囲の正常・異常のシナリオ
items:
  - page: 起動する.yaml
    summary: '`dev-docs serve` の待ち受けと配信元ごとの起動時の検証、SessionStart のフックでの起動と文脈の追加'
  - page: エージェントが調べる.yaml
    summary: '`describe`・`search_docs`・`trace_related` と、権限・ワークツリー・横断検索・1 セッション 1 回'
  - page: エージェントが書き込む.yaml
    summary: '`write_docs`・`delete_docs` と、検査・書き込む作業ツリー・参照されている文書の削除'
  - page: 変更をレビューする.yaml
    summary: '`list_changes` の区間の解決と変わった文書・差分の行'
  - page: YAMLを直接編集した.yaml
    summary: 直接編集した YAML の読み直しと、読んだ後に変わった文書への書き込み
  - page: dev-docsを入れる.yaml
    summary: '`/dev-docs:global-setup` の端末の設定・env の用意と、2 回目以降のバージョンの確認'
  - page: 配信元を追加する.yaml
    summary: '`/dev-docs:setup` の配信元の登録と、2 回目以降の管理用の YAML の突き合わせ'
  - page: 設定・スクリプトを変える.yaml
    summary: '`check_project`・`try_convert` での確認と `reload` での反映'
  - page: dev-docsを更新する.yaml
    summary: '`update` での更新と `dev-docs migrate` での端末の設定の移し替え'
