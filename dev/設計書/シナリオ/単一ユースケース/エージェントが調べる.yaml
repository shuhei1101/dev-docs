title: "エージェントが調べる"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実環境で実行。フックが入れる `cwd`・`session_id`・`agent_id` はテストが引数に入れる）
      - name: サンプルの配信元
        description: 文書の種類を 1 つ（スキーマと YAML 2 件。片方の `related` がもう片方を指す）と `dev-docs.yaml` を持つ git リポジトリ
        notes: id `sample`。`scope.read`・`scope.write` は sample のフォルダ
      - name: 読み取りだけの配信元
        description: 文書の種類を 1 つと `dev-docs.yaml` を持つ Git 管理外のフォルダ
        notes: id `notes`。`scope.read` は sample のフォルダ
      - name: dev-docs
        description: 上の 2 つを配信している dev-docs
        notes: '`cwd` は sample のクローン本体'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant M as 文書の MCP（/mcp）
        participant ST as 配信元の文書

        A->>M: describe()
        M-->>A: 使える配信元の一覧（sample は読み書き、notes は読み取りだけ）
        A->>M: describe(source: sample)
        M-->>A: 説明書と種類の一覧
        A->>M: search_docs(filter: kind が sample の種類, view: summary)
        M->>M: source を省いたので作業中の配信元 sample を指し、scope.read を確かめる
        M->>ST: 文書を読む
        M-->>A: id・name・概要文・文字数・version の表と総件数
        A->>M: search_docs(filter: id が文書 1, view: full)
        M-->>A: 文書 1 の本文
        A->>M: trace_related(from_ids: 文書 1)
        M-->>A: 文書 1 から related でたどった文書 2
      ```
    expected:
      - '`describe()` が sample を読み書き、notes を読み取りだけとして返す'
      - '`describe(source: sample)` が説明書と種類の一覧を返す'
      - '`source` を省いた `search_docs` が sample の 2 件を、総件数 2 と各行の `version` つきで返す'
      - '`view: full` の `search_docs` が文書 1 の YAML を返す'
      - '`view: full` の `search_docs` の文書 1 が `<document path="{sample のクローン本体}/{文書 1 のパス}" scope="full">` で包まれる'
      - '`trace_related` が文書 1 の `related` の相手として文書 2 を返す'
    test: test_normal
  - name: 正常シナリオ（複数の配信元を横断する）
    setup:
      - name: Mock
        description: なし（実環境で実行。`cwd` はテストが引数に入れる）
      - name: dev-docs
        description: 正常シナリオと同じ sample と notes を配信している dev-docs
        notes: '`cwd` は sample のクローン本体'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant M as 文書の MCP（/mcp）

        A->>M: search_docs(source: *, view: summary)
        M->>M: scope.read に当たる配信元 sample と notes を対象にする
        M-->>A: 両方の結果（各行に source、配信元ごとの総件数）
      ```
    expected:
      - 結果の各行に `source`（sample か notes）が付く
      - 総件数を配信元ごとに返す
      - '`source: [sample]` は sample の行だけを返す'
    test: test_normal_when_source_all
  - name: 正常シナリオ（ワークツリーを指す）
    setup:
      - name: Mock
        description: なし（実環境で実行。`cwd` はテストが引数に入れる）
      - name: ワークツリー
        description: sample の `.claude/worktrees/x`。文書 1 の `name` をクローン本体と変えてある
        notes: 配信元の設定の `worktrees` は既定（`[./.claude/worktrees/*]`）
      - name: dev-docs
        description: sample を配信している dev-docs
        notes: '`cwd` は sample のクローン本体'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant M as 文書の MCP（/mcp）
        participant WT as ワークツリー x

        A->>M: search_docs(worktree: ワークツリー x のパス, filter: id が文書 1)
        M->>M: worktree が worktrees に当たる
        M->>WT: 同じ相対パスの設定と文書を読む
        M-->>A: ワークツリーの文書 1
      ```
    expected:
      - '`worktree` を渡した `search_docs` がワークツリーの文書 1 の `name` を返す'
      - '`worktree` を渡した `view: full` の `search_docs` の `path` が、ワークツリー x の中の文書 1 の絶対パスになる'
      - '`worktree` を省き `cwd` をワークツリー x の中にした `search_docs` も、ワークツリーの文書 1 を返す'
      - '`worktree` も省き `cwd` がクローン本体の `search_docs` は、クローン本体の文書 1 を返す'
    test: test_normal_when_worktree_given
  - name: 正常シナリオ（同じ本文を 2 回取る）
    setup:
      - name: Mock
        description: なし（実環境で実行。`session_id`・`agent_id` はテストが引数に入れる）
      - name: dev-docs
        description: sample を配信している dev-docs
        notes: '`session_id` は `s1`、`agent_id` は空'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant M as 文書の MCP（/mcp）

        A->>M: search_docs(filter: id が文書 1, view: full)
        M->>M: 会話キーごとに返した文書の id とハッシュを記録する
        M-->>A: 文書 1 の本文
        A->>M: 同じ search_docs をもう一度
        M-->>A: 文書 1 は（この会話で返し済み）
        A->>M: search_docs(..., repeat_seen: true)
        M-->>A: 文書 1 の本文
      ```
    expected:
      - 2 回目の結果で文書 1 の本文が `（この会話で返し済み）` だけになる
      - 2 回目の結果の文書 1 は `path`・`scope` を持たない
      - '`repeat_seen: true` で本文を返す'
      - '`session_id` を `s2` に変えた呼び出しは本文を返す'
      - '`trace_related` の 2 回目は、関連の相手の名前・概要文を `（この会話で返し済み）` にする'
      - '`view: summary` の一覧の各行の概要文は 2 回目も省かない'
    test: test_normal_when_same_doc_twice
  - name: 異常シナリオ（読めない配信元を指す）
    setup:
      - name: Mock
        description: なし（実環境で実行。`cwd` はテストが引数に入れる）
      - name: 別の配信元
        description: 文書の種類を 1 つ持つ配信元
        notes: id `other`。`scope.read` は other のフォルダだけ
      - name: dev-docs
        description: sample と other を配信している dev-docs
        notes: '`cwd` は sample のクローン本体'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant M as 文書の MCP（/mcp）

        A->>M: search_docs(source: other)
        M->>M: other の scope.read に cwd が当たらない
        M-->>A: エラー（読めない配信元。今の作業場所から使える配信元の一覧）
      ```
    expected:
      - '`isError: true` で、other を読めないことと、今の作業場所から使える配信元の一覧（`describe()` と同じ）を返す'
      - 'エラーの直し方（`fix`）が、作業範囲の外を参考に読むときは `outside_scope: true` を渡すことを案内する'
      - other の文書を返さない
      - '`source: *` は other を対象に含めない'
      - '`cwd` を持たない呼び出しは、どの配信元も読めないとして同じエラーを返す'
    test: test_error_when_source_not_readable
  - name: 異常シナリオ（配信していない配信元を指す）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: dev-docs
        description: sample と、起動時の検証に失敗した broken を端末の設定に持つ dev-docs
        notes: '`cwd` は sample のクローン本体。broken の `scope.read` は sample のフォルダ'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant M as 文書の MCP（/mcp）

        A->>M: search_docs(source: broken)
        M-->>A: エラー（配信していない配信元。起動時の検証の違反）
      ```
    expected:
      - '`isError: true` で、broken を配信していないことと、違反したキーのパス・理由を返す'
      - '`source: sample` の `search_docs` は文書を返す'
    test: test_error_when_source_not_served
  - name: 異常シナリオ（ワークツリーに当たらないパスを指す）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: dev-docs
        description: sample を配信している dev-docs
        notes: '`worktree` に、`worktrees` に当たらない一時フォルダのパスを渡す'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant M as 文書の MCP（/mcp）

        A->>M: search_docs(worktree: 当たらないパス)
        M->>M: worktree が sample の worktrees に当たらない
        M-->>A: エラー（当たらないパスと worktrees の値）
      ```
    expected:
      - '`isError: true` で、渡したパスと sample の `worktrees` の値を返す'
      - 文書を返さない
    test: test_error_when_worktree_not_matched
  - name: 正常シナリオ（管理用の YAML の文書を引く）
    setup:
      - name: Mock
        description: なし（実環境で実行。`cwd` はテストが引数に入れる）
        notes: '-'
      - name: 管理用の YAML
        description: 'sample の `src/files.yaml`。`files[]` に `a.py`（`tags: [auth, code]`、`name` なし）と `b.py`（`name: 部品 B`）の 2 行。`src/a.py`・`src/b.py` を置く'
        notes: スキーマは `templates/files.schema.yaml`
      - name: 文書の行
        description: 'sample の `dev-docs.yaml` の行 `src`（`paths: [src/files.yaml]`・`records: files`・`body_file: path`）'
        notes: '-'
      - name: dev-docs
        description: sample を配信している dev-docs
        notes: '`cwd` は sample のクローン本体'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant M as 文書の MCP（/mcp）
        participant ST as 配信元の文書

        A->>M: search_docs(filter: tags が auth, view: summary)
        M->>ST: src/files.yaml を読み、files の各行を 1 件の文書にする
        M->>M: 行の列から共通のメタデータを取る。name が空なら body_file のファイル名
        M-->>A: a の行（name は a、tags は code と auth）
        A->>M: search_docs(filter: id が src/a, view: full)
        M-->>A: src/a.py の内容を path と scope つきの document で包んだ本文
        A->>M: search_docs(filter: id が src/a, view: full, format: json)
        M-->>A: 項目の直下に path と scope を持つ JSON
      ```
    expected:
      - '`tags` が `auth` の `search_docs` が id `src/a`（`body_file` が指すファイルの拡張子を除いたパス）の 1 件を返し、`name` が `a`、`tags` が `auth` と `code` になる'
      - '`b` の `name` は `部品 B` のまま'
      - '`view: full` の本文が `src/a.py` の内容で、`<document path="{sample のクローン本体}/src/a.py" scope="full">` で包まれる'
      - '`format: json` の項目の直下（`id`・`source` と同じ階層で `values` の外）が `path`（`src/a.py` の絶対パス）と `scope: full` を持ち、`values.path` は管理用の YAML の `path` 列の値 `a.py` のまま'
      - どの `search_docs` の応答の `notes` にも、スキーマの違反（`'files' is a required property` など）が付かない
    test: test_normal_when_files_index
  - name: 正常シナリオ（当たった数で並べて絞る）
    setup:
      - name: Mock
        description: なし（実環境で実行。`cwd` はテストが引数に入れる）
        notes: '-'
      - name: Markdown の文書
        description: sample の `notes/` に Markdown の文書を 3 件置き、`notes/files.yaml` の `files[]` に `a.md`・`b.md` の 2 行、`notes/archive/files.yaml` の `files[]` に `c.md` の 1 行を載せる。`a.md` は本文に語 `検索` を含む行を 3 行、`b.md` は 1 行、`archive/c.md` は 2 行持つ
        notes: 'sample の `dev-docs.yaml` に行 `notes`（`paths: [notes/**/files.yaml]`・`records: files`・`body_file: path`）を持つ'
      - name: dev-docs
        description: sample を配信している dev-docs
        notes: '`cwd` は sample のクローン本体'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant M as 文書の MCP（/mcp）

        A->>M: search_docs(filter: and[body が 検索 を含む, not(@path が notes/archive/** に glob で当たる)], fields: [@matches], order_by: @matches の降順)
        M->>M: 本文に 検索 を含み、notes/archive の下に無い文書に絞る
        M->>M: 文書ごとに本文の条件に当たった行を数える
        M-->>A: a（@matches 3）、b（@matches 1）の順
      ```
    expected:
      - '`notes/a.md`・`notes/b.md` の 2 件だけを返し、`notes/archive/c.md` を返さない'
      - 各行の `@matches` が a は 3、b は 1 で、その降順に並ぶ
      - '`not` の条件を外した呼び出しは c も返し、a・c・b の順に並ぶ'
    test: test_normal_when_ordered_by_matches
  - name: 正常シナリオ（本文の一部を読む）
    setup:
      - name: Mock
        description: なし（実環境で実行。`cwd`・`session_id` はテストが引数に入れる）
        notes: '-'
      - name: Markdown の文書
        description: 正常シナリオ（当たった数で並べて絞る）と同じ `notes/a.md`。`## 決まったこと` と、その前後に別の `##` の見出しを持つ
        notes: '-'
      - name: dev-docs
        description: sample を配信している dev-docs
        notes: '`cwd` は sample のクローン本体。`session_id` は `s1`'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant M as 文書の MCP（/mcp）

        A->>M: search_docs(filter: id が notes/a, view: full, sections: [決まったこと])
        M-->>A: 決まったこと の節だけの本文（scope: section）
        A->>M: search_docs(filter: id が notes/a, view: full, lines: offset 3, limit 2)
        M-->>A: 3〜4 行目だけの本文（scope: section）
        A->>M: search_docs(filter: id が notes/a, view: full)
        M-->>A: 全文（scope: full）
      ```
    expected:
      - 節の指定で、`## 決まったこと` の見出しから次の同じか上の階層の見出しの手前までを返し、`scope` が `section` になる
      - 行の範囲の指定で 3〜4 行目だけを返し、`scope` が `section` になる
      - '一部を返した後の全文の呼び出しは `（この会話で返し済み）` にならず、全文を `scope: full` で返す'
    test: test_normal_when_part_of_body
  - name: 正常シナリオ（除外の名前に当たるファイルを外す）
    setup:
      - name: Mock
        description: なし（実環境で実行。`cwd` はテストが引数に入れる）
        notes: '-'
      - name: 文書
        description: sample の `docs/rule/` に YAML の文書 `a.yaml`（id `a`）・`Rb.yaml`（id `Rb`）と目次 `index.yaml`（id `rule-index`）を置く
        notes: '`Rb.yaml` は `R` で始まる文書'
      - name: 文書の行
        description: 'sample の `dev-docs.yaml` の行 `rule`（`paths: [docs/rule/*.yaml]`・`exclude: [index.yaml]`）と行 `index`（`paths: [docs/**/index.yaml]`）'
        notes: '-'
      - name: dev-docs
        description: sample を配信している dev-docs
        notes: '`cwd` は sample のクローン本体'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant M as 文書の MCP（/mcp）
        participant ST as 配信元の文書

        A->>M: search_docs(filter: kind が rule, view: summary)
        M->>ST: rule の paths に当たり exclude に当たらないファイルを読む
        M-->>A: a と Rb
        A->>M: search_docs(filter: kind が index, view: summary)
        M-->>A: rule-index
      ```
    expected:
      - '`kind` が `rule` の `search_docs` が `a` と `Rb` の 2 件だけを返し、`rule-index` を返さない'
      - '`kind` が `index` の `search_docs` が `rule-index` を返す'
    test: test_normal_when_excluded_name
  - name: 正常シナリオ（列名の違う種類を共通のキーで引く）
    setup:
      - name: Mock
        description: なし（実環境で実行。`cwd` はテストが引数に入れる）
        notes: '-'
      - name: 文書
        description: 'sample の `decisions/` に、名前を `title` 列、概要文を `meta.summary` 列に持つ YAML の文書 `d1.yaml`（`title: 設定の置き場所`）を置く'
        notes: '`name`・`description` の列は持たない'
      - name: 文書の行
        description: 'sample の `dev-docs.yaml` の行 `decisions`（`paths: [decisions/*.yaml]`・`metadata: {name: title, description: meta.summary}`）'
        notes: '-'
      - name: dev-docs
        description: sample を配信している dev-docs
        notes: '`cwd` は sample のクローン本体'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant M as 文書の MCP（/mcp）
        participant ST as 配信元の文書

        A->>M: describe(source: sample, kind: decisions)
        M-->>A: スキーマと、共通のキーと列名の対応（name は title、description は meta.summary）
        A->>M: search_docs(filter: name が 設定の置き場所, view: summary)
        M->>ST: decisions/d1.yaml を読む
        M->>M: metadata の対応の列から name・description を取る
        M-->>A: d1 の行（name と概要文）
      ```
    expected:
      - '`describe(source: sample, kind: decisions)` が、`metadata` に書いた対応（`name` は `title`、`description` は `meta.summary`）と、書かない共通のキーは同じ名前の列であることを返す'
      - '`name` が `設定の置き場所` の `search_docs` が d1 を返し、概要文が `meta.summary` の値になる'
    test: test_normal_when_metadata_mapped
  - name: 正常シナリオ（設計書を実装するコードを引く）
    setup:
      - name: Mock
        description: なし（実環境で実行。`cwd` はテストが引数に入れる）
        notes: '-'
      - name: 設計書
        description: sample の YAML の文書 `design/repo.yaml`（id `design/repo`。タスクのリポジトリの設計書）
        notes: '-'
      - name: 管理用の YAML
        description: 'sample の `src/files.yaml`。`repo.py` の行が `related: [{to: design/repo, type: implements}]`、`test_repo.py` の行が `related: [{to: src/repo, type: tests}]` を持つ。`src/repo.py`・`src/test_repo.py` を置く'
        notes: '-'
      - name: 文書の行
        description: 'sample の `dev-docs.yaml` の行 `design`（`paths: [design/*.yaml]`）と行 `src`（`paths: [src/files.yaml]`・`records: files`・`body_file: path`）'
        notes: '`related.types[]` を書かず、既定の関連の種類で検査する'
      - name: dev-docs
        description: sample を配信している dev-docs
        notes: '`cwd` は sample のクローン本体'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant M as 文書の MCP（/mcp）
        participant ST as 配信元の文書

        A->>M: trace_related(from_ids: design/repo, direction: in, depth: 1)
        M->>ST: related で design/repo を指す文書を引く
        M-->>A: src/repo（via.type は implements）
        A->>M: trace_related(from_ids: src/repo, direction: in, depth: 1)
        M-->>A: src/test_repo（via.type は tests）
        A->>M: search_docs(filter: id が src/repo か src/test_repo, view: full)
        M->>M: 読み取りの検査（related の type が既定の種類にあるか）
        M-->>A: 2 件の本文（related の種類の違反なし）
      ```
    expected:
      - '`design/repo` を起点にした `direction: in` の `trace_related` が `src/repo` の 1 件を返し、`via.type` が `implements` になる'
      - '`src/repo` を起点にした `direction: in` の `trace_related` が `src/test_repo` の 1 件を返し、`via.type` が `tests` になる'
      - '`search_docs` が `src/repo`・`src/test_repo` の 2 件を返し、`notes` に `related.types` の違反が付かない'
    test: test_normal_when_implementing_code_traced
  - name: 正常シナリオ（使われているタグを数える）
    setup:
      - name: Mock
