title: "設定・スクリプトを変える"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: サンプルの配信元
        description: 配信中の配信元 sample
        notes: '`dev-docs.yaml` の `description` を書き換えておく'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as 利用者・エージェント
        participant AD as 管理の MCP
        participant DM as 文書の MCP

        A->>AD: check_project（sample のパス）
        AD-->>A: 違反 0 件・索引の同期の件数・設定のバージョンの新旧
        A->>AD: try_convert（sample の文書）
        AD-->>A: 変換した Markdown
        A->>AD: reload
        AD-->>A: 読み直した配信元
        A->>DM: describe
        DM-->>A: 新しい description
      ```
    expected:
      - '`check_project` が違反と索引の同期の件数を 0 で返す'
      - '`try_convert` が sample の文書を変換した Markdown を返し、sample のフォルダは変わらない'
      - '`reload` の後の `describe` が書き換えた `description` を返す'
      - '`reload` の前後で `/mcp` のセッションが切れない'
    test: test_normal
  - name: 正常シナリオ（設定のバージョンが古い）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 古い配信元
        description: '`version` がサーバーが読めるバージョンより古い `dev-docs.yaml` を持つ配信元'
        notes: id `old`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as 利用者・エージェント
        participant AD as 管理の MCP

        A->>AD: check_project（old のパス）
        AD-->>A: 違反 0 件と、設定が古いこと
      ```
    expected:
      - '`check_project` が old の設定のバージョンとサーバーが読めるバージョンを、古い設定として返す'
    test: test_normal_when_config_version_old
  - name: 異常シナリオ（変えた設定が検証に通らない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: サンプルの配信元
        description: 配信中の配信元 sample
        notes: '`dev-docs.yaml` から `documents[0].paths` を消しておく'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as 利用者・エージェント
        participant AD as 管理の MCP
        participant DM as 文書の MCP

        A->>AD: check_project（sample のパス）
        AD-->>A: 違反（キーのパスと理由）
        A->>DM: search_docs（source: sample）
        DM-->>A: 変える前の設定での文書
      ```
    expected:
      - '`check_project` が `documents[0].paths` と理由を返す'
      - '`reload` を呼ぶまで sample は変える前の設定で配信される'
    test: test_error_when_config_invalid
  - name: 異常シナリオ（変換スクリプトが失敗する）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: サンプルの配信元
        description: 配信中の配信元 sample
        notes: 変換スクリプトを 0 以外の終了コードで終わるように書き換えておく
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as 利用者・エージェント
        participant AD as 管理の MCP

        A->>AD: try_convert（sample の文書）
        AD-->>A: スクリプトの終了コードと標準エラー
      ```
    expected:
      - '`try_convert` がエラーとしてスクリプトの終了コードと標準エラーを返す'
      - sample のフォルダと配信は変わらない
    test: test_error_when_converter_fails
lead: 利用者かエージェントが配信元の設定・スキーマ・検査と変換のスクリプトを変え、管理の MCP の `check_project`・`try_convert` で確かめてから `reload` で配信に入れる。
issue: 4
primary_actor: 利用者・エージェント（Claude Code）
stakeholders:
  - name: 利用者
    interest: サーバーを再起動せずに設定の変更を入れられ、壊れた変更は配信に入る前に分かる
  - name: エージェント（Claude Code）
    interest: 変換の結果を、配信元のフォルダを変えずに先に見られる
trigger: 配信元の `dev-docs.yaml`・スキーマ・スクリプトを変えた後、管理の MCP を呼ぶ
preconditions:
  - dev-docs が待ち受け、配信元を配信している
success_guarantee: '`reload` の後、変えた設定で配信元が配信される。`/mcp` のセッションは切れない。'
minimal_guarantee: '`check_project` と `try_convert` は配信元のフォルダと配信の状態を変えない。'
frequency: 設定・スクリプトを変えるたび
priority: 中
refs:
  - dev/設計書/シナリオ/複合ユースケース/dev-docsで文書を配信して読み書きする#scenarios[正常シナリオ]
test_file: tests/e2e/単一ユースケース/test_設定・スクリプトを変える.py
