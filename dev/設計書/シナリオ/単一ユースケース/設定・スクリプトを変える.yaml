title: "設定・スクリプトを変える"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: サンプルの配信元
        description: 配信中の配信元 sample
        notes: '`dev-docs.yaml` の `description` を書き換えておく'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as 利用者・エージェント
        participant AD as 管理の MCP
        participant DM as 文書の MCP

        A->>AD: check_project（sample のパス）
        AD-->>A: 違反 0 件・索引の同期の件数・設定のバージョンの新旧
        A->>AD: try_convert（sample の文書）
        AD-->>A: 変換した Markdown
        A->>AD: reload
        AD-->>A: 読み直した配信元
        A->>DM: describe
        DM-->>A: 新しい description
      ```
    expected:
      - '`check_project` が違反と索引の同期の件数を 0 で返す'
      - '`try_convert` が sample の文書を変換した Markdown を返し、sample のフォルダは変わらない'
      - '`reload` の後の `describe` が書き換えた `description` を返す'
      - '`reload` の前後で `/mcp` のセッションが切れない'
    test: test_normal
  - name: 正常シナリオ（設定のバージョンが古い）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 古い配信元
        description: '`version` がサーバーが読めるバージョンより古い `dev-docs.yaml` を持つ配信元'
        notes: id `old`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as 利用者・エージェント
        participant AD as 管理の MCP

        A->>AD: check_project（old のパス）
        AD-->>A: 違反 0 件と、設定が古いこと
      ```
    expected:
      - '`check_project` が old の設定のバージョンとサーバーが読めるバージョンを、古い設定として返す'
    test: test_normal_when_config_version_old
  - name: 異常シナリオ（変えた設定が検証に通らない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: サンプルの配信元
        description: 配信中の配信元 sample
        notes: '`dev-docs.yaml` から `documents[0].paths` を消しておく'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as 利用者・エージェント
        participant AD as 管理の MCP
        participant DM as 文書の MCP

        A->>AD: check_project（sample のパス）
        AD-->>A: 違反（キーのパスと理由）
        A->>DM: search_docs（source: sample）
        DM-->>A: 変える前の設定での文書
      ```
    expected:
      - '`check_project` が `documents[0].paths` と理由を返す'
      - '`reload` を呼ぶまで sample は変える前の設定で配信される'
    test: test_error_when_config_invalid
  - name: 異常シナリオ（変換スクリプトが失敗する）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: サンプルの配信元
        description: 配信中の配信元 sample
        notes: 変換スクリプトを 0 以外の終了コードで終わるように書き換えておく
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as 利用者・エージェント
        participant AD as 管理の MCP

        A->>AD: try_convert（sample の文書）
        AD-->>A: スクリプトの終了コードと標準エラー
      ```
    expected:
      - '`try_convert` がエラーとしてスクリプトの終了コードと標準エラーを返す'
      - sample のフォルダと配信は変わらない
    test: test_error_when_converter_fails
  - name: 正常シナリオ（管理の MCP で nav を書く）
    setup:
      - name: Mock
        description: なし（実環境で実行。`cwd` はテストが引数に入れる）
      - name: 文書のタグ
        description: sample の文書 1 の `tags` を `[mcp]`、文書 2 を `[設計]`、文書 3 を `[mcp, 設計]` にする
      - name: dev-docs
        description: sample を配信している dev-docs
        notes: '`cwd` は sample のワークツリー'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant AM as 管理の MCP（/admin/mcp）
        participant F as ワークツリーの dev-docs.yaml

        A->>AM: nav の項目を書くツール（タブ mcp を加え、auto の filter に tags が mcp）
        AM->>AM: 書いた後の nav をスキーマと check_filter で検証する
        AM->>F: nav を書く
        AM-->>A: 書いた nav と、条件に当たる文書の数（2）
        A->>AM: nav の項目を書くツール（タブ mcp の filter を tags が 設計 に直す）
        AM->>F: nav を書く
        AM-->>A: 書いた nav と、条件に当たる文書の数（2）
        A->>AM: nav の項目を書くツール（タブ bad を加え、filter の op に無い値 like）
        AM->>AM: check_filter に通らない
        AM-->>A: エラー（書かない）
        A->>AM: nav の項目を書くツール（タブ none を加え、filter に tags が none）
        AM->>F: nav を書く
        AM-->>A: 書いた nav と、0 件に当たる警告
      ```
    expected:
      - ワークツリーの `dev-docs.yaml` の `nav` にタブ `mcp` が加わり、`auto` の `filter` が `tags` が `mcp` になる
      - 1 回目の応答の条件に当たる文書の数が 2（文書 1・文書 3）
      - 直した後、タブ `mcp` の `filter` が `tags` が `設計` になり、条件に当たる文書の数が 2（文書 2・文書 3）
      - '`op` が `like` の `filter` は `isError: true` を返し、タブ `bad` を書かない'
      - '`tags` が `none` の `filter` はタブ `none` を書いたうえで、0 件に当たる警告を返す'
      - '`nav` 以外のキーは書き換わらない'
    test: test_normal_when_nav_written_by_admin_mcp
  - name: 正常シナリオ（エイリアスのキーと nav の条件を点検する）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: エイリアスのキーの違反と 0 件の条件
        description: 起動するの正常シナリオ（エイリアスのキーと nav の条件を検証する）と同じ違反と条件を、sample のワークツリーで書く
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant AM as 管理の MCP（/admin/mcp）

        A->>AM: check_project(ワークツリーのパス)
        AM->>AM: エイリアスのキーを取り込んだスキーマで検証し、nav の条件に当たる文書を数える
        AM-->>A: 違反と警告の一覧
      ```
    expected:
      - '`check_project` が、エイリアスのキーの違反を文書のパスとともに返す'
      - '`check_project` が、0 件に当たる `nav` の条件を警告として返す'
      - 取り込んだスキーマの取り込み元のバージョンを返す
    test: test_normal_when_check_project_reports_alias_and_nav
  - name: 正常シナリオ（スクリプトを default_ref から動かす）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: default_ref のスクリプト
        description: sample の `develop` ブランチのスクリプトを次のようにする。変換スクリプトは本文の先頭に `develop` の文字を加える。validator は文書 1 に違反 `develop-rule` を出す。generator は生成した文書の本文を `develop` にする
        notes: クローン本体は `master` を checkout し、`master` の変換スクリプトは何も加えず、validator は違反を出さず、generator は本文を `master` にする
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant S as dev-docs のサーバー
        participant G as sample のリポジトリ

        U->>S: 起動する
        S->>G: 起動時の検証で default_ref の validator を動かす
        S-->>U: 起動時の警告（違反 develop-rule）と配信の開始
        U->>S: 変換を使う文書を開く
        S->>G: default_ref のスクリプトで変換する
        S-->>U: develop の文字が付いた本文
        U->>S: generator が生成した文書を開く
        S->>G: default_ref の generator を動かす
        S-->>U: 本文 develop
      ```
    expected:
      - 起動時の警告に、文書 1 の違反 `develop-rule` が出る
      - 変換した本文の先頭に `develop` の文字が付く
      - generator が生成した文書の本文が `develop` になる
    test: test_normal_when_scripts_run_from_default_ref
  - name: 正常シナリオ（ワークツリーのスクリプトを動かす）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: default_ref のスクリプト
        description: 正常シナリオ（スクリプトを default_ref から動かす）と同じ `develop` の変換スクリプト
      - name: ワークツリー
        description: sample の `.claude/worktrees/x`。変換スクリプトを、本文の先頭に `worktree-x` の文字を加えるように書き換えて commit していない
        notes: 配信元の設定の `worktrees` は既定（`[./.claude/worktrees/*]`）
    flow: |-
      ```mermaid
      sequenceDiagram
        actor A as エージェント
        participant S as dev-docs のサーバー
        participant WT as ワークツリー x

        A->>S: search_docs(worktree: ワークツリー x のパス, filter: id が変換を使う文書, view: full)
        S->>WT: ワークツリーの変換スクリプトで変換する
        S-->>A: worktree-x の文字が付いた本文
      ```
    expected:
      - '`worktree` を渡した `search_docs` の本文の先頭に `worktree-x` の文字が付き、`develop` の文字は付かない'
      - '`worktree` を渡さない同じ呼び出しは `develop` の文字が付いた本文を返す'
    test: test_normal_when_scripts_run_from_worktree
lead: 利用者かエージェントが配信元の設定・スキーマ・検査と変換のスクリプトを変え、管理の MCP の `check_project`・`try_convert` で確かめてから `reload` で配信に入れる。
issue: 4
primary_actor: 利用者・エージェント（Claude Code）
stakeholders:
  - name: 利用者
    interest: サーバーを再起動せずに設定の変更を入れられ、壊れた変更は配信に入る前に分かる
  - name: エージェント（Claude Code）
    interest: 変換の結果を、配信元のフォルダを変えずに先に見られる
trigger: 配信元の `dev-docs.yaml`・スキーマ・スクリプトを変えた後、管理の MCP を呼ぶ
preconditions:
  - dev-docs が待ち受け、配信元を配信している
success_guarantee: '`reload` の後、変えた設定で配信元が配信される。`/mcp` のセッションは切れない。'
minimal_guarantee: '`check_project` と `try_convert` は配信元のフォルダと配信の状態を変えない。'
frequency: 設定・スクリプトを変えるたび
priority: 中
refs:
  - dev/設計書/シナリオ/複合ユースケース/dev-docsで文書を配信して読み書きする#scenarios[正常シナリオ]
test_file: tests/e2e/単一ユースケース/test_設定・スクリプトを変える.py
