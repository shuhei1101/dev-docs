title: "変更をレビューする"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実環境で実行。画面はブラウザで開く。`cwd` はテストが引数に入れる）
      - name: サンプルの配信元
        description: 文書の種類を 1 つ（スキーマと YAML 2 件）と `dev-docs.yaml` を持つ git リポジトリと、そのワークツリー（`.claude/worktrees/x`）
        notes: id `sample`
      - name: 変更の commit
        description: ワークツリー x で文書 1 の `name` を `write_docs` で変え、`git commit` した commit
        notes: 親の commit と、その commit の 2 つを使う
      - name: dev-docs
        description: sample を配信している dev-docs
        notes: '`cwd` は sample のクローン本体'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor R as レビュアー
        participant M as 文書の MCP（/mcp）
        participant UI as dev-docs の画面
        participant G as sample の Git の履歴

        R->>M: list_changes(from: 親の commit, to: 変更の commit, view: summary)
        M->>G: 区間を commit に解決し、両端の文書を読む
        M-->>R: 解決した commit と日時、変わった文書と変わったキー
        R->>M: list_changes(同じ区間, view: full)
        M-->>R: git と同じ + - の差分の行
        R->>UI: GET /sample@{変更の commit}/{文書 1 のパス}?diff={親の commit}
        UI->>G: 両端の文書を読んで変わった項目を求める
        UI-->>R: 変更の commit の文書 1 の本文（変わった項目を強調）
      ```
    expected:
      - '`view: summary` が先頭に解決した 2 つの commit と日時を返し、変わった文書として文書 1 だけを、変わったキー `name` つきで返す'
      - '`view: full` が `name` の前後の値を `-`・`+` の行で返す'
      - 画面が変更の commit の文書 1 を描き、`name` の項目だけを変わった項目として強調する
      - 画面の差分の強調を解除すると、`?diff=` の無い URL で同じ文書を開く
    test: test_normal
  - name: 正常シナリオ（日時とブランチで区間を指す）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 変更の commit
        description: 正常シナリオと同じ、文書 1 を変えた commit
        notes: 親の commit と変更の commit の間の日時を `from` に、ワークツリーのブランチ名を `to` に渡す
      - name: dev-docs
        description: sample を配信している dev-docs
    flow: |-
      ```mermaid
      sequenceDiagram
        actor R as レビュアー
        participant M as 文書の MCP（/mcp）

        R->>M: list_changes(from: 日時, to: ブランチ名, view: summary)
        M->>M: 日時をその時点の最後の commit、ブランチをその先頭の commit に解決する
        M-->>R: 解決した commit と日時、変わった文書
      ```
    expected:
      - 先頭に、`from` を親の commit、`to` を変更の commit に解決した結果を返す
      - 変わった文書が正常シナリオと同じになる
    test: test_normal_when_range_by_date_and_branch
  - name: 正常シナリオ（前回読んだ時点から）
    setup:
      - name: Mock
        description: なし（実環境で実行。`session_id` はテストが引数に入れる）
      - name: 読んだ記録
        description: 同じ `session_id` で、文書 1 と文書 2 を `search_docs` で読んだ後、文書 1 だけを `write_docs` で変えた状態
        notes: '`session_id` は `s1`'
      - name: dev-docs
        description: sample を配信している dev-docs
    flow: |-
      ```mermaid
      sequenceDiagram
        actor R as エージェント
        participant M as 文書の MCP（/mcp）

        R->>M: list_changes(view: summary)
        M->>M: from と to を省いたので、この会話で前回読んだ時点から今までを比べる
        M-->>R: 読んだ後に変わった文書
      ```
    expected:
      - 文書 1 だけを、変わったキーつきで返す
      - 文書 2 は返さない
      - 別の `session_id` で呼ぶと、前回読んだ時点が無いことと `from` を渡すことを返す
    test: test_normal_when_since_last_read
  - name: 異常シナリオ（無いリビジョンを指す）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: dev-docs
        description: sample を配信している dev-docs
        notes: '`from` に sample に無いブランチ名 `no-such-branch` を渡す'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor R as レビュアー
        participant M as 文書の MCP（/mcp）

        R->>M: list_changes(from: no-such-branch)
        M->>M: from を commit に解決できない
        M-->>R: エラー（解決できなかった引数と値）
      ```
    expected:
      - '`isError: true` で、`from` の `no-such-branch` を解決できなかったことを返す'
      - 差分を返さない
    test: test_error_when_ref_not_found
lead: レビュアー（エージェント・利用者）が、文書の MCP の `list_changes` と画面の差分の強調（`?diff=`）で、区間の間に変わった文書と項目を確かめる。
issue: 3
primary_actor: レビュアー（エージェント・利用者）
stakeholders:
  - name: レビュアーのエージェント
    interest: YAML の git の差分を読まずに、どの文書のどの項目が変わったかを引ける
  - name: 利用者
    interest: エージェントが示した URL を開くと、描いた文書の上で変わった箇所が強調されている
trigger: エージェントが書き込んだ変更を commit した後、レビューを始める
preconditions:
  - dev-docs が起動し、Git の配信元を配信している
  - 配信元に、文書を変えた commit がある
success_guarantee: 区間（commit・日時・ブランチ・タグ）を commit に解決し、その間に変わった文書・変わったキー・差分の行を返す。画面は同じ区間で変わった項目を強調する。
minimal_guarantee: 解決できない区間は、差分を返さずにどの値を解決できなかったかを返す。
frequency: レビューのたび
priority: 高
refs:
  - dev/設計書/シナリオ/複合ユースケース/dev-docsで文書を配信して読み書きする#scenarios[正常シナリオ]
  - dev/設計書/シナリオ/単一ユースケース/エージェントが書き込む#scenarios[正常シナリオ]
