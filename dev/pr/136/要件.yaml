use_cases:
  - kind: composite
    scenario: dev/設計書/シナリオ/複合ユースケース/dev-docsで文書を配信して読み書きする.yaml
    impact: none
    detail: 起動・読み書きの連鎖は変わらない
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/起動する.yaml
    impact: run_only
    detail: 起動した直後に配信元を読み込む間の答え方を変えるが、シナリオの期待値は変わらない
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/エージェントが調べる.yaml
    impact: run_only
    detail: 起動した直後でもエージェントが文書を調べられるようにするが、シナリオの期待値は変わらない
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/dev-docsを更新する.yaml
    impact: run_only
    detail: 更新の後の状態の確かめ方（status）の答えの速さを変えるが、シナリオの期待値は変わらない
    depends_on: []
docs:
  - page: docs/リファレンス/管理のMCP.md
    new: false
    change: 読み込み中に文書の MCP の呼び出しが待たされる記述と、`status` の同期の件数の求め方を、直した後の答え方に合わせる
    status: todo
  - page: dev/設計書/非機能要件/非機能要件.yaml
    new: false
    change: 起動直後の文書の MCP の応答時間と、読み込みの後の `status` の応答時間の決定値を、Claude Code の MCP の呼び出しの時間切れから逆算して足す
    status: todo
scope_out:
  - item: 画面の API（`view/route.py`・`settings/route.py`）と管理の MCP の `status` 以外のツールが、起動直後に配信元の読み込みの終わりまで待つこと
    reason: 判断が分かれる。#123 の終わりの条件は MCP の要求で、画面は含まない。ただし同じ `SourceRegistry.wait_loaded` を呼ぶため、待ちを配信元ごとに変える直し方なら一緒に直る。今の判断は、直し方が `wait_loaded` の共通の変更になるなら含め、文書の MCP の入口だけを変えるなら外す（インターフェース定義設計のレビューで確定する）
    plan: to_file
