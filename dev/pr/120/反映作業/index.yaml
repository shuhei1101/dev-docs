dev-docs のサーバーの再起動:
  説明: develop の worktree から起動して稼働中の dev-docs のサーバー（127.0.0.1:8781）を、マージした develop のコードで起動し直し、作業範囲の外の配信元への参照の ref の解決の修正を有効にする。最長の実行時間は、実行が約 120 秒（新しいサーバーの待ち受けの待ち）、確認が約 625 秒（配信元の読み込みの待ち 540 秒 + 件数の検索 85 秒）
  タグ: [再起動]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  起動し直す対象: dev-docs のサーバー（127.0.0.1:8781）
  可逆: true
  疎通確認: dev-docs のサーバーの再起動/疎通確認.sh
  実行: dev-docs のサーバーの再起動/実行.sh
  確認: dev-docs のサーバーの再起動/確認.sh
  切り戻し: null
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: 配信元の読み込みが終わった（文書の MCP の describe が応答する）後に、稼働中の dev-docs のサーバーへ配信元 ai-monitor の search_docs（outside_scope true・view count）を直接 HTTP で要求し、修正の前の 85.3 秒より短い時間で応答する
  状態: "-"
