id: SCR-155-3
title: "設定画面"
elements:
  - name: ページのタイトル
    kind: label
    position: head > title
    description: ブラウザのタブに出すタイトル
    label: '`設定 | dev-docs`'
    visible_when: 常時
  - name: 本文へスキップ
    kind: link
    position: 画面の先頭
    description: トップバーを飛ばして本文へフォーカスを移す
    label: '`本文へスキップ`'
    visible_when: キーボードでフォーカスしたとき
    tab_order: 1
    action: クリックで本文の領域へフォーカスを移す
  - name: トップバー
    kind: nav
    component: CMP-155-2#
    args:
      - name: screen
        value: '`settings`'
      - name: colorScheme
        value: ブラウザに保存した明暗（無ければ `system`）
    position: 画面の上
    description: 画面名と明暗の切り替えだけを出す
    visible_when: 常時
    action: 画面名のクリックで配信中の配信元の先頭のトップを開く。`colorSchemeToggle` で明暗を切り替え、ブラウザに保存する
    action_ref: SCR-155-1#
  - name: 文書の画面に戻る
    kind: link
    position: 本文の上
    description: 直前に開いていた文書の画面へ戻る
    label: '`文書の画面に戻る`'
    visible_when: 直前に開いていた文書の画面か、配信中の配信元があるとき
    action: クリックで直前に開いていた文書の画面（無ければ配信中の配信元の先頭のトップ）を開く
    action_ref: SCR-155-1#
    label_display: icon_and_text
    icon: ArrowLeft
  - name: 見出し
    kind: heading
    position: 本文
    description: 画面の見出し
    label: '`設定`'
    visible_when: 常時
  - name: 配信元の見出し
    kind: heading
    position: 本文 > 配信元のセクション
    description: 配信元のセクションの見出し
    label: '`配信元`'
    visible_when: 常時
  - name: 配信元を追加
    kind: button
    position: 本文 > 配信元のセクション > 見出しの右
    description: 追加のダイアログを開く
    label: '`配信元を追加`'
    visible_when: 常時
    enabled_when: project-index に接続できているとき（接続できない間は押せず、`aria-describedby` で project-index から受け取れないときの表示の見出しを指す）
    action: クリックで配信元のダイアログを追加で開く
    label_display: icon_and_text
    icon: Plus
    confirm: none
    disabled_reason: 押せない間は `aria-describedby` で project-index から受け取れないときの表示の見出しを指し、理由をその表示で出す
  - name: project-index から受け取れないときの表示
    kind: alert
    position: 本文 > 配信元のセクション（配信元の一覧の代わり）
    description: 端末の設定の取得が project-index から受け取れず 503・502 を返却したとき、理由の種類ごとの見出しと説明、接続先と理由を出す
    label: 文書の画面の『project-index から文書を受け取れないときの表示』と同じ、理由の種類（`projectIndex.kind`）の `unreachable`・`timeout`・`failed` ごとの見出しと説明。続けて `接続先`・`理由` の一覧と、ボタン `再読み込み`
    visible_when: 端末の設定の取得が 503 か 502 を返却したとき
    source: 端末の設定の取得（503・502 の `projectIndex.address`・`projectIndex.reason`・`projectIndex.kind`）
    action: '`再読み込み` のクリックで端末の設定の取得を再度呼び出す'
    action_ref: IF-155-20#
    notes:
      読み上げ: '`role="alert"` で、出たときに読み上げる'
  - name: 配信元の読み込み中の表示
    kind: progress
    position: 本文 > 配信元のセクション
    description: 端末の設定の取得を待つ間に表の行の形状の枠を出す
    visible_when: 端末の設定の取得を待っているとき（待ちが 1 秒を超えたときだけ出す）
    accessible_name: '`配信元を読み込んでいます`'
  - name: 配信元が無いことの表示
    kind: label
    position: 本文 > 配信元のセクション
    description: 端末の設定に配信元が無いこと
    label: '`配信元はありません。`'
    visible_when: '`sources` が空のとき'
    source: 端末の設定の取得.sources
  - name: 配信元の一覧
    kind: table
    position: 本文 > 配信元のセクション
    description: 端末の設定の `sources[]` の行と状態
    label: 列は `配信元`・`設定ファイル`・`状態`・`操作`
    visible_when: '`sources` が 1 件以上のとき'
    source: 端末の設定の取得.sources
    accessible_name: '`配信元の表`'
    narrow:
      action: horizontal_scroll
    table:
      default_sort: 端末の設定の `sources[]` の並び順。並べ替えの巡回は持たない
      filter: 絞り込みはしない
      selection: none
      sticky_header: false
    retained_state:
      - what: 表のスクロール位置
        store: none
        reason: 表は画面全体と一緒にスクロールし、表の中に縦のスクロールの領域を持たない
  - name: 配信元の ID
    kind: link
    position: 配信元の一覧 > 配信元
    description: 配信元の ID。配信中ならトップへのリンクにする
    label: '`{id}`（等幅）'
    type: 文字列
    visible_when: 常時
    source: 端末の設定の取得.sources[].id
    action: '`status` が `serving` の行だけ、クリックでその配信元のトップを開く（他の行はリンクにしない）'
    action_ref: SCR-155-1#
    io: output
    overflow:
      type: wrap
      unbounded: true
    accessible_name: '`{id} のトップ`'
  - name: 設定ファイル
    kind: label
    position: 配信元の一覧 > 設定ファイル
    description: 配信元の設定の YAML のパス
    label: '`config` のパスを 1 行に 1 つ（等幅。長いパスは折り返す）'
    type: 文字列
    visible_when: 常時
    source: 端末の設定の取得.sources[].config
    io: output
    overflow:
      type: wrap
      unbounded: true
  - name: 状態
    kind: label
    position: 配信元の一覧 > 状態
    description: 配信元の今の状態
    label: '`配信中`（`serving`）/ `配信停止`（`not_served`）/ `無効`（`disabled`）/ `再読み込み待ち`（`pending_reload`）'
    visible_when: 常時
    source: 端末の設定の取得.sources[].status
    notes:
      色: 配信中は成功、配信停止は危険、無効・再読み込み待ちは弱めの色。アイコンと文言でも区別する
    icon: 状態ごとに `CircleCheck`（配信中）・`CircleAlert`（配信停止）・`CircleMinus`（無効）・`CircleDashed`（再読み込み待ち）
    io: output
    overflow:
      type: wrap
      max_length: 7
  - name: 状態の補足
    kind: label
    position: 配信元の一覧 > 状態 > バッジの下
    description: 状態の理由と注意
    label: 配信停止のときは `project-index が起動時の検証で除外しました。` と `errors[]` ごとの `{path} {reason}`。設定のバージョンが古いときは `設定のバージョン {config}（project-index が読み込めるのは {server}）`。無効のときは `enabled が false です`。再読み込み待ちのときは `ファイルにありますが、まだ再読み込みしていません。`
    visible_when: 配信停止・設定のバージョンが古い・無効・再読み込み待ちのいずれかのとき
    source: 端末の設定の取得.sources[].errors・端末の設定の取得.sources[].configVersion
    io: output
    overflow:
      type: wrap
      unbounded: true
  - name: 編集ボタン
    kind: button
    position: 配信元の一覧 > 操作
    description: その行の配信元のダイアログを編集で開く
    visible_when: 常時
    action: クリックでその行の値を入れた配信元のダイアログを開く
    label_display: icon_only
    icon: Pencil
    accessible_name: '`{id} を編集`'
    tooltip: '`{id} を編集`'
    confirm: none
  - name: 削除ボタン
    kind: button
    position: 配信元の一覧 > 操作
    description: その行の削除の確認を開く
    visible_when: 常時
    action: クリックで削除の確認のダイアログを開く
    label_display: icon_only
    icon: Trash2
    accessible_name: '`{id} を削除`'
    tooltip: '`{id} を削除`'
    confirm: dialog
  - name: キーボードの見出し
    kind: heading
    position: 本文 > キーボードのセクション
    description: キーボードのセクションの見出し
    label: '`キーボード`'
    visible_when: 常時
  - name: 1 文字のショートカットのスイッチ
    kind: toggle
    position: 本文 > キーボードのセクション
    description: '`/`・`?` の 1 文字のショートカットを使用するか'
    label: '`1 文字のショートカットを使用する`'
    io: input
    type: 真偽値
    visible_when: 常時
    hint: '`/ で検索、? でショートカットの一覧を開きます。この端末のブラウザに保存します。`'
    initial_value: ブラウザに保存した値（無ければオン）
    action: 切り替えでブラウザの `localStorage` に保存し、全ての画面ですぐに適用する
    toggle_state: checked
    retained_state:
      - what: 1 文字のショートカットを使用するか
        store: local_storage
        key: dev-docs:v1:shared:preferences
        save_on: 切り替えたとき
        restore_on: この端末のブラウザで全ての画面を開いたとき
  - name: ショートカットの一覧を開く
    kind: button
    position: 本文 > キーボードのセクション
    description: ショートカットの一覧を開く
    label: '`ショートカットの一覧を開く`'
    visible_when: 常時
    action: クリックでショートカットの一覧を開く
    label_display: text_only
    confirm: none
  - name: 配信元のダイアログのタイトル
    kind: heading
    position: 配信元のダイアログ
    description: ダイアログの見出し
    label: 追加は `配信元を追加`、編集は `配信元を編集` とその下に `配信元 {id}`
    visible_when: 配信元のダイアログを開いたとき
  - name: 保存の失敗のまとめ
    kind: alert
    position: 配信元のダイアログ > タイトルの下
    description: 保存できなかったときの違反の一覧
    label: 警告のアイコンと `保存できませんでした（{件数} 件）`。続けて違反ごとに項目のエラーの文言（末尾の句点と直し方を除く）と `{path}`（等幅）を並べる
    visible_when: 入力チェックに引っかかったときか、端末の設定の保存が 422 を返却したとき
    source: 端末の設定の保存（422 の `errors[]` の `{path, reason}`）
    action: 違反の行のクリックでその入力欄へフォーカスを移す。出たときはまとめへフォーカスを移す
    notes:
      読み上げ: '`role="alert"` で、出たときに読み上げる'
      入力欄との対応: '`sources[{行}].id` は配信元の ID、`.config` は設定ファイル、`.enabled` は配信、`.scope.read` は読み取りの範囲、`.scope.write` は書き込みの範囲の入力欄。開いている行と違う行の違反は、まとめにだけ出す'
  - name: 配信元の ID の入力欄
    kind: input
    position: 配信元のダイアログ
    description: 配信元の ID。追加のときだけ入力できる
    label: '`配信元の ID`'
    io: input
    type: 文字列
    visible_when: 追加のとき（編集では入力欄を出さず、タイトルの下に ID を出す）
    required: true
    required_label: '`必須`'
    pattern: ^[a-z0-9-]+$
    charset: 英小文字・数字・ハイフン。変換はしない
    hint: '`画面の URL と文書の MCP の source に使用します。英小文字・数字・ハイフンで入力します。`'
    initial_value: 空
    autocomplete: off
    autofocus: true
    target: 端末の設定の保存.sources[].id
    retained_state:
      - what: 入力した値
        store: none
        reason: ダイアログを開くたびに追加は空、編集はその行の値から始める。入力したまま画面を離れるときは離脱の警告を出す
  - name: 設定ファイルの入力欄
    kind: textarea
    position: 配信元のダイアログ
    description: 配信元の設定の YAML のパス
    label: '`設定ファイル`'
    io: input
    type: 文字列
    visible_when: 配信元のダイアログを開いたとき
    required: true
    required_label: '`必須`'
    hint: '`1 行に 1 つ。後のファイルが前のファイルの同じキーを上書きします。`'
    placeholder: '`~/repo/sample-docs/project-index.yaml`'
    initial_value: 追加は空、編集はその行の `config` を 1 行に 1 つ
    target: 端末の設定の保存.sources[].config（1 行のときは文字列、2 行以上は配列）
    notes:
      初期フォーカス: 編集のときだけ初めにフォーカスする
    retained_state:
      - what: 入力した値
        store: none
        reason: ダイアログを開くたびに追加は空、編集はその行の値から始める。入力したまま画面を離れるときは離脱の警告を出す
  - name: 配信のスイッチ
    kind: toggle
    position: 配信元のダイアログ
    description: 配信するか
    label: '`配信` と `配信する`'
    io: input
    type: 真偽値
    visible_when: 配信元のダイアログを開いたとき
    hint: '`オフにすると、設定を残したまま配信を止めます。`'
    initial_value: 追加はオン、編集はその行の `enabled`
    target: 端末の設定の保存.sources[].enabled
    toggle_state: checked
    retained_state:
      - what: 切り替えた値
        store: none
        reason: ダイアログを開くたびに追加はオン、編集はその行の値から始める
  - name: 読み取りの範囲の入力欄
    kind: textarea
    position: 配信元のダイアログ
    description: この配信元を参照できる作業場所の glob
    label: '`読み取りの範囲`'
    io: input
    type: 文字列
    visible_when: 配信元のダイアログを開いたとき
    required: true
    required_label: '`必須`'
    hint: '`glob を 1 行に 1 つ。当たる作業場所から、この配信元の文書を参照できます。`'
    placeholder: '`~/repo/**`'
    initial_value: 追加は空、編集はその行の `scope.read` を 1 行に 1 つ
    target: 端末の設定の保存.sources[].scope.read
    retained_state:
      - what: 入力した値
        store: none
        reason: ダイアログを開くたびに追加は空、編集はその行の値から始める。入力したまま画面を離れるときは離脱の警告を出す
  - name: 書き込みの範囲の入力欄
    kind: textarea
    position: 配信元のダイアログ
    description: この配信元を読み書きできる作業場所の glob
    label: '`書き込みの範囲`'
    io: input
    type: 文字列
    visible_when: 配信元のダイアログを開いたとき
    required: false
    required_label: '`任意`'
    hint: '`glob を 1 行に 1 つ。当たる作業場所から、この配信元の文書へ書き込めます。`'
    initial_value: 追加は空、編集はその行の `scope.write` を 1 行に 1 つ
    target: 端末の設定の保存.sources[].scope.write（空なら送信しない）
    retained_state:
      - what: 入力した値
        store: none
        reason: ダイアログを開くたびに追加は空、編集はその行の値から始める。入力したまま画面を離れるときは離脱の警告を出す
  - name: 配信元のダイアログのキャンセル
    kind: button
    position: 配信元のダイアログ > フッター
    description: 保存せずに閉じる
    label: '`キャンセル`'
    visible_when: 配信元のダイアログを開いたとき
    action: クリックか Esc で入力を捨てて閉じ、開いたボタンへフォーカスを戻す
    label_display: text_only
    confirm: none
  - name: 追加・保存ボタン
    kind: button
    position: 配信元のダイアログ > フッター
    description: 入力を反映した `sources[]` を保存する
    label: 追加は `追加`、編集は `保存`（プライマリ）
    visible_when: 配信元のダイアログを開いたとき
    enabled_when: 保存の応答を待っていないとき。編集していた配信元が他のプロセスに削除されていないとき
    action: クリックで入力チェックを通し、通ったら今の一覧に入力を反映した `sources[]` を丸ごと、端末の設定の取得か前の保存で受けた `version` を `expectedVersion` に添えて送信する。編集は、開いたときの配信元を ID（ID を持たない行は設定ファイル）で今の一覧から探して置き換える。200 ならダイアログを閉じて一覧を再取得、通知を出す。422 ならダイアログを開いたまま保存の失敗のまとめと項目のエラーを出す。409 ならダイアログを開いたまま入力を残し、他の変更の表示を出して一覧を再取得する
    action_ref: IF-155-19#
    label_display: text_only
    confirm: none
    pending_state: 押せなくし、ボタンの文字の前にスピナーを出す（ボタンの幅は変えない）
    disabled_reason: 応答を待つ間はボタンの上のスピナーで、編集していた配信元が削除されたときは『配信元が削除されたときの表示』で理由を示す
  - name: 削除の確認のタイトル
    kind: heading
    position: 削除の確認のダイアログ
    description: 削除の確認の見出し
    label: '`{id} を削除しますか?`'
    visible_when: 削除の確認のダイアログを開いたとき
  - name: 削除の説明
    kind: label
    position: 削除の確認のダイアログ
    description: 削除で起きることと起きないこと
    label: '`端末の設定から {id} の行を削除し、配信から除外します。フォルダ {設定ファイルのフォルダ} と文書は削除しません。`'
    visible_when: 削除の確認のダイアログを開いたとき
    source: 端末の設定の取得.sources[].config（先頭のファイルのフォルダ）
  - name: 削除のキャンセル
    kind: button
    position: 削除の確認のダイアログ > フッター
    description: 削除せずに閉じる
    label: '`キャンセル`'
    visible_when: 削除の確認のダイアログを開いたとき
    autofocus: true
    action: クリックか Esc で閉じ、削除ボタンへフォーカスを戻す
    label_display: text_only
    confirm: none
  - name: 削除の確定ボタン
    kind: button
    position: 削除の確認のダイアログ > フッター
    description: その行を除いた `sources[]` を保存する
    label: '`削除`（危険の色）'
    visible_when: 削除の確認のダイアログを開いたとき
    enabled_when: 保存の応答を待っていないとき。削除する配信元が他のプロセスに削除されていないとき
    action: クリックで、開いたときの配信元を ID（ID を持たない行は設定ファイル）で今の一覧から探して除いた `sources[]` を丸ごと、`version` を `expectedVersion` に添えて送信し、200 ならダイアログを閉じて一覧を再取得、通知を出す。409 なら削除の他の変更の表示を出して一覧を再取得する。それ以外の失敗はダイアログに Problem Details の `detail` を出す
    action_ref: IF-155-19#
    label_display: text_only
    confirm: none
    pending_state: 押せなくし、ボタンの文字の前にスピナーを出す（ボタンの幅は変えない）
    disabled_reason: 応答を待つ間はボタンの上のスピナーで、削除する配信元が削除されたときは『削除する配信元が削除されたときの表示』で理由を示す
  - name: 保存の失敗の通知
    kind: toast
    position: 画面の右下
    description: 保存が 422 以外で失敗した結果
    label: '`端末の設定を保存できませんでした。`。502・503 のときは続けて応答の `detail`（503 は `project-index（{接続先}）に接続できませんでした。{理由}`）'
    visible_when: 追加・保存が 422 以外で失敗したとき
    source: 端末の設定の保存（502・503 の `detail`）
    notes:
      読み上げ: '`role="alert"` で読み上げる'
  - name: 保存の通知
    kind: toast
    position: 画面の右下
    description: 保存の結果
    label: '`端末の設定を保存し、配信元を再読み込みしました。`'
    visible_when: 追加・保存・削除が 200 を返却したとき
    notes:
      読み上げ: '`role="status"` で読み上げる'
  - name: ショートカットの一覧
    kind: dialog
    component: CMP-155-1#
    args:
      - name: open
        value: '`?` か、ショートカットの一覧を開くのクリックで `true`'
      - name: screen
        value: '`settings`'
      - name: singleKey
        value: 1 文字のショートカットのスイッチの値
    position: 画面の中央
    description: この画面で使用できるキー
    visible_when: '`?` を押したときか、ショートカットの一覧を開くを押したとき'
    modal: true
    close:
      outside_click: true
      escape: close
    initial_focus: 閉じるボタン
    return_focus: 開く前にフォーカスしていた要素（ショートカットの一覧を開くのボタン）
  - name: 範囲の外からの参照の補足
    kind: label
    position: 配信元の一覧 > 配信元 > ID の下
    description: 範囲の外からの参照を止めていること
    label: '`範囲の外から参照できません`'
    visible_when: '`outsideRead` が `false` の行だけ'
    source: 端末の設定の取得.sources[].outsideRead
  - name: 範囲の外からの参照のスイッチ
    kind: toggle
    position: 配信元のダイアログ > 読み取りの範囲の下
    description: '`scope` に該当しない作業場所からも作業範囲の外（参考）として参照できるか'
    label: '`範囲の外からの参照` と `範囲の外から参照できるようにする`'
    io: input
    type: 真偽値
    visible_when: 配信元のダイアログを開いたとき
    hint: '`オフにすると、読み取りの範囲に当たらない作業場所からは参照できません。`'
    initial_value: 追加はオン、編集はその行の `outsideRead`（無ければオン）
    target: 端末の設定の保存.sources[].outside_read（オフのときだけ `false` を送信する）
    toggle_state: checked
    retained_state:
      - what: 切り替えた値
        store: none
        reason: ダイアログを開くたびに追加は既定、編集はその行の値から始める
  - name: 他の変更の表示
    kind: alert
    position: 配信元のダイアログ > タイトルの下
    description: 開いた後に他のプロセスが端末の設定を変更したため保存できなかったこと
    label: タイトル `他の変更があったため保存できませんでした` と `この画面を開いた後に、他のプロセスが端末の設定を変更しました。一覧を最新の内容にしました。入力した内容を確認し、もう一度保存してください。`
    visible_when: 端末の設定の保存が 409 を返却したとき（配信元が削除されたときの表示を出すときは出さない）
    source: 端末の設定の保存（409）
    notes:
      読み上げ: '`role="alert"` で、出たときに読み上げる'
  - name: 配信元が削除されたときの表示
    kind: alert
    position: 配信元のダイアログ > タイトルの下
    description: 編集していた配信元が再取得した一覧に無いこと
    label: タイトル `配信元が削除されたため保存できませんでした` と `この画面を開いた後に、他のプロセスがこの配信元を端末の設定から削除しました。一覧を確認してください。`
    visible_when: 編集していた配信元が、再取得した一覧に ID（ID を持たない行は設定ファイル）で見つからないとき
    source: 端末の設定の取得.sources[]
    notes:
      読み上げ: '`role="alert"` で、出たときに読み上げる'
  - name: 削除の他の変更の表示
    kind: alert
    position: 削除の確認のダイアログ > 削除の説明の下
    description: 開いた後に他のプロセスが端末の設定を変更したため削除できなかったこと
    label: タイトル `他の変更があったため削除できませんでした` と `この画面を開いた後に、他のプロセスが端末の設定を変更しました。一覧を最新の内容にしました。内容を確認し、もう一度削除してください。`
    visible_when: 削除の保存が 409 を返却したとき（削除する配信元が削除されたときの表示を出すときは出さない）
    source: 端末の設定の保存（409）
    notes:
      読み上げ: '`role="alert"` で、出たときに読み上げる'
  - name: 削除する配信元が削除されたときの表示
    kind: alert
    position: 削除の確認のダイアログ > 削除の説明の下
    description: 削除する配信元が再取得した一覧に無いこと
    label: タイトル `配信元が削除されたため削除できませんでした` と `この画面を開いた後に、他のプロセスがこの配信元を端末の設定から削除しました。一覧を確認してください。`
    visible_when: 削除する配信元が、再取得した一覧に ID（ID を持たない行は設定ファイル）で見つからないとき
    source: 端末の設定の取得.sources[]
    notes:
      読み上げ: '`role="alert"` で、出たときに読み上げる'
  - name: 読み書きの方法のセレクト
    kind: select
    position: 配信元のダイアログ > 範囲の外からの参照の下（書き込みの範囲の上）
    description: 配信元の読み書きの方法（端末の設定の `storage.type`）
    label: '`読み書きの方法`'
    io: input
    type: 列挙
    visible_when: 配信元のダイアログを開いたとき
    required: false
    required_label: '`任意`'
    options: '`storage` を持たない行（追加・保存済みの値が無い行）は `自動`・`Git`・`ディスク`。`storage` を持つ行は `Git`・`ディスク`（project-index が送信しなかった `storage` を今の値で埋めるため、自動に戻せない）'
    hint: '`storage` を持たない行は `自動は、フォルダが Git の作業ツリーの中なら Git、外ならディスクで読み書きします。コミットしないフォルダはディスクを選択します。`、`storage` を持つ行は `Git はコミットから読み、ディスクはフォルダのファイルをそのまま読みます。保存済みの読み書きの方法は自動に戻せません。`'
    initial_value: 追加は `自動`、編集はその行の `storage.type`（無ければ `自動`）
    source: 端末の設定の取得.sources[].storage.type
    target: 端末の設定の保存.sources[].storage.type（`自動` のときは `storage` を送信しない）
    retained_state:
      - what: 選んだ値
        store: none
        reason: ダイアログを開くたびに追加は既定、編集はその行の値から始める
  - name: 配信元のダイアログ
    kind: dialog
    position: 画面の中央
    description: 配信元を追加・編集する入力をまとめる
    visible_when: 配信元を追加か、その行の編集ボタンを押したとき
    modal: true
    close:
      outside_click: false
      escape: close
    initial_focus: 追加は配信元の ID の入力欄、編集は設定ファイルの入力欄
    return_focus: 開いたボタン（配信元を追加か、その行の編集ボタン）
  - name: 削除の確認のダイアログ
    kind: dialog
    position: 画面の中央
    description: 配信元を端末の設定から削除する前に確認する
    visible_when: その行の削除ボタンを押したとき
    modal: true
    close:
      outside_click: false
      escape: close
    initial_focus: 削除のキャンセル
    return_focus: その行の削除ボタン
  - name: ショートカットの一覧を開くキー
    kind: shortcut
    description: ショートカットの一覧を開く
    shortcut:
      key: Shift+?
      scope: screen
    visible_when: 1 文字のショートカットが有効で、入力欄にフォーカスが無く、ダイアログを開いていないとき
    action: ショートカットの一覧を開く
  - name: 移動の確認のダイアログ
    kind: dialog
    position: 画面の中央
    description: 配信元のダイアログに入力したまま画面の中で移る（リンク・ブラウザの戻る・進む）前に、入力を破棄して移るかを確認する
    label: タイトル `入力した内容を破棄して移動しますか?`、説明 `配信元のダイアログに入力した内容は保存されていません。`、ボタン `キャンセル` と `破棄して移動`（危険の色）
    visible_when: 配信元のダイアログの入力を変えたまま、画面の中で移ろうとしたとき
    modal: true
    close:
      outside_click: false
      escape: close
    initial_focus: '`キャンセル`'
    return_focus: 移る前にフォーカスしていた要素
    action: '`破棄して移動` で入力を捨てて移り、`キャンセル`・Esc で移らずに配信元のダイアログに戻る'
screen: frontend/src/features/settings/settings/settings-screen.tsx
mock: frontend/src/features/settings/settings/settings-screen.stories.tsx
lead: '端末の設定の配信元を状態とともに並べ、追加・編集・削除する設定画面の要素と振る舞いを定め、設定画面を修正するときに参照する。'
input_checks:
  - element: 配信元の ID の入力欄
    violation: 空
    trigger: 追加・保存ボタンのクリック（一度出た後は入力のたび）
    message: '`配信元の ID を入力してください。`'
    position: 入力欄の下
  - element: 配信元の ID の入力欄
    violation: 英小文字・数字・ハイフン以外の文字がある
    trigger: 追加・保存ボタンのクリック（一度出た後は入力のたび）
    message: '`配信元の ID に使用できない文字があります。英小文字・数字・ハイフンで入力してください。`'
    position: 入力欄の下
  - element: 配信元の ID の入力欄
    violation: 他の行の ID と重なる
    trigger: 追加・保存ボタンのクリック（一度出た後は入力のたび）
    message: '`配信元の ID {入力した値} は既に使用されています。別の ID を入力してください。`'
    position: 入力欄の下
  - element: 設定ファイルの入力欄
    violation: 空の行しか無い
    trigger: 追加・保存ボタンのクリック（一度出た後は入力のたび）
    message: '`設定ファイルを 1 つ以上入力してください。`'
    position: 入力欄の下
  - element: 読み取りの範囲の入力欄
    violation: 空の行しか無い
    trigger: 追加・保存ボタンのクリック（一度出た後は入力のたび）
    message: '`読み取りの範囲を 1 つ以上入力してください。`'
    position: 入力欄の下
  - element: 読み取りの範囲の入力欄
    violation: 空の行を含む
    trigger: 追加・保存ボタンのクリック（一度出た後は入力のたび）
    message: '`読み取りの範囲に空の行があります。空の行を削除してください。`'
    position: 入力欄の下
  - element: 書き込みの範囲の入力欄
    violation: 空の行を含む
    trigger: 追加・保存ボタンのクリック（一度出た後は入力のたび）
    message: '`書き込みの範囲に空の行があります。空の行を削除してください。`'
    position: 入力欄の下
notes:
  URL: '`/_settings`。配信元の ID は `^[a-z0-9-]+$` で `_` を含まないため、配信元のトップの URL と重ならない'
  422 の受け方: 入力チェックを通した後も、サーバーの検証（ファイルが無い・設定のスキーマに合わない等）で 422 になる。`errors[]` の `reason` をそのまま項目のエラーの文言にする
  補足: 保存は `sources[]` を丸ごと送信し、スキーマに通ったときだけ書き換わる。
refs:
