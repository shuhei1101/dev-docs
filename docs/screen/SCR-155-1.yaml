id: SCR-155-1
title: "文書の画面"
elements:
  - name: ページのタイトル
    kind: label
    position: head > title
    description: ブラウザのタブに出すタイトル
    label: '`{文書の名前} | {配信元の ID} | dev-docs`（文書の無いタブは `{タブ名} | {配信元の ID} | dev-docs`）'
    visible_when: 常時
    source: 文書の取得.tabs[].items
  - name: 本文へスキップ
    kind: link
    position: 画面の先頭
    description: トップバーとサイドバーを飛ばして本文へフォーカスを移す
    label: '`本文へスキップ`'
    visible_when: キーボードでフォーカスしたとき
    tab_order: 1
    action: クリックで本文の領域へフォーカスを移す
  - name: トップバー
    kind: header
    component: CMP-155-2#
    args:
      - name: screen
        value: '`doc-view`'
      - name: sources
        value: 端末の設定の取得.sources[]（`status` が `serving` の行の `id` と、`scope.write` が `null`（省いた。配信元のフォルダから書き込める）か 1 件以上かを `writable`）
      - name: currentSource
        value: 文書の取得.source
      - name: refs
        value: リビジョンの一覧（レスポンス全体）
      - name: currentRef
        value: 文書の取得.ref
      - name: commentCount
        value: 溜めたコメントの件数
      - name: colorScheme
        value: ブラウザに保存した明暗（無ければ `system`）
      - name: pendingEditCount
        value: 開いている配信元の編集中の変更の件数
    position: 画面の上
    description: 配信元・リビジョンの切り替え、検索、コメント、設定、明暗の切り替え。スクロールしても画面に残す
    visible_when: 常時
    action: '`sourceSelect` でその配信元のトップ（`/{配信元の ID}`）を開く。`refSelect` で `rev` を書き換えて同じ文書を再度開く。`compareStart` で `base` に、開いているリビジョンが `defaultRef` 以外なら `defaultRef`、`defaultRef` なら最近の commit の 2 件目を入れて再度開く。`searchOpen` で検索のダイアログ、`commentPanelToggle` でコメントのパネル、`sidebarOpen` で文書の一覧のドロワーを開く。`colorSchemeToggle` で明暗を切り替え、ブラウザに保存する。メタデータのボタンでその配信元のメタデータの画面を開き、`pendingPanelToggle` でこの画面の編集中のパネルを開閉する'
    action_ref: IF-155-6#
  - name: 種類のタブ
    kind: tab
    position: トップバーの下
    description: 配信元の文書の種類を選ぶ。スクロールしても画面に残す
    label: タブの名前（`nav` の並び順）
    visible_when: 常時
    initial_value: '`tab` のタブ（省いたか、開いている文書がそのタブに無いときは `active` のタブ）を現在地（`aria-current="page"`）にする'
    source: 文書の取得.tabs[].title・文書の取得.tabs[].active
    action: クリックで `tab` をそのタブの番号にして、そのタブのサイドバーの一番上の文書を開く。文書の無いタブは URL を変えず、文書が無いことの表示を出す
    action_ref: IF-155-10#
  - name: 文書の一覧
    kind: nav
    position: サイドバー
    description: 選んでいるタブの group と page を入れ子で並べる。スクロールしても画面に残す
    label: group は開閉のボタンの見出し（group の開閉ボタン）、page は文書の名前のリンク。入れ子の階層ごとに字下げする
    visible_when: 画面幅が 48rem 以上で、サイドバーを開いているとき（狭い幅では文書の一覧のドロワー）
    initial_value: 開いている文書を現在地（`aria-current="page"`）にする。開いている文書か、文書の変化のマーカーを持つ page を配下（入れ子の group を含む）に持つ group を開き、ほかの group を閉じる
    source: 文書の取得.tabs[].items
    action: page のクリックで、`rev`・`base`・`tab` を保ったその文書を開く。`change` が `deleted` の page は、`rev` を `base` にして `base` を除外したその文書を開く
    action_ref: IF-155-10#
    notes:
      読み上げ名: '`文書の一覧`'
      入れ子: group の入れ子の階層の数は配信元の設定の `nav` で決まり、画面は階層の数を制限しない
      開閉の状態: 利用者が開閉した状態は保存しない。開いている文書が変わったときはその文書を配下に持つ group を、変化のマーカーを持つ page が配下に現れたとき（差分の表示を始めたとき）はその group を開く（利用者が閉じた group も開く）。それ以外では、利用者が閉じた group を閉じたままにする
      長い名前: page の文書の名前と group の見出しを折り返さず 1 行で出し、サイドバーの幅に収まらない末尾を `…` で省略する。全文は `title` に持たせ、ポインターを乗せるとブラウザのツールチップで出す。文書の一覧のドロワーでも同じ
    width: サイドバーの幅（既定 15rem、最小 12rem・最大 30rem。サイドバーの境目で変える）
  - name: 文書の変化のマーカー
    kind: icon
    position: サイドバー > 文書の一覧 > page の右
    description: 比較元からの page の変化
    label: 追加はプラス、変更は塗った円、削除はマイナスのアイコン。削除の page は文書の名前に取り消し線を引く
    visible_when: '`base` があり、`change` が `null` でない page'
    source: 文書の取得.tabs[].items[].change
    notes:
      読み上げ名: アイコンに文字を添えず、視覚に出さない `追加`・`変更`・`削除` を持つ
  - name: 文書の一覧のドロワー
    kind: drawer
    position: 画面の左
    description: 狭い幅で文書の一覧を重ねて出す。中の文書の一覧はサイドバーと同じ（group の開閉ボタンを持つ）。幅は固定で、サイドバーの境目・開閉のボタンは持たない
    visible_when: 画面幅が 48rem 未満で、トップバーの `sidebarOpen` を受けたとき
    action: 文書を開くか、Esc・ドロワーの外のクリックで閉じ、開いたボタンへフォーカスを戻す
  - name: パンくず
    kind: nav
    position: 本文の上
    description: 開いている文書の階層
    label: '`{配信元の ID}` / `{タブ名}` / `{group の名前}` / `{文書の名前}`'
    visible_when: 常時（文書の無いタブでは `{配信元の ID}` / `{タブ名}`）
    source: 文書の取得.source・文書の取得.tabs[].items
    action: 配信元の ID のクリックで配信元のトップ、タブ名のクリックで `tab` を保ってそのタブの一番上の文書を開く。group と末尾はリンクにしない
    action_ref: IF-155-10#
    notes:
      読み上げ名: '`パンくず`'
  - name: 文書のタイトル
    kind: label
    position: 本文の上
    description: 文書の名前（見出し 1）。文書の無いタブではタブ名
    label: '`{文書の名前}`'
    visible_when: 常時
    source: 文書の取得.tabs[].items（開いている page の名前）
    notes:
      見た目: mdmark の見出し 1 と同じ大きさ（本文の文字の 1.9 倍）・太さ（mdmark の見出しの太さ）で、下に区切り線を表示する
  - name: 文書の情報
    kind: label
    position: 本文の上 > 文書のタイトルの下
    description: 種類・文書のパス・更新日時
    label: 種類のバッジ（タブ名）、文書のパス（等幅）、`更新 {日時}`
    visible_when: 文書があるとき
    display_format: 更新日時は `MM/DD HH:mm JST`（例 `10/26 23:40 JST`）。`time` 要素の `datetime` に ISO 8601 を持つ
    source: 文書の取得.path・文書の取得.updatedAt
  - name: 読み込み中の表示
    kind: skeleton
    position: 本文
    description: 文書の取得の結果を待つ間に、文書のタイトル・情報・本文の形状の枠を出す
    visible_when: 文書の取得を待っているとき（前の文書があれば前の文書を出したままにし、待ちが 1 秒を超えたときだけ出す）
    notes:
      読み上げ名: '`文書を読み込んでいます`。本文の領域に `aria-busy` を付ける'
  - name: 差分の案内
    kind: section
    position: 本文の上 > 文書の情報の下
    description: 差分を強調していることと、比べている 2 つのリビジョン
    label: '`比較元` の選択、`→`、`比較先` の選択、`差分の強調を解除`'
    visible_when: '`base` があり、Git の配信元のとき'
    source: 文書の取得.diff.base・文書の取得.ref
    notes:
      読み上げ名: '`差分`'
      文字色: '`比較元`・`比較先` のラベルは本文と同じ文字色（`--foreground`）にし、案内の背景（`--muted`）とのコントラストを 4.5:1 以上にする'
  - name: 比較元の選択
    kind: select
    position: 差分の案内
    description: 比べる元のリビジョン
    label: '`比較元`'
    type: 文字列
    visible_when: 差分の案内を出しているとき
    options: リビジョンの一覧の `defaultRef`・ブランチ・タグ・最近の commit（リビジョンのメニューと同じ並び）。一覧に無い `base` は先頭に追加する
    initial_value: '`base`'
    source: リビジョンの一覧.defaultRef・リビジョンの一覧.branches[].name・リビジョンの一覧.tags[].name・リビジョンの一覧.commits[].commit
    target: 文書の取得.diff（URL の `base`）
    action: 再選択すると `base` を書き換えて再度開く
    action_ref: IF-155-10#
  - name: 比較先の選択
    kind: select
    position: 差分の案内
    description: 比べる先のリビジョン。開いているリビジョンと同じ
    label: '`比較先`'
    type: 文字列
    visible_when: 差分の案内を出しているとき
    options: 比較元の選択と同じ
    initial_value: '`rev`（無ければ `defaultRef`）'
    source: 文書の取得.ref
    target: 文書の取得.ref（URL の `rev`）
    action: 再選択すると `rev` を書き換えて再度開く
    action_ref: IF-155-10#
  - name: 差分の強調を解除
    kind: button
    position: 差分の案内
    description: 差分をやめて比較先の通常の本文を出す
    label: '`差分の強調を解除`'
    visible_when: 差分の案内を出しているとき
    action: クリックで `base` を除外した同じ文書を開く。本文の強調・文書の変化のマーカーを削除する
    action_ref: IF-155-10#
  - name: project-index から文書を受け取れないときの表示
    kind: alert
    position: 画面全体（トップバーと本文の代わり）
    description: 文書の取得が 503・502 を返却したとき、受け取れなかった理由の種類ごとの見出しと説明、接続先と理由を出す
    label: 理由の種類（文書の取得の `projectIndex.kind`）ごとの見出しと説明。接続を断られた（`unreachable`）は見出し `project-index に接続できませんでした`・説明 `project-index を起動してから、再読み込みしてください。`、応答が無かった（`timeout`）は見出し `project-index から応答がありませんでした`・説明 `project-index が配信元を初めて読み込む間は、時間がかかることがあります。しばらく待ってから、再読み込みしてください。`、処理に失敗した（`failed`）は見出し `project-index が要求を処理できませんでした`・説明 `時間をおいて再読み込みすると、開けることがあります。続くときは、project-index のログで原因を確認してください。`。続けて `接続先`・`理由` の一覧と、ボタン `再読み込み`
    visible_when: 文書の取得が 503 か 502 を返却したとき
    source: 文書の取得（503・502 の `projectIndex.address`・`projectIndex.reason`・`projectIndex.kind`）
    action: '`再読み込み` のクリックで画面を再読み込みする'
    action_ref: IF-155-10#
    notes:
      読み上げ: '`role="alert"` で、出たときに読み上げる'
      長い理由: 理由の欄は、長い理由（project-index の `detail`）をスマホ幅でも横にはみ出さずに折り返す
      文言: 見出しと説明は[配信元を選んだときの最初の表示の文言の確認ログ](https://github.com/shuhei1101/dev-docs/blob/develop/docs/pr/230/%E7%A2%BA%E8%AA%8D%E3%83%AD%E3%82%B0.yaml)で決定した文言
  - name: 変換の失敗
    kind: alert
    position: 本文
    description: 本文の代わりに、変換できなかった理由と次にすることを出す
    label: 見出し `本文を変換できませんでした`。続けて原因ごとの説明（制限時間の超過は `配信元の変換のスクリプトが制限時間を超えたため、止めました。スクリプトを修正してから、再読み込みしてください。`）と、`種類`・`スクリプト`・`原因` の一覧（YAML を読めないときは `ファイル`・`場所`（`{行} 行 {列} 列`）・`原因`）
    visible_when: '`conversionError` が `null` でないとき'
    source: 文書の取得.conversionError
    notes:
      読み上げ: '`role="alert"` で、出たときに読み上げる'
  - name: 再読み込み
    kind: button
    position: 変換の失敗
    description: 同じ文書を再取得する
    label: '`再読み込み`'
    visible_when: 変換の失敗を出しているとき
    action: クリックで同じ条件の文書の取得を再度呼び出す
    action_ref: IF-155-10#
  - name: 文書が無いことの表示
    kind: label
    position: 本文
    description: 選んだタブに文書が無いこと
    label: 見出し `{タブ名}の文書はありません`と、`このタブの nav.tabs[{タブの番号}].paths に当たる文書が、リビジョン {ref} にありません。`（Git 管理外の配信元は `、リビジョン {ref}` を省く）
    visible_when: 選んだタブの `items` に page が無いとき
    source: 文書の取得.tabs[].items・文書の取得.ref
  - name: 本文
    kind: article
    position: 本文
    description: 変換した Markdown を mdmark の `mount` で描いた文書の中身。最初の見出し 1 は文書のタイトルに出すため除いて描く
    visible_when: 文書があり、`conversionError` が `null` のとき
    source: 文書の取得.markdown
    action: 本文の中の同じ配信元の文書へのリンクは、画面を再読み込みせず `rev` を保って開く（無い文書は見つからない画面）。外の URL は別のタブで開く。Mermaid の図の `click` のノードを mdmark がリンクにしたものも、本文のリンクと同じく開く
    action_ref: IF-155-10#
    notes:
      mdmark に指定する値: '`docId` は `{配信元の ID}:{文書のパス}`、`commentStore` はコメントの配置先の読み書き。`diffSource` は指定せず、mdmark の「変更を見る」を出さない。`config` に `table.pin_default` は指定せず、表は mdmark の既定（描いた直後はどの列も留めない）で描く'
      差分: '`base` があるときは、`ref` を `diff.base` にして取った `markdown` を mdmark の `baseMarkdown` に指定し、変わったブロックと削除したブロックの位置を本文の中で強調する。`base` を除外したら `baseMarkdown` を `null` にして強調を解除する'
      見た目: 単独の mdmark（画面が読み込むバージョンの `mdmark export` で書き出した HTML）と同じ見た目で描く。画面の基本のスタイル（Tailwind の Preflight と、全ての要素の枠線の色）は本文の範囲に適用せず、mdmark が値を持たない性質はブラウザの既定の値にする。本文の内側の余白は下だけにし、本文の左端の位置をパンくず・文書のタイトルと同じにする
      スクロール: 画面を表示領域の高さ（`100dvh`）に収め、本文の領域とサイドバーの中だけを縦にスクロールさせる。トップバーと種類のタブはスクロールの領域の外に配置し、本文を末尾までスクロールしても画面全体の縦のスクロールバーを出さない
    width: 画面の幅から左右の余白・サイドバー・間隔を除いた幅（上限なし）
  - name: 列の表示のメニュー
    kind: menu
    position: 本文 > 表の見出し行の右上
    description: mdmark が列の表示・非表示の機能を持つ表に描く列の表示の切り替え。隠した列を文書ごとに記憶する
    label: 見出し行の右上の mdmark の表のメニューのボタン（`title` が `表のメニュー`）と、ボタンで開く表のメニューの `テーブル設定` の項目と、項目で開く `テーブル設定` のパネルの列ごとの `「{列名}」を隠す`（隠した列は `「{列名}」を表示`）の目のアイコン。隠した列があるときは表のメニューのボタンに隠した列の数のバッジを出し、読み上げ名を `表のメニュー（{件数} 列を非表示）` にする（件数の表示を持つ表は `表のメニュー（{表示している行の数} / {全ての行の数} 件・{件数} 列を非表示）`）
    visible_when: 本文に列の表示・非表示の機能を持つ表があるとき（表ごと）
    initial_value: '`columns` にその表のキーがあれば、JSON のマーカーはその列だけを、前の記載方法のマーカーはその列とマーカーの `hide=` の列を隠した状態。無ければ表のマーカーの隠す列を隠した状態（表のキーは、本文の表を出る順に `tableKeys` と対にして取得する）'
    source: 文書の取得.columns・文書の取得.tableKeys
    target: 表の列の設定の保存.hidden（`table` はその表のキー）
    action: 列の出し入れのたびに、その表の隠した列を保存する。保存に失敗したら通知に `列の表示を保存できませんでした。` を出し、表は切り替えたままにする
    action_ref: IF-155-21#
    notes:
      mdmark とのつなぎ: 初めに隠す列は、`mount` の前に `markdown` の表のマーカーへ `columns` の値を記載して指定する。JSON のマーカー（`<!-- table:` から次の `-->` まで。複数行を含む）は全ての列の `hidden` を `columns` の値と一致させ、`hidden` が `true` の列が無くなるときは `features.columns` の `{}` を追加する。前の記載方法の `+columns` のマーカーは `hide=` で追記する。列の出し入れは mdmark の `onColumnsChange` で受ける。`tableIndex` は列の表示・非表示の機能を持つ表（JSON のマーカーは `features.columns.enabled` が `false` でなく、かつ `features.columns` があるか、どれかの列の `hidden` が `true`。前の記載方法は `+columns`）だけの出る順の番号のため、本文の表を出る順に `tableKeys` と対にし、そのうち機能を持つ表のキーだけを出る順に並べた中の `tableIndex` 番目のキーで保存する
  - name: 目次
    kind: nav
    position: 本文 > 右端
    description: mdmark が本文に描く右側の目次。画面は本文の右の列に別の目次を配置しない。スクロールしても、右端の線と目次の枠を本文の領域の上端に固定する
    label: 右端の見出しの数の線と、線を指すかフォーカスしたときに本文に重ねて出す、見出し 1〜3 を入れ子にした目次
    visible_when: 本文に見出し 1〜3 があるとき
    source: 文書の取得.markdown（描いた本文の見出し）
    action: 目次の見出しのクリックでその見出しへ移る。現在の見出しの決め方と強調（`aria-current`）・ピン止め・狭い幅での出し方は mdmark が持つ
    notes:
      読み上げ名: 'mdmark が持つ（目次の枠は `右側の目次`、開くボタンは `目次を表示`）'
      mdmark に指定する値: '`config` に `side-toc` を指定せず、既定の出し方（`hover`）で描かせる'
      差分: '`base` があるとき、mdmark が本文の `baseMarkdown` から変わったセクションの項目に変更のマーカー（橙の塗った円。読み上げは項目の名前に続けて `（変更）`）を出す。画面は本文と同じ `baseMarkdown` を指定するだけで、目次に別の値を指定しない。`base` を除外して `baseMarkdown` を `null` にするとマーカーが消える'
      固定の位置: mdmark の CSS 変数 `--mdmark-sticky-top` を `0px` にする（本文の領域がスクロールの容器で、その上端がトップバーと種類のタブの下にある）。mdmark はこの値で、右端の線・目次の枠の上端、目次から移った見出しの止まる位置、表の見出し行を留める位置を決める。見出し行は、スクロール連動のアニメーションを持たないブラウザ（iPadOS 18 以前の Safari など）を含め、表の上端がこの位置に達した時に留まり始め、この位置に留まる
