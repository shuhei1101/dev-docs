screen: frontend/src/features/docs/doc-view/doc-view-screen.tsx
mock: frontend/src/features/docs/doc-view/doc-view-screen.stories.tsx
lead: '1 文書の本文を種類のタブ・サイドバー・パンくず・目次と一緒に参照する文書の画面の要素と振る舞いを定め、文書の画面を修正するときに参照する。'
input_checks:
  - element: コメントの修正欄
    violation: 空白だけか空
    trigger: 修正の保存のクリック
    message: '`コメントを入力してください。`'
    position: 修正欄の下
notes:
  URL: '`/{配信元の ID}/{文書のパス}`。文書のパスを省いた `/{配信元の ID}` は配信元のトップ（一番左のタブの一番上の文書）。search パラメータは `rev`（開くリビジョン。省くと `defaultRef`）・`base`（比較元。省くと差分を出さない）・`tab`（選んだタブの番号。省くか、開いている文書がそのタブに無いときは `active` のタブ）・`edit`（本文の編集の方式。`fields`（表示した場所で修正）・`file`（ファイル全体）。省くか、`edit` が `null` の文書では編集しない）・`panel`（`edits` なら編集中のパネルを開いて始める。メタデータの画面の編集中のパネルから文書の本文の変更へ移るときに付ける）で、TanStack Router の `validateSearch` と Zod で検査する。`/` は配信中の配信元の先頭のトップへ移り、配信中の配信元が無ければ設定画面へ移る'
  コメントの配置先: ブラウザのタブの `sessionStorage` に、配信元の ID・リビジョン・文書のパス・見出しの並び・`quote`・`prefix`・`suffix`・本文・選択を溜める。再読み込みしても残り、タブを閉じると消える。サーバーへは送信しない
  404 のとき: 文書の取得が 404 を返却したら、URL を変えずに見つからない画面を出す（`docs/screen/見つからない画面`）
  補足: 本文の文字列にコメントを溜め、まとめてコピー・起票できる。
  サイドバーの開閉と幅の保存: サイドバーを開いているかと幅は、明暗と同じブラウザの設定（`localStorage` の `dev-docs:preferences`）に保存し、画面を開き直しても前の状態で始める。既定は開いた状態・15rem
  ドラッグの代わりの手段: サイドバーの幅は境目のドラッグとキーボードだけで変え、クリックだけで任意の幅にする手段を持たない。knowledge の規約『操作とアクセシビリティ』の WCAG 2.2 の 2.5.7 に合わないが、利用者の判断でこの構成にした
refs:
  - to: SC-155-7
    type: references
    when: 文書の画面の振る舞いを変えるときに、利用者が画面で参照する流れを確認する。
