    action: 入力のたびに編集中の変更（変更前の値に編集を始めたときの値を持つ。`@file` は `edit.source`）に入れ、元の内容に戻すと編集中の変更から除く
    notes:
      配置: 本文の区画の幅が 48rem 以上のときはファイル全体のプレビューと左右に、未満のときは上下に並べる（画面幅ではなく区画の幅で切り替える）
      文字: 等幅で、スマホの幅でも 16px 以上
  - name: ファイル全体のプレビュー
    kind: section
