id: NFR-155-1
title: "非機能要件"
requirements:
  - id: NFR-1
    name: 実行する Python
    english_name: python_version
    category: 動作環境
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '3.14'
    rationale: '新規のプロジェクトは最新安定版か 1 つ下を使用する規約に従い、最新安定版 3.15 の 1 つ下を選んだ。依存する MCP の Python SDK・FastAPI が対応しているかを #3 で確認する'
    status: planned
  - id: NFR-2
    name: 対応 OS
    english_name: supported_os
    category: 動作環境
    external_constraint: 未確定
    source_kind: 未確定
    value: 未確定
    rationale: 利用者の手元で動かす。管理用プラグインのフックがサーバーを切り離して起動する方法が OS ごとに違うため、#4 の設計で決める
    measurement: 決めた OS の端末で `dev-docs serve` を起動し、画面と MCP につながるかを確認する
    status: planned
  - id: NFR-3
    name: 対応ブラウザ
    english_name: supported_browser
    category: 動作環境
    external_constraint: 制限なし
    source_kind: 制限なし
    value: PC は Chrome・Edge の最新安定版で全ての操作、スマホは Android の Chrome・iOS の Safari の最新安定版で文書を参照する・検索する・コメントを溜めてコピーするまで
    rationale: 'knowledge の規約『対応ブラウザ』の既定（PC は全ての操作、スマホは主な操作まで）に従う。スマホでは設定画面の編集を主な操作に含めない。対応ブラウザの指定は `package.json` の browserslist に配置し、Safari 固有の代替の実装は入れない'
    measurement: 決めたブラウザで一覧・本文・差分の画面を開く
    status: planned
  - id: NFR-4
    name: 対応する画面サイズ
    english_name: screen_size
    category: 動作環境
    external_constraint: 制限なし
    source_kind: 制限なし
    value: 幅 360px 以上。幅 48rem（768px）未満はサイドバーをドロワー、コメントのパネルを画面の下から出す面にする。目次の幅ごとの出し方は mdmark の右側の目次が持つ
    rationale: 合意したモック（`docs/mock/pages/*/36/default/`）の切り替え幅に合わせる。360px は主なスマホの一番狭い幅
    measurement: 決めた幅で画面を開き、横スクロールが出ないことを確認する
    status: planned
  - id: NFR-5
    name: 待ち受けのアドレス
    english_name: bind_address
    category: セキュリティ
    external_constraint: 利用者の手元だけで使用する（認証を持たない）
    source_kind: ユーザー要望
    source: 設定の資料 A-25（`bind` の既定値）
    value: 127.0.0.1
    rationale: 画面と MCP に認証が無く、書き込みも受けるため、既定では他の端末から届かないアドレスで待ち受ける
    status: planned
  - id: NFR-6
    name: 待ち受けのポート
    english_name: listen_port
    category: 動作環境
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: 設定の資料 A-25（`port`・`DEV_DOCS_PORT` の既定値）
    value: '8781'
    rationale: 画面・管理の MCP を 1 つのポートで待ち受ける。`.mcp.json` も同じ値を参照するため `DEV_DOCS_PORT` で上書きする
    overflow: 使用中のときは起動を止め、ポートと `DEV_DOCS_PORT` で変えられることを出す。確認する時点は起動時
    status: planned
  - id: NFR-11
    name: Issue の作成画面の URL の長さ
    english_name: issue_url_length
    category: 動作環境
    external_constraint: GitHub の Issue の作成画面は、長すぎる URL を断る。公式の上限の記載は無い。未ログインの curl（2026-10-30）では、URL 全体 8000 文字は応答、8067 文字・8117 文字は接続が切られ、8267 文字以上は 414
    source_kind: 外部 API の制限
    source: https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/creating-an-issue#creating-an-issue-from-a-url-query
    value: '7200'
    unit: 文字（パーセントエンコード後の URL 全体）
    rationale: 応答があった最長の 8000 文字から 1 割の余裕を取った（[確認ログ](https://github.com/shuhei1101/dev-docs/pull/36#discussion_r4422112042)）。断られるのはリクエストの 1 行目の長さで、クッキーは別のヘッダーの行のため、ログインした状態でも上限は下がらないとして扱う。ログインした状態では測っていない
    overflow: '`body` の末尾を切り詰め、切り詰めたことを記載し添える。全文は先にクリップボードへコピーする'
    measurement: 単体テストで、作った URL の長さが決定値以下であることを確認する。ログインした PC の Chrome で `https://github.com/shuhei1101/dev-docs/issues/new?labels=docs&body=` に続ける `body` の長さを変えて開き、作成画面が出る最長の長さを測れば、この扱いを確認される
    status: planned
    refs:
      - SCR-155-1#elements[Issue を作成]
  - id: NFR-12
    name: mdmark の読み込み元
    english_name: mdmark_source
    category: 保守性
    external_constraint: 'jsDelivr はタグを 1 年キャッシュし（`cache-control: public, max-age=31536000, s-maxage=31536000, immutable`）、ブランチを CDN で 12 時間、ブラウザで 7 日キャッシュする。mdmark は 0.x の間 master を更新せず、スプリントの区切りで develop にタグを打つ'
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/dev-docs/issues/236
    value: jsDelivr の mdmark の端末の設定の `mdmark_version`（既定 `develop`）の `dist/index.js`・`dist/index.css` を参照し、integrity を付けない
    rationale: タグを打つのを待たずに、mdmark の develop へ入った機能を使用する。develop の壊れた変更への備えは、作業 PR のテストでの描画の確認と、端末の設定の `mdmark_version` での固定で持つ。`mount` は動的 `import()` で読み込み、integrity を指定できないため付けない
    measurement: 文書の画面を開き、`mdmark_version` の値の `dist/index.js`・`dist/index.css` が 200 で参照されることを確認する
    overflow: mdmark の develop の変更で画面が壊れてから気づくまでの間は、利用者が `mdmark_version` にタグか commit の SHA を記載して固定し、再起動して回避する。dev-docs の文書は map の ER 図・状態遷移図と JSON の記載のマーカーを使用するため、固定できる下限は v0.13.0
    refs:
      - LIB-155-9#
      - MOD-155-25#functions[mdmarkUrls]
    status: planned
  - id: NFR-13
    name: 起動から接続を受け付けるまでの時間
    english_name: listen_start_time
    category: 可用性
    external_constraint: 再起動のスクリプト（#62）が待ち受けを待つ上限 60 秒
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/dev-docs/issues/65
    value: '20'
    unit: 秒
    rationale: 待ち受けの前に残るのは import と端末の設定・プロンプトの YAML の読み込みだけで、負荷のある端末の計測で約 8 秒。project-index への配信元の状態の問い合わせ（配信元の通知し）は待ち受けの後に回すため含めない。60 秒に対して計測値の 2 倍強を決定値にする
    measurement: '`dev-docs serve` を子プロセスで起動してから、待ち受けのポートへの TCP の接続が通るまでの時間'
    test_file: tests/nfr/test_listen_start_time.py
    overflow: 超えても起動は止めない。再起動のスクリプトが 60 秒で打ち切る
    breakdown:
      - part: import とプロンプトの YAML の読み込み
        value: 約 8 秒
        notes: 他のプロセスが動いている端末での計測
      - part: project-index への配信元の状態の問い合わせ（配信元の通知し）
        value: 0 秒
        notes: 待ち受けの後に回す
    tests:
      - name: test_listen_start_time
        summary: project-index が応答しなくても、決定値以内に接続を受け付ける
        condition: '`project_index` に、接続を受けて応答を返却しない偽物の HTTP サーバーを向けて、`dev-docs serve` を子プロセスで起動する'
        measurement: 起動から TCP の接続が通るまでの時間を測る
        expected: 20 秒以内で、project-index への問い合わせが終わる前に接続が通る
    status: planned
  - id: NFR-14
    name: project-index への問い合わせの制限時間
    english_name: project_index_timeout
    category: 耐障害
    external_constraint: project-index が配信元の変換のスクリプトを止める制限時間（project-index のスクリプトの制限時間。既定 30 秒）
    source_kind: 外部 API の制限
    source: shuhei1101/project-index#14（project-index の読み取り API）
    value: '45'
    unit: 秒
    rationale: 文書の取得は project-index が `converters[]` のスクリプトを動かす間待つため、下流の制限時間 30 秒に 50% を乗せて切り上げた（規約『資源の値の決め方』の入れ子の待ち）。project-index のスクリプトの制限時間を変えたら合わせて再決定する
    overflow: 打ち切った要求は、project-index につながらないときと同じ 503 と理由を返却する。`dev-docs migrate` が端末の設定の保存を打ち切ったときは、端末の設定を再取得して保存を確認する（project-index は保存してから配信元の再読み込みを終えるまで応答しないため、応答はこの制限時間を超えうる）
    status: planned
  - id: NFR-15
    name: 文書の取得の制限時間
    english_name: document_fetch_timeout
    category: 耐障害
    external_constraint: project-index への問い合わせの制限時間（NFR-14、45 秒）は問い合わせごとに掛かり、文書の取得は project-index へ配信元の設定・文書の一覧・文書を問い合わせる
    source_kind: 外部 API の制限
    source: https://github.com/shuhei1101/dev-docs/pull/230
    value: '70'
    unit: 秒
    rationale: 起動の直後に 14 件の配信元を開いた計測（#230 の計画書）で、開けた 1 回目の問い合わせの合計が最大で約 45 秒（claude-balancer。配信元の設定 3.0 秒・文書の一覧 38.2 秒・文書 3.9 秒）だった。規約『資源の値の決め方』の利用者が待つタイムアウトとして、実測の最大に 50% の余裕を乗せて切り上げた。問い合わせごとの制限時間（NFR-14）は、この制限時間の残り時間を超えない。実測は配信元ごとに 1 回で、測る作業を残す
    overflow: 打ち切った取得は、project-index から応答が無かったことと project-index のアドレスを持つ 503 を返却する。画面は、取得を始めてからこの制限時間に 5 秒を加えた時間以内に、読み込み中の表示をやめて理由を出す
    measurement: 接続を受けたまま応答しない偽の project-index につなぎ、文書の取得を送信してから 503 が返るまでの時間を測る
    status: planned
    refs:
      - NFR-155-1#requirements[project-index への問い合わせの制限時間]
  - id: NFR-16
    name: 再度開いた配信元の文書の取得の時間
    english_name: document_fetch_time
    category: 性能
    external_constraint: project-index の読み取り API は、配信元の commit ごとの最初の処理（リビジョンの書き出し）を終えた後も、1 つの問い合わせに最大で 9.35 秒かかる（#230 の計測）。既定のブランチが進んだ後の最初の問い合わせは、その commit のリビジョンを書き出すため遅くなり、その時間は shuhei1101/project-index#85 が扱う
    source_kind: 外部 API の制限
    source: https://github.com/shuhei1101/dev-docs/pull/230
    value: '18'
    unit: 秒
    rationale: 稼働中の project-index へ、配信元の設定・リビジョン・文書の一覧を同時に送信し、続けて文書を送信する計測を 14 件の配信元で 3 回ずつ行った（#230 の計画書）。同時に送信した 3 つは最も長いものとほぼ同じ時間で終わり、project-index は並行して処理した。合計の最大は 11.74 秒（voice-input の 1 回目）で、規約『資源の値の決め方』の 50% の余裕を乗せて切り上げた。1 回目の alias-inject（23.14 秒）と observability（8.78 秒）は、project-index のログでその問い合わせの間に自分の既定のブランチの進んだ後の commit のリビジョンを書き出していたため、external_constraint の前提に回して決定値に使用しない。実測は 40 回で、測る作業を残す
    overflow: 超えても文書の取得の制限時間（NFR-15）までは待つ
    measurement: 'Issue #225 の `dd2.cjs` で 14 件の配信元を 2 回ずつ開き、project-index のログでリビジョンを書き出していない間の 2 回目の文書の取得の時間を測る。結合テストでは、問い合わせごとに一定の時間だけ待ってから返却する偽の project-index で、問い合わせを同時に送信していることを確認する'
    status: planned
    refs:
      - SC-155-7#scenarios[正常シナリオ（配信元を再度開く）]
lead: 外部の制約から逆算した dev-docs の決定値を定め、時間・上限などの値を決める・変えるときに参照する。
