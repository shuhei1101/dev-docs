verification:
  state: 済
  date: '2026-11-17'
  detail: '`uvx --from actionlint-py==1.7.12.25 --with shellcheck-py==0.11.0.1 actionlint` を直下で実行し、`.github/workflows/pages.yml` に違反が無く終了コード 0 で終わることを確認した。`-version` は 1.7.12 を返却した。'
