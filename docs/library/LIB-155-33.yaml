  source: テスト実行方法の lint の層の `uvx --from actionlint-py==1.7.12.25`
catalogs:
  - name: CLI
    version: 1.7.12
    entries:
      - name: actionlint
        kind: コマンド
        purpose: 引数を省いて `.github/workflows/` の全ての workflow のファイルを検査し、違反があれば 0 以外で終わる
      - name: shellcheck との連携
        kind: 設定
        purpose: '`PATH` に shellcheck があると `run:` のスクリプトも検査する。`uvx --with shellcheck-py==0.11.0.1` で追加する'
lead: GitHub Actions の workflow のファイルを静的に検査する actionlint の利用方法を定め、lint の層の workflow の検査を修正するときに参照する。
purl: pkg:pypi/actionlint-py
dependency_scope: 開発のみ
adoption: 採用
