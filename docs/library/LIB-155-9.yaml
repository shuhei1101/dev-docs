id: LIB-155-9
title: "mdmark"
kind: "CDN の JS"
version:
  current: v0.11.0
  latest: v0.10.0
  checked_on: '2026-11-09'
  source: https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@v0.11.0/・`package.json` の `devDependencies`
  pinning: 'mdmark の develop にスプリントの区切りで打つタグで固定する。上げるときは、タグを書き換える。jsDelivr はタグを 1 年キャッシュする（`cache-control: public, max-age=31536000, s-maxage=31536000, immutable`）。`mount` は動的 `import()` で読み込み、integrity を指定できないため integrity は付けない。文書の取得の結合テストで図を点検する CLI は、`devDependencies` の `github:shuhei1101/mdmark#v0.10.0` で固定する'
catalogs:
  - name: API
    version: v0.10.0
    entries:
      - name: mount
        kind: 関数
        purpose: 要素へ Markdown を描き、後片付けの関数を返す
      - name: commentStore.load / save
        kind: コールバック
        purpose: コメントの読み込みと追加
      - name: commentStore.update / remove
        kind: コールバック
        purpose: コメントの修正と削除
        description: '[mdmark#222](https://github.com/shuhei1101/mdmark/issues/222) で入り、v0.10.0 の master にある'
      - name: baseMarkdown
        kind: 引数
        purpose: 比較元の Markdown から変わった箇所を強調する
        description: '[mdmark#222](https://github.com/shuhei1101/mdmark/issues/222) で入り、v0.10.0 の master にある。変わったブロックは `.mdmark-diff-block[data-kind="add"]`（変更後の内容）、比較元にだけあるブロックは `[data-kind="del"]` で描く'
      - name: onColumnsChange
        kind: コールバック
        purpose: 表の列の出し入れを知らせる
        description: '[mdmark#222](https://github.com/shuhei1101/mdmark/issues/222) で入り、v0.10.0 の master にある。引数は `{tableIndex, hidden}` で、`tableIndex` は `+columns` の表だけの出る順の番号。列の出し入れは `テーブル設定` のボタンで開くダイアログの `「{列名}」を隠す`・`「{列名}」を表示` のボタンで行い、隠した列があるときはボタンの読み上げ名が `テーブル設定（{件数} 列を非表示）` になる'
      - name: reloadComments / focusComment
        kind: メソッド
        purpose: コメントのマーカーの描き直しとスクロール
        description: '[mdmark#222](https://github.com/shuhei1101/mdmark/issues/222) で入り、v0.10.0 の master にある'
      - name: opts.index
        kind: 引数
        purpose: 索引の `terms`（用語）と `docs`（文書の別名）で本文の語にツールチップを付ける
        description: '`mount` の `opts.index`。形は mdmark の `docs/リファレンス/索引.md`（`terms[]` は `id`・`term`・`meaning` が必須で `aliases`・`avoid` を持てる。`docs[]` は `id`・`path`・`title` が必須で `description`・`aliases` を持てる）。Schema に合わない項目は mdmark が除いて使う。文書の取得の `aliases` を `toMdmarkIndex` で読み替えて渡す'
        status: planned
      - name: '<!-- er -->'
        kind: 記法
        purpose: 'スキーマ駆動の変換の `x-diagram: er` を ER 図の部品で描く'
        description: '[mdmark#298](https://github.com/shuhei1101/mdmark/pull/298) で入り、v0.10.0 の master にある。定義は `title`・`scope`・`updated`・`width`・`tables[]`（`id`・`name`・`label`・`x`・`y`・`w`・`columns[]` の `name`・`type`・`pk`・`fk`・`nn`・`desc`）・`relations[]`（`from`・`fromColumn`・`fromCard`・`to`・`toColumn`・`toCard`・`label`）。関係の端の列は省けず、無い列を指すと図全体が書き方の警告になる。多重度は `1`・`0..1`・`1..n`・`0..n`'
      - name: '<!-- flow -->'
        kind: 記法
        purpose: 'スキーマ駆動の変換の `x-diagram` の flow 系・`state` と、手で書く Mermaid の `flowchart` をフロー図の部品で描く'
        description: 'ノードの `kind` は `llm`・`dm`・`script`・`mcp`・`data`・`external` と、判定の `start`・`question`・`action`・`result`（[mdmark#268](https://github.com/shuhei1101/mdmark/pull/268) で入り、v0.10.0 の master にある）。ノードは `hint`（ツールチップの説明）、線は `line`（`flow`・`read`・`write`・`reply`・`loop`）・`label`・`labelAt`・`tip`（ラベルのツールチップ。ラベルの無い線には出ない）、定義は中の箱を囲む `frame`（`title`・`x`・`y`・`w`・`h`）を持てる'
  - name: コマンド
    version: v0.10.0
    entries:
      - name: mdmark check --text
        kind: コマンド
        purpose: Markdown の文字列を、描画時の書き方の警告・知らない印・図の配置のずれで点検する
        description: '[mdmark#328](https://github.com/shuhei1101/mdmark/pull/328) で入り、v0.10.0 から使用できる。npm のレジストリに公開されず、Node 24 以降で動く。設定ファイルを渡さないときは、起動したフォルダから上へ `mdmark.config.yaml` を探し、無ければ既定の設定で点検する'
        params:
          - name: --text
            type: str
            required: true
            description: 点検する Markdown。`-` を渡すと標準入力から読む
          - name: --config
            type: str
            required: false
            default: なし（起動したフォルダから上へ `mdmark.config.yaml` を探す）
            description: 使う設定ファイルのパス
        returns:
          - name: 標準出力
            type: str
            description: 'ずれ 1 つを `-:{行}: {種類}: {内容}` の 1 行で並べ、最後に `ずれ {件数} 件` の行を出す'
            notes: 内容は、何が合わないかと直し方の日本語の 1 文。`diagram_invalid`・`syntax_warning` は描画時の書き方の警告と同じ文
          - name: 終了コード
            type: int
            description: '`0` はずれが 0 件。`1` はずれが 1 件以上'
            notes: 引数の誤りなどで点検しなかったときも `1` で、標準エラーに原因を出し、`ずれ {件数} 件` の行を出さない
      - name: mdmark build
        kind: コマンド
        purpose: 設定の `build` で決めた複数の Markdown を、文書を行き来できる 1 枚の HTML にまとめる
        description: v0.10.0 から使用できる。npm のレジストリに公開されず、Node 24 以降で動く。設定の `build.include`（まとめる Markdown の glob）・`build.entry`（最初に開く文書）・`build.out`（書き出す HTML のパス）を参照し、`build.out` が既にあれば上書きする
        params:
          - name: --config
            type: str
            required: false
            default: なし（起動したフォルダから上へ `mdmark.config.yaml` を探す）
            description: 使用する設定ファイルのパス。`build` を持たない設定では終了コード `1` で終わる
        returns:
          - name: 標準出力
            type: str
            description: '`書き出した: {build.out}（文書 {件数} 件）` の 1 行'
          - name: 標準エラー
            type: str
            description: '警告を `警告: {内容}` の 1 行ずつ出す'
            notes: まとめた HTML に含まれない文書へのリンクと、`build.entry`・`build.glossary` がまとめる文書に該当しないことを含む
          - name: 終了コード
            type: int
            description: '`0` は書き出した。`1` は設定に `build` が無い・`build.include` に該当する文書が無い・出力先へ書き込めないなどで書き出さなかった'
            notes: '`1` のときは標準エラーに原因と修正方法を出す'
lead: Markdown を描き、本文の文字列へコメントを付けられるようにするブラウザの JS。
dependency_scope: 必須
adoption: 採用
used_in:
  - frontend/src/features/docs/doc-view/hooks/use-mdmark.ts
  - tests/integration/server/test_get_document.py
  - scripts/build_pages.py
upstream: shuhei1101/mdmark
verification:
  state: 済
  date: '2026-11-09'
  detail: 'v0.10.0 の master を jsDelivr から読み、画面の結合テストの環境の Chromium で、`テーブル設定` のボタン・ダイアログの `「{列名}」を隠す`・`「{列名}」を表示` のボタンと、隠した列があるときの読み上げ名 `テーブル設定（1 列を非表示）` を確認した。以下は v0.9.0 で確認した内容。`dev-docs serve` を起動し、Chromium で文書の画面を開いて、jsDelivr の `dist/index.js`（200）を読み込み、`dist/index.css` を置き、見出し・表・コードブロックが本文に描かれ、目次が出ることを確かめた。本文の文字列を選んでコメントを追加すると、`commentStore.save` が呼ばれ、コメントのパネルに見出しつきで並ぶ。`mount` は `commentStore.load({docId})`・`save({docId, comment})` を受け、`update` は Markdown の文字列を受ける。`comments` の機能は既定でオフのため、`config.features.comments` を `true` にして渡す。`v0.9.0` のタグに `dist/mount.js` は無い。v0.9.0 では、描く先の要素の幅が 48rem 未満のとき `.mdmark-content [id]` に `scroll-margin-block-start: calc(var(--mdmark-sticky-top, 0px) + 3.5rem)` が当たり、`side-toc`（右側の目次）の機能が既定でオンになる。E2E `test_利用者がコメントを渡す.py` の 4 件が v0.9.0 の master で pass する。CLI の `check --text` は未確認（v0.9.0 の master と develop の `dist/cli.js` は `--text` を持たず、develop の `src/cli/main.ts` を esbuild で束ねると依存（`ajv/dist/2020.js`）を解けないため、リリース前の CLI を動かせない。単体テストは同じ出力を返す偽の `mdmark` で確かめる）'
official_url: https://github.com/shuhei1101/mdmark
