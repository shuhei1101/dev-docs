title: dev-docs
summary: dev-docs のドキュメント全体の目次
items:
  - page: scenario/
    summary: 単一 / 複合ユースケースの業務フロー設計（E2E テストの元）
  - page: interface/
    summary: サブシステムの外部インターフェースと処理フロー（結合テストの元）
  - page: module/
    summary: クラス / 関数 / 定数をドメイン分類でまとめる（単体テストの元）
  - page: screen/
    summary: 画面ごとの要素と、使う部品へ渡す値
  - page: component/
    summary: 画面の要素が使う部品の引数・スロット・イベント・状態
  - page: er/
    summary: データストアの構造
  - page: config/
    summary: 設定値と環境変数の一覧
  - page: architecture/
    summary: システム全体構成（サーバーと管理用プラグイン）
  - page: nonfunctional/
    summary: 外部の制約から逆算したアプリ側の決定値（非機能要件テストの元）
  - page: external-api/
    summary: 採用済みの外部 API のリファレンス
  - page: library/
    summary: 採用済みの外部ライブラリのリファレンス
  - page: test-procedure/
    summary: テストの実行方法
  - page: dev-command/
    summary: 開発で使うコマンドの分類ごとの前提と手順
  - page: design-policy.md
    summary: dev-docs の画面全体に通すデザインの方向性
  - page: guide/
    summary: dev-docs の使い方（はじめに・使い方・リファレンス）
