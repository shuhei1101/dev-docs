id: API-155-1
title: "project-index の読み取り API"
visibility: internal
lead: 配信元の一覧と状態・文書・検索・リビジョンを返却し、端末の設定の配信元の行を保存する project-index の HTTP の API の利用方法を定め、project-index の呼び出しを修正するときに参照する。
used_in:
  - src/dev_docs/integrations/project_index/
verification:
  state: 済
  detail: '提供する側の shuhei1101/project-index の develop の `f36ba69`（[読み取り API と端末の設定の API の提供](https://github.com/shuhei1101/project-index/pull/15)・[読み取り API の文書の一覧への値とバージョンの追加](https://github.com/shuhei1101/project-index/pull/49)）の IF-22〜IF-32 と照合した。パス・状態コード・`application/problem+json` の `missing` は一致する。応答のキーは camelCase で、検討事項の一覧が `decisions[].folders`、検討事項の文書が `body`、端末の設定の行が `row` に包まれず `outsideRead` を持ち、保存の応答が状態だけ、行の追加の本文が `{source}` で応答が `result`（`added`・`exists`）になる。`f36ba69` に固定した本物の project-index を相手に、結合テストの文書の取得・画面の検索・リビジョンの一覧・端末の設定の取得と保存が pass した（`docs/pr/183/テスト結果/20261113204913_e168fba_結合テスト.log`）。develop の `7177d39` の IF-30・IF-31 とコードで、`PUT /settings/sources` の `expectedVersion`・400・409、排他ロックを持ったままの再読み込み、`GET` がロックを待たないことを照合した。develop の `42632c5` の IF-24・IF-25 で、文書の一覧の `common_keys`・`documents[].commonKeys` と文書の取得の `metadata.commonKeys` を照合し、127.0.0.1:8786 の project-index が `common_keys=true` に `commonKeys` を返却することを確認した。`PUT /settings/sources` の行の外部の読み取りのキーは `outside_read` で、`GET` の応答の `outsideRead` と違う。稼働中の project-index（`7177d39`）へ古い `expectedVersion` を付けた PUT で、行のキーが `outside_read` なら 409、`outsideRead` なら 400（`sources[{n}].outsideRead: Extra inputs are not permitted`）を返却することを確認した（#203）。稼働中の project-index（127.0.0.1:8786）への GET `/sources?include_loading=true` が 200 で `sources[]` を返却することを確認した（確認した時点で全ての配信元の読み込みを終えていたため `loading` は観測していない）。`storage` を持つ行はこの端末の設定に無く、GET `/settings/sources` では観測していない。`loading`・`storage` の応答は、結合テストで本物の project-index を相手に確かめる（#265）。書き込みの API（`POST /sources/{source}/commits`）は、develop の `552c341` の IF-38 と照合した。稼働中の project-index（127.0.0.1:8786、`552c341`）へ 2026-11-23 に送信し、`writeApiKinds` が空の knowledge への `dryRun: true` の書き込みが 403（`DirectCommitNotPermittedError`、`kinds` に配信元の設定の `direct_commit.kinds[]`、`nextSteps` に `sources[].direct_commit.write_api_kinds`）、`writes`・`deletes` が空の要求が 400（`errors[]`）を返却することを確認した。この端末には `writeApiKinds` を持つ配信元が無く、200（`dryRun: true` の `results[].diff`）・409・422・502 は観測していないため、直コミットの結合テスト（IF-155-29）で一時フォルダの配信元と本物の project-index を相手に確認する。develop の `552c341` の project-index を相手にした直コミットの結合テスト（`tests/integration/server/test_post_commits.py`）で、`results[].kind` が `write`・`delete`、422 の `errors[].path` が `writes[{添字}]`・`deletes[{添字}]` で始まり、409 が `docId`・`current` を持つこと、`set` の共通のキー `tags` は名前の配列で受け、`metadata: {tags: tags[].name}` の文書では `main` を保った配列に戻すこと（オブジェクトの配列を送信すると 400）、`message` が必須で、差分確認の削除の `diff` は空であることを確認した。配信元の設定の取得（IF-23）が `documents[].metadata`（例: knowledge の `tags: tags[].name`・`main_tags: tags[main].name`）を返却することも同じ端末で確認した'
  date: '2026-11-17'
version:
  api_version: shuhei1101/project-index の develop の `7177d39`
  checked_on: '2026-11-14'
base_urls:
  - env: 手元の端末
    url: http://127.0.0.1:8786
official_url: https://github.com/shuhei1101/project-index
auth:
  method: なし（`127.0.0.1` でだけ待ち受ける）
error_format: RFC 9457 の `application/problem+json`（[読み取り API と端末の設定の API を提供する](https://github.com/shuhei1101/project-index/issues/14) で決まる）
timeout: 45 秒（dev-docs の非機能要件『project-index への問い合わせの制限時間』）
endpoints:
  - name: GET /sources
    method: GET
    path: /sources
    summary: 配信元ごとの ID・状態（`serving`・`not_served`・`disabled`）と、配信していない理由（`errors[]` の `{path, reason}`）を返却する（IF-22）。`?include_loading=true` を付けると全ての配信元の読み込みを待たずに返却し、読み込みが終わっていない配信元を `loading` で端末の設定の順に並べる（`id` を持たない行は `sources[{n}]` の ID）。付けないと全ての行の読み込みを待ち、`loading` を返却しない
    status_codes:
      - code: '200'
        condition: 返却した（配信元が 0 件でも 200）
  - name: GET /sources/{source}/config
    method: GET
    path: /sources/{source}/config
    summary: '配信元の設定の `nav`・`documents[]`（スクリプトのコマンドを除き、キーは配信元の設定のまま）・`decisions.folders`・`github`（`repository`・`issueLabels`）・`diff.ignore_keys`・`directCommit.metadataOnlyKinds`（`direct_commit.kinds[]` のうち `body: false` の種類）を返却する（IF-23）。`?schemas=true` で `schemas` に `documents[].id` ごとの `$ref` を解いた種類のスキーマを入れる。`default_ref` と Git の配信元かは GET `/sources/{source}/refs` から取る'
    status_codes:
      - code: '200'
        condition: 返却した
      - code: '404'
        condition: 配信元が無い・配信していない（`missing` が `source`・`not_served`）
  - name: GET /sources/{source}/docs
    method: GET
    path: /sources/{source}/docs
    summary: 指定のリビジョンの文書の ID・パス・種類・名前・概要・タグ・公開範囲・本文のファイルのパス・バージョン（`version`）を返却する（IF-24）。`?values=true` で文書ごとの値（`value`）も入れる。`?common_keys=true` で、配信元の設定の行の `metadata`・`alias_type` で解決した共通のキー（`commonKeys`。中のキーは project-index の `METADATA_KEYS` の名前のままで、値の無いキーを持たない。指定しないと `null`）も入れる。YAML として読み込めなかったファイルは一覧に入らず、文書の取得の `conversionError` で返る。配信元の設定の `documents[].search_exclude` に該当する文書も一覧から除かず、文書ごとの `excluded`（bool）で返却する
    status_codes:
      - code: '200'
        condition: 返却した（文書が 0 件でも 200）
      - code: '404'
        condition: 配信元が無い・配信していない、リビジョンを解決できない（`missing` が `source`・`not_served`・`ref`）
  - name: GET /sources/{source}/docs/{path}
    method: GET
    path: /sources/{source}/docs/{path}
    summary: 指定のリビジョンの文書の値・`$ref` を解いた種類のスキーマ・メタデータ（共通のキー `metadata.commonKeys` を常に含む。文書の一覧の `commonKeys` と同じ値）・本文と本文のファイルのパス（管理用の YAML の行の文書）・`converters[]` の Markdown か変換の失敗（`conversionError`）・更新日時と、文書の値の最上位のキーごとのバージョン（`itemVersions`。直コミットの `expected_version` の辞書に使用する）を返却する（IF-25）。リビジョンは `?ref=` にブランチ・コミットを指す。パスは文書のファイルか本文のファイルのパスで取得し、`records` の行の文書は `?id=` に文書の ID を指して 1 つに選ぶ
    status_codes:
      - code: '200'
        condition: 返却した（変換に失敗したとき・YAML を読み込めないときも `conversionError` を入れて 200）
      - code: '404'
        condition: 配信元・リビジョン・文書が無い（`missing` が `source`・`not_served`・`ref`・`doc`）
  - name: GET /sources/{source}/decisions
    method: GET
    path: /sources/{source}/decisions
    summary: '`decisions.folders` にある検討事項の ID と、ID ごとに該当するフォルダの数（`decisions[]` の `{id, folders}`）を返却する（IF-26）'
    status_codes:
      - code: '200'
        condition: 返却した（`decisions.folders` を持たない配信元は空の一覧）
      - code: '404'
        condition: 配信元が無い・配信していない
  - name: GET /sources/{source}/decisions/{id}
    method: GET
    path: /sources/{source}/decisions/{id}
    summary: '`decisions.folders` のうちちょうど 1 つのフォルダにある検討事項の文書の本文（`body`）と、あったフォルダを返却する（IF-27）'
    status_codes:
      - code: '200'
        condition: 返却した
      - code: '404'
        condition: 該当するフォルダが 0 個か 2 個以上（`missing` が `doc`、`reason` が `not_found`・`ambiguous`）
  - name: GET /sources/{source}/search
    method: GET
    path: /sources/{source}/search
    summary: '単語を含む文書の ID（`id`）・文書のファイルのパス（`filePath`）・名前と一致した箇所、一致した総件数を返却する（IF-28）。`documents[].search_exclude` に該当する文書は既定の結果から除き、除いた件数を `excludedCount`（1 件以上除いたときだけ持つ）で返却する。`?include_excluded=true` で除かずに返却し、該当する文書に `excluded: true` を付ける'
    status_codes:
      - code: '200'
        condition: 返却した（一致が 0 件のときも 200）
      - code: '400'
        condition: '`q` が空か 200 文字を超える'
      - code: '404'
        condition: 配信元が無い・配信していない、リビジョンを解決できない
  - name: GET /sources/{source}/refs
    method: GET
    path: /sources/{source}/refs
    summary: Git の配信元か・`defaultRef`・ブランチ・タグ・最近の commit を返却する（IF-29）
    status_codes:
      - code: '200'
        condition: '返却した（Git 管理外の配信元は `git: false`）'
      - code: '404'
        condition: 配信元が無い・配信していない
  - name: GET /settings/sources
    method: GET
    path: /settings/sources
    summary: 端末の設定のパス（`settingsPath`）と、`sources[]` の行ごとの `id`・`config`・`enabled`・`scope`・`outsideRead`・`storage`（`storage.type` が `git`・`disk`。記載していない行は返却しない）・`directCommit`（`writeApiKinds` など。記載していない行は返却しない）と状態（`status`・`errors`・`configVersion`）、端末の設定の内容のバージョン（`version`。ファイル全体の内容のハッシュ）を返却する（IF-30）
    status_codes:
      - code: '200'
        condition: 返却した
  - name: PUT /settings/sources
    method: PUT
    path: /settings/sources
    summary: '`sources[]` を丸ごと保存して全ての配信元を再読み込み、配信元ごとの状態（`id`・`status`・`errors`）と保存した後の内容のバージョン（`version`）を返却する（IF-31）。送信しなかったキーはファイルの同じ配信元の行の今の値で残る。行のキーは `id`・`config`・`enabled`・`scope`・`outside_read`・`storage` で（送信しなかった `storage` もファイルの今の値で残る）、外部の読み取りは `GET /settings/sources` の応答の `outsideRead` ではなく `outside_read` で送信する（`outsideRead` は知らないキーとして 400）。本文の `expectedVersion` を指定すると、今の内容のバージョンと照合してから保存する。保存した直後にファイルへ書き込み、再読み込みが終わるまで端末の設定の排他ロックを持ち続ける（`GET /settings/sources` はそのロックを待たず、再読み込みの途中の行を `pending_reload` で返却する）'
    status_codes:
      - code: '200'
        condition: 保存した
      - code: '403'
        condition: 別のオリジンの要求（dev-docs はサーバーの側から `Origin` を付けずに呼ぶ）
      - code: '422'
        condition: スキーマに通らない（`errors[]`）
      - code: '400'
        condition: 本文の型の検証に通らない（`errors[].path` は `sources[{n}].enabled` のような行の位置。知らないキーも 400）
      - code: '409'
        condition: '`expectedVersion` が今の端末の設定の内容のバージョンと違う（今の内容のバージョンを `current` で返却する）'
  - name: POST /settings/sources
    method: POST
    path: /settings/sources
    summary: 本文 `{source}` の配信元の行を 1 行追加して再読み込みする（IF-32）。応答の `result` が `added`・`exists`、`exists` のときは `same` に内容が同じか
    status_codes:
      - code: '201'
        condition: 追加した
      - code: '403'
        condition: 別のオリジンの要求（dev-docs はサーバーの側から `Origin` を付けずに呼ぶ）
      - code: '409'
        condition: 同じ id の行がある
      - code: '422'
        condition: スキーマに通らない
  - name: POST /sources/{source}/commits
    method: POST
    path: /sources/{source}/commits
    summary: '`writes`（`write_docs` の操作）・`deletes`（`{id, expectedVersion}`）・`message`・`dryRun`・`baseCommit`（編集を始めたときのコミット）を 1 回で受け（`update` の `set` は共通のキー・`#` で始まる参照の型の項目のパス（`#items[{x-key の値}].body`）・本文のファイルの文書の `@body`、`replace` は文書の値の全体）、`write_docs`・`delete_docs` と同じ検査に合格させてから 1 つのコミットにしてプッシュし、`applied`・`results[]`（`kind`・`index`・`id`・`status`・`version`・`diff`）・`commit`（`sha`・`branch`・`retried`。`dryRun: true` は `null`）を返却する（IF-38）。今のブランチでバージョンが合わない・文書が無い・検査に合格しないときは、`baseCommit` からのブランチ（`project-index/conflict/…`。クローンにだけ作る）に修正を残し、端末の設定の `sources[].direct_commit.on_conflict.command` を実行して、`conflict`（`branch`・`commit`・`baseCommit`・`errors[]`・`script` の `exitCode`・`timedOut`・`stdout`・`stderr`）を 200 で返却する。書き換わる種類は、端末の設定の `sources[].direct_commit.write_api_kinds`（GET `/settings/sources` の `directCommit.writeApiKinds`）と配信元の設定の `direct_commit.kinds[]` の両方に要る'
    status_codes:
      - code: '200'
        condition: 'コミット・プッシュした、衝突して修正をブランチに残した（`conflict`）、または `dryRun: true` で検査に合格した'
      - code: '400'
        condition: 要求の型の検証に失敗した
      - code: '403'
        condition: 別のオリジンの要求、許可していない種類（`DirectCommitNotPermittedError`。`kinds` と `nextSteps`）・上書きできないブランチ・読み取り専用の種類
      - code: '404'
        condition: 配信元が無い・配信していない、更新や削除する文書が無い
      - code: '409'
        condition: 文書のバージョンが合わない（`VersionMismatchError`）・直コミットを使用できない・ワークツリーが無い・未プッシュのコミットか未コミットの変更がある・参照されている文書の削除・プッシュが 2 回断られた
      - code: '422'
        condition: 検査に合格しない（`errors[]` に `writes`・`deletes` の別と添字・項目のパス・決まり・直し方）
      - code: '500'
        condition: '`generators[]` が失敗した'
      - code: '502'
        condition: リモートからの取得・プッシュに失敗した
      - code: '504'
        condition: 書き込みの期限を過ぎた
notes:
  契約: 原本は提供する側の shuhei1101/project-index のインターフェース定義 IF-22〜IF-32。付け替え口のモックはこのバージョンの入出力で記載し、バージョンを記録する
  dev-docs が前提にする応答: 文書の一覧の値とバージョン（`nav` の `auto` の `filter`・`group_by` と差分の変わったキー・変わった文書のマーカーのため）、`records` の行の文書の `?id=` での指定、検索の結果の `id`・`filePath`、配信元の設定の `diff.ignore_keys` と `schemas`（絞り込みのフィールドの一覧のため）。[読み取り API への値とバージョンの追加](https://github.com/shuhei1101/project-index/issues/46) で追加された。文書の一覧の `commonKeys` と文書の取得の `metadata.commonKeys`（文書の共通のキーを dev-docs で組み立てないため）。[共通のキーを返却する読み取り API](https://github.com/shuhei1101/project-index/pull/54)（`42632c5`）で追加された。リビジョンの一覧の `branches[].commit`・`tags[].commit` と、文書の一覧の `ref` に短縮の commit を指せること（文書の一覧を commit ごとに保持するため。文書の一覧の応答の `ref` は指した値のままで commit を返却しない。2026-11-20 に 127.0.0.1:8786 の project-index で確認した）
