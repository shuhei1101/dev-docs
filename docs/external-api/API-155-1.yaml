id: API-155-1
title: "project-index の読み取り API"
visibility: internal
lead: project-index が配信している配信元の一覧と状態・文書・検索・リビジョンを返し、端末の設定の配信元の行を保存する HTTP の API。
used_in:
  - src/dev_docs/integrations/project_index/
verification:
  state: 済
  detail: '提供する側の shuhei1101/project-index の develop の `f36ba69`（#14・#15 と #46・#49）の IF-22〜IF-32 と照合した。パス・状態コード・`application/problem+json` の `missing` は一致する。応答のキーは camelCase で、検討事項の一覧が `decisions[].folders`、検討事項の文書が `body`、端末の設定の行が `row` に包まれず `outsideRead` を持ち、保存の応答が状態だけ、行の追加の本文が `{source}` で応答が `result`（`added`・`exists`）になる。`f36ba69` に固定した本物の project-index を相手に、結合テストの文書の取得・画面の検索・リビジョンの一覧・端末の設定の取得と保存が pass した（`docs/pr/183/テスト結果/20261113204913_e168fba_結合テスト.log`）。develop の `7177d39` の IF-30・IF-31 とコードで、`PUT /settings/sources` の `expectedVersion`・400・409、排他ロックを持ったままの読み直し、`GET` がロックを待たないことを照合した'
  date: '2026-11-14'
version:
  api_version: shuhei1101/project-index の develop の `7177d39`
  checked_on: '2026-11-14'
base_urls:
  - env: 手元の端末
    url: http://127.0.0.1:8786
official_url: https://github.com/shuhei1101/project-index
auth:
  method: なし（`127.0.0.1` でだけ待ち受ける）
error_format: RFC 9457 の `application/problem+json`（shuhei1101/project-index#14 で決まる）
timeout: 45 秒（dev-docs の非機能要件『project-index への問い合わせの制限時間』）
endpoints:
  - name: GET /sources
    method: GET
    path: /sources
    summary: 配信元ごとの ID・状態（`serving`・`not_served`・`disabled`）と、配信していない理由（`errors[]` の `{path, reason}`）を返す（IF-22）
    status_codes:
      - code: '200'
        condition: 返した（配信元が 0 件でも 200）
  - name: GET /sources/{source}/config
    method: GET
    path: /sources/{source}/config
    summary: 配信元の設定の `nav`・`documents[]`（スクリプトのコマンドを除き、キーは配信元の設定のまま）・`decisions.folders`・`github`（`repository`・`issueLabels`）・`diff.ignore_keys` を返す（IF-23）。`?schemas=true` で `schemas` に `documents[].id` ごとの `$ref` を解いた種類のスキーマを入れる。`default_ref` と Git の配信元かは GET `/sources/{source}/refs` から取る
    status_codes:
      - code: '200'
        condition: 返した
      - code: '404'
        condition: 配信元が無い・配信していない（`missing` が `source`・`not_served`）
  - name: GET /sources/{source}/docs
    method: GET
    path: /sources/{source}/docs
    summary: 指定のリビジョンの文書の ID・パス・種類・名前・概要・タグ・公開範囲・本文のファイルのパス・バージョン（`version`）を返す（IF-24）。`?values=true` で文書ごとの値（`value`）も入れる。YAML として読めなかったファイルは一覧に入らず、文書の取得の `conversionError` で返る
    status_codes:
      - code: '200'
        condition: 返した（文書が 0 件でも 200）
      - code: '404'
        condition: 配信元が無い・配信していない、リビジョンを解決できない（`missing` が `source`・`not_served`・`ref`）
  - name: GET /sources/{source}/docs/{path}
    method: GET
    path: /sources/{source}/docs/{path}
    summary: 指定のリビジョンの文書の値・`$ref` を解いた種類のスキーマ・メタデータ・本文と本文のファイルのパス（管理用の YAML の行の文書）・`converters[]` の Markdown か変換の失敗（`conversionError`）・更新日時を返す（IF-25）。パスは文書のファイルか本文のファイルのパスで引き、`records` の行の文書は `?id=` に文書の ID を指して 1 つに選ぶ
    status_codes:
      - code: '200'
        condition: 返した（変換に失敗したとき・YAML を読み込めないときも `conversionError` を入れて 200）
      - code: '404'
        condition: 配信元・リビジョン・文書が無い（`missing` が `source`・`not_served`・`ref`・`doc`）
  - name: GET /sources/{source}/decisions
    method: GET
    path: /sources/{source}/decisions
    summary: '`decisions.folders` にある検討事項の ID と、ID ごとに当たるフォルダの数（`decisions[]` の `{id, folders}`）を返す（IF-26）'
    status_codes:
      - code: '200'
        condition: 返した（`decisions.folders` を持たない配信元は空の一覧）
      - code: '404'
        condition: 配信元が無い・配信していない
  - name: GET /sources/{source}/decisions/{id}
    method: GET
    path: /sources/{source}/decisions/{id}
    summary: '`decisions.folders` のうちちょうど 1 つのフォルダにある検討事項の文書の本文（`body`）と、あったフォルダを返す（IF-27）'
    status_codes:
      - code: '200'
        condition: 返した
      - code: '404'
        condition: 当たるフォルダが 0 個か 2 個以上（`missing` が `doc`、`reason` が `not_found`・`ambiguous`）
  - name: GET /sources/{source}/search
    method: GET
    path: /sources/{source}/search
    summary: 単語を含む文書の ID（`id`）・文書のファイルのパス（`filePath`）・名前と一致した箇所、一致した総件数を返す（IF-28）
    status_codes:
      - code: '200'
        condition: 返した（一致が 0 件のときも 200）
      - code: '400'
        condition: '`q` が空か 200 文字を超える'
      - code: '404'
        condition: 配信元が無い・配信していない、リビジョンを解決できない
  - name: GET /sources/{source}/refs
    method: GET
    path: /sources/{source}/refs
    summary: Git の配信元か・`defaultRef`・ブランチ・タグ・最近の commit を返す（IF-29）
    status_codes:
      - code: '200'
        condition: '返した（Git 管理外の配信元は `git: false`）'
      - code: '404'
        condition: 配信元が無い・配信していない
  - name: GET /settings/sources
    method: GET
    path: /settings/sources
    summary: 端末の設定のパス（`settingsPath`）と、`sources[]` の行ごとの `id`・`config`・`enabled`・`scope`・`outsideRead` と状態（`status`・`errors`・`configVersion`）を返す（IF-30）
    status_codes:
      - code: '200'
        condition: 返した
  - name: PUT /settings/sources
    method: PUT
    path: /settings/sources
    summary: '`sources[]` を丸ごと保存して全ての配信元を読み直し、配信元ごとの状態（`id`・`status`・`errors`）と保存した後の内容のバージョン（`version`）を返す（IF-31）。送らなかったキーはファイルの同じ配信元の行の今の値で残る。本文の `expectedVersion` を渡すと、今の内容のバージョンと照合してから保存する。保存した直後にファイルへ書き込み、読み直しが終わるまで端末の設定の排他ロックを持ち続ける（`GET /settings/sources` はそのロックを待たず、読み直しの途中の行を `pending_reload` で返す）'
    status_codes:
      - code: '200'
        condition: 保存した
      - code: '403'
        condition: 別のオリジンの要求（dev-docs はサーバーの側から `Origin` を付けずに呼ぶ）
      - code: '422'
        condition: スキーマに通らない（`errors[]`）
      - code: '400'
        condition: 本文の型の検証に通らない（`errors[].path` は `sources[{n}].enabled` のような行の位置。知らないキーも 400）
      - code: '409'
        condition: '`expectedVersion` が今の端末の設定の内容のバージョンと違う'
  - name: POST /settings/sources
    method: POST
    path: /settings/sources
    summary: 本文 `{source}` の配信元の行を 1 行追加して読み直す（IF-32）。応答の `result` が `added`・`exists`、`exists` のときは `same` に内容が同じか
    status_codes:
      - code: '201'
        condition: 追加した
      - code: '403'
        condition: 別のオリジンの要求（dev-docs はサーバーの側から `Origin` を付けずに呼ぶ）
      - code: '409'
        condition: 同じ id の行がある
      - code: '422'
        condition: スキーマに通らない
notes:
  契約: 正本は提供する側の shuhei1101/project-index のインターフェース定義 IF-22〜IF-32。付け替え口のモックはこの版の入出力で書き、版を記録する
  dev-docs が前提にする応答: 文書の一覧の値とバージョン（`nav` の `auto` の `filter`・`group_by` と差分の変わったキー・変わった文書のマーカーのため）、`records` の行の文書の `?id=` での指定、検索の結果の `id`・`filePath`、配信元の設定の `diff.ignore_keys` と `schemas`（絞り込みのフィールドの一覧のため）。shuhei1101/project-index#46 で追加された
