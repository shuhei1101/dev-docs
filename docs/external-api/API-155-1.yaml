id: API-155-1
title: "project-index の読み取り API"
visibility: internal
lead: project-index が配信している配信元の一覧と状態・文書・検索・リビジョンを返し、端末の設定の配信元の行を保存する HTTP の API。
used_in:
  - src/dev_docs/integrations/project_index/
verification:
  state: 未確認
  detail: 提供する側の shuhei1101/project-index#14 が未実装のため、Issue に記載した入出力に沿ったモックで確かめる。本物との照合は #164
version:
  api_version: 未定（shuhei1101/project-index#14 で決まる）
  checked_on: '2026-11-12'
base_urls:
  - env: 手元の端末
    url: http://127.0.0.1:8786
official_url: https://github.com/shuhei1101/project-index
auth:
  method: なし（`127.0.0.1` でだけ待ち受ける）
error_format: RFC 9457 の `application/problem+json`（shuhei1101/project-index#14 で決まる）
timeout: 45 秒（dev-docs の非機能要件『project-index への問い合わせの制限時間』）
endpoints:
  - name: GET /sources
    method: GET
    path: /sources
    summary: 配信元の一覧と、配信元ごとの状態・配信していない理由を返す
    status_codes:
      - code: '200'
        condition: 返した（配信元が 0 件でも 200）
  - name: GET /sources/{source}/config
    method: GET
    path: /sources/{source}/config
    summary: 配信元の設定のうち、画面が使うキー（`nav`・`documents[]`・`decisions.folders`・`github`）を返す
    status_codes:
      - code: '200'
        condition: 返した
      - code: '404'
        condition: 配信元が無い・配信していない
  - name: GET /sources/{source}/docs
    method: GET
    path: /sources/{source}/docs
    summary: 指定のリビジョンの文書の一覧（ID・パス・種類・メタデータ）を返す
    status_codes:
      - code: '200'
        condition: 返した
      - code: '404'
        condition: 配信元が無い・配信していない、リビジョンを解決できない
  - name: GET /sources/{source}/docs/{path}
    method: GET
    path: /sources/{source}/docs/{path}
    summary: 指定のリビジョンの文書の値・種類のスキーマ・メタデータ・本文の文字列・本文のファイルのパス（管理用の YAML の行の文書）を返す。`converters[]` を指す種類は、スクリプトが出した Markdown か変換の失敗を返す。パスは文書のファイルか本文のファイルのパスで引ける
    status_codes:
      - code: '200'
        condition: 返した（変換に失敗したときも失敗を入れて 200）
      - code: '404'
        condition: 配信元・リビジョン・文書が無い
  - name: GET /sources/{source}/decisions
    method: GET
    path: /sources/{source}/decisions
    summary: '`decisions.folders` にある検討事項の ID と、ID ごとに当たるフォルダの数を返す'
    status_codes:
      - code: '200'
        condition: 返した（`decisions.folders` を持たない配信元は空の一覧）
      - code: '404'
        condition: 配信元が無い・配信していない
  - name: GET /sources/{source}/decisions/{id}
    method: GET
    path: /sources/{source}/decisions/{id}
    summary: '`decisions.folders` のうちちょうど 1 つのフォルダにある検討事項の文書の本文を返す'
    status_codes:
      - code: '200'
        condition: 返した
      - code: '404'
        condition: 当たるフォルダが 0 個か 2 個以上
  - name: GET /sources/{source}/search
    method: GET
    path: /sources/{source}/search
    summary: 語を含む文書と一致した箇所を返す
    status_codes:
      - code: '200'
        condition: 返した
      - code: '400'
        condition: 語が空・長すぎる
      - code: '404'
        condition: 配信元が無い・リビジョンを解決できない
  - name: GET /sources/{source}/refs
    method: GET
    path: /sources/{source}/refs
    summary: 配信元のブランチ・タグ・最近の commit を返す
    status_codes:
      - code: '200'
        condition: '返した（Git 管理外の配信元は `git: false`）'
      - code: '404'
        condition: 配信元が無い・配信していない
  - name: GET /settings/sources
    method: GET
    path: /settings/sources
    summary: 端末の設定の配信元の行（`outside_read` を含む全てのキー）と、配信元ごとの状態を返す
    status_codes:
      - code: '200'
        condition: 返した
  - name: PUT /settings/sources
    method: PUT
    path: /settings/sources
    summary: 端末の設定の配信元の行を保存して読み直し、配信元ごとの状態を返す
    status_codes:
      - code: '200'
        condition: 保存した
      - code: '422'
        condition: スキーマに通らない
  - name: POST /settings/sources
    method: POST
    path: /settings/sources
    summary: 端末の設定へ配信元の行を 1 行追加する（shuhei1101/project-index#10）。同じ id の行があれば追加せずに知らせる
    status_codes:
      - code: '201'
        condition: 追加した
      - code: '409'
        condition: 同じ id の行がある（内容が同じかを応答に入れる）
notes:
  契約: 正本は提供する側の shuhei1101/project-index#14 のインターフェース定義。パスと入出力はこの Issue に記載した入出力から作った仮のもので、契約が決まったら #164 で合わせる
