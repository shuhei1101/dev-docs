id: TP-155-1
title: "テスト実行方法"
layers:
  - id: TL-1
    name: 単体テスト（バック）
    description: pytest で実行する。外部サービスに依存しない。
    prerequisites:
      - '`dev-docs` の配布を入れた環境で実行する（`--version` のテストが配布のメタデータを読む。`uv run` が同期する）'
    run_all: |-
      ```bash
      uv run pytest tests/unit/
      ```
    run_one:
      label: ファイル
      command: |-
        ```bash
        uv run pytest {単体テストファイルパス}
        ```
    parallel: true
  - id: TL-2
    name: 結合テスト（バック）
    run_all: |-
      ```bash
      uv run pytest tests/integration/
      ```
    description: pytest で実行する。一時フォルダに配信元と端末の設定を作り、dev-docs のアプリを HTTP のテストのクライアントで呼ぶ。文書の取得・画面の検索・リビジョンの一覧・端末の設定の取得と保存は、commit を固定した project-index のクローンを、一時フォルダの端末の設定で子プロセスとして起動して相手にする。起動のテストだけは `dev-docs serve` を子プロセスで起動する。
    prerequisites:
      - '`git` と、`PATH` の `python3`（配信元のスクリプトに使う）が使えること'
      - Linux の `/proc/net/tcp` を読めること（待ち受けのアドレスの確認）
      - '`127.0.0.1` の空きポートが使えること（起動のテストが子プロセスで待ち受ける）'
      - 文書の取得の結合テスト（`tests/integration/server/test_get_document.py`）は、`package.json` の `devDependencies` でバージョンを固定した mdmark の CLI（`node_modules/.bin/mdmark`）で図を点検する。Node 24 以上で、リポジトリの直下で `npm ci` を済ませておくこと
      - '`tests/integration/server/conftest.py` の `PROJECT_INDEX_COMMIT` の project-index を、初回に `${XDG_CACHE_HOME:-~/.cache}/dev-docs/project-index-{短縮 SHA}` へ GitHub から clone して `uv sync --frozen` する（ネットワークと `uv` が要る。端末で動いている project-index は使用しない）'
    run_one:
      label: ファイル
      command: |-
        ```bash
        uv run pytest {結合テストファイルパス}
        ```
  - id: TL-3
    name: 結合テスト（フロント）
    description: Playwright で実行する。画面は Vite の開発サーバー、部品は Storybook を立て、画面の API（`/_api/`）は `page.route` で差し替えて、画面と部品を Chromium で動かして見る。
    prerequisites:
      - Node 24 と npm
      - '`npm ci` で直下の依存を入れてあり、`npx playwright install chromium` で Chromium を入れてあること'
      - ネットワークが使えること（本文を描く mdmark を jsDelivr から読む）
      - '`127.0.0.1` のポート 5199（画面）と 6199（Storybook）が空いていること'
    run_all: |-
      ```bash
      npm run test:integration
      ```
    run_one:
      label: ファイル
      command: |-
        ```bash
        npx playwright test --config tests/integration/frontend/playwright.config.ts {結合テストファイルパス}
        ```
    parallel: true
    external_cost: 本文を描く mdmark を jsDelivr から読む。料金は発生しない
  - id: TL-4
    name: 外部疎通テスト
    run_all: 未確定
  - id: TL-5
    name: 非機能要件テスト
    run_all: 未確定
  - id: TL-6
    name: E2E テスト
    run_all: 未確定
  - id: TL-7
    name: lint
    description: ruff で linter と formatter の check を、mypy で型検査を、`claude plugin validate` でマーケットプレイスとプラグインの定義の構造を検査する。画面（`frontend/`）は ESLint（任意値の禁止・import の向き・react-hooks・jsx-a11y・複雑さ）と tsc の型検査を流す。型検査はプロジェクト全体に回す。
    prerequisites:
      - 検査の設定は `pyproject.toml` が持つ
      - '`claude` コマンドが使えること'
    run_all: |-
      ```bash
      (rc=0; uv run ruff check . || rc=1; uv run ruff format --check . || rc=1; uv run mypy . || rc=1; claude plugin validate . || rc=1; npm run lint || rc=1; npm run typecheck || rc=1; exit $rc)
      ```
  - id: TL-8
    name: 単体テスト（フロント）
    description: vitest で実行する。jsdom で部品を描き、API は MSW で差し替える。外部サービスに依存しない。
    prerequisites:
      - Node 24 と npm
      - '`npm ci` で直下の依存を入れてある'
    run_all: |-
      ```bash
      npm run test:unit
      ```
    run_one:
      label: ファイル
      command: |-
        ```bash
        npx vitest run --config frontend/vitest.config.ts {単体テストファイルパス}
        ```
    parallel: true
lead: dev-docs のテスト種別ごとの実行コマンド。
prerequisites:
  - Python 3.14 と uv
