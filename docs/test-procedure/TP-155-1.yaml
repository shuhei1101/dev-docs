id: TP-155-1
title: "テスト実行方法"
layers:
  - id: TL-1
    name: 単体テスト（バック）
    description: pytest で実行する。外部サービスに依存しない。
    prerequisites:
      - '`dev-docs` の配布を入れた環境で実行する（`--version` のテストが配布のメタデータを参照する。`uv run` が同期する）'
    run_all: |-
      ```bash
      uv run pytest tests/unit/
      ```
    run_one:
      label: ファイル
      command: |-
        ```bash
        uv run pytest {単体テストファイルパス}
        ```
    parallel: true
    location: runner
    run_runner: |-
      ```bash
      run_url=$(gh workflow run test.yml --ref "$(git branch --show-current)" -f layer=backend-unit | grep -o 'https://[^ ]*/actions/runs/[0-9]*') && run_id=${run_url##*/} && (n=0; until gh api "repos/shuhei1101/dev-docs/actions/runs/$run_id?exclude_pull_requests=true" > /dev/null 2>&1; do n=$((n+1)); if [ $n -ge 10 ]; then echo "実行 $run_id を 10 秒参照できません" >&2; exit 1; fi; sleep 1; done) && (rc=0; gh run watch "$run_id" --exit-status > /dev/null || rc=1; gh run view "$run_id" --log; exit $rc)
      ```
  - id: TL-2
    name: 結合テスト（バック）
    run_all: |-
      ```bash
      uv run pytest tests/integration/
      ```
    description: pytest で実行する。一時フォルダに配信元と端末の設定を作り、dev-docs のアプリを HTTP のテストのクライアントで呼ぶ。文書の取得・画面の検索・リビジョンの一覧・端末の設定の取得と保存は、commit を固定した project-index のクローンを、一時フォルダの端末の設定で子プロセスとして起動して相手にする。起動のテストだけは `dev-docs serve` を子プロセスで起動する。
    prerequisites:
      - '`git` と、`PATH` の `python3`（配信元のスクリプトに使用する）が使用できること'
      - Linux の `/proc/net/tcp` を参照できること（待ち受けのアドレスの確認）
      - '`127.0.0.1` の空きポートが使用できること（起動のテストが子プロセスで待ち受ける）'
      - 文書の取得の結合テスト（`tests/integration/server/test_get_document.py`）は、`npx -y github:shuhei1101/mdmark#{MDMARK_REF}` で取る mdmark の CLI で図を点検する（`MDMARK_REF` はテストのファイルの定数で、既定は `develop`）。Node 24 以上と、GitHub へのネットワークが要る。mdmark の develop の変更で描画が変わっていないかは、作業 PR のこのテストと画面の結合テストで確認する
      - '`tests/integration/server/conftest.py` の `PROJECT_INDEX_COMMIT` の project-index を、初回に `${XDG_CACHE_HOME:-~/.cache}/dev-docs/project-index-{短縮 SHA}` へ GitHub から clone して `uv sync --frozen` する（ネットワークと `uv` が要る。端末で動いている project-index は使用しない）'
    run_one:
      label: ファイル
      command: |-
        ```bash
        uv run pytest {結合テストファイルパス}
        ```
    location: runner
    run_runner: |-
      ```bash
      run_url=$(gh workflow run test.yml --ref "$(git branch --show-current)" -f layer=backend-integration -f paths="{結合テストのパス}" | grep -o 'https://[^ ]*/actions/runs/[0-9]*') && run_id=${run_url##*/} && (n=0; until gh api "repos/shuhei1101/dev-docs/actions/runs/$run_id?exclude_pull_requests=true" > /dev/null 2>&1; do n=$((n+1)); if [ $n -ge 10 ]; then echo "実行 $run_id を 10 秒参照できません" >&2; exit 1; fi; sleep 1; done) && (rc=0; gh run watch "$run_id" --exit-status > /dev/null || rc=1; gh run view "$run_id" --log; exit $rc)
      ```
  - id: TL-3
    name: 結合テスト（フロント）
    description: Playwright で実行する。画面は Vite の開発サーバー、部品は Storybook を立て、画面の API（`/_api/`）は `page.route` で差し替えて、画面と部品を Chromium で動かして確認する。
    prerequisites:
      - Node 24 と npm
      - '`npm ci` で直下の依存を入れてあり、`npx playwright install chromium` で Chromium を入れてあること'
      - ネットワークが使用できること（本文を描く mdmark を jsDelivr から読み込む）
      - '`127.0.0.1` のポート 5199（画面）と 6199（Storybook）が空いていること'
    run_all: |-
      ```bash
      npm run test:integration
      ```
    run_one:
      label: ファイル
      command: |-
        ```bash
        npx playwright test --config tests/integration/frontend/playwright.config.ts {結合テストファイルパス}
        ```
    parallel: true
    external_cost: 本文を描く mdmark を jsDelivr から読み込む。料金は発生しない
    location: runner
    run_runner: |-
      ```bash
      run_url=$(gh workflow run test.yml --ref "$(git branch --show-current)" -f layer=frontend-integration -f paths="{結合テストのパス}" | grep -o 'https://[^ ]*/actions/runs/[0-9]*') && run_id=${run_url##*/} && (n=0; until gh api "repos/shuhei1101/dev-docs/actions/runs/$run_id?exclude_pull_requests=true" > /dev/null 2>&1; do n=$((n+1)); if [ $n -ge 10 ]; then echo "実行 $run_id を 10 秒参照できません" >&2; exit 1; fi; sleep 1; done) && (rc=0; gh run watch "$run_id" --exit-status > /dev/null || rc=1; gh run view "$run_id" --log; exit $rc)
      ```
  - id: TL-4
    name: 外部疎通テスト
    run_all: 未確定
  - id: TL-5
    name: 非機能要件テスト
    run_all: 未確定
  - id: TL-6
    name: E2E テスト
    run_all: |-
      ```bash
      uv run pytest tests/e2e/ -v
      ```
    description: pytest で実行する。GitHub Actions の workflow のインターフェース定義のフローごとに、検証用のブランチを本物のリポジトリへ push し、`gh workflow run` で workflow を起動して、実行の結論と step ごとの結論・成果物を確認する。
    prerequisites:
      - '`gh` が `shuhei1101/dev-docs` へ push と workflow の起動ができる権限で認証してある'
      - 起動する workflow が `develop` にある（`workflow_dispatch` は既定のブランチにある workflow だけを起動できる）
      - 検証用のブランチを push し、テストの後で削除する（副作用）
    run_one:
      label: ファイル
      command: |-
        ```bash
        uv run pytest {E2E テストファイルパス} -v
        ```
    location: local
    external_cost: GitHub Actions のランナーを使用する。public のリポジトリの標準ランナーのため料金は発生しない
  - id: TL-7
    name: lint
    description: ruff で linter と formatter の check を、mypy で型検査を、`claude plugin validate` でマーケットプレイスとプラグインの定義の構造を検査する。画面（`frontend/`）は ESLint（任意値の禁止・import の向き・react-hooks・jsx-a11y・複雑さ）と tsc の型検査を実行する。`.github/workflows/` の workflow のファイルに actionlint を適用し、`uses:` の action のバージョンが GitHub に実在するかを `gh api` で確認する。型検査はプロジェクト全体に回す。
    prerequisites:
      - 検査の設定は `pyproject.toml` が持つ
      - '`claude` コマンドが使用できること'
      - actionlint と、actionlint が `run:` のスクリプトの検査に使用する shellcheck は、`uvx` が PyPI の `actionlint-py`・`shellcheck-py` から追加する
      - '`gh` が認証してある（`uses:` のバージョンの確認で GitHub の API を呼ぶ）'
    run_all: |-
      ```bash
      (rc=0; uv run ruff check . || rc=1; uv run ruff format --check . || rc=1; uv run mypy . || rc=1; claude plugin validate . || rc=1; npm run lint || rc=1; npm run typecheck || rc=1; uvx --from actionlint-py==1.7.12.25 --with shellcheck-py==0.11.0.1 actionlint || rc=1; for u in $(grep -hoE '^[[:space:]-]*uses:[[:space:]]*[^./][^[:space:]#]*@[^[:space:]#]+' .github/workflows/*.y*ml | sed -E 's/.*uses:[[:space:]]*//' | grep -v '^docker://' | sort -u); do gh api "repos/$(echo "${u%@*}" | cut -d/ -f1-2)/commits/${u##*@}" --silent || { echo "uses のバージョンがありません: $u"; rc=1; }; done; exit $rc)
      ```
    location: local
  - id: TL-8
    name: 単体テスト（フロント）
    description: vitest で実行する。jsdom で部品を描き、API は MSW で差し替える。外部サービスに依存しない。
    prerequisites:
      - Node 24 と npm
      - '`npm ci` で直下の依存を入れてある'
    run_all: |-
      ```bash
      npm run test:unit
      ```
    run_one:
      label: ファイル
      command: |-
        ```bash
        npx vitest run --config frontend/vitest.config.ts {単体テストファイルパス}
        ```
    parallel: true
    location: runner
    run_runner: |-
      ```bash
      run_url=$(gh workflow run test.yml --ref "$(git branch --show-current)" -f layer=frontend-unit | grep -o 'https://[^ ]*/actions/runs/[0-9]*') && run_id=${run_url##*/} && (n=0; until gh api "repos/shuhei1101/dev-docs/actions/runs/$run_id?exclude_pull_requests=true" > /dev/null 2>&1; do n=$((n+1)); if [ $n -ge 10 ]; then echo "実行 $run_id を 10 秒参照できません" >&2; exit 1; fi; sleep 1; done) && (rc=0; gh run watch "$run_id" --exit-status > /dev/null || rc=1; gh run view "$run_id" --log; exit $rc)
      ```
lead: dev-docs のテスト種別ごとの実行コマンドと前提を定め、テストや lint を実行するときに参照する。
prerequisites:
  - Python 3.14 と uv
tags:
  - name: topic:テスト
    main: true
  - name: topic:lint
  - name: action:実行
