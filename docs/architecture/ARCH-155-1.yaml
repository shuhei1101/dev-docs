    - id: SRV
      label: 開発ドキュメントサーバー
      kind: system
    - id: PLG
      label: 管理用プラグイン
      kind: system
    - id: REPO
      label: 各リポジトリの文書と設定
      kind: external
    - id: PI
      label: project-index
      kind: external
    - id: GIT
      label: git
      kind: external
    - id: FE
      label: 画面
      kind: system
    - id: CDN
      label: jsDelivr
      kind: external
  edges:
    - from: U
      to: FE
      label: 閲覧
    - from: FE
      to: SRV
      label: HTTP
    - from: SRV
      to: FE
      label: 配信
    - from: CC
