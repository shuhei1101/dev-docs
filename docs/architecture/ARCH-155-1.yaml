repository:
  style: モノレポ
  repositories:
    - name: shuhei1101/dev-docs
  layout: |-
    ```tree
    dev-docs/
    ├── frontend/                # 画面（React の SPA）
    ├── src/dev_docs/            # 開発ドキュメントサーバー
    │   └── migrations/          # 端末の設定の移し替えの手順（settings/{バージョン}/steps.yaml）
    ├── schemas/                 # 端末の設定のスキーマ
    ├── plugins/dev-docs/        # 管理用プラグイン
    ├── scripts/                 # 反映作業のスクリプトが呼ぶ共通のスクリプト
    ├── .claude-plugin/marketplace.json
    ├── docs/                    # 文書（種類ごとのフォルダ・guide/・pr/・mock/）
    └── tests/
    ```
subsystems:
  - name: 開発ドキュメントサーバー
    scope: server
    role: project-index が配信している配信元の文書を project-index の読み取り API で取得して Markdown に変換し、画面のビルドと画面の API で出す。管理の MCP で自分の状態・再起動・更新を受ける
    runtime: Python 3.14
    runs_on: 利用者の端末（`127.0.0.1`）
    implementation: src/dev_docs/__main__.py
    status: implemented
  - name: 管理用プラグイン
    scope: plugin
    role: SessionStart のフックで落ちている画面のサーバーを起動し、管理の MCP の接続先を Claude Code に渡す
    runtime: Claude Code のプラグイン（フックは Python 3.14）
    runs_on: 利用者の端末の Claude Code（ユーザースコープ）
    implementation: plugins/dev-docs/.claude-plugin/plugin.json
    status: planned
  - name: 画面
    scope: frontend
    role: 文書の画面・設定画面・見つからない画面を 1 つの SPA で描き、画面の API を呼ぶ。ビルドは開発ドキュメントサーバーが配る
    runtime: TypeScript 7（ブラウザ）
    runs_on: 利用者のブラウザ
    implementation: frontend/
    status: planned
    introduced:
      pr: 36
lead: dev-docs のサブシステムと、境界を越えて通信する外部システム。
external_systems:
  - name: Claude Code
    purpose: 管理の MCP（`/_admin/mcp`）の要求を受ける
    direction: 受信のみ
    protocol: MCP（Streamable HTTP）
    status: planned
    notes:
      事前確認: '要否: 不要（受ける側で、こちらから到達を確かめる相手ではない）'
  - name: git
    purpose: '`update` のクローンの更新（`git pull --ff-only`）'
    direction: 双方向
    protocol: CLI（子プロセス）
    status: planned
    notes:
      事前確認: '要否: 要。時点: `update` の前に `git` が実行できるかを確かめ、無ければ git のエラーを返す'
  - name: project-index
    purpose: 配信元の一覧と状態・文書の一覧と値・`converters[]` の変換の結果・検索・リビジョンの一覧を読み取り API で取得し、端末の設定の配信元の行を端末の設定の API で保存する
    direction: 双方向
    protocol: HTTP（REST）
    detail: API-155-1#
    status: planned
    notes:
      事前確認: '要否: 要。時点: 起動時と要求ごとに問い合わせ、つながらなければ 503 と理由を返す（待ち受けは止めない）'
  - name: jsDelivr
    purpose: 画面が mdmark（`dist/index.js`・`dist/index.css`）を実行時に読み込む
    direction: 受信のみ
    protocol: HTTPS（ES モジュールの `import`）
    detail: LIB-155-9#
    status: planned
    refs:
      - MOD-155-25#constants[MDMARK_URL]
