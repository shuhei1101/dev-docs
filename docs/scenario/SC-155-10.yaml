id: SC-155-10
title: "起動する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実環境で実行。`dev-docs serve` を子プロセスで起動する）
      - name: project-index
        description: テスト用の一時フォルダで起動した project-index。sample と notes を配信している
        notes: 待ち受けのアドレスを dev-docs の端末の設定の `project_index` に書く
      - name: サンプルの配信元
        description: 文書の種類を 1 つ（スキーマと YAML 2 件）と `project-index.yaml` を持つ git リポジトリ
        notes: id `sample`
      - name: 読み取りだけの配信元
        description: 文書の種類を 1 つと `project-index.yaml` を持つ Git 管理外のフォルダ
        notes: id `notes`
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す `settings.yaml`'
        notes: '`project_index` に project-index の待ち受けのアドレス。`sources` を持たない'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant DD as dev-docs
        participant CF as 端末の設定
        participant PI as project-index

        U->>DD: dev-docs serve
        DD->>CF: 端末の設定を読み、スキーマで検証する
        DD->>PI: 配信元の一覧と状態を問い合わせる
        DD->>DD: 127.0.0.1:8781 で待ち受ける
        DD-->>U: 待ち受けたアドレスと、project-index が配信している配信元を標準出力に出す
      ```
    expected:
      - '`127.0.0.1:8781` で待ち受け、`0.0.0.0` では待ち受けない'
      - '`/_api/sources/sample/docs` と `/_api/sources/notes/docs` が 200 を返す'
      - '`/_api/`・`/_admin/` 以外のパスが画面の `index.html` を返す'
      - '`/mcp` は 404 を返す（文書の MCP は project-index が持つ）'
      - '`/_admin/mcp` のツールが `status`・`restart`・`update` の 3 つ'
      - 標準出力に待ち受けたアドレスと、project-index が配信している配信元の id（sample・notes）が出る
    test: test_normal
  - name: 異常シナリオ（project-index につながらない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す `settings.yaml`'
        notes: '`project_index` が、何も待ち受けていないアドレスを指す'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant DD as dev-docs
        participant PI as project-index

        U->>DD: dev-docs serve
        DD->>PI: 配信元の一覧と状態を問い合わせる（つながらない）
        DD->>DD: 127.0.0.1:8781 で待ち受ける
        DD-->>U: project-index につながらないことを標準エラーに出す
      ```
    expected:
      - プロセスは終わらず、`127.0.0.1:8781` で待ち受ける
      - 標準エラーに、つながらなかった project-index のアドレスと、project-index を起動する案内が出る
      - '`/_api/sources/sample/docs` が 503 と、project-index につながらない理由を返す'
      - 画面を開くと、project-index につながらない理由が出る
      - project-index を起動した後、dev-docs を再起動せずに `/_api/sources/sample/docs` が 200 を返す
    test: test_error_when_project_index_unreachable
  - name: 異常シナリオ（端末の設定がスキーマに違反する）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す `settings.yaml`'
        notes: '`project_index` が URL でなく、`port` が整数でない'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant DD as dev-docs

        U->>DD: dev-docs serve
        DD->>DD: 端末の設定の検証に失敗する
        DD-->>U: 違反を標準エラーに出して終わる
      ```
    expected:
      - プロセスが 0 以外の終了コードで終わり、ポートを待ち受けない
      - '標準エラーに `{ファイル}: project_index: URL でない` の形で違反が全て並ぶ'
    test: test_error_when_terminal_config_invalid
  - name: 異常シナリオ（ポートが使用中）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 使用中のポート
        description: テストが先に待ち受けたポート
        notes: '`DEV_DOCS_PORT` にそのポートを入れる'
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す `settings.yaml`'
        notes: '`project_index` に検証に通るアドレス'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant DD as dev-docs

        U->>DD: dev-docs serve
        DD->>DD: ポートで待ち受けられない
        DD-->>U: ポートと DEV_DOCS_PORT を標準エラーに出して終わる
      ```
    expected:
      - プロセスが 0 以外の終了コードで終わる
      - 標準エラーに使用中のポートの番号と、`DEV_DOCS_PORT` で変えられることが出る
    test: test_error_when_port_in_use
  - name: 正常シナリオ（SessionStart で起動する）
    setup:
      - name: Mock
        description: なし（実環境で実行。Claude Code は `claude -p` で動かす）
      - name: Claude Code の設定の場所
        description: '`CLAUDE_CONFIG_DIR` が指すテスト用の一時フォルダ。プラグイン `dev-docs` をユーザースコープに入れ、env の `DEV_DOCS_CONFIG` が端末の設定を指す'
      - name: 端末の設定
        description: '`clone` がテスト用のクローン、`project_index` が sample と notes を配信している project-index のアドレス'
        notes: dev-docs は待ち受けていない。ポート 8781 が空き
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code
        participant HK as SessionStart のフック
        participant DD as dev-docs

        U->>CC: sample のワークツリーでセッションを始める
        CC->>HK: SessionStart
        HK->>DD: ポートにつながるか確かめる（つながらない）
        HK->>DD: 端末の設定の clone で dev-docs serve を切り離して起動する
        HK-->>CC: 待たずに戻り、/mcp の再接続の案内を文脈に追加する
        U->>CC: /mcp でつなぎ直す
        CC->>DD: /_admin/mcp のツールの一覧を取る
      ```
    expected:
      - フックが 0 の終了コードで戻り、セッションの文脈に `/mcp` の再接続の案内が入る
      - '`127.0.0.1:8781` を待ち受ける dev-docs のプロセスが 1 つだけあり、セッションを終えても残る'
      - つなぎ直した後、管理の MCP（`/_admin/mcp`）のツールが 3 つ返る
    test: test_normal_when_started_by_session_start
  - name: 正常シナリオ（SessionStart で XDG_CONFIG_HOME の下の端末の設定から起動する）
    setup:
      - name: Mock
        description: なし（実環境で実行。Claude Code は `claude -p` で動かす）
      - name: Claude Code の設定の場所
        description: '`CLAUDE_CONFIG_DIR` が指すテスト用の一時フォルダ。プラグイン `dev-docs` をユーザースコープに入れ、env に `DEV_DOCS_CONFIG` が無い'
        notes: '`claude -p` を動かす環境の `XDG_CONFIG_HOME` にテスト用の一時フォルダを入れる'
      - name: 端末の設定
        description: '`$XDG_CONFIG_HOME/dev-docs/settings.yaml`。`clone` がテスト用のクローン、`project_index` が sample を配信している project-index のアドレス'
        notes: dev-docs は待ち受けていない。ポート 8781 が空き
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code
        participant HK as SessionStart のフック
        participant DD as dev-docs

        U->>CC: sample のワークツリーでセッションを始める
        CC->>HK: SessionStart
        HK->>DD: ポートにつながるか確かめる（つながらない）
        HK->>HK: $XDG_CONFIG_HOME/dev-docs/settings.yaml の clone を読む
        HK->>DD: clone で dev-docs serve を切り離して起動する
        HK-->>CC: 待たずに戻り、/mcp の再接続の案内を文脈に追加する
        U->>CC: /mcp でつなぎ直す
        CC->>DD: /_admin/mcp のツールの一覧を取る
      ```
    expected:
      - フックが 0 の終了コードで戻り、セッションの文脈に `/mcp` の再接続の案内が入る
      - '`127.0.0.1:8781` を待ち受ける dev-docs のプロセスが 1 つだけあり、端末の設定の `clone` のクローンから起動している'
      - つなぎ直した後、管理の MCP（`/_admin/mcp`）のツールが 3 つ返る
    test: test_normal_when_started_by_session_start_with_xdg_config_home
  - name: 正常シナリオ（待ち受けているサーバーがあるときは文脈を注入しない）
    setup:
      - name: Mock
        description: なし（実環境で実行。Claude Code は `claude -p` で動かす）
      - name: dev-docs
        description: SessionStart で起動する正常シナリオと同じ端末の設定で待ち受けている dev-docs
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code
        participant HK as SessionStart のフック
        participant DD as dev-docs

        U->>CC: sample のワークツリーでセッションを始める
        CC->>HK: SessionStart
        HK->>DD: ポートにつながる
        HK-->>CC: 文脈を追加せずに戻る
        CC->>DD: /_admin/mcp につながる
      ```
    expected:
      - フックが 0 の終了コードで戻り、セッションの文脈に `/mcp` の再接続の案内が入らない
      - dev-docs のプロセスは増えない
    test: test_normal_when_listening_server_not_injected
  - name: 異常シナリオ（SessionStart で起動できない）
    setup:
      - name: Mock
        description: なし（実環境で実行。Claude Code は `claude -p` で動かす）
      - name: Claude Code の設定の場所
        description: env の `DEV_DOCS_CONFIG` が無いファイルを指す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code
        participant HK as SessionStart のフック

        U->>CC: セッションを始める
        CC->>HK: SessionStart
        HK->>HK: ポートにつながらず、端末の設定を読めない
        HK-->>CC: 0 の終了コードで戻り、理由と /dev-docs:global-setup の案内を文脈に追加する
      ```
    expected:
      - フックが 0 の終了コードで戻り、セッションは続く
      - セッションの文脈に、端末の設定を読めなかった理由と `/dev-docs:global-setup` の案内が入る
      - dev-docs のプロセスは起動しない
    test: test_error_when_session_start_cannot_start
  - name: 正常シナリオ（XDG の環境変数で置き場を決める）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 環境変数
        description: '`DEV_DOCS_CONFIG` を設定せず、`XDG_CONFIG_HOME`・`XDG_STATE_HOME` にテスト用の一時フォルダを入れる'
      - name: 端末の設定
        description: '`$XDG_CONFIG_HOME/dev-docs/settings.yaml`'
        notes: '`project_index` が sample を配信している project-index のアドレス。`state_dir`・`log_dir` を持たない'
      - name: 状態の置き場の上書き
        description: 2 回目の起動だけ `DEV_DOCS_STATE_DIR` に別の一時フォルダを入れる
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant DD as dev-docs
        participant FS as ディスク

        U->>DD: dev-docs serve
        DD->>FS: $XDG_CONFIG_HOME/dev-docs/settings.yaml を読む
        DD->>FS: 状態とログを $XDG_STATE_HOME/dev-docs に書く
        DD-->>U: sample を配信する
        U->>DD: DEV_DOCS_STATE_DIR を入れて dev-docs serve
        DD->>FS: 状態とログを DEV_DOCS_STATE_DIR に書く
        DD-->>U: sample を配信する
      ```
    expected:
      - 1 回目の起動で `/_api/sources/sample/docs` が 200 を返す
      - 1 回目の起動のログが `$XDG_STATE_HOME/dev-docs/logs` にでき、`~/.local/state/dev-docs` には書かない
      - 2 回目の起動のログが `$DEV_DOCS_STATE_DIR/logs` にでき、`$XDG_STATE_HOME/dev-docs` には書かない
    test: test_normal_when_xdg_dirs_set
lead: 利用者が `dev-docs serve` を実行し、project-index が配信している配信元の文書を画面で配信し始める。
issue: 3
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 1 つのコマンドで project-index が配信している配信元を画面で読め、project-index につながらないときはその理由が分かる
trigger: '利用者が `dev-docs serve` を実行するか、ポートにつながらないときに SessionStart のフックが切り離して起動する'
preconditions:
  - '`DEV_DOCS_CONFIG`（既定 `${XDG_CONFIG_HOME:-~/.config}/dev-docs/settings.yaml`）に端末の設定がある'
  - '`DEV_DOCS_PORT`（既定 8781）のポートが空いている'
  - 端末の設定の `project_index` が指す project-index が、配信元を配信している
success_guarantee: project-index が配信している配信元が `/_api/sources/{配信元の id}/docs` の画面の API と画面で読める。
minimal_guarantee: project-index につながらないときも、画面と `/_admin/mcp` は待ち受けを続け、つながらない理由を返す。dev-docs は配信元のフォルダと文書を書き換えない。
frequency: 端末の起動ごと・dev-docs の更新ごと
priority: 高
refs:
  - SC-155-13#scenarios[正常シナリオ]
  - SC-155-13#scenarios[異常シナリオ（配信できない配信元がある）]
test_file: tests/e2e/単一ユースケース/test_起動する.py
