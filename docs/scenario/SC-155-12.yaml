id: SC-155-12
title: "配信元を追加する"
scenarios:
  - name: 正常シナリオ（設定画面で追加する）
    setup:
      - name: Mock
        description: なし（実環境で実行。ブラウザで画面を開く）
      - name: サンプルの配信元
        description: 文書の種類を 1 つと `project-index.yaml` を持つ git リポジトリ
        notes: id `sample`
      - name: 追加する配信元
        description: 文書の種類を 1 つと `project-index.yaml` を持つ git リポジトリ。端末の設定にはまだ無い
        notes: id `extra`
      - name: 端末の設定
        description: 'project-index の `PROJECT_INDEX_CONFIG` が指す一時フォルダの `settings.yaml`'
        notes: '`sources` に sample の 1 行'
      - name: dev-docs
        description: その project-index につないで起動した dev-docs
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant API as 画面の API
        participant PI as project-index

        U->>UI: 設定画面の URL（`/_settings`）を開く
        UI-->>U: settings（配信元の一覧と状態）
        U->>UI: 配信元を追加し、extra の id・config・scope.read を入れて保存する
        UI->>API: 端末の設定の保存（sample と extra の sources）
        API->>PI: 端末の設定の配信元の保存
        PI->>PI: スキーマで検証する
        PI->>PI: settings.yaml を書き換え、配信元を読み直す
        PI-->>API: 保存した sources と配信元ごとの状態
        API-->>UI: 保存した sources と配信元ごとの状態
        UI-->>U: settings（extra を加えた一覧）
      ```
    expected:
      - 一覧に sample と extra が配信中で並ぶ
      - '`settings.yaml` の `sources` に extra の行が追加され、sample の行は変わらない'
      - '`settings.yaml` の extra の行の `config` が、要素 1 つの配列で書かれる'
      - dev-docs と project-index を再起動せずに、extra の文書の画面が開ける
    test: test_normal_when_added_from_settings
  - name: 正常シナリオ（設定画面に配信していない配信元がある）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 検証に失敗する配信元
        description: '`project-index.yaml` の `documents[0]` に必須のキー `paths` が無い配信元'
        notes: id `broken`
      - name: 設定のバージョンが古い配信元
        description: '`project-index.yaml` の `version` が、サーバーが読めるバージョンより古い配信元'
        notes: id `legacy`
      - name: 無効の配信元
        description: '端末の設定で `enabled: false` の配信元'
        notes: id `archive`
      - name: dev-docs
        description: sample・broken・legacy・archive を端末の設定に並べた project-index につないで起動した dev-docs
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant API as 画面の API

        U->>UI: 設定画面を開く
        UI->>API: 端末の設定の取得
        UI-->>U: settings（配信元ごとの状態）
      ```
    expected:
      - sample と legacy が配信中で並ぶ
      - broken が配信していない状態で、project-index が起動時の検証で外した理由（`documents[0]` に必須のキー `paths` が無い）が出る
      - legacy に、設定のバージョンと project-index が読めるバージョンが出る
      - archive が無効で、`enabled` が `false` であることが出る
    test: test_normal_when_source_not_served
  - name: 正常シナリオ（設定画面で追加した配信元が検証に通らない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 検証に失敗する配信元
        description: '`project-index.yaml` の `documents[0]` に必須のキー `paths` が無い配信元。端末の設定にはまだ無い'
        notes: id `broken`
      - name: 端末の設定
        description: 'project-index の `PROJECT_INDEX_CONFIG` が指す一時フォルダの `settings.yaml`'
        notes: '`sources` に sample の 1 行'
      - name: dev-docs
        description: その project-index につないで起動した dev-docs
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant API as 画面の API
        participant PI as project-index

        U->>UI: 配信元を追加し、broken の id・config・scope.read を入れて保存する
        UI->>API: 端末の設定の保存
        API->>PI: 端末の設定の配信元の保存
        PI->>PI: settings.yaml を書き換え、配信元を読み直し、起動時と同じ検証で broken を配信から外す
        PI-->>API: 保存した sources と配信元ごとの状態
        UI-->>U: settings（broken を配信していない一覧）
      ```
    expected:
      - '`settings.yaml` の `sources` に broken の行が追加される'
      - 一覧の broken が配信していない状態で、検証で外した理由（`documents[0]` に必須のキー `paths` が無い）が出る
      - broken の文書の画面を開くと見つからない画面になり、sample の文書の画面は開ける
    test: test_normal_when_added_source_invalid
  - name: 異常シナリオ（設定画面の保存がスキーマに通らない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 端末の設定
        description: 'project-index の `PROJECT_INDEX_CONFIG` が指す一時フォルダの `settings.yaml`'
        notes: '`sources` に sample の 1 行'
      - name: dev-docs
        description: その project-index につないで起動した dev-docs
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant API as 画面の API

        U->>UI: 配信元を追加し、id を Sample Docs、scope.read に空の行を含めて保存する
        UI->>UI: 入力チェック（保存の送信をしない）
        UI-->>U: 保存の失敗のまとめと、項目ごとのエラー
      ```
    expected:
      - 保存できなかったことと、画面設計『設定画面』の入力チェックの id と scope.read の文言が出る
      - 入れた値が入力欄に残る
      - '`settings.yaml` が変わらず、sample の文書の画面は開ける'
    test: test_error_when_schema_invalid
    notes:
      422 の受け方: 画面の入力チェックが先に止めるため、サーバーの 422 を画面に出す経路は結合テスト `settings-screen.spec.ts` が確かめる
  - name: 異常シナリオ（別のオリジンから書き込む）
    setup:
      - name: Mock
        description: なし（実環境で実行）
        notes: '-'
      - name: 端末の設定
        description: 'project-index の `PROJECT_INDEX_CONFIG` が指す一時フォルダの `settings.yaml`'
        notes: '`sources` に sample の 1 行'
      - name: 別のオリジンの送信
        description: '`Origin` を dev-docs と別のポートにした HTTP の端末の設定の保存'
        notes: 送信する内容はスキーマに通る端末の設定。ブラウザは別のオリジンの 403 の応答を読めないため HTTP で送る
      - name: dev-docs
        description: その project-index につないで起動した dev-docs
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant OP as 別のオリジンの送信
        participant DD as dev-docs

        OP->>DD: 端末の設定の保存を送信する
        DD-->>OP: 403 で断る
      ```
    expected:
      - 応答が 403
      - '`settings.yaml` が変わらず、sample の文書の画面は開ける'
    test: test_error_when_cross_origin
lead: 利用者が dev-docs の設定画面で配信元を追加し、project-index の端末の設定に並べて画面で読めるようにする。
issue: 4
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 設定画面で配信元を追加し、配信できなかった配信元とその理由を一覧で確かめられる
  - name: project-index
    interest: 設定画面の保存を、端末の設定の配信元の API で受け、ほかのキーと行を壊さずに読み直せる
trigger: 利用者が設定画面で配信元を追加する
preconditions:
  - dev-docs が起動し、project-index につながっている
  - 追加するフォルダが YAML の文書とそのスキーマと `project-index.yaml` を持つ（git リポジトリか Git 管理外のフォルダ）
success_guarantee: project-index の端末の設定の `sources` に配信元の行があり、dev-docs と project-index を再起動せずにその配信元の文書を画面で読める。
minimal_guarantee: 設定画面の保存がスキーマに通らないとき、画面と別のオリジンから書き込んだときは、端末の設定を書き換えない。既にある配信元の配信は止まらない。
frequency: 配信元ごとに 1 回
priority: 高
refs:
  - SC-155-13#scenarios[正常シナリオ]
test_file: tests/e2e/単一ユースケース/test_配信元を追加する.py
