id: SC-155-13
title: "dev-docsで配信元の文書を画面で読む"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実環境で実行。ブラウザで画面を開き、Claude Code は `claude -p` で動かす）
      - name: Claude Code の設定の場所
        description: '`CLAUDE_CONFIG_DIR` が指すテスト用の一時フォルダ。dev-docs のマーケットプレイスとプラグイン `dev-docs` を、この場所のユーザースコープに入れておく'
        notes: テストを流した端末の `~/.claude` は変わらない
      - name: project-index
        description: テスト用の一時フォルダにクローンして起動した project-index。端末の設定の `sources` に sample と notes の行がある
        notes: project-index の入れ方と配信元の追加は project-index のシナリオが担う。ここでは起動して配信元を配信している状態から始める
      - name: dev-docs のクローン
        description: テスト用の一時フォルダにクローンした dev-docs
        notes: ポート 8781 が空き。S0 の `/dev-docs:global-setup` にこのパスを渡す
      - name: サンプルの配信元
        description: 文書の種類を 1 つ（スキーマと YAML 2 件）と `project-index.yaml` を持つ git リポジトリと、そのワークツリー（`.claude/worktrees/x`）
        notes: id `sample`
      - name: 読み取りだけの配信元
        description: 文書の種類を 1 つと `project-index.yaml` を持つ Git 管理外のフォルダ
        notes: id `notes`
      - name: 追加する配信元
        description: 文書の種類を 1 つと `project-index.yaml` を持つ git リポジトリ。端末の設定にはまだ無い
        notes: id `extra`
    flow: |-
      ```mermaid
      flowchart TD
        subgraph P1["導入"]
          S0["dev-docsを入れる:正常シナリオ"]
        end
        subgraph P2["起動"]
          S1["起動する:正常シナリオ"]
        end
        subgraph P3["読む"]
          S2["利用者が画面で読む:正常シナリオ"]
          S3["利用者が画面で読む:正常シナリオ（差分を見る）"]
          S4["利用者が画面で読む:正常シナリオ（検索する）"]
          S5["利用者がコメントを渡す:正常シナリオ"]
        end
        subgraph P4["配信元の管理"]
          S6["配信元を追加する:正常シナリオ（設定画面で追加する）"]
          S7["配信元を外す:正常シナリオ"]
        end
        subgraph P5["保守"]
          S8["dev-docsを更新する:正常シナリオ"]
        end
        S0 --> S1 --> S2 --> S3 --> S4 --> S5 --> S6 --> S7 --> S8
        click S0 "id:SC-155-2#scenarios[正常シナリオ]"
        click S1 "id:SC-155-10#scenarios[正常シナリオ]"
        click S2 "id:SC-155-7#scenarios[正常シナリオ]"
        click S3 "id:SC-155-7#scenarios[正常シナリオ（差分を見る）]"
        click S4 "id:SC-155-7#scenarios[正常シナリオ（検索する）]"
        click S5 "id:SC-155-6#scenarios[正常シナリオ]"
        click S6 "id:SC-155-12#scenarios[正常シナリオ（設定画面で追加する）]"
        click S7 "id:SC-155-11#scenarios[正常シナリオ]"
        click S8 "id:SC-155-3#scenarios[正常シナリオ]"
      ```
    expected:
      - '`127.0.0.1:8781` を待ち受ける dev-docs のプロセスが 1 つだけあり、文書の MCP（`/mcp`）を持たない'
      - 画面の配信元の一覧に、project-index が配信中の sample と notes が並ぶ
      - '`/_api/sources/sample/docs` が `tabs` と、project-index が変換した `markdown` を返す'
      - sample の 2 つの commit を比べた差分の画面に、変わった項目が強調される
      - トップバーの検索が、sample の語を含む文書と一致した箇所を返す
      - 溜めたコメントのコピーの本文に、選んだ文書と箇所が入る
      - 設定画面で追加した extra が、dev-docs と project-index を再起動せずに、画面の配信元の一覧と project-index の配信元の両方に並ぶ
      - 設定画面で extra を削除すると、画面の一覧と project-index の配信元の両方から extra が消え、extra のフォルダのファイルは変わらない
      - '`update` の後、dev-docs が新しいバージョンで起動し、sample と notes を画面で読める'
      - project-index のプロセスと端末の設定の `sources` は、dev-docs の起動・更新で変わらない
    test: test_normal
    uses:
      - SC-155-2#scenarios[正常シナリオ]
      - SC-155-10#scenarios[正常シナリオ]
      - SC-155-7#scenarios[正常シナリオ]
      - SC-155-7#scenarios[正常シナリオ（差分を見る）]
      - SC-155-7#scenarios[正常シナリオ（検索する）]
      - SC-155-6#scenarios[正常シナリオ]
      - SC-155-12#scenarios[正常シナリオ（設定画面で追加する）]
      - SC-155-11#scenarios[正常シナリオ]
      - SC-155-3#scenarios[正常シナリオ]
  - name: 異常シナリオ（配信できない配信元がある）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: project-index
        description: テスト用の一時フォルダにクローンして起動した project-index。端末の設定の `sources` に sample と broken の 2 行がある
        notes: broken は `project-index.yaml` がスキーマに違反し、project-index が配信していない
      - name: dev-docs のクローン
        description: テスト用の一時フォルダにクローンした dev-docs
        notes: ポート 8781 が空き
      - name: サンプルの配信元
        description: 正常シナリオと同じ、検証に通る配信元
        notes: id `sample`
      - name: 壊れた配信元
        description: '`project-index.yaml` がスキーマに違反する配信元'
        notes: id `broken`。`documents[]` の必須のキーが無い
    flow: |-
      ```mermaid
      flowchart TD
        subgraph P1["起動"]
          S1["起動する:正常シナリオ"]
        end
        subgraph P2["読む"]
          S2["利用者が画面で読む:異常シナリオ（配信していない配信元を開く）"]
          S3["利用者が画面で読む:正常シナリオ"]
        end
        S1 --> S2 --> S3
        click S1 "id:SC-155-10#scenarios[正常シナリオ]"
        click S2 "id:SC-155-7#scenarios[異常シナリオ（配信していない配信元を開く）]"
        click S3 "id:SC-155-7#scenarios[正常シナリオ]"
      ```
    expected:
      - 起動の直後、`/_api/sources/broken/docs` が 404 を返し、`/_api/sources/sample/docs` は応答する
      - broken の文書の画面は見つからない画面になり、配信していない理由（違反したキーのパスと理由）が出る
      - 設定画面の一覧で、broken が配信していない配信元として出る
      - broken の `project-index.yaml` を修正して project-index が読み直した後、dev-docs を再起動せずに broken の文書の画面が開ける
    test: test_error_when_source_config_invalid
    uses:
      - SC-155-10#scenarios[正常シナリオ]
      - SC-155-7#scenarios[異常シナリオ（配信していない配信元を開く）]
      - SC-155-7#scenarios[正常シナリオ]
lead: 利用者が project-index で配信している配信元の文書を、dev-docs の画面で読み、差分を見て、コメントを渡す。配信元の追加・削除と dev-docs の更新を経ても画面で読める。
issue: 2
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: project-index が配信している配信元の文書を画面で読み、エージェントの変更を差分でレビューできる。配信元の追加と削除を画面でできる
  - name: project-index
    interest: dev-docs の画面のサーバーが読み取り API と端末の設定の API だけを使用し、索引・検索・書き込みを持たない
  - name: 各配信元
    interest: サーバーのコードもプラグインも持たず、`project-index.yaml`・スキーマ・検査と変換のスクリプトだけで配信される
trigger: 利用者が dev-docs のプラグインを入れ、`/dev-docs:global-setup` を実行する
preconditions:
  - 端末に uv・git・Claude Code がある
  - project-index を入れて起動し、配信する配信元を project-index の端末の設定に並べてある
  - dev-docs のマーケットプレイスを追加し、プラグイン `dev-docs` をユーザースコープで入れてある
success_guarantee: project-index が配信している配信元の文書が、`/_api/sources/{配信元の id}/docs` の画面の API と画面で読める。設定画面での配信元の追加・削除は、project-index の配信元にも反映される。
minimal_guarantee: project-index が配信していない配信元があっても、他の配信元の画面と設定画面は止まらない。dev-docs は配信元のフォルダと文書を書き換えない。
frequency: 導入は端末ごとに 1 回。起動はセッションごと。読むのは作業のたび
priority: 高
notes:
  E2E テスト: 'テストのファイルは、dev-docs の画面のサーバーを本物の project-index へつなぐ #164 でそろってから作り、その時点で `test_file` を付ける。'
test_file: tests/e2e/複合ユースケース/test_dev-docsで配信元の文書を画面で読む.py
