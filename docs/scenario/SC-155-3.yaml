id: SC-155-3
title: "dev-docsを更新する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: dev-docs のクローン
        description: テスト用の bare リポジトリを上流にしたクローン
        notes: 上流に 1 つ新しいバージョンの commit がある。端末の設定の移し替えの手順は無い
      - name: 端末の設定
        description: '`project_index` が sample と notes を配信している project-index のアドレス'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant AD as 管理の MCP
        participant DD as dev-docs

        U->>AD: update
        AD->>DD: クローンで git pull
        AD->>DD: 依存を入れ直す（uv sync）
        AD-->>U: 新しいバージョン
        AD->>DD: 再起動する
        U->>AD: status
        AD-->>U: 新しいバージョンと、project-index が配信している配信元
      ```
    expected:
      - '`update` が新しいバージョンを返す'
      - 再起動の後の `status` が新しいバージョンを返し、`sample` と `notes` の文書を画面で読める
      - '`127.0.0.1:8781` を待ち受ける dev-docs のプロセスが 1 つだけある'
    test: test_normal
  - name: 正常シナリオ（端末の設定が古くなる）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: dev-docs のクローン
        description: 正常シナリオと同じ
        notes: 新しいバージョンが端末の設定のキーを 1 つ改名する移し替えの手順を持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant AD as 管理の MCP
        participant MG as dev-docs migrate
        participant CF as 端末の設定

        U->>AD: update
        AD-->>U: 新しいバージョンと、移し替えが要ること（再起動しない）
        U->>MG: dev-docs migrate --plan
        MG-->>U: 当てる手順の一覧
        U->>MG: dev-docs migrate
        MG->>CF: バックアップを取り、手順を古い順に当て、version を書き換える
        MG-->>U: 当てた手順
        U->>AD: restart
      ```
    expected:
      - '`update` が移し替えが要ることを返し、dev-docs は再起動しない'
      - '`migrate --plan` は端末の設定を変えず、当てる手順を返す'
      - '`migrate` の後、端末の設定の `version` が新しいバージョンになり、改名したキーが新しい名前で元の値を持つ'
      - 当てる前の端末の設定のバックアップがある
      - '`restart` の後、`status` が新しいバージョンを返し、`sample` と `notes` の文書を画面で読める'
    test: test_normal_when_terminal_config_old
  - name: 正常シナリオ（端末の設定の sources を project-index へ移す）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: dev-docs のクローン
        description: 正常シナリオと同じ
        notes: 新しいバージョンが、文書の MCP と配信元の読み込みを project-index へ移したバージョン
      - name: 端末の設定
        description: '`sources` に sample と notes の 2 行を持ち、`project_index` を持たない前のバージョンの `settings.yaml`'
      - name: project-index
        description: テスト用の一時フォルダで、空きポートで起動した project-index。端末の設定の `sources` に extra の 1 行がある
        notes: '`migrate` の引数 `--project-index` にそのアドレスを渡す'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant AD as 管理の MCP
        participant MG as dev-docs migrate
        participant CF as 端末の設定
        participant PI as project-index

        U->>AD: update
        AD-->>U: 新しいバージョンと、移し替えが要ること（再起動しない）
        U->>MG: dev-docs migrate --plan
        MG-->>U: 当てる手順の一覧（sources を project-index へ写して除く・project_index を書き足す）
        U->>MG: dev-docs migrate --project-index {アドレス}
        MG->>CF: バックアップを取る
        MG->>PI: 端末の設定の sources の保存（既にある行は変えず、sample と notes を加える）
        MG->>CF: sources を除き、project_index と version を書き換える
        MG-->>U: 当てた手順
        U->>AD: restart
      ```
    expected:
      - project-index の端末の設定の `sources` に、extra の行が変わらずに残り、sample と notes の行が前の値のまま加わる
      - dev-docs の端末の設定が `sources` を持たず、`project_index` に `--project-index` で渡したアドレス、`version` に新しいバージョンを持つ
      - 当てる前の dev-docs の端末の設定のバックアップがある
      - '`restart` の後、`sample` と `notes` の文書を画面で読める'
    test: test_normal_when_sources_moved_to_project_index
    notes:
      project-index のアドレス: '`--project-index` を省くと、`PROJECT_INDEX_PORT`（無ければ既定の 8786）から `http://127.0.0.1:{ポート}` を組む'
      既にある行: project-index の端末の設定の行は変えず、移す行を加えて 1 回で保存する。同じ id で内容が違う行があれば、その行は移さずに id と、dev-docs の端末の設定に残したことを応答に出す（dev-docs の `sources` からも除かない）。同じ id で内容も同じ行は移した行として扱う
      書き込みの応答の時間: 行の追加の応答が文書の取得の制限時間（45 秒）を超えても、移し替えを続ける
  - name: 異常シナリオ（sources を移すときに project-index につながらない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 端末の設定
        description: 正常シナリオ（端末の設定の sources を project-index へ移す）と同じ前のバージョンの `settings.yaml`
      - name: project-index
        description: 起動していない
        notes: '`--project-index` に、何も待ち受けていない空きポートのアドレスを渡す'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant MG as dev-docs migrate
        participant CF as 端末の設定
        participant PI as project-index

        U->>MG: dev-docs migrate --project-index {アドレス}
        MG->>CF: バックアップを取る
        MG->>PI: 端末の設定の配信元の行の追加（つながらない）
        MG->>CF: バックアップから戻す
        MG-->>U: project-index につながらないことと、project-index を起動してからやり直す案内
      ```
    expected:
      - dev-docs の端末の設定が `migrate` の前と同じ中身になる
      - 0 以外の終了コードで終わり、標準エラーにつながらなかった project-index のアドレスと、起動してからやり直す案内が出る
    test: test_error_when_project_index_unreachable_on_migrate
  - name: 異常シナリオ（移し替えの手順が失敗する）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: dev-docs のクローン
        description: 移し替えの手順を 2 つ持つ新しいバージョン
        notes: 2 つ目の手順が例外を出す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant MG as dev-docs migrate
        participant CF as 端末の設定

        U->>MG: dev-docs migrate
        MG->>CF: バックアップを取り、1 つ目の手順を当てる
        MG->>MG: 2 つ目の手順が失敗する
        MG->>CF: バックアップから戻す
        MG-->>U: 失敗した手順と理由
      ```
    expected:
      - 端末の設定が `migrate` の前と同じ中身になる
      - 0 以外の終了コードで終わり、標準エラーに失敗した手順の名前と理由が出る
    test: test_error_when_migration_fails
  - name: 異常シナリオ（クローンを更新できない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: dev-docs のクローン
        description: 上流の新しい commit と同じファイルを手元で書き換え、commit していないクローン
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant AD as 管理の MCP
        participant DD as dev-docs

        U->>AD: update
        AD->>DD: クローンで git pull が失敗する
        AD-->>U: git のエラー
      ```
    expected:
      - '`update` が git のエラーを返す'
      - dev-docs は再起動せず、`status` が前のバージョンを返す
    test: test_error_when_pull_fails
  - name: 異常シナリオ（sources を移す途中で project-index が行を受け付けない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 端末の設定
        description: '`sources` に sample と broken の 2 行を持ち、`project_index` を持たない前のバージョンの `settings.yaml`'
        notes: broken は sample の後に並べ、`enabled` に bool へ変換できない文字列 `"maybe"` を持つ
      - name: project-index
        description: 正常シナリオ（端末の設定の sources を project-index へ移す）と同じ。端末の設定の `sources` に extra の 1 行がある
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant MG as dev-docs migrate
        participant CF as 端末の設定
        participant PI as project-index

        U->>MG: dev-docs migrate --project-index {アドレス}
        MG->>CF: 端末の設定を読む
        MG->>PI: sample と broken を加えた sources の保存（受け付けず、何も保存しない）
        MG-->>U: 受け付けなかった行と理由
      ```
    expected:
      - project-index の端末の設定の `sources` が extra の 1 行だけで、`migrate` の前と同じになる
      - dev-docs の端末の設定が `migrate` の前と同じ中身で、バックアップも作らない
      - 0 以外の終了コードで終わり、標準エラーに受け付けなかった行の ID（broken）と project-index が返却した理由が出る
    test: test_error_when_project_index_rejects_row_on_migrate
lead: 利用者が管理の MCP の `update` で dev-docs のクローンを新しいバージョンにし、端末の設定が古くなったら `dev-docs migrate` で移し替える。
issue: 4
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 1 つの操作で dev-docs を更新でき、端末の設定の移し替えは中身を確かめてから当てられる。失敗しても元に戻る。更新の後も同じ配信元を画面で読める
trigger: 利用者が管理の MCP の `update` を呼ぶ
preconditions:
  - dev-docs が待ち受けている
  - クローンの上流に新しいバージョンの commit がある
success_guarantee: dev-docs が新しいバージョンで待ち受け、端末の設定の `version` がそのバージョンになり、project-index が配信している配信元を画面で読める。
minimal_guarantee: '`git pull` に失敗したときは、前のバージョンのまま配信を続ける。移し替えの手順が失敗したときは、端末の設定をバックアップから戻す。`sources` を移すとき project-index が保存を受け付けなかったら、project-index の端末の設定も書き換えない。保存を確認できずに止まったときは、やり直せば保存済みの行を移した行として扱う。'
frequency: dev-docs の新しいバージョンが出るたび
priority: 中
refs:
  - SC-155-13#scenarios[正常シナリオ]
test_file: tests/e2e/単一ユースケース/test_dev-docsを更新する.py
