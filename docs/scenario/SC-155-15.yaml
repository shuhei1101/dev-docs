id: SC-155-15
title: 利用者が画面で編集中の変更をまとめて直コミットする
lead: 利用者がメタデータの画面で行を編集するか、文書の画面で文書の本文を編集し、差分確認で差分を確認してから、配信元ごとにまとめて 1 つのコミットでプッシュするシナリオを定め、編集中の変更の送信の流れを変えるときに参照する。
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 気づいたメタデータと文書の本文をその場で修正し、Issue と作業 PR を経ずにまとめてコミットできる。送信できなかった修正と理由が分かる。ほかの変更と衝突しても修正を失わず、手で解消しなくてよい
  - name: project-index
    interest: 書き込みの API が、許可と検査に合格した修正だけを 1 つのコミットにする。衝突したときは修正をブランチに残し、衝突したときのスクリプトに後の処理を任せる
  - name: 配信元を使用するプロジェクト
    interest: 検査に合格しないメタデータが既定のブランチに入らない。ほかの変更で書き換わった同じ項目が、利用者の修正で黙って上書きされない
trigger: 利用者がメタデータの画面で行の値を修正するか、文書の画面で文書の本文を編集する
preconditions:
  - 利用者が配信元のメタデータの画面か文書の画面を開いている
  - 配信元の設定の `direct_commit.kinds[]` と project-index の端末の設定の `sources[].direct_commit.write_api_kinds` の両方に、修正する種類がある
success_guarantee: 編集中の変更が、検査に合格して 1 つのコミットで配信元のリモートの既定のブランチへプッシュされ、画面の一覧が修正後の値になる。ほかの変更と衝突したときは、既定のブランチへはコミットせず、編集を始めたときのコミットからのブランチに修正が 1 つのコミットで残り、画面に残したブランチの名前が出て、その修正が編集中の変更から除かれる。
minimal_guarantee: 修正をどのブランチにも残せなかったときは、コミットもプッシュもせず、編集中の変更は修正ごとの理由と一緒に画面に残る。衝突したときのスクリプトが失敗しても、ブランチに残した修正は編集中の変更から除き、残したブランチとスクリプトの結果を画面に出す。dev-docs は配信元のファイルを自分で書き換えない。
frequency: 作業のたび
priority: 中
test_file: tests/e2e/単一ユースケース/test_利用者が画面で編集中の変更をまとめて直コミットする.py
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実環境で実行。リモートはテスト用の一時フォルダのベアリポジトリ）
      - name: 直コミットを許可した配信元
        description: '文書の種類 `note` と用語集の種類 `terms` を持つ git の配信元。`project-index.yaml` の `direct_commit` は `branch: develop`・`kinds: [note, terms]`。project-index の端末の設定の行は `direct_commit.write_api_kinds: [note, terms]`'
        notes: id `sample`。`develop` を指すワークツリーがあり、未プッシュのコミットと未コミットの変更が無い
      - name: 文書と用語
        description: タグ `topic:a` を持つ文書 n1 と、用語 `配信元`・`旧称` を持つ用語集
      - name: dev-docs
        description: sample を配信している dev-docs と project-index
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant SRV as 開発ドキュメントサーバー
        participant PI as project-index
        participant R as リモート

        U->>UI: タグのタブで n1 の行にタグ `topic:b` を追加する
        U->>UI: 用語集のタブで用語 `種類` の行を追加し、用語 `旧称` の行を削除する
        UI-->>U: トップバーの編集中の変更の件数 3
        U->>UI: 編集中の変更のパネルを開き、差分確認を押す
        UI->>SRV: sample の変更 3 件を dryRun で送信する
        SRV->>PI: POST /sources/sample/commits（dryRun）
        PI-->>SRV: 検査の合格と差分
        SRV-->>UI: 修正ごとの差分
        U->>UI: まとめて送信し、送信の確認でコミットの説明を入力して送信する
        UI->>SRV: sample の修正 3 件とコミットの説明を送信
        SRV->>PI: POST /sources/sample/commits
        PI->>R: develop へプッシュ
        PI-->>SRV: コミットとブランチ
        SRV-->>UI: 送信の結果
        UI-->>U: コミットとブランチの表示と、修正後の値の一覧
      ```

      <!-- /map -->
    expected:
      - 差分確認を押すと、パネルに修正ごとの差分が出て、リモートは変わらない
      - 送信すると、リモートの `develop` に 1 コミットだけ増え、コミットの説明が入力した説明で、変更は n1 と用語集のファイルだけ
      - パネルにプッシュしたコミットとブランチが出て、編集中の変更が空になり、トップバーの件数が出なくなる
      - タグのタブの n1 の行に `topic:b` が、用語集のタブに `種類` の行が出る
      - 用語集のタブに `旧称` の行が無く、リモートの用語集のファイルから `旧称` が消えている
    test: test_normal
  - name: 正常シナリオ（編集中の変更を取り消す）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 直コミットを許可した配信元
        description: 正常シナリオと同じ sample
      - name: 編集中の変更
        description: n1 のタグの追加と用語の追加の 2 件
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面

        U->>UI: 画面を再読み込みし、編集中の変更のパネルを開く
        UI-->>U: 編集中の変更 2 件
        U->>UI: 用語の追加の修正を取り消す
        UI-->>U: 編集中の変更 1 件と、元の値の用語集の表
      ```

      <!-- /map -->
    expected:
      - 再読み込みしても、編集中の変更 2 件が残っている
      - 取り消した後、パネルとトップバーの件数が 1 になり、用語集の表に `種類` の行が無い
      - リモートは変わらない
    test: test_normal_when_change_discarded
  - name: 正常シナリオ（同じ文書の別の項目が変わっている）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 直コミットを許可した配信元
        description: 正常シナリオと同じ sample
      - name: 編集中の変更
        description: n1 のタグの追加
      - name: 他の変更
        description: 編集中の変更がある状態で、リモートの develop へ n1 の概要を変えるコミットをプッシュする
        notes: n1 の文書の全体のバージョンは変わるが、タグの項目は変わらない
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant SRV as 開発ドキュメントサーバー
        participant PI as project-index
        participant R as リモート

        U->>UI: まとめて送信する
        UI->>SRV: sample の修正と、編集を始めたときのコミット
        SRV->>PI: POST /sources/sample/commits（修正したタグの項目のバージョン）
        PI->>R: develop へプッシュ
        PI-->>SRV: コミットとブランチ
        SRV-->>UI: 送信の結果
        UI-->>U: コミットとブランチの表示と、修正後の値の一覧
      ```

      <!-- /map -->
    expected:
      - リモートの `develop` に、他の変更のコミットの後に 1 コミットだけ増える
      - リモートの n1 の概要が他の変更の値、タグが `topic:a`・`topic:b` になっている
      - パネルにプッシュしたコミットとブランチが出て、編集中の変更が空になる
    test: test_normal_when_other_item_changed
  - name: 正常シナリオ（衝突したら修正をブランチに残す）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 直コミットを許可した配信元
        description: 正常シナリオと同じ sample。project-index の端末の設定の sample の行に、衝突したときのスクリプト（テスト用。受け取ったブランチの名前から作った PR の URL を出力して 0 で終わる）を登録する
      - name: 編集中の変更
        description: n1 のタグの追加と用語の追加の 2 件
      - name: 他の変更
        description: 編集中の変更がある状態で、リモートの develop へ n1 のタグを変えるコミットをプッシュする
        notes: 利用者が修正したタグの項目が変わり、衝突する。ほかの変更で n1 が削除されていたときも、同じ結末になる
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant SRV as 開発ドキュメントサーバー
        participant PI as project-index

        U->>UI: まとめて送信する
        UI->>SRV: sample の修正 2 件と、編集を始めたときのコミット
        SRV->>PI: POST /sources/sample/commits（baseCommit）
        PI->>PI: 今のブランチでは n1 のタグの項目のバージョンが合わない
        PI->>PI: 編集を始めたときのコミットからのブランチに修正を残す
        PI->>PI: 衝突したときのスクリプトを実行する
        PI-->>SRV: 残したブランチとスクリプトの結果
        SRV-->>UI: 残したブランチ・PR の URL・衝突した理由
        UI-->>U: 残したブランチの名前と PR の URL
      ```

      <!-- /map -->
    expected:
      - リモートの `develop` に、他の変更のコミットより後のコミットが増えない
      - クローンに `project-index/conflict/` で始まるブランチがあり、その先頭のコミットが n1 のタグの追加と用語の追加を持ち、説明が入力したコミットの説明
      - パネルに残したブランチの名前と、スクリプトが出力した PR の URL のリンクが出る
      - 編集中の変更から sample の 2 件が除かれ、トップバーの件数が出なくなる
    test: test_normal_when_conflict_kept_on_branch
  - name: 異常シナリオ（検査に合格しない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 直コミットを許可した配信元
        description: 正常シナリオと同じ sample
      - name: 編集中の変更
        description: n1 のタグの追加（合格する）と、名前が空の用語の追加（スキーマに合格しない）の 2 件
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant SRV as 開発ドキュメントサーバー
        participant PI as project-index

        U->>UI: まとめて送信する
        UI->>SRV: sample の修正 2 件を送信
        SRV->>PI: POST /sources/sample/commits
        PI-->>SRV: 422（用語の追加の違反）
        SRV-->>UI: 修正ごとの違反
        UI-->>U: 用語の追加の修正に、違反したキーと修正方法
      ```

      <!-- /map -->
    expected:
      - リモートとワークツリーが変わらない
      - 用語の追加の修正に、違反したキーのパスと修正方法が出る
      - 編集中の変更 2 件が残っている
    test: test_error_when_validation_failed
  - name: 異常シナリオ（衝突してスクリプトが失敗する）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 直コミットを許可した配信元
        description: 正常シナリオと同じ sample。project-index の端末の設定の sample の行に、衝突したときのスクリプト（テスト用。標準エラー出力に理由を出して 1 で終わる）を登録する
      - name: 編集中の変更
        description: n1 のタグの追加
      - name: 他の変更
        description: 正常シナリオ（衝突したら修正をブランチに残す）と同じく、リモートの develop へ n1 のタグを変えるコミットをプッシュする
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant SRV as 開発ドキュメントサーバー
        participant PI as project-index

        U->>UI: まとめて送信する
        UI->>SRV: sample の修正と、編集を始めたときのコミット
        SRV->>PI: POST /sources/sample/commits（baseCommit）
        PI->>PI: 修正をブランチに残し、衝突したときのスクリプトを実行する
        PI-->>SRV: 残したブランチと、スクリプトの終了コード 1・標準エラー出力
        SRV-->>UI: 残したブランチとスクリプトの失敗
        UI-->>U: 残したブランチの名前と、スクリプトが失敗したことと理由
      ```

      <!-- /map -->
    expected:
      - リモートの `develop` に、他の変更のコミットより後のコミットが増えない
      - クローンに修正を持つ `project-index/conflict/` で始まるブランチがある
      - パネルに残したブランチの名前と、スクリプトが失敗したことと標準エラー出力の理由が出る
      - 編集中の変更から n1 の修正が除かれる
    test: test_error_when_conflict_script_failed
  - name: 異常シナリオ（編集を始めたときのコミットが使用できない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 直コミットを許可した配信元
        description: 正常シナリオと同じ sample
      - name: 編集中の変更
        description: n1 のタグの追加
      - name: 履歴の書き換え
        description: 編集中の変更がある状態で、リモートの develop を、編集を始めたときのコミットを含まない履歴へ強制プッシュで書き換える
        notes: 編集を始めたときのコミットが develop の祖先でなくなる
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant SRV as 開発ドキュメントサーバー
        participant PI as project-index

        U->>UI: まとめて送信する
        UI->>SRV: sample の修正と、編集を始めたときのコミット
        SRV->>PI: POST /sources/sample/commits（baseCommit）
        PI-->>SRV: 409（編集を始めたときのコミットが起点に使用できない）
        SRV-->>UI: 送信の失敗と理由
        UI-->>U: 送信できなかったことと理由
      ```

      <!-- /map -->
    expected:
      - リモートに、履歴の書き換えより後のコミットが増えず、クローンに `project-index/conflict/` で始まるブランチが増えない
      - パネルに、編集を始めたときのコミットが使用できないことと理由が出て、編集中の変更が残っている
    test: test_error_when_base_commit_unusable
  - name: 異常シナリオ（直コミットを許可していない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 直コミットを許可した配信元
        description: 正常シナリオと同じ sample
      - name: 編集中の変更
        description: n1 のタグの追加
      - name: 許可の取り消し
        description: 編集中の変更がある状態で、project-index の端末の設定の API（`PUT /settings/sources`）で、sample の行の `direct_commit.write_api_kinds` から `note` を除く（project-index は端末の設定のファイルを監視しないため、ファイルを書き換えるだけでは反映されない）
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant SRV as 開発ドキュメントサーバー
        participant PI as project-index

        U->>UI: まとめて送信する
        UI->>SRV: sample の修正を送信
        SRV->>PI: POST /sources/sample/commits
        PI-->>SRV: 403（許可していない種類）
        SRV-->>UI: 許可していない種類と、許可を記載する端末の設定のキー
        UI-->>U: n1 の修正に、許可していない種類と許可の記載先
      ```

      <!-- /map -->
    expected:
      - リモートとワークツリーが変わらない
      - n1 の修正に、許可していない種類 `note` と、許可を記載するキー `sources[].direct_commit.write_api_kinds` が出て、編集中の変更が残っている
    test: test_error_when_direct_commit_not_permitted
  - name: 異常シナリオ（リモートに接続できない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 直コミットを許可した配信元
        description: 正常シナリオと同じ sample
      - name: 編集中の変更
        description: n1 のタグの追加
      - name: リモートの失敗
        description: 編集中の変更がある状態で、sample のリモートの URL を存在しないパスへ変える
        notes: 取得に失敗し、project-index が 502 を返却する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant SRV as 開発ドキュメントサーバー
        participant PI as project-index

        U->>UI: まとめて送信する
        UI->>SRV: sample の修正を送信
        SRV->>PI: POST /sources/sample/commits
        PI-->>SRV: 502（リモートからの取得に失敗）
        SRV-->>UI: 送信の失敗と理由
        UI-->>U: 送信できなかったことと理由、もう一度送信するボタン
      ```

      <!-- /map -->
    expected:
      - パネルに送信できなかったことと理由が出て、編集中の変更が残っている
      - sample のワークツリーに未コミットの変更と未プッシュのコミットが無い
    test: test_error_when_remote_unreachable
  - name: 正常シナリオ（衝突してスクリプトの指定が無い）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 直コミットを許可した配信元
        description: 正常シナリオと同じ sample
        notes: project-index の端末の設定の sample の行に `direct_commit.on_conflict` を配置しない
      - name: 編集中の変更
        description: n1 のタグの追加
      - name: 他の変更
        description: 正常シナリオ（衝突したら修正をブランチに残す）と同じく、リモートの develop へ n1 のタグを変えるコミットをプッシュする
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant SRV as 開発ドキュメントサーバー
        participant PI as project-index

        U->>UI: まとめて送信する
        UI->>SRV: sample の修正と、編集を始めたときのコミット
        SRV->>PI: POST /sources/sample/commits（baseCommit）
        PI->>PI: 修正をブランチに残す（衝突したときのスクリプトは指定が無く実行しない）
        PI-->>SRV: 残したブランチと、スクリプトの結果なし
        SRV-->>UI: 残したブランチと、スクリプトの指定が無いこと
        UI-->>U: 残したブランチの名前と、スクリプトの指定が無いこと
      ```

      <!-- /map -->
    expected:
      - リモートの `develop` に、他の変更のコミットより後のコミットが増えない
      - クローンに修正を持つ `project-index/conflict/` で始まるブランチがある
      - パネルに残したブランチの名前と、衝突したときのスクリプトの指定が無いことが出て、PR の URL は出ない
      - 編集中の変更から n1 の修正が除かれる
    test: test_normal_when_conflict_script_not_configured
  - name: 正常シナリオ（文書の画面で本文を編集する）
    setup:
      - name: Mock
        description: なし（実環境で実行。リモートはテスト用の一時フォルダのベアリポジトリ）
      - name: 直コミットを許可した配信元
        description: '正常シナリオの sample に、Markdown の文書の種類 `guide`（管理用の YAML `files.yml` を `records: files`・`body_file: path` で指す）を加えたもの。`direct_commit.kinds` と project-index の端末の設定の `write_api_kinds` は `[note, terms, guide]`'
        notes: '`note` のスキーマは、文字列の項目 `summary`、Markdown の文字列の項目 `items[].body`、平らなオブジェクトの配列 `rows[]`（`word`・`replacement`）を持つ'
      - name: 文書
        description: '`summary` が `修正前の概要`、`items[0].body` が 2 行の Markdown、`rows` が 2 行の文書 n1 と、本文が 3 行の Markdown の文書 `guide.md`'
      - name: dev-docs
        description: sample を配信している dev-docs と project-index
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant SRV as 開発ドキュメントサーバー
        participant PI as project-index
        participant R as リモート

        U->>UI: n1 の文書の画面を開き、編集を押す
        UI-->>U: 本文の項目ごとの編集のボタン
        U->>UI: 概要を `修正後の概要` に修正し、表の 2 行目の置き換え先を修正する
        U->>UI: items[0].body にエディタとプレビューで 1 行追加する
        U->>UI: guide.md の文書の画面を開き、ファイル全体を編集して 1 行書き換える
        UI-->>U: トップバーの編集中の変更の件数 4
        U->>UI: 文書の画面で編集中のパネルを開き、差分確認を押す
        UI->>SRV: sample の変更 4 件を dryRun で送信する
        SRV->>PI: POST /sources/sample/commits（dryRun。n1 は項目のパスへの set、guide.md は @body）
        PI-->>SRV: 検査の合格と差分
        SRV-->>UI: 変更ごとの差分
        U->>UI: コミットの確認でコミットの説明を入力してコミットする
        UI->>SRV: sample の変更 4 件とコミットの説明
        SRV->>PI: POST /sources/sample/commits
        PI->>R: develop へプッシュ
        PI-->>SRV: コミットとブランチ
        SRV-->>UI: 送信の結果
        UI-->>U: コミットとブランチの表示と、修正後の本文
      ```

      <!-- /map -->
    expected:
      - 編集を押すと、`summary`・`items[0].body`・`rows` の各行に編集のボタンが出て、文書の画面の URL とサイドバーはそのまま残る
      - 差分確認を押すと、編集中のパネルに変更ごとの差分が出て、リモートは変わらない
      - コミットすると、リモートの `develop` に 1 コミットだけ増え、変更は n1 の YAML と `guide.md` だけで、n1 の修正していない項目は一字も変わらない
      - パネルにプッシュしたコミットとブランチが出て、編集中の変更が空になり、トップバーの件数が出なくなる
      - n1 と `guide.md` の文書の画面に修正後の本文が出る
    test: test_normal_when_document_body_edited
  - name: 正常シナリオ（編集できない文書には編集のボタンを出さない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 直コミットを許可した配信元
        description: '正常シナリオ（文書の画面で本文を編集する）と同じ sample の `direct_commit.kinds` の `guide` を `{id: guide, body: false}` にし、`write_api_kinds` に無い種類 `memo` を加えたもの'
        notes: '`guide` は本文の直コミットを断り、`memo` は書き込みの API から直コミットできない'
      - name: dev-docs
        description: sample を配信している dev-docs と project-index
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面

        U->>UI: n1 の文書の画面を開く
        UI-->>U: 編集のボタン
        U->>UI: guide.md の文書の画面を開く
        UI-->>U: 編集のボタンを出さない
        U->>UI: memo の文書の画面を開く
        UI-->>U: 編集のボタンを出さない
      ```

      <!-- /map -->
    expected:
      - n1 の文書の画面には編集のボタンが出る
      - '`guide.md` と `memo` の文書の画面には編集のボタンが出ず、本文の項目にも編集のボタンが出ない'
      - リモートは変わらない
    test: test_normal_when_document_not_editable
  - name: 異常シナリオ（本文の変更が検査に合格しない）
    setup:
      - name: Mock
        description: なし（実環境で実行）
      - name: 直コミットを許可した配信元
        description: 正常シナリオ（文書の画面で本文を編集する）と同じ sample
      - name: 編集中の変更
        description: n1 のファイル全体の編集で、スキーマの必須の項目 `summary` を削除した変更と、`guide.md` の 1 行の書き換え（合格する）の 2 件
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant UI as dev-docs の画面
        participant SRV as 開発ドキュメントサーバー
        participant PI as project-index

        U->>UI: 編集中のパネルで差分確認を押す
        UI->>SRV: sample の変更 2 件を dryRun で送信する
        SRV->>PI: POST /sources/sample/commits（dryRun）
        PI-->>SRV: 422（n1 の違反）
        SRV-->>UI: 変更ごとの違反
        UI-->>U: n1 の変更に、違反した項目のパスと修正方法
      ```

      <!-- /map -->
    expected:
      - n1 の変更に、違反した項目のパス（`summary`）と修正方法が出る
      - リモートとワークツリーが変わらない
      - 編集中の変更 2 件が残っている
    test: test_error_when_document_body_invalid
