id: CMP-155-2
title: "トップバー"
implementation: "frontend/src/shared/components/topbar/topbar.tsx#Topbar"
story: "Layout/Topbar"
states:
  - name: DocView
    description: 文書の画面。配信元 3 件・リビジョン・コメント 2 件
    args:
      - name: screen
        value: doc-view
      - name: currentSource
        value: sample
      - name: currentRef
        value: develop
      - name: commentCount
        value: '2'
  - name: DocViewNarrow
    description: 文書の画面を配置した場所の幅が 48rem 未満。サイドバーを開くボタンを出し、リビジョンと画面名をアイコンだけにする
    viewport: mobile
    args:
      - name: screen
        value: doc-view
      - name: currentSource
        value: sample
      - name: commentCount
        value: '2'
  - name: DocViewNoComments
    description: コメントが 0 件で、件数を出さない
    args:
      - name: screen
        value: doc-view
      - name: currentSource
        value: sample
      - name: commentCount
        value: '0'
  - name: NonGitSource
    description: Git 管理外の配信元。リビジョンのボタンを出さない
    args:
      - name: screen
        value: doc-view
      - name: currentSource
        value: notes
      - name: refs
        value: '{"git": false, "defaultRef": "", "branches": [], "tags": [], "commits": []}'
  - name: Settings
    description: 設定画面。画面名と明暗のボタンだけ
    args:
      - name: screen
        value: settings
  - name: NotFound
    description: 見つからない画面。コメントを出さない
    args:
      - name: screen
        value: not-found
      - name: currentSource
        value: sample
  - name: NotFoundNarrow
    description: 見つからない画面を幅 48rem 未満の場所に配置する
    viewport: mobile
    args:
      - name: screen
        value: not-found
      - name: currentSource
        value: sample
  - name: NotFoundWithoutSource
    description: 無い配信元を開いた見つからない画面。配信元のボタンに今の配信元を出さず、リビジョンのボタンを出さない
    args:
      - name: screen
        value: not-found
  - name: DarkScheme
    description: 明暗を暗に固定した状態。明暗のボタンが押した状態になる
    args:
      - name: screen
        value: doc-view
      - name: currentSource
        value: sample
      - name: colorScheme
        value: dark
  - name: DocViewWithPendingEdits
    description: 文書の画面で、編集中の変更が 3 件ある
    args:
      - name: screen
        value: doc-view
      - name: currentSource
        value: sample
      - name: pendingEditCount
        value: '3'
  - name: Metadata
    description: メタデータの画面。メタデータのボタンを今の画面として示し、コメントを出さない
    args:
      - name: screen
        value: metadata
      - name: currentSource
        value: sample
      - name: pendingEditCount
        value: '3'
  - name: MetadataNarrow
    description: メタデータの画面を幅 48rem 未満の場所に配置する。メタデータとレビュー中のボタンをアイコンと件数だけにする
    viewport: mobile
    args:
      - name: screen
        value: metadata
      - name: currentSource
        value: sample
      - name: pendingEditCount
        value: '3'
  - name: LongItems
    description: 長い配信元の ID・ブランチ名・commit の題名を持つ。メニューを開くと、ボタンの幅以上の中身の幅で開き、項目を 1 行で出す
    args:
      - name: screen
        value: doc-view
      - name: currentSource
        value: mindstella-nandemo-kaiwa-74ba1a
      - name: sources
        value: '[{"id": "mindstella-nandemo-kaiwa-74ba1a", "writable": true}, {"id": "aituber-material-templates", "writable": false}, {"id": "sample", "writable": true}]'
      - name: refs
        value: '{"git": true, "defaultRef": "develop", "branches": [{"name": "feat/screen/metadata-only-kinds-and-excluded-docs"}], "tags": [{"name": "v1.12.0"}], "commits": [{"commit": "5b3f8e2", "subject": "docs: PR ドキュメント #331 の要件と計画書を記入"}]}'
      - name: currentRef
        value: feat/screen/metadata-only-kinds-and-excluded-docs
  - name: LongItemsNarrow
    description: LongItems を幅 48rem 未満の場所に配置する。メニューは画面の幅を超えず、超える項目は末尾を省略して 1 行に収める
    viewport: mobile
    args:
      - name: screen
        value: doc-view
      - name: currentSource
        value: mindstella-nandemo-kaiwa-74ba1a
      - name: sources
        value: '[{"id": "mindstella-nandemo-kaiwa-74ba1a", "writable": true}, {"id": "aituber-material-templates", "writable": false}, {"id": "sample", "writable": true}]'
      - name: refs
        value: '{"git": true, "defaultRef": "develop", "branches": [{"name": "feat/screen/metadata-only-kinds-and-excluded-docs"}], "tags": [{"name": "v1.12.0"}], "commits": [{"commit": "5b3f8e2", "subject": "docs: PR ドキュメント #331 の要件と計画書を記入"}]}'
      - name: currentRef
        value: feat/screen/metadata-only-kinds-and-excluded-docs
lead: 3 画面に共通の画面上部のバー（配信元・リビジョンの切り替え・検索・コメント・設定・明暗）の引数と状態を定め、トップバーを修正するときに参照する。
args:
  - name: screen
    type: enum
    required: true
    choices: '`doc-view` / `metadata` / `settings` / `not-found`'
    description: 配置する画面。`settings` は配信元・リビジョンの切り替え・検索・コメント・設定を出さない。`not-found` はコメントを出さない。`doc-view` だけが狭い幅でサイドバーを開くボタンを出す。`doc-view`・`metadata` は `currentSource` があるとき、メタデータの画面を開くボタンとレビュー中のパネルを開くボタンを出す。`metadata` はコメントを出さない
  - name: sources
    type: array
    required: false
    default: '[]'
    description: 配信元のメニューの項目
    enabled_when: '`screen` が `settings` 以外'
  - name: sources[].id
    type: string
    required: true
    description: 配信元の ID
  - name: sources[].writable
    type: boolean
    required: true
    description: 書き込めるか。`true` は「読み書き」、`false` は「読み取りだけ」を項目に添える
  - name: currentSource
    type: string
    required: false
    default: なし（配信元が決まっていない。ボタンに今の配信元を出さず、リビジョンのボタンを出さない）
    description: 今の配信元の ID。画面名のリンクはこの配信元のトップを開く
  - name: refs
    type: object
    required: false
    default: なし（リビジョンのボタンを出さない）
    description: リビジョンのメニューの項目。リビジョンの一覧のレスポンス
    enabled_when: '`currentSource` があり、`refs.git` が `true`'
  - name: refs.git
    type: boolean
    required: true
    description: 配信元が Git の作業ツリーか。`false` のときリビジョンのボタンを出さない
  - name: refs.defaultRef
    type: string
    required: true
    description: 配信元の既定のリビジョン
  - name: refs.branches
    type: array
    required: true
    description: メニューのブランチの項目
  - name: refs.tags
    type: array
    required: true
    description: メニューのタグの項目
  - name: refs.commits
    type: array
    required: true
    description: メニューの最近の commit の項目（commit と題名）
  - name: currentRef
    type: string
    required: false
    default: '`refs.defaultRef`'
    description: 開いているリビジョン
  - name: commentCount
    type: integer
    required: false
    default: '0'
    description: 溜めたコメントの件数。コメントのボタンに出す（0 のときは件数を出さない）
    enabled_when: '`screen` が `doc-view`'
  - name: colorScheme
    type: enum
    required: false
    default: '`system`'
    choices: '`system` / `light` / `dark`'
    description: 今の明暗。`system` 以外のとき、明暗のボタンを押した状態（`aria-pressed`）にする
  - name: pendingEditCount
    type: integer
    required: false
    default: '0'
    description: 開いている配信元の編集中の変更の件数。レビュー中のボタンに出す（0 のときは件数を出さない）
    enabled_when: '`screen` が `doc-view` か `metadata` で、`currentSource` がある'
  - name: refs.branches[].name
    type: string
    required: true
    description: ブランチ名
  - name: refs.tags[].name
    type: string
    required: true
    description: タグ名
  - name: refs.commits[].commit
    type: string
    required: true
    description: commit の短縮 SHA
  - name: refs.commits[].subject
    type: string
    required: true
    description: commit の題名
events:
  - name: sourceSelect
    when: 配信元のメニューの項目を選んだ
    value: 配信元の ID
    description: その配信元のトップへ遷移する
  - name: refSelect
    when: リビジョンのメニューの項目を選んだ
    value: ブランチ名・タグ名・commit
    description: 同じ文書をそのリビジョンで再度開く
  - name: compareStart
    when: リビジョンのメニューの「別のリビジョンと比較」を選んだ
    description: 文書の画面の差分の比較元・比較先の選択を出す
  - name: searchOpen
    when: 検索のボタンを押した
    description: 検索のダイアログを開く（Ctrl+K・`/` のキー操作は画面が受ける）
  - name: commentPanelToggle
    when: コメントのボタンを押した
    description: コメントのパネルを開閉する
  - name: sidebarOpen
    when: 狭い幅で文書の一覧を開くボタンを押した
    description: サイドバーをドロワーで開く
  - name: colorSchemeToggle
    when: 明暗のボタンを押した
    value: 次の `colorScheme`
    description: 明暗を切り替えて保つ
  - name: pendingPanelToggle
    when: レビュー中のボタンを押した
    description: 開いている画面（文書の画面・メタデータの画面）でレビュー中のパネルを開閉する
notes:
  モック: '[docs/mock/components/topbar/index.html](../mock/components/topbar/index.html)'
  メニューの幅: |-
    配信元・リビジョンのメニューは、開いたボタンの幅に合わせず、項目の中身の幅で開く。項目は折り返さず 1 行で出し、幅の下限は開いたボタンの幅、上限はメニューを開いた位置から使用できる画面の幅にする。上限を超える項目は末尾を省略し、全文を `title` に持たせる。
    幅の指定はトップバーの 2 つのメニューで `DropdownMenuContent` に指定し、shadcn から追加したドロップダウンメニューの部品の既定は変えない
status: planned
test_file: tests/integration/frontend/topbar.spec.ts
tags:
  - name: topic:トップバー
    main: true
  - name: topic:部品
  - name: topic:リビジョン
  - name: action:検索
  - name: topic:コメント
  - name: topic:テーマ
accessibility:
  keyboard: ボタンを Tab で移り、Enter と Space で押す。メニューはキーボードだけで開閉・選択でき、↑・↓ で項目を移り、Enter で選び、Esc で閉じてボタンへフォーカスを戻す
  rules:
    - アイコンだけのボタンは `aria-label` を持つ（文書の一覧を開く・設定・明暗を固定する・`コメント {件数} 件`）
    - 配信元・リビジョンのボタンの読み上げ名に今の値を含める（`配信元を切り替える。今は {ID}`・`リビジョンを切り替える。今は {ref}`）。見える値に全角の括弧を隣接させると axe の `label-content-name-mismatch` に該当する。メニューの今の項目は `aria-current`
    - 検索のボタンは `aria-keyshortcuts="Control+K /"` を持ち、キーを表示する（読み上げ名は `検索 Ctrl K`）
    - 明暗のボタンは `aria-pressed` で固定しているかを示す
    - メタデータのボタンはメタデータの画面へのリンク（読み上げ名 `メタデータ`。メタデータの画面では `aria-current="page"`）。レビュー中のボタンの読み上げ名は `レビュー中 {件数} 件`（0 件のときは `レビュー中`）
