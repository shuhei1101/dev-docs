scope_out:
  - item: 反映作業のスクリプトが配信元の設定を dev-docs.yaml に決め打ちする不具合の修正
    reason: 配布元の AI Monitor の不具合で、この PR では同じ書き換えを project-index.yaml へ当てる
    plan: shuhei1101/ai-monitor#3472
  - item: AI Monitor v0.5.0 の配布物への追従（knowledge のスキーマの ref を design-schemas/v8.1.0 より後へ上げることを含む）
    reason: v0.4.0 の追従の範囲の外
    plan: '#243'
  - item: 配信設定（docs/_config.yml のキーの追加）とサイトのレイアウトの取り込み
    reason: 'dev-docs に docs/_config.yml が無く、テーマの取り込みは #194 で扱った'
    plan: none
  - item: プラグイン（update_plugins）・設定スキーマ（settings.yaml のキーの追加）・MCP ツール（agents[].mcp_tools の見直し）
    reason: モニターのプラグインと settings.yaml は全プロジェクトで共有し、dev-docs の作業 PR で変える対象ではない
    plan: none
  - item: rules.yaml へのルール索引の行の追加
    reason: 'dev-docs の rules.yaml は rules: [] で、配布元のルール索引を写していない'
    plan: none
  - item: AI Monitor の設計書の変換（design_docs convert --from v0.3.0 --to design-schemas/v8.1.0）の実行
    reason: 変換は project-index.yaml に layout の行が無いため止まり、docs/module/ の ID 名の設計書を改名する不具合も持つ。同じ移し方を手で当てる
    plan: shuhei1101/ai-monitor#3357
  - item: フォルダ構成の設計書（layout）の作成と、notes の「フォルダ構成」のセクションへ移したツリーのそこへの移動
    reason: リポジトリ全体のエントリを記載する新規の設計書で、v0.4.0 の追従の範囲を超える。この PR ではツリーを失わないよう notes へ移す
    plan: to_file
