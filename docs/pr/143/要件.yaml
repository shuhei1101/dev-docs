use_cases:
  - kind: composite
    scenario: dev/設計書/シナリオ/複合ユースケース/dev-docsで文書を配信して読み書きする.yaml
    impact: none
    detail: 流れは変わらない
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/利用者が画面で読む.yaml
    impact: changed
    detail: 期待値が引用する、プロンプトの文書の変数の表の列名（出どころ）が変わる。例の組の字数の行（使わなかった部品）の文言も変わる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/エージェントが調べる.yaml
    impact: run_only
    detail: 検索・変更の一覧・関連のたどり・配信元の説明の引数の説明と、文書の検索のツールの説明の文言が変わる。シナリオの期待値は説明の文言を引用していない
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/エージェントが書き込む.yaml
    impact: run_only
    detail: 文書の書き込みのツールの説明の文言が変わる。シナリオの期待値は説明の文言を引用していない
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/dev-docsを更新する.yaml
    impact: run_only
    detail: 設定の移し替えのヘルプ・手順の説明・エラーの文言が変わる。シナリオの期待値は文言を引用していない
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/配信元を追加する.yaml
    impact: run_only
    detail: 管理用の YAML に記載するファイルの一覧を出すコマンドのヘルプの文言が変わる。シナリオの期待値は文言を引用していない
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/設定・スクリプトを変える.yaml
    impact: run_only
    detail: 管理の MCP の nav の書き込み・配信元の検査の引数の説明と、nav の書き込みのツールの説明の文言が変わる。シナリオの期待値は説明の文言を引用していない
    depends_on: []
scope_out:
  - item: '`templates/` のスキーマと設定のひな形の `title`・`description`・コメントの文言（`templates/prompt.schema.yaml` の `値の出どころ` など）'
    reason: '`Field` の `description`・ツールの説明・CLI の出力のどれでもなく、#139・#140 の範囲に入らない'
    plan: '#144'
  - item: 管理用プラグインのセッション開始のフック（`plugins/dev-docs/hooks/session_start.py`）が返却する文言（`返し済みの記録を削除できませんでした` など）
    reason: '進行中の PR #131 が同じファイルを変更しているため、束に含めない（#142 の本文の `## 補足`）'
    plan: '#134'
  - item: '`docs/`・`dev/` の地の文（`docs/リファレンス/CLI.md`・`docs/リファレンス/文書のMCP.md` が引数・オプションを言い換えて説明する文など）'
    reason: '`docs/`・`dev/` の文書の修正は #95 の範囲（PR #133 と同じ扱い）。本 PR は修正する文言と同じ文を持つ設計書の項目だけを修正する'
    plan: '#95'
  - item: '`src/dev_docs/` の docstring・コメント・ログの文言（入力スキーマ・応答のスキーマの `description` になる `BaseModel` の docstring を除く。`PromptDoc`・`TerminalConfig` など、MCP の入力スキーマにも `session-start` の応答にも出ないモデルの docstring を含む）'
    reason: 'MCP の入力スキーマ・応答のスキーマにも CLI の出力にも出ない（PR #133 と同じ扱い）'
    plan: none
  - item: '`dev/mock/` の過去のモックの HTML の文言（`出どころ`・`使わなかった部品`）'
    reason: 採用を決めた時点の記録で、配信も実装もしない
    plan: none
docs: []
