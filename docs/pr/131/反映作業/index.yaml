dev-docs のサーバーの再起動:
  説明: develop の worktree から起動して稼働中の dev-docs のサーバー（127.0.0.1:8781）を、マージした develop のコードで起動し直し、Git 管理外の先頭の配信元の設定の参照と、XDG の環境変数による端末の設定・状態の置き場の決め方を有効にする。XDG_CONFIG_HOME・XDG_STATE_HOME・DEV_DOCS_STATE_DIR を設定していない端末のため、端末の設定と状態の置き場のパスは変わらない。最長の実行時間は、実行が約 915 秒（再起動の前の配信元の読み込みの待ち 540 秒 + 状態の取得 255 秒 + 新しいサーバーの待ち受けの待ち 120 秒）、確認が約 795 秒（配信元の読み込みの待ち 540 秒 + 状態の取得 255 秒）
  タグ: [再起動]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  起動し直す対象: dev-docs のサーバー（127.0.0.1:8781）
  可逆: true
  疎通確認: dev-docs のサーバーの再起動/疎通確認.sh
  実行: dev-docs のサーバーの再起動/実行.sh
  確認: dev-docs のサーバーの再起動/確認.sh
  切り戻し: null
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: 配信元の読み込みが終わった後に、稼働中の dev-docs のサーバーの管理の MCP の status が、端末の設定のパスを ~/.config/dev-docs/settings.yaml と返し、再起動の前と同じ配信元を配信中と返す
  状態: "-"
