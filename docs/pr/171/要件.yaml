scope_out:
  - item: 既存の文書の書き方を mdmark の書き方と表し方の優先順位へ移す
    reason: 本文の書き方の移行は別の目的で、この Issue は配信とメタデータと形式の変換だけを扱う
    plan: '#95'
  - item: docs/guide/ の Markdown の permalink の front matter
    reason: GitHub Pages の URL を決める Jekyll の設定で、メタデータではない。削除すると公開ページの URL が変わる
    plan: none
  - item: docs/pr/ の配信
    reason: 作業 PR の記録で、文書の正本ではない（ai-monitor・knowledge の配信元も載せていない）
    plan: none
  - item: docs/ の YAML の設計書（scenario・interface・module など）への tags の付与
    reason: 設計書は title・lead を名前・概要文として metadata の対応で配信でき、検索で見つかる。tags は任意のキーで、付けるには設計書の種類ごとに主題を決める別の作業が要る。付けた tags はこの作業 PR の project-index.yaml の metadata の対応が入って初めて検索に効く
    plan: to_file
