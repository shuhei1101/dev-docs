scope_out:
  - item: AI Monitor のプロンプトに入る文（フェーズの手順・規約・エージェントの定義）を画面から直コミットできるようにすること
    reason: 直コミットを許可するかが話し合いで未決定（検討事項 D-874）。許可は ai-monitor の project-index.yaml と端末の設定で決まり、この作業 PR の画面は許可された種類をそのまま扱う。完了の報告で、この部分が未対応であることと D-874 を示す
    plan: shuhei1101/ai-monitor#3777
  - item: ほかのリポジトリ（project-index・mdmark・rule-inject など）の project-index.yaml への direct_commit.kinds の追加
    reason: 配信元の設定はそれぞれのリポジトリが持ち、そのリポジトリの作業 PR で変える（受付の判断）。どの種類を許可するかは、この作業 PR で dev-docs 自身の種類を決めた後に、同じ考え方でリポジトリごとに起票する。起票した Issue は shuhei1101/project-index#283・shuhei1101/mdmark#796・shuhei1101/rule-inject#220（aituber は既存の shuhei1101/aituber#222）
    plan: shuhei1101/project-index#283
