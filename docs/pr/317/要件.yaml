    impact: changed
    detail: ほかの変更と衝突したときに、利用者の修正を失わずにブランチへ残し、残したブランチ（スクリプトが返却すれば PR）を利用者に示す。同じ文書の別の項目の変更とは衝突せずにコミットする
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-155-14.yaml
    impact: run_only
    detail: メタデータを開いて参照する流れは変えないが、編集を始めたときの記録で取得の内容が変わりうるため確認する
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-155-13.yaml
    impact: run_only
    detail: 画面の利用の全体の流れは変えず、直コミットの工程の中身だけが変わる
    depends_on: []
