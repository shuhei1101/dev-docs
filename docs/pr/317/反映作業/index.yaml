端末の設定の直コミットの許可と衝突したときのスクリプトの登録:
  説明: project-index の端末の設定（~/.config/project-index/settings.yaml）の配信元の行に、衝突したときのスクリプト（sources[].direct_commit.on_conflict.command。["bash", dev-docs の develop の worktree の scripts/project-index-on-conflict.sh の絶対パス]）と、書き込みの API から直コミットできる種類（sources[].direct_commit.write_api_kinds。配信元の設定の direct_commit.kinds の全ての種類）を登録する。on_conflict は端末の設定の API が受け付けないため、ファイルを同じフォルダへ settings.yaml.bak-{日時} で退避してから記載し、続けて端末の設定の API（PATCH /settings/sources/{id}）で write_api_kinds を送信して行の配信元を再読み込みさせる。対象は dev-docs と、配信元の設定で直コミットを許可している knowledge・knowledge-memes・aituber-assets の行。切り戻しは最新の退避したファイルへ戻し、退避時の write_api_kinds を送信する
  タグ: [端末の設定, 直コミット]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  可逆: true
  疎通確認: 端末の設定の直コミットの許可と衝突したときのスクリプトの登録/疎通確認.py
  実行: 端末の設定の直コミットの許可と衝突したときのスクリプトの登録/実行.py
  確認: 端末の設定の直コミットの許可と衝突したときのスクリプトの登録/確認.py
  切り戻し: 端末の設定の直コミットの許可と衝突したときのスクリプトの登録/切り戻し.py
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: 端末の設定の API（GET /settings/sources）の対象の配信元の行の directCommit が、追加した writeApiKinds と onConflict.command を持つ
  状態: skipped
