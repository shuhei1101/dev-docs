dev-docs のサーバーの再起動:
  説明: develop の worktree から起動して稼働中の dev-docs のサーバー（127.0.0.1:8781）を、マージした develop のコードで起動し直し、新しいスキーマのキーでの図の描画を有効にする。最長の実行時間は、実行が約 120 秒（新しいサーバーの待ち受けの待ち）、確認が約 600 秒（配信元の読み込みの待ち 540 秒 + 文書の取得 60 秒）
  タグ: [再起動]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  起動し直す対象: dev-docs のサーバー（127.0.0.1:8781）
  可逆: true
  疎通確認: dev-docs のサーバーの再起動/疎通確認.sh
  実行: dev-docs のサーバーの再起動/実行.sh
  確認: dev-docs のサーバーの再起動/確認.sh
  切り戻し: null
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: 配信元の読み込みが終わった後に、稼働中の dev-docs のサーバーから配信元 ai-monitor の `dev/設計書/ER図/セッション.yaml` の本文を取得し、mdmark の ER 図の定義に、文書の関連と同じ数の関連が両端の列（`from_column`・`to_column`）と多重度（`from_cardinality`・`to_cardinality`）つきで出る
  状態: "-"
