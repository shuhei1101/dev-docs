dev-docs のサーバーの再起動:
  説明: 稼働中の dev-docs のサーバー（127.0.0.1:8781）を管理の MCP の `restart` で起動し直し、project-index の `commonKeys` を使う付け替え口へ切り替える。起動し直す前に、project-index（127.0.0.1:8786）の文書の一覧が `common_keys=true` に `commonKeys` を返すことを確かめる。develop の worktree の付け替え口の更新より後に起動していれば何もしない。前のコードへ戻す切り戻しは持たない（develop を戻して同じ実行スクリプトで起動し直す）
