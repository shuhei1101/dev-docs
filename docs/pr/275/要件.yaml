  - item: フォルダ構成の設計書の refs の related への書き換えと、スキーマの参照の design-schemas v9 系への版上げ
    reason: 要望は他の設計書の行と同じ ref で作ることで、v9 系への版上げは全ての設計書を書き換える別の作業のため
    plan: '#263'
  - item: モジュール構成の notes の「フォルダ構成」以外のセクション（MOD-155-75 の「生成物」など）の移動
    reason: 要望は「フォルダ構成」のセクションだけを移すことで、他のセクションはモジュールの補足として残るため
    plan: none
