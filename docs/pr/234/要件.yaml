use_cases:
  - kind: single
    scenario: docs/scenario/SC-155-10.yaml
    impact: changed
    detail: セッションの開始で落ちているサーバーを起こすとき、常駐サーバーとして登録した起動の仕組みの外にプロセスを残さない。起動し直したら起動し直したプロセスが配信を引き継ぎ、同時に 2 回起動しても配信するのは 1 つで、もう片方は理由を出して終わる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-155-3.yaml
    impact: following
    detail: 更新の後の再起動で、古いコードのプロセスが配信を続けない
    depends_on:
      - docs/scenario/SC-155-10.yaml
  - kind: single
    scenario: docs/scenario/SC-155-2.yaml
    impact: following
    detail: 端末に入れるときの起動を、起動する UC の起動の仕組みに揃える
    depends_on:
      - docs/scenario/SC-155-10.yaml
