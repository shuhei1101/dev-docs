dev-docs のサーバーの再起動:
  説明: develop の worktree から起動して稼働中の dev-docs のサーバー（127.0.0.1:8781）を、マージした develop のコードで再起動し、起動直後に要求が指す配信元の読み込みだけを待つ動きと、読み込みの後の status の速い応答を有効にする
  タグ: [再起動]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  起動し直す対象: dev-docs のサーバー（127.0.0.1:8781）
  可逆: true
  疎通確認: dev-docs のサーバーの再起動/疎通確認.sh
  実行: dev-docs のサーバーの再起動/実行.sh
  確認: dev-docs のサーバーの再起動/確認.sh
  切り戻し: null
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返却する
  確認方法: "稼働中の dev-docs のサーバーの管理の MCP の status（format: json）が、読み込みの後に 5 秒以内に loading: false を返す"
  状態: "-"
