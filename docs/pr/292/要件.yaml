use_cases:
  - kind: single
    scenario: docs/scenario/SC-155-7.yaml
    impact: none
    detail: 本文の文書の参照のリンクが、同じ値の要素の 2 つ目以降と辞書の項目の見出しへ飛ぶようになる。参照の流れは変わらない
    depends_on: []
scope_out:
  - item: '`[{値}#{順番}]` のリンクのアンカー（同じ見出しが並ぶとき、2 つ目以降の見出しのアンカーへ飛ばす）'
    reason: 要望は item_heading が見出しを返却することで、アンカーの区別は含まない。inline.py の heading_anchor は見出しの文字列だけからアンカーを作り、区別するには描画側（mdmark）が同じ見出しに連番を付けるかの調査が要る。今回の変更を前提にした後続として切り出す（reviewer の回答で確定）。起票する Issue には、2 つ目以降へのリンクが 1 つ目の同じ見出しへ飛ぶこと（変更前は文書の先頭へ飛んでいた）を記載する
    plan: '#294'
  - item: item_heading が、値が空の子・`x-hidden` の子（変換が見出しを出さない子）を指すパスにも見出しを返却する差
    reason: 名前のステップに以前からある差で、今回の要望（未対応の書き方を解く）に含まれない。辞書のキーのステップだけ揃えると名前のステップと扱いが分かれるため、両方をまとめて切り出す（reviewer の任意の指摘）
    plan: '#295'
