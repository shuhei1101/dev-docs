  - item: '`dev-docs migrate` が PUT `/settings/sources` の行の範囲の外の参照を `outsideRead` で送信する不具合と、API-155-1 の PUT の行のキーの修正'
    reason: 設定画面の保存は既に `outside_read` で送信しており、移し替えの不具合は別の Issue で修正する
    plan: '#203'
  - item: 稼働中の project-index のサーバーが `expectedVersion` を受け付けるバージョンかの確認と起動し直し
    reason: '#183 の反映作業の修正として別の Issue が持つ'
    plan: '#202'
  - item: project-index で丸ごとの保存と 1 行の追加の `expectedVersion` を必須に切り替える
    reason: '#190 の「着手の順番」で、この作業が develop へ入った後に project-index の側で起票すると決まっている。設定画面が送信する前に必須にすると今の画面が保存できなくなる'
    plan: to_file
  - item: E2E のテストの作成
    reason: E2E は開発の間は作らず、メジャーのリリースの前に作ると決まっている（#183 のスコープ外と同じ）
    plan: none
  - item: knowledge のスキーマ『共通』の `relations` の `from_column`・`to_column` の `x-used-by` の外部キーの向きが例と逆になっている（reviewer の対象外の逸脱の報告）
    reason: 今回の要望に含まれない。shuhei1101/knowledge の develop では `title`・`description` は [11150b1](https://github.com/shuhei1101/knowledge/commit/11150b1) で「元の列」「先の列」になったが、`x-used-by` の外部キーの向きが例（`er.schema.yaml`）と AI Monitor の ER 図の設計書と逆のまま残っている。dev-docs は例と設計書の向きで描く
    plan: shuhei1101/knowledge#385
