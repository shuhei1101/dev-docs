use_cases:
  - kind: single
    scenario: docs/scenario/SC-155-12.yaml
    impact: changed
    detail: 配信元の追加で、範囲の外から参考として参照できるかを選べる。設定画面を開いた後にほかのプロセスが端末の設定を書き換えていたときは、保存せずにそのことを利用者に示し、最新の一覧で保存し直させる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-155-11.yaml
    impact: changed
    detail: 配信の停止・削除の保存でも、ほかのプロセスの書き換えが入っていたときは保存せずに利用者に示す
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-155-7.yaml
    impact: changed
    detail: ER 図・状態遷移図を、テーブルの強調や遷移の再生の操作つきで参照できる。フロー図・データフロー・構成図・シーケンス図も同じ操作の図に変わる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-155-6.yaml
    impact: run_only
    detail: コメントを溜めて渡す手順は変わらないが、本文を描く mdmark のバージョンが変わる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-155-13.yaml
    impact: run_only
    detail: 配信元の文書を読み、配信元を追加・削除する流れは変わらないが、設定画面の保存と文書の図の描き方が変わる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-155-2.yaml
    impact: run_only
    detail: 入れる手順は変わらないが、開発の依存（package.json）の mdmark のバージョンが変わる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-155-10.yaml
    impact: none
    detail: 起動して project-index へつなぐ手順に関わらない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-155-3.yaml
    impact: none
    detail: 更新と端末の設定の移し替えに関わらない
    depends_on: []
