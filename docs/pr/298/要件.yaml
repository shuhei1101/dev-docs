use_cases:
  - kind: single
    scenario: docs/scenario/SC-155-7.yaml
    impact: none
    detail: 本文の文書の参照のリンクが、同じ見出しの 2 つ目以降へ飛び、画面に無い見出しのアンカーを付けなくなる。参照の流れは変わらない
    depends_on: []
scope_out:
  - item: 同じ文書のテーブルへの外部キーのセルのリンク（`render_table` が `anchors` の見出しから作るアンカー）で、テーブルの見出しと同じ文字の見出しが前にあるときの連番
    reason: 要望は文書の参照のリンクで、同じ文書の中の外部キーのリンクは含まない。今回の数え方を使用して修正できるため、今回の変更を前提にした後続にする（reviewer の回答で確定）
    plan: to_file
  - item: 見出しのアンカーの一覧が mdmark と同じ ID にならない本文の値の記載方法（setext の見出し・引用や箇条書きの中の見出し・脚注の定義の中の見出し・埋め込みの展開で入る見出しと、行内のコードなどの記法を含む見出しの文字）
    reason: 要望は変換が出す見出しの連番で、変換が出す見出しは全て ATX の見出しになる。mdmark と同じ数え方には markdown-it と同じ解析が要り、外部ライブラリの追加と PoC 検証になるため対応しない（reviewer の回答で確定）。この記載方法の見出しの後ろに同じ ID の見出しがあるときだけ、連番が 1 つずれる
    plan: none
