scope_out:
  - item: project-index のリポジトリの作成
    reason: ユーザーが作成し、立ち上げ Issue shuhei1101/project-index#2 で土台ができている（#114 のユーザーのコメント）
    plan: none
  - item: project-index のリポジトリへのコード・テスト・設計書の追加（移す先の受け入れ）
    reason: この作業 PR は dev-docs のリポジトリだけを変更できるため。規約『複数リポジトリのAPI契約』に沿って、提供する側の Issue を project-index へ起票した。#119 の修正とテストの移行と、所要時間の測り直しもその Issue に含めた
    plan: shuhei1101/project-index#14
  - item: project-index へ移した文書の置き場所・`id`・書き方の移行（#7・#74・#95 の内容を移した文書に当てる）
    reason: '#114 の扱いの判断で、この作業 PR に含めず project-index へ起票すると決まった。移す文書の範囲が設計で決まってから起票する'
    plan: to_file
  - item: alias-inject の設計書・公開ドキュメント・`settings.sample.yaml`・コメントの例のファイル名の修正
    reason: 別のリポジトリのため。#114 の扱いの判断で、先後を固定せず alias-inject へ起票すると決まった
    plan: shuhei1101/alias-inject#74
  - item: dev-docs 自身の直下の配信元の設定（project-index.yaml）の作成
    reason: '#24 が担当する（#114 の扱いの判断で #24 が project-index.yaml を作る内容に書き直された）'
    plan: '#24'
  - item: dev-docs の画面のサーバーの付け替え口を、モックから本物の project-index の API へつなぐ作業と、複合ユースケースの E2E
    reason: 規約『複数リポジトリのAPI契約』で、本物につなぐ作業は別の Issue にする。この作業 PR は project-index#14 の入出力に沿ったモックで作る
    plan: '#164'
