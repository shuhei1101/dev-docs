use_cases:
  - kind: composite
    scenario: docs/scenario/SC-155-13.yaml
    impact: changed
    detail: 文書を MCP で読み書きするには project-index を入れ、画面で読むには dev-docs を入れる流れに変わる。配信元の設定の既定の名前が project-index.yaml になる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-155-2.yaml
    impact: changed
    detail: 検索の MCP を使う端末は project-index を別に入れる。画面を使う端末だけ dev-docs を入れる
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-3.yaml
    impact: changed
    detail: 更新と端末の設定の移し替えが、画面の側と索引の側の 2 つに分かれる
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-4.yaml
    impact: removed
    detail: エージェントが書き込む流れは project-index が持ち、dev-docs から外す
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-5.yaml
    impact: removed
    detail: エージェントが調べる流れは project-index が持ち、dev-docs から外す
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-8.yaml
    impact: changed
    detail: 変更のレビューのうち、エージェントが変わった文書を引く流れは project-index が持ち、画面で差分を見る流れだけが残る
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-1.yaml
    impact: changed
    detail: 直接編集した文書の読み直しは project-index が行い、画面はその結果を表示する
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-9.yaml
    impact: changed
    detail: 配信元の設定・スクリプトの確認と反映は project-index が行い、既定の名前が project-index.yaml になる
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-10.yaml
    impact: changed
    detail: 画面のサーバーの起動は、project-index から配信元を読む前提に変わる
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-11.yaml
    impact: following
    detail: 配信元を外す操作で書き換える配信元の一覧を、project-index と共有するものに追随する
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-12.yaml
    impact: changed
    detail: 配信元を追加するときに作る設定の既定の名前が project-index.yaml になり、追加した配信元を project-index と共有する
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-7.yaml
    impact: run_only
    detail: 画面で読む流れは変わらないが、文書の取得元が project-index に変わるため壊れうる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-155-6.yaml
    impact: run_only
    detail: コメントを渡す流れは変わらないが、本文の取得元が変わるため壊れうる
    depends_on: []
