use_cases:
  - kind: composite
    scenario: docs/scenario/SC-155-13.yaml
    impact: changed
    detail: 利用者が project-index で配信している配信元の文書を dev-docs の画面で読む流れに変わる。エージェントが調べる・書き込む・変わった文書を引く・設定とスクリプトを確かめる段は project-index へ移る
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-155-2.yaml
    impact: changed
    detail: 検索の MCP を使う端末は project-index を別に入れる。画面を使う端末だけ dev-docs を入れる
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-3.yaml
    impact: changed
    detail: 配信元の設定の移し替えは project-index へ移る。端末の設定の sources を project-index へ写して除く移し替えが加わる
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-4.yaml
    impact: removed
    detail: エージェントが書き込む流れは project-index が持ち、dev-docs から外す
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-5.yaml
    impact: removed
    detail: エージェントが調べる流れは project-index が持ち、dev-docs から外す
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-8.yaml
    impact: removed
    detail: エージェントが変わった文書を引く流れは project-index が持ち、dev-docs から除外する。画面で差分を見る流れは利用者が画面で読む（SC-155-7）が持つ
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-1.yaml
    impact: removed
    detail: 直接編集した文書の読み直しと、読んだ後に変わった文書への書き込みは project-index が持ち、dev-docs から除外する
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-9.yaml
    impact: removed
    detail: 配信元の設定・スクリプトの確認と反映は project-index が持ち、dev-docs から除外する
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-10.yaml
    impact: changed
    detail: 画面のサーバーの起動は project-index へつなぐだけになり、配信元ごとの起動時の検証と文脈の注入は project-index へ移る。project-index につながらないときの振る舞いが加わる
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-11.yaml
    impact: following
    detail: 配信元を外す操作を、project-index の端末の設定の配信元の API で保存する流れに追随する
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-12.yaml
    impact: changed
    detail: 配信元の追加は設定画面だけになり、project-index の端末の設定へ保存する。`/dev-docs:setup` での登録と管理用の YAML の突き合わせは project-index へ移る
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-7.yaml
    impact: changed
    detail: 画面で読む・差分を見る・検索する流れは変わらないが、文書の取得元が project-index になり、配信元の設定の名前が project-index.yaml になる
    depends_on:
      - docs/scenario/SC-155-13.yaml
  - kind: single
    scenario: docs/scenario/SC-155-6.yaml
    impact: following
    detail: コメントを渡す流れは変わらず、配信元の設定の名前を project-index.yaml に追随する
    depends_on:
      - docs/scenario/SC-155-13.yaml
