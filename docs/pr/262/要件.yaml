scope_out:
  - item: nav の auto.group_by で共通のメタデータ（main_tags など）を指定してグループに分けること
    reason: auto.filter の不具合とは別の機能追加で、要望に含まれない
    plan: '#251'
  - item: 起動直後の配信元の一覧で、読み込み中の配信元を表示すること（include_loading）
    reason: 配信元を開いた後の文書の表示ではなく、配信元の一覧の対応で、要望に含まれない
    plan: '#250'
  - item: mdmark 側の Mermaid の click の描画の修正
    reason: '#255 の調査で、mdmark の develop（730b1a5）の map のクラス図（renderMapClassDiagram）が links を参照せず、click のクラスを <a> にしないことを確認した（#570 の退行）。mdmark の中の修正なので、この作業 PR では修正せず、テストの前提も変えない'
    plan: shuhei1101/mdmark#650
  - item: project-index の配信元の検査（nav_warnings の check_nav_filters）が、行の metadata で対応付けたキー（category）を知らない項目として警告すること
    reason: project-index の develop で knowledge-files のスキーマと category の条件を当てると「知らない項目です（category）」を返した。別のリポジトリの修正で、この作業 PR がマージされなくても同じ内容で成り立つ
    plan: shuhei1101/project-index#146
  - item: 起動の直後に配信元の文書の一覧が、全ての配信元のリビジョンの書き出しを待つこと（#225 の 1 回目の表示）
    reason: 計測で、project-index の起動から約 90 秒、リビジョンの書き出しが続く間に文書の一覧が 30〜45 秒以上待たされた。project-index の中の修正で、dev-docs の側に原因は無い
    plan: shuhei1101/project-index#145
