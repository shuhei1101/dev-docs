scope_out:
  - item: YAML の設計書（scenario・interface・module など）への `tags` の付与と project-index.yaml の `metadata` の追加
    reason: 設計書のスキーマに `tags` を取り込む配布物の追従（#224）の後に、種類ごとに主題を決めて付ける別の行がある。この PR のタグの付け直しは、`tags` を持つ文書（files.yml・判定フローチャート）に限る
    plan: '#172'
  - item: docs/pr/ の PR ドキュメントの Mermaid・文
    reason: 過去の作業 PR の記録で、毎回の作業の前提にならない。書き換えると当時の記録が変わる
    plan: none
  - item: docs/mock/ のモック HTML
    reason: 画面の試作で、図・表・文の表し方の対象にならない
    plan: none
  - item: schemas/ の `mermaid` のキーの説明と、src/・tests/ の Mermaid の文字列
    reason: スキーマは AI Monitor の配布物で、src/・tests/ は変換のコードとその入力。文書の中身ではない
    plan: none
  - item: rules.yaml から古い規約（markdown マーメイド・判定フローチャート）を除外する
    reason: 'develop の rules.yaml は `rules: []` で、除外する行が無い'
    plan: none
  - item: 管理用の YAML のコード・テストの行への設計書への `related`（`implements`・`tests`）
    reason: 配信元の設定へコード・テストの行を新設する別の作業で、文書の書き方の移行とは目的が違う（レビューで案 A に決定）
    plan: '#252'
  - item: リポジトリの直下の README.md・CLAUDE.md
    reason: Issue の範囲は docs/ の文書で、直下の 2 つは配信元の文書ではない
    plan: none
  - item: 画面の文言・content/prompts/ の文言・文言を参照するテストの AI slop
    reason: '#93 に残した範囲（#93 は完了済み）'
    plan: none
  - item: シナリオ・項目・テスト（`test_cases[].name`）の名前と、画面の文言（`label`）に残る対応表の単語（`利用者がコメントを渡す`・`差分を見る`・`配信元を外す` など）
    reason: 名前は E2E のテストのファイル名・テストのコメント・他の文書の参照のキー（`#scenarios[…]`）と対になり、画面の文言は画面の実装・テストと対になる。この PR はコードとテストを変えない
    plan: '#253'
  - item: ガイドのファイル名・タイトル（`画面で読む.md`・`dev-docsを入れる.md`）の対応表の単語
    reason: 改名すると files.yml・目次・リンク・公開ページのパスが変わる。文書の書き方の移行とは別の作業
    plan: '#253'
  - item: 版の新旧の比較の「新しい」「古い」、定着した語の「読み書き」「読み上げ」「見た目」
    reason: 対応表の置き換え先（新規・要更新）では比較の意味にならず、定着した語は言い換えると意味が変わる
    plan: none
  - item: コードのコメントが指す設計書の項目名（`ポートの確かめ`・`当たるフォルダの数`）の改名
    reason: src/ のコメントが同じ名前で指しており、改名するとコードとずれる。この PR はコードを変えない
    plan: '#253'
  - item: ガイド（files.yml）のタグの `main` と `action:` のタグ
    reason: files.yml のスキーマは `tags` を文字列の配列で持ち、`topic`・`tool` だけを入れると定めている。今のタグはその定めに沿っている
    plan: none
