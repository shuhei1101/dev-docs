scope_out:
  - item: YAML の設計書（scenario・interface・module など）への `tags` の付与と project-index.yaml の `metadata` の追加
    reason: 設計書のスキーマに `tags` を取り込む配布物の追従（#224）の後に、種類ごとに主題を決めて付ける別の行がある。この PR のタグの付け直しは、`tags` を持つ文書（files.yml・判定フローチャート）に限る
    plan: '#172'
  - item: docs/pr/ の PR ドキュメントの Mermaid・文
    reason: 過去の作業 PR の記録で、毎回の作業の前提にならない。書き換えると当時の記録が変わる
    plan: none
  - item: docs/mock/ のモック HTML
    reason: 画面の試作で、図・表・文の表し方の対象にならない
    plan: none
  - item: schemas/ の `mermaid` のキーの説明と、src/・tests/ の Mermaid の文字列
    reason: スキーマは AI Monitor の配布物で、src/・tests/ は変換のコードとその入力。文書の中身ではない
    plan: none
  - item: rules.yaml から古い規約（markdown マーメイド・判定フローチャート）を除外する
    reason: 'develop の rules.yaml は `rules: []` で、除外する行が無い'
    plan: none
  - item: 管理用の YAML のコード・テストの行への設計書への `related`（`implements`・`tests`）
    reason: 未確定。今の project-index.yaml はコード・テストの行を持たず（files の行は _root・guide・mock だけ）、関連を張るには配信元の設定へコードの行を新設する別の作業が要る。この PR は既存の文書の書き方の移行に絞る判断で、レビューで確定する
    plan: to_file
  - item: リポジトリの直下の README.md・CLAUDE.md
    reason: Issue の範囲は docs/ の文書で、直下の 2 つは配信元の文書ではない
    plan: none
  - item: 画面の文言・content/prompts/ の文言・文言を参照するテストの AI slop
    reason: '#93 に残した範囲（#93 は完了済み）'
    plan: none
