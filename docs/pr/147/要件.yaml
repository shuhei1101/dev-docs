  - item: 設計書の地の文で、フックの案内の中身を指さない `返し済みの記録`（サーバーの記録の名前。インターフェース定義『セッションの開始』『文書の検索』など）と、単一ユースケース『起動する』・複合ユースケース『dev-docsで文書を配信して読み書きする』の利用者の操作の `/mcp でつなぎ直す`
    reason: '`docs/`・`dev/` の文書の修正は #95 の範囲。本 PR は修正する文言を引用する、または文言の中身を指す項目だけを修正する'
    plan: '#95'
  - item: '`docs/リファレンス/文書のMCP.md` の `repeat_seen: true で取り直せます。`'
    reason: 'フックではなく MCP の取得済みの文書の説明で、`docs/` の地の文の修正は #95 の範囲'
    plan: '#95'
