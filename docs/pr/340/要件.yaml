use_cases:
  - kind: single
    scenario: docs/scenario/SC-155-7.yaml
    impact: changed
    detail: 検索で結果を全件スクロールして参照し、開いている配信元か全ての配信元かを選んで探し、結果の並び順の根拠が分かる。差分の案内・サイドバー・画面のスクロールの振る舞いを保つ
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-155-13.yaml
    impact: following
    detail: 文書の画面の参照の中の検索が、配信元を横断して探せるようになることに追随する
    depends_on:
      - docs/scenario/SC-155-7.yaml
  - kind: single
    scenario: docs/scenario/SC-155-14.yaml
    impact: run_only
    detail: メタデータの画面の骨格の高さを修正する場合に、表の参照とスクロールを壊さないことを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-155-12.yaml
    impact: run_only
    detail: 設定画面の骨格の高さを修正する場合に、配信元の追加の流れを壊さないことを確かめる
    depends_on: []
