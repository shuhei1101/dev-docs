    test: test_error_when_whole_file_unparsable
  - name: 異常系（本文の変更が検査に合格しない・422）
    summary: ファイル全体の変更の検査の違反を、変更の `key` と項目のパスで返却する
    setup:
      - name: Mock
        description: なし（正常系と同じテストの中で起動した project-index）
      - name: 配信元
        description: 正常系（文書の本文の変更）と同じ sample
      - name: 入力
        description: 'n1 の `@file` でスキーマの必須の項目 `summary` を削除した YAML（合格しない）と、`guide.md` の `@file`（合格する）と `dryRun: true`'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as POST /_api/sources/{source}/commits
        participant PI as project-index

        C->>E: edits（n1・guide.md の @file）, dryRun: true
        E->>PI: POST /sources/sample/commits（dryRun）
        PI-->>E: 422（writes[0] の違反）
        E-->>C: 422（n1 の key と違反）
      ```

      <!-- /map -->
    expected:
      - 422 で、`errors` に n1 の変更の `key` と `path` の `summary` がある
      - '`guide.md` の変更の `key` は `errors` に無い'
      - リモートとワークツリーが変わらない
    test: test_error_when_document_body_invalid
  - name: 異常系（同じ文書のファイル全体と項目の変更が並ぶ・400）
    summary: 同じ文書の `@file` と項目のパスの変更が並ぶ要求を、project-index へ送信せずに断る
    setup:
      - name: Mock
        description: 受けた要求を記録する project-index の書き込みの API のモック
      - name: 入力
        description: n1 の `@file` の変更と、n1 の `summary` の変更と `message`
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as POST /_api/sources/{source}/commits

        C->>E: edits（n1 の @file・n1 の summary）, message
        E->>E: 同じ文書の @file と項目の変更が並ぶ
        E-->>C: 400 problem+json（errors[]）
      ```

      <!-- /map -->
    expected:
      - 400 で、`errors` に n1 の `@file` の変更の `key` と `summary` の変更の `key` がある
      - モックが要求を受けていない
    test: test_error_when_whole_file_and_item_edits_mixed
