id: IF-155-29
title: 編集中の変更の直コミット
lead: 画面の編集中の変更（メタデータの行と文書の本文）を配信元ごとに受け、修正できるキーを確認した書き込みと削除にして project-index の書き込みの API へ 1 回で送信し、変更ごとの差分・結果か理由を返却する直コミットの入出力を定め、直コミットを修正するときに参照する。
entry:
  kind: endpoint
  value: POST `/_api/sources/{source}/commits`
identifier: post_commits
permissions: 画面と同じオリジンからの要求だけ
idempotent: false
side_effects: 'project-index の書き込みの API へ書き込みと削除を送信する。`dryRun: false` で合格すると、project-index が 1 つのコミットにして配信元のリモートへプッシュする。dev-docs は配信元のファイルを書き換えない'
exclusivity: dev-docs は排他しない。直コミットどうしの排他は project-index が持つ
callers:
  - SC-155-15#scenarios[正常シナリオ]
  - SC-155-15#scenarios[異常シナリオ（検査に合格しない）]
  - SC-155-15#scenarios[異常シナリオ（直コミットを許可していない）]
  - SC-155-15#scenarios[異常シナリオ（リモートに接続できない）]
  - SC-155-15#scenarios[正常シナリオ（同じ文書の別の項目が変わっている）]
  - SC-155-15#scenarios[正常シナリオ（衝突したら修正をブランチに残す）]
  - SC-155-15#scenarios[正常シナリオ（衝突してスクリプトの指定が無い）]
  - SC-155-15#scenarios[異常シナリオ（衝突してスクリプトが失敗する）]
  - SC-155-15#scenarios[異常シナリオ（編集を始めたときのコミットが使用できない）]
  - SC-155-15#scenarios[正常シナリオ（文書の画面で本文を編集する）]
  - SC-155-15#scenarios[異常シナリオ（本文の変更が検査に合格しない）]
  - SC-155-15#scenarios[正常シナリオ（ファイル全体の編集の後に同じ文書の別の項目が変わっている）]
request:
  - name: source
    type: str
    required: true
    location: path
    description: 配信元の ID
  - name: edits
    type: list[Edit]
    required: true
    location: body
    description: 編集中の変更の並び
    constraints: 1 件以上。`key` は重複しない
  - name: edits[].key
    type: str
    required: true
    location: body
    description: 画面が振った変更の識別子。応答の `results[].key`・`errors[].key` で同じ値を返却する
  - name: edits[].kind
    type: Literal['terms', 'aliases', 'tags', 'rules', 'files', 'body']
    required: true
    location: body
    description: メタデータの種類（メタデータの取得の `kinds[].id`。`config` は修正できない）か、文書の本文の `body`
  - name: edits[].op
    type: Literal['update', 'add', 'delete']
    required: true
    location: body
    description: 行の修正・追加・削除
    constraints: '`add`・`delete` は `kind` が `terms`・`rules` のときだけ。`body` は `update` だけ'
  - name: edits[].docId
    type: str
    required: true
    location: body
    description: 対象の文書の ID。`add` は新しい文書の ID
  - name: edits[].docKind
    type: str
    required: true
    location: body
    default: なし（`update`・`delete` は使用しない）
    description: '対象の文書の種類（`documents[].id`）。`update`・`delete` はメタデータの取得の `rows[].docKind`、`add` は `kinds[].createKind`、`body` は文書の取得の `edit.kind`'
    notes: '列と文書のキーの対応を引く種類と、403 の `kinds` を変更の `key` へ戻すのに使用する。取り違えた種類は project-index の検査と `expected_version` の照合で断られる'
  - name: edits[].expectedVersion
    type: str | None
    required: false
    location: body
    default: なし（`add` は使用しない）
    description: 取得した文書のバージョン（メタデータの取得の `rows[].version`。`body` は文書の取得の `edit.version`）
    notes: '`update`・`delete` のときは必須'
  - name: edits[].values
    type: dict[str, str | list[str] | list[dict[str, str]]]
    required: false
    location: body
    default: '`{}`'
    description: 修正後の値。キーはメタデータの取得の `columns[].key` で、`columns[].type` が `list` の列は文字列の配列にする。`body` はキーが項目のパス（文書の取得の `edit.blocks[].path`・`edit.titleBlock.path`）か、ファイル全体の `@file` で、`table` の項目は行の配列にする
    constraints: '制約「修正できるキー」のキーだけ。`@file` はほかのキーと並べず、同じ `docId` のほかの `body` の変更とも同じ要求に並べない'
  - name: message
    type: str
    required: false
    location: body
    default: 'なし（`dryRun: true` のときは使用せず、project-index へは固定の説明 `差分確認` を送信する）'
    description: コミットの説明
    notes: '`dryRun: false` のときは必須で、空にできない'
  - name: dryRun
    type: bool
    required: false
    location: body
    default: '`false`'
    description: '`true` のとき、検査と差分だけを返却し、コミット・プッシュしない'
  - name: Origin
    type: str
    required: false
    location: header
    default: なし（`Sec-Fetch-Site` で判定する）
    description: 要求元のオリジン
  - name: baseCommit
    type: str
    required: true
    location: body
    description: 編集を始めたときの既定のブランチのコミット（メタデータの取得の `baseCommit` か文書の取得の `edit.baseCommit`）
    constraints: 7〜40 桁の 16 進数
    notes: 画面は配信元ごとに、編集中の変更の最初の 1 件を追加したときの値を 1 つ記録して送信する
  - name: edits[].docPath
    type: str | None
    required: false
    location: body
    default: なし（`add`・`delete` は使用しない）
    description: 対象の文書のパス（メタデータの取得の `rows[].docPath`。`body` は文書の取得の `edit.filePath`）
    notes: '`update` のときは必須。編集を始めたときの項目ごとのバージョンを取得する文書の取得に使用する'
request_example: |-
  ```json
  {"edits": [{"key": "tags:n1:update", "kind": "tags", "op": "update", "docId": "n1", "docKind": "note", "expectedVersion": "c3d4e5", "values": {"tags": ["topic:a", "topic:b"]}}, {"key": "terms:kind:add", "kind": "terms", "op": "add", "docId": "kind", "docKind": "terms", "values": {"name": "種類", "description": "文書の行の ID"}}, {"key": "terms:old-name:delete", "kind": "terms", "op": "delete", "docId": "old-name", "docKind": "terms", "expectedVersion": "b2c3d4"}], "message": "用語とタグを追加する"}
  ```
response:
  - name: applied
    type: bool
    description: 'コミット・プッシュしたか（`dryRun: true` のときは `false`）'
  - name: results[].key
    type: str
    description: 変更の識別子（要求の `edits[].key`）
  - name: results[].status
    type: Literal['created', 'updated', 'deleted']
    description: 変更の結果
  - name: results[].version
    type: str | None
    description: 書き込んだ後の文書のバージョン（削除は `null`）
  - name: results[].diff
    type: str
    description: 変更の差分
  - name: commit.sha
    type: str
    description: プッシュしたコミットの SHA
    notes: '`dryRun: true` のときは `commit` が `null`'
  - name: commit.branch
    type: str
    description: コミットしたブランチ
  - name: conflict
    type: Conflict | None
    description: '衝突して修正をブランチに残したとき（`dryRun: true` は残すことになるとき）の結果。衝突しなかったときは `null`'
  - name: conflict.branch
    type: str | None
    description: '修正を残したブランチの名前（`project-index/conflict/{YYYYMMDD-HHMMSS}-{コミットの 7 桁}`。`dryRun: true` は `null`）'
  - name: conflict.baseCommit
    type: str
    description: ブランチの起点にした編集を始めたときのコミット（40 桁）
  - name: conflict.reasons[].key
    type: str | None
    description: 今のブランチで断られた変更の識別子（要求の `edits[].key`）。本文全体の理由は `null`
  - name: conflict.reasons[].reason
    type: str
    description: 今のブランチで断られた理由
  - name: conflict.script
    type: ConflictScript | None
    description: '衝突したときのスクリプトの結果。端末の設定に `on_conflict` が無いときと `dryRun: true` のときは `null`'
  - name: conflict.script.exitCode
    type: int | None
    description: 終了コード（制限時間で止めたときは `null`）
  - name: conflict.script.timedOut
    type: bool
    description: 制限時間で止めたか
  - name: conflict.script.prUrl
    type: str | None
    description: 標準出力の空でない最後の行が `https://` で始まるときのその行（PR の URL）。無ければ `null`
  - name: conflict.script.stderr
    type: str
    description: 標準エラー出力の末尾（project-index が返却したまま）
response_example: |-
  ```json
  {"applied": true, "results": [{"key": "tags:n1:update", "status": "updated", "version": "d4e5f6", "diff": "-   - topic:a\n+   - topic:a\n+   - topic:b"}], "commit": {"sha": "0a1b2c3", "branch": "develop"}}
  ```
status_codes:
  - code: '200'
    condition: 'コミット・プッシュした、衝突して修正をブランチに残した（`conflict` を入れる）、または `dryRun: true` で検査に合格した'
  - code: '400'
    condition: '本文の型の検証に通らない（`edits` が空・`key` の重複・`op` と `kind` の組み合わせ・必須の欠け・修正できないキー・元のキーへ戻せない列・YAML として読み込めない `@file`・同じ文書の `@file` とほかの `body` の変更が並ぶ要求・`dryRun: false` で `message` が空）'
    notes: project-index へ送信しない。`errors[]` に `{key, path, reason}`（`key` は該当する変更、本文全体の違反は `null`）
  - code: '403'
    condition: 別のオリジンの要求、または project-index が直コミットを許可していない種類があると返却した（`DirectCommitNotPermittedError`）
    notes: 許可していない種類の文書を書き換える変更ごとに `errors[]` に `{key, reason}` と、許可を記載するキー `sources[].direct_commit.write_api_kinds` を `nextSteps` に入れる
  - code: '404'
    condition: 配信元が無い・配信していない、修正・削除する文書が無い（project-index の 404）
    notes: 文書が無いときは該当する変更の `errors[]` に入れる
  - code: '409'
    condition: project-index が編集を始めたときのコミットが起点に使用できない（`BaseCommitUnusableError`）・ワークツリーに未コミットの変更がある・プッシュが断られたなどと返却した
    notes: '`BaseCommitUnusableError` は `title` を `BaseCommitUnusableError` にし、`detail` に project-index の理由（`not_found`・`not_ancestor`）を入れる。どれも `errors[]` を持たない。`baseCommit` を送信するため、文書のバージョンが合わないときは衝突として 200 で返る'
  - code: '422'
    condition: project-index の検査に合格しない（`ValidationFailedError`）
    notes: project-index の `errors[]` の `writes`・`deletes` の別と添字を変更の `key` に対応させ、`errors[]` に `{key, path, reason}` で並べる
  - code: '502'
    condition: project-index がリモートからの取得・プッシュに失敗した（502）、生成に失敗した（500）、想定しない応答を返却した
    notes: project-index のステータスと `detail` を `detail` に入れる
  - code: '503'
    condition: project-index につながらない
    notes: つながらなかった project-index のアドレスと理由（`projectIndex.address`・`projectIndex.reason`）
  - code: '504'
    condition: project-index が書き込みの期限を過ぎた（504）、または待ちの上限で打ち切った
    notes: 打ち切ったときは、コミットされたかが分からないことを `detail` に入れ、メタデータの再読み込みを `nextSteps` に入れる
error_format: RFC 9457 の `application/problem+json`（`type`・`title`・`status`・`detail`）。拡張メンバーは camelCase（`nextSteps`・`errors[]`・`projectIndex`）。変更ごとの理由は `errors[]` に `{key, path, reason, current}`（`path`・`current` は該当するときだけ）
constraints:
  - item: オリジンの確認
    constraint: 端末の設定の保存と同じく、画面と別のオリジンの要求を 403 で断る
  - item: 修正できるキー
    constraint: 'メタデータの種類は、メタデータの取得で `editable: true` の列（IF-155-28 の制約「列と文書のキーの対応」で元のキーへ戻せる列）だけ。`body` は、文書の取得が `edit` を返却する文書（IF-155-10 の制約「本文を編集できる文書」）の、`edit.blocks[].path`・`edit.titleBlock.path` か `@file` だけ。ほかのキーは 400 で断り、project-index へ送信しない'
  - item: 書き込みと削除への変換
    constraint: '列のキーは共通のキー（IF-155-28 の制約「列と文書のキーの対応」）のまま、値も画面が送信したまま書き込みの操作に入れる。project-index の書き込みの API が、配信元の設定の行の `metadata` の対応で文書の実際のキーへ戻す（`{キー}[].{項目}` の列は、名前の配列から、残る要素の `main` などほかの項目を保った配列にする）。dev-docs は元のキーへ戻せる列かだけを確認し、戻せない列（入れ子のパス・絞り込み）は送信せずに 400 にする。`update` は `write_docs` の `update` 操作（`id`・`expected_version`・`set` に組み立てた最上位のキー）、`add` は `create` 操作（`id`・`kind`・`data`）、`delete` は `deletes[]`（`id`・`expectedVersion`）にし、`edits` の並び順で `writes`・`deletes` に入れる。`body` の変更は、項目のパスのキーを項目のパスのまま `update` 操作の `set` に入れ（`table` の項目は行の配列）、YAML の文書の `@file` は書き換えた YAML を読み込んだ値を `replace` 操作（`id`・`expected_version`・`data`）にし、Markdown の文書の `@file` は `update` 操作の `set` の `@body` にする。YAML として読み込めない `@file` は送信せずに 400（`path` が `@file`、`reason` に行と列）にする'
  - item: project-index への送信
    constraint: '`POST /sources/{source}/commits` を `Origin` を付けずに 1 回だけ呼ぶ。`writes`・`deletes`・`message`・`dryRun`・`baseCommit` を送信し、`branch`・`onReferenced` は送信しない（既定のブランチ・`fail`）'
  - item: 書き込みの API の待ち
    constraint: project-index の書き込みの API の応答を待つ上限で打ち切り、504 を返却する
    decided_by: NFR-155-1#requirements[project-index の書き込みの API の待ち]
  - item: 認可
    constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）。直コミットの許可は project-index が判定する
  - item: JSON のキー
    constraint: 要求と応答のキーは camelCase。`values` の中のキーはメタデータの取得の `columns[].key` のまま（`body` は項目のパスか `@file`）
  - item: operationId
    constraint: '`{tag}-{関数名}` の `metadata-post_commits`'
  - item: ログ
    constraint: 送信ごとに、配信元の ID・`dryRun`・変更の件数・project-index の状態コード・コミットの SHA（待ちの上限で打ち切ったときはその旨）を 1 行のログに出力する。値の中身とコミットの説明は出力しない
  - item: 項目ごとのバージョン
    constraint: '`update` の変更ごとに、project-index の文書の取得（`GET /sources/{source}/docs/{docPath}?ref={baseCommit}&id={docId}`）で編集を始めたときの `itemVersions` を取得し、`set` に組み立てた列が戻る文書の最上位のキー（制約「書き込みと削除への変換」の対応で戻したキー）だけのバージョンの辞書を `expected_version` にする。そのキーのどれかが `itemVersions` に無い変更（編集を始めたときの文書に無い項目を加える）は、辞書ではなく要求の `expectedVersion`（文書の全体のバージョン）を送信する（空の辞書は project-index の照合で常に一致し、ほかの変更が同じ項目を加えていても衝突にならないため）。`body` の項目のパスの変更は、項目のパスの最上位のキー（`#items[i1].body` は `items`）のバージョンの辞書にし、`@file` は要求の `expectedVersion`（文書の全体のバージョン）を送信する。`delete` は `expectedVersion`（文書の全体のバージョン）のまま、`add` は使用しない'
    notes: 文書の取得が 404 の変更は、project-index へ送信せずに 404 の `errors[]` に入れる
    decided_by: NFR-155-1#requirements[project-index への問い合わせの制限時間]
  - item: 衝突の結果への変換
    constraint: project-index の応答の `conflict` を、`errors[]` の `writes`・`deletes` の別と添字（`path` が文書の ID のときはその文書を変える変更）を変更の `key` に対応させた `reasons[]` と、`script.stdout` から取り出した `prUrl` にして返却する。`conflict.commit` と `script.stdout` は返却しない
flows:
  - name: 正常系
    summary: 変更を 1 つのコミットにしてプッシュし、変更ごとの結果とコミットを返却する
    setup:
      - name: Mock
        description: テストの中で起動した project-index（一時フォルダの端末の設定を `PROJECT_INDEX_CONFIG` で指し、空きポートで子プロセスとして起動する）。リモートは一時フォルダのベアリポジトリ。dev-docs のアプリを HTTP のテストのクライアントで呼ぶ
      - name: 配信元
        description: '用語集の種類 `terms` と文書の種類 `note` を持つ git の配信元。`direct_commit` は `branch: develop`・`kinds: [note, terms]`、端末の設定の行は `direct_commit.write_api_kinds: [note, terms]`'
        notes: id `sample`。タグ `topic:a` の文書 n1、用語 `source`・`old-name`
      - name: 入力
        description: 画面と同じ `Origin` で、n1 のタグの `update`・用語 `kind` の `add`・用語 `old-name` の `delete` と `message`
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as POST /_api/sources/{source}/commits
        participant PI as project-index

        C->>E: edits（update・add・delete）, message
        E->>E: オリジンと修正できるキーを確認し、writes・deletes にする
        E->>PI: POST /sources/sample/commits
        PI-->>E: 200 applied, results, commit
        E-->>C: 200 変更ごとの結果とコミット
      ```

      <!-- /map -->
    expected:
      - 200 で `applied` が `true`、`results` に 3 件の変更の `key` と `updated`・`created`・`deleted` がある
      - リモートの `develop` に 1 コミットだけ増え、`commit.sha` と一致し、コミットの説明が `message`
      - n1 のタグが `topic:a`・`topic:b`、用語集に `kind` があり `old-name` が無い
    test: test_normal
  - name: 正常系（差分確認）
    summary: '`dryRun: true` は差分だけを返却し、コミットしない'
    setup:
      - name: Mock
        description: なし（テストの中で起動した project-index）
      - name: 入力
        description: '正常系と同じ `edits` に `dryRun: true`（`message` なし）'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as POST /_api/sources/{source}/commits
        participant PI as project-index

        C->>E: edits, dryRun: true
        E->>PI: POST /sources/sample/commits（dryRun）
        PI-->>E: 200 applied: false, results
        E-->>C: 200 変更ごとの差分
      ```

      <!-- /map -->
    expected:
      - 200 で `applied` が `false`、`commit` が `null`、`results` に 3 件の変更の `key` があり、`update`・`add` の `diff` が空でない（削除の `diff` は project-index が返却しない）
      - リモートとワークツリーが変わらない
    test: test_normal_when_dry_run
  - name: 異常系（別のオリジン・403）
    summary: 画面と別のオリジンからの要求を断る
    setup:
      - name: Mock
        description: なし（テストの中で起動した project-index）
      - name: 入力
        description: '`Origin: http://127.0.0.1:9999` で、正常系と同じ本文'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as POST /_api/sources/{source}/commits

        C->>E: Origin: 別のオリジン
