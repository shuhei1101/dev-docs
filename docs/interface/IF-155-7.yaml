id: IF-155-7
title: "再起動"
entry:
  kind: mcp_tool
  value: restart
flows:
  - name: 正常系
    summary: 応答を返した後に起動し直し、同じプロセス ID で待ち受ける
    setup:
      - name: Mock
        description: project-index の読み取り API のモック（sample を配信中として返す）。一時フォルダの端末の設定で `dev-docs serve` を子プロセスとして起動する
      - name: 端末の設定
        description: '`project_index` にモックのアドレス'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as restart
        participant S as dev-docs serve

        C->>T: 引数なし
        T-->>C: pid・restarting
        T->>S: 処理中の要求を待って止める
        S->>S: 同じプロセスで起動し直す
        C->>S: status
        S-->>C: 待ち受けのアドレス・配信元
      ```
    expected:
      - 応答の `pid` が子プロセスの PID と同じ
      - '`/_admin/mcp` の接続を張ったまま `restart` を呼んでも、起動し直した子プロセスがポートの確かめで止まらず待ち受ける'
      - 起動し直した後の `status` の `pid` が同じで、sample が `serving`
      - 起動し直した後に `/_admin/mcp` を張り直すと呼べる
    test: test_normal
  - name: 異常系（再起動の途中で呼ばれる・RestartInProgressError）
    summary: 停止を待っている間に 2 回目の `restart` を呼ぶと断る
    setup:
      - name: Mock
        description: なし
      - name: 処理中の要求
        description: 応答を返さずに待つ project-index の読み取り API のモックを `project_index` に向け、文書の取得を呼んでおく
        notes: 停止の待ちを長くするため
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as restart

        C->>T: 1 回目
        T-->>C: restarting
        C->>T: 2 回目
        T-->>C: isError（RestartInProgressError）
      ```
    expected:
      - '2 回目が `isError: true` で再起動の途中であることを返す'
      - 起動し直すのは 1 回だけ（ログの起動の行が 1 つ増える）
    test: test_error_when_restart_in_progress
lead: 応答を返してからサーバーを止め、同じプロセス ID・同じ環境変数で `dev-docs serve` を起動し直す。
identifier: restart
permissions: なし（`127.0.0.1` でだけ待ち受ける）
idempotent: false
side_effects: 待ち受けを止めて起動し直す。`/_admin/mcp` の接続は切れる
callers:
  - SC-155-3#scenarios[正常シナリオ（端末の設定が古くなる）]
exclusivity: 再起動を始めた後の呼び出しは `RestartInProgressError` で断る
request: []
request_example: |-
  ```json
  {}
  ```
response:
  - name: pid
    type: int
    description: 起動し直した後も変わらないプロセス ID
  - name: restarting
    type: bool
    description: 常に `true`
response_example: |-
  ```json
  {"pid": 4242, "restarting": true}
  ```
response_notes: 応答を返し終えてから停止を始める。再起動の結果は、つなぎ直した後の `status` で確かめる。
exceptions:
  - name: なし（正常終了）
    condition: 再起動を始めた
  - name: RestartInProgressError
    condition: 前の `restart`・`update` の再起動がまだ終わっていない
    notes: '`isError: true`'
constraints:
  - item: 停止の待ち
    constraint: 処理中の要求を待つ上限は project-index への問い合わせの制限時間の 1.5 倍。過ぎたら残りの要求を切って止める
    notes: project-index の応答を待つ要求が一番長い要求になるため
    decided_by: NFR-155-1#requirements[project-index への問い合わせの制限時間]
  - item: 起動し直す方法
    constraint: uvicorn の停止の後、`os.execv(sys.executable, [sys.executable, "-m", "dev_docs", "serve"])` で同じプロセスを置き換える
    notes: SessionStart のフックで切り離して起動したプロセスのまま続くため、親を持たないまま残らない。起動し直した後は『起動』の待ち受けまでの順番に従い、配信元を読む前に待ち受ける
  - item: 起動に失敗したとき
    constraint: '`dev-docs serve` の終了コードで止まり、次のセッションの SessionStart のフックが起動し直す'
  - item: タイムアウト
    constraint: 制限なし
  - item: 接続できない時間
    constraint: 応答を返してから接続を受け付け直すまでを、非機能要件の決定値以内にする
    decided_by: NFR-155-1#requirements[起動から接続を受け付けるまでの時間]
    notes: 停止の待ち（処理中の要求）は含めない
test_file: tests/integration/server/test_restart.py
