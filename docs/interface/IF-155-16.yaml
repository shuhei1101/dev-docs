id: IF-155-16
title: "画面の検索"
entry:
  kind: endpoint
  value: GET `/_api/sources/{source}/search`
flows:
  - name: 正常系
    summary: 単語を含む文書だけを一致した箇所つきで返却する
    setup:
      - name: Mock
        description: 'テストの中で起動した project-index（shuhei1101/project-index の develop の `42632c5`（[共通のキーを返却する読み取り API](https://github.com/shuhei1101/project-index/pull/54) をマージした commit）。一時フォルダの端末の設定を `PROJECT_INDEX_CONFIG` で指し、空きポートで子プロセスとして起動する）が、setup の配信元を配信する。dev-docs のアプリを HTTP のテストのクライアントで呼ぶ'
      - name: サンプルの配信元
        description: 文書 2 の本文だけが含む単語を持つ sample
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/search
        participant PI as project-index

        C->>E: q: 文書 2 だけが含む語
        E->>PI: 語での検索
        E-->>C: 200 文書 2 と一致した箇所
      ```
    expected:
      - '`totalCount` が 1 で、`items` が文書 2 だけ'
      - '`snippets` に単語を含む行がある'
      - '`items[0].path` を `path` に指定した文書の取得が文書 2 を返却する'
    test: test_normal
  - name: 異常系（単語の誤り・400）
    summary: 空の単語と長すぎる単語を断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`q` が空と、201 文字'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/search

        C->>E: q: 空
        E-->>C: 400 problem+json（q の違反）
      ```
    expected:
      - どちらも 400 で、`errors[0].path` が `q`、`reason` に空か長すぎることがある
    test: test_error_when_query_invalid
  - name: 異常系（無い配信元・リビジョン・404）
    summary: 無い配信元・解決できないリビジョンを断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`/_api/sources/unknown/search?q=a` と `/_api/sources/sample/search?q=a&ref=no-such-branch`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/search

        C->>E: source: unknown
        E-->>C: 404 problem+json（無い配信元）
      ```
    expected:
      - '`unknown` が 404 で、`detail` に無いのが配信元であることがある'
      - '`no-such-branch` が 404 で、`detail` に解決できなかったリビジョンがある'
    test: test_error_when_not_found
  - name: 正常系（検索から除外される文書）
    summary: 検索から除外される文書を既定の結果から除き、除いた件数を返却する。`include_excluded=true` のときは含めて返却する
    setup:
      - name: Mock
        description: 正常系と同じテストの中で起動した project-index。`search_exclude` を扱うバージョン（[shuhei1101/project-index#265](https://github.com/shuhei1101/project-index/pull/265) をマージした commit 以降）にする
      - name: 検索から除外する文書を持つ配信元
        description: sample の `project-index.yaml` の文書の行に、文書 2 に該当する `search_exclude` を記載する
        notes: 文書 1 と文書 2 の本文がどちらも含む単語で検索する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/search
        participant PI as project-index

        C->>E: q: 文書 1 と文書 2 が含む単語
        E->>PI: 語での検索
        E-->>C: 200 文書 1・excludedCount 1
        C->>E: q: 同じ単語, include_excluded: true
        E->>PI: 語での検索（include_excluded: true）
        E-->>C: 200 文書 1・文書 2（excluded）
      ```
    expected:
      - '1 回目が `totalCount: 1` で `items` が文書 1 だけ、`excludedCount` が 1、文書 1 の `excluded` が `false`'
      - '2 回目が `totalCount: 2` で `items` が文書 1 と文書 2、文書 2 だけが `excluded: true`、`excludedCount` が 0'
    test: test_normal_when_search_excluded
  - name: 正常系（一致した行の数）
    summary: project-index が返却した一致した行の数を文書ごとに返却し、返却しないときは `null` にする
    setup:
      - name: Mock
        description: project-index のクライアントを、[語での検索の結果の文書ごとに、一致した行の数を返却する](https://github.com/shuhei1101/project-index/issues/299) の入出力に沿って `items[].matchCount` を返却するスタブと、返却しないスタブに差し替える
      - name: サンプルの配信元
        description: 文書 1 と文書 2 がどちらも含む単語を持つ sample
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/search
        participant PI as project-index（スタブ）

        C->>E: q: 文書 1 と文書 2 が含む単語
        E->>PI: 語での検索
        PI-->>E: 文書 1（matchCount 4）・文書 2（matchCount 1）
        E-->>C: 200 文書ごとの matchCount
      ```

      <!-- /map -->
    expected:
      - '`matchCount` を返却するスタブでは、文書 1 が `4`、文書 2 が `1`'
      - 返却しないスタブでは、どちらも `null`
    test: test_normal_when_match_count
  - name: 正常系（本物の project-index の一致した行の数）
    summary: 本物の project-index が数えた本文の一致した行の数を、文書ごとに返却する
    setup:
      - name: Mock
        description: テストの中で起動した project-index（shuhei1101/project-index の develop の `2588d67`（[語での検索の結果の文書ごとに、一致した行の数を返却する](https://github.com/shuhei1101/project-index/pull/300) をマージした commit））が、setup の配信元を配信する
      - name: 本文のファイルを持つ配信元
        description: 管理用の YAML の行の文書 3 件。本文が単語を含む行を 4 行（1 行に 2 回含む行を含む）持つ文書、1 行持つ文書、本文は含まず文書のパスだけが含む文書
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as GET /_api/sources/{source}/search
        participant PI as project-index

        C->>E: q: 3 件が含む単語
        E->>PI: 語での検索
        E-->>C: 200 文書ごとの matchCount
      ```
    expected:
      - 文書ごとの `matchCount` が、本文の単語を含む行が 4 行の文書で `4`、1 行の文書で `1`、文書のパスだけが含む文書で `0`
      - 応答が、検索のダイアログの結合テストが API の応答に使用する `tests/integration/frontend/support/search-match-count.json` と一致する
    test: test_normal_when_match_count_from_real_index
lead: トップバーの検索が呼び、単語を含む文書と一致した箇所を返却する画面の検索の入出力を定め、画面の検索を修正するときに参照する。
identifier: search_page
permissions: なし（`127.0.0.1` でだけ待ち受ける）
idempotent: true
side_effects: なし
exclusivity: 読み取りだけで排他しない
request:
  - name: source
    type: str
    required: true
    location: path
    description: 配信元の ID
  - name: q
    type: str
    required: true
    location: query
    description: 検索する単語。空白で区切った単語を全て含む文書に該当する
    constraints: 1〜200 文字
    notes: 大文字小文字と全角半角（NFKC）を区別しない
  - name: ref
    type: str
    required: false
    default: なし（配信元の `default_ref`）
    location: query
    description: 検索するリビジョン
  - name: limit
    type: int
    required: false
    default: '`20`'
    location: query
    description: 返却する件数
    constraints: 1〜100
  - name: include_excluded
    type: bool
    required: false
    default: '`false`'
    location: query
    description: 検索から除外される文書（配信元の設定の `documents[].search_exclude` に該当する文書）も結果に含めるか
    notes: project-index の語での検索の `include_excluded` にそのまま指定する
request_example: |-
  ```text
  GET /_api/sources/sample/search?q=%E3%83%9A%E3%83%BC%E3%82%B8%E3%83%B3%E3%82%B0
  ```
response:
  - name: totalCount
    type: int
    description: 一致した文書の総件数
  - name: items[].path
    type: str
    description: 文書のパス（文書の取得の `path` に指定する形式）
  - name: items[].name
    type: str
    description: 文書の名前
  - name: items[].snippets
    type: list[str]
    description: 一致した行と前後の文字
    constraints: 文書ごとに 3 件まで
  - name: excludedCount
    type: int
    description: 単語を含む文書のうち、検索から除外される文書で、結果から除いた件数
    notes: '`include_excluded` が `true` のときと、除いた文書が無いときは `0`'
  - name: items[].excluded
    type: bool
    description: 検索から除外される文書か
    notes: '`include_excluded` が `true` で該当する文書だけ `true`、それ以外は `false`'
  - name: items[].matchCount
    type: int | null
    description: 文書の本文のうち、単語に一致した行の数
    notes: project-index の語での検索が返却する `items[].matchCount` をそのまま返却する。返却しないバージョンの project-index では `null`
response_example: |-
  ```json
  {"totalCount": 1, "excludedCount": 0, "items": [
    {"path": "docs/doc-2", "name": "文書 2", "snippets": ["…一覧のページングは…"], "excluded": false, "matchCount": 3}
  ]}
  ```
status_codes:
  - code: '503'
    condition: project-index につながらない
    notes: 'つながらなかった project-index のアドレスと理由（`projectIndex.address`・`projectIndex.reason`）。`detail` は `project-index（{address}）に接続できませんでした。{reason}`'
  - code: '200'
    condition: 検索した（一致が 0 件のときも 200）
  - code: '400'
    condition: '`q` が空か 200 文字を超える'
  - code: '404'
    condition: 配信元が無い・配信していない、または `ref` を解決できない
error_format: RFC 9457 の `application/problem+json`（`type`・`title`・`status`・`detail`）。拡張メンバーは camelCase（`nextSteps`・`errors[]`）。検証の違反は `errors[]` に `{path, reason}` で並べる
constraints:
  - item: 件数
    constraint: '`limit` は最大 100'
  - item: 認可
    constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）
  - item: タイムアウト
    constraint: project-index への問い合わせを制限時間で打ち切り、打ち切ったら project-index につながらないときと同じ 503 と理由を返却する
    decided_by: NFR-155-1#requirements[project-index への問い合わせの制限時間]
  - item: JSON のキー
    constraint: レスポンスのキーは camelCase。パス・クエリのパラメータ名は変えない
  - item: operationId
    constraint: '`{tag}-{関数名}` の `view-search_page`'
  - item: 検索から除外される文書
    constraint: project-index の語での検索が返却する `excludedCount`（無いときは `0`）と `items[].excluded`（無いときは `false`）をそのまま返却する。除外するかの判定は project-index に任せる
  - item: 一致した行の数
    constraint: 数えるのは project-index で、dev-docs では数えない。契約は [語での検索の結果の文書ごとに、一致した行の数を返却する](https://github.com/shuhei1101/project-index/issues/299) の入出力で、本物につなぐ作業は [画面の検索の一致した行の数を、project-index の本物の応答につなぐ](https://github.com/shuhei1101/dev-docs/issues/341)
  - item: 配信元の横断
    constraint: 画面は配信元を横断するとき、配信中の配信元ごとにこのエンドポイントを `ref` を指定せずに呼び、結果をまとめる。横断のエンドポイントは持たない
    decided_by: NFR-155-1#requirements[配信元の横断の検索の問い合わせ]
test_file: tests/integration/server/test_search_page.py
tags:
  - name: action:検索
    main: true
  - name: topic:画面
  - name: topic:api
