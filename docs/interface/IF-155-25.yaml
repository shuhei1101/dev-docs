id: IF-155-25
title: "起動"
entry:
  kind: operation
  value: '`dev-docs serve`（CLI）'
flows:
  - name: 正常系
    summary: project-index につながり、project-index が配信している 2 つの配信元を画面で配信し始める
    setup:
      - name: Mock
        description: project-index の読み取り API のモック（shuhei1101/project-index の develop の `f36ba69` の入出力で、sample と notes を配信中として返す）。`dev-docs serve` を子プロセスで起動し、空きポートを `DEV_DOCS_PORT` に入れる
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す一時フォルダの `settings.yaml`。`project_index` にモックのアドレス'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as dev-docs serve
        participant CF as 端末の設定
        participant PI as project-index（モック）

        U->>T: dev-docs serve
        T-->>CF: 端末の設定を読み、スキーマで検証する
        T->>T: 127.0.0.1 で待ち受ける
        T-->>U: 待ち受けたアドレスを標準出力に出す
        T->>PI: 配信元の一覧と状態を問い合わせる
        T-->>U: project-index が配信している配信元を標準出力に出す
      ```
    expected:
      - '`127.0.0.1` で待ち受け、`0.0.0.0` では待ち受けない'
      - '`/_api/sources/sample/docs` と `/_api/sources/notes/docs` が 200 を返す'
      - '`/mcp` が 404 を返す'
      - '`/_admin/mcp` に MCP のセッションを張れ、ツールが `status`・`restart`・`update` の 3 つ'
      - 標準出力に待ち受けたアドレスと sample・notes が出る
    test: test_normal
  - name: 正常系（project-index につながらない）
    summary: project-index につながらなくても待ち受けを続け、つながらないことを標準エラーとエラーログに出す
    setup:
      - name: Mock
        description: なし（`dev-docs serve` を子プロセスで起動し、空きポートを `DEV_DOCS_PORT` に入れる）
      - name: 端末の設定
        description: '`project_index` に、何も待ち受けていない空きポートのアドレス'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as dev-docs serve
        participant PI as project-index

        U->>T: dev-docs serve
        T->>T: 127.0.0.1 で待ち受ける
        T->>PI: 配信元の一覧と状態を問い合わせる（つながらない）
        T-->>U: つながらなかったアドレスと、project-index を起動する案内を標準エラーに出す
      ```
    expected:
      - プロセスが終わらず、`127.0.0.1` で待ち受ける
      - 標準エラーとエラーログに、つながらなかった project-index のアドレスと、project-index を起動する案内が出る
      - '`/_api/sources/sample/docs` が 503 を返し、`/_admin/mcp` の `status` は応答する'
    test: test_normal_when_project_index_unreachable
  - name: 異常系（端末の設定が違反する・TerminalConfigInvalidError）
    summary: 端末の設定がスキーマに違反すると待ち受けずに終わる
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`project_index` が URL でなく、`port` が文字列'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as dev-docs serve

        U->>T: dev-docs serve
        T->>T: 端末の設定の検証に失敗する
        T-->>U: 違反を標準エラーに出して終わる
      ```
    expected:
      - 終了コードが 2 で、ポートを待ち受けない
      - '標準エラーに `{ファイル}: project_index` と `{ファイル}: port` の違反が両方並ぶ'
      - '`DEV_DOCS_CONFIG` が無いファイルを指すときも、そのパスを出して終了コード 2 で終わる'
    test: test_error_when_terminal_config_invalid
  - name: 異常系（ポートが使用中・PortInUseError）
    summary: ポートで待ち受けられないと終わる
    setup:
      - name: Mock
        description: なし
      - name: 使用中のポート
        description: テストが先に待ち受けたポートを `DEV_DOCS_PORT` に入れる
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as dev-docs serve

        U->>T: dev-docs serve
        T->>T: ポートで待ち受けられない
        T-->>U: ポートと DEV_DOCS_PORT を標準エラーに出して終わる
      ```
    expected:
      - 終了コードが 3
      - 標準エラーに使用中のポートの番号と、`DEV_DOCS_PORT` で変えられることが出る
    test: test_error_when_port_in_use
  - name: 正常系（MCP の入口をスラッシュ無しで呼ぶ）
    summary: プラグインの接続先と同じスラッシュ無しの `/_admin/mcp` への POST に、リダイレクトを挟まずに MCP が応える
    setup:
      - name: Mock
        description: なし（`dev-docs serve` を子プロセスで起動し、空きポートを `DEV_DOCS_PORT` に入れる）
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が指す一時フォルダの `settings.yaml`。`project_index` に project-index の読み取り API のモックのアドレス'
      - name: 入力
        description: '`/_admin/mcp` へ MCP の initialize を POST する'
        notes: HTTP のクライアントはリダイレクトを追従しない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as dev-docs serve
        participant A as 管理の MCP

        U->>T: POST /_admin/mcp（initialize）
        T->>A: /_admin/mcp/ と同じ入口へ届ける
        A-->>U: 200
      ```
    expected:
      - '`/_admin/mcp` への initialize が 307 を挟まずに 200 を返し、`serverInfo` を持つ'
      - スラッシュ付きの `/_admin/mcp/` への initialize も 200 を返す
    test: test_normal_when_mcp_path_without_slash
  - name: 正常系（XDG の環境変数で置き場を決める）
    summary: '`DEV_DOCS_CONFIG` が無ければ `XDG_CONFIG_HOME` の下の端末の設定を読み、状態とログを `DEV_DOCS_STATE_DIR`・`XDG_STATE_HOME` から決めた置き場に書く'
    setup:
      - name: Mock
        description: なし（`dev-docs serve` を子プロセスで起動し、空きポートを `DEV_DOCS_PORT` に入れる）
      - name: 環境変数
        description: '`DEV_DOCS_CONFIG` を外し、`XDG_CONFIG_HOME`・`XDG_STATE_HOME`・`HOME` にテスト用の一時フォルダを入れる'
      - name: 端末の設定
        description: '`$XDG_CONFIG_HOME/dev-docs/settings.yaml`。`project_index` に sample を配信している project-index の読み取り API のモックのアドレス'
        notes: 1 回目は `state_dir`・`log_dir` を持たない
      - name: 上書き
        description: 2 回目は端末の設定に `state_dir` を書き、`DEV_DOCS_STATE_DIR` に別の一時フォルダを入れる。3 回目は `state_dir` と `DEV_DOCS_STATE_DIR` を外し、`XDG_STATE_HOME` に相対パス `rel` を入れる
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as テスト
        participant S as dev-docs serve
        participant FS as ディスク

        C->>S: 1 回目の起動
        S->>FS: $XDG_CONFIG_HOME/dev-docs/settings.yaml を読む
        S->>FS: ログを $XDG_STATE_HOME/dev-docs/logs に書く
        C->>S: 2 回目の起動（DEV_DOCS_STATE_DIR と state_dir がある）
        S->>FS: ログを $DEV_DOCS_STATE_DIR/logs に書く
        C->>S: 3 回目の起動（XDG_STATE_HOME が相対パス）
        S->>FS: ログを $HOME/.local/state/dev-docs/logs に書く
      ```
    expected:
      - 1 回目の起動で `/_api/sources/sample/docs` が 200 を返し、ログが `$XDG_STATE_HOME/dev-docs/logs` にできる
      - 2 回目の起動のログが `$DEV_DOCS_STATE_DIR/logs` にでき、端末の設定の `state_dir` には書かない
      - 3 回目の起動のログが `$HOME/.local/state/dev-docs/logs` にでき、作業場所からの相対の `rel` には書かない
    test: test_normal_when_xdg_dirs_set
  - name: 正常系（MCP の文をプロンプトの YAML から読む）
    summary: 管理の MCP のツールの description をプロンプトの YAML から描画して返す
    setup:
      - name: Mock
        description: なし（`dev-docs serve` を子プロセスで起動し、空きポートを `DEV_DOCS_PORT` に入れる）
      - name: プロンプトの YAML
        description: リポジトリに同梱したままの YAML
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as dev-docs serve
        participant P as プロンプトの YAML

        U->>T: dev-docs serve
        T->>P: YAML を読み、スキーマで検査する
        T->>T: description を描画して MCP に登録する
        U->>T: POST /_admin/mcp（tools/list）
        T-->>U: ツールの description
      ```
    expected:
      - 管理の MCP の 3 つのツールの description が、それぞれの YAML を描画した文と同じ
      - どの文にも `MUST`・`必ず`・`禁止` の語が無い
      - ツールの名前と引数のスキーマは変わらない
    test: test_normal_when_mcp_text_from_prompts
  - name: 異常系（プロンプトの YAML が違反する・PromptInvalidError）
    summary: プロンプトの YAML がスキーマに違反すると待ち受けずに終わる
    setup:
      - name: Mock
        description: なし（`dev-docs serve` を子プロセスで起動する）
      - name: 違反する YAML
        description: プロンプトの YAML の置き場所をテストの一時フォルダへ向け、`status` のツールの YAML から必須のキー `kind` を削除する
        notes: '`DEV_DOCS_PROMPTS_DIR` に一時フォルダを入れる'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as クライアント
        participant T as dev-docs serve

        U->>T: dev-docs serve
        T->>T: プロンプトの YAML の検査に失敗する
        T-->>U: 違反を標準エラーに出して終わる
      ```
    expected:
      - 終了コードが 4 で、ポートを待ち受けない
      - 標準エラーに `status` の YAML のパスと `kind` の違反がある
    test: test_error_when_prompt_invalid
lead: 端末の設定を読み、project-index が配信している配信元を、1 プロセス・1 ポートで画面の API と `/_admin/mcp` に配信し始める。
identifier: serve
permissions: なし
idempotent: false
side_effects: '`bind`:`port` で待ち受ける。`log_dir` に project-index につながらないことのログを書く'
callers:
  - SC-155-10#scenarios[正常シナリオ]
  - SC-155-10#scenarios[正常シナリオ（XDG の環境変数で置き場を決める）]
  - SC-155-10#scenarios[異常シナリオ（project-index につながらない）]
exclusivity: 同じポートで待ち受けるプロセスは 1 つだけ（後からの起動はポート使用中で終わる）
request:
  - name: DEV_DOCS_CONFIG
    type: str
    required: false
    default: '`${XDG_CONFIG_HOME:-~/.config}/dev-docs/settings.yaml`'
    description: 端末の設定のパス
    notes: 環境変数で渡す
  - name: XDG_CONFIG_HOME
    type: str
    required: false
    default: '`~/.config`'
    description: '`DEV_DOCS_CONFIG` が無いときに端末の設定を探すフォルダの親'
    notes: 環境変数で渡す。空の文字列か相対パスは未設定として扱う
  - name: DEV_DOCS_STATE_DIR
    type: str
    required: false
    default: 端末の設定の `state_dir`、無ければ `${XDG_STATE_HOME:-~/.local/state}/dev-docs`
    description: 状態の置き場。端末の設定の `state_dir` より優先
    notes: 環境変数で渡す
  - name: XDG_STATE_HOME
    type: str
    required: false
    default: '`~/.local/state`'
    description: '`DEV_DOCS_STATE_DIR` と `state_dir` が無いときの状態の置き場の親'
    notes: 環境変数で渡す。空の文字列か相対パスは未設定として扱う
  - name: DEV_DOCS_PORT
    type: int
    required: false
    default: 端末の設定の `port`（既定 8781）
    description: 待ち受けのポート。設定の `port` より優先
    notes: 環境変数で渡す
  - name: DEV_DOCS_PROMPTS_DIR
    type: str
    required: false
    default: クローンの直下の `content/prompts/`
    description: プロンプトの YAML を読むフォルダ
    notes: 環境変数で渡す
request_example: |-
  ```bash
  DEV_DOCS_CONFIG=/tmp/x/settings.yaml DEV_DOCS_PORT=8781 dev-docs serve
  ```
response:
  - name: 標準出力
    type: str
    description: 待ち受けたアドレスと、project-index が配信している配信元の ID
  - name: エラーログ
    type: str
    description: project-index につながらなかったときの、つながらなかったアドレスと理由
  - name: 警告のログ
    type: str
    description: 端末の設定に、前のバージョンから残った `sources` の行があるときの、その行の ID と、project-index で追加する案内
  - name: 終了コード
    type: int
    description: 起動できないとき 0 以外
    notes: 待ち受けた後は停止の合図まで終わらない
exceptions:
  - name: なし（正常終了）
    condition: 待ち受けを始めた（project-index につながらないときも待ち受ける）
  - name: TerminalConfigInvalidError
    condition: 端末の設定が無い・スキーマに違反する
    notes: '標準エラーに `{ファイル}: {キーのパス}: {理由}` を全て出し、終了コード 2 で終わる'
  - name: PortInUseError
    condition: ポートで待ち受けられない
    notes: 標準エラーにポートの番号と `DEV_DOCS_PORT` で変えられることを出し、終了コード 3 で終わる
  - name: PromptInvalidError
    condition: プロンプトの YAML（管理の MCP のツールの description）が無い・読めない・`templates/prompt.schema.yaml` に違反する・Jinja2 として解釈できない
    notes: '標準エラーに `{ファイル}: {キーのパス}: {理由}` を全て出し、待ち受けずに終了コード 4 で終わる。代わりの文は持たない'
constraints:
  - item: 待ち受けのアドレス
    constraint: '`127.0.0.1`'
    decided_by: NFR-155-1#requirements[待ち受けのアドレス]
  - item: 待ち受けのポート
    constraint: 既定 8781
    decided_by: NFR-155-1#requirements[待ち受けのポート]
  - item: 配信する入口
    constraint: 画面の API `/_api/`（そのスキーマ `/_api/openapi.json`）と、管理の MCP `/_admin/mcp`（ツール 3 つ、instructions を持たない）。`/_admin/mcp` はスラッシュの有無によらず同じ MCP が応え、リダイレクトを挟まない。文書の MCP `/mcp` と `POST /_admin/session-start` は持たない（project-index が持つ）
    notes: プラグインの `.mcp.json` の接続先はスラッシュ無し。画面の配信のルート（`GET /{path}`）より先に MCP へ届け、POST が 405 にならないようにする
  - item: project-index の接続先
    constraint: 端末の設定の `project_index`（既定 `http://127.0.0.1:8786`）。配信元の一覧・状態・文書は要求ごとに問い合わせ、dev-docs の中に控えない
    notes: project-index が読み直した配信元は、dev-docs を再起動せずに次の要求から返る
  - item: 前のバージョンから残った sources
    constraint: 端末の設定に残った `sources` の行は配信に使わず、スキーマの違反にもしない。起動のたびに行の ID を警告のログに出す
    notes: '`dev-docs migrate` が project-index に同じ ID の行があって移さなかった行が残る（単一ユースケース『dev-docsを更新する』）'
  - item: タイムアウト
    constraint: 制限なし
  - item: 端末の設定と状態の置き場
    constraint: 端末の設定は `DEV_DOCS_CONFIG`、無ければ `${XDG_CONFIG_HOME:-~/.config}/dev-docs/settings.yaml`。状態の置き場は `DEV_DOCS_STATE_DIR` → 端末の設定の `state_dir` → `${XDG_STATE_HOME:-~/.local/state}/dev-docs` の順。ログの置き場は端末の設定の `log_dir`、無ければ決めた状態の置き場の `logs`。`XDG_CONFIG_HOME`・`XDG_STATE_HOME` が空の文字列か相対パスなら未設定として扱う
    notes: 環境変数が端末の設定より先に有効になる並びは `DEV_DOCS_CONFIG`・`DEV_DOCS_PORT` と同じ。相対パスの扱いは XDG Base Directory Specification に従う。セッション開始のフックも同じ規則で端末の設定のパスを決める
  - item: MCP の文の出どころ
    constraint: '管理の MCP のツールごとの description（`kind: tool`）を、起動のときにプロンプトの YAML から読んで描画する。コードは文を持たない'
    notes: ツールの名前・引数・返り値は変えない。YAML を書き換えたときは再起動で効かせる
  - item: 待ち受けまでの順番
    constraint: 端末の設定・ポート・プロンプトの YAML を確かめたら待ち受けを始め、project-index への問い合わせは待ち受けの後に行う
    decided_by: NFR-155-1#requirements[起動から接続を受け付けるまでの時間]
refs:
  - SC-155-10#scenarios[正常シナリオ]
test_file: tests/integration/server/test_serve.py
