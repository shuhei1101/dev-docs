id: IF-155-22
title: "設定の移し替え"
entry:
  kind: operation
  value: '`dev-docs migrate`（CLI）'
flows:
  - name: 正常系
    summary: 古い端末の設定に手順を当て、バックアップを残して `version` を上げる
    setup:
      - name: Mock
        description: 手順の置き場所をテスト用のフォルダに、`SETTINGS_VERSION`・`SOURCE_CONFIG_VERSION` を `2` に monkeypatch で差し替え、`main(["migrate", ...])` を同じプロセスで呼ぶ。端末の設定は一時フォルダに置き `DEV_DOCS_CONFIG` で指す
      - name: 移し替えの手順
        description: テスト用の手順のフォルダに、`version` 1 → 2 でキーを改名する手順を 1 つ置く
      - name: 端末の設定
        description: '`version: "1"` で改名前のキーを持つ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant M as dev-docs migrate
        participant F as 端末の設定

        C->>M: --plan
        M-->>F: version を読む
        M-->>C: 当てる手順の一覧（終了コード 0）
        C->>M: フラグなし
        M->>F: バックアップを取る
        M->>F: 手順を当てて version を書き換える
        M-->>C: 当てた手順とバックアップのパス（終了コード 0）
      ```
    expected:
      - '`--plan` が手順を 1 行出し、端末の設定が変わらない'
      - 適用の後、端末の設定の `version` が `"2"` で、キーが改名され、他の値が変わらない
      - バックアップの中身が適用前の端末の設定と同じ
      - もう一度適用すると当てる手順が無く終了コード 0 で、ファイルが変わらない
    test: test_normal
  - name: 正常系（バージョンだけを記録する）
    summary: '`--record` で手順を当てずに `version` だけを書き換える'
    setup:
      - name: Mock
        description: 正常系と同じ差し替え
      - name: 端末の設定
        description: 正常系と同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant M as dev-docs migrate
        participant F as 端末の設定

        C->>M: --record
        M->>F: version だけを書き換える
        M-->>C: 終了コード 0
      ```
    expected:
      - '`version` が `"2"` で、改名前のキーがそのまま残る'
    test: test_normal_when_record_only
  - name: 異常系（設定が読めない・ConfigInvalid）
    summary: '`version` の無い設定は移し替えずに終了コード 2 で止める'
    setup:
      - name: Mock
        description: 正常系と同じ差し替え
      - name: 端末の設定
        description: '`version` のキーを持たない'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant M as dev-docs migrate

        C->>M: フラグなし
        M-->>C: 違反（終了コード 2）
      ```
    expected:
      - 終了コード 2 で stderr に `version` が無いことを出す
      - 端末の設定が変わらず、バックアップも作らない
    test: test_error_when_config_invalid
  - name: 異常系（手順が失敗する・MigrationFailed）
    summary: 当てた結果が新しいスキーマに違反すると、端末の設定を書き換えずに終了コード 4 で止める
    setup:
      - name: Mock
        description: 正常系と同じ差し替え
      - name: 移し替えの手順
        description: 必須のキーを消す誤った手順（破壊的でないと宣言する）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant M as dev-docs migrate
        participant F as 端末の設定

        C->>M: フラグなし
        M->>F: 端末の設定を読む
        M->>M: 手順を当てる（スキーマに違反）
        M-->>C: 失敗した手順と理由（終了コード 4）
      ```
    expected:
      - 終了コード 4 で stderr に失敗した手順と違反したキーを出す
      - 端末の設定の中身が適用前と同じで、バックアップも作らない
    test: test_error_when_step_fails
  - name: 異常系（破壊的な手順がある・DestructiveStepBlocked）
    summary: 破壊的な手順を `--allow-destructive` なしで当てようとすると、触らずに終了コード 5 で止める
    setup:
      - name: Mock
        description: 正常系と同じ差し替え
      - name: 移し替えの手順
        description: キーを削除する破壊的な手順
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant M as dev-docs migrate

        C->>M: フラグなし
        M-->>C: 破壊的な手順（終了コード 5）
      ```
    expected:
      - 終了コード 5 で stderr に破壊的な手順を出す
      - 端末の設定が変わらず、バックアップも作らない
      - '`--allow-destructive` を付けると終了コード 0 で当てる'
    test: test_error_when_destructive_step_blocked
  - name: 異常系（設定が新しい・ConfigNewer）
    summary: dev-docs より新しい `version` の設定は移し替えずに終了コード 6 で止める
    setup:
      - name: Mock
        description: 正常系と同じ差し替え
      - name: 端末の設定
        description: '`version: "99"`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant M as dev-docs migrate

        C->>M: フラグなし
        M-->>C: dev-docs の更新の案内（終了コード 6）
      ```
    expected:
      - 終了コード 6 で stderr に dev-docs の更新の案内を出す
      - 端末の設定が変わらない
    test: test_error_when_config_newer
  - name: 正常系（端末の設定の sources を project-index へ移す）
    summary: 前のバージョンの端末の設定の `sources` の行を、project-index の端末の設定の今の行に加えて 1 回で保存し、dev-docs の端末の設定から除いて `project_index` を書き足す
    setup:
      - name: Mock
        description: project-index の端末の設定の API のモック（shuhei1101/project-index の develop の `7177d39` の入出力で、端末の設定の取得と保存を受け、extra の行を既に持つ）
      - name: 端末の設定
        description: '`sources` に sample・notes・extra の 3 行を持ち、`project_index` を持たない前のバージョンの `settings.yaml`'
      - name: 入力
        description: '`--project-index` にモックのアドレス'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant M as dev-docs migrate
        participant F as 端末の設定
        participant PI as project-index（モック）

        C->>M: --project-index {アドレス}
        M->>F: 端末の設定を読む
        M->>PI: 端末の設定の取得
        PI-->>M: 今の行と内容のバージョン
        M->>PI: 今の行に移す行を加えた sources の保存（内容のバージョンつき）
        PI-->>M: 保存した
        M->>F: バックアップを取る
        M->>F: 移した行を sources から除き、project_index と version を書き換える
        M-->>C: 当てた手順と、移さなかった行の id（終了コード 0）
      ```
    expected:
      - モックが端末の設定の取得を 1 回と保存を 1 回受け、保存の `sources` がモックの持っていた extra の行と sample・notes の 3 行、`expectedVersion` が取得で返却した内容のバージョンになる。extra は同じ id で内容が違うため、dev-docs の行を送信しない
      - 端末の設定の `sources` が extra の 1 行だけになり、`project_index` が `--project-index` のアドレス、`version` が新しいバージョンになる
      - stdout に、extra を移さずに残したことと、project-index で行を直す案内がある
      - '`--project-index` を省くと `PROJECT_INDEX_PORT`（無ければ 8786）から組んだ `http://127.0.0.1:{ポート}` へ保存する'
    test: test_normal_when_sources_moved_to_project_index
  - name: 異常系（project-index につながらない・ProjectIndexUnreachable）
    summary: project-index につながらないと、端末の設定を書き換えずに終了コード 7 で止める
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: 正常系（端末の設定の sources を project-index へ移す）と同じ前のバージョンの `settings.yaml`
      - name: 入力
        description: '`--project-index` に、何も待ち受けていない空きポートのアドレス'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant M as dev-docs migrate
        participant F as 端末の設定

        C->>M: --project-index {アドレス}
        M->>F: 端末の設定を読む
        M->>M: 配信元の行の追加がつながらない
        M-->>C: つながらなかったアドレスと、project-index を起動してからやり直す案内（終了コード 7）
      ```
    expected:
      - 終了コード 7 で、stderr につながらなかったアドレスと案内がある
      - 端末の設定が `migrate` の前と同じ中身で、バックアップも作らない
    test: test_error_when_project_index_unreachable
  - name: 正常系（保存の応答が制限時間を超える）
    summary: project-index が保存した後の応答が制限時間を超えても、取得し直して保存を確認し、移し替えを終える
    setup:
      - name: Mock
        description: 正常系（端末の設定の sources を project-index へ移す）と同じモックで、保存を受けたら行を保存してから制限時間より長く応答を遅らせる。制限時間は monkeypatch で 1 秒にし、応答は 3 秒遅らせる
      - name: 端末の設定
        description: 正常系（端末の設定の sources を project-index へ移す）と同じ前のバージョンの `settings.yaml`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant M as dev-docs migrate
        participant F as 端末の設定
        participant PI as project-index（モック）

        C->>M: --project-index {アドレス}
        M->>PI: 端末の設定の取得
        M->>PI: sources の保存（制限時間を超えて打ち切る）
        M->>PI: 端末の設定の取得
        PI-->>M: 移す行を全て持つ
        M->>F: バックアップを取り、移した行を除いて project_index と version を書き換える
        M-->>C: 当てた手順（終了コード 0）
      ```
    expected:
      - 終了コード 0 で、端末の設定が正常系（端末の設定の sources を project-index へ移す）と同じ中身になる
      - モックが端末の設定の取得を 2 回と保存を 1 回受ける
    test: test_normal_when_save_response_exceeds_timeout
  - name: 異常系（project-index が保存を受け付けない・MigrationFailed）
    summary: project-index が sources の保存を断ると、どちらの端末の設定も書き換えずに終了コード 4 で止める
    setup:
      - name: Mock
        description: 正常系（端末の設定の sources を project-index へ移す）と同じモックで、保存を 400 の problem+json（`errors[]` に broken の行の位置の `sources[{n}].enabled` を 1 件）で断り、行を保存しない
      - name: 端末の設定
        description: '`sources` に sample と broken の 2 行を持ち、`project_index` を持たない前のバージョンの `settings.yaml`'
        notes: broken は `enabled` に `"maybe"` を持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant M as dev-docs migrate
        participant F as 端末の設定
        participant PI as project-index（モック）

        C->>M: --project-index {アドレス}
        M->>PI: 端末の設定の取得
        M->>PI: sources の保存
        PI-->>M: 400（保存しない）
        M-->>C: project-index の応答のステータスと要約（終了コード 4）
      ```
    expected:
      - 終了コード 4 で、stderr に 400 と、受け付けなかった行の ID（broken）と理由がある
      - モックの端末の設定の行が extra の 1 行のままである
      - dev-docs の端末の設定が `migrate` の前と同じ中身で、バックアップも作らない
    test: test_error_when_project_index_rejects_save
  - name: 異常系（保存を確認できない・ProjectIndexUnreachable）
    summary: 保存の応答が制限時間を超え、取得し直しても移す行が無ければ、端末の設定を書き換えずに終了コード 7 で止める
    setup:
      - name: Mock
        description: 正常系（端末の設定の sources を project-index へ移す）と同じモックで、保存を受けても行を保存せず、制限時間より長く応答を遅らせる。制限時間は monkeypatch で 1 秒にし、応答は 3 秒遅らせる
      - name: 端末の設定
        description: 正常系（端末の設定の sources を project-index へ移す）と同じ前のバージョンの `settings.yaml`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant M as dev-docs migrate
        participant PI as project-index（モック）

        C->>M: --project-index {アドレス}
        M->>PI: 端末の設定の取得
        M->>PI: sources の保存（制限時間を超えて打ち切る）
        M->>PI: 端末の設定の取得
        PI-->>M: 移す行が無い
        M-->>C: 保存を確認できなかったことと、やり直す案内（終了コード 7）
      ```
    expected:
      - 終了コード 7 で、stderr に保存が後から反映されうることとやり直す案内がある
      - dev-docs の端末の設定が `migrate` の前と同じ中身で、バックアップも作らない
    test: test_error_when_save_unconfirmed_after_timeout
lead: 端末の設定の `version` を dev-docs が読めるバージョンと比べ、移し替えの手順を古い順に当てる。前のバージョンの `sources` は project-index の端末の設定へ移す。
identifier: migrate
permissions: 対象の設定ファイルを書き換えられる利用者
idempotent: true
side_effects: 適用では端末の設定を書き換え、同じフォルダに `{ファイル名}.bak-{時刻}` を残す。`sources` を移す手順では、project-index の端末の設定の `sources` を 1 回の保存で書き換え、移す行を加える。この保存で project-index は全ての配信元を読み直してキャッシュを破棄し、`sources` の既存の行も送信したキーで書き直す（行に付いたコメントは消え、文字列の `config` は配列になる）。`--plan` は書き換えない
callers:
  - SC-155-3#scenarios[正常シナリオ（端末の設定が古くなる）]
  - SC-155-3#scenarios[正常シナリオ（端末の設定の sources を project-index へ移す）]
  - SC-155-3#scenarios[異常シナリオ（sources を移すときに project-index につながらない）]
  - SC-155-3#scenarios[異常シナリオ（sources を移す途中で project-index が行を受け付けない）]
exclusivity: 端末の設定は動いているサーバーと同じファイルを書き換えるため、適用は書き換えの前後でファイルの中身を比べ、変わっていたら書かずに失敗とする
request:
  - name: --plan
    type: flag
    required: false
    default: なし（適用する）
    location: argument
    description: 当てる手順の一覧を出して終わる。書き換えない
  - name: --record
    type: flag
    required: false
    default: なし
    location: argument
    description: 手順を当てず、`version` だけを今のバージョンに書き換える
    notes: 利用者が手で移し替えたときに使う。`--plan` とは併用しない
  - name: --project-index
    type: str
    required: false
    default: '`http://127.0.0.1:{PROJECT_INDEX_PORT}`（`PROJECT_INDEX_PORT` が無ければ 8786）'
    location: argument
    description: '`sources` を移す先の project-index のアドレス。端末の設定の `project_index` にも書く'
  - name: --allow-destructive
    type: flag
    required: false
    default: なし（破壊的な手順があれば止める）
    location: argument
    description: キーの削除など、値を捨てる手順も適用する
request_example: |-
  ```bash
  dev-docs migrate --plan
  dev-docs migrate --project-index http://127.0.0.1:8786
  ```
response:
  - name: 標準出力
    type: str
    description: '`--plan` は当てる手順を 1 行ずつ（`{バージョン}: {手順の説明}`。破壊的な手順には `[destructive]`）。適用は当てた手順とバックアップのパス'
  - name: 終了コード
    type: int
    description: 0 正常（当てる手順が無いときも 0）・2 設定の違反・4 失敗して書き換えなかった・5 破壊的な手順で止めた・6 設定のバージョンが dev-docs より新しい・7 `sources` を移す先の project-index につながらない
    notes: 2 は `dev-docs serve` の EXIT_CONFIG_INVALID と同じ値。3 は `serve` のポートが使用中に使っているため使わない
exceptions:
  - name: なし（正常終了）
    condition: 手順を当て終えた、または当てる手順が無い（終了コード 0）
  - name: ConfigInvalid
    condition: 対象の設定が無い・YAML として読めない・`version` が無い（終了コード 2）
  - name: MigrationFailed
    condition: 手順の途中で失敗した、当てた結果が新しいバージョンのスキーマに違反した、または project-index が `sources` の保存を受け付けなかった（終了コード 4）
    notes: 全ての手順を当てて新しいスキーマで検証してから書き込むため、ファイルには触らない。失敗した手順と理由を stderr に出す
  - name: DestructiveStepBlocked
    condition: 当てる手順に破壊的なものがあり、`--allow-destructive` が無い（終了コード 5）
    notes: ファイルに触らず、破壊的な手順を stderr に出す
  - name: ProjectIndexUnreachable
    condition: '`sources` を移す手順で、project-index の端末の設定の API につながらない、または保存の応答が制限時間を超えて保存を確認できない（終了コード 7）'
    notes: 全ての手順を当ててから書き込むため、端末の設定には触らない（バックアップも作らない）。つながらなかったアドレスと案内を stderr に出す
  - name: ConfigNewer
    condition: 対象の `version` が dev-docs が読めるバージョンより新しい（終了コード 6）
    notes: dev-docs の更新を案内する
constraints:
  - item: 手順の置き場所
    constraint: '`src/dev_docs/migrations/settings/{バージョン}/steps.yaml`。パッケージに同梱し、`importlib.resources` で読む。配信元の設定の手順は project-index へ移した'
  - item: 当てる順
    constraint: 対象の `version` より新しく、dev-docs が読めるバージョン以下の手順を古い順に全て当てる。途中で止めず、全て当ててから 1 回だけ書き込む
  - item: バックアップ
    constraint: 全ての手順を当てて検証に通った後、書き込む前に必ず取る。成功しても消さない。失敗して書き込まないときは作らない
  - item: 反映
    constraint: 動いているサーバーには反映しない。利用者が続けて `restart` を呼ぶ
  - item: タイムアウト
    constraint: project-index への要求は 1 回ずつ制限時間で打ち切る。保存を打ち切ったら、端末の設定をもう一度取得し、移す行が全て同じ内容であれば保存したとして続ける。無ければ、つながらないときと同じく端末の設定を書き換えずに終了コード 7 で止め、保存が後から反映されうることと、やり直せば保存済みの行を移した行として扱う案内を stderr に出す
    decided_by: NFR-155-1#requirements[project-index への問い合わせの制限時間]
  - item: project-index が保存を受け付けないとき
    constraint: 取得・保存の応答が 200 以外（保存の 400・409・422 を含む）のとき、端末の設定を書き換えず、project-index の応答のステータスと要約を stderr に出して終了コード 4（MigrationFailed）で止める。保存の 400・422 の `errors[].path` が `sources[{n}]` で始まる違反は、送信した n 番目の行の配信元の ID と `reason` を並べて出す。409 は取得の後に project-index の端末の設定が変わったことを示し、やり直す案内を添える
  - item: sources を移す手順
    constraint: 'project-index の端末の設定を取得し、dev-docs の端末の設定の `sources` の行を、取得した行の `id` と配信元の ID で照らす。配信元の ID は `id`、省いた行は `config` の配信元の設定を重ねた `name` にする（project-index と同じ求め方）。`name` を求められない行は送信せずに `sources` に残し、`config` を stdout に出す。同じ ID の行があれば、内容も同じなら移した行として扱い、内容が違えば送信せずに `sources` に残して ID を stdout に出す。残りの行を project-index の今の行の後ろに加え、取得で返却された内容のバージョンを添えて 1 回で保存する（加える行が無ければ保存しない）。送信する行は、今の行も加える行も `id`・`config`・`enabled`・`scope`・`outsideRead` のキーだけにする（取得で返却される `status`・`errors`・`configVersion` を付けると 400 で断られる）。移した行を `sources` から除き、`project_index` を書き足す。破壊的な手順ではない'
    notes: 取得・保存は project-index の端末の設定の API（shuhei1101/project-index の IF-30・IF-31）。project-index は保存した直後に書き込み、配信元の読み直しが終わるまで端末の設定の排他ロックを持ち続け、取得はそのロックを待たない。保存を 1 回にするので、project-index が受け付けないときは何も書き込まれず、取り除く行が生じない
