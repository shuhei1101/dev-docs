id: IF-155-26
visibility: internal
title: テストの全件実行
entry:
  kind: trigger
  value: '`.github/workflows/test.yml`（手動の起動 `workflow_dispatch`。起動を絞る条件は無い）'
lead: テスト実行方法の実行場所が `runner` の層のテストを GitHub Actions のランナーで回す workflow `.github/workflows/test.yml` の入力・制約・正常系と異常系のフローを定め、workflow を修正するときに参照する。
impl_files:
  - .github/workflows/test.yml
idempotent: true
read_only: true
permissions: '`contents: read`'
side_effects: 成果物 `test-log`（層の全件か、指定された結合テストを回した出力）を上げる。リポジトリへは書き込まない
exclusivity: '同じブランチ・同じ層の実行は、先に起動した実行を止める（`concurrency` の `group: test-${{ github.ref }}-${{ inputs.layer }}`・`cancel-in-progress: true`）'
request:
  - name: layer
    type: choice
    required: true
    location: argument
    description: 全件を回す層で、`backend-unit`（単体テスト（バック））/ `backend-integration`（結合テスト（バック））/ `frontend-unit`（単体テスト（フロント））/ `frontend-integration`（結合テスト（フロント））のどれか
    notes: '`on.workflow_dispatch.inputs.layer` の `options`'
  - name: paths
    type: string
    required: false
    location: argument
    default: なし（層の全件を回す）
    description: 回す結合テストのファイルかフォルダを空白で区切って並べたもの。`layer` が `backend-integration` か `frontend-integration` のときだけ使用する
    notes: テスト実行方法の `run_runner` の `{結合テストのパス}` に、判定フローチャート『結合テストの実行範囲』で決めた範囲を指定する。`backend-integration` は `tests/integration/` の下で `tests/integration/frontend/` の外、`frontend-integration` は `tests/integration/frontend/` の下のパスに限る
constraints:
  - item: ランナー
    constraint: '`ubuntu-latest`'
  - item: 層と回すコマンド
    constraint: '`backend-unit` は `uv run pytest tests/unit/ -v`、`backend-integration` は `uv run pytest {paths か tests/integration/} -v`、`frontend-unit` は `npx vitest run --config frontend/vitest.config.ts --reporter=verbose`、`frontend-integration` は `npx playwright test --config tests/integration/frontend/playwright.config.ts {paths}`'
    notes: 手元の全件実行（テスト実行方法の `run_all`）と同じテストを回す
  - item: 入れる道具
    constraint: Node.js 24 は全ての層で入れる。uv と Python の依存は `backend-` の層、npm の依存は `frontend-` の層、Chromium は `frontend-integration` だけで入れる
    notes: 結合テスト（バック）は mdmark の CLI を `npx` で取るため Node.js が要る
  - item: 回す範囲
    constraint: '`paths` を指定したときは `paths` の結合テストだけを回し、省いたときは層の全件を回す。結合テストでない層に `paths` を指定したとき、`paths` の値が層の結合テストのフォルダの外にあるとき、`..` か空白以外の区切りを含むときは、テストを回さずに失敗で終える'
    notes: 作業 PR では判定フローチャート『結合テストの実行範囲』で決めた範囲だけを回す
  - item: 無出力の時間
    constraint: step「層の全件を回す」で、`test.log` の大きさが変わらない時間が上限を超えたら、テストを止めて失敗で終える。上限は `backend-unit` 7 秒、`backend-integration` 62 秒、`frontend-unit` 19 秒、`frontend-integration` 75 秒
    notes: 手元で測った出力の間隔の最長（`backend-unit` 0.64 秒・`backend-integration` 6.14 秒・`frontend-unit` 1.84 秒・`frontend-integration` 7.48 秒）の 10 倍を秒に切り上げた値。大きさは 10 秒ごとに確認する
  - item: タイムアウト
    constraint: step「層の全件を回す」の `timeout-minutes` を、`backend-unit` 1 分、`backend-integration` 17 分、`frontend-unit` 3 分、`frontend-integration` 18 分にする。ジョブの `timeout-minutes` は指定せず、GitHub Actions の 1 ジョブの上限で止める
    notes: step の値は無出力の時間の外側の止め役で、手元の全件実行の実測（`backend-unit` 5.4 秒・`backend-integration` 100.5 秒・`frontend-unit` 14.4 秒・`frontend-integration` 105.5 秒）の 10 倍を分に切り上げた値。道具の導入の step は実測が無いため、外側の作業の上限（ジョブの上限）で止める
overall_flow: |-
  <!-- map -->

  ```mermaid
  flowchart TD
    s([workflow_dispatch で起動]) --> a
    subgraph test
      a[ブランチを取得する] -- 成功 --> n[Node.js を入れる]
      n -->|"成功・layer が backend-（if）"| u[uv を入れる]
      u -- 成功 --> p[Python の依存を入れる]
      n -->|"成功・layer が frontend-（if）"| m[npm の依存を入れる]
      m -->|"成功・layer が frontend-integration（if）"| b[Chromium を入れる]
      p -- 成功 --> c[層の全件を回す]
      m -->|"成功・layer が frontend-unit"| c
      b -- 成功 --> c
      a & n & u & p & m & b & c -->|"失敗（if: always()）"| d[ログを成果物に上げる]
      c -->|"成功（if: always()）"| d
    end
    d -->|"全ての step が成功"| ok([成功])
    d -->|"失敗した step がある"| ng([失敗])
  ```

  <!-- /map -->
flows:
  - name: 正常系
    summary: 単体テスト（バック）の層の全件が pass して成功で終わる
    setup:
      - name: Mock
        description: なし（本物の GitHub Actions で回す）
      - name: ブランチ
        description: develop と同じ中身のブランチ
        notes: '`layer: backend-unit`'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([layer: backend-unit で起動]) --> a[ブランチを取得する] --> n[Node.js を入れる] --> u[uv を入れる] --> p[Python の依存を入れる] --> c[層の全件を回す]
        c -- 全件 pass --> d[ログを成果物に上げる] --> e([成功])
      ```

      <!-- /map -->
    expected:
      - 実行の結論が `success`
      - step「npm の依存を入れる」「Chromium を入れる」の結論が `skipped`
      - 成果物 `test-log` があり、pytest の集計の行を持ち、skip の件数が手元の全件実行と同じ
  - name: 正常系（結合テスト（バック）の層）
    summary: 結合テスト（バック）の層の全件が pass して成功で終わる
    setup:
      - name: Mock
        description: なし（本物の GitHub Actions で回す）
      - name: ブランチ
        description: develop と同じ中身のブランチ
        notes: '`layer: backend-integration`'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([layer: backend-integration で起動]) --> a[ブランチを取得する] --> n[Node.js を入れる] --> u[uv を入れる] --> p[Python の依存を入れる] --> c[層の全件を回す]
        c -- 全件 pass --> d[ログを成果物に上げる] --> e([成功])
      ```

      <!-- /map -->
    expected:
      - 実行の結論が `success`
      - 成果物 `test-log` があり、pytest の集計の行を持ち、skip の件数が手元の全件実行と同じ
  - name: 正常系（単体テスト（フロント）の層）
    summary: 単体テスト（フロント）の層の全件が pass して成功で終わる
    setup:
      - name: Mock
        description: なし（本物の GitHub Actions で回す）
      - name: ブランチ
        description: develop と同じ中身のブランチ
        notes: '`layer: frontend-unit`'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([layer: frontend-unit で起動]) --> a[ブランチを取得する] --> n[Node.js を入れる] --> m[npm の依存を入れる] --> c[層の全件を回す]
        c -- 全件 pass --> d[ログを成果物に上げる] --> e([成功])
      ```

      <!-- /map -->
    expected:
      - 実行の結論が `success`
      - step「uv を入れる」「Python の依存を入れる」「Chromium を入れる」の結論が `skipped`
      - 成果物 `test-log` があり、vitest の集計の行を持ち、skip の件数が手元の全件実行と同じ
  - name: 正常系（結合テスト（フロント）の層）
    summary: 結合テスト（フロント）の層の全件が pass して成功で終わる
    setup:
      - name: Mock
        description: なし（本物の GitHub Actions で回す）
      - name: ブランチ
        description: develop と同じ中身のブランチ
        notes: '`layer: frontend-integration`'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([layer: frontend-integration で起動]) --> a[ブランチを取得する] --> n[Node.js を入れる] --> m[npm の依存を入れる] --> b[Chromium を入れる] --> c[層の全件を回す]
        c -- 全件 pass --> d[ログを成果物に上げる] --> e([成功])
      ```

      <!-- /map -->
    expected:
      - 実行の結論が `success`
      - 成果物 `test-log` があり、Playwright の集計の行を持ち、skip の件数が手元の全件実行と同じ
  - name: 正常系（結合テストのパスを指定）
    summary: 指定した結合テストだけを回し、成功で終わる
    setup:
      - name: Mock
        description: なし（本物の GitHub Actions で回す）
      - name: ブランチ
        description: develop と同じ中身のブランチ
        notes: '`layer: backend-integration`・`paths: tests/integration/plugin/`'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([layer: backend-integration・paths で起動]) --> a[ブランチを取得する] --> n[Node.js を入れる] --> u[uv を入れる] --> p[Python の依存を入れる] --> c[層の全件を回す]
        c -- pass --> d[ログを成果物に上げる] --> e([成功])
      ```

      <!-- /map -->
    expected:
      - 実行の結論が `success`
      - 成果物 `test-log` に `tests/integration/plugin/` のテストを回した出力があり、`tests/integration/server/` のテストが回されていない
  - name: 異常系（テストの fail・failure）
    summary: 層の全件に fail があり、ログを上げて失敗で終わる
    setup:
      - name: Mock
        description: なし（本物の GitHub Actions で回す）
      - name: ブランチ
        description: '`tests/unit/` に必ず fail するテスト 1 件を追加したブランチ'
        notes: '`layer: backend-unit`'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([layer: backend-unit で起動]) --> a[ブランチを取得する] --> n[Node.js を入れる] --> u[uv を入れる] --> p[Python の依存を入れる] --> c[層の全件を回す]
        c -->|"失敗（if: always()）"| d[ログを成果物に上げる] --> e([失敗])
      ```

      <!-- /map -->
    expected:
      - 実行の結論が `failure`
      - 成果物 `test-log` があり、fail したテストと pytest の集計の行を持つ
  - name: 異常系（無出力の時間の超過・failure）
    summary: 出力が上限の時間を超えて変わらず、テストを止めてログを上げ、失敗で終わる
    setup:
      - name: Mock
        description: なし（本物の GitHub Actions で回す）
      - name: ブランチ
        description: '`tests/unit/` に、何も出力せずに 60 秒待つテスト 1 件を追加したブランチ'
        notes: '`layer: backend-unit`（上限 7 秒）'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([layer: backend-unit で起動]) --> a[ブランチを取得する] --> n[Node.js を入れる] --> u[uv を入れる] --> p[Python の依存を入れる] --> c[層の全件を回す]
        c -->|"失敗（if: always()）"| d[ログを成果物に上げる] --> e([失敗])
      ```

      <!-- /map -->
    expected:
      - 実行の結論が `failure`
      - 成果物 `test-log` に、出力が上限の時間変わらなかったためテストを止めた旨がある
  - name: 異常系（道具の導入に失敗・failure）
    summary: 依存の導入に失敗し、層の全件を回さずにログを上げて失敗で終わる
    setup:
      - name: Mock
        description: なし（本物の GitHub Actions で回す）
      - name: ブランチ
        description: '`package-lock.json` を壊して `npm ci` が失敗するブランチ'
        notes: '`layer: frontend-unit`'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([layer: frontend-unit で起動]) --> a[ブランチを取得する] --> n[Node.js を入れる] --> m[npm の依存を入れる]
        m -->|"失敗（if: always()）"| d[ログを成果物に上げる] --> e([失敗])
      ```

      <!-- /map -->
    expected:
      - 実行の結論が `failure`
      - step「層の全件を回す」の結論が `skipped`
  - name: 異常系（結合テストのパスが層のフォルダの外・failure）
    summary: '`paths` に層の結合テストのフォルダの外のパスを指定し、テストを回さずに失敗で終わる'
    setup:
      - name: Mock
        description: なし（本物の GitHub Actions で回す）
      - name: ブランチ
        description: develop と同じ中身のブランチ
        notes: '`layer: backend-integration`・`paths: tests/integration/frontend/`。同じ結論になる例として、`layer: backend-unit`・`paths: tests/integration/`（結合テストでない層に `paths` を指定）と、`layer: frontend-integration`・`paths: tests/integration/frontend/../server/`（`..` で外へ出る）も起動する'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([layer: backend-integration・paths: tests/integration/frontend/ で起動]) --> a[ブランチを取得する] --> n[Node.js を入れる] --> u[uv を入れる] --> p[Python の依存を入れる] --> c[層の全件を回す]
        c -->|"失敗（if: always()）"| d[ログを成果物に上げる] --> e([失敗])
      ```

      <!-- /map -->
    expected:
      - 実行の結論が `failure`
      - 成果物 `test-log` に `paths` を弾いた理由があり、テストの集計の行が無い
notes:
  step ごとの中身: |-
    | step | 中身 |
    | --- | --- |
    | ブランチを取得する | `actions/checkout` で起動したブランチを取得する |
    | Node.js を入れる | `actions/setup-node` で Node.js 24 を入れる |
    | uv を入れる | `astral-sh/setup-uv` で uv を入れる |
    | Python の依存を入れる | `uv sync --frozen` で、`.python-version` の Python と依存を入れる |
    | npm の依存を入れる | `npm ci` で直下の依存を入れる |
    | Chromium を入れる | `npx playwright install --with-deps chromium` で Chromium と OS の依存を入れる |
    | 層の全件を回す | 層のコマンドを裏で起動して出力を `test.log` に記録し、`test.log` の大きさを 10 秒ごとに確認し、無出力の時間の上限を超えたらテストを止め、止めた旨を `test.log` に記録して失敗で終える。止めなかったときはコマンドの終了コードを step の成否にする |
    | ログを成果物に上げる | `if: always()` で `actions/upload-artifact` により `test.log` を成果物 `test-log` に上げる |
  タイムアウトの決め方: |-
    判定フローチャート『タイムアウトの決め方』では、自分の処理の完了を待つだけで、進み具合の出力（pytest の `-v`・vitest の `verbose`・Playwright の `list` のテスト 1 件ごとの行）があるため、無出力の時間で止まったことを検知する（制約の「無出力の時間」）。
    step の `timeout-minutes` は、無出力の時間の外側の止め役として、実測の 10 倍で決める。

    | 層 | 全件 | 出力の間隔の最長 | 件数 |
    | --- | --- | --- | --- |
    | `backend-unit` | 5.4 秒 | 0.64 秒 | 500 件 |
    | `backend-integration` | 100.5 秒 | 6.14 秒 | 89 件 |
    | `frontend-unit` | 14.4 秒 | 1.84 秒 | 166 件 |
    | `frontend-integration` | 105.5 秒 | 7.48 秒 | 258 件 |

    手元の WSL（8 コア）で、各層の全件実行に出力の詳細のオプションを付けて回し、行ごとの時刻から測った（2026-11-17）。
  対応テストファイルを持たない理由: |-
    workflow を起動して結論と成果物を確認するテストは、検証用のブランチを push するため、テスト実行方法の E2E テストの層で回す。
    E2E テストの層の実行コマンドが未確定のため、対応テストファイルを持たない。
    フローは、マージの前に作業ブランチへの `push` を一時的に追加して起動し、手で確認する。
