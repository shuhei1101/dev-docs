id: IF-155-1
title: "セッション開始のフック"
entry:
  kind: trigger
  value: Claude Code の SessionStart（startup・resume・clear・compact・fork）
flows:
  - name: 正常系（待ち受けている）
    summary: つながったサーバーには何も依頼せず、文脈を入れずに戻る
    setup:
      - name: Mock
        description: 受けた要求を記録する HTTP サーバーを一時のポートで立てる
        notes: '`DEV_DOCS_PORT` にそのポートを渡す'
      - name: 入力
        description: '`source: startup` と `session_id`・`cwd` の JSON を stdin に渡す'
        notes: '`resume`・`fork` も同じ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant H as セッション開始のフック
        participant S as dev-docs

        C->>H: stdin（session_id・cwd・source）
        H-->>S: ポートへの接続
        H-->>C: 出力なし（終了コード 0）
      ```
    expected:
      - stdout が空
      - Mock が HTTP の要求を受けていない
      - 終了コード 0、プロセスを起動していない
    test: test_normal_when_server_listening
  - name: 正常系（落ちている）
    summary: つながらなければ `dev-docs serve` を切り離して起動し、再接続を案内する
    setup:
      - name: Mock
        description: '`{clone}/.venv/bin/python` を、受けた引数をファイルに書いて終わるスクリプトに差し替える'
      - name: 端末の設定
        description: '`clone:` にその一時フォルダを持つ `settings.yaml` を `DEV_DOCS_CONFIG` で指す'
      - name: ポート
        description: 空いているポートを `DEV_DOCS_PORT` に渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant H as セッション開始のフック
        participant S as dev-docs serve

        C->>H: stdin
        H->>H: ポートにつながらない
        H-->>H: 端末の設定の clone を読む
        H->>S: 切り離して起動する
        H-->>C: additionalContext（再接続の案内）
      ```
    expected:
      - Mock が `-m dev_docs serve` を受けている
      - '`additionalContext` が `/mcp` の再接続の案内'
      - フックが起動したプロセスの終了を待たずに終了コード 0 で戻る
    test: test_normal_when_server_down
  - name: 正常系（XDG_CONFIG_HOME の下の端末の設定）
    summary: '`DEV_DOCS_CONFIG` が無ければ `XDG_CONFIG_HOME` の下の端末の設定の `clone` で起動する'
    setup:
      - name: Mock
        description: '`{clone}/.venv/bin/python` を、受けた引数をファイルに書いて終わるスクリプトに差し替える'
      - name: 端末の設定
        description: '`clone:` にその一時フォルダを持つ `settings.yaml` を `$XDG_CONFIG_HOME/dev-docs/` に置き、`DEV_DOCS_CONFIG` を外す'
        notes: 2 回目は `XDG_CONFIG_HOME` に相対パスを入れ、`HOME` の下の `.config/dev-docs/settings.yaml` に別の `clone:` を置く
      - name: ポート
        description: 空いているポートを `DEV_DOCS_PORT` に渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant H as セッション開始のフック
        participant S as dev-docs serve

        C->>H: stdin
        H->>H: ポートにつながらない
        H-->>H: $XDG_CONFIG_HOME/dev-docs/settings.yaml の clone を読む
        H->>S: 切り離して起動する
        H-->>C: additionalContext（再接続の案内）
      ```
    expected:
      - '`$XDG_CONFIG_HOME/dev-docs/settings.yaml` の `clone` の Mock が `-m dev_docs serve` を受けている'
      - '`XDG_CONFIG_HOME` が相対パスの 2 回目は、`HOME` の下の `.config/dev-docs/settings.yaml` の `clone` の Mock が受けている'
      - フックが終了コード 0 で戻る
    test: test_normal_when_xdg_config_home_set
  - name: 正常系（端末の設定が無い）
    summary: 起動できない理由と `/dev-docs:global-setup` の案内を文脈に入れ、終了コード 0 で戻る
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: '`DEV_DOCS_CONFIG` が無いファイルを指す'
      - name: ポート
        description: 空いているポート
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant H as セッション開始のフック

        C->>H: stdin
        H->>H: ポートにつながらず、端末の設定も無い
        H-->>C: additionalContext（理由と global-setup の案内）
      ```
    expected:
      - 終了コード 0
      - '`additionalContext` に端末の設定のパスと `/dev-docs:global-setup` がある'
      - プロセスを起動していない
    test: test_normal_when_terminal_config_missing
lead: ポートにつながらなければ `dev-docs serve` を切り離して起動し、再接続の案内か起動できない理由を文脈に入れる。つながったときは何も依頼せず、文脈を入れずに戻る。入力は stdin の JSON と環境変数。
identifier: hooks/session_start.py
permissions: 利用者の権限で動く
idempotent: true
side_effects: サーバーが待ち受けていなければ `dev-docs serve` のプロセスを 1 つ起動する
callers:
  - SC-155-10#scenarios[正常シナリオ（SessionStart で起動する）]
  - SC-155-10#scenarios[正常シナリオ（待ち受けているサーバーがあるときは文脈を注入しない）]
  - SC-155-10#scenarios[異常シナリオ（SessionStart で起動できない）]
  - SC-155-10#scenarios[正常シナリオ（SessionStart で XDG_CONFIG_HOME の下の端末の設定から起動する）]
exclusivity: 同時に開いた複数のセッションがどれも起動してもよい。後から起動した `dev-docs serve` はポートが使用中（終了コード 3）で止まり、待ち受けるのは 1 つだけ
request:
  - name: session_id
    type: str
    required: true
    location: argument
    description: Claude Code のセッション ID
    notes: stdin の JSON
  - name: cwd
    type: str
    required: true
    location: argument
    description: セッションの作業場所
    notes: stdin の JSON
  - name: source
    type: Literal['startup', 'resume', 'clear', 'compact', 'fork']
    required: true
    location: argument
    description: セッションが始まった理由。どの値でも同じ流れ
    notes: stdin の JSON
  - name: DEV_DOCS_PORT
    type: int
    required: false
    default: '`8781`'
    description: サーバーのポート
    notes: 環境変数
  - name: DEV_DOCS_CONFIG
    type: str
    required: false
    default: '`${XDG_CONFIG_HOME:-~/.config}/dev-docs/settings.yaml`'
    description: 端末の設定のパス
    notes: 環境変数
  - name: XDG_CONFIG_HOME
    type: str
    required: false
    default: '`~/.config`'
    description: '`DEV_DOCS_CONFIG` が無いときに端末の設定を探すフォルダの親'
    notes: 環境変数。空の文字列か相対パスは未設定として扱う
request_example: |-
  ```json
  {"session_id": "8f1c...", "cwd": "/home/u/repo/sample/.claude/worktrees/x", "source": "startup", "hook_event_name": "SessionStart"}
  ```
response:
  - name: hookSpecificOutput.hookEventName
    type: Literal['SessionStart']
    description: 常に `SessionStart`
  - name: hookSpecificOutput.additionalContext
    type: str
    description: 起動したときは `/mcp` の再接続の案内。起動できないときは理由と次の手。つながったときは出力しない
  - name: 終了コード
    type: int
    description: 常に 0
response_example: |-
  ```json
  {"hookSpecificOutput": {"hookEventName": "SessionStart", "additionalContext": "dev-docs を起動しました。このセッションで管理の MCP を使用するには /mcp で dev-docs に再接続してください。"}}
  ```
exceptions:
  - name: なし（正常終了）
    condition: 文脈を入れずに戻った、または起動して再接続を案内した
  - name: なし（起動できない）
    condition: 端末の設定が無い・`clone` が無い・`{clone}/.venv/bin/python` が無い
    notes: 終了コード 0 で、理由と `/dev-docs:global-setup` の案内を文脈に入れる
constraints:
  - item: 言語
    constraint: Python 3.14 の標準ライブラリだけ。`uv` を前提にしない
  - item: 接続の確かめ
    constraint: '`127.0.0.1:${DEV_DOCS_PORT}` への TCP 接続を 0.5 秒で打ち切る'
  - item: 端末の設定のパス
    constraint: '`DEV_DOCS_CONFIG`、無ければ `${XDG_CONFIG_HOME:-~/.config}/dev-docs/settings.yaml`。`XDG_CONFIG_HOME` が空の文字列か相対パスなら未設定として扱う'
    notes: docs/interface/開発ドキュメントサーバー/起動 の `端末の設定と状態の置き場` と同じ規則。フックはサーバーのパッケージを import しないため、同じ規則を持つ
  - item: 端末の設定の読み方
    constraint: トップレベルの `clone:` の行だけを読む（`~` を展開し、引用符を外す）
    notes: 標準ライブラリに YAML のパーサーが無いため
  - item: 起動
    constraint: '`{clone}/.venv/bin/python -m dev_docs serve` を `start_new_session=True`・入出力を `DEVNULL` で起動し、待たずに戻る'
    notes: 'PR #9 の PoC のとおり'
  - item: タイムアウト
    constraint: '`hooks.json` の `timeout` は 2 秒'
    notes: 落ちているときの流れ（接続の失敗 → `Popen` → 出力）のフック全体を、`/mnt/c` の上のフックのファイルで 5 回測って 0.53〜0.70 秒（2026-11-12、Python 3.12）。最大の 0.70 秒に 50% を乗せて切り上げた値（規約『資源の値の決め方』の入れ子の待ち）。記録の削除の依頼（3 秒）は project-index のフックへ移した
  - item: 失敗の扱い
    constraint: どの失敗でも終了コード 0 で戻り、セッションを止めない
test_file: tests/integration/plugin/test_session_start.py
