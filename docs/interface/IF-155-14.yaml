id: IF-155-14
title: "状態の取得"
entry:
  kind: mcp_tool
  value: status
flows:
  - name: 正常系
    summary: project-index から取得した配信元ごとの状態を返す
    setup:
      - name: Mock
        description: project-index の読み取り API のモック（shuhei1101/project-index の develop の `81f0e70` と shuhei1101/project-index#46 の入出力で、sample を配信中、broken を配信していない配信元として返す）。dev-docs のアプリをテストのクライアントで呼ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as status
        participant PI as project-index（モック）

        C->>T: 引数なし
        T->>PI: 配信元の一覧と状態を取得する
        T-->>C: アドレス・バージョン・project-index の接続・配信元の表
      ```
    expected:
      - '`version` が配布のメタデータのバージョンと同じ'
      - '`project_index.reachable` が `true` で、`project_index.address` がモックのアドレス'
      - sample が `serving`、broken が `not_served` で、`errors` にモックが返した理由がある
      - '`format: json` では同じ中身を structuredContent と text に入れる'
    test: test_normal
  - name: 正常系（project-index につながらない）
    summary: project-index につながらなくても答え、つながらなかった理由を返す
    setup:
      - name: Mock
        description: 接続を断る project-index の読み取り API のモック
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as status
        participant PI as project-index（モック）

        C->>T: format: json
        T->>PI: 配信元の一覧と状態を取得する（接続を断られる）
        T-->>C: project_index.reachable: false・sources: []
      ```
    expected:
      - '`project_index.reachable` が `false` で、`project_index.error` に理由がある'
      - '`sources` が空で、markdown に project-index につながらないため配信元を取得できないことが出る'
    test: test_normal_when_project_index_unreachable
  - name: 正常系（前のバージョンから残った sources がある）
    summary: 端末の設定に残った `sources` の行の ID を返す
    setup:
      - name: Mock
        description: 正常系と同じ project-index のモック
      - name: 端末の設定
        description: '`sources` に extra の 1 行が残った `settings.yaml`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant T as status

        C->>T: format: json
        T-->>C: leftover_sources: [extra]
      ```
    expected:
      - '`leftover_sources` が `["extra"]`'
      - markdown に、extra を project-index で追加する案内が出る
    test: test_normal_when_leftover_sources
lead: 待ち受けのアドレス・dev-docs のバージョン・端末の設定・project-index への接続と、project-index から取得した配信元ごとの状態を返す。
identifier: status
permissions: なし（`127.0.0.1` でだけ待ち受ける）
idempotent: true
side_effects: なし
callers:
  - SC-155-3#scenarios[正常シナリオ]
exclusivity: '読み取りだけで排他しない（`readOnlyHint: true`）'
request:
  - name: format
    type: Literal['markdown', 'json']
    required: false
    default: '`markdown`'
    location: argument
    description: 返却する形式
request_example: |-
  ```json
  {}
  ```
response:
  - name: address
    type: str
    description: 待ち受けている URL（`http://127.0.0.1:8781/`）
  - name: version
    type: str
    description: 動いている dev-docs のバージョン
  - name: pid
    type: int
    description: サーバーのプロセス ID
  - name: terminal.file
    type: str
    description: 読んだ端末の設定のパス
  - name: terminal.version_state
    type: Literal['current', 'old', 'newer']
    description: 端末の設定の `version` と dev-docs が読めるバージョンの比較
  - name: project_index.address
    type: str
    description: 端末の設定の `project_index`
  - name: project_index.reachable
    type: bool
    description: project-index の読み取り API が応答したか
  - name: project_index.error
    type: str | None
    description: つながらなかった理由
    notes: '`reachable` が `false` のとき'
  - name: sources[].id
    type: str
    description: 配信元の ID
  - name: sources[].status
    type: Literal['serving', 'not_served', 'disabled']
    description: project-index が返した配信元の状態
  - name: sources[].errors[]
    type: str
    description: 'project-index が返した配信しない理由（`{キーのパス}: {理由}`）'
    notes: '`not_served` のとき'
  - name: leftover_sources
    type: list[str]
    description: 端末の設定に前のバージョンから残った `sources` の行の ID
    notes: 無ければ空の並び
response_example: |-
  ```markdown
  http://127.0.0.1:8781/ dev-docs 0.3.0（pid 4242）
  端末の設定: /home/u/.config/dev-docs/settings.yaml（current）
  project-index: http://127.0.0.1:8786（つながっている）
  | source | 状態 |
  | --- | --- |
  | sample | serving |
  | broken | not_served（documents[0].paths: 必須のキーが無い） |
  ```
exceptions:
  - name: なし（正常終了）
    condition: 返せた（project-index につながらないときも返す）
constraints:
  - item: 注釈
    constraint: '`readOnlyHint: true`'
  - item: 配信元の状態の取得
    constraint: 呼ばれるたびに project-index の読み取り API から取得し、dev-docs の中に控えない
  - item: 権限
    constraint: 作業場所で絞らず、全ての配信元を返す
  - item: タイムアウト
    constraint: project-index への問い合わせを制限時間で打ち切り、打ち切ったら `reachable` を `false` にして返す
    decided_by: NFR-155-1#requirements[project-index への問い合わせの制限時間]
test_file: tests/integration/server/test_get_status.py
