id: IF-155-19
title: "端末の設定の保存"
entry:
  kind: endpoint
  value: PUT `/_api/settings/sources`
flows:
  - name: 正常系
    summary: 配信元を追加して保存し、再起動せずに配信する
    setup:
      - name: Mock
        description: project-index の端末の設定の API のモック（shuhei1101/project-index#14 の入出力で、setup の端末の設定の行と配信元の状態を返し、保存を受ける）。dev-docs のアプリを HTTP のテストのクライアントで呼ぶ
      - name: 端末の設定
        description: モックの端末の設定の `sources` に sample の 1 行
      - name: 追加する配信元
        description: 文書の種類を 1 つと `project-index.yaml` を持つ git リポジトリ
        notes: id `extra`
      - name: 入力
        description: 画面と同じ `Origin` で、sample と extra の 2 行
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /_api/settings/sources
        participant PI as project-index（モック）

        C->>E: sources: sample, extra
        E->>E: オリジンを確かめる
        E->>PI: 端末の設定の配信元の保存
        PI-->>E: 保存した行と、読み直した後の配信元ごとの状態
        E-->>C: 200 配信元ごとの状態
      ```
    expected:
      - 200 で、sample と extra が `serving`
      - モックが受けた保存の行が sample と extra の 2 行で、sample の行の値は送信したとおり
      - 文字列で送った extra の `config` が、モックが受けた行では要素 1 つの配列になる
      - 再起動せずに `/_api/sources/extra/docs` が 200 を返す
    test: test_normal
  - name: 正常系（配信を止める）
    summary: '`enabled: false` で保存し、配信を止める'
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: モックの端末の設定の `sources` に sample と extra の 2 行
      - name: 入力
        description: 'extra の行を `enabled: false` にした 2 行'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /_api/settings/sources
        participant PI as project-index（モック）

        C->>E: sources: sample, extra（enabled: false）
        E->>PI: 端末の設定の配信元の保存
        PI-->>E: 保存した行と、読み直した後の配信元ごとの状態
        E-->>C: 200（extra は disabled）
      ```
    expected:
      - extra が `disabled`
      - モックが受けた extra の行の `enabled` が `false`
      - '`/_api/sources/extra/docs` が 404、`/_api/sources/sample/docs` が 200 を返す'
    test: test_normal_when_source_disabled
  - name: 正常系（配信元を削除する）
    summary: 行を除いて保存し、配信元のフォルダは残す
    setup:
      - name: Mock
        description: なし
      - name: 端末の設定
        description: モックの端末の設定の `sources` に sample と extra の 2 行
      - name: 入力
        description: sample の 1 行だけ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /_api/settings/sources
        participant PI as project-index（モック）

        C->>E: sources: sample
        E->>PI: 端末の設定の配信元の保存（extra の行を除く）
        PI-->>E: 保存した行と、読み直した後の配信元ごとの状態
        E-->>C: 200（sample だけ）
      ```
    expected:
      - モックが受けた保存の行が sample だけで、sample の行の値は変わらない
      - extra のフォルダのファイルは変わらない
      - '`/_api/sources/extra/docs` が 404 を返す'
    test: test_normal_when_source_deleted
  - name: 正常系（追加した配信元が検証に通らない）
    summary: 端末の設定は保存し、読み直しの検証で配信元を外す
    setup:
      - name: Mock
        description: なし
      - name: 検証に失敗する配信元
        description: '`documents[0]` に必須のキー `paths` が無い配信元'
        notes: id `broken`
      - name: 入力
        description: sample と broken の 2 行
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /_api/settings/sources
        participant PI as project-index（モック）

        C->>E: sources: sample, broken
        E->>PI: 端末の設定の配信元の保存
        PI-->>E: 保存した行と、broken を not_served にした配信元ごとの状態
        E-->>C: 200（broken は not_served）
      ```
    expected:
      - 200 で、broken が `not_served`、`errors` に `documents[0].paths` がある
      - モックが受けた保存の行に broken の行がある
      - '`/_api/sources/broken/docs` が 404、`/_api/sources/sample/docs` が 200 を返す'
    test: test_normal_when_added_source_invalid
  - name: 異常系（別のオリジン・403）
    summary: 画面と別のオリジンからの保存を断る
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: '`Origin: http://127.0.0.1:9999` で、スキーマに通る `sources`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /_api/settings/sources

        C->>E: Origin: 別のオリジン
        E-->>C: 403
      ```
    expected:
      - 403 を返す
      - モックが保存を受けず、`/_api/sources/sample/docs` は 200 を返す
      - '`Origin` が無く `Sec-Fetch-Site: cross-site` の要求も 403'
    test: test_error_when_cross_origin
  - name: 異常系（本文の型の誤り・400）
    summary: 型の合わない本文を project-index へ送らずに断り、違反を全て返す
    setup:
      - name: Mock
        description: なし
      - name: 入力
        description: 2 行目の `config` が無く、`enabled` が真偽値に変換されない文字列 `maybe`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /_api/settings/sources

        C->>E: sources: sample, 型の合わない行
        E->>E: 要求の本文を型で検証して失敗する
        E-->>C: 400 problem+json（違反したキーと理由）
      ```
    expected:
      - 400 で、`errors` に `sources[1].config` と `sources[1].enabled` がそれぞれの理由つきである
      - モックが保存を受けず、`/_api/sources/sample/docs` は 200 を返す
    test: test_error_when_body_invalid
  - name: 異常系（project-index が保存を断る・422・502）
    summary: project-index が 422 を返したら違反をそのまま 422 で返し、それ以外の失敗は 502 で返す
    setup:
      - name: Mock
        description: 1 回目は `errors[]` つきの 422、2 回目は 500 を返す project-index の端末の設定の API のモック
      - name: 入力
        description: 画面と同じ `Origin` で、dev-docs のスキーマに通る sample と extra の 2 行
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant E as PUT /_api/settings/sources
        participant PI as project-index（モック）

        C->>E: sources: sample, extra
        E->>PI: 端末の設定の配信元の保存
        PI-->>E: 422（errors[]）
        E-->>C: 422（project-index の errors[]）
        C->>E: sources: sample, extra
        E->>PI: 端末の設定の配信元の保存
        PI-->>E: 500
        E-->>C: 502（project-index の応答の要約）
      ```
    expected:
      - 1 回目が 422 で、`errors` がモックの返した `errors[]` と同じ
      - 2 回目が 502 で、モックの応答のステータス 500 と要約がある
    test: test_error_when_project_index_rejects
lead: '#17 の設定画面が配信元の追加・編集・削除の後の `sources[]` を丸ごと送信する。スキーマに通ったときだけ project-index の端末の設定の API へ保存を依頼し、読み直した後の配信元の状態を返す。'
identifier: put_settings_sources
permissions: 画面と同じオリジンからの要求だけ
idempotent: true
side_effects: project-index に端末の設定の `sources` の保存を依頼する。dev-docs は端末の設定と配信元のフォルダのファイルを書き換えない
exclusivity: dev-docs は排他しない。保存と読み直しの排他は project-index が持つ
request:
  - name: sources
    type: list[Source]
    required: true
    location: body
    description: 保存する `sources[]` の全行。削除した行は含めない
  - name: sources[].id
    type: str
    required: false
    default: 配信元の設定の `name`
    location: body
    description: 配信元の ID
    constraints: 英小文字・数字・`-` だけ。行の間で重複しない
  - name: sources[].config
    type: str | list[str]
    required: true
    location: body
    description: 配信元の設定の YAML の絶対パス。文字列でも、project-index へは要素の数によらず配列で送る
  - name: sources[].enabled
    type: bool
    required: false
    default: '`true`'
    location: body
    description: 配信するか
  - name: sources[].scope.read
    type: list[str]
    required: false
    default: '`[]`'
    location: body
    description: この配信元を読める作業場所の glob
    constraints: 空の文字列を含めない
  - name: sources[].scope.write
    type: list[str]
    required: false
    default: 配信元のフォルダだけ
    location: body
    description: この配信元を読み書きできる作業場所の glob
  - name: Origin
    type: str
    required: false
    default: なし（`Sec-Fetch-Site` で判定する）
    location: header
    description: 要求元のオリジン
  - name: sources[].outside_read
    type: bool
    required: false
    default: '`true`'
    location: body
    description: '`scope` に当たらない作業場所からも `outside_scope: true` で作業範囲の外（参考）として読めるか'
    notes: '`false` の配信元は `scope` の外から一切読めない'
    status: planned
request_example: |-
  ```json
  {"sources": [
    {"id": "sample", "config": "/path/to/sample/project-index.yaml", "scope": {"read": ["/path/to/sample/**"]}},
    {"id": "extra", "config": "/path/to/extra/project-index.yaml", "scope": {"read": ["/path/to/extra/**"]}}
  ]}
  ```
response:
  - name: sources[].id
    type: str
    description: 配信元の ID
  - name: sources[].status
    type: Literal['serving', 'not_served', 'disabled']
    description: 再読み込みした後の状態
  - name: sources[].errors
    type: 'list[{path: str, reason: str}]'
    description: 検証で除外した理由
    notes: '`not_served` のときだけ'
response_example: |-
  ```json
  {"sources": [
    {"id": "sample", "status": "serving"},
    {"id": "extra", "status": "serving"}
  ]}
  ```
response_notes: 配信元の設定が検証に通らない配信元も、端末の設定がスキーマに通れば保存し、`not_served` として返す。
status_codes:
  - code: '503'
    condition: project-index につながらない
    notes: 'つながらなかった project-index のアドレスと理由（`projectIndex.address`・`projectIndex.reason`）。`detail` は `project-index（{address}）に接続できませんでした。{reason}`'
  - code: '200'
    condition: 保存して配信元を読み直した（読み直しで外した配信元があっても 200）
  - code: '403'
    condition: 画面と別のオリジンからの要求
  - code: '400'
    condition: 要求の本文の型が合わない
    notes: '`errors[]` に違反したキーのパスと理由を全て並べる'
  - code: '422'
    condition: project-index が 422 を返した（`id` の形・`scope` の空の文字列など、行の値の検証は project-index が行う）
    notes: project-index の `errors[]` をそのまま返す
  - code: '502'
    condition: project-index が 200・422 以外を返した
    notes: project-index の応答のステータスと要約
error_format: RFC 9457 の `application/problem+json`。拡張メンバーは camelCase（`nextSteps`・`errors[]`）。検証の違反は `errors[]` に `{path, reason}` で並べる（`path` は `sources[1].id` の形）
constraints:
  - item: オリジンの確認
    constraint: '`Origin` が画面のオリジンと同じか、`Origin` が無く `Sec-Fetch-Site` が `same-origin` のときだけ受ける'
  - item: 保存の依頼先
    constraint: 保存と読み直しは project-index の端末の設定の API が行う。dev-docs は送信された行を project-index へ送り、200 のときは返った配信元の状態をそのまま返す。422 は project-index の `errors[]` を 422 で、それ以外の 200 以外は 502 で返す
  - item: project-index につながらないとき
    constraint: 503 と、つながらなかった project-index のアドレス・理由を返す。端末の設定は変わらない
  - item: 認可
    constraint: 制限なし（`127.0.0.1` でだけ待ち受ける）
  - item: タイムアウト
    constraint: project-index への問い合わせを制限時間で打ち切り、打ち切ったら project-index につながらないときと同じ 503 と理由を返す
    decided_by: NFR-155-1#requirements[project-index への問い合わせの制限時間]
  - item: JSON のキー
    constraint: リクエストの本文とレスポンスのキーは camelCase
  - item: operationId
    constraint: '`{tag}-{関数名}` の `settings-put_settings_sources`'
test_file: tests/integration/server/test_put_settings_sources.py
