id: MOD-155-40
title: 画面 / 設定画面 / source-delete-dialog.tsx
lead: 削除の確認のダイアログ。
test_files:
  - tests/unit/frontend/src/features/settings/settings/components/source-delete-dialog.test.tsx
components:
  - name: SourceDeleteDialog
    title: 削除の確認のダイアログ
    kind: コンポーネント
    container: features/settings/settings/components/source-delete-dialog.tsx
    usecase: 配信元を設定する
    role: 部品
    summary: shadcn/ui の `AlertDialog` で削除の確認を出し、確定で `removeSource` の結果を保存する
    props:
      - name: open
        type: boolean
        required: true
        description: 開いているか
      - name: onOpenChange
        type: '(open: boolean) => void'
        required: true
        description: 開閉（閉じたら削除ボタンへフォーカスを戻す）
      - name: sources
        type: SettingsSource[]
        required: true
        description: 端末の設定の取得の `sources[]`
      - name: index
        type: number
        required: true
        description: 開いたときの削除する行の位置
      - name: version
        type: string | undefined
        required: false
        description: 端末の設定の取得の `version`。保存の `expectedVersion` にする
    description: '初期フォーカスはキャンセル。開いたときの行を `sourceKey` で指す値・名前・フォルダを持ち、削除のたびに今の `sources` から `findSource` で位置を引いて `removeSource` し、`version` を添えて保存する。位置が無ければ画面設計の『削除する配信元が削除されたときの表示』を出して削除ボタンを無効にする。409 は『削除の他の変更の表示』を出して全ての問い合わせを読み直す。それ以外の保存の失敗は `handleAppError(error, {message: "端末の設定を保存できませんでした。"})` で、ダイアログは開いたまま'
    unit_tests:
      - name: test_source_delete_dialog
        case: 正常
        summary: 削除
        condition: 2 行の 1 行目で `削除`
        mock: MSW の端末の設定の保存のハンドラ（200）
        expected: 送った本文が 2 行目だけ、ダイアログが閉じる
      - name: test_source_delete_dialog_when_failed
        case: 異常
        summary: 保存の失敗
        condition: '`削除`'
        mock: MSW のハンドラ（500）・sonner の `toast`
        expected: 通知が `端末の設定を保存できませんでした。`、ダイアログは開いたまま
      - name: test_source_delete_dialog_when_conflict
        case: 異常
        summary: 他の書き換えが入っている
        condition: PUT が 409 を返す
        mock: MSW
        expected: 「他の変更があったため削除できませんでした」が出て、ダイアログが開いたまま
      - name: test_source_delete_dialog_when_gone
        case: 異常
        summary: 削除する配信元が削除された
        condition: '`b` を開いた後に `sources` を `a` だけにする'
        mock: MSW
        expected: 「配信元が削除されたため削除できませんでした」が出て、削除ボタンが無効。見出しは `b` のまま
