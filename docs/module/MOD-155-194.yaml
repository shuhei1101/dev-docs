          +エラーの名前: str
          +本文: str
          +次の手: list
        }
        class YAMLの読み込み {
          <<function>>
        }
        class 往復編集の読み込み {
          <<function>>
        }
        click 開発ドキュメントサーバーのエラー href "./MOD-155-184.py.yaml#開発ドキュメントサーバーのエラー"
        click YAMLの読み込み href "./MOD-155-190.py.yaml#YAMLの読み込み"
        click YAMLを読めない href "./MOD-155-190.py.yaml#YAMLを読めない"
        click 往復編集の読み込み href "./MOD-155-190.py.yaml#往復編集の読み込み"
notes:
  例外の配置先: どの分類の関数も、呼び出し側へ返却する失敗は `shared/errors.py` の子クラスで送信する。YAML を読み込めないことは YAML の読み書きの例外で送信し、呼び出し側が `Violation` に変える。
