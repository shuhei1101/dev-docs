id: MOD-155-10
title: 画面 / 文書の画面 / doc-body.tsx
lead: mdmark で描く文書の本文を受け持ち、文書の画面の doc-body.tsx を修正するときに参照する。
test_files:
  - tests/unit/frontend/src/features/docs/doc-view/components/doc-body.test.tsx
components:
  - name: DocBody
    title: 本文
    kind: コンポーネント
    container: features/docs/doc-view/components/doc-body.tsx
    usecase: 文書を参照する
    role: 部品
    summary: 最初の見出し 1 を除いた Markdown を `useMdmark` で描く（右側の目次は mdmark が描く）
    props:
      - name: document
        type: DocumentResponse
        required: true
        description: 文書の取得の応答
      - name: baseMarkdown
        type: '{markdown: string; tableKeys: string[]} | null'
        required: false
        description: 比較元の文書の本文と表のキー（`{markdown, tableKeys}`。差分の強調）。`null`・省略は強調しない
      - name: onCommentSaved
        type: () => void
        required: true
        description: コメントを保存したとき（パネルを開く）
      - name: locating
        type: DocComment | null
        required: true
        description: コメントのパネルで場所を選ばれたコメント。`docId` が同じ文書を描き終えたら、`reloadComments()` の後に `focusComment(id)` を呼び、`onLocated` を呼ぶ
      - name: onLocated
        type: () => void
        required: true
        description: '`locating` のコメントへ移ったとき'
    description: |-
      - 列の初期の非表示は、`columns` のその表のキーの列を列の表示・非表示の機能を持つ表のマーカーへ書き込んだ Markdown を指定する（`applyHiddenColumns`。表のキーは `findTables` で本文の表と対にする）
      - 比較元は、本文と同じく最初の見出し 1 を除き、比較元の `tableKeys` で `columns` の隠す列を書き込んでから `baseMarkdown` に指定する
      - 列の出し入れは `useColumnPersistence` が返却する関数を `onColumnsChange` に指定して保存する
      - コメントの配置先のこの文書のコメント（`id`・`body` の並び）が変わったら、描き終えた本文で `reloadComments()` を呼んでマーカーを再描画する（パネルの修正・削除と、mdmark の追加・修正・削除のどれも同じ経路）
      - 本文のクリックを取得し、同じ配信元の文書への相対リンクは、`document.bodyPath` があればそれを、無ければ `document.path` を基準に解決して `navigate`（`rev` を保つ）、外の URL は `target="_blank" rel="noopener"` で開く
      - 描き終えたら、ルーターが持つ本文の領域（`data-scroll-restoration-id="doc-body"`）の位置（`useElementScrollRestoration`）が今の位置より下なら、その位置へもう一度戻す。ルーターは描いた直後に戻すが、本文は mdmark が描き終えるまで高さが無いので、戻る・進むで位置が 0 になる。文書ごとに 1 回だけ戻す
      - mdmark の `commentStore` はコメントのストアへつなぐ（`docId` は `{source}@{ref}:{path}`。`update`・`remove` はストアの `update(id, body)`・`remove(id)`）
    unit_tests:
      - name: test_doc_body
        case: 正常
        summary: 見出し 1 と列の初期の非表示
        condition: '`# A` で始まり `+columns` の表を 1 つ持ち、`columns` にその表のキーで `["備考"]`'
        mock: mdmark（`mount` を記録する偽物）
        expected: '`mount` に渡る `markdown` が `# A` を含まず、表に `hide=備考`'
      - name: test_doc_body_when_internal_link
        case: 正常
        summary: 同じ配信元のリンクを画面の中で開く
        condition: 本文の `./b.md` を押す（`rev` が `v1`）
        mock: mdmark（本文にリンクを描く偽物）
        expected: ルーターの位置が `/s/b.md?rev=v1` になり、ページは再読み込みしない
      - name: test_doc_body_when_body_path
        case: 正常
        summary: 管理用の YAML の行の文書の相対リンクを本文のファイルのパスで解決する
        condition: '`path` が `notes/files/a`・`bodyPath` が `notes/a.md` の文書で、本文の `./b.md` を押す（`rev` が `v1`）'
        mock: mdmark（本文にリンクを描く偽物）
        expected: ルーターの位置が `/s/notes/b.md?rev=v1` になり、ページは再読み込みしない
      - name: test_doc_body_when_base
        case: 正常
        summary: 比較元を mdmark に指定する
        condition: '`baseMarkdown` に `# A` で始まり `+columns` の表を持つ本文と表のキー、`columns` にその表のキーで `["備考"]`'
        mock: mdmark（`mount` を記録する偽物）
        expected: '`mount` の `baseMarkdown` が `# A` を含まず、表に `hide=備考`'
      - name: test_doc_body_when_comments_changed
        case: 正常
        summary: コメントが変わるとマーカーを再描画する
        condition: 描き終えた後に、ストアのこの文書のコメントを 1 件削除する
        mock: mdmark（`reloadComments` を記録する偽物）
        expected: '`reloadComments` が 1 回'
      - name: test_doc_body_when_locating
        case: 正常
        summary: 場所を選ばれたコメントへ移る
        condition: 描き終えた後に、同じ `docId` のコメントを `locating` に指定する
        mock: mdmark（`reloadComments`・`focusComment` を記録する偽物）
        expected: '`reloadComments` の後に `focusComment` がそのコメントの `id` で 1 回、`onLocated` が 1 回'
      - name: test_doc_body_when_scroll_restored
        case: 正常
        summary: 描き終えた後に本文の位置をもう一度戻す
        condition: ルーターが本文の領域の位置 400 を持ち、本文を描き終える
        mock: mdmark（`mount` を記録する偽物）・`useElementScrollRestoration`（400 を返却する偽物）
        expected: 本文の領域の `scrollTop` が 400
refs:
