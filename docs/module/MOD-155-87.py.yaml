id: MOD-155-87
title: 開発ドキュメントサーバー / 管理の操作 / types.py
lead: 管理の MCP の `status` の要求と結果の型。
data_models:
  - name: SourceState
    title: 配信元の状態の行
    container: features/admin/types.py
    usecase: 状態の取得
    role: DTO
    summary: '`status` が返す配信元 1 つの状態（project-index の状態を写したもの）'
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: id
        title: 配信元の ID
        type: str
        description: 'project-index が返した配信元の ID'
      - name: status
        title: 状態
        type: SourceStatusKind
        description: project-index が返した状態（配信中・検証で外した・無効）
      - name: errors
        title: 配信しない理由
        type: list[str]
        description: '`{キーのパス}: {理由}`。`not_served` のときだけ'
  - name: TerminalState
    title: 端末の設定の状態
    container: features/admin/types.py
    usecase: 状態の取得
    role: DTO
    summary: 読んだ端末の設定のパスとバージョンの新旧
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: file
        title: 設定のファイル
        type: str
        description: '`TerminalConfig.file`'
      - name: version_state
        title: バージョンの新旧
        type: VersionState
        description: '`TerminalConfig.version` と `SETTINGS_VERSION` の比較'
  - name: ProjectIndexState
    title: project-index への接続
    container: features/admin/types.py
    usecase: 状態の取得
    role: DTO
    summary: '`status` の `project_index`'
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: address
        title: 接続先
        type: str
        description: 端末の設定の `project_index`
      - name: reachable
        title: 応答したか
        type: bool
        description: project-index の配信元の状態の一覧が応答したか
      - name: error
        title: つながらなかった理由
        type: str | None
        description: '`reachable` が `False` のときの `ProjectIndexUnreachableError.reason` か、想定しない応答の要約'
  - name: ServerStatus
    title: サーバーの状態
    container: features/admin/types.py
    usecase: 状態の取得
    role: DTO
    summary: '`status` の結果'
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: address
        title: 待ち受けの URL
        type: str
        description: '`http://{bind}:{port}/`'
      - name: version
        title: dev-docs のバージョン
        type: str
        description: 配布のメタデータのバージョン
      - name: pid
        title: プロセス ID
        type: int
        description: '`os.getpid()`'
      - name: terminal
        title: 端末の設定
        type: TerminalState
        description: 端末の設定の状態
      - name: project_index
        title: project-index への接続
        type: ProjectIndexState
        description: 接続先・応答したか・理由
      - name: sources
        title: 配信元
        type: list[SourceState]
        description: 'project-index が返した順。つながらないときは空'
      - name: leftover_sources
        title: 前のバージョンから残った配信元
        type: list[str]
        description: 端末の設定の `leftover_sources`
  - name: FormatRequest
    title: 返却する形式の指定
    container: features/admin/types.py
    usecase: 共通
    role: DTO
    summary: '`status`・`reload` の引数'
    description: '`pydantic.BaseModel`（`extra="forbid"`）。'
    properties:
      - name: format
        title: 返却する形式
        type: Literal['markdown', 'json']
        default: "'markdown'"
        description: '`markdown` は `render_status`・`render_reload` の文、`json` は結果の辞書'
enums:
  - name: VersionState
    title: 設定のバージョンの新旧
    container: features/admin/types.py
    usecase: 共通
    summary: 設定の `version` と dev-docs が読めるバージョンの比較
    description: '`Literal` の型エイリアス。'
    values:
      - value: current
        title: 同じ
        description: dev-docs が読めるバージョンと同じ
      - value: old
        title: 古い
        description: 移し替えで上げられる
      - value: newer
        title: 新しい
        description: dev-docs の更新が要る
