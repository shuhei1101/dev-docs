id: MOD-155-149
title: 開発ドキュメントサーバー / 端末の設定 / types.py
lead: 端末の設定と、画面の `sources[]` の要求と結果の型。
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        端末の設定の読み込み ..> 端末の設定 : 返す
        class 端末の設定の読み込み {
          <<function>>
        }
        class 端末の設定 {
          +project-indexの接続先: str
          +状態の置き場所: Path
        }
        click 端末の設定の読み込み href "./MOD-155-146.py.yaml#端末の設定の読み込み"
data_models:
  - name: SourceScope
    title: 配信元の権限の範囲
    container: features/settings/types.py
    usecase: 端末の設定
    role: DTO
    summary: '`sources[].scope` の `read`・`write`'
    description: '`pydantic.BaseModel`（`extra="forbid"`）。'
    properties:
      - name: read
        title: 読める作業場所
        type: list[str]
        access: 公開
        default: '[]'
        description: この配信元を読める作業場所の glob
      - name: write
        title: 読み書きできる作業場所
        type: list[str] | None
        access: 公開
        default: None
        description: この配信元を読み書きできる作業場所の glob。`None` は配信元のフォルダだけ（project-index が解く）
  - name: SourceEntry
    title: 配信元の行
    container: features/settings/types.py
    usecase: 端末の設定
    role: DTO
    summary: 設定画面が送る `sources[]` の 1 行
    description: '`pydantic.BaseModel`（`extra="forbid"`）。端末の設定の保存の要求の `sources[]` の形。project-index の端末の設定の API へ送るときの行もこの形'
    properties:
      - name: id
        title: 配信元の ID
        type: str | None
        access: 公開
        default: None
        description: 主キー。`None` は配信元の設定の `name`（project-index が解く）
        notes: 英小文字・数字・`-` だけ（project-index が検証する）
      - name: config
        title: 配信元の設定のパス
        type: list[str]
        access: 公開
        description: 配信元の設定の YAML の絶対パスの並び。文字列 1 つで書かれたときも配列にする（`field_validator`）
      - name: enabled
        title: 配信するか
        type: bool
        access: 公開
        default: 'True'
        description: '`False` で行を消さずに配信を止める'
      - name: scope
        title: 権限の範囲
        type: SourceScope
        access: 公開
        default: SourceScope()
        description: 読める・読み書きできる作業場所
      - name: outside_read
        title: 作業範囲の外から読めるか
        type: bool
        access: 公開
        default: 'True'
        description: '`False` で、`scope` に当たらない作業場所から `outside_scope: true` で読むのを断る'
  - name: TerminalConfig
    title: 端末の設定
    container: features/settings/types.py
    usecase: 端末の設定
    role: DTO
    summary: 検証を通して既定値を埋めた端末の設定
    description: '`pydantic.BaseModel`（`frozen=True`）。キーの意味と既定値は Issue #3 の資料 A-25 のキー一覧。'
    properties:
      - name: file
        title: 設定のファイル
        type: Path
        access: 公開
        description: 読んだ `settings.yaml` の絶対パス
      - name: version
        title: 設定のバージョン
        type: str
        access: 公開
        description: '`version` の値'
      - name: clone
        title: クローンの場所
        type: Path
        access: 公開
        description: dev-docs のクローン（フックが使う。サーバーは読むだけ）
      - name: port
        title: 待ち受けのポート
        type: int
        access: 公開
        default: '8781'
        description: 非機能要件の `listen_port`
      - name: bind
        title: 待ち受けのアドレス
        type: str
        access: 公開
        default: '"127.0.0.1"'
        description: 非機能要件の `bind_address`
      - name: project_index
        title: project-index の接続先
        type: str
        access: 公開
        default: PROJECT_INDEX_DEFAULT
        description: project-index の読み取り API と端末の設定の API のアドレス
      - name: leftover_sources
        title: 前のバージョンから残った配信元
        type: list[str]
        access: 公開
        default: '[]'
        description: '`sources` に残った行の ID（無ければ `config` の先頭）。配信には使わず、起動と `status` が知らせる（`dev-docs migrate` が project-index に同じ ID の行があって移さなかった行）'
      - name: state_dir
        title: 状態の置き場所
        type: Path
        access: 公開
        default: '`DEV_DOCS_STATE_DIR` → 端末の設定の `state_dir` → `${XDG_STATE_HOME:-~/.local/state}/dev-docs`'
        description: 表の列の設定を置くフォルダ（`~` を展開した絶対パス）
      - name: log_dir
        title: ログの置き場所
        type: Path
        access: 公開
        default: '{state_dir}/logs'
        description: project-index につながらないことと警告のログを書くフォルダ
  - name: SettingsSourcesRequest
    title: 配信元の保存の要求
    container: features/settings/types.py
    usecase: 端末の設定
    role: DTO
    summary: PUT `/_api/settings/sources` の本文
    description: '共通の『画面の API のモデル』（`ApiModel`。JSON のキーは camelCase）を継承する。型の合わない本文は FastAPI が 422 にする前に、起動の『例外の変換の登録』で problem+json の `errors[]` に揃える。'
    properties:
      - name: sources
        title: 配信元
        type: list[SourceEntry]
        access: 公開
        description: 保存する `sources[]` の全行
      - name: expected_version
        title: 照合する内容のバージョン
        type: str | None
        access: 公開
        default: None
        description: JSON の `expectedVersion`。画面が端末の設定の取得か前の保存で受けた `version`。`None` は照合しない
  - name: SettingsSourcesResponse
    title: 配信元の保存の応答
    container: features/settings/types.py
    usecase: 端末の設定
    role: DTO
    summary: 再読み込みした後の配信元ごとの状態
    description: '共通の『画面の API のモデル』（`ApiModel`。JSON のキーは camelCase）を継承する。`from_states(states)` で project-index の配信元の状態（`SourceState`）の並びから作る。`from_view(view)` で project-indexの呼び出しの `SettingsSourcesView` の `states` と `version` から作る'
    properties:
      - name: sources
        title: 配信元
        type: list[SourceStatusItem]
        access: 公開
        description: '`id`・`status`（`serving` / `not_served` / `disabled`）・`errors[]`（`{path, reason}`。`not_served` のときだけ）・`config_version`（`{config, server}`。設定のバージョンが古いときだけ）'
      - name: version
        title: 内容のバージョン
        type: str | None
        access: 公開
        default: None
        description: 保存した後の端末の設定の内容のバージョン
  - name: SettingsSourceRow
    title: 配信元の行と状態
    container: features/settings/types.py
    usecase: 端末の設定の取得
    role: DTO
    summary: 端末の設定の取得の `sources[]` の 1 行
    description: '共通の『画面の API のモデル』（`ApiModel`。JSON のキーは camelCase）を継承する。'
    properties:
      - name: id
        title: 配信元の ID
        type: str | None
        access: 公開
        description: project-index の行の `id`。`pending_reload` で `id` を省いた行は `None`
      - name: config
        title: 配信元の設定のパス
        type: list[str]
        access: 公開
        description: project-index の行の `config`
      - name: enabled
        title: 配信するか
        type: bool
        access: 公開
        description: project-index の行の `enabled`
      - name: scope
        title: 権限の範囲
        type: SourceScope
        access: 公開
        description: project-index の行の `scope`
      - name: status
        title: 状態
        type: Literal['serving', 'not_served', 'disabled', 'pending_reload']
        access: 公開
        description: project-index が返した状態
      - name: errors
        title: 除外した理由
        type: list[dict[str, str]]
        access: 公開
        default: '[]'
        description: '`{path, reason}`。`not_served` のときだけ'
      - name: config_version
        title: 設定のバージョン
        type: dict[str, str] | None
        access: 公開
        default: None
        description: '`{config, server}`。設定のバージョンが古いときだけ'
      - name: outside_read
        title: 作業範囲の外から読めるか
        type: bool
        access: 公開
        default: 'True'
        description: project-index の行の `outside_read`
  - name: SettingsSourcesView
    title: 端末の設定の取得の応答
    container: features/settings/types.py
    usecase: 端末の設定の取得
    role: DTO
    summary: GET `/_api/settings/sources` の応答
    description: '共通の『画面の API のモデル』（`ApiModel`。JSON のキーは camelCase）を継承する。'
    properties:
      - name: settings_path
        title: 端末の設定のパス
        type: str
        access: 公開
        description: project-index が返した、project-index の端末の設定のパス
      - name: sources
        title: 配信元
        type: list[SettingsSourceRow]
        access: 公開
        description: '`sources[]` の行の順'
      - name: version
        title: 内容のバージョン
        type: str | None
        access: 公開
        default: None
        description: project-index の端末の設定の内容のバージョン（ファイル全体の内容のハッシュ）
classes:
  - name: TerminalConfigInvalidError
    title: 端末の設定の違反
    container: features/settings/types.py
    usecase: 端末の設定
    role: 例外
    summary: 端末の設定が無い・YAML として読めない・スキーマに違反することを、違反の並びで表す
    description: '`DevDocsError` の子で HTTP 422。起動では標準エラーに違反ごとに `{file}: {path}: {rule}` を出して終了コード 2 で終わり、画面の API では problem+json の `errors[]`（`{path, reason}`）にする。'
    kind: クラス
    inherits: DevDocsError
    properties:
      - name: file
        title: 設定のファイル
        type: Path
        access: 公開
        description: 端末の設定のパス
      - name: violations
        title: 違反
        type: list[Violation]
        access: 公開
        default: '[]'
        description: 違反の並び。ファイルが無いときは空
