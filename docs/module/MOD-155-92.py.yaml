id: MOD-155-92
title: 開発ドキュメントサーバー / 変換 / decisions.py
lead: 設計書の `decisions` の検討事項の ID と、検討事項の文書のパスの読み取り。
test_files:
  - tests/unit/dev_docs/features/convert/test_decisions.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        文書の取得 ..> 検討事項の文書のパスの読み取り
        class 文書の取得 {
          <<function>>
        }
        class 検討事項の文書のパスの読み取り {
          <<function>>
        }
        click 文書の取得 href "./MOD-155-159.py.yaml#文書の取得"
constants:
  - name: DECISIONS_KEY
    title: 検討事項のキー
    container: features/convert/decisions.py
    usecase: 文書の取得
    summary: 設計書のスキーマで、検討事項の ID の並びを持つキー
    value: '`"decisions"`'
  - name: DECISION_ID
    title: 検討事項の ID の形式
    container: features/convert/decisions.py
    usecase: 文書の取得
    summary: 検討事項の ID に適用する正規表現（AI Monitor の `共通.schema.yaml` の `decision` の `pattern` と同じ）
    value: '`re.compile(r"^[A-Z]+-[0-9]+$")`'
  - name: DECISION_PAGE_PREFIX
    title: 検討事項の文書のパスの頭
    container: features/convert/decisions.py
    usecase: 文書の取得
    summary: 文書の取得の `path` のうち、検討事項の文書を指すパスの頭
    value: '`"_decisions/"`'
functions:
  - name: decision_page_id
    title: 検討事項の文書のパスの読み取り
    kind: 関数
    container: features/convert/decisions.py
    usecase: 文書の取得
    role: 判定
    summary: 文書の取得の `path` が検討事項の文書を指すなら、その検討事項の ID を返却する
    scope: public
    thread_safe: true
    args:
      - name: path
        title: 文書のパス
        type: str
        required: true
        passing: positional
        description: 文書の取得の `path`
    returns:
      type: str | None
      description: '`path` が `{DECISION_PAGE_PREFIX}{ID}` で `{ID}` が `DECISION_ID` に該当すれば ID、それ以外は `None`'
    process: 1. `path` が `DECISION_PAGE_PREFIX` で始まり、残りが `DECISION_ID` に該当すれば残りを返却し、それ以外は `None` を返却する
    unit_tests:
      - name: test_decision_page_id
        case: 正常
        summary: 検討事項の文書のパス
        condition: '`_decisions/D-1`'
        mock: なし
        expected: '`D-1`'
      - name: test_decision_page_id_when_other
        case: 正常
        summary: 検討事項の文書でないパスと、形式に合わない ID
        condition: '`dev/a`・`_decisions/../x`・`_decisions/d-1`'
        mock: なし
        expected: どれも `None`
