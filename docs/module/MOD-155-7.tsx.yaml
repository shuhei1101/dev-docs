id: MOD-155-7
title: 画面 / アプリとルート / router.tsx
lead: TanStack Router のルーターを受け持ち、アプリとルートの router.tsx を修正するときに参照する。
test_files:
  - tests/unit/frontend/src/app/router.test.tsx
data_models:
  - name: RouterContext
    title: ルーターの文脈
    container: app/router.tsx
    usecase: 起動
    role: 文脈
    summary: ルートの `loader` が使用する依存
    properties:
      - name: queryClient
        type: QueryClient
        description: '`ensureQueryData` に使用する'
functions:
  - name: createAppRouter
    title: ルーターの作成
    kind: 関数
    container: app/router.tsx
    usecase: 起動
    role: 合成の起点
    summary: ルートの木と文脈でルーターを作る
    scope: public
    args:
      - name: context
        type: RouterContext
        required: true
        passing: positional
        description: ルーターの文脈
    returns:
      type: Router
      description: '`createRouter({routeTree, context, defaultPreload: "intent", defaultPreloadStaleTime: 0, scrollRestoration: true, parseSearch, stringifySearch})`。`Register` の型も宣言する'
    process: |-
      1. 指定した文脈でルーターを作る（`defaultPreloadStaleTime` 0 で読み込みの鮮度は TanStack Query に任せる）
      2. `defaultErrorComponent` に画面の例外の表示（`react-error-boundary` と同じ `ErrorFallback`）を指定する
      3. `scrollRestoration: true` で履歴の項目ごとにスクロール位置を戻し、`scrollToTopSelectors` に文書の画面の本文の領域（`[data-scroll-restoration-id="doc-body"]`）を指定して、リンクで新規に開いたときは本文を一番上から表示する
    unit_tests:
      - name: test_create_app_router
        case: 正常
        summary: ルーターの設定
        condition: 文脈を指定して作る
        mock: なし
        expected: '`defaultPreload` が `intent`、`defaultPreloadStaleTime` が 0、`scrollRestoration` が `true`'
  - name: parseSearch
    title: クエリの読み取り
    container: app/router.tsx
    usecase: 起動
    role: 変換
    summary: URL のクエリを文字列のまま参照する（数字だけのリビジョン＝commit の短縮 ID を数値にしない）
    kind: 関数
    scope: public
    args:
      - name: search
        type: string
        required: true
        passing: positional
        description: '`?` で始まるクエリの文字列'
    returns:
      type: Record<string, string>
      description: キーと文字列の値。`createRouter` の `parseSearch` に指定する
    process: 1. `URLSearchParams` で参照し、値を文字列のまま返却する（既定の読み取りは `8852552` を数値にする）
    unit_tests:
      - name: test_parse_search_when_numeric_rev
        case: 正常
        summary: 数字だけ・指数の形式のリビジョンを文字列で参照する
        condition: '`?rev=8852552` と `?rev=1234e5&base=abc1234`'
        mock: なし
        expected: '`{rev: "8852552"}` と `{rev: "1234e5", base: "abc1234"}`'
  - name: stringifySearch
    title: クエリの書き出し
    container: app/router.tsx
    usecase: 起動
    role: 変換
    summary: クエリを引用符で囲まず文字列のまま記載する
    kind: 関数
    scope: public
    args:
      - name: search
        type: Record<string, unknown>
        required: true
        passing: positional
        description: キーと値
    returns:
      type: string
      description: '`?{key}={value}&...`（値があるキーが無いときは空文字列）。`createRouter` の `stringifySearch` に指定する'
    process: |-
      1. `undefined`・`null` のキーは記載しない
      2. 残りの値を `String` にして `URLSearchParams` で記載する（既定の書き出しは数字だけの文字列を引用符で囲む）
    unit_tests:
      - name: test_stringify_search_when_numeric_rev
        case: 正常
        summary: 数字だけのリビジョンを引用符なしで記載する
        condition: '`{rev: "8852552", base: undefined}` と `{}`'
        mock: なし
        expected: '`?rev=8852552` と空文字列'
notes:
  補足: ルートの木は `route-tree.gen.ts`（`@tanstack/router-plugin` が生成）から取る。
tags:
  - name: topic:ルート
    main: true
  - name: tool:react
  - name: tool:tanstack-router
