id: MOD-155-223
title: 画面 / メタデータの画面 / metadata-table.tsx
lead: メタデータの種類 1 つ分の表（行の中の編集・追加・削除）を受け持ち、メタデータの画面の metadata-table.tsx を修正するときに参照する。
components:
  - name: MetadataTable
    title: 種類の表
    kind: コンポーネント
    container: features/metadata/metadata/metadata-table.tsx
    usecase: メタデータを画面で参照する
    role: 部品
    summary: 種類の行を、絞り込みと編集中の変更を重ねて表にする
    props:
      - name: source
        type: string
        required: true
        description: 配信元の ID
      - name: kind
        type: MetadataKind
        required: true
        description: メタデータの取得の種類
      - name: query
        type: string
        required: true
        description: 絞り込みの入力
      - name: baseCommit
        type: string
        required: true
        description: メタデータの取得の `baseCommit`（変更の追加に指定する）
    description: 行の値は、行と列の `editable` が両方真のときだけボタンにし、押すとその場の入力欄（`ref` でフォーカス）にする。押した座標から `document.caretPositionFromPoint` で値の中の文字の位置を求め（ボタンの先頭からその位置までの `Range` の文字数）、フォーカスした後に `setSelectionRange` で入力位置を配置する。位置を求められないとき（ボタンの外のノード・値が空・キーボードで始めた `detail` が 0 のクリック）は末尾にする。入力欄にすでにフォーカスがあるときは入力位置を動かさない。Enter かフォーカスを外すと編集中の変更のストアに `update`（`docPath` は行の `docPath`）を追加し（変更の追加には `baseCommit` を指定する）、Esc で捨てる。`list` の列は行の値も追加の行も `, ` で区切って配列にする。追加の行は ID と列の入力欄を持ち、出すと ID の入力欄へフォーカスを移し、入力チェック（空・英小文字・数字・ハイフン・重複）を通して `add` を追加する。追加の行は `キャンセル` か行の中の Esc で入力を捨てて閉じ、`行追加` へフォーカスを戻す。行の要素の id は `metadata-row-{kind}-{id}`（編集中のパネルから移動する先）。行の名前（編集中の変更の `label`・削除の読み上げ名）は、`name`・`rule`・`path` の列のうち種類が持つ最初の列の値（値が空なら行の ID）で、編集しても変わらない。絞り込みは NFKC と小文字化してどれかの列に含む行を残す
    unit_tests:
      - name: test_metadata_table_when_edited
        case: 正常
        summary: 行の値を編集する
        condition: タグの列を押して `topic:a, topic:b` を入力し Enter
        mock: なし
        expected: ストアに `values.tags` が `[topic:a, topic:b]`、`docPath` が行の値の `update` が 1 件で、`baseCommitBySource` が `baseCommit` の値
      - name: test_metadata_table_when_readonly
        case: 正常
        summary: 修正できない列
        condition: 列の `editable` が `false`
        mock: なし
        expected: 値がボタンでない
      - name: test_metadata_table_when_add_duplicate
        case: 異常
        summary: 重なる ID
        condition: 既にある行の ID で追加する
        mock: なし
        expected: '`この ID は使用されています。別の ID を入力してください` が出て、ストアに追加されない'
        exception: 入力チェック
      - name: test_metadata_table_when_edited_label
        case: 正常
        summary: 変更の行の名前
        condition: タグの種類の行のタグを編集する
        mock: なし
        expected: 'ストアの `update` の `label` が `タグ: {path の列の値}`（編集したタグの値でない）'
      - name: test_metadata_table_when_add_focus
        case: 正常
        summary: 追加の行のフォーカス
        condition: '`行追加` を押す'
        mock: なし
        expected: ID の入力欄にフォーカスがある
      - name: test_metadata_table_when_add_cancel
        case: 正常
        summary: 追加の行のキャンセル
        condition: '`行追加` を押し、ID を入力して Esc'
        mock: なし
        expected: 追加の行が閉じ、`行追加` にフォーカスがあり、ストアに追加されない
      - name: test_metadata_table_when_caret_at_clicked
        case: 正常
        summary: 押した位置の入力位置
        condition: '`document.caretPositionFromPoint` が値 `project-index` のテキストノードの 7 文字目を返却するようにして、その列を押す'
        mock: '`document.caretPositionFromPoint`（`vi.spyOn`）'
        expected: 入力欄にフォーカスがあり、`selectionStart`・`selectionEnd` が 7
      - name: test_metadata_table_when_caret_keyboard
        case: 正常
        summary: キーボードで始めた入力位置
        condition: 列のボタンにフォーカスして Enter
        mock: なし
        expected: 入力欄の `selectionStart` が値の文字数（末尾）
refs:
  - to: SCR-155-4
    type: requires
    when: 表の要素と振る舞いを変えるときに、メタデータの画面の要素と突き合わせる。
tags:
  - name: topic:メタデータ
  - name: topic:画面
  - name: topic:表
  - name: action:編集
test_files:
  - tests/unit/frontend/src/features/metadata/metadata/metadata-table.test.tsx
