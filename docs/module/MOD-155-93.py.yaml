id: MOD-155-93
title: 開発ドキュメントサーバー / 変換 / diagrams.py
lead: '`x-diagram` の値と手で書く Mermaid の、mdmark の map の範囲か Mermaid のコードブロックへの描画。'
test_files:
  - tests/unit/dev_docs/features/convert/test_diagrams.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        スキーマ駆動の変換 ..> 図の組み立て
        スキーマ駆動の変換 ..> テーブルの論理名の引き方
        本文の書き換え ..> 手で書く図の組み立て
        class スキーマ駆動の変換 {
          <<function>>
        }
        class 本文の書き換え {
          <<function>>
        }
        class 図の組み立て {
          <<function>>
        }
        class テーブルの論理名の引き方 {
          <<function>>
        }
        class 手で書く図の組み立て {
          <<function>>
        }
        click スキーマ駆動の変換 href "./MOD-155-97.py.yaml#スキーマ駆動の変換"
        click 本文の書き換え href "./MOD-155-96.py.yaml#本文の書き換え"
constants:
  - name: FLOW_KINDS
    title: flowchart にする種類
    container: features/convert/diagrams.py
    usecase: 文書の取得
    summary: Mermaid の `flowchart` にする `x-diagram`
    value: '`flowchart`・`dataflow`・`architecture`'
  - name: NODE_KINDS
    title: ノードの種類の対応
    container: features/convert/diagrams.py
    usecase: 文書の取得
    summary: '`x-diagram` のノードの `kind` から Mermaid のクラス（画面の map の設定の `map.kinds` のキー）'
    entries:
      - key: '`actor`・`external`'
        value: '`external`'
      - key: '`process`・`system`'
        value: '`script`'
      - key: '`store`'
        value: '`data`'
      - key: '`start`・`question`・`action`・`result`'
        value: 同じ値
  - name: DEFAULT_NODE_KIND
    title: ノードの種類の既定
    container: features/convert/diagrams.py
    usecase: 文書の取得
    summary: '`kind` が無いノードと、`NODE_KINDS` に無い `kind` のノードの種類（スキーマの既定）'
    value: '`process`'
  - name: LINE_KINDS
    title: 線の種類
    container: features/convert/diagrams.py
    usecase: 文書の取得
    summary: 辺の `line` に書ける線の種類。`flow` 以外は補足の `layout` の `line`（画面の map の設定の `map.lines` のキー）に入れる。これ以外の `line` と、`line` が無い辺は `DEFAULT_LINE`
    value: '`flow`・`read`・`write`・`reply`・`loop`'
  - name: DEFAULT_LINE
    title: 線の種類の既定
    container: features/convert/diagrams.py
    usecase: 文書の取得
    summary: '`line` が無い辺と、`LINE_KINDS` に無い `line` の辺の種類'
    value: '`flow`'
  - name: ALL_STATES
    title: どの状態からも入る遷移の元
    container: features/convert/diagrams.py
    usecase: 文書の取得
    summary: 遷移の `from` のこの値は、`representative` の状態から引く
    value: '`全状態`'
  - name: PREVIOUS_STATE
    title: 元の状態へ戻る遷移の先
    container: features/convert/diagrams.py
    usecase: 文書の取得
    summary: 遷移の `to` のこの値は、`representative` の状態へ引く
    value: '`元の状態`'
  - name: ER_FROM_MARKS
    title: ER 図の元の側の多重度の記号
    container: features/convert/diagrams.py
    usecase: 文書の取得
    summary: 関連の `from_cardinality` から Mermaid の関連の左側の記号。これ以外の値の関連は図に出さない
    entries:
      - key: '`1`'
        value: '`||`'
      - key: '`0..1`'
        value: '`|o`'
      - key: '`1..n`'
        value: '`}|`'
      - key: '`0..n`'
        value: '`}o`'
  - name: ER_TO_MARKS
    title: ER 図の先の側の多重度の記号
    container: features/convert/diagrams.py
    usecase: 文書の取得
    summary: 関連の `to_cardinality` から Mermaid の関連の右側の記号。これ以外の値の関連は図に出さない
    entries:
      - key: '`1`'
        value: '`||`'
      - key: '`0..1`'
        value: '`o|`'
      - key: '`1..n`'
        value: '`|{`'
      - key: '`0..n`'
        value: '`o{`'
  - name: ER_DEFAULT_TYPE
    title: ER 図の列の型の既定
    container: features/convert/diagrams.py
    usecase: 文書の取得
    summary: '`type` を持たない列の Mermaid の型（Mermaid の列の行は型を省けない）'
    value: '`any`'
  - name: MAP_MERMAID_KINDS
    title: map で描く Mermaid の種類
    container: features/convert/diagrams.py
    usecase: 文書の取得
    summary: 手で書く Mermaid のうち、1 行目の最初の語がこの値のものを map の範囲に入れる（mdmark の map が描く種類）
    value: '`flowchart`・`graph`・`sequenceDiagram`・`erDiagram`・`stateDiagram-v2`・`stateDiagram`'
  - name: MAP_DATA_VERSION
    title: 補足のバージョン
    container: features/convert/diagrams.py
    usecase: 文書の取得
    summary: '`<!-- map-data -->` の `version`'
    value: '`1`'
functions:
  - name: render_diagram
    title: 図の組み立て
    kind: 関数
    container: features/convert/diagrams.py
    usecase: 文書の取得
    role: 変換
    summary: '`x-diagram` の種類で、値から本文に配置する map の範囲を組み立てる'
    scope: public
    thread_safe: true
    args:
      - name: value
        title: 値
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 図の値
      - name: kind
        title: 図の種類
        type: DiagramKind
        required: true
        passing: positional
        description: スキーマの `x-diagram`
      - name: head
        title: 図の見出し
        type: DiagramHead
        required: true
        passing: positional
        description: map の範囲の `title` にする図の題名（`scope`・`updated` は map に対応するキーが無いため使わない）
      - name: tables
        title: テーブル
        type: Sequence[Mapping[str, Any]]
        required: false
        default: ()
        passing: keyword
        description: '`er` のとき、同じ文書の `tables[]`。`columns` を持たない実体の列を補う'
    returns:
      type: str
      description: '`<!-- map: {"title": …} -->`・```mermaid の Mermaid・`<!-- map-data: {…} -->`（補足が空なら置かない）・`<!-- /map -->` を空行で区切って並べた文字列'
    process: |-
      1. `FLOW_KINDS` は `flowchart` にする
         - 向きは `direction` が `TD`・`LR` ならその値、それ以外は `dataflow`・`architecture` なら `LR`、`flowchart` なら `TD`
         - `nodes` を `{id}["{label}"]:::{class}` の行にする。名前は `label`（無ければ `id`）、クラスは `kind`（無ければ `DEFAULT_NODE_KIND`）を `NODE_KINDS` で引いた値（無ければ `DEFAULT_NODE_KIND` を引いた値）。`hint` は補足の `notes[{id}]` の `text` に入れる
         - `edges` を `{from} --> {to}`（`label` があれば `{from} -->|"{label}"| {to}`）の行にする。宣言の無い端は、名前を ID にした `DEFAULT_NODE_KIND` のノードを足す。`tip` は補足の `notes[{from}->{to}]`、`flow` 以外の `line`（`LINE_KINDS` に無い値は `DEFAULT_LINE`）は補足の `layout[{from}->{to}].line` に入れる
         - `frame` がオブジェクトなら、`nodes` の ID のノードの行を `subgraph frame ["{label}"]` 〜 `end` で囲む。`clicks` は描かず、図の元データの表に残す
      2. `state` は `stateDiagram-v2` にする
         - `states` の状態と、遷移の端（`from` の `ALL_STATES`・`to` の `PREVIOUS_STATE` は `representative` へ置き換えた後）に出た `states` に無い状態を、出た順に `state "{名前}" as s{n}`（`n` は 1 始まり）にする
         - `initial` があれば `[*] --> s{n}`、`final` の各状態は `s{n} --> [*]` の行にする
         - 遷移ごとに `s{元} --> s{先}` の行にし、ラベルは `{trigger} [{condition}]`（どちらも無ければ無し）を ` : {ラベル}` で付ける。`representative` が無く元か先が決まらない遷移は行にしない（図の元データの表に残る）
      3. `er` は `erDiagram` にする
         - 実体（`entities[]`）を出た順に `{name} {` 〜 `}` の実体にする。列は、実体が `columns` を持てばその要素（`type`・`name`・`key` の `PK`・`FK`）、持たなければ `tables` のうち `title` が実体の `name` に当たるテーブルの `columns`（`type`・`name`・`primary_key` は `PK`・`foreign_key` は `FK`）にする。`type` が無い列は `ER_DEFAULT_TYPE`。列の説明（`comment`・`title`）は補足の `notes[{実体}.{列}]` に入れる
         - 関連（`relations[]`）ごとに、元と先の実体があり、`from_column` が元の、`to_column` が先の実体の列にあり、両端の多重度が `ER_FROM_MARKS`・`ER_TO_MARKS` にある関連だけを `{from} {元の記号}--{先の記号} {to} : "{label}"`（`label` が無ければ `""`）の行にする。それ以外の関連は行にしない（図の元データの表に残る）
         - 行にした関連の `to_column` の列のコメントを `参照: {from}.{from_column}` にする（mdmark は関連の端の列を、このコメントを持つ FK の列から選ぶ）
      4. Mermaid の行を ```mermaid のコードブロックにし、`<!-- map: {"title": head.title} -->` と `<!-- /map -->` で囲む。補足（`version` は `MAP_DATA_VERSION`、`notes`・`layout` は空でないものだけ）が空でなければ、コードブロックの後に `<!-- map-data: {JSON} -->` を置く
         - マーカーの JSON（`ensure_ascii=False`）の文字の値の `--` は `- -` にする（HTML のコメントを閉じないため）
         - 名前・ラベルの `"` は `#quot;` にする（Mermaid の文字列を閉じないため）
    exceptions:
      - name: ValueError
        condition: 知らない図の種類
        message: '`x-diagram {kind} は描けません`'
    unit_tests:
      - name: test_render_diagram
        case: 正常
        summary: フローチャート
        condition: '`nodes` 2 つ（`label` が `A`・`B`）・ラベル `x` の `edges` 1 つ・`direction` 無し'
        mock: なし
        expected: '`<!-- map: {"title": 見出しの題名} -->` で始まり `<!-- /map -->` で終わり、Mermaid の 1 行目が `flowchart TD`、ノードの行が `a["A"]:::script`・`b["B"]:::script`、線の行が `a -->|"x"| b`。補足が無いため `<!-- map-data` が無い'
      - name: test_render_diagram_when_node_kinds
        case: 正常
        summary: ノードの種類
        condition: パラメータ（`kind` が `actor`・`external`・`process`・`system`・`store`・`start`・`question`・`action`・`result`・無し）ごとに、パラメータの `kind` のノード 1 つ
        mock: なし
        expected: ノードの行のクラスが `external`・`external`・`script`・`script`・`data`・`start`・`question`・`action`・`result`・`script`
      - name: test_render_diagram_when_hint_and_tip
        case: 正常
        summary: ノードの説明と線の種類・詳細
        condition: '`hint` を持つノード `a`、`label`・`line: read`・`tip` を持つ辺 `a → b`'
        mock: なし
        expected: 補足の `notes.a.text` が `hint`、`notes["a->b"].text` が `tip`、`layout["a->b"].line` が `read`
      - name: test_render_diagram_when_unknown_line
        case: 正常
        summary: '`LINE_KINDS` に無い線の種類'
        condition: '`line: dotted` の辺'
        mock: なし
        expected: 補足に `layout` が無い（`flow` として扱う）
      - name: test_render_diagram_when_direction
        case: 正常
        summary: 向きの既定と指定
        condition: パラメータ（（種類, `direction`）が（`flowchart`, 無し）・（`dataflow`, 無し）・（`architecture`, 無し）・（`dataflow`, `TD`））ごと
        mock: なし
        expected: Mermaid の 1 行目が順に `flowchart TD`・`flowchart LR`・`flowchart LR`・`flowchart TD`
      - name: test_render_diagram_when_frame
        case: 正常
        summary: 枠
        condition: 'ノード `a`・`b`・`c` と、`label: 判定`・`nodes: [a, b]` の `frame`'
        mock: なし
        expected: '`subgraph frame ["判定"]` 〜 `end` の中に `a`・`b` のノードの行があり、`c` の行は外にある'
      - name: test_render_diagram_when_state
        case: 正常
        summary: 状態遷移
        condition: '`states` が `下書き`・`公開`、`initial: 下書き`・`final: [公開]`・`下書き → 公開` の遷移（`trigger: 公開する`・`condition: 承認済み`）'
        mock: なし
        expected: 'Mermaid の 1 行目が `stateDiagram-v2` で、`state "下書き" as s1`・`state "公開" as s2`・`[*] --> s1`・`s1 --> s2 : 公開する [承認済み]`・`s2 --> [*]` の行がある'
      - name: test_render_diagram_when_state_representative
        case: 正常
        summary: 全状態と元の状態
        condition: '`representative: 編集中`、`from: 全状態`・`to: 中断` と `from: 中断`・`to: 元の状態` の遷移'
        mock: なし
        expected: '`編集中` から `中断` へ、`中断` から `編集中` への行がある'
      - name: test_render_diagram_when_state_without_representative
        case: 正常
        summary: 代表の状態が無い
        condition: '`representative` が無く、`from: 全状態` の遷移'
        mock: なし
        expected: その遷移の行が無い
      - name: test_render_diagram_when_er
        case: 正常
        summary: ER 図
        condition: '`columns` を持たない実体 `顧客`（`tables[]` の `title: 顧客` のテーブルに `id`（`primary_key`）と `email`）、`columns` を持つ実体 `注文`（`id`（`PK`）・`customer_id`（`FK`））、`顧客.id`（`1`）から `注文.customer_id`（`0..n`）へラベル `注文する` の関連'
        mock: なし
        expected: 'Mermaid の 1 行目が `erDiagram` で、`顧客` の実体に `any id PK` と `any email`、`注文` の実体に `customer_id FK "参照: 顧客.id"` の列があり、`顧客 ||--o{ 注文 : "注文する"` の行がある'
      - name: test_render_diagram_when_er_relation_dropped
        case: 正常
        summary: 端の列か多重度が描けない関連
        condition: '`to_column` が先の実体の列に無い関連と、`from_cardinality: many` の関連'
        mock: なし
        expected: どちらの関連も行に無く、コメントの `参照:` も付かない
      - name: test_render_diagram_when_marker_text
        case: 正常
        summary: HTML のコメントと Mermaid の文字列を閉じる文字
        condition: '`hint` が `a--b`、`label` が `"x"` のノード'
        mock: なし
        expected: 補足の JSON に `--` が無く `a- -b`、ノードの行の名前が `#quot;x#quot;`
      - name: test_render_diagram_when_unknown_kind
        case: 異常
        summary: 知らない図の種類
        condition: '`kind` が `gantt`'
        mock: なし
        expected: '`ValueError`'
        exception: 知らない図の種類
  - name: er_table_titles
    title: テーブルの論理名の引き方
    kind: 関数
    container: features/convert/diagrams.py
    usecase: 文書の取得
    role: 変換
    summary: 同じ文書の `tables[]` から、テーブルの物理名（`name`）と論理名（`title`）のどちらからも論理名を引く表を作る
    description: 表の外部キーのセルのリンクが、物理名と論理名のどちらで書いたテーブル名も当てる。
    scope: public
    thread_safe: true
    args:
      - name: tables
        title: テーブル
        type: Sequence[Mapping[str, Any]]
        required: true
        passing: positional
        description: 同じ文書の `tables[]`
    returns:
      type: dict[str, str]
      description: 物理名か論理名から、そのテーブルの論理名
    process: |-
      1. `title` を持つテーブルを出た順に見て、`name` と `title` の値（文字列にする）をそれぞれキーに、`title` を値にして入れる。同じキーが既にあるときは先に入れた値を残す
      2. `title` を持たないテーブルは入れない
    unit_tests:
      - name: test_er_table_titles
        case: 正常
        summary: 物理名と論理名
        condition: '`name: customers`・`title: 顧客` と `name: payments`・`title: 支払い` のテーブル'
        mock: なし
        expected: '`{customers: 顧客, 顧客: 顧客, payments: 支払い, 支払い: 支払い}`'
      - name: test_er_table_titles_when_duplicated_or_untitled
        case: 正常
        summary: 重なるキーと論理名の無いテーブル
        condition: '`name: a`・`title: A` のテーブル、`name: A`・`title: B` のテーブル、`name: c` だけのテーブル'
        mock: なし
        expected: '`A` の値が `A`（先に入れた値）で、`c` のキーが無い'
  - name: render_mermaid
    title: 手で書く図の組み立て
    kind: 関数
    container: features/convert/diagrams.py
    usecase: 文書の取得
    role: 変換
    summary: 手で書く Mermaid のコードを、map で描ける種類なら map の範囲に、それ以外は Mermaid のコードブロックのまま組み立てる
    scope: public
    thread_safe: true
    args:
      - name: code
        title: コード
        type: str
        required: true
        passing: positional
        description: '```mermaid のコードブロックの中身'
      - name: head
        title: 図の見出し
        type: DiagramHead
        required: true
        passing: positional
        description: map の範囲の `title` にする図の題名
    returns:
      type: str
      description: 'map の範囲か、元の ```mermaid のコードブロック'
    process: |-
      1. `code` の空でない最初の行の最初の単語が `MAP_MERMAID_KINDS` にあるかを見る
      2. あれば、`code` をそのまま ```mermaid のコードブロックにして `<!-- map: {"title": head.title} -->` と `<!-- /map -->` で囲む（補足は付けない）
      3. 無ければ、`code` を ```mermaid のコードブロックにして返す
    unit_tests:
      - name: test_render_mermaid
        case: 正常
        summary: シーケンス図
        condition: '`sequenceDiagram` と `A->>B: 読む` のコード'
        mock: なし
        expected: map の範囲の中の ```mermaid に元のコードが変わらずにある
      - name: test_render_mermaid_when_kinds
        case: 正常
        summary: map で描く種類
        condition: パラメータ（1 行目が `flowchart TD`・`graph LR`・`erDiagram`・`stateDiagram-v2`・`stateDiagram`）ごと
        mock: なし
        expected: 'どれも `<!-- map: ` で始まる'
      - name: test_render_mermaid_when_not_mappable
        case: 正常
        summary: map で描かない種類
        condition: '`classDiagram` のコード'
        mock: なし
        expected: '`<!-- map` が無く、元のコードの全ての行を持つ ```mermaid のコードブロック'
