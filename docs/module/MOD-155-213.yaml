id: MOD-155-213
title: 開発ドキュメントサーバー / project-indexの呼び出し
lead: |-
  project-index の読み取り API と端末の設定の API（外部 API『project-index の読み取り API』）を、制限時間つきの HTTP で呼ぶ。
  応答を型にして返し、つながらない・打ち切った・断られたことを dev-docs の例外に変える。
directory: |-
  ```text
  src/dev_docs/integrations/project_index/
  ├─ __init__.py   # 公開する型と ProjectIndexClient の再エクスポート
  ├─ types.py      # IndexedDocument / DocumentRow / SourceView / DocumentList / DocumentDetail / IndexFailure / SourceState / DecisionIndex / SearchHits / RefList / SettingsSourcesView
  └─ client.py     # ProjectIndexClient（要求ごとに問い合わせ、dev-docs の中に控えない）
  ```
