id: MOD-155-85
title: 開発ドキュメントサーバー / 管理 / render.py
lead: '管理の MCP の `status` の `format: markdown` の応答の文を組み立てる。値は service.py の結果をそのまま使い、計算しない。'
test_files:
  - tests/unit/dev_docs/features/admin/test_render.py
functions:
  - name: render_status
    title: 状態の文
    kind: 関数
    container: features/admin/render.py
    usecase: 状態の取得
    role: 表示
    summary: サーバーの状態を Markdown にする
    scope: public
    is_async: false
    thread_safe: true
    args:
      - name: status
        title: サーバーの状態
        type: ServerStatus
        required: true
        passing: positional
        description: '`get_status` の結果'
    returns:
      type: str
      description: Markdown
    returns_example: |-
      ```markdown
      http://127.0.0.1:8781/ dev-docs 0.3.0（pid 4242）
      端末の設定: /home/u/.config/dev-docs/settings.yaml（current）
      project-index: http://127.0.0.1:8786（つながっている）
      | source | 状態 |
      | --- | --- |
      | sample | serving |
      | broken | not_served（documents[0].paths: 必須のキーが無い） |
      ```
    process: |-
      1. 1 行目に `{address} dev-docs {version}（pid {pid}）`、2 行目に `端末の設定: {file}（{version_state}）`、3 行目に `project-index: {address}（つながっている）`（つながらないときは `（つながらない: {error}）`）を置く
      2. 配信元ごとに表の行を作る（配信元の行）
         - つながらない場合、表の代わりに `配信元: project-index につながらないため取得できません` を置く
         - 配信元が 0 件の場合、表の代わりに `配信元: なし` を置く
      3. `leftover_sources` があれば、最後に `端末の設定に残った sources: {ID を ・ でつないだもの}（project-index の端末の設定へ追加してください）` を置く
    unit_tests:
      - name: test_render_status
        case: 正常
        summary: 配信元の表を組み立てる
        condition: '`serving` と `not_served` の 2 行'
        mock: なし
        expected: 返り値例と同じ文
      - name: test_render_status_when_no_sources
        case: 正常
        summary: 配信元が無い
        condition: '`sources` が空で `reachable` が `True`'
        mock: なし
        expected: '4 行目が `配信元: なし`'
      - name: test_render_status_when_unreachable
        case: 正常
        summary: project-index につながらない
        condition: '`reachable` が `False`、`error` が `接続を拒否されました（Connection refused）`'
        mock: なし
        expected: '3 行目が `project-index: http://127.0.0.1:8786（つながらない: 接続を拒否されました（Connection refused））`、4 行目が `配信元: project-index につながらないため取得できません`'
      - name: test_render_status_when_leftover_sources
        case: 正常
        summary: 残った配信元
        condition: '`leftover_sources` が `[sample, notes]`'
        mock: なし
        expected: '最後の行が `端末の設定に残った sources: sample・notes（project-index の端末の設定へ追加してください）`'
    callers:
      - MOD-155-178#functions[build_admin_mcp]
    callees:
      - '#functions[_source_row]'
  - name: _source_row
    title: 配信元の行
    kind: 関数
    container: features/admin/render.py
    usecase: 共通
    role: 表示
    summary: 配信元の状態を表の 1 行にする
    scope: internal
    is_async: false
    thread_safe: true
    args:
      - name: state
        title: 配信元の状態
        type: SourceState
        required: true
        passing: positional
        description: 1 つの配信元
    returns:
      type: str
      description: '`| {id} | {状態} |` の表の行'
    process: |-
      1. `| {id} | {status} |` を返す。`not_served` は `errors` を `、` でつないで括弧で添える
    unit_tests:
      - name: test_source_row
        case: 正常
        summary: 配信中の行
        condition: '`serving` の sample'
        mock: なし
        expected: '`| sample | serving |`'
      - name: test_source_row_when_not_served
        case: 正常
        summary: 配信しない理由を添える
        condition: '`not_served`、`errors` 2 件'
        mock: なし
        expected: 状態の列が `not_served（{1 件目}、{2 件目}）`
    callers:
      - '#functions[render_status]'
      - '#functions[render_reload]'
