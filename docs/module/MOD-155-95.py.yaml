id: MOD-155-95
title: 開発ドキュメントサーバー / 変換 / flow_layout.py
lead: フロー図の中間データの、mdmark のフロー図の部品の定義への配置。
test_files:
  - tests/unit/dev_docs/features/convert/test_flow_layout.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        図の組み立て ..> フロー図の配置
        手で書く図の組み立て ..> フロー図の配置
        class 図の組み立て {
          <<function>>
        }
        class 手で書く図の組み立て {
          <<function>>
        }
        class フロー図の配置 {
          <<function>>
        }
        click 図の組み立て href "./MOD-155-93.py.yaml#図の組み立て"
        click 手で書く図の組み立て href "./MOD-155-93.py.yaml#手で書く図の組み立て"
constants:
  - name: NODE_WIDTH
    title: 箱の幅
    container: features/convert/flow_layout.py
    usecase: 文書の取得
    summary: 全ての箱の幅（px）
    value: '160'
  - name: NODE_HEIGHT
    title: 箱の最小の高さ
    container: features/convert/flow_layout.py
    usecase: 文書の取得
    summary: 名前が 1 行に収まる箱の高さ（px）。名前が折り返す箱はこれより高くする
    value: '56'
  - name: RANK_GAP
    title: 段の間隔
    container: features/convert/flow_layout.py
    usecase: 文書の取得
    summary: 並べる向きに隣り合う段の箱の間隔（px）。線のラベルを置く
    value: '64'
  - name: ROW_GAP
    title: 段の中の間隔
    container: features/convert/flow_layout.py
    usecase: 文書の取得
    summary: 同じ段に並ぶ箱の間隔（px）
    value: '40'
  - name: MARGIN
    title: 余白
    container: features/convert/flow_layout.py
    usecase: 文書の取得
    summary: 図の縁と箱の間の余白（px）
    value: '20'
  - name: FRAME_PADDING
    title: 枠の余白
    container: features/convert/flow_layout.py
    usecase: 文書の取得
    summary: 枠と中の箱の間の余白（px）。AI Monitor の設計書の生成と同じ値
    value: '20'
  - name: LABEL_METRICS
    title: 箱の文字の寸法
    container: features/convert/flow_layout.py
    usecase: 文書の取得
    summary: 箱の高さを、mdmark の定義の検査が文字の収まりを判定する式と同じ式で求めるための文字の大きさ・行の高さの倍率・余白（px）と半角の幅の割合
    description: mdmark v0.10.0 の `src/diagram/check.ts` の `LABEL_METRICS` と `HALF_WIDTH` に合わせる。半角とみなすのは U+007E 以下と U+FF61〜U+FF9F の文字で、それ以外は全角とみなす（mdmark の `isWide` と同じ）
    value: '`{"kind_size": 11, "name_size": 14, "line_height": 1.4, "pad_x": 10, "pad_y": 6, "half_width": 0.6}`'
functions:
  - name: layout_flow
    title: フロー図の配置
    kind: 関数
    container: features/convert/flow_layout.py
    usecase: 文書の取得
    role: 変換
    summary: フロー図の中間データの箱と線に座標を付け、mdmark のフロー図の部品の定義にする
    description: mdmark は自動配置しないため、段に分けて格子に並べる。同じ中間データからは同じ定義を返す。線が `from`・`to` でない箱を横切らず、箱の文字が箱に収まり、箱が重ならず、枠の外の箱が枠の縁をまたがない配置にする（mdmark の定義の検査の配置のずれが 0 件）。
    scope: public
    thread_safe: true
    args:
      - name: graph
        title: フロー図の中間データ
        type: FlowGraph
        required: true
        passing: positional
        description: 配置する箱と線
      - name: head
        title: 図の見出し
        type: DiagramHead
        required: true
        passing: positional
        description: 定義の `title`・`scope`・`updated`
    returns:
      type: dict[str, Any]
      description: '`MdmarkFlowDefinition` の JSON にする値（`title`・`scope`・`updated`・`width`・`height`・枠があれば `frame`・`nodes`・`wires`）'
    process: |-
      1. 線を、箱の出た順の深さ優先でたどり、たどっている途中の箱へ戻る線と、元と先が同じ線を戻る線にする。残りの線を進む線にする
      2. 進む線だけで、元の無い箱を段 0 とし、各箱の段を元の箱からの最長の段数にする
      3. 箱ごとに高さを決める
         - 名前を [`LABEL_METRICS`](#LABEL_METRICS) の式（全角は `name_size`、半角は `name_size × half_width` の幅）で幅 `NODE_WIDTH - pad_x × 2` に折り返した行数を数える（行に 1 文字も無いときは、幅を超えても同じ行に置く）
         - `(kind_size + 行数 × name_size) × line_height + pad_y × 2` を切り上げた値と `NODE_HEIGHT` の大きい方を高さにする。幅は `NODE_WIDTH`
      4. 元と先の段の差が 2 以上の線（戻る線を含む）に、間の段ごとに通り道（幅 0 の仮の箱）を 1 つずつ置く
      5. 段ごとに、枠の中の箱・枠の中の通り道（元と先がどちらも枠の中の箱である線の通り道）・枠の外の箱・枠の外の通り道（それ以外の通り道）の順に、それぞれ出た順で並べる（`TD` は段を上から下・同じ段を左から右、`LR` は段を左から右・同じ段を上から下）
         - 並べ始めは `MARGIN` で、枠の中の箱が 1 つ以上あるときは `MARGIN + FRAME_PADDING`
         - 段の厚み（`TD` は高さ、`LR` は幅）は、その段で最も大きい箱に合わせ、段の間に `RANK_GAP` を空ける
         - 同じ段の中は `ROW_GAP` を空けて並べる
         - 枠の外の箱と枠の外の通り道は、全ての段の枠の中の箱と枠の中の通り道の最も遠い端から `FRAME_PADDING × 2` を空けた位置より先に並べる
      6. 線を縦と横の折れ線で引く。段の中を通る区間は、元か先の箱から出入りする区間と通り道を通る区間だけにし、横切る区間は段の間の隙間を通す（隙間で折れる位置は、進む線は隙間の中央、戻る線は隙間の手前の端（`TD` は上、`LR` は左）から `RANK_GAP / 4`）。続けて同じ点と、一直線に並ぶ途中の点は除く
         - 進む線は、元の箱の出口の辺（`TD` は下、`LR` は右）の中央から出て、通り道を順に通り、先の箱の入口の辺（`TD` は上、`LR` は左）の中央へ入る（`line` は中間データの線の種類）
         - 戻る線は、元の箱の入口の辺の、中央から箱の幅（`LR` は高さ）の 1/4 ずらした点から出て、通り道を逆の向きに通り、先の箱の出口の辺の同じだけずらした点へ入る（`line` は `loop`）
         - 元と先が同じ線は、箱の横の辺（`TD` は右、`LR` は下）の、中央から箱の高さ（`LR` は幅）の 1/4 ずつ前後にずらした 2 点を結び、`ROW_GAP / 2` だけ張り出す輪にする（`line` は `loop`）
      7. 枠があり、中の箱が 1 つ以上置かれていれば、中の箱と枠の中の通り道を `FRAME_PADDING` だけ広げて囲む矩形を枠（`title`・`x`・`y`・`w`・`h`）にする
      8. ラベルは、線の最も長い区間の中央を `labelAt` にし、詳細があれば `tip` に入れる。箱の説明があれば `hint` に入れる
      9. 線の `id` は、中間データの線の出た順の `e{n}`（`n` は 1 始まり）にする
      10. `width`・`height` は、全ての箱の右端・下端、線の点、枠の右端・下端の最大に `MARGIN` を足す
    unit_tests:
      - name: test_layout_flow
        case: 正常
        summary: 上から下の 2 段
        condition: '`TD` で箱 `a`・`b`、ラベル `x` の線 `a → b`'
        mock: なし
        expected: '`a` が `(20, 20)`、`b` が `(20, 140)`、線の `id` が `e1`、`points` が `[[100, 76], [100, 140]]`、`line` が `flow`、`label` が `x`'
      - name: test_layout_flow_when_left_to_right
        case: 正常
        summary: 左から右
        condition: '`LR` で箱 `a`・`b`、線 `a → b`'
        mock: なし
        expected: '`b` が `(244, 20)`、線の `points` が `[[180, 48], [244, 48]]`'
      - name: test_layout_flow_when_branch
        case: 正常
        summary: 分岐した先を同じ段に並べる
        condition: '`TD` で線 `a → b`・`a → c`'
        mock: なし
        expected: '`b`・`c` が同じ `y` で、`c` の `x` が `b` の `x + 200`。`a → c` の `points` が 4 点の折れ線'
      - name: test_layout_flow_when_loop
        case: 正常
        summary: 戻る線
        condition: '`TD` で線 `a → b`・`b → a`'
        mock: なし
        expected: '`b → a` の `line` が `loop` で、`points` が `[[140, 140], [140, 76]]`（`b` の上の辺から `a` の下の辺へ）、`width` が `200`'
      - name: test_layout_flow_when_same_input
        case: 正常
        summary: 同じ入力に同じ定義
        condition: 同じ中間データで 2 回呼ぶ
        mock: なし
        expected: 2 回の戻り値が等しい
      - name: test_layout_flow_when_self_loop
        case: 正常
        summary: 元と先が同じ線
        condition: '`TD` で線 `a → b`・`b → b`'
        mock: なし
        expected: '`b → b` の `line` が `loop` で、`points` が `[[180, 154], [200, 154], [200, 182], [180, 182]]`（`b` の右の辺から `ROW_GAP / 2` 張り出す輪）、`width` が `220`'
      - name: test_layout_flow_when_line_and_tips
        case: 正常
        summary: 線の種類・詳細と箱の説明
        condition: '`TD` で説明を持つ箱 `a`・箱 `b`、種類 `read`・ラベル `x`・詳細 `y` の線 `a → b`'
        mock: なし
        expected: '線の `line` が `read`・`tip` が `y`、`a` の `hint` が箱の説明で、`b` は `hint` を持たない'
      - name: test_layout_flow_when_frame
        case: 正常
        summary: 枠
        condition: '`TD` で箱 `a`・`b`・`c`、線 `a → b`・`b → c`、`a`・`b` を中の箱にした表示 `判定` の枠'
        mock: なし
        expected: '`a` が `(40, 40)`、`c` が `(240, 280)`、`frame` が `{title: 判定, x: 20, y: 20, w: 200, h: 216}` で `c` と重ならず、`width` が `420`、`height` が `356`'
      - name: test_layout_flow_when_frame_without_nodes
        case: 正常
        summary: 中の箱が置かれていない枠
        condition: '`TD` で箱 `a`、中の箱が `z`（無い箱）だけの枠'
        mock: なし
        expected: 定義に `frame` が無く、`a` が `(20, 20)`
      - name: test_layout_flow_when_skip_rank
        case: 正常
        summary: 段を飛ばす線
        condition: '`TD` で線 `a → b`・`b → c`・`a → c`'
        mock: なし
        expected: '`c` が段 2（`y` が `260`）にあり、`a → c` の `points` が `[[100, 76], [100, 108], [220, 108], [220, 228], [100, 228], [100, 260]]` で `b` を横切らない'
      - name: test_layout_flow_when_skip_rank_left_to_right
        case: 正常
        summary: 左から右の段を飛ばす線
        condition: '`LR` で線 `a → b`・`b → c`・`a → c`'
        mock: なし
        expected: '`c` が段 2（右端）にあり、`a → c` の線のどの区間も `b` の内側を通らない'
      - name: test_layout_flow_when_back_edge_skip_rank
        case: 正常
        summary: 段を飛ばして戻る線
        condition: '`TD` で線 `a → b`・`b → c`・`c → a`'
        mock: なし
        expected: '`c → a` の `line` が `loop` で、`c` の上の辺から出て `a` の下の辺へ入り、どの区間も `b` の内側を通らず、`c` の段が 2 のまま'
      - name: test_layout_flow_when_self_loop_beside_node
        case: 正常
        summary: 同じ段に箱が並ぶ元と先が同じ線
        condition: '`TD` で箱 `a`・`b`（どちらも段 0）と線 `a → a`'
        mock: なし
        expected: '`a → a` の点の `x` が全て `a` の右端から `ROW_GAP / 2` 以内で、どの区間も `b` の内側を通らない'
      - name: test_layout_flow_when_long_name
        case: 正常
        summary: 折り返す名前
        condition: '`TD` で名前が全角 30 文字の箱 `a`、箱 `b`、線 `a → b`'
        mock: なし
        expected: '`a` の `h` が `87`、`b` の `h` が `56` で、`b` の `y` が `171`（`a` と重ならない）'
      - name: test_layout_flow_when_half_width_name
        case: 正常
        summary: 半角を含む名前
        condition: '`TD` で名前が半角 30 文字の箱 `a`'
        mock: なし
        expected: '`a` の `h` が `67`（半角を `name_size × 0.6` の幅として 2 行に折り返す）'
      - name: test_layout_flow_when_frame_outside_rank
        case: 正常
        summary: 枠の中の箱が無い段の枠の外の箱
        condition: '`TD` で線 `a → b`・`b → c`、`a`・`c` を中の箱にした枠（`b` だけの段がある）'
        mock: なし
        expected: '`b` が `frame` と重ならない'
      - name: test_layout_flow_when_frame_skip_rank
        case: 正常
        summary: 枠の中の箱どうしの段を飛ばす線
        condition: '`LR` で線 `a → b`・`b → c`・`a → c`、`a`・`b`・`c` を中の箱にした枠'
        mock: なし
        expected: '`a → c` の線の全ての点が `frame` の中にあり、どの区間も `b` の内側を通らない'
