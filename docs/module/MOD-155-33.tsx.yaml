id: MOD-155-33
title: 画面 / 文書の画面 / not-found-screen.tsx
lead: 見つからない画面を受け持ち、文書の画面の not-found-screen.tsx を修正するときに参照する。
test_files:
  - tests/unit/frontend/src/features/docs/not-found/not-found-screen.test.tsx
components:
  - name: NotFoundScreen
    title: 見つからない画面
    kind: 画面
    container: features/docs/not-found/not-found-screen.tsx
    usecase: 文書を参照する
    role: 画面
    summary: ルートの `notFoundComponent` として、URL を変えずに見つからなかったものと次のリンク・配信中の配信元を出す
    props:
      - name: data
        type: unknown
        required: false
        description: '`notFound` の `data`'
    description: 見つからなかったものの説明・配信中の配信元・リビジョンの一覧を参照し（見つからない画面の内容）、配信元のトップ・設定画面へのリンクと配信中の配信元を出す（次のリンク）。画面の先頭に本文へのスキップを配置する
    state:
      - name: searchOpen
        type: boolean
        initial: 'false'
        description: 検索のダイアログ
        notes: '`useState`'
      - name: helpOpen
        type: boolean
        initial: 'false'
        description: ショートカットの一覧
        notes: '`useState`'
    unit_tests:
      - name: test_not_found_screen
        case: 正常
        summary: 文書が無いときの案内
        condition: '`{missing: "doc", value: "a.md"}` の `data`'
        mock: MSW のハンドラ（配信中の配信元 2 件）
        expected: 見出し・詳細・配信元のトップへのリンクが出て、配信中の配信元の一覧は出ず、URL が変わらない
      - name: test_not_found_screen_when_source_missing
        case: 正常
        summary: 配信元が無いときはリビジョンを参照しない
        condition: '`{missing: "source", value: "unknown"}` の `data`'
        mock: MSW のハンドラ
        expected: リビジョンの一覧が呼ばれず、トップバーに配信元が渡らない
refs:
  - to: SCR-155-2
    type: requires
    when: 見つからない画面の構成を変えるときに、見つからない画面の要素と振る舞いと突き合わせる。
notes:
  補足: 要素とその振る舞いは画面設計『見つからない画面』が持つ。
tags:
  - name: topic:文書
    main: true
  - name: topic:画面
  - name: topic:見つからない画面
