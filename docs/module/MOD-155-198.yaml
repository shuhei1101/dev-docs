id: MOD-155-198
title: 開発ドキュメントサーバー / 管理のMCP
lead: |-
  管理の MCP（`/_admin/mcp`）の組み立て。
  各ツールの引数を要求のモデルで受け、サービスを呼んで `format` の形式で返し、`DevDocsError` を `isError` の結果にする。文書の MCP（`/mcp`）は project-index が持つ。
directory: |-
  ```text
  src/dev_docs/server/mcp/
  ├─ __init__.py   # build_admin_mcp の再エクスポート
  ├─ admin.py      # build_admin_mcp（3 つのツールの登録）
  └─ result.py     # to_tool_result / tool_error / TOOL_ANNOTATIONS / 管理の MCP のツール名とプロンプトの ID

  content/prompts/mcp/
  └─ admin/
     └─ tools/{ツール名}.yaml # 管理の MCP のツールの description（kind: tool）
  ```
