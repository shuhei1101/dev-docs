id: MOD-155-198
title: 開発ドキュメントサーバー / 文書のMCP
lead: |-
  文書の MCP（`/mcp`）と管理の MCP（`/_admin/mcp`）の組み立て。
  各ツールの引数を要求のモデルで受け、サービスを呼んで `format` の形式で返し、`DevDocsError` を `isError` の結果にする。
directory: |-
  ```text
  src/dev_docs/server/mcp/
  ├─ __init__.py   # build_docs_mcp / build_admin_mcp の再エクスポート
  ├─ docs.py       # build_docs_mcp（7 つのツールの登録）
  ├─ admin.py      # build_admin_mcp（7 つのツールの登録）
  └─ result.py     # to_tool_result / tool_error / TOOL_ANNOTATIONS / 2 つの MCP のツール名とプロンプトの ID

  content/prompts/mcp/
  ├─ docs/
  │  ├─ instructions.yaml   # 文書の MCP の instructions（kind: instructions）
  │  └─ tools/{ツール名}.yaml # 文書の MCP のツールの description（kind: tool。ツール名の _ を - にした名前）
  └─ admin/
     └─ tools/{ツール名}.yaml # 管理の MCP のツールの description（kind: tool）
  ```
