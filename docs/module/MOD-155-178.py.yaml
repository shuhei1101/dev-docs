constants:
  - name: ADMIN_MCP_NAME
    title: 管理の MCP の名前
    container: server/mcp/admin.py
    usecase: 共通
    summary: '`initialize` で返すサーバーの名前'
    value: '"dev-docs-admin"'
functions:
  - name: build_admin_mcp
    title: 管理の MCP の組み立て
    kind: 関数
    container: server/mcp/admin.py
    usecase: 共通
    role: 入口
    summary: '3 つのツールを持つ管理の MCP を作る'
    scope: public
    args:
      - name: handlers
        title: 配線済みの関数
        type: Handlers
        required: true
        passing: positional
        description: 起動の『配線済みの関数』
    returns:
      type: mcp.server.mcpserver.MCPServer
      description: 管理の MCP
    process: |-
      1. `MCPServer(ADMIN_MCP_NAME)` を作る
      2. `ADMIN_TOOL_NAMES` のツールを、`description` を `handlers.prompts.render(tool_prompt_id("admin", 名前))` にして `TOOL_ANNOTATIONS` の注釈で登録する。引数はインターフェース定義の `request` をキーワード引数で受ける
      3. 各ツールは次のサービスを呼び、結果をツールの結果にする
         - `status`: 状態の取得（`await`。`env` は `os.environ`）。`render` は状態の文
         - `restart`: 再起動の制御の再起動の要求（`handlers.restart.request()`）。`render` は `None`
         - `update`: クローンの更新（`asyncio.to_thread`。クローンは端末の設定の `clone`、`control` は `handlers.restart`）。`render` は `None`
         - `DevDocsError` と `pydantic.ValidationError` はツールのエラーの変換の結果を返す。それ以外の例外は `[error]` ツールの処理に失敗した（ツール名・例外）を書いて MCP の既定に任せる
      4. 作った MCP を返す
    unit_tests:
      - name: test_build_admin_mcp
        case: 正常
        summary: ツールと注釈
        condition: '`list_tools` を呼ぶ'
        mock: 配線済みの関数（偽物）
        expected: 3 つのツールが並び、`restart`・`update` の `destructiveHint` が `True`、`status` の `readOnlyHint` が `True`
      - name: test_build_admin_mcp_when_status
        case: 正常
        summary: 状態の取得への受け渡し
        condition: '`status(format="json")` を呼ぶ'
        mock: 状態の取得（結果を返す偽物）
        expected: '`structuredContent` に `project_index` と `sources` がある'
      - name: test_build_admin_mcp_when_restart_in_progress
        case: 正常
        summary: 再起動の途中をエラーにする
        condition: '`restart` を 2 回呼ぶ'
        mock: 再起動の制御（uvicorn のサーバーはスタブ）
        expected: 1 回目の `restarting` が `True`、2 回目の `isError` が `True` で text が `RestartInProgressError` で始まる
      - name: test_build_admin_mcp_when_descriptions
        case: 正常
        summary: ツールの説明をプロンプトの YAML から描画する
        condition: '`list_tools` と `initialize` を呼ぶ'
        mock: 配線済みの関数（偽物。`prompts` は同梱した YAML を読んだ一式）
        expected: 3 つのツールの説明がそれぞれ `prompts.render(tool_prompt_id("admin", 名前))` と同じで、`instructions` が無い
