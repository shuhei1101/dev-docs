id: MOD-155-112
title: 開発ドキュメントサーバー / 文書 / types.py
lead: エイリアスの型。
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        エイリアスの集め o-- エイリアス
        class エイリアスの集め {
          <<dataclass>>
        }
        class エイリアス {
          <<dataclass>>
        }
data_models:
  - name: AliasEntry
    title: エイリアス
    container: features/documents/types.py
    usecase: 共通
    role: DTO
    summary: '`alias_type` を持つ行の文書 1 件のエイリアスのキーの値'
    description: '`dataclass(frozen=True, slots=True, kw_only=True)`。エイリアスのキーの検証に通った文書だけから作る。'
    properties:
      - name: id
        title: 文書の ID
        type: str
        access: 公開
        description: 用語の文書の ID
      - name: name
        title: 名前
        type: str
        access: 公開
        description: 共通のキー `name`
      - name: aliases
        title: 別名
        type: list[str]
        access: 公開
        default: '[]'
        description: '`aliases` を並びにしたもの。無ければ空'
      - name: description
        title: 説明
        type: str | None
        access: 公開
        default: None
        description: 共通のキー `description`
      - name: alias_type
        title: 引用の種類
        type: Literal['term', 'doc', 'command', 'url', 'skill', 'tool', 'path', 'env', 'avoid']
        access: 公開
        description: 行の `alias_type`
      - name: avoid
        title: やめた言い方
        type: list[str] | None
        access: 公開
        default: None
        description: '`avoid` を並びにしたもの。持たない文書は `None`'
      - name: extra
        title: ほかのエイリアスのキー
        type: dict[str, Any]
        access: 公開
        default: '{}'
        description: 取り込んだスキーマの `metadata` のキーのうち上の項目以外で値を持つもの（`related`・`command`・`cwd`・`url`・`skill`・`tool`・`path`・`port`・`replacement`）
  - name: AliasCollection
    title: エイリアスの集め
    container: features/documents/types.py
    usecase: 共通
    role: DTO
    summary: 検証に通ったエイリアスと違反
    description: '`dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: entries
        title: エイリアス
        type: list[AliasEntry]
        access: 公開
        default: '[]'
        description: 検証に通った文書のエイリアス（文書を渡した順）
      - name: violations
        title: 違反
        type: list[Violation]
        access: 公開
        default: '[]'
        description: 検証に通らなかった文書の違反（`doc` に文書のパス）
      - name: has_alias_rows
        title: エイリアスの行があるか
        type: bool
        access: 公開
        default: 'False'
        description: 有効な documents の行に `alias_type` を持つ行があるか
