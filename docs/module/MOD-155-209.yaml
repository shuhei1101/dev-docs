id: MOD-155-209
title: 開発ドキュメントサーバー / 関連
lead: |-
  `trace_related` の処理。起点の文書かコードのパスから、メタデータの `related` を深さと向きの指定でたどる。
  `suggest` では、同じ commit での変更と会話の中の編集・閲覧から、まだ `related` に無い関連の候補を返す。
directory: |-
  ```text
  src/dev_docs/features/related/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ types.py      # RelatedRequest / RelatedLink / RelatedItem / Suggestion / RelatedResult
  ├─ graph.py      # related_links / walk_related
  ├─ suggest.py    # suggest_related
  ├─ render.py     # render_related_markdown
  └─ service.py    # trace_related
  ```
