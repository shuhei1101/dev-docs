id: MOD-155-161
title: 開発ドキュメントサーバー / 画面のAPI / paths.py
lead: 画面のページのパスと、文書のページの特定。
test_files:
  - tests/unit/dev_docs/features/view/test_paths.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        文書の取得 ..> 文書のページの特定
        画面の検索 ..> 文書のページのパス
        class 文書の取得 {
          <<function>>
        }
        class 画面の検索 {
          <<function>>
        }
        class 文書のページの特定 {
          <<function>>
        }
        class 文書のページのパス {
          <<function>>
        }
        click 文書の取得 href "./MOD-155-159.py.yaml#文書の取得"
        click 画面の検索 href "./MOD-155-163.py.yaml#画面の検索"
functions:
  - name: page_path
    title: 文書のページのパス
    kind: 関数
    container: features/view/paths.py
    usecase: 文書の取得
    role: 変換
    summary: 文書を URL のパスにする
    scope: public
    thread_safe: true
    args:
      - name: document
        title: 文書
        type: IndexedDocument
        required: true
        passing: positional
        description: 文書か検索に一致した文書（`path`・`record_index`・`id` を読む）
    returns:
      type: str
      description: '`path` から拡張子を落とした形。`records` の文書は `{拡張子を落とした path}/{id}`'
    process: 1. `PurePosixPath(path).with_suffix("")` にし、`record_index` があれば `/{id}` を続ける
    unit_tests:
      - name: test_page_path
        case: 正常
        summary: ファイルと records
        condition: '`docs/a.yaml` の文書と、`docs/rules.yaml` の `records` の `r-1`'
        mock: なし
        expected: '`docs/a` と `docs/rules/r-1`'
  - name: find_page
    title: 文書のページの特定
    kind: 関数
    container: features/view/paths.py
    usecase: 文書の取得
    role: 判定
    summary: 文書のページのパスに当たる文書を探す
    scope: public
    thread_safe: true
    args:
      - name: documents
        title: 文書
        type: Sequence[IndexedDocument]
        required: true
        passing: positional
        description: 配信元の文書
      - name: page
        title: 文書のページのパス
        type: str
        required: true
        passing: positional
        description: 探すパス
    returns:
      type: IndexedDocument | None
      description: 無ければ `None`
    process: |-
      1. 文書のページのパスが `page` と同じ文書を返す
      2. 無ければ、`path` か `body_path` が `page` と同じ最初の文書を返す
      3. どちらにも無ければ `None` を返す
    unit_tests:
      - name: test_find_page
        case: 正常
        summary: 文書のページのパスで当たる
        condition: 文書のページのパスが `rules/a` の文書と `page` が `rules/a`
        mock: なし
        expected: その文書
      - name: test_find_page_when_body_path
        case: 正常
        summary: 本文のファイルのパスで当たる
        condition: '`path` が `notes/files.yaml`・`body_path` が `notes/b.md` の管理用の YAML の行の文書と `page` が `notes/b.md`'
        mock: なし
        expected: その文書
      - name: test_find_page_when_missing
        case: 正常
        summary: どれにも当たらない
        condition: '`page` が `no/such`'
        mock: なし
        expected: '`None`'
