id: MOD-155-202
title: 開発ドキュメントサーバー / 絞り込み
lead: |-
  `nav` の `auto` の `filter`（`search_docs` の `filter` と同じ書式）の条件の木を確かめ、文書に照合する。
  検索そのもの（`search_docs`・画面の検索の語の照合と抜粋）は project-index が持つ。
directory: |-
  ```text
  src/dev_docs/features/search/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ types.py      # Condition / Group / Heading
  ├─ fields.py     # field_values / known_fields / heading_lines（項目の値・計算項目・使える項目・見出しの行）
  └─ filters.py    # check_filter / match_filter / compile_regex / normalize / parse_compare_value
  ```
