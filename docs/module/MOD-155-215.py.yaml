        }
        click 索引の文書の読み取り href "./MOD-155-214.py.yaml#索引の文書の読み取り"
classes:
  - name: ProjectIndexClient
    title: project-indexの呼び出し
    container: integrations/project_index/client.py
    usecase: project-index の呼び出し
    role: ゲートウェイ
    summary: project-index の API を `httpx.AsyncClient` で呼び、応答を型にする。要求ごとに問い合わせ、応答を記録しない
    description: 起動の『部品の配線』が端末の設定の `project_index` と非機能要件の `project_index_timeout` で 1 つ作り、アプリの停止で `aclose` する。`dev-docs migrate` は `asyncio.run` の中で同じ型を作る。
    properties:
      - name: address
        title: 接続先
        type: str
        access: 公開
        description: 端末の設定の `project_index`（末尾の `/` を除く）
      - name: timeout
        title: 制限時間
        type: float
        access: 公開
        description: 要求 1 回の全体の上限（秒）。`PROJECT_INDEX_TIMEOUT_SEC`。`httpx` の接続・読み取りなど待ちごとの上限にも同じ値を入れる
      - name: _client
        title: HTTP のクライアント
        type: httpx.AsyncClient
        access: 内部 (_)
        description: '`base_url` を `address`、`timeout` を `timeout` にしたもの。テストは `transport` を差し替える'
    methods:
      - name: request
        title: 呼び出しの共通の手順
        kind: メソッド
        summary: project-index へ 1 回要求し、つながらない・打ち切った・断られたことを例外に変える
        scope: internal
        is_async: true
        thread_safe: true
        args:
          - name: method
            title: メソッド
            type: str
            required: true
            passing: positional
            description: '`GET`・`PUT`・`POST`'
          - name: path
            title: パス
            type: str
            required: true
            passing: positional
            description: '`/sources` のような API のパス（パスの要素は URL エンコード済み）'
          - name: params
            title: クエリ
            type: Mapping[str, str | int] | None
            required: false
            passing: keyword
            description: 値が `None` のキーは送信しない
            default: None
          - name: body
            title: 本文
            type: Any
            required: false
            passing: keyword
            description: JSON の本文
            default: None
        returns:
          type: httpx.Response
          description: 2xx・409 の応答
        process: |-
          1. `asyncio.timeout(self.timeout)` の中で `self._client` で要求する。要求全体が `timeout` を超えるか接続できなければ `ProjectIndexUnreachableError`（`address` は `self.address`）を送信する
             - 接続を断られた（`httpx.ConnectError`）: `reason` を `接続を拒否されました（Connection refused）`
             - 制限時間を超えた（`TimeoutError`・`httpx.TimeoutException`）: `reason` を `{timeout} 秒以内に応答がありませんでした`、`kind` を `timeout`（他は `unreachable`）
             - そのほかの `httpx.TransportError`: `reason` を例外の文字列
          2. 応答のステータスで分ける
             - 2xx・409: 応答を返却する
             - 404: problem+json の `missing` で分ける。`source` なら `UnknownSourceError`（`source_id` は `value`）、`not_served` なら `SourceNotServedError`（`violations` は `errors[]` の `{path, reason}` を `Violation(path, rule=reason)` にしたもの、`disabled` は応答の `disabled`）、`ref` なら `RefNotFoundError`（`argument` は応答の `argument`、無ければ `ref`。`value` は応答の `value`）、それ以外は `DocumentNotFoundError`（`missing` は `[value]`、`candidates` は空）
             - 400: `InvalidArgumentError`（`message` は `detail`、`violations` は `errors[]` を `Violation` にしたもの）を送信する
             - 422: `ProjectIndexRejectedError`（`violations` は `errors[]` を `Violation` にしたもの）を送信する
             - それ以外: `ProjectIndexResponseError`（`address` は `self.address`、`status_code` は応答のステータス、`summary` は本文の先頭 200 文字、`reason` は problem+json の `detail`（参照できなければ `summary`））を送信する
        exceptions:
          - name: ProjectIndexUnreachableError
            condition: 接続できない・制限時間を超えた
            message: '`project-index（{address}）に接続できませんでした。{reason}`'
          - name: UnknownSourceError
            condition: 404 で `missing` が `source`
            message: '`配信元がありません: {id}`'
          - name: SourceNotServedError
            condition: 404 で `missing` が `not_served`
            message: '`{id} は配信していません`'
          - name: RefNotFoundError
            condition: 404 で `missing` が `ref`
            message: '`ref を解決できません: {value}`'
          - name: DocumentNotFoundError
            condition: 404 で `missing` が `doc`
            message: '`文書がありません: {path}`'
          - name: ProjectIndexRejectedError
            condition: '422'
            message: '`project-index が要求を受け付けませんでした`'
          - name: ProjectIndexResponseError
            condition: 2xx・400・404・409・422 以外
            message: '`project-index が {status} を返しました: {summary}`'
        unit_tests:
          - name: test_request_when_refused
            case: 異常
            summary: 接続を断られる
            condition: '`MockTransport` が `httpx.ConnectError` を送信する'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '`ProjectIndexUnreachableError` で、`address` が `self.address`、`reason` が `接続を拒否されました（Connection refused）`'
            exception: 接続できない・制限時間を超えた
          - name: test_request_when_timeout
            case: 異常
            summary: 制限時間を超える
            condition: '`MockTransport` が `httpx.ReadTimeout` を送信し、`timeout` が 45'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '`ProjectIndexUnreachableError` で、`reason` が `45 秒以内に応答がありませんでした`'
            exception: 接続できない・制限時間を超えた
          - name: test_request_when_not_found
            case: 異常
            summary: 404 の missing ごとの例外
            condition: 404 の problem+json の `missing` が `source`・`not_served`（`errors[]` 1 件）・`ref`・`doc`
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: 順に `UnknownSourceError`・`SourceNotServedError`（`violations` 1 件）・`RefNotFoundError`（`argument` が `ref`）・`DocumentNotFoundError`（`missing` が `[value]`）
            exception: 404 で `missing` が `source`
          - name: test_request_when_unexpected_status
            case: 異常
            summary: 想定しないステータス
            condition: 500 で本文が 300 文字
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '`ProjectIndexResponseError` で、`status_code` が 500、`summary` が本文の先頭 200 文字'
            exception: 2xx・400・404・409・422 以外
          - name: test_request_when_total_timeout
            case: 異常
            summary: 要求全体の上限
            condition: '`timeout` を 0.2 にし、`MockTransport` がヘッダーを返却した後に本文を 0.15 秒ずつ 3 回に分けて返却する'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '`ProjectIndexUnreachableError` で、`reason` が `0.2 秒以内に応答がありませんでした`'
            exception: 接続できない・制限時間を超えた
      - name: list_sources
        title: 配信元の状態の一覧
        kind: メソッド
        summary: 配信元の一覧と配信元ごとの状態を返却する
        scope: public
        is_async: true
        thread_safe: true
        args: []
        returns:
          type: list[SourceState]
          description: project-index の配信元の並び
        process: |-
          1. 呼び出しの共通の手順で `GET /sources` をクエリ `include_loading=true` で呼ぶ（全ての配信元の読み込みを待たず、読み込み中の配信元は `loading` で返る）
          2. 応答の `sources[]` を `SourceState` にして返却する
        unit_tests:
          - name: test_list_sources
            case: 正常
            summary: 状態の読み替え
            condition: '`sources[]` に `serving` の sample と、`not_served`・`errors[]` 1 件の broken'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: 2 件で、broken の `errors` が `Violation` 1 件
          - name: test_list_sources_when_loading
            case: 正常
            summary: 読み込み中の配信元
            condition: '`sources[]` に `serving` の sample と `loading` の slow'
            mock: '`httpx.MockTransport` で要求を記録し、project-index の応答を返却する'
            expected: 要求のクエリに `include_loading=true` があり、slow の `status` が `loading`
      - name: source_view
        title: 配信元の表示の設定の取得
        kind: メソッド
        summary: 配信元の設定のうち画面が使用するキーを返却する
        scope: public
        is_async: true
        thread_safe: true
        args:
          - &id001
            name: source
            title: 配信元の ID
            type: str
            required: true
            passing: positional
            description: 問い合わせる配信元
        returns:
          type: SourceView
          description: 配信元の表示の設定
        process: |-
          1. `asyncio.TaskGroup` で、配信元の設定の取得（`source`）とリビジョンの一覧（`source`、`commits=0`）を同時に呼ぶ。グループが送出した `ExceptionGroup` は、中の最初の例外を取り出して送出する
          2. 配信元の表示の設定の組み立て（`source`・配信元の設定・リビジョンの一覧）の結果を返却する
        unit_tests:
          - name: test_source_view
            case: 正常
            summary: 画面の構成と文書の行
            condition: 'config が `nav`・`documents[]` 2 行（1 行は `records: files`・`metadata: {category: category}`）・`schemas` 2 件・`diff.ignore_keys: [updated, rev]`・`github.issueLabels: [docs]`、refs が `git: true`・`defaultRef: main` を返却する'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: 'config の要求のクエリに `schemas=true`、refs の要求のクエリに `commits=0` がある。`documents` が 2 件で各行の `schema` が `schemas` の値、`records: files` の行の `metadata` が `{category: category}`、もう 1 行の `metadata` が `{}`、`diff_ignore_keys` が `[updated, rev]`、`github_issue_labels` が `[docs]`、`git` が `True`、`default_ref` が `main`'
          - name: test_source_view_when_not_git
            case: 正常
            summary: Git 管理外の配信元
            condition: 'refs が `git: false` を返却する'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '`git` が `False`、`default_ref` が `None`'
          - name: test_source_view_when_source_unknown
            case: 異常
            summary: タスクのグループの例外をそのまま送出する
            condition: 'config と refs が 404（`missing: source`）を返却する'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '`ExceptionGroup` でなく `UnknownSourceError`'
            exception: 404 で `missing` が `source`
      - name: list_documents
        title: 文書の一覧の取得
        kind: メソッド
        summary: リビジョンの全ての文書を返却する
        scope: public
        is_async: true
        thread_safe: true
        args:
          - name: source
            title: 配信元の ID
            type: str
            required: true
            passing: positional
            description: 問い合わせる配信元
          - name: ref
            title: リビジョン
            type: str | None
            required: false
            passing: keyword
            description: '`None` は配信元の `default_ref`'
            default: None
          - name: record_kinds
            title: 行の文書の種類
            type: Collection[str]
            required: false
            passing: keyword
            description: '`records` を持つ `documents[]` の行の ID（呼び出し側が配信元の表示の設定.行の文書の種類で指定する）'
            default: ()
          - name: values
            title: 値を求めるか
            type: bool
            required: false
            passing: keyword
            description: '`False` は `values=true` を付けず、`data` を空にする'
            default: 'True'
        returns:
          type: DocumentList
          description: '値を入れ、`body` を空にした文書'
        process: |-
          1. 文書の一覧の応答の取得（`source`・`ref`・`values`）で応答の本文を取る
          2. 文書の一覧の読み取り（`source`・応答の本文・`record_kinds`）で `DocumentList` にして返却する
        unit_tests:
          - name: test_list_documents
            case: 正常
            summary: ref と値を求める
            condition: '`ref="8b1d4e0"`'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: 要求のクエリに `ref=8b1d4e0`・`values=true`・`common_keys=true` があり、応答の `ref` と文書 2 件を返却する
          - name: test_list_documents_when_records
            case: 正常
            summary: 行の文書の添字
            condition: '`notes/files.yaml` の種類 `files` の文書 2 件と `docs/a.yaml` の種類 `design` の文書 1 件を返却し、`record_kinds=["files"]`'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '`files` の 2 件の `record_index` が 0・1、`design` の文書の `record_index` が `None`'
      - name: document
        title: 文書の詳細の取得
        kind: メソッド
        summary: 1 件の文書の値・本文と、`converters[]` の Markdown か失敗を返却する
        scope: public
        is_async: true
        thread_safe: true
        args:
          - *id001
          - name: path
            title: 文書のパス
            type: str
            required: true
            passing: positional
            description: 文書のファイルか本文のファイルのパス（拡張子つき）
          - &id002
            name: ref
            title: リビジョン
            type: str | None
            required: false
            passing: keyword
            description: '`None` は配信元の `default_ref`'
            default: None
          - name: document_id
            title: 文書の ID
            type: str | None
            required: false
            default: None
            passing: keyword
            description: 管理用の YAML の行の文書の要素を選ぶ。ファイル 1 つが 1 文書なら `None`
        returns:
          type: DocumentDetail
          description: 文書の詳細
        process: |-
          1. 呼び出しの共通の手順で `GET /sources/{source}/docs/{path}` を呼ぶ。クエリは `ref` と、`document_id` があれば `id`
          2. `value` が `null` なら `document` を `None` にする。それ以外は、応答の `metadata` の `id`・`kind` を `id`・`kind` に、応答の `metadata` の `id`・`kind`・`name`・`description`・`tags`・`visibility` に `metadata.commonKeys`（辞書のときだけ）を重ねたものを `metadata` にして、応答の `path`・`value`・`body`・`bodyPath`、`updatedAt` を日時にした `updated` で `IndexedDocument` を作る（`version` は空、`record_index` は `None`）
          3. `markdown` と、`conversionError` を `IndexFailure` にした `failure` を入れて返却する
        unit_tests:
          - name: test_document_when_failure
            case: 正常
            summary: 変換の失敗
            condition: '`conversionError` に `reason: exit`・`script` を持ち、`markdown` が `null` の応答'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '`markdown` が `None`、`failure.reason` が `exit`、`failure.script` が応答の値'
          - name: test_document_when_record
            case: 正常
            summary: 管理用の YAML の行の要素を選ぶ
            condition: '`path="notes/files.yaml"`・`document_id="n-1"`、応答が `body`・`bodyPath`・`updatedAt` と `metadata.commonKeys: {aliases: [作業場所]}` を持つ'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: 要求のクエリに `id=n-1` があり、`document` の `id` が `n-1`、`body`・`body_path` が応答の値、`updated` がタイムゾーン付きの日時、`metadata` の `aliases` が `[作業場所]`
          - name: test_document_when_yaml_unreadable
            case: 正常
            summary: YAML を読み込めない
            condition: '`value: null` で、`conversionError` が `reason: invalid_yaml`・`file`・`line`・`column` を持つ応答'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '`document` が `None`、`failure` の `reason` が `invalid_yaml` で `file`・`line`・`column` が応答の値'
      - name: decisions
        title: 検討事項の一覧の取得
        kind: メソッド
        summary: 検討事項の ID ごとの該当するフォルダの数を返却する
        scope: public
        is_async: true
        thread_safe: true
        args:
          - *id001
        returns:
          type: DecisionIndex
          description: 検討事項の一覧
        process: |-
          1. 呼び出しの共通の手順で `GET /sources/{source}/decisions` を呼ぶ
          2. `decisions[]` の `id` をキー、`folders` を値にした `counts` で `DecisionIndex` を返却する
        unit_tests:
          - name: test_decisions
            case: 正常
            summary: リンクにできる ID
            condition: '`decisions` が `[{id: D-1, folders: 1}, {id: D-2, folders: 2}]`'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '`linkable` が `{D-1}`'
      - name: decision
        title: 検討事項の文書の取得
        kind: メソッド
        summary: ちょうど 1 つのフォルダにある検討事項の文書の本文を返却する
        scope: public
        is_async: true
        thread_safe: true
        args:
          - *id001
          - name: decision_id
            title: 検討事項の ID
            type: str
            required: true
            passing: positional
            description: '`^[A-Z]+-[0-9]+$` の ID'
        returns:
          type: str
          description: 文書の本文
        process: |-
          1. 呼び出しの共通の手順で `GET /sources/{source}/decisions/{id}` を呼ぶ
          2. 応答の `body` を返却する。該当するフォルダが 0 個か 2 個以上なら呼び出しの共通の手順が `DocumentNotFoundError` を送信する
        unit_tests:
          - name: test_decision_when_ambiguous
            case: 異常
            summary: 2 つのフォルダにある
            condition: '404 の `missing: doc`'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '`DocumentNotFoundError`'
            exception: 404 で `missing` が `doc`
      - name: search
        title: 検索
        kind: メソッド
        summary: 単語を含む文書と一致した箇所を返却する
        scope: public
        is_async: true
        thread_safe: true
        args:
          - *id001
          - name: q
            title: 単語
            type: str
            required: true
            passing: positional
            description: 空白で区切った単語
          - *id002
          - name: limit
            title: 件数
            type: int
            required: true
            passing: keyword
            description: 返却する件数
          - name: include_excluded
            title: 除外される文書も含めるか
            type: bool
            required: false
            passing: keyword
            default: 'False'
            description: '`True` のときだけクエリに `include_excluded=true` を付ける'
        returns:
          type: SearchHits
          description: 検索の結果
        process: |-
          1. 呼び出しの共通の手順で `GET /sources/{source}/search` を呼ぶ
          2. `items[]` の `id`・`filePath`・`name`・`snippets`・`excluded`（無いときは `False`）・`matchCount`（整数でないときと無いときは `None`）を `SearchHit` の `id`・`path`・`name`・`snippets`・`excluded`・`match_count` にし、`totalCount` と `excludedCount`（無いときは `0`）とともに `SearchHits` にして返却する
        unit_tests:
          - name: test_search
            case: 正常
            summary: クエリを指定する
            condition: '`q="ページング"`・`limit=5`、応答の `items[]` が `path`・`id`・`filePath` を持つ'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: 要求のクエリに `q`・`limit` があり、`total_count` と、`path` が `filePath` の値の `items` を返却する
          - name: test_search_when_excluded
            case: 正常
            summary: 検索から除外される文書
            condition: '1 回目は `include_excluded` を省き、応答が `excludedCount: 1`。2 回目は `include_excluded=True` で、応答の `items[]` の 1 件が `excluded: true`'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: 1 回目の要求のクエリに `include_excluded` が無く `excluded_count` が 1。2 回目の要求のクエリに `include_excluded=true` があり、`excluded_count` が 0 でその 1 件の `excluded` が `True`
          - name: test_search_when_match_count
            case: 正常
            summary: 一致した行の数
            condition: '応答の `items[]` の 1 件目が `matchCount: 4`、2 件目が `matchCount` を持たない'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: 1 件目の `match_count` が 4、2 件目が `None`
      - name: refs
        title: リビジョンの一覧の取得
        kind: メソッド
        summary: 配信元のブランチ・タグ・最近の commit を返却する
        scope: public
        is_async: true
        thread_safe: true
        args:
          - *id001
          - name: commits
            title: commit の数
            type: int
            required: true
            passing: keyword
            description: 返却する最近の commit の数
        returns:
          type: RefList
          description: リビジョンの一覧
        process: |-
          1. 呼び出しの共通の手順で `GET /sources/{source}/refs` を呼ぶ
          2. 応答を `RefList` にして返却する
        unit_tests:
          - name: test_refs_when_not_git
            case: 正常
            summary: Git 管理外
            condition: '`git: false` の応答'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '`git` が `False` で、他の並びが空'
      - name: settings_sources
        title: 端末の設定の配信元の行の取得
        kind: メソッド
        summary: project-index の端末の設定の `sources[]` の行と状態を返却する
        scope: public
        is_async: true
        thread_safe: true
        args: []
        returns:
          type: SettingsSourcesView
          description: 行と状態
        process: |-
          1. 呼び出しの共通の手順で `GET /settings/sources` を呼ぶ
          2. `sources[]` の行ごとに、`id`・`config`・`enabled`・`scope`・`storage` と `outsideRead` を `outside_read` にした辞書を `rows`、`id`・`status`・`errors`・`config`・`configVersion` を `SourceState` にしたものを `states` にし、`settingsPath`・`version` とともに `SettingsSourcesView` にして返却する
        unit_tests:
          - name: test_settings_sources
            case: 正常
            summary: 行と状態
            condition: '`sources[]` 2 行（1 行は `outsideRead: false`、もう 1 行は `status: pending_reload`）と `version: v1`'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '`rows` が 2 件で 1 行目の `outside_read` が `False`、`states` が 2 件で 2 件目の `status` が `pending_reload`、`version` が `v1`'
      - name: put_settings_sources
        title: 端末の設定の配信元の行の保存
        kind: メソッド
        summary: '`sources[]` の全行の保存と再読み込みを依頼する'
        scope: public
        is_async: true
        thread_safe: true
        args:
          - name: rows
            title: 行
            type: list[dict[str, Any]]
            required: true
            passing: positional
            description: 保存する全行（`config` は配列）
          - name: expected_version
            title: 内容のバージョン
            type: str | None
            required: false
            default: None
            passing: keyword
            description: 画面が受け取った内容のバージョン。`None` は照合しない
        returns:
          type: SettingsSourcesView
          description: 再読み込みした後の行と状態
        process: |-
          1. 呼び出しの共通の手順で `PUT /settings/sources`（本文 `{sources: rows}`。`expected_version` が `None` でなければ `expectedVersion` も添える）を呼ぶ。422 は呼び出しの共通の手順が `ProjectIndexRejectedError` を送信する
          2. 応答が 409 の場合、応答の `current` を持つ `SettingsVersionConflictError` を送出する（GET を呼ばない）
          3. 応答は行（`config`・`scope`）を持たないため、端末の設定の取得（`GET /settings/sources`）を呼んでその結果（保存した後の `version` を含む）を返却する
        unit_tests:
          - name: test_put_settings_sources
            case: 正常
            summary: 保存して行を再取得する
            condition: PUT が 200 で状態 2 件、GET が 2 行を返却する
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: 'PUT の本文が `{sources: rows}`、続けて GET を呼び、`rows` が GET の 2 行'
          - name: test_put_settings_sources_when_rejected
            case: 異常
            summary: スキーマに通らない
            condition: 422 で `errors[]` 1 件
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '`ProjectIndexRejectedError` で、`violations` が応答の 1 件。GET を呼ばない'
            exception: '422'
          - name: test_put_settings_sources_when_expected_version
            case: 正常
            summary: 内容のバージョンを添えて保存する
            condition: '`expected_version: v1`、PUT が 200、GET が `version: v2` を返却する'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: 'PUT の本文が `{sources: rows, expectedVersion: v1}` で、返った `version` が `v2`'
          - name: test_put_settings_sources_when_conflict
            case: 異常
            summary: 内容のバージョンが古い
            condition: 'PUT が 409（`current: v2`）を返却する'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '`SettingsVersionConflictError` で `current` が `v2`。GET を呼ばない'
            exception: '409'
        exceptions:
          - name: SettingsVersionConflictError
            condition: 409（`expected_version` が今の内容のバージョンと違う）
            message: '`端末の設定は他の書き換えで変わっています`'
      - name: save_settings_sources
        title: 端末の設定の配信元の行の照合つきの保存
        kind: メソッド
        summary: 内容のバージョンを照合して `sources[]` の全行を保存する。保存した後の行は取得しない
        scope: public
        is_async: true
        thread_safe: true
        args:
          - name: rows
            title: 行
            type: list[dict[str, Any]]
            required: true
            passing: positional
            description: 保存する全行（キーは `id`・`config`・`enabled`・`scope`・`outsideRead` だけ）
          - name: expected_version
            title: 内容のバージョン
            type: str | None
            required: true
            passing: keyword
            description: 取得したときの内容のバージョン。`None` は照合しない
        returns:
          type: None
          description: '-'
        process: |-
          1. 呼び出しの共通の手順で `PUT /settings/sources`（本文 `{sources: rows, expectedVersion: expected_version}`）を呼ぶ。400 は `InvalidArgumentError`、422 は `ProjectIndexRejectedError` を呼び出しの共通の手順が送出する
          2. 応答が 409 の場合、`ProjectIndexResponseError`（`status_code` は 409、`summary` は本文の先頭 200 文字）を送出する
        unit_tests:
          - name: test_save_settings_sources
            case: 正常
            summary: 照合つきで保存する
            condition: PUT が 200 で状態 2 件を返却する
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: 'PUT の本文が `{sources: rows, expectedVersion: v1}` で、GET を呼ばない'
          - name: test_save_settings_sources_when_conflict
            case: 異常
            summary: 内容のバージョンが古い
            condition: PUT が 409 を返却する
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '`ProjectIndexResponseError` で、`status_code` が 409'
            exception: 409（取得した後に端末の設定が変わった）
          - name: test_save_settings_sources_when_invalid
            case: 異常
            summary: 本文の検証に通らない
            condition: PUT が 400 で `errors[]` に `sources[1].enabled` を 1 件返却する
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '`InvalidArgumentError` で、`violations[0].path` が `sources[1].enabled`'
        exceptions:
          - name: ProjectIndexResponseError
            condition: 409（取得した後に端末の設定が変わった）
            message: '`project-index が 409 を返しました: {summary}`'
      - name: aclose
        title: 閉じる
        kind: メソッド
        summary: HTTP のクライアントを閉じる
        scope: public
        is_async: true
        returns:
          type: None
          description: '-'
        process: 1. `self._client.aclose()` を呼ぶ
      - name: fetch_document_list
        title: 文書の一覧の応答の取得
        kind: メソッド
        scope: public
        is_async: true
        thread_safe: true
        summary: リビジョンの全ての文書の応答の本文を、行の文書の種類を知る前に取る
        args:
          - name: source
            title: 配信元の ID
            type: str
            required: true
            passing: positional
            description: 問い合わせる配信元
          - name: ref
            title: リビジョン
            type: str | None
            required: false
            default: None
            passing: keyword
            description: '`None` は配信元の `default_ref`'
          - name: values
            title: 値を求めるか
            type: bool
            required: false
            default: 'True'
            passing: keyword
            description: '`False` は `values=true` を付けない'
        returns:
          type: Mapping[str, Any]
          description: '`GET /sources/{source}/docs` の応答の本文'
        process: |-
          1. 呼び出しの共通の手順で `GET /sources/{source}/docs?ref={ref}` を呼ぶ。クエリに `common_keys=true` を常に付け、`values` が `True` なら `values=true` も付ける
          2. 応答の本文を JSON として返却する
        exceptions:
          - name: ProjectIndexUnreachableError
            condition: 接続できない・制限時間を超えた
            message: '`project-index（{address}）に接続できませんでした。{reason}`'
        unit_tests:
          - name: test_fetch_document_list
            case: 正常
            summary: 応答の本文をそのまま返却する
            condition: '`ref="main"`'
            mock: '`httpx.MockTransport`（`GET /sources/sample/docs` に文書 2 件を返却する）'
            expected: クエリが `ref=main`・`values=true`・`common_keys=true` で、戻り値が応答の本文
      - name: source_config
        title: 配信元の設定の取得
        kind: メソッド
        summary: 配信元の設定の応答の本文と、その内容のハッシュを返却する
        scope: public
        is_async: true
        thread_safe: true
        args:
          - name: source
            title: 配信元の ID
            type: str
            required: true
            passing: positional
            description: 問い合わせる配信元
        returns:
          type: SourceConfig
          description: 配信元の設定
        process: |-
          1. 呼び出しの共通の手順で `GET /sources/{source}/config?schemas=true` を呼ぶ
          2. 応答の JSON を `value`、応答の本文のバイト列の SHA-256 の 16 進数を `config_hash` にして返却する
        unit_tests:
          - name: test_source_config
            case: 正常
            summary: 応答の本文と内容のハッシュ
            condition: config が同じ本文を 2 回返却し、続けて `nav` を変えた本文を返却する
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: 要求のクエリに `schemas=true` がある。同じ本文の 2 回は `config_hash` が同じで、`nav` を変えた本文は `config_hash` が違う。`value` が応答の JSON
      - name: commit_documents
        title: 直コミットの書き込み
        kind: メソッド
        summary: project-index の書き込みの API へ `writes`・`deletes`・`message`・`dryRun`・`baseCommit` を 1 回送信し、状態コードと本文を返却する
        scope: public
        is_async: true
        thread_safe: true
        args:
          - name: source_id
            type: str
            required: true
            passing: positional
            description: 配信元の ID
          - name: body
            type: Mapping[str, object]
            required: true
            passing: positional
            description: '`writes`・`deletes`・`message`・`dryRun`・`baseCommit`'
        returns:
          type: tuple[int, dict]
          description: 状態コードと本文（200 の応答（衝突したときは `conflict` を持つ）か problem+json）
        process: |-
          1. `Origin` を付けずに POST `/sources/{source}/commits` を呼ぶ。待ちの上限は読み取りの `timeout` ではなく `PROJECT_INDEX_WRITE_TIMEOUT_SEC` にする
          2. 4xx・5xx も例外にせず、状態コードと本文を返却する（変更ごとの理由への戻しは呼び出し元が行う）
          3. 接続できないときは `ProjectIndexUnreachableError`、待ちの上限を超えたときは `ProjectIndexTimeoutError` を送出する
        unit_tests:
          - name: test_commit_documents
            case: 正常
            summary: 状態コードと本文を返却する
            condition: 200 と 422 を返却する project-index
            mock: '`httpx.MockTransport`（要求を記録する）'
            expected: '`(200, 本文)`・`(422, problem+json)` を返却し、要求に `Origin` が無い'
          - name: test_commit_documents_when_timed_out
            case: 異常
            summary: 待ちの上限
            condition: 応答しない project-index と、待ちの上限 0.1 秒
            mock: '`httpx.MockTransport`（`httpx.ReadTimeout` を送出する）'
            expected: '`ProjectIndexTimeoutError`'
            exception: 待ちの上限
          - name: test_commit_documents_when_conflict
            case: 正常
            summary: 衝突の応答をそのまま返却する
            condition: 本文に `baseCommit` を持ち、project-index が `conflict` を持つ 200 を返却する
            mock: '`httpx.MockTransport`（要求を記録する）'
            expected: 要求の本文に `baseCommit` があり、戻り値が `(200, conflict を持つ本文)`
      - name: item_versions
        title: 項目ごとのバージョンの取得
        kind: メソッド
        summary: 指定のリビジョンの文書の最上位のキーごとのバージョンを返却する
        scope: public
        is_async: true
        thread_safe: true
        args:
          - name: source
            title: 配信元の ID
            type: str
            required: true
            passing: positional
            description: 問い合わせる配信元
          - name: path
            title: 文書のパス
            type: str
            required: true
            passing: positional
            description: 文書のファイルのパス（拡張子つき）
          - name: ref
            title: リビジョン
            type: str
            required: true
            passing: keyword
            description: 編集を始めたときのコミット
          - name: document_id
            title: 文書の ID
            type: str
            required: true
            passing: keyword
            description: 文書の ID（管理用の YAML の行の要素を選ぶ）
        returns:
          type: dict[str, str]
          description: 応答の `itemVersions`（無ければ空）
        process: |-
          1. 呼び出しの共通の手順で `GET /sources/{source}/docs/{path}` をクエリ `ref`・`id` で呼ぶ
          2. 応答の `itemVersions` を返却する（変換の結果は使用しない）
        exceptions:
          - name: DocumentNotFoundError
            condition: 404 で `missing` が `doc`
            message: '`文書がありません: {path}`'
          - name: RefNotFoundError
            condition: 404 で `missing` が `ref`
            message: '`ref を解決できません: {value}`'
        unit_tests:
          - name: test_item_versions
            case: 正常
            summary: 項目ごとのバージョンを返却する
            condition: '`ref="0a1b2c3"`・`document_id="n1"`、応答が `itemVersions: {tags: a1, description: b2}`'
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: '要求のクエリが `ref=0a1b2c3`・`id=n1` で、戻り値が `{tags: a1, description: b2}`'
          - name: test_item_versions_when_missing
            case: 正常
            summary: '`itemVersions` が無い応答'
            condition: 応答が `itemVersions` を持たない
            mock: '`httpx.MockTransport` で project-index の応答を返却する'
            expected: 戻り値が空の辞書
constants:
  - name: PROJECT_INDEX_DEFAULT
    title: project-index の既定の接続先
    container: integrations/project_index/client.py
    usecase: project-index の呼び出し
    summary: 端末の設定の `project_index` の既定値（外部 API『project-index の読み取り API』の手元の端末の `base_urls`）
    value: '"http://127.0.0.1:8786"'
  - name: PROJECT_INDEX_TIMEOUT_SEC
    title: project-index への問い合わせの制限時間
    container: integrations/project_index/client.py
    usecase: project-index の呼び出し
    summary: 1 回の要求の上限（秒）。非機能要件の `project_index_timeout`
    value: '45'
  - name: PROJECT_INDEX_WRITE_TIMEOUT_SEC
    title: project-index の書き込みの API の待ち
    container: integrations/project_index/client.py
    usecase: 画面で編集中の変更をまとめて直コミットする
    summary: 直コミットの書き込みの応答を待つ上限（秒）
    value: '72.0'
tags:
  - name: tool:project-index
    main: true
  - name: topic:api
functions:
  - name: build_source_view
    title: 配信元の表示の設定の組み立て
    kind: 関数
    container: integrations/project_index/client.py
    usecase: project-index の呼び出し
    role: マッパー
    summary: 配信元の設定とリビジョンの一覧から、画面が使用する配信元の表示の設定を作る
    scope: public
    args:
      - name: source
        title: 配信元の ID
        type: str
        required: true
        passing: positional
        description: 問い合わせた配信元
      - name: config
        title: 配信元の設定
        type: SourceConfig
        required: true
        passing: positional
        description: 配信元の設定の取得の結果
      - name: refs
        title: リビジョンの一覧
        type: RefList
        required: true
        passing: positional
        description: リビジョンの一覧（`commits=0`）の結果
    returns:
      type: SourceView
      description: 配信元の表示の設定
    process: |-
      1. `id` を `source`、`git`・`default_ref` を `refs.git`・`refs.default_ref`（`git` が `False` なら `None`）、`config_hash` を `config.config_hash` にする
      2. `config.value` の `documents[]` の行ごとに、配信元の設定のままのキー `id`・`title`・`paths`・`records`・`search`・`converter`・`alias_type`・`metadata`（無ければ空）と、`schemas[id]`（無ければ空）を `schema` にした `DocumentRow` を作る
      3. `decisions.folders` を `decision_folders`、`diff.ignore_keys` を `diff_ignore_keys`、`github.repository`・`github.issueLabels` を `github_repository`・`github_issue_labels` にして返却する
    unit_tests:
      - name: test_build_source_view_when_not_git
        case: 正常
        summary: Git 管理外の配信元と内容のハッシュ
        condition: '`git` が `False`・`default_ref` が `main` のリビジョンの一覧と、`config_hash` が `abc` の配信元の設定'
        mock: なし
        expected: '`git` が `False`、`default_ref` が `None`、`config_hash` が `abc`'
