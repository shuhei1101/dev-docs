id: MOD-155-215
title: 開発ドキュメントサーバー / project-indexの呼び出し / client.py
lead: project-index の読み取り API と端末の設定の API を制限時間つきで呼び、応答を型にする処理を受け持ち、project-indexの呼び出しの client.py を修正するときに参照する。
test_files:
  - tests/unit/dev_docs/integrations/project_index/test_client.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        project-indexの呼び出し ..> 索引の文書の読み取り
        class project-indexの呼び出し {
          +接続先: str
          +制限時間: float
          +文書の一覧の取得()
          +文書の詳細の取得()
          +端末の設定の配信元の行の保存()
        }
        class 索引の文書の読み取り {
