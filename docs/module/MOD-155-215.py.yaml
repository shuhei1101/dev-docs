id: MOD-155-215
title: 開発ドキュメントサーバー / project-indexの呼び出し / client.py
lead: project-index の読み取り API と端末の設定の API を制限時間つきで呼び、応答を型にする。
test_files:
  - tests/unit/dev_docs/integrations/project_index/test_client.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        project-indexの呼び出し ..> 索引の文書の読み取り
        class project-indexの呼び出し {
          +接続先: str
          +制限時間: float
          +文書の一覧の取得()
          +文書の詳細の取得()
          +端末の設定の配信元の行の保存()
        }
        class 索引の文書の読み取り {
          <<function>>
        }
        click 索引の文書の読み取り href "./MOD-155-214.py.yaml#索引の文書の読み取り"
classes:
  - name: ProjectIndexClient
    title: project-indexの呼び出し
    container: integrations/project_index/client.py
    usecase: project-index の呼び出し
    role: ゲートウェイ
    summary: project-index の API を `httpx.AsyncClient` で呼び、応答を型にする。要求ごとに問い合わせ、応答を控えない
    description: 起動の『部品の配線』が端末の設定の `project_index` と非機能要件の `project_index_timeout` で 1 つ作り、アプリの停止で `aclose` する。`dev-docs migrate` は `asyncio.run` の中で同じ型を作る。
    properties:
      - name: address
        title: 接続先
        type: str
        access: 公開
        description: 端末の設定の `project_index`（末尾の `/` を除く）
      - name: timeout
        title: 制限時間
        type: float
        access: 公開
        description: 要求 1 回の全体の上限（秒）。`PROJECT_INDEX_TIMEOUT_SEC`。`httpx` の接続・読み取りなど待ちごとの上限にも同じ値を入れる
      - name: _client
        title: HTTP のクライアント
        type: httpx.AsyncClient
        access: 内部 (_)
        description: '`base_url` を `address`、`timeout` を `timeout` にしたもの。テストは `transport` を差し替える'
    methods:
      - name: request
        title: 呼び出しの共通の手順
        kind: メソッド
        summary: project-index へ 1 回要求し、つながらない・打ち切った・断られたことを例外に変える
        scope: internal
        is_async: true
        thread_safe: true
        args:
          - name: method
            title: メソッド
            type: str
            required: true
            passing: positional
            description: '`GET`・`PUT`・`POST`'
          - name: path
            title: パス
            type: str
            required: true
            passing: positional
            description: '`/sources` のような API のパス（パスの要素は URL エンコード済み）'
          - name: params
            title: クエリ
            type: Mapping[str, str | int] | None
            required: false
            passing: keyword
            description: 値が `None` のキーは送らない
            default: None
          - name: body
            title: 本文
            type: Any
            required: false
            passing: keyword
            description: JSON の本文
            default: None
        returns:
          type: httpx.Response
          description: 2xx・409 の応答
        process: |-
          1. `asyncio.timeout(self.timeout)` の中で `self._client` で要求する。要求全体が `timeout` を超えるか接続できなければ `ProjectIndexUnreachableError`（`address` は `self.address`）を送る
             - 接続を断られた（`httpx.ConnectError`）: `reason` を `接続を拒否されました（Connection refused）`
             - 制限時間を超えた（`TimeoutError`・`httpx.TimeoutException`）: `reason` を `{timeout} 秒以内に応答がありませんでした`
             - そのほかの `httpx.TransportError`: `reason` を例外の文字列
          2. 応答のステータスで分ける
             - 2xx・409: 応答を返す
             - 404: problem+json の `missing` で分ける。`source` なら `UnknownSourceError`（`source_id` は `value`）、`not_served` なら `SourceNotServedError`（`violations` は `errors[]` の `{path, reason}` を `Violation(path, rule=reason)` にしたもの、`disabled` は応答の `disabled`）、`ref` なら `RefNotFoundError`（`argument` は応答の `argument`、無ければ `ref`。`value` は応答の `value`）、それ以外は `DocumentNotFoundError`（`missing` は `[value]`、`candidates` は空）
             - 400: `InvalidArgumentError`（`message` は `detail`、`violations` は `errors[]` を `Violation` にしたもの）を送る
             - 422: `ProjectIndexRejectedError`（`violations` は `errors[]` を `Violation` にしたもの）を送る
             - それ以外: `ProjectIndexResponseError`（`status_code` は応答のステータス、`summary` は本文の先頭 200 文字）を送る
        exceptions:
          - name: ProjectIndexUnreachableError
            condition: 接続できない・制限時間を超えた
            message: '`project-index（{address}）に接続できませんでした。{reason}`'
          - name: UnknownSourceError
            condition: 404 で `missing` が `source`
            message: '`配信元がありません: {id}`'
          - name: SourceNotServedError
            condition: 404 で `missing` が `not_served`
            message: '`{id} は配信していません`'
          - name: RefNotFoundError
            condition: 404 で `missing` が `ref`
            message: '`ref を解決できません: {value}`'
          - name: DocumentNotFoundError
            condition: 404 で `missing` が `doc`
            message: '`文書がありません: {path}`'
          - name: ProjectIndexRejectedError
            condition: '422'
            message: '`project-index が要求を受け付けませんでした`'
          - name: ProjectIndexResponseError
            condition: 2xx・400・404・409・422 以外
            message: '`project-index が {status} を返しました: {summary}`'
        unit_tests:
          - name: test_request_when_refused
            case: 異常
            summary: 接続を断られる
            condition: '`MockTransport` が `httpx.ConnectError` を送る'
            mock: '`httpx.MockTransport` で project-index の応答を返す'
            expected: '`ProjectIndexUnreachableError` で、`address` が `self.address`、`reason` が `接続を拒否されました（Connection refused）`'
            exception: 接続できない・制限時間を超えた
          - name: test_request_when_timeout
            case: 異常
            summary: 制限時間を超える
            condition: '`MockTransport` が `httpx.ReadTimeout` を送り、`timeout` が 45'
            mock: '`httpx.MockTransport` で project-index の応答を返す'
            expected: '`ProjectIndexUnreachableError` で、`reason` が `45 秒以内に応答がありませんでした`'
            exception: 接続できない・制限時間を超えた
          - name: test_request_when_not_found
            case: 異常
            summary: 404 の missing ごとの例外
            condition: 404 の problem+json の `missing` が `source`・`not_served`（`errors[]` 1 件）・`ref`・`doc`
            mock: '`httpx.MockTransport` で project-index の応答を返す'
            expected: 順に `UnknownSourceError`・`SourceNotServedError`（`violations` 1 件）・`RefNotFoundError`（`argument` が `ref`）・`DocumentNotFoundError`（`missing` が `[value]`）
            exception: 404 で `missing` が `source`
          - name: test_request_when_unexpected_status
            case: 異常
            summary: 想定しないステータス
            condition: 500 で本文が 300 文字
            mock: '`httpx.MockTransport` で project-index の応答を返す'
            expected: '`ProjectIndexResponseError` で、`status_code` が 500、`summary` が本文の先頭 200 文字'
            exception: 2xx・400・404・409・422 以外
          - name: test_request_when_total_timeout
            case: 異常
            summary: 要求全体の上限
            condition: '`timeout` を 0.2 にし、`MockTransport` がヘッダーを返した後に本文を 0.15 秒ずつ 3 回に分けて返す'
            mock: '`httpx.MockTransport` で project-index の応答を返す'
            expected: '`ProjectIndexUnreachableError` で、`reason` が `0.2 秒以内に応答がありませんでした`'
            exception: 接続できない・制限時間を超えた
      - name: list_sources
        title: 配信元の状態の一覧
        kind: メソッド
        summary: 配信元の一覧と配信元ごとの状態を返す
        scope: public
        is_async: true
        thread_safe: true
        args: []
        returns:
          type: list[SourceState]
          description: project-index の配信元の並び
        process: |-
          1. 呼び出しの共通の手順で `GET /sources` を呼ぶ
          2. 応答の `sources[]` を `SourceState` にして返す
        unit_tests:
          - name: test_list_sources
            case: 正常
            summary: 状態の読み替え
            condition: '`sources[]` に `serving` の sample と、`not_served`・`errors[]` 1 件の broken'
            mock: '`httpx.MockTransport` で project-index の応答を返す'
            expected: 2 件で、broken の `errors` が `Violation` 1 件
      - name: source_view
        title: 配信元の表示の設定の取得
        kind: メソッド
        summary: 配信元の設定のうち画面が使うキーを返す
        scope: public
        is_async: true
        thread_safe: true
        args:
          - &id001
            name: source
            title: 配信元の ID
            type: str
            required: true
            passing: positional
            description: 問い合わせる配信元
        returns:
          type: SourceView
          description: 配信元の表示の設定
        process: |-
          1. 呼び出しの共通の手順で `GET /sources/{source}/config` を呼ぶ
          2. `documents[]` を `DocumentRow` に、`decisions.folders` を `decision_folders` に、`github.repository`・`github.issue_labels` をそれぞれのキーにして返す
        unit_tests:
          - name: test_source_view
            case: 正常
            summary: 画面の構成と文書の行
            condition: '`nav` と `documents[]` 2 行（1 行は `records: files`）を返す'
            mock: '`httpx.MockTransport` で project-index の応答を返す'
            expected: '`nav` が応答の値、`documents` が 2 件で `records` が `files` の行を持つ'
      - name: list_documents
        title: 文書の一覧の取得
        kind: メソッド
        summary: リビジョンの全ての文書を返す
        scope: public
        is_async: true
        thread_safe: true
        args:
          - *id001
          - &id002
            name: ref
            title: リビジョン
            type: str | None
            required: false
            passing: keyword
            description: '`None` は配信元の `default_ref`'
            default: None
        returns:
          type: DocumentList
          description: '`body` を空にした文書と読めなかったファイル'
        process: |-
          1. 呼び出しの共通の手順で `GET /sources/{source}/docs` を呼ぶ
          2. `documents[]` を索引の文書の読み取りで `IndexedDocument` にし、`unreadable[]` を `IndexFailure` にして返す
        unit_tests:
          - name: test_list_documents
            case: 正常
            summary: ref を渡す
            condition: '`ref="8b1d4e0"`'
            mock: '`httpx.MockTransport` で project-index の応答を返す'
            expected: 要求のクエリに `ref=8b1d4e0` があり、応答の `ref` と文書 2 件を返す
      - name: document
        title: 文書の詳細の取得
        kind: メソッド
        summary: 1 件の文書の値・本文と、`converters[]` の Markdown か失敗を返す
        scope: public
        is_async: true
        thread_safe: true
        args:
          - *id001
          - name: path
            title: 文書のパス
            type: str
            required: true
            passing: positional
            description: 文書のファイルか本文のファイルのパス（拡張子つき）
          - *id002
          - name: document_id
            title: 文書の ID
            type: str | None
            required: false
            default: None
            passing: keyword
            description: 管理用の YAML の行の文書の要素を選ぶ。ファイル 1 つが 1 文書なら `None`
        returns:
          type: DocumentDetail
          description: 文書の詳細
        process: |-
          1. 呼び出しの共通の手順で `GET /sources/{source}/docs/{path}` を呼ぶ。クエリは `ref` と、`document_id` があれば `id`
          2. `document` を索引の文書の読み取りで `IndexedDocument` にし（無ければ `None`）、`markdown`・`failure` を写して返す
        unit_tests:
          - name: test_document_when_failure
            case: 正常
            summary: 変換の失敗
            condition: '`failure` に `reason: timeout`・`script` を持つ応答'
            mock: '`httpx.MockTransport` で project-index の応答を返す'
            expected: '`markdown` が `None`、`failure.reason` が `timeout`'
          - name: test_document_when_record
            case: 正常
            summary: 管理用の YAML の行の要素を選ぶ
            condition: '`path="notes/files.yaml"`・`document_id="n-1"`'
            mock: '`httpx.MockTransport` で project-index の応答を返す'
            expected: 要求のクエリに `id=n-1` があり、応答の文書を返す
      - name: decisions
        title: 検討事項の一覧の取得
        kind: メソッド
        summary: 検討事項の ID ごとの当たるフォルダの数を返す
        scope: public
        is_async: true
        thread_safe: true
        args:
          - *id001
        returns:
          type: DecisionIndex
          description: 検討事項の一覧
        process: |-
          1. 呼び出しの共通の手順で `GET /sources/{source}/decisions` を呼ぶ
          2. `counts` をそのまま `DecisionIndex` にして返す
        unit_tests:
          - name: test_decisions
            case: 正常
            summary: リンクにできる ID
            condition: '`counts` が `{D-1: 1, D-2: 2}`'
            mock: '`httpx.MockTransport` で project-index の応答を返す'
            expected: '`linkable` が `{D-1}`'
      - name: decision
        title: 検討事項の文書の取得
        kind: メソッド
        summary: ちょうど 1 つのフォルダにある検討事項の文書の本文を返す
        scope: public
        is_async: true
        thread_safe: true
        args:
          - *id001
          - name: decision_id
            title: 検討事項の ID
            type: str
            required: true
            passing: positional
            description: '`^[A-Z]+-[0-9]+$` の ID'
        returns:
          type: str
          description: 文書の本文
        process: |-
          1. 呼び出しの共通の手順で `GET /sources/{source}/decisions/{id}` を呼ぶ
          2. 応答の `markdown` を返す。当たるフォルダが 0 個か 2 個以上なら呼び出しの共通の手順が `DocumentNotFoundError` を送る
        unit_tests:
          - name: test_decision_when_ambiguous
            case: 異常
            summary: 2 つのフォルダにある
            condition: '404 の `missing: doc`'
            mock: '`httpx.MockTransport` で project-index の応答を返す'
            expected: '`DocumentNotFoundError`'
            exception: 404 で `missing` が `doc`
      - name: search
        title: 検索
        kind: メソッド
        summary: 語を含む文書と一致した箇所を返す
        scope: public
        is_async: true
        thread_safe: true
        args:
          - *id001
          - name: q
            title: 語
            type: str
            required: true
            passing: positional
            description: 空白で区切った語
          - *id002
          - name: limit
            title: 件数
            type: int
            required: true
            passing: keyword
            description: 返す件数
        returns:
          type: SearchHits
          description: 検索の結果
        process: |-
          1. 呼び出しの共通の手順で `GET /sources/{source}/search` を呼ぶ
          2. `totalCount`・`items[]` を `SearchHits` にして返す
        unit_tests:
          - name: test_search
            case: 正常
            summary: クエリを渡す
            condition: '`q="ページング"`・`limit=5`'
            mock: '`httpx.MockTransport` で project-index の応答を返す'
            expected: 要求のクエリに `q`・`limit` があり、`total_count` と `items` を返す
      - name: refs
        title: リビジョンの一覧の取得
        kind: メソッド
        summary: 配信元のブランチ・タグ・最近の commit を返す
        scope: public
        is_async: true
        thread_safe: true
        args:
          - *id001
          - name: commits
            title: commit の数
            type: int
            required: true
            passing: keyword
            description: 返す最近の commit の数
        returns:
          type: RefList
          description: リビジョンの一覧
        process: |-
          1. 呼び出しの共通の手順で `GET /sources/{source}/refs` を呼ぶ
          2. 応答を `RefList` にして返す
        unit_tests:
          - name: test_refs_when_not_git
            case: 正常
            summary: Git 管理外
            condition: '`git: false` の応答'
            mock: '`httpx.MockTransport` で project-index の応答を返す'
            expected: '`git` が `False` で、他の並びが空'
      - name: settings_sources
        title: 端末の設定の配信元の行の取得
        kind: メソッド
        summary: project-index の端末の設定の `sources[]` の行と状態を返す
        scope: public
        is_async: true
        thread_safe: true
        args: []
        returns:
          type: SettingsSourcesView
          description: 行と状態
        process: |-
          1. 呼び出しの共通の手順で `GET /settings/sources` を呼ぶ
          2. `settingsPath`・`sources[]`・状態を `SettingsSourcesView` にして返す
        unit_tests:
          - name: test_settings_sources
            case: 正常
            summary: 行と状態
            condition: 2 行と状態 2 件
            mock: '`httpx.MockTransport` で project-index の応答を返す'
            expected: '`rows` が 2 件、`states` が 2 件'
      - name: put_settings_sources
        title: 端末の設定の配信元の行の保存
        kind: メソッド
        summary: '`sources[]` の全行の保存と読み直しを依頼する'
        scope: public
        is_async: true
        thread_safe: true
        args:
          - name: rows
            title: 行
            type: list[dict[str, Any]]
            required: true
            passing: positional
            description: 保存する全行（`config` は配列）
        returns:
          type: SettingsSourcesView
          description: 読み直した後の行と状態
        process: |-
          1. 呼び出しの共通の手順で `PUT /settings/sources` を呼ぶ
          2. 応答を `SettingsSourcesView` にして返す。422 は呼び出しの共通の手順が `ProjectIndexRejectedError` を送る
        unit_tests:
          - name: test_put_settings_sources_when_rejected
            case: 異常
            summary: スキーマに通らない
            condition: 422 で `errors[]` 1 件
            mock: '`httpx.MockTransport` で project-index の応答を返す'
            expected: '`ProjectIndexRejectedError` で、`violations` が応答の 1 件'
            exception: '422'
      - name: add_settings_source
        title: 端末の設定の配信元の行の追加
        kind: メソッド
        summary: 配信元の行を 1 行追加する。同じ id の行があれば追加しない
        scope: public
        is_async: true
        thread_safe: true
        args:
          - name: row
            title: 行
            type: dict[str, Any]
            required: true
            passing: positional
            description: 追加する行
        returns:
          type: AddSourceResult
          description: 追加したか・内容が同じか
        process: |-
          1. 呼び出しの共通の手順で `POST /settings/sources` を呼ぶ
          2. 201 なら `added=True`、409 なら `added=False`・`same` を応答の `same` にして返す
        unit_tests:
          - name: test_add_settings_source_when_conflict
            case: 正常
            summary: 同じ id の行がある
            condition: '409 で `same: true`'
            mock: '`httpx.MockTransport` で project-index の応答を返す'
            expected: '`added` が `False`、`same` が `True`'
      - name: aclose
        title: 閉じる
        kind: メソッド
        summary: HTTP のクライアントを閉じる
        scope: public
        is_async: true
        returns:
          type: None
          description: '-'
        process: 1. `self._client.aclose()` を呼ぶ
constants:
  - name: PROJECT_INDEX_DEFAULT
    title: project-index の既定の接続先
    container: integrations/project_index/client.py
    usecase: project-index の呼び出し
    summary: 端末の設定の `project_index` の既定値（外部 API『project-index の読み取り API』の手元の端末の `base_urls`）
    value: '"http://127.0.0.1:8786"'
  - name: PROJECT_INDEX_TIMEOUT_SEC
    title: project-index への問い合わせの制限時間
    container: integrations/project_index/client.py
    usecase: project-index の呼び出し
    summary: 1 回の要求の上限（秒）。非機能要件の `project_index_timeout`
    value: '45'
