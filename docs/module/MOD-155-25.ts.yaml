id: MOD-155-25
title: 画面 / 文書の画面 / use-mdmark.ts
lead: mdmark の `mount` を React の寿命に合わせて呼ぶフックを受け持ち、文書の画面の use-mdmark.ts を修正するときに参照する。
test_files:
  - tests/unit/frontend/src/features/docs/doc-view/hooks/use-mdmark.test.ts
constants:
  - name: MDMARK_CDN_BASE
    title: mdmark の読み込み先の頭
    container: features/docs/doc-view/hooks/use-mdmark.ts
    usecase: 文書を参照する
    summary: jsDelivr の GitHub の mdmark の URL の、バージョンより前の部分。integrity は付けない
    value: '"https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@"'
  - name: MDMARK_VERSION_META
    title: mdmark のバージョンの meta の名前
    container: features/docs/doc-view/hooks/use-mdmark.ts
    usecase: 文書を参照する
    summary: 画面の配信が `index.html` に入れる、mdmark のバージョンの `<meta>` の `name`
    value: '"mdmark-version"'
  - name: DEFAULT_MDMARK_VERSION
    title: mdmark のバージョンの既定
    container: features/docs/doc-view/hooks/use-mdmark.ts
    usecase: 文書を参照する
    summary: '`<meta>` が無いとき（Vite の開発サーバー・単体テスト）に読み込む mdmark のバージョン（develop の最新）'
    value: '"develop"'
  - name: MDMARK_MAP
    title: map の種類の設定
    container: features/docs/doc-view/hooks/use-mdmark.ts
    usecase: 文書を参照する
    summary: 変換が出す map の範囲の Mermaid のクラス（`external`・`script`・`data`・`start`・`question`・`action`・`result`）の `map.kinds` と、線の名前（`read`・`write`・`reply`・`loop`）の `map.lines`。値は同じフォルダの `mdmark-map.json` から参照し、文書の取得の結合テストの mdmark の点検も同じファイルを使用する
    value: '`mdmark-map.json` の `kinds`・`lines`'
functions:
  - name: mdmarkUrls
    title: mdmark の読み込み先
    kind: 関数
    container: features/docs/doc-view/hooks/use-mdmark.ts
    usecase: 文書を参照する
    role: 変換
    summary: '`<meta name="mdmark-version">` の値から、mdmark の JS と CSS の URL を組み立てる'
    scope: public
    args:
      - name: doc
        title: 文書
        type: Document
        required: false
        default: document
        passing: positional
        description: '`<meta>` を探す文書'
    returns:
      type: '{js: string; css: string}'
      description: '`{MDMARK_CDN_BASE}{バージョン}/dist/index.js` と `{MDMARK_CDN_BASE}{バージョン}/dist/index.css`'
    process: |-
      1. `doc.head` の `meta[name="{MDMARK_VERSION_META}"]` の `content` を取る。無い・空のときは `DEFAULT_MDMARK_VERSION` にする
      2. JS と CSS の URL を同じバージョンで組み立てて返却する
    unit_tests:
      - name: test_mdmark_urls
        case: 正常
        summary: meta のバージョンで組み立てる
        condition: '`<meta name="mdmark-version" content="v0.13.0">` を持つ文書'
        mock: なし
        expected: '`js` が `https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@v0.13.0/dist/index.js`、`css` が `…@v0.13.0/dist/index.css`'
      - name: test_mdmark_urls_when_meta_missing
        case: 正常
        summary: meta が無いと develop
        condition: '`<meta>` を持たない文書'
        mock: なし
        expected: '`js` が `https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@develop/dist/index.js`'
  - name: useMdmark
    title: mdmark の描画
    kind: フック
    container: features/docs/doc-view/hooks/use-mdmark.ts
    usecase: 文書を参照する
    role: アダプター
    summary: 要素に mdmark で本文を描き、本文か比較元の変更で `update`、解除されるときに `destroy` する
    scope: public
    args:
      - name: ref
        type: RefObject<HTMLElement | null>
        required: true
        passing: positional
        description: 描く要素
      - name: options
        type: MdmarkOptions
        required: true
        passing: positional
        description: '`markdown`・`docId`・`aliases`（文書の取得の `aliases`）・`commentStore`（`load({docId})`・`save({docId, comment})`・`update({docId, id, body})`・`remove({docId, id})` を Promise で返却する）・`config`（`features.comments` を `true`。mdmark の既定はオフ。`map` は `MDMARK_MAP` を入れる）・`baseMarkdown`（比較元の本文。`null` は強調なし）・`onColumnsChange`（`{tableIndex, hidden}` を受ける）'
    returns:
      type: '{handle: MdmarkHandle | null; ready: boolean; error: unknown; docId: string | null}'
      description: '`mount` の戻り値（`update(markdown, {baseMarkdown})`・`destroy()`・`reloadComments()`・`focusComment(id)`）と読み込みの状態。`docId` は `handle` が描いている文書で、`ready` は今の `docId` を描き終えたときだけ `true`'
    process: |-
      1. 初回に mdmark の読み込み先（`mdmarkUrls`）を求め、`import(/* @vite-ignore */ js)` で mdmark を読み込み、`document.head` に `css` の `<link rel="stylesheet">` を配置する（モジュールの中で 1 回だけ。失敗は `error` に入れ `[error]` `mdmark_load_failed` を記載する）
      2. `docId` が変わったら `destroy` して `mount(el, options)` し直す。`opts.index` には `aliases` を mdmark の索引にしたもの（`toMdmarkIndex`）を指定する。`commentStore` と `onColumnsChange` には、呼ばれたときに最新の `options` の関数を呼ぶ関数を指定する（`mount` は文書ごとに 1 回のため）。再描画する間は `ready` を `false` にし、`mount` が終わると `true` にする
      3. 同じ `docId` で `markdown` か `baseMarkdown` が変わったら `update(markdown, {baseMarkdown})` を呼ぶ（`baseMarkdown` が無いときは `null`）
      4. 解除されるときに `destroy` を呼ぶ
    unit_tests:
      - name: test_use_mdmark
        case: 正常
        summary: 描いて更新して破棄する
        condition: 同じ `docId` で `markdown` を変えてから除外する
        mock: mdmark（`vi.mock` で `mount`・`update`・`destroy` を記録する偽物）
        expected: '`mount` 1 回・`update` 1 回・`destroy` 1 回'
      - name: test_use_mdmark_when_doc_changes
        case: 正常
        summary: 文書が変わると再描画する
        condition: '`docId` を変える'
        mock: mdmark（偽物）
        expected: '`destroy` の後に `mount` がもう 1 回'
      - name: test_use_mdmark_when_load_failed
        case: 異常
        summary: 読み込みの失敗
        condition: '`import` が失敗する'
        mock: mdmark（読み込みで例外を送信する偽物）
        expected: '`error` が入り、ロガーの `error` が `mdmark_load_failed`'
      - name: test_use_mdmark_when_doc_changes_ready
        case: 正常
        summary: 文書が変わると再描画するまで ready を false にする
        condition: '`docId` を変えた直後と、`mount` が終わった後'
        mock: mdmark（偽物）
        expected: 変えた直後は `ready` が `false`、`mount` の後に `true`
      - name: test_use_mdmark_when_aliases
        case: 正常
        summary: エイリアスを索引にして指定する
        condition: '`aliases` に `term` の 1 件を指定して描く'
        mock: mdmark（`vi.mock` で `mount` の引数を記録する偽物）
        expected: '`mount` の `opts.index.terms` が 1 件'
      - name: test_use_mdmark_when_base_changes
        case: 正常
        summary: 比較元が変わると update に指定する
        condition: 同じ `docId` で `baseMarkdown` を `null` から文字列にし、続けて `null` に戻す
        mock: mdmark（偽物）
        expected: '`update` が `(markdown, {baseMarkdown: 文字列})`、`(markdown, {baseMarkdown: null})` の順に 2 回'
      - name: test_use_mdmark_when_callbacks_change
        case: 正常
        summary: 描いた後に変わった関数を呼ぶ
        condition: '`mount` の後に `onColumnsChange` と `commentStore.update` を別の関数に替え、mdmark から呼ぶ'
        mock: mdmark（`mount` の引数を記録する偽物）
        expected: 替えた後の関数が呼ばれ、`mount` は 1 回のまま
      - name: test_use_mdmark_when_map_config
        case: 正常
        summary: map の種類の設定を指定する
        condition: 描く
        mock: mdmark（`mount` の引数を記録する偽物）
        expected: '`mount` の `config.map.kinds` に `question` が、`config.map.lines` に `read` がある'
  - name: toMdmarkIndex
    title: mdmark の索引への読み替え
    kind: 関数
    container: features/docs/doc-view/hooks/use-mdmark.ts
    usecase: 文書を参照する
    role: 変換
    summary: 文書の取得の `aliases` を mdmark の `opts.index`（`docs`・`terms`）にする
    scope: public
    args:
      - name: aliases
        title: エイリアス
        type: AliasItem[]
        required: true
        passing: positional
        description: 文書の取得の `aliases`
    returns:
      type: '{docs: MdmarkIndexDoc[]; terms: MdmarkIndexTerm[]}'
      description: mdmark の索引（mdmark の `docs/リファレンス/索引.md` の形式）
    process: |-
      1. `aliasType` が `term` のものを `terms` の `{id, term: name, aliases, meaning: description, avoid}` にする（`avoid` が無ければ省く。`description` が無いものは mdmark が除くので記載しない）
      2. `aliasType` が `doc` のものを `docs` の `{id, path: id, title: name, description, aliases}` にする
      3. それ以外の引用の種類は記載しない
    unit_tests:
      - name: test_to_mdmark_index
        case: 正常
        summary: 用語と文書の別名を分ける
        condition: '`term` の「作業範囲」（`aliases: [scope, 担当範囲]`・`avoid: [担当領域]`）、`doc` の「設定のリファレンス」（`aliases: [settings]`）、`command` の 1 件'
        mock: なし
        expected: '`terms` が作業範囲の 1 件（`meaning` が `description`、`avoid` が `[担当領域]`）、`docs` が設定のリファレンスの 1 件、`command` はどちらにも無い'
refs:
  - LIB-155-9#
notes:
  補足: mdmark は jsDelivr の CDN から読み込む。
