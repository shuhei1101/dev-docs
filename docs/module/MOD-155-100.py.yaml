id: MOD-155-100
title: 開発ドキュメントサーバー / 変換 / types.py
lead: 変換の結果・失敗・表し方・図の種類・図の見出し・描画の文脈の型を受け持ち、変換の types.py を修正するときに参照する。
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        変換 ..> 変換の結果 : 返す
        変換の結果 o-- 変換の失敗
        class 変換 {
          +描画する(配信元, 文書の詳細, 文書) str
          +仕上げる(Markdown, 種類, 埋め込む値) 変換の結果
        }
        class 変換の結果 {
          +Markdown: str
        }
        class 変換の失敗 {
          +理由: str
        }
        click 変換 href "./MOD-155-99.py.yaml#変換"
data_models:
  - name: ConvertFailure
    title: 変換の失敗
    container: features/convert/types.py
    usecase: 文書の取得
    role: DTO
    summary: 変換できなかった理由
    description: '`dataclass(frozen=True)`。文書の取得は同じフィールドの `conversion_error` で返却する。'
    properties:
      - name: reason
        title: 理由
        type: Literal['timeout', 'exit', 'not_runnable', 'invalid_yaml']
        access: 公開
        description: 制限時間を超えた・0 以外で終わった・実行できない・YAML を読み込めない
      - name: kind
        title: 種類
        type: str
        access: 公開
        description: 文書の行の ID
      - name: script
        title: スクリプト
        type: str | None
        access: 公開
        default: None
        description: '`converters[].run` を空白で繋いだもの。YAML を読み込めないときは `None`'
      - name: detail
        title: 詳細
        type: str
        access: 公開
        description: 制限時間の秒数・終了コードと標準エラーの末尾・参照できなかった理由
      - name: file
        title: ファイル
        type: str | None
        access: 公開
        default: None
        description: YAML を読み込めないときのファイルのパス（配信元の直下から）
      - name: line
        title: 行
        type: int | None
        access: 公開
        default: None
        description: YAML を読み込めないときの行（1 始まり）
      - name: column
        title: 列
        type: int | None
        access: 公開
        default: None
        description: YAML を読み込めないときの列（1 始まり）
  - name: Converted
    title: 変換の結果
    container: features/convert/types.py
    usecase: 文書の取得
    role: DTO
    summary: 文書の取得で返却する Markdown か、変換の失敗
    description: '`dataclass(frozen=True)`。`failure` があるときの `markdown` は空。'
    properties:
      - name: markdown
        title: Markdown
        type: str
        access: 公開
        description: 返却する Markdown（埋め込みを展開し、表のキーのマーカーを取り除いた後）
      - name: table_keys
        title: 表のキー
        type: list[str]
        access: 公開
        default: '[]'
        description: 本文の表の出る順の表のキー。画面の列の表示が、隠す列の設定を表に適用するときに使用する
      - name: failure
        title: 変換の失敗
        type: ConvertFailure | None
        access: 公開
        default: None
        description: 失敗したときだけ
  - name: DiagramHead
    title: 図の見出し
    container: features/convert/types.py
    usecase: 文書の取得
    role: DTO
    summary: map の範囲の `title` にする題名と、図の元データの表が使用する範囲・更新日
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: title
        title: 題名
        type: str
        access: 公開
        description: 図の項目の `title`（無ければキーの名前）
      - name: scope
        title: 範囲
        type: str
        access: 公開
        description: 文書の名前
      - name: updated
        title: 更新日
        type: str
        access: 公開
        description: '文書の `updated` の `YYYY-MM-DD`。無ければ `-`'
  - name: DocumentLink
    title: 文書へのリンク
    container: features/convert/types.py
    usecase: 文書の取得
    role: DTO
    summary: 本文の参照から張る、同じ配信元の文書へのリンク
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: title
        title: タイトル
        type: str
        access: 公開
        description: リンクの文字にする文書の名前
      - name: path
        title: パス
        type: str
        access: 公開
        description: 文書のパス（配信元の直下から）
  - name: RenderContext
    title: 描画の文脈
    container: features/convert/types.py
    usecase: 文書の取得
    role: DTO
    summary: スキーマ駆動の変換が、文書の外から受け取るリンクの参照先と更新日
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: links
        title: リンクの引き先
        type: Mapping[str, DocumentLink]
        access: 公開
        description: 文書の ID と、文書のファイル・本文のファイルのパス（配信元の直下から）から、その文書へのリンク
      - name: issue_url
        title: Issue の URL
        type: str | None
        access: 公開
        description: '`https://github.com/{github.repository}/issues/`。配信元に `github.repository` が無ければ `None`'
      - name: path
        title: 文書のパス
        type: str
        access: 公開
        description: 変換する文書のパス。リンクの相対パスの起点
      - name: anchors
        title: 同じ文書のテーブルのアンカー
        type: Mapping[str, str]
        access: 公開
        description: '`x-key` を持つ `sections` の要素の `title` から、その要素の見出しに mdmark が付ける ID（`#` を除く。前に同じ ID の見出しがあれば `-{n}` 付き）。外部キーのリンクのアンカーに使用する。既定は空'
      - name: table_titles
        title: 同じ文書のテーブルの論理名
        type: Mapping[str, str]
        access: 公開
        description: 同じ文書の `tables[]` のテーブルの物理名か論理名から、そのテーブルの論理名（テーブルの論理名の取得方法の結果）。外部キーのリンクで `anchors` を取得する前にテーブル名を論理名にする。既定は空
      - name: item_anchor
        title: 項目のアンカーの引き方
        type: Callable[[str, str], str | None]
        access: 公開
        default: 常に `None` を返却する関数
        description: 文書の ID と項目のパスから、リンク先の文書でその項目が出す見出しのアンカー（`#` を除く。無ければ `None`）を取得する。参照のリンクと本文の id のリンクのアンカーに使用する
      - name: decisions
        title: リンクにする検討事項
        type: frozenset[str]
        access: 公開
        default: 空
        description: project-index の検討事項の一覧の `linkable`（ちょうど 1 つのフォルダに文書がある ID）。`decisions` の値のうち、この ID だけを検討事項の文書へのリンクにする
  - name: ItemHeading
    title: 項目の見出し
    container: features/convert/types.py
    usecase: 文書の取得
    role: DTO
    summary: 文書の項目のパスが指す、スキーマ駆動の変換が出す見出しと、その見出しを配置する組み立てのパス
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: text
        title: 見出しの文字列
        type: str
        access: 公開
        description: 変換が配置する見出しの文字列
      - name: path
        title: 組み立てのパス
        type: str
        access: 公開
        description: スキーマ駆動の変換が見出しを配置するときの値のパス。名前は `.` で繋ぎ（最上位は名前だけ）、配列の要素は `[{位置}]`（0 始まり）、辞書の `sections` の子は `.{キー}` にする（`functions[2]`・`notes.main.py の補足`）
enums:
  - name: Shape
    title: セクションの形式
    container: features/convert/types.py
    usecase: 文書の取得
    summary: スキーマの `x-shape` に記載する、項目を Markdown にする形（ai-monitor の生成と同じ）
    description: '`Literal` の型エイリアス。`x-shape` が無い文字列は `body`、オブジェクトは子を順に組み立てる。'
    values:
      - value: body
        title: 本文
        description: 文字列をそのまま段落にする
      - value: table
        title: 表
        description: オブジェクトのリストを表にする。列は要素のスキーマの `properties` の順で、列名は `title`
      - value: sections
        title: セクション
        description: 要素・子を 1 つ深い見出しのセクションにする。要素の見出しは `x-key` の値
      - value: list
        title: 並び
        description: 文字列のリストを箇条書きにする
      - value: diagram
        title: 図
        description: 値から図を組み立て、続けて同じ値の閉じた表を配置する。mdmark の map の範囲
      - value: attributes
        title: 属性
        description: 子のスカラーを「項目 / 値」の表にする
  - name: DiagramKind
    title: 図の種類
    container: features/convert/types.py
    usecase: 文書の取得
    summary: スキーマの `x-diagram`
    description: '`Literal` の型エイリアス。'
    values:
      - value: flowchart
        title: フローチャート
        description: '`nodes`・`edges` から Mermaid の `flowchart TD`'
      - value: dataflow
        title: データフロー
        description: '`flowchart` と同じ値から、Mermaid の `flowchart LR`'
      - value: architecture
        title: アーキテクチャ
        description: '`dataflow` と同じ'
      - value: state
        title: 状態遷移
        description: '`states`・`transitions` から Mermaid の `stateDiagram-v2`'
      - value: er
        title: ER 図
        description: '`entities`・`relations` から Mermaid の `erDiagram`'
tags:
  - name: action:変換
    main: true
  - name: topic:markdown
  - name: topic:図
  - name: topic:型ヒント
  - name: topic:型
