id: MOD-155-41
title: 画面 / 設定画面 / source-edit-dialog.tsx
lead: 配信元のダイアログ（追加・編集）。
test_files:
  - tests/unit/frontend/src/features/settings/settings/components/source-edit-dialog.test.tsx
components:
  - name: SourceEditDialog
    title: 配信元のダイアログ
    kind: コンポーネント
    container: features/settings/settings/components/source-edit-dialog.tsx
    usecase: 配信元を設定する
    role: 部品
    summary: shadcn/ui の `Dialog` と `Form` で、`useSourceForm` の入力欄・保存の失敗のまとめ・フッターを出す
    props:
      - name: open
        type: boolean
        required: true
        description: 開いているか
      - name: onOpenChange
        type: '(open: boolean) => void'
        required: true
        description: 開閉（閉じたら開いたボタンへフォーカスを戻す）
      - name: sources
        type: SettingsSource[]
        required: true
        description: 端末の設定の取得の `sources[]`
      - name: index
        type: number | null
        required: true
        description: 編集する行の位置（追加は null）
      - name: version
        type: string | undefined
        required: false
        description: 端末の設定の取得の `version`。`useSourceForm` へ渡す
    description: 追加のときだけ配信元の ID の入力欄を出し、初期フォーカスを置く。範囲の外からの参照のスイッチを読み取りの範囲の下に置く。`useSourceForm` の `gone` なら『配信元が削除されたときの表示』、`conflict` なら『他の変更の表示』をタイトルの下に出す。見出しの配信元の名前は開いたときの値を持つ。保存の応答を待つ間と `gone` の間は追加・保存ボタンを無効にする
    unit_tests:
      - name: test_source_edit_dialog
        case: 正常
        summary: 追加
        condition: '`index` が null で入力して `追加`'
        mock: MSW の端末の設定の保存のハンドラ（200）
        expected: 送った本文の末尾に入力の行、ダイアログが閉じる
      - name: test_source_edit_dialog_when_edit
        case: 正常
        summary: 編集では ID を入力できない
        condition: '`index` が 0'
        mock: なし
        expected: ID の入力欄が無く、タイトルの下に `配信元 {id}`
      - name: test_source_edit_dialog_when_invalid
        case: 異常
        summary: 入力チェック
        condition: 空のまま `追加`
        mock: MSW のハンドラ
        expected: ID・設定ファイル・読み取りの範囲の下にエラー、保存は呼ばれない
      - name: test_source_edit_dialog_when_outside_read
        case: 正常
        summary: 範囲の外からの参照を止めて保存する
        condition: '`outsideRead` を持たない行を編集し、スイッチをオフにして保存する'
        mock: MSW（PUT の本文を記録する）
        expected: 'スイッチの初期値がオンで、送った行に `outside_read: false` がある'
      - name: test_source_edit_dialog_when_conflict
        case: 異常
        summary: 他の書き換えが入っている
        condition: PUT が 409 を返す
        mock: MSW
        expected: 「他の変更があったため保存できませんでした」が出て、ダイアログが開いたままで入力が残る
