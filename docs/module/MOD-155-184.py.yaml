id: MOD-155-184
title: 開発ドキュメントサーバー / 共通 / errors.py
lead: '`DevDocsError` と、MCP・画面が返すエラーの階層。'
test_files:
  - tests/unit/dev_docs/shared/test_errors.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        開発ドキュメントサーバーのエラー <|-- 配信していない配信元
        開発ドキュメントサーバーのエラー <|-- 引数の誤り
        開発ドキュメントサーバーのエラー <|-- project-indexにつながらない
        開発ドキュメントサーバーのエラー <|-- project-indexが受け付けない
        class 開発ドキュメントサーバーのエラー {
          +エラーの名前: str
          +本文: str
          +次の手: list
        }
        class project-indexにつながらない {
          +接続先: str
          +理由: str
        }
data_models:
  - name: Violation
    title: 違反
    container: shared/errors.py
    usecase: 共通
    role: DTO
    summary: 違反 1 件の項目のパス・決まり・直し方
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。検査・設定の検証・書き込みの失敗が返す違反の 1 件。'
    properties:
      - name: path
        title: 項目のパス
        type: str
        access: 公開
        description: 違反した項目のパス（`documents[0].paths`・`operations[1].set.name` の形）
        example: documents[0].paths
      - name: rule
        title: 決まり
        type: str
        access: 公開
        description: 違反した決まり（必須のキーが無い・型が違う・検査の名前など）
        example: 必須のキーが無い
      - name: fix
        title: 直し方
        type: str
        access: 公開
        default: '""'
        description: 直し方の案内。分からないときは空
      - name: index
        title: 操作の添字
        type: int | None
        access: 公開
        default: None
        description: '`write_docs` の `operations` の添字。操作に結び付かない違反は `None`'
      - name: doc
        title: 文書のパス
        type: str | None
        access: 公開
        default: None
        description: 違反した文書のパス（配信元の直下から）。エイリアスのキーの違反だけが持ち、設定のキーの違反は `None`
classes:
  - name: DevDocsError
    title: 開発ドキュメントサーバーのエラー
    container: shared/errors.py
    usecase: 共通
    role: 例外
    summary: MCP の `isError` と画面の problem+json に変換するエラーの基底
    kind: クラス
    inherits: Exception
    description: |-
      管理の MCP はこの例外を `isError: true` の本文に、画面の API は RFC 9457 の problem+json に変換する（管理の MCP の『ツールのエラーの変換』・起動の『例外の変換の登録』）。
      下の表の子クラスはどれもこの基底を継承し、プロパティを足さない限り `name` と `message` だけを持つ。

      | 子クラス | 論理名 | 追加のプロパティ | HTTP |
      | --- | --- | --- | --- |
      | `UnknownSourceError` | 無い配信元 | `source_id` | 404 |
      | `SourceNotServedError` | 配信していない配信元 | `violations: list[Violation]`・`disabled: bool` | 404 |
      | `InvalidArgumentError` | 引数の誤り | `violations: list[Violation]` | 400 |
      | `RefNotFoundError` | 無いリビジョン | `argument: str`・`value: str` | 404 |
      | `DocumentNotFoundError` | 無い文書 | `missing: list[str]`・`candidates: dict[str, list[str]]` | 404 |
      | `CrossOriginError` | 別のオリジンからの要求 | - | 403 |
      | `RestartInProgressError` | 再起動か更新の途中 | - | 409 |
      | `UpdateFailedError` | 更新のコマンドの失敗 | `command: list[str]`・`stderr: str` | 500 |
      | `ScreenBuildMissingError` | 画面のビルドが無い | - | 503 |
      | `ProjectIndexUnreachableError` | project-index につながらない | `address: str`・`reason: str` | 503 |
      | `ProjectIndexRejectedError` | project-index が受け付けない | `violations: list[Violation]` | 422 |
      | `ProjectIndexResponseError` | project-index の想定しない応答 | `status_code: int`・`summary: str` | 502 |

      `ProjectIndexUnreachableError` の `message` は `project-index（{address}）に接続できませんでした。{reason}`、`next_steps` は `project-index を起動してから、再読み込みしてください。`。
      読み書きの権限・書き込み・検査・配信元の設定の読み込みのエラーは、それを送る処理ごと project-index へ移した。
    properties:
      - name: name
        title: エラーの名前
        type: str
        access: 公開
        description: クラスの名前（`SourceNotReadableError` など）。MCP の本文の先頭と problem+json の `type` の末尾に出す
      - name: message
        title: 本文
        type: str
        access: 公開
        description: 原因を 1〜2 文で書いた本文
      - name: next_steps
        title: 次の手
        type: list[str]
        access: 公開
        default: '[]'
        description: 呼び出し側が次にできること（project-index を起動する・`dev-docs migrate` を実行する など）
      - name: status
        title: HTTP のステータス
        type: int
        access: 公開
        description: 画面の API で返すステータス（説明の表の HTTP の列）。クラスの属性で持つ
    methods:
      - name: details
        title: 詳細
        kind: メソッド
        summary: 子クラスが持つ追加のプロパティを辞書で返す
        scope: public
        returns:
          type: dict[str, Any]
          description: 追加のプロパティ名 → 値。`Violation` は辞書にする
        process: |-
          1. `dataclasses.fields` で子クラスの追加のプロパティを並べ、名前 → 値の辞書にして返す
          2. 値が `Violation` のときは `dataclasses.asdict` で辞書にする
        unit_tests:
          - name: test_dev_docs_error_details
            case: 正常
            summary: 追加のプロパティを辞書にする
            condition: '`SourceNotServedError(violations=[Violation(path="documents[0].paths", rule="必須のキーが無い")], disabled=False)`'
            mock: なし
            expected: '`{"violations": [{"path": "documents[0].paths", "rule": "必須のキーが無い", "fix": "", "index": None, "doc": None}], "disabled": False}`'
          - name: test_dev_docs_error_details_when_no_extra
            case: 正常
            summary: 追加のプロパティが無い
            condition: '`CrossOriginError(message="…")`'
            mock: なし
            expected: '`{}`'
          - name: test_project_index_unreachable_error
            case: 正常
            summary: つながらないときの本文と詳細
            condition: '`ProjectIndexUnreachableError(address="http://127.0.0.1:8786", reason="接続を拒否されました（Connection refused）")`'
            mock: なし
            expected: '`message` が `project-index（http://127.0.0.1:8786）に接続できませんでした。接続を拒否されました（Connection refused）`、`details()` が `{"address": …, "reason": …}`、`status` が 503'
