id: MOD-155-140
title: 開発ドキュメントサーバー / 絞り込み / types.py
lead: '`nav` の `auto` の `filter` の条件の木と、見出しの型。'
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        条件の確かめ ..> 条件
        条件の照合 ..> 条件
        条件の束 o-- 条件
        class 条件の確かめ {
          <<function>>
        }
        class 条件の照合 {
          <<function>>
        }
        class 条件 {
          +項目: str
          +比べ方: str
        }
        class 条件の束 {
          +and: list
          +or: list
          +not: 条件
        }
        click 条件の確かめ href "./MOD-155-135.py.yaml#条件の確かめ"
        click 条件の照合 href "./MOD-155-135.py.yaml#条件の照合"
data_models:
  - name: Condition
    title: 条件
    container: features/search/types.py
    usecase: 検索
    role: DTO
    summary: 1 つの項目を比べる条件
    description: '`pydantic.BaseModel`（`extra="forbid"`）。MCP の入力スキーマもこのモデルから作る。'
    properties:
      - name: field
        title: 項目
        type: str
        access: 公開
        description: メタデータのキー・種類ごとの項目のパス・`body`・`*`・計算項目
      - name: op
        title: 比べ方
        type: Literal['eq', 'ne', 'prefix', 'suffix', 'contains', 'not_contains', 'regex', 'glob', 'gt', 'gte', 'lt', 'lte', 'exists', 'not_exists']
        access: 公開
        description: 比べ方。`regex` は値の各行に適用する（`^`・`$` は各行の先頭・末尾。値全体の先頭・末尾は `\A`・`\Z`）。`glob` は値全体に適用し、`**` は `/` をまたぎ、`*`・`?` は `/` をまたがない
        notes: 説明は `Field(description=...)` で入力のスキーマに出す
      - name: values
        title: 値
        type: list[str]
        access: 公開
        default: '[]'
        description: '比べる値。`exists`・`not_exists` 以外では 1 つ以上'
      - name: match
        title: 複数の値の扱い
        type: Literal['any', 'all']
        access: 公開
        default: '"any"'
        description: '`values` を OR か AND で比べる'
      - name: case_sensitive
        title: 区別するか
        type: bool
        access: 公開
        default: 'False'
        description: '`False` は NFKC と `casefold` をした後に比べる（`regex` はパターンに正規化をかけず、`re.IGNORECASE` と NFKC にした値で比べる）'
  - name: Group
    title: 条件のまとまり
    container: features/search/types.py
    usecase: 検索
    role: DTO
    summary: 条件を AND・OR でまとめるか、否定する
    description: '`pydantic.BaseModel`（`extra="forbid"`）。`and`・`or`・`not` のどれか 1 つだけを持つ（Python の属性は `all_of`・`any_of`・`not_`、別名が `and`・`or`・`not`）。#16 の画面の `nav` のタグの式も同じスキーマで書く。'
    properties:
      - name: all_of
        title: AND
        type: list[Condition | Group] | None
        access: 公開
        default: None
        description: 別名 `and`
      - name: any_of
        title: OR
        type: list[Condition | Group] | None
        access: 公開
        default: None
        description: 別名 `or`
      - name: not_
        title: NOT
        type: Condition | Group | None
        access: 公開
        default: None
        description: 別名 `not`。中の条件か束に該当しない文書に該当する
  - name: Heading
    title: 見出しの行
    container: features/search/types.py
    usecase: 検索
    role: DTO
    summary: Markdown の本文の見出し 1 つ
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: line
        title: 行番号
        type: int
        access: 公開
        description: 本文の行番号（1 始まり）
      - name: level
        title: 階層
        type: int
        access: 公開
        description: '`#` の数（1〜6）'
      - name: text
        title: 見出しの文字列
        type: str
        access: 公開
        description: '`#` と前後の空白、末尾の閉じの `#` を除いた文字列'
    status: planned
