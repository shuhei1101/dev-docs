id: MOD-155-224
title: 画面 / 共通 / pending-panel.tsx
lead: 文書の画面とメタデータの画面に共通の編集中のパネルとコミットの確認のダイアログを受け持ち、共通の pending-panel.tsx を修正するときに参照する。
components:
  - name: PendingPanel
    title: 編集中のパネル
    kind: コンポーネント
    container: shared/components/pending-panel/pending-panel.tsx
    usecase: 画面で編集中の変更をまとめて直コミットする
    role: 部品
    summary: 配信元の編集中の変更、差分確認・コミットの結果と失敗を並べる
    props:
      - name: source
        type: string
        required: true
        description: 配信元の ID
      - name: branch
        type: string | null
        required: true
        description: メタデータの取得の `branch`
      - name: open
        type: boolean
        required: true
        description: 開いているか
      - name: onOpenChange
        type: '(open: boolean) => void'
        required: true
        description: 開閉
      - name: onLocate
        type: '(edit: PendingEdit) => void'
        required: true
        description: 変更の行へ移動
    state:
      - name: outcome
        type: '{kind: "diff"; result: CommitResult} | {kind: "committed"; result: CommitResult} | {kind: "conflict"; result: CommitResult; edits: PendingEdit[]} | {kind: "failed"; problem: ProblemDetails} | {kind: "dropped"; edits: PendingEdit[]} | null'
        initial: 'null'
        description: 直前の差分確認・コミットの結果
        notes: '`useState`'
      - name: confirmOpen
        type: boolean
        initial: 'false'
        description: コミットの確認のダイアログ
        notes: '`useState`'
    description: shadcn/ui の `Sheet` を `modal={false}` で開き、狭い幅は `side="bottom"`、広い幅は右にする。差分確認・コミットは編集中の変更の直コミットを呼ぶ。失敗の Problem Details の `errors[].key` で変更ごとに理由を出し、コミットのボタンを `再試行` にする。`title` が `BaseCommitUnusableError` のときはボタンを `最新の内容で続ける` にし、押すと最新の内容で続けるを呼び、取り消した変更があれば `outcome` を取り消した変更の一覧に、無ければ `null` にする。コミットが `conflict` を持つ 200 を返却したときは、送信した変更を `edits` に記録して衝突の結果（`role="status"`）を出し、差分確認が `conflict` を返却したときは差分確認の衝突の注意と `reasons[].key` の変更の下の理由を出す。説明の文は変更が 1 件以上のときだけ出す。本文の変更の行は `label` と、`string`・`enum` の値は `{変更前} → {変更後}`、`markdown`・`table`・`@file` は `差分確認で表示します` を出し、行を押すと `onLocate` を呼ぶ。コミットの確認は shadcn/ui の `Dialog` で、コミットの説明（必須・200 文字）を入力する
    unit_tests:
      - name: test_pending_panel_when_dry_run
        case: 正常
        summary: 差分を変更ごとに出す
        condition: 変更 2 件で `差分確認` を押す
        mock: MSW の直コミットのハンドラ（`dryRun` の 200）
        expected: 変更ごとに差分が出て、変更が 2 件残る
      - name: test_pending_panel_when_rejected
        case: 異常
        summary: 変更ごとの理由と再試行
        condition: コミットで 422（`errors[0].key` が 2 件目）
        mock: MSW のハンドラ（422）
        expected: 2 件目の変更の下に理由、ボタンが `再試行`、`編集中の変更はそのままです。`
        exception: 検査に合格しない
      - name: test_pending_panel_when_message_empty
        case: 異常
        summary: コミットの説明が空
        condition: 確認のダイアログを開き、説明を空のままにする
        mock: MSW（要求を記録する）
        expected: 確定ボタンが押せず、要求が送信されない
        exception: 入力チェック
      - name: test_pending_panel_when_conflict
        case: 正常
        summary: 衝突してブランチに残した結果を出す
        condition: 変更 2 件でコミットし、`conflict`（`branch`・`reasons` 1 件・`script.prUrl`）を持つ 200
        mock: MSW の直コミットのハンドラ（`conflict` を持つ 200）
        expected: ブランチの名前・`PR を開く` のリンク・残した変更 2 件・衝突した理由が出て、編集中の変更が 0 件
      - name: test_pending_panel_when_conflict_script_failed
        case: 異常
        summary: 衝突したときのスクリプトの失敗
        condition: '`conflict.script` が `exitCode: 1`・`stderr: authentication required`・`prUrl: null`'
        mock: MSW のハンドラ（`conflict` を持つ 200）
        expected: '`衝突したときのスクリプトが失敗しました（終了コード 1）。` と標準エラー出力が出て、`PR を開く` が無い'
        exception: 衝突したときのスクリプトが失敗する
      - name: test_pending_panel_when_conflict_script_not_configured
        case: 正常
        summary: 衝突したときのスクリプトの指定が無い
        condition: '`conflict.script` が `null`'
        mock: MSW のハンドラ（`conflict` を持つ 200）
        expected: '`衝突したときのスクリプトが登録されていないため、PR は作成していません。` が出る'
      - name: test_pending_panel_when_dry_run_conflict
        case: 正常
        summary: 差分確認で衝突する
        condition: '差分確認で `conflict`（`branch: null`・`reasons[0].key` が 1 件目）を持つ 200'
        mock: MSW のハンドラ（`dryRun` の 200）
        expected: 差分確認の衝突の注意と 1 件目の変更の下に理由が出て、変更が 2 件残る
      - name: test_pending_panel_when_base_commit_unusable
        case: 異常
        summary: 編集を始めたときのコミットが使用できない
        condition: 'コミットで 409（`title: BaseCommitUnusableError`）を受け、`最新の内容で続ける` を押す'
        mock: 'MSW の直コミット（409）とメタデータの取得（`baseCommit: ccc3333`）のハンドラ'
        expected: 押す前はボタンが `最新の内容で続ける`、押した後は失敗のまとめが消え、変更が残り `baseCommitBySource` が `ccc3333`
        exception: 編集を始めたときのコミットが使用できない
      - name: test_pending_panel_when_restart_dropped
        case: 正常
        summary: 最新の内容と食い違う変更を取り消して一覧を出す
        condition: 409（`BaseCommitUnusableError`）の後に `最新の内容で続ける` を押し、再取得した行のタグが変更前の値と違う
        mock: MSW の直コミット（409）とメタデータの取得（タグを変えた行）のハンドラ
        expected: '`最新の内容と食い違うため、次の変更を取り消しました` とその変更の行の名前が出て、タグの変更が編集中の変更に無い'
      - name: test_pending_panel_when_body
        case: 正常
        summary: 本文の変更をメタデータの変更と並べる
        condition: タグの変更と `summary`・`@file` の本文の変更の 3 件で、`summary` の行を押す
        mock: なし
        expected: 3 行が並び、`summary` の行に `{変更前} → {変更後}`、`@file` の行に `差分確認で表示します` が出て、`onLocate` が `summary` の変更で呼ばれる
refs:
