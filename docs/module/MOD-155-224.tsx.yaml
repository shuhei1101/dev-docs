    type: requires
    when: 編集中のパネルとコミットの確認の要素を変えるときに突き合わせる。
  - to: CMP-155-4
    type: requires
    when: 編集中のパネルの引数・状態を変えるときに、部品設計『編集中のパネル』と突き合わせる。
