id: MOD-155-222
title: 画面 / 共通 / pending-panel/queries.ts
lead: 編集中の変更の直コミットの mutation と、最新の内容で続けるを受け持ち、共通の pending-panel の queries.ts を修正するときに参照する。
functions:
  - name: useCommitEdits
    title: 編集中の変更の直コミット
    kind: フック
    container: shared/components/pending-panel/queries.ts
    usecase: 画面で編集中の変更をまとめて直コミットする
    role: アダプター
    summary: orval が生成した `metadata-post_commits` の mutation に、コミットした後の編集中の変更の削除とメタデータの再取得を加える
    scope: public
    args:
      - name: source
        type: string
        required: true
        passing: positional
        description: 配信元の ID
    returns:
      type: 'UseMutationResult<CommitResult, AppError, {dryRun: boolean; message?: string}>'
      description: 編集中の変更をストアから取って送信する
    process: |-
      1. 直コミットの要求への変換で `edits` にし、`dryRun`・`message` とストアの `baseCommitBySource[source]` を `baseCommit` に添えて送信する
      2. `dryRun: false` で成功したら（`conflict` を持つときも）、配信元の編集中の変更を空にし、メタデータの取得と文書の取得の問い合わせを再読み込みする
      3. 失敗は呼び出し元へ返却する（パネルが Problem Details の `errors[]` を変更ごとに出す）
    unit_tests:
      - name: test_use_commit_edits
        case: 正常
        summary: コミットした後に編集中の変更を空にする
        condition: '変更 2 件で `dryRun: false`'
        mock: MSW の直コミットのハンドラ（200）
        expected: 編集中の変更が 0 件で、メタデータの取得がもう一度呼ばれる
      - name: test_use_commit_edits_when_dry_run
        case: 正常
        summary: 差分確認は変更を残す
        condition: '変更 2 件で `dryRun: true`'
        mock: 'MSW のハンドラ（200、`applied: false`）'
        expected: 編集中の変更が 2 件のまま
      - name: test_use_commit_edits_when_rejected
        case: 異常
        summary: 失敗でも変更を残す
        condition: MSW が 422 を返却する
        mock: MSW のハンドラ（422）
        expected: '`error` が `AppError` で、編集中の変更が残る'
        exception: 検査に合格しない
      - name: test_use_commit_edits_when_conflict
        case: 正常
        summary: 衝突してブランチに残したら編集中の変更を空にする
        condition: '`aaa1111` で追加した変更 2 件で `dryRun: false`'
        mock: MSW の直コミットのハンドラ（`conflict` を持つ 200、要求を記録する）
        expected: 要求の `baseCommit` が `aaa1111`、編集中の変更が 0 件で、戻り値の `conflict` がハンドラの値
  - name: useRestartFromLatest
    title: 最新の内容で続ける
    kind: フック
    container: shared/components/pending-panel/queries.ts
    usecase: 画面で編集中の変更をまとめて直コミットする
    role: アダプター
    summary: 既定のブランチの先頭でメタデータと本文の変更の文書を再取得し、編集を始めたときのコミットを置き換え、最新の値と食い違う変更を取り消す
    scope: public
    args:
      - name: source
        type: string
        required: true
        passing: positional
        description: 配信元の ID
    returns:
      type: 'UseMutationResult<{dropped: PendingEdit[]}, AppError, void>'
      description: 実行すると取り消した変更を返却する
    process: |-
      1. 配信元にメタデータの変更があれば `ref` を省いてメタデータの取得を、本文の変更があれば変更の `docPath` ごとに `ref` を省いて文書の取得を同時に呼ぶ
      2. メタデータの応答の `kinds[].rows[]` から種類・行の ID ごとの `values` を、文書の応答の `edit` から文書の ID ごとの項目のパスと値（`blocks[].value`・`titleBlock.value`・`@file` は `source`。`edit` が `null` なら空）を作り、メタデータの応答の `baseCommit`（無ければ文書の `edit.baseCommit`）で編集を始めたときのコミットの記録の更新を呼ぶ
      3. メタデータと文書の問い合わせの値を応答で置き換え、取り消した変更を返却する
    unit_tests:
      - name: test_use_restart_from_latest
        case: 正常
        summary: 変更を残して編集を始めたときのコミットを置き換える
        condition: '`aaa1111` で追加した変更 2 件で実行する'
        mock: 'MSW のメタデータの取得のハンドラ（`baseCommit: ccc3333`、要求を記録する）'
        expected: 要求に `ref` が無く、編集中の変更が 2 件のままで `baseCommitBySource` が `ccc3333`
      - name: test_use_restart_from_latest_when_body
        case: 正常
        summary: 本文の変更の文書を再取得する
        condition: '`aaa1111` で追加した `docs/n1.yaml` の `summary` の本文の変更だけで実行する'
        mock: 'MSW の文書の取得のハンドラ（`edit.baseCommit: ccc3333`・`summary` が変更前の値、要求を記録する）'
        expected: メタデータの取得を呼ばず、文書の取得の要求に `ref` が無く、変更が残り `baseCommitBySource` が `ccc3333`
notes:
  補足: 取得は orval が生成した問い合わせ（`getMetadataGetMetadataQueryOptions`）をそのまま使用する。
tags:
  - name: topic:メタデータ
  - name: topic:画面
  - name: tool:tanstack-query
  - name: topic:直コミット
test_files:
  - tests/unit/frontend/src/shared/components/pending-panel/queries.test.tsx
refs:
  - to: CMP-155-4
    type: requires
    when: 差分確認・コミット・最新の内容で続けるの振る舞いを変えるときに、編集中のパネルと突き合わせる。
