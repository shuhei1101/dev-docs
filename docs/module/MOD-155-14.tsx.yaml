id: MOD-155-14
title: 画面 / 文書の画面 / doc-sidebar.tsx
lead: 選んでいるタブの文書の一覧（サイドバーとドロワーの中身）を受け持ち、文書の画面の doc-sidebar.tsx を修正するときに参照する。
test_files:
  - tests/unit/frontend/src/features/docs/doc-view/components/doc-sidebar.test.tsx
components:
  - name: DocSidebar
    title: 文書の一覧
    kind: コンポーネント
    container: features/docs/doc-view/components/doc-sidebar.tsx
    usecase: 文書を参照する
    role: 部品
    summary: group を開閉のボタンの見出し、page をリンクにして入れ子で並べ、比較元からの変化のマーカーを付ける
    props:
      - name: tab
        type: NavTab
        required: true
        description: 選んでいるタブ
      - name: source
        type: string
        required: true
        description: 配信元の ID
      - name: currentPath
        type: string | null
        required: true
        description: 開いている文書（`aria-current="page"`）
      - name: search
        type: DocViewSearch
        required: true
        description: リンクに保つ `rev`・`base`・`tab`
      - name: onNavigate
        type: () => void
        required: false
        description: リンクを押したとき（ドロワーを閉じる）
    description: 'page のリンクは TanStack Router の `Link`（`to="/$source/$"`、`search` を保つ）。`change` が `deleted` の page は `search` を `{rev: base, tab}` にし、文書の名前に取り消し線を引く。マーカーは lucide-react の `Plus`・`Circle`（塗り）・`Minus` に `aria-label`（`追加`・`変更`・`削除`）を付ける。`excluded` が `true` の page は、文書の名前を `text-muted-foreground` にし、変化のマーカーの左に lucide-react の `SearchX` を `role="img"`・`aria-label`（`検索から除外`）と SVG の中の `<title>` 要素つきで付ける。group は内部の部品 `Group` で描き、見出しを `<button aria-expanded>`（lucide-react の `ChevronRight` を `aria-hidden`、開いているときは 90 度回す）にして、開いているときだけ配下を 1 階層ぶん字下げして描く。入れ子の階層の数は制限しない。開閉は `Group` の `useState` で持ち、配下に開いている文書（`currentPath`）か `change` が null でない page を持つ group は開いて始める。描画の中で前の値と比べ（`useEffect` を使用しない）、開いている文書が変わったらその文書を配下に持つ group だけを開き、変化を持つ page が配下に無かった group に変化が現れたらその group を開く。どちらにも当たらない group は、利用者が閉じたままにする'
    unit_tests:
      - name: test_doc_sidebar
        case: 正常
        summary: 入れ子と現在地
        condition: group の中に `a.md`（開いている）と `b.md`
        mock: なし（メモリの履歴のルーター）
        expected: group の見出しの下に 2 つのリンクがあり、`a.md` だけ `aria-current="page"`
      - name: test_doc_sidebar_when_deleted
        case: 正常
        summary: 削除した page
        condition: '`base` が `v1`、`change` が `deleted` の `c.md`'
        mock: なし（メモリの履歴のルーター）
        expected: リンク先が `/s/c.md?rev=v1` で `base` を持たず、`削除` のマーカーがある
      - name: test_doc_sidebar_when_excluded
        case: 正常
        summary: 検索から除外される文書
        condition: group の中に `a.md` と `excluded` が `true` の `b.md`
        mock: なし（メモリの履歴のルーター）
        expected: '`b.md` のリンクにだけ `検索から除外` のマーカーがあり、`b.md` のリンクもその文書を開く'
      - name: test_doc_sidebar_when_group_toggled
        case: 正常
        summary: group の開閉
        condition: 開いている `a.md` を含む group `A` と、含まない group `B`。`B` の見出しを押す
        mock: なし（メモリの履歴のルーター）
        expected: '`A` は `aria-expanded="true"` で始まり、`B` は `false` で配下のリンクが無い。押すと `B` が `true` になり配下のリンクが出る'
      - name: test_doc_sidebar_when_current_changed
        case: 正常
        summary: 閉じた group の中の文書を開く
        condition: '`B` を閉じたまま、`currentPath` を `B` の中の `c.md` に変えて描き直す'
        mock: なし（メモリの履歴のルーター）
        expected: '`B` が開き、`c.md` のリンクが `aria-current="page"`'
      - name: test_doc_sidebar_when_changed_in_group
        case: 正常
        summary: 変化を持つ group
        condition: 開いている文書を含まない group `B` の中に `change` が `modified` の page
        mock: なし（メモリの履歴のルーター）
        expected: '`B` が開いて始まり、`変更` のマーカーが出る'
      - name: test_doc_sidebar_when_nested
        case: 正常
        summary: 4 階層の入れ子
        condition: group を 4 階層入れ子にし、一番内側に開いている文書
        mock: なし（メモリの履歴のルーター）
        expected: 4 つの group が全て開き、一番内側の文書のリンクが `aria-current="page"`
      - name: test_doc_sidebar_when_moved_keeps_closed
        case: 正常
        summary: 差分の表示中に閉じた group
        condition: 変化を持つ group `B` を閉じ、`currentPath` を `B` の外の文書に変えて描き直す
        mock: なし（メモリの履歴のルーター）
        expected: '`B` は `aria-expanded="false"` のまま'
tags:
  - name: topic:文書
    main: true
  - name: topic:画面
  - name: topic:サイドバー
  - name: topic:タブ
