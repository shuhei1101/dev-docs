id: MOD-155-20
title: 画面 / 文書の画面 / doc-view-screen.tsx
lead: 文書の画面の最上位を受け持ち、文書の画面の doc-view-screen.tsx を修正するときに参照する。
test_files:
  - tests/unit/frontend/src/features/docs/doc-view/doc-view-screen.test.tsx
components:
  - name: DocViewScreen
    title: 文書の画面
    kind: 画面
    container: features/docs/doc-view/doc-view-screen.tsx
    usecase: 文書を参照する
    role: 画面
    summary: ルートの引数で文書を参照し、トップバー・種類のタブ・サイドバー・本文・コメントのパネルを並べる
    description: 文書は `useSuspenseQuery(documentQueryOptions(...))`、配信元とリビジョンの一覧は orval が生成した問い合わせで参照する。URL の変更は `search` を書き換える（`rev`・`base` を保つ。文書の画面の移動）。トップバーへは配信中の配信元を指定する（配信中の配信元の取り出し）。文書は本文の領域に出し（目次は mdmark が本文に描き、画面は目次の列を配置しない）、画面の先頭に本文へのスキップを配置する。`document.title` は `pageTitle` で書き換える。サイドバーと本文を並べるコンテナは幅の上限を持たず、本文は画面の幅から左右の余白・サイドバー・間隔を除いた幅になる（画面設計の `本文` の `width`）。幅の切り替え（48rem）は Tailwind の `md:` で行い、JavaScript では幅を参照しない。画面の最上位は `flex h-dvh flex-col overflow-hidden` で表示領域の高さに収め、トップバーと種類のタブを `shrink-0`、サイドバーと本文を並べる行を `min-h-0 flex-1` にして、サイドバー（`overflow-y-auto`）と本文の領域（`id="doc-scroll"` の `overflow-y-auto`）だけを縦にスクロールさせる（`sticky` は使用しない）。検索のダイアログへは、配信中の配信元の ID（配信中の配信元の取り出し）と配信していない配信元（配信していない配信元の取り出し）を指定し、`onResultSelect` は文書の画面の移動の `openSearchResult` につなぐ。48rem 以上のサイドバーは、設定のストアの `sidebarOpen`・`sidebarWidth` で出し分け、開いているときはサイドバー（`id="doc-sidebar"`、`style` の `width` に `sidebarWidth`。上端の右にサイドバーを閉じるボタン）とサイドバーの境目を、閉じているときは本文の左上にサイドバーを開くボタンを並べる。閉じる・開く・幅の変更は `setSidebarOpen`・`setSidebarWidth` で書き換える。文書の `edit` があれば、文書のタイトルの右に編集のボタンの並びを出し、URL の `edit` が `fields` なら本文の代わりに表示した場所で修正（`edit.titleBlock` があればタイトルを文書のタイトルの修正）、`file` ならファイル全体の編集を出す（`edit` が `null` の文書では `edit` を無視する）。レビュー中のパネルは文書の画面の中で開閉し、`onLocate` は本文の変更なら変更の `docPath` の文書を、`values` のキーが `@file` なら `edit=file`、それ以外は `edit=fields` で開き、メタデータの変更ならメタデータの画面のその行を開く
    state:
      - name: searchOpen
        type: boolean
        initial: 'false'
        description: 検索のダイアログ
        notes: '`useState`'
      - name: helpOpen
        type: boolean
        initial: 'false'
        description: ショートカットの一覧
        notes: '`useState`'
      - name: drawerOpen
        type: boolean
        initial: 'false'
        description: 文書の一覧のドロワー
        notes: '`useState`'
      - name: commentPanelOpen
        type: boolean
        initial: 'URL の `panel` が `comments`'
        description: コメントのパネル
        notes: 'URL の `panel` から求め、開閉は `panel` を `replace` で書き換える（`edits` とは並べない）'
      - name: emptyTab
        type: NavTab | null
        initial: 'null'
        description: 文書の無いタブを選んだときのタブ（URL を変えない）
        notes: '`useState`。文書が変わったら null'
      - name: locating
        type: DocComment | null
        initial: 'null'
        description: コメントのパネルで場所を選ばれたコメント。`DocBody` の `locating` へ指定する
        notes: '`useLocating`。場所を選ばれたら入れ、開いている文書（`docId` が同じ）なら移動せず、他の文書なら文書の画面の移動の `locate` で開く。`onLocated` か、開いている文書が `locating` と違う文書に変わったときに null'
      - name: markdownField
        type: EditBlock | null
        initial: 'null'
        description: Markdown の項目のパネルで開いている項目
        notes: '`useState`。文書か `edit` の方式が変わったら null'
      - name: pendingPanelOpen
        type: boolean
        initial: 'URL の `panel` が `edits`'
        description: レビュー中のパネル
        notes: 'URL の `panel` から求め、開閉は `panel` を `replace` で書き換える（`comments` とは並べない）'
    unit_tests:
      - name: test_doc_view_screen
        case: 正常
        summary: 文書を描く
        condition: MSW が文書の取得・端末の設定の取得・リビジョンの一覧を返却する。メモリの履歴のルーターで `/s/a.md` を開く
        mock: MSW のハンドラ・mdmark（`vi.mock`、`mount` を記録する偽物）
        expected: 文書のタイトル・パンくず・サイドバーの現在地が出て、`document.title` が `A | s | dev-docs`、mdmark の `mount` に最初の見出し 1 を除いた本文が渡る
      - name: test_doc_view_screen_when_empty_tab
        case: 正常
        summary: 文書の無いタブ
        condition: '`items` が空のタブを押す'
        mock: MSW のハンドラ・mdmark（偽物）
        expected: URL が変わらず、文書が無いことの表示が出る
      - name: test_doc_view_screen_when_conversion_error
        case: 正常
        summary: 変換の失敗
        condition: MSW が `conversionError` を持つ文書を返却する
        mock: MSW のハンドラ・mdmark（偽物）
        expected: 変換の失敗が出て `mount` が呼ばれない
      - name: test_doc_view_screen_when_sidebar_closed
        case: 正常
        summary: サイドバーを閉じる・開く
        condition: サイドバーを閉じるボタンを押し、続けてサイドバーを開くボタンを押す
        mock: MSW のハンドラ・mdmark（偽物）
        expected: 閉じると文書の一覧と境目が無くなり、設定のストアの `sidebarOpen` が `false`。開くと元の幅（`style` の `width`）で文書の一覧が出る
      - name: test_doc_view_screen_when_edit_fields
        case: 正常
        summary: 表示した場所で修正の表示
        condition: '`edit` を持つ YAML の文書を `?edit=fields` で開く'
        mock: MSW のハンドラ・mdmark（偽物）
        expected: 本文の代わりに項目のブロックが並び、編集の方式の切り替えの `表示した場所で修正` が押した状態
      - name: test_doc_view_screen_when_not_editable
        case: 正常
        summary: 編集できない文書
        condition: '`edit: null` の文書を `?edit=file` で開く'
        mock: MSW のハンドラ・mdmark（偽物）
        expected: 編集のボタンが無く、本文が出る
      - name: test_doc_view_screen_when_pending_panel
        case: 正常
        summary: 文書の画面でレビュー中のパネルを開く
        condition: トップバーのレビュー中のボタンを押し、パネルの `@file` の本文の変更の行を押す
        mock: MSW のハンドラ・mdmark（偽物）
        expected: URL が変わらずにパネルが開き、行を押すとその文書を `edit=file` で開く
      - name: test_doc_view_screen_when_layout
        case: 正常
        summary: 画面の高さとスクロールの領域
        condition: メモリの履歴のルーターで `/s/a.md` を開く
        mock: MSW のハンドラ・mdmark（偽物）
        expected: 最上位の要素が `h-dvh` と `overflow-hidden` を持ち、本文は `id="doc-scroll"` の要素の中にあり、サイドバーが `sticky` を持たない
      - name: test_doc_view_screen_when_comment_panel_in_url
        case: 正常
        summary: コメントのパネルを URL に保つ
        condition: トップバーのコメントのボタンを押し、続けてレビュー中のボタンを押す
        mock: MSW のハンドラ・mdmark（偽物）
        expected: 1 回目で URL の `panel` が `comments` になりコメントのパネルが開き、2 回目で `edits` になりコメントのパネルが閉じる。履歴の件数は増えない
      - name: test_doc_view_screen_when_leave_guard
        case: 正常
        summary: 編集中の変更があるときに離脱を警告する
        condition: 開いている配信元に編集中の変更を 1 件入れ、`beforeunload` を発火させる
        mock: MSW のハンドラ・mdmark（偽物）
        expected: イベントの `defaultPrevented` が `true`。変更が 0 件のときは `false`
      - name: test_doc_view_screen_when_scroll_restored
        case: 正常
        summary: 戻るで本文のスクロール位置を戻す
        condition: '`/s/a.md` で本文の領域を 400 までスクロールし、`/s/b.md` へ移ってから履歴を戻る'
        mock: MSW のハンドラ・mdmark（偽物）
        expected: '`b.md` は一番上から表示され、戻った `a.md` の本文の領域の `scrollTop` が 400'
    notes:
      離脱の警告: '`useLeaveGuard` に、開いている配信元の編集中の変更が 1 件以上あるかを指定する'
      スクロール位置: 本文の領域（`id="doc-scroll"`）に `useScrollRestoration` をキー `dev-docs:v1:doc-view:body:{source}:{path}:scroll`・`ready` は本文を描いた後・`restore` は戻る・進むと再読み込みのときだけ `true`（TanStack Router の履歴の移動の種類で判定する）で使用する。サイドバーのスクロールの領域にはキー `dev-docs:v1:doc-view:sidebar:{source}:{tab}:scroll` で使用し、同じタブの中で文書を移るときはキーが変わらないので位置を変えない
refs:
  - to: SCR-155-1
    type: requires
    when: 文書の画面の構成を変えるときに、文書の画面の要素と振る舞いと突き合わせる。
  - to: CMP-155-4
    type: requires
    when: 文書の画面に配置するレビュー中のパネルの引数を変えるときに突き合わせる。
notes:
  補足: 要素とその振る舞いは画面設計『文書の画面』が持つ。
tags:
  - name: topic:文書
    main: true
  - name: topic:画面
