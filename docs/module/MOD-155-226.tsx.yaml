id: MOD-155-226
title: 画面 / アプリとルート / $source/[_]metadata.tsx
lead: '`/{配信元の ID}/_metadata` のルートを受け持ち、アプリとルートの $source/[_]metadata.tsx を修正するときに参照する。'
constants:
  - name: Route
    title: メタデータの画面のルート
    container: routes/$source/[_]metadata.tsx
    usecase: メタデータを画面で参照する
    summary: '`createFileRoute("/$source/_metadata")({component, validateSearch})`。検索条件は `tab`（種類）・`q`（絞り込みの文字。`z.string().optional().catch(undefined)`）・`panel`（`edits` でレビュー中のパネルを開く）'
    value: createFileRoute("/$source/_metadata")({...})
notes:
  補足: ファイル名の `[_]` は、頭の `_` をパスの無いレイアウトでなく文字として扱わせるエスケープ。静的なセグメントなので、文書の画面の `$source/$` より先に当たる。
tags:
  - name: topic:ルート
  - name: topic:メタデータ
  - name: tool:react
