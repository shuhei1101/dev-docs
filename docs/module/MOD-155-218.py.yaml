id: MOD-155-218
title: 開発ドキュメントサーバー / メタデータ / commits.py
lead: 画面の編集中の変更を文書の書き込みと削除に変えて project-index の書き込みの API へ送信し、結果と理由を変更ごとに戻す処理を受け持ち、メタデータの commits.py を修正するときに参照する。
data_models:
  - name: Edit
    title: 編集中の変更
    container: features/metadata/commits.py
    usecase: 画面で編集中の変更をまとめて直コミットする
    role: DTO
    summary: IF-155-29 の `edits[]` の 1 件（`ApiModel`）
    properties:
      - name: key
        type: str
        description: 変更の識別子
      - name: kind
        type: Literal['terms', 'aliases', 'tags', 'rules', 'files', 'body']
        description: メタデータの種類か、文書の本文の `body`
      - name: op
        type: Literal['update', 'add', 'delete']
        description: 変更の種類
      - name: doc_id
        type: str
        description: 文書の ID
      - name: doc_kind
        type: str
        description: '対象の文書の種類（全ての `op` で必須）'
      - name: expected_version
        type: str | None
        description: 取得したバージョン
      - name: values
        type: dict[str, str | list[str] | list[dict[str, str]]]
        default: '{}'
        description: 変更後の値（`body` はキーが項目のパスか `@file`）
      - name: doc_path
        type: str | None
        description: 文書のパス（`update` のときは必須）
  - name: CommitRequest
    title: 直コミットの要求
    container: features/metadata/commits.py
    usecase: 画面で編集中の変更をまとめて直コミットする
    role: DTO
    summary: IF-155-29 の本文（`ApiModel`。`model_validator` で `key` の重複・`op` と `kind`・必須・`message`・同じ `doc_id` の `@file` とほかの `body` の変更が並ぶことを検証する）
    properties:
      - name: edits
        type: list[Edit]
        description: 1 件以上
      - name: message
        type: str | None
        description: コミットの説明
      - name: dry_run
        type: bool
        default: 'False'
        description: 差分確認か
      - name: base_commit
        type: str
        description: 編集を始めたときのコミット（7〜40 桁の 16 進数）
  - name: CommitResult
    title: 直コミットの結果
    container: features/metadata/commits.py
    usecase: 画面で編集中の変更をまとめて直コミットする
    role: DTO
    summary: IF-155-29 の 200 の応答（`applied`・`results[]`・`commit`）
    properties:
      - name: applied
        type: bool
        description: コミットしたか
      - name: results
        type: list[EditResult]
        description: '`key`・`status`・`version`・`diff`'
      - name: commit
        type: CommitInfo | None
        description: '`sha`・`branch`'
      - name: conflict
        type: ConflictResult | None
        description: 衝突して修正をブランチに残したときの結果
  - name: ConflictReason
    title: 衝突した理由
    container: features/metadata/commits.py
    usecase: 画面で編集中の変更をまとめて直コミットする
    role: DTO
    summary: IF-155-29 の `conflict.reasons[]` の 1 件（`ApiModel`）
    properties:
      - name: key
        type: str | None
        description: 断られた変更の `key`。本文全体の理由は `None`
      - name: reason
        type: str
        description: 今のブランチで断られた理由
  - name: ConflictScript
    title: 衝突したときのスクリプトの結果
    container: features/metadata/commits.py
    usecase: 画面で編集中の変更をまとめて直コミットする
    role: DTO
    summary: IF-155-29 の `conflict.script`（`ApiModel`）
    properties:
      - name: exit_code
        type: int | None
        description: 終了コード（制限時間で止めたときは `None`）
      - name: timed_out
        type: bool
        description: 制限時間で止めたか
      - name: pr_url
        type: str | None
        description: 標準出力の空でない最後の行が `https://` で始まるときのその行
      - name: stderr
        type: str
        description: 標準エラー出力の末尾
  - name: ConflictResult
    title: 衝突の結果
    container: features/metadata/commits.py
    usecase: 画面で編集中の変更をまとめて直コミットする
    role: DTO
    summary: IF-155-29 の `conflict`（`ApiModel`）
    properties:
      - name: branch
        type: str | None
        description: 修正を残したブランチ（差分確認は `None`）
      - name: base_commit
        type: str
        description: ブランチの起点にしたコミット（40 桁）
      - name: reasons
        type: list[ConflictReason]
        description: 変更ごとの断られた理由
      - name: script
        type: ConflictScript | None
        description: スクリプトの結果（指定が無い・差分確認は `None`）
classes:
  - name: EditsRejectedError
    title: 変更ごとの理由つきの失敗
    container: features/metadata/commits.py
    usecase: 画面で編集中の変更をまとめて直コミットする
    role: 例外
    summary: 状態コード・`title`・`detail`・`nextSteps` と、`errors[]`（`key`・`path`・`reason`）を持ち、例外の変換の登録が problem+json にする
    inherits: AppError
functions:
  - name: to_operations
    title: 書き込みと削除への変換
    kind: 関数
    container: features/metadata/commits.py
    usecase: 画面で編集中の変更をまとめて直コミットする
    role: 変換
    summary: 編集中の変更を、配信元の設定の `metadata` の対応で文書の実際のキーへ戻した `writes`・`deletes` にする
    scope: public
    args:
      - name: edits
        type: list[Edit]
        required: true
        passing: positional
        description: 編集中の変更
      - name: mappings
        type: Mapping[str, Mapping[str, str]]
        required: true
        passing: positional
        description: 文書の種類ごとの `metadata`
      - name: expected_versions
        type: Mapping[str, Mapping[str, str] | str]
        required: true
        passing: positional
        description: '`update` の変更の `key` ごとの項目ごとのバージョンの辞書か文書の全体のバージョン'
    returns:
      type: tuple[list[dict], list[dict], list[tuple[Literal['write', 'delete'], int, str]]]
      description: '`writes`・`deletes` と、それぞれの添字と変更の `key` の対応'
    process: |-
      1. 変更ごとに、`doc_kind` の `metadata`（`mappings[doc_kind]`）で列のキーを列と文書のキーの対応の解決にかけ、戻せない列は `EditsRejectedError`（400）を送出する。列のキーと値はそのまま入れ、文書の実際のキーへは project-index の書き込みの API が戻す
      2. `body` の変更は、項目のパスのキーをそのまま `{op: update, id, expected_version, set}` の `set` に入れる。`@file` は、YAML の文書（`doc_path` が `.md` で終わらない）なら `yaml.safe_load` した値を `{op: replace, id, expected_version, data}`、Markdown の文書なら `{op: update, id, expected_version, set: {"@body": 値}}` にする。読み込めない `@file` は `EditsRejectedError`（400、`path` が `@file`、`reason` に行と列）を送出する
      3. `update` は `{op: update, id, expected_version, set}`（`expected_version` は `expected_versions[変更の key]` の辞書）、`add` は `{op: create, id, kind, data}`、`delete` は `deletes` の `{id, expectedVersion}` にし、変更の並び順で入れる
    unit_tests:
      - name: test_to_operations
        case: 正常
        summary: update・add・delete を変換する
        condition: タグの `update`・用語の `add`・用語の `delete`
        mock: なし
        expected: '`writes` が 2 件（`update` と `create`）、`deletes` が 1 件で、添字の対応が変更の `key`'
      - name: test_to_operations_when_mapped_tags
        case: 正常
        summary: 対応づけた配列の項目の列は名前の配列のまま入れる
        condition: '`tags: tags[].name` で今の値が `[{name: topic:a, main: true}, {name: topic:c}]`、送信した値が `[topic:a, topic:b]`'
        mock: なし
        expected: '`set.tags` が送信した名前の配列 `[topic:a, topic:b]` のまま'
      - name: test_to_operations_when_unmappable
        case: 異常
        summary: 戻せない列
        condition: '`skill: skill.path` の列を変える `update`'
        mock: なし
        expected: '`EditsRejectedError`（400）で、`errors[]` にその変更の `key`'
        exception: 戻せない列
      - name: test_to_operations_when_mapped_name
        case: 正常
        summary: 対応づけた最上位のキーの列も共通のキーのまま入れる
        condition: '`doc_kind` が `skill`（`metadata: {name: title}`）の `name` の `update`'
        mock: なし
        expected: '`set` が共通のキーの `{name: 値}` のまま'
      - name: test_to_operations_when_body
        case: 正常
        summary: 本文の変更を変換する
        condition: '`#items[i1].body` の `body` の変更、YAML の文書の `@file`、`guide.md` の `@file`'
        mock: なし
        expected: '`set` が `{"#items[i1].body": 値}` の `update`、読み込んだ値を `data` にした `replace`、`set` が `{"@body": 値}` の `update`'
      - name: test_to_operations_when_whole_file_unparsable
        case: 異常
        summary: 読み込めないファイル全体
        condition: 3 行目の行頭にタブを入れた YAML の `@file`
        mock: なし
        expected: '`EditsRejectedError`（400）で、`errors[0].path` が `@file`、`reason` に 3 行目'
        exception: 読み込めない `@file`
  - name: commit_edits
    title: 編集中の変更の直コミット
    kind: 関数
    container: features/metadata/commits.py
    usecase: 画面で編集中の変更をまとめて直コミットする
    role: サービス
    summary: 変更を検証・変換して書き込みの API へ 1 回送信し、結果・衝突の結果か変更ごとの理由を返却する
    scope: public
    is_async: true
    thread_safe: true
    args:
      - name: client
        title: project-indexの呼び出し
        type: ProjectIndexClient
        required: true
        passing: positional
        description: 問い合わせ・送信する
      - name: source_id
        type: str
        required: true
        passing: positional
        description: 配信元の ID
      - name: request
        type: CommitRequest
        required: true
        passing: positional
        description: 検証済みの本文
      - name: convert
        title: 変換
        type: ConvertService
        required: true
        passing: keyword
        description: 修正できる項目のパスの取得に指定する
    returns:
      type: CommitResult
      description: IF-155-29 の 200 の応答
    process: |-
      1. `body` の変更は、文書ごとに修正できる項目のパスの取得（`doc_path`・`doc_id`・`base_commit`・`convert`）にキーがあるかを確認し、無ければ `EditsRejectedError`（400）を送出する。メタデータの変更の列は、書き込みと削除への変換で元のキーへ戻せるかを確認する
      2. project-indexの呼び出し.配信元の設定の取得で `metadata` を取得する
      3. 編集を始めたときの項目ごとのバージョンで、`update` の変更ごとの `expected_version` の辞書を求める
      4. 書き込みと削除への変換をし、project-indexの呼び出し.直コミットの書き込みを呼ぶ（`message` は要求の説明、`dry_run` のときは固定の説明 `差分確認`。project-index の書き込みの API は `message` を必須にしている。`baseCommit` は要求の `base_commit`）
      5. 200 は `results[]` の `kind`（`write`・`delete`）・`index` を変更の `key` に戻し、`conflict` があれば衝突の結果への変換をして `CommitResult` を返却する
      6. 409 の `BaseCommitUnusableError` は `title` を `BaseCommitUnusableError`、`detail` を project-index の理由にした `EditsRejectedError`（409、`errors[]` なし）を送出する。403・404・409・422 は `errors[]`（`path` の先頭の `writes[{添字}]`・`deletes[{添字}]`）と `kinds`（変更の `doc_kind` と照合する）・`docId` を変更の `key` へ戻した `EditsRejectedError` を送出する。500・502 は 502、504 と待ちの上限の打ち切りは 504 にする
      7. 送信ごとに、配信元の ID・`dryRun`・変更の件数・状態コード・コミットの SHA（衝突したときは残したブランチ、打ち切ったときはその旨）を 1 行のログに出力する
    unit_tests:
      - name: test_commit_edits
        case: 正常
        summary: 変更ごとの結果に戻す
        condition: 3 件の変更と、200 を返却する偽物
        mock: project-indexの呼び出し（偽物）
        expected: '`results[].key` が変更の `key`、`commit.sha` が偽物の値、ログが 1 行'
      - name: test_commit_edits_when_validation_failed
        case: 異常
        summary: 422 の違反を変更へ戻す
        condition: 偽物が `writes[1]` の違反を持つ 422 を返却する
        mock: project-indexの呼び出し（偽物）
        expected: '`EditsRejectedError`（422）で、`errors[0].key` が 2 件目の変更'
        exception: 検査に合格しない
      - name: test_commit_edits_when_not_permitted
        case: 異常
        summary: 403 の種類を変更へ戻す
        condition: '偽物が `kinds: [note]` の 403 を返却する'
        mock: project-indexの呼び出し（偽物）
        expected: '`EditsRejectedError`（403）で、`note` の文書の変更の `key` と `nextSteps`'
        exception: 直コミットを許可していない
      - name: test_commit_edits_when_timed_out
        case: 異常
        summary: 待ちの上限
        condition: 偽物が `ProjectIndexTimeoutError` を送出する
        mock: project-indexの呼び出し（偽物）
        expected: '`EditsRejectedError`（504）で `detail` にコミットされたかが分からないこと'
        exception: 待ちの上限
      - name: test_commit_edits_when_dry_run
        case: 正常
        summary: 差分確認でも説明を送信する
        condition: '`message` の無い `dryRun: true` の要求'
        mock: project-indexの呼び出し（要求を記録する偽物）
        expected: 送信した本文の `message` が `差分確認`、`dryRun` が `true`
      - name: test_commit_edits_when_mapped_tags
        case: 正常
        summary: 対応づけた配列の項目の列でも文書の一覧を取得しない
        condition: '`tags: tags[].name` の種類の文書の `update`'
        mock: project-indexの呼び出し（要求を記録する偽物）
        expected: '文書の一覧を呼ばず、文書の取得は項目ごとのバージョンの取得（`ref` が `base_commit`）の 1 回だけで、`set.tags` が送信した名前の配列、`expected_version` が `{tags: そのバージョン}`'
      - name: test_commit_edits_when_base_commit_unusable
        case: 異常
        summary: 編集を始めたときのコミットが使用できない
        condition: '偽物が `BaseCommitUnusableError`（`reason: not_ancestor`）の 409 を返却する'
        mock: project-indexの呼び出し（偽物）
        expected: '`EditsRejectedError`（409）で、`title` が `BaseCommitUnusableError`、`detail` に `not_ancestor`、`errors[]` が空'
        exception: 編集を始めたときのコミットが使用できない
      - name: test_commit_edits_when_conflict
        case: 正常
        summary: 衝突してブランチに残した
        condition: 偽物が `conflict`（`branch`・`errors[]` の `writes[0]`・`script.stdout` に PR の URL）を持つ 200 を返却する
        mock: project-indexの呼び出し（要求を記録する偽物）
        expected: '`conflict.branch` が偽物の値、`conflict.reasons[0].key` が 1 件目の変更、`conflict.script.pr_url` が URL。送信した本文の `baseCommit` が要求の値、`update` の `expected_version` が辞書'
      - name: test_commit_edits_when_body_path_unknown
        case: 異常
        summary: 修正できない項目のパス
        condition: 修正できる項目のパスの取得に無い `#items[x].id` の `body` の変更と、`body_path` が `.py` の編集できない文書の `@file` の変更（それぞれ 1 件で送信する）
        mock: project-indexの呼び出し（偽物）
        expected: 'どちらも `EditsRejectedError`（400）で、書き込みの API を呼ばない'
        exception: 修正できない項目のパス
    exceptions:
      - name: EditsRejectedError
        condition: 本文の検証・編集を始めたときの文書が無い・編集を始めたときのコミットが使用できない・project-index の 4xx・5xx・待ちの上限
        message: IF-155-29 の状態コードごとの `title`・`detail`
      - name: ProjectIndexUnreachableError
        condition: project-index につながらない
        message: '`project-index（{address}）に接続できませんでした。{reason}`'
  - name: item_expected_versions
    title: 編集を始めたときの項目ごとのバージョン
    kind: 関数
    container: features/metadata/commits.py
    usecase: 画面で編集中の変更をまとめて直コミットする
    role: サービス
    summary: '`update` の変更ごとに、編集を始めたときの文書の `itemVersions` から修正した最上位のキーのバージョンだけの辞書を求める'
    scope: public
    is_async: true
    thread_safe: true
    args:
      - name: client
        title: project-indexの呼び出し
        type: ProjectIndexClient
        required: true
        passing: positional
        description: 問い合わせる
      - name: source_id
        type: str
        required: true
        passing: positional
        description: 配信元の ID
      - name: request
        type: CommitRequest
        required: true
        passing: positional
        description: 検証済みの本文
      - name: mappings
        type: Mapping[str, Mapping[str, str]]
        required: true
        passing: positional
        description: 文書の種類ごとの `metadata`
    returns:
      type: dict[str, dict[str, str] | str]
      description: '変更の `key` ごとの `{最上位のキー: バージョン}` か文書の全体のバージョン'
    process: |-
      0. `body` の項目のパスの変更は、項目のパスの最上位のキー（`#items[i1].body` は `items`）を求めるキーにし、`@file` の変更は辞書を求めずに要求の `expected_version` にする
      1. `update` の変更ごとに、`asyncio.gather` で project-indexの呼び出し.項目ごとのバージョンの取得（`doc_path`・`ref` は `base_commit`・`document_id` は `doc_id`）を呼ぶ
      2. 変更の `values` の列ごとに、`mappings[doc_kind]` で列と文書のキーの対応の解決をして最上位のキーを求め、そのキーのバージョンだけを辞書にする。そのキーのどれかが `itemVersions` に無い変更は、辞書ではなく `expected_version`（文書の全体のバージョン）にする
      3. `RefNotFoundError`（編集を始めたときのコミットがクローンに無い）は、`title` を `BaseCommitUnusableError` にした `EditsRejectedError`（409、`errors[]` なし）を送出する
      4. `DocumentNotFoundError` の変更は全て集め、`errors[]` にその変更の `key` を入れた `EditsRejectedError`（404）を送出する
    unit_tests:
      - name: test_item_expected_versions
        case: 正常
        summary: 修正した最上位のキーだけにする
        condition: '`tags: tags[].name` の種類の文書のタグの `update` と、`itemVersions` が `{name, description, tags}` を返却する偽物'
        mock: project-indexの呼び出し（要求を記録する偽物）
        expected: '`{tags: 偽物の tags のバージョン}` だけで、要求の `ref` が `base_commit`、`document_id` が `doc_id`'
      - name: test_item_expected_versions_when_not_found
        case: 異常
        summary: 編集を始めたときの文書が無い
        condition: 偽物が 2 件目の変更の文書で `DocumentNotFoundError` を送出する
        mock: project-indexの呼び出し（偽物）
        expected: '`EditsRejectedError`（404）で、`errors[0].key` が 2 件目の変更'
        exception: 編集を始めたときの文書が無い
      - name: test_item_expected_versions_when_key_missing
        case: 正常
        summary: 編集を始めたときの文書に修正したキーが無い
        condition: '`tags` の `update`（`expected_version` が `c3d4e5`）と、`itemVersions` が `{id, name}` だけを返却する偽物'
        mock: project-indexの呼び出し（偽物）
        expected: その変更の値が文字列の `c3d4e5`
      - name: test_item_expected_versions_when_base_commit_missing
        case: 異常
        summary: 編集を始めたときのコミットがクローンに無い
        condition: '偽物が文書の取得で `missing: ref` の 404 を返却する'
        mock: project-indexの呼び出し（偽物）
        expected: '`EditsRejectedError`（409）で、`name` が `BaseCommitUnusableError`、`errors[]` が空'
        exception: 編集を始めたときのコミットが使用できない
      - name: test_item_expected_versions_when_body
        case: 正常
        summary: 本文の変更の最上位のキー
        condition: '`#items[i1].body` の `body` の変更と `@file` の変更（`expected_version` が `c3d4e5`）'
        mock: project-indexの呼び出し（偽物）
        expected: '1 件目が `{items: 偽物の items のバージョン}`、2 件目が文字列の `c3d4e5`'
    exceptions:
      - name: EditsRejectedError
        condition: 編集を始めたときの文書が無い
        message: IF-155-29 の 404 の `title`・`detail`
  - name: to_conflict
    title: 衝突の結果への変換
    kind: 関数
    container: features/metadata/commits.py
    usecase: 画面で編集中の変更をまとめて直コミットする
    role: 変換
    summary: project-index の応答の `conflict` を、変更の `key` に戻した理由と PR の URL にする
    scope: public
    args:
      - name: conflict
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: project-index の応答の `conflict`
      - name: index_keys
        type: list[tuple[Literal['write', 'delete'], int, str]]
        required: true
        passing: positional
        description: 書き込みと削除への変換の添字と変更の `key` の対応
      - name: edits
        type: list[Edit]
        required: true
        passing: positional
        description: 送信した編集中の変更（文書の ID を変更の `key` に戻す）
    returns:
      type: ConflictResult
      description: IF-155-29 の `conflict`
    process: |-
      1. `errors[]` の `path` の先頭の `writes[{添字}]`・`deletes[{添字}]` を変更の `key` に戻し、`path` が文書の ID のもの（文書のバージョンが合わない）はその文書を変える変更ごとに 1 件にし（戻せないものは `None`）、`reason` と組にして `reasons` にする
      2. `script` があれば、`stdout` の空でない最後の行が `https://` で始まるときその行を `pr_url` にし、`exitCode`・`timedOut`・`stderr` と組にする
      3. `branch`・`baseCommit` と合わせて返却する。`commit` と `stdout` は入れない
    unit_tests:
      - name: test_to_conflict
        case: 正常
        summary: 理由を変更へ戻し、PR の URL を取り出す
        condition: '`errors[]` が `writes[1]` の 1 件と本文全体の 1 件、`script.stdout` が `pushed\nhttps://github.com/o/r/pull/9\n`'
        mock: なし
        expected: '`reasons[0].key` が 2 件目の変更、`reasons[1].key` が `None`、`script.pr_url` が `https://github.com/o/r/pull/9`'
      - name: test_to_conflict_when_script_missing
        case: 正常
        summary: スクリプトの指定が無い・差分確認
        condition: '`script: null`、`branch: null`'
        mock: なし
        expected: '`script` が `None`、`branch` が `None`'
      - name: test_to_conflict_when_no_pr_url
        case: 正常
        summary: 最後の行が URL でない
        condition: '`script.stdout` が `done`、`exitCode: 1`'
        mock: なし
        expected: '`script.pr_url` が `None`、`exit_code` が 1'
      - name: test_to_conflict_when_version_mismatch
        case: 正常
        summary: 文書の ID の理由をその文書の変更へ戻す
        condition: '`errors[]` が `path: n1` の 1 件で、n1 のタグの `update` と用語の `add` を送信した'
        mock: なし
        expected: '`reasons` が `key: tags:n1:update` の 1 件'
refs:
  - to: IF-155-29
    type: requires
    when: 変換と状態コードの戻し方を変えるときに、直コミットの入出力と突き合わせる。
tags:
  - name: topic:直コミット
  - name: topic:メタデータ
  - name: action:送信
  - name: tool:project-index
test_files:
  - tests/unit/dev_docs/features/metadata/test_commits.py
