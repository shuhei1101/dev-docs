lead: 画面の検索（project-index の検索の結果を画面の形にする）。
test_files:
  - tests/unit/dev_docs/features/view/test_search.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        画面の入口 ..> 画面の検索
        画面の検索 ..> project-indexの呼び出し
        画面の検索 ..> 文書のページのパス
        class 画面の入口 {
          <<function>>
        }
        class 画面の検索 {
          <<function>>
        }
