constants:
- name: WHOLE_FILE_PATH
  title: ファイル全体の項目のパス
  container: features/view/edit.py
  usecase: 文書の本文を編集する
  summary: 直コミットの `edits[].values` のファイル全体の編集のキー
  value: '`@file`'
data_models:
- name: EditBlock
  title: 表示した場所で修正できる項目
  container: features/view/edit.py
  usecase: 文書の本文を編集する
  role: DTO
  summary: IF-155-10 の `edit.blocks[]` の 1 件（`ApiModel`）
  properties:
  - name: path
    type: str
    description: 項目のパス（`summary`・`#items[i1].body`）
  - name: label
    type: str
