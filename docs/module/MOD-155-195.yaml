id: MOD-155-195
title: 開発ドキュメントサーバー / 変換
lead: |-
  文書を文書の取得で返す Markdown にする。既定はスキーマ駆動（`x-heading`・`x-shape`・`x-key`・`x-diagram`・列の `title`）で、`converters[]` を指す種類は project-index がスクリプトで変換した結果を使う。
  Markdown の中の埋め込みのマーカーは、返す前に YAML の表へ置き換える。
directory: |-
  ```text
  src/dev_docs/features/convert/
  ├─ __init__.py   # 公開する型と関数の再エクスポート
  ├─ types.py      # Converted / ConvertFailure / Shape / DiagramKind
  ├─ decisions.py  # decision_page_id（検討事項の文書のパス）
  ├─ markdown.py   # schema_to_markdown / render_table（スキーマ駆動の変換）
  ├─ diagrams.py   # render_diagram（x-diagram の Mermaid）
  ├─ embed.py      # embed_paths / expand_embeds（埋め込みのマーカーのパスと、表への展開）
  └─ service.py    # ConvertService（変換の選択・表のキーの取り出し）
  ```
