id: MOD-155-193
title: 開発ドキュメントサーバー / エントリーポイント
lead: '`dev-docs` コマンドのエントリーポイントを受け持つエントリーポイントの分類のファイルの並びと決まりを定め、この分類のファイルを追加・移動するときに参照する。'
directory: |-
  ```text
  src/dev_docs/
  ├─ __init__.py   # DIST_NAME（配布名）
  └─ __main__.py   # 引数の組み立てと main
  ```
notes:
  補足: 引数を参照し、バージョン・ヘルプを出すか、サブコマンドの処理へ指定する。
