data_models:
  - name: Handlers
    title: 配線済みの関数
    container: main.py
    usecase: 共通
    role: 合成の起点
    summary: 入口（画面の API・MCP）が使う部品を 1 回だけ作って束ねたもの
    description: |-
      `dataclass(frozen=True)`。入口はこの属性から部品を引き、部品を自分で作らない。
      project-index への問い合わせは `await` で、表の列の設定の読み書きとクローンの更新は `asyncio.to_thread` で呼ぶ。テストは属性を偽物に差し替えた `Handlers` を作る。
    properties:
      - name: terminal
        title: 端末の設定
        type: TerminalConfig
        access: 公開
        description: 起動時に読んだ端末の設定（`port` など再起動が要るキーはこの値のまま）
      - name: project_index
        title: project-indexの呼び出し
        type: ProjectIndexClient
        access: 公開
        description: 端末の設定の `project_index` に要求ごとに問い合わせる（project-indexの呼び出し）
      - name: converter
        title: 変換
        type: ConvertService
        access: 公開
        description: 文書を Markdown にする（変換。状態を持たない）
      - name: columns
        title: 表の列の設定
        type: ColumnSettings
        access: 公開
        description: 画面の表の隠す列（画面のAPI）
      - name: restart
        title: 再起動の制御
        type: RestartControl
        access: 公開
        description: 再起動と更新の要求を 1 つずつにし、`run_serve` が止まった後に同じプロセスを置き換えるかを持つ（再起動と更新）
      - name: prompts
        title: プロンプトの一式
        type: PromptSet
        access: 公開
        description: 起動のときに読んだプロンプトの YAML（管理の MCP が描画する。書き換えは再起動で効かせる）
classes:
  - name: PortInUseError
    title: ポートが使用中
    container: main.py
    usecase: 起動
    role: 例外
    summary: 待ち受けのアドレスとポートで待ち受けられないことを表す
    kind: クラス
    inherits: OSError
    properties:
      - name: bind
        title: 待ち受けのアドレス
        type: str
        access: 公開
        description: 待ち受けようとしたアドレス
      - name: port
        title: ポート
        type: int
        access: 公開
        description: 待ち受けようとしたポート
constants:
  - name: EXIT_CONFIG_INVALID
    title: 設定の違反の終了コード
    container: main.py
    usecase: 起動
    summary: 端末の設定が無い・違反するときの終了コード
    value: '2'
  - name: EXIT_PORT_IN_USE
    title: ポート使用中の終了コード
    container: main.py
    usecase: 起動
    summary: ポートで待ち受けられないときの終了コード
    value: '3'
  - name: EXIT_PROMPT_INVALID
    title: プロンプトの違反の終了コード
    container: main.py
    usecase: 起動
    summary: プロンプトの YAML が無い・違反するときの終了コード
    value: '4'
functions:
  - name: run_serve
    title: 待ち受けの開始
    kind: 関数
    container: main.py
    usecase: 起動
    role: 入口
    summary: 端末の設定を読み、部品を配線して待ち受け、停止の合図まで動く。再起動を要求されて止まったときは同じプロセスを置き換える
    scope: public
    side_effects: ポートで待ち受ける。`log_dir` にログを書く。標準出力・標準エラーに書く。再起動のときはプロセスを `os.execv` で置き換える
    args:
      - name: args
        title: 解析結果
        type: argparse.Namespace
        required: true
        passing: positional
        description: '`serve` の解析結果（使う値は無い）'
    returns:
      type: int
      description: 終了コード。停止の合図で止まったとき 0
    process: |-
      1. 端末の設定のパスを決め（端末の設定のパス）、端末の設定を読み（端末の設定の読み込み）、待ち受けのポートを決める（待ち受けのポート）
         - `TerminalConfigInvalidError` の場合、違反ごとに `{ファイル}: {パス}: {理由}`（違反が無ければ例外の本文）を標準エラーに出し、`EXIT_CONFIG_INVALID` を返す
      2. `log_dir` を作り、`logging` を設定する。ログは標準エラーと `{log_dir}/dev-docs.log`（`RotatingFileHandler`）に書く
      3. ポートで待ち受けられるか確かめる（ポートの確かめ）
         - `PortInUseError` の場合、`{bind}:{port} は使用中です。DEV_DOCS_PORT で別のポートを指定できます` を標準エラーに出し、`EXIT_PORT_IN_USE` を返す
      4. 部品を配線し（部品の配線）、アプリを組み立てる（アプリの組み立て）
         - `PromptInvalidError` の場合、違反ごとに `{file}: {path}: {reason}` を標準エラーに出し、`EXIT_PROMPT_INVALID` を返す
      5. 標準出力に `http://{bind}:{port}/` を出し、端末の設定の `leftover_sources` があれば `[warning]` 端末の設定に前のバージョンの sources が残っている（行の ID と、project-index で追加する案内）を書く。配信元の知らせを裏で始める
      6. `uvicorn.Server(uvicorn.Config(app, host=bind, port=port, log_config=None, timeout_graceful_shutdown=PROJECT_INDEX_TIMEOUT_SEC * SHUTDOWN_WAIT_FACTOR))` を作り、再起動の制御に取り付けて（サーバーの取り付け）`run()` する
         - 確かめた後に他のプロセスがポートを取り、uvicorn が待ち受けに失敗して止まった場合（`server.started` が `False`）、手順 3 と同じ本文を出して `EXIT_PORT_IN_USE` を返す
      7. 止まった後、再起動を要求済み（`handlers.restart.requested`）かで分ける
         - 要求済みの場合、ログのハンドラーを閉じ、`os.execv(sys.executable, [sys.executable, *SERVE_ARGV])` で同じプロセスを置き換える
         - 要求が無い場合、0 を返す
    exceptions:
      - name: なし（終了コード 2）
        condition: 端末の設定が無い・違反する
        message: '標準エラーに `{ファイル}: {パス}: {理由}` を全て'
      - name: なし（終了コード 3）
        condition: ポートで待ち受けられない
        message: '`{bind}:{port} は使用中です。DEV_DOCS_PORT で別のポートを指定できます`'
      - name: なし（終了コード 4）
        condition: プロンプトの YAML が無い・読めない・スキーマに違反する・描画できない
        message: '標準エラーに `{ファイル}: {キーのパス}: {理由}` を全て'
    unit_tests:
      - name: test_run_serve
        case: 正常
        summary: 待ち受けて配信元を出す
        condition: '`project_index` に、sample を配信中として返す project-index の偽物の HTTP サーバーのアドレスを持つ端末の設定を `DEV_DOCS_CONFIG` に入れる'
        mock: '`uvicorn.Server.run`（何もせず戻る。`started` を `True` にする）'
        expected: 0 を返し、標準出力に `http://127.0.0.1:{port}/` が配信元の ID `sample` より前に出る（`run` の後に知らせのスレッドを join して確かめる）、`uvicorn.Config` の `host` が `127.0.0.1`
      - name: test_run_serve_when_config_invalid
        case: 異常
        summary: 端末の設定が違反する
        condition: '`project_index` が URL でなく `port` が文字列'
        mock: なし
        expected: 2 を返し、標準エラーに `project_index` と `port` の 2 行
        exception: 端末の設定が違反する
      - name: test_run_serve_when_port_in_use
        case: 異常
        summary: ポートが使用中
        condition: テストが先に待ち受けたポートを `DEV_DOCS_PORT` に入れる
        mock: なし
        expected: 3 を返し、標準エラーにポートの番号と `DEV_DOCS_PORT`
        exception: ポートで待ち受けられない
      - name: test_run_serve_when_prompt_invalid
        case: 異常
        summary: プロンプトの YAML が違反する
        condition: 同梱した YAML を一時フォルダへ複製して `mcp/admin/tools/status.yaml` から `kind` を削除し、そのフォルダを `DEV_DOCS_PROMPTS_DIR` に入れる
        mock: '`uvicorn.Server.run`（呼ばれた数を数える）'
        expected: 4 を返し、標準エラーに `status.yaml` のパスと `kind` があり、`uvicorn.Server.run` が呼ばれない
        exception: プロンプトの YAML が違反する
      - name: test_run_serve_when_restart
        case: 正常
        summary: 再起動の要求で同じプロセスを置き換える
        condition: '`uvicorn.Server.run` の中で `handlers.restart.request()` を呼ぶ'
        mock: '`uvicorn.Server.run`（`started` を `True` にして再起動を要求して戻る）・`os.execv`（呼ばれた引数を記録する偽物）'
        expected: '`os.execv` が `sys.executable` と `[sys.executable, "-m", "dev_docs", "serve"]` で 1 回呼ばれる。`uvicorn.Config` の `timeout_graceful_shutdown` が `int(PROJECT_INDEX_TIMEOUT_SEC * 1.5)`'
      - name: test_run_serve_when_leftover_sources
        case: 正常
        summary: 残った sources を警告する
        condition: '`sources` に `id: sample` の行を残した端末の設定'
        mock: '`uvicorn.Server.run`（何もせず戻る）'
        expected: 0 を返し、`caplog` に `sample` と project-index で追加する案内の `warning` が 1 件
  - name: check_port
    title: ポートの確かめ
    kind: 関数
    container: main.py
    usecase: 起動
    role: 検証
    summary: 待ち受けのアドレスとポートで待ち受けられるかを、一度 bind して確かめる
    scope: public
    args:
      - name: bind
        title: 待ち受けのアドレス
        type: str
        required: true
        passing: positional
        description: 端末の設定の `bind`
      - name: port
        title: ポート
        type: int
        required: true
        passing: positional
        description: 待ち受けのポート
    returns:
      type: None
      description: 待ち受けられるときは何も返さない
    process: |-
      1. `socket.socket(AF_INET, SOCK_STREAM)` に uvicorn と同じく `SO_REUSEADDR` を付けて `(bind, port)` へ bind し、すぐに閉じる
         - `OSError`（`EADDRINUSE`・`EACCES`）の場合、`PortInUseError` を送る
    exceptions:
      - name: PortInUseError
        condition: bind に失敗する
        message: '`{bind}:{port} は使用中です`'
    unit_tests:
      - name: test_check_port
        case: 正常
        summary: 空いているポート
        condition: OS が払い出して閉じたポート
        mock: なし
        expected: 送らない
      - name: test_check_port_when_in_use
        case: 異常
        summary: 使用中のポート
        condition: テストが `listen` しているポート
        mock: なし
        expected: '`PortInUseError` の `port` がそのポート'
        exception: bind に失敗する
      - name: test_check_port_when_time_wait
        case: 正常
        summary: 閉じたばかりの接続が残るポート
        condition: '`SO_REUSEADDR` 付きで待ち受けて 1 本受け、サーバー側から接続と待ち受けを閉じた直後のポート'
        mock: なし
        expected: 送らない
  - name: build_handlers
    title: 部品の配線
    kind: 関数
    container: main.py
    usecase: 起動
    role: 合成の起点
    summary: 端末の設定から部品を 1 回だけ作り、配線済みの関数にする（project-index にはまだ問い合わせない）
    scope: public
    side_effects: '`state_dir` の下にフォルダを作る'
    args:
      - name: terminal
        title: 端末の設定
        type: TerminalConfig
        required: true
        passing: positional
        description: 読んだ端末の設定
    returns:
      type: Handlers
      description: 配線済みの関数
    process: |-
      1. プロンプトの一式を読む（`load_prompts(prompts_dir(os.environ), required=mcp_prompt_ids())`）。`PromptInvalidError` はそのまま送る
      2. `state_dir` を作る
      3. project-indexの呼び出し（`address` は端末の設定の `project_index`、`timeout` は `PROJECT_INDEX_TIMEOUT_SEC`）・変換・表の列の設定（`{state_dir}/columns`）・再起動の制御を作る
      4. プロンプトの一式とこれらの部品を持つ `Handlers` を返す
    exceptions:
      - name: PromptInvalidError
        condition: プロンプトの YAML が無い・読めない・スキーマに違反する・描画できない
        message: 違反を全て `problems` に持つ
    unit_tests:
      - name: test_build_handlers
        case: 正常
        summary: 部品を作り project-index に問い合わせない
        condition: '`state_dir` が無い一時フォルダの下、`project_index` が何も待ち受けていないアドレスの端末の設定'
        mock: なし
        expected: '`state_dir` ができ、`project_index.address` が端末の設定の値、`prompts` が `mcp/admin/tools/status` を持ち `mcp/docs/instructions` を持たない。例外を送らない'
      - name: test_build_handlers_when_prompt_invalid
        case: 異常
        summary: プロンプトの YAML が違反すると部品を作らない
        condition: '`state_dir` が無い一時フォルダの下、`DEV_DOCS_PROMPTS_DIR` が空の一時フォルダ'
        mock: なし
        expected: '`PromptInvalidError` を送り、`state_dir` ができない'
        exception: プロンプトの YAML が違反する
  - name: announce_sources
    title: 配信元の知らせ
    container: main.py
    usecase: 起動
    role: 合成の起点
    summary: 待ち受けの後に project-index の配信元の状態を問い合わせ、配信中の配信元か、つながらないことを知らせる
    kind: 関数
    scope: public
    thread_safe: true
    side_effects: デーモンのスレッドを 1 つ起こす。標準出力・標準エラー・エラーログに書く
    args:
      - name: terminal
        title: 端末の設定
        type: TerminalConfig
        required: true
        passing: positional
        description: '`project_index` を読む'
    returns:
      type: threading.Thread
      description: 起こしたスレッド（テストが join する）
    process: |-
      1. 次を実行するデーモンのスレッドを起こして返す（待ち受けとは別のイベントループで動かすため、`asyncio.run` の中で専用の project-indexの呼び出しを作って閉じる）
         - project-indexの呼び出し.配信元の状態の一覧 を呼び、`serving` の配信元の ID を標準出力に 1 行ずつ出す
         - `ProjectIndexUnreachableError` の場合、`project-index（{address}）に接続できませんでした。{reason}` と `project-index を起動してから、再読み込みしてください。` を標準エラーに出し、`[error]` project-index につながらない（アドレス・理由）を書く。待ち受けは止めない
         - それ以外の例外の場合、`[error]` 配信元の知らせに失敗した（例外のスタックトレース）を書いてスレッドを終える
    unit_tests:
      - name: test_announce_sources
        case: 正常
        summary: 配信中の配信元を出す
        condition: '`project_index` が sample・notes を `serving`、broken を `not_served` で返す偽物の HTTP サーバーのアドレス'
        mock: なし（偽物の HTTP サーバーと `capsys`）
        expected: スレッドを join した後、標準出力に `sample`・`notes` の 2 行
      - name: test_announce_sources_when_unreachable
        case: 正常
        summary: つながらないことを知らせる
        condition: '`project_index` が何も待ち受けていないアドレス'
        mock: なし（`capsys`・`caplog`）
        expected: スレッドを join した後、標準エラーにアドレスと `project-index を起動してから` があり、`caplog` に `error` が 1 件
  - name: run_migrate
    title: 設定の移し替えの実行
    container: main.py
    usecase: 設定の移し替え
    role: 入口
    summary: '`dev-docs migrate` の解析結果で対象を決め、当てる手順を表示するか当てる'
    kind: 関数
    scope: public
    side_effects: 対象の設定とバックアップを書く。標準出力・標準エラーに書く
    args:
      - name: args
        title: 解析結果
        type: argparse.Namespace
        required: true
        passing: positional
        description: '`migrate` の解析結果（`plan`・`record`・`project_index`・`allow_destructive`）'
    returns:
      type: int
      description: 終了コード。移し替えた・要らなかった・表示したとき 0
    process: |-
      1. 対象を決め（対象の決定。`env` は `os.environ`、対象は端末の設定だけ）、当てる手順を求める（当てる手順の一覧）
      2. `plan` の場合、手順ごとに `{version}: {description}` を標準出力に 1 行ずつ出し（破壊的な手順は末尾に ` [destructive]`）、0 を返す。手順が空なら何も出さない
      3. `record` の場合、手順を空にして適用し（移し替えの適用）、`{ファイル} の version を {current} にしました（バックアップ: {パス}）` を標準出力に出して 0 を返す
      4. それ以外で手順が空の場合、`移し替えは要りません（version {current}）` を標準出力に出して 0 を返す
      5. 手順を当て（移し替えの適用。`allow_destructive` は解析結果、`project_index` は解析結果か `http://127.0.0.1:{PROJECT_INDEX_PORT}`（無ければ 8786）、`now` は現在時刻）
         - 手順に `export_sources` がある場合、`export_source` は「行を受け取り、1 回の `asyncio.run` の中で `project_index` のアドレスと `PROJECT_INDEX_TIMEOUT_SEC` で project-indexの呼び出しを作り、端末の設定の配信元の行の追加を呼んで、`aclose` してから結果を返す関数」にする（行ごとにイベントループと HTTP のクライアントを作って閉じ、ループをまたいで使い回さない）
         - `--record` の場合と、手順に `export_sources` が無い場合は `export_source` を `None` にする、`{ファイル} を version {current} に移し替えました（バックアップ: {パス}）` を標準出力に出して 0 を返す。project-index に同じ id で内容の違う行があって移さなかった行は、`{id}: project-index に同じ id の別の行があるため移しませんでした` を 1 行ずつ出す
         - 手順 1〜5 で `MigrationError` の場合、本文を標準エラーに出し、例外の `exit_code` を返す
    exceptions:
      - name: なし（終了コード 2）
        condition: 対象が無い・読めない・`version` が無い（`MigrationConfigInvalidError`）
        message: '`{ファイル}: {理由}`'
      - name: なし（終了コード 4）
        condition: 当てた結果が新しいスキーマに違反する・読んだ後に変わった（`MigrationFailedError`）
        message: '違反を `{キーのパス}: {理由}` で 1 行ずつ'
      - name: なし（終了コード 5）
        condition: 破壊的な手順があり `--allow-destructive` が無い（`DestructiveStepBlockedError`）
        message: 破壊的な手順と `--allow-destructive` の案内
      - name: なし（終了コード 6）
        condition: 対象の `version` が dev-docs の読めるバージョンより新しい（`ConfigNewerError`）
        message: '`{ファイル}: 設定のバージョン {対象} が dev-docs で読み込める {現在} より新しい。dev-docs を更新してください`'
      - name: なし（終了コード 7）
        condition: '`sources` を移す先の project-index につながらない（`ProjectIndexUnreachableMigrationError`）'
        message: '`project-index（{address}）に接続できませんでした。{reason}` と、project-index を起動してから実行し直す案内'
    unit_tests:
      - name: test_run_migrate_when_plan
        case: 正常
        summary: 当てる手順を表示するだけで書き換えない
        condition: '`version: "1"` の端末の設定。`2` の手順に `rename` と `delete`。`--plan`'
        mock: 手順の置き場所（一時フォルダ）・`SETTINGS_VERSION`（`2`）
        expected: '0 を返し、標準出力が `2: ` で始まる 2 行で `delete` の行だけ末尾が `[destructive]`。対象は変わらない'
      - name: test_run_migrate
        case: 正常
        summary: 手順を当ててバックアップを取る
        condition: '`version: "1"` の端末の設定。`2` の手順に `rename` だけ'
        mock: 手順の置き場所・`SETTINGS_VERSION`（`2`）
        expected: '0 を返し、対象が改名後で `version: "2"`。標準出力にバックアップのパス'
      - name: test_run_migrate_when_current
        case: 正常
        summary: 同じバージョンなら何もしない
        condition: '`version` が `SETTINGS_VERSION` と同じ'
        mock: なし
        expected: 0 を返し、標準出力に `移し替えは要りません`。バックアップを作らない
      - name: test_run_migrate_when_record
        case: 正常
        summary: '`--record` は version だけを書き換える'
        condition: '`version: "1"`、`--record`'
        mock: 手順の置き場所・`SETTINGS_VERSION`（`2`）
        expected: 0 を返し、`version` だけが `2` に変わる
      - name: test_run_migrate_when_destructive
        case: 異常
        summary: 破壊的な手順で止める
        condition: '`2` の手順に `delete`。`--allow-destructive` なし'
        mock: 手順の置き場所・`SETTINGS_VERSION`（`2`）
        expected: 5 を返し、標準エラーに `--allow-destructive`。対象は変わらない
        exception: なし（終了コード 5）
      - name: test_run_migrate_when_newer
        case: 異常
        summary: 新しすぎる設定を書き換えない
        condition: '`version: "9"` の端末の設定'
        mock: なし
        expected: 6 を返し、標準エラーに `dev-docs を更新してください`
        exception: なし（終了コード 6）
      - name: test_run_migrate_when_config_invalid
        case: 異常
        summary: 対象が無い
        condition: '`DEV_DOCS_CONFIG` に無いファイル'
        mock: なし
        expected: 2 を返し、標準エラーにファイルのパス
        exception: なし（終了コード 2）
      - name: test_run_migrate_when_sources_moved
        case: 正常
        summary: sources を project-index へ移す
        condition: '`version: "1"` で `sources` に sample・notes の 2 行。project-index の偽物が sample を 201、notes を 409（内容が違う）で返す'
        mock: project-index（偽物の HTTP サーバー）
        expected: '0 を返し、端末の設定の `sources` が notes の 1 行、`project_index` と `version: "2"` がある。標準出力に notes を移さなかった行'
      - name: test_run_migrate_when_project_index_unreachable
        case: 異常
        summary: sources を移す先につながらない
        condition: '`version: "1"` で `sources` を持ち、`--project-index` が何も待ち受けていないアドレス'
        mock: なし
        expected: 7 を返し、端末の設定が元のまま。標準エラーにアドレス
        exception: なし（終了コード 7）
      - name: test_run_migrate_when_no_export
        case: 正常
        summary: export_sources の無い手順では project-index を呼ばない
        condition: '`version: "1"` で `sources` を持たない端末の設定。`2` の手順に `add` だけ、`--project-index` が何も待ち受けていないアドレス'
        mock: 手順の置き場所・`SETTINGS_VERSION`（`2`）
        expected: 0 を返し、project-index へ接続しない（`export_source` に `None` が渡る）
