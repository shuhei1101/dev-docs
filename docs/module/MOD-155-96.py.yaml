id: MOD-155-96
title: 開発ドキュメントサーバー / 変換 / inline.py
lead: 文字列の値の中の、図・ファイルツリー・手順・参照・Issue 番号・値の選択肢の書き換え。
test_files:
  - tests/unit/dev_docs/features/convert/test_inline.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        スキーマ駆動の変換 ..> 本文の書き換え
        スキーマ駆動の変換 ..> 参照のリンク
        本文の書き換え ..> 手で書く図の組み立て
        class スキーマ駆動の変換 {
          <<function>>
        }
        class 本文の書き換え {
          <<function>>
        }
        class 参照のリンク {
          <<function>>
        }
        class 手で書く図の組み立て {
          <<function>>
        }
        click スキーマ駆動の変換 href "./MOD-155-97.py.yaml#スキーマ駆動の変換"
        click 手で書く図の組み立て href "./MOD-155-93.py.yaml#手で書く図の組み立て"
constants:
  - name: TREE_LINE
    title: ファイルツリーの罫線
    container: features/convert/inline.py
    usecase: 文書の取得
    summary: 言語の無いコードブロックの全ての行がこの書き方なら、ファイルツリーにする
    value: '^(\S.*|(│   |\|   |    )*(├── |└── |\|-- |`-- ).+)$'
  - name: ISSUE_NUMBER
    title: Issue 番号
    container: features/convert/inline.py
    usecase: 文書の取得
    summary: リンクにする Issue 番号。前が英数字・`/`・`&`・`[`・`(` の `#` と、行内のコード・リンクの中は当てない
    value: '(?<![\w/&\[(])#(\d+)\b'
  - name: CHOICE
    title: 値の選択肢の 1 つ
    container: features/convert/inline.py
    usecase: 文書の取得
    summary: 値の選択肢の 1 つ。` / ` で区切った全ての部分がこの書き方なら、値の選択肢にする
    value: '^''([^'']+)''（(.+)）$'
  - name: ID_LINK
    title: id のリンク
    container: features/convert/inline.py
    usecase: 文書の取得
    summary: 本文の `[名前](id:{文書の ID})`・`[名前](id:{文書の ID}#{項目のパス})` のリンク。項目のパスは `)` を含まない
    value: '`\[(?P<name>[^\]]*)\]\(id:(?P<id>[^)#\s]+)(?:#(?P<item>[^)]+))?\)`'
  - name: ANCHOR_DROP
    title: アンカーで落とす文字
    container: features/convert/inline.py
    usecase: 文書の取得
    summary: 見出しのアンカーにするときに落とす記号（mdmark の見出しの `id` と同じ）
    value: '`[^\w\- ]`'
functions:
  - name: rewrite_text
    title: 本文の書き換え
    kind: 関数
    container: features/convert/inline.py
    usecase: 文書の取得
    role: 変換
    summary: 文字列の値を、mdmark の記法を使った Markdown に書き換える
    scope: public
    thread_safe: true
    args:
      - name: text
        title: 文字列
        type: str
        required: true
        passing: positional
        description: 文書の文字列の値
      - name: context
        title: 描画の文脈
        type: RenderContext
        required: true
        passing: positional
        description: Issue の URL
      - name: head
        title: 図の見出し
        type: DiagramHead
        required: true
        passing: positional
        description: 中の ```mermaid を部品にするときの見出し
    returns:
      type: str
      description: 書き換えた Markdown
    process: |-
      1. 値の全体が値の選択肢（` / ` で区切った全ての部分が `CHOICE`）なら、部分ごとに `` - `badge:{値}` {説明} `` の行にして返す
      2. ```mermaid のコードブロックを、1 つずつ手で書く図の組み立てで置き換える
      3. 言語の無いコードブロックのうち、2 行以上で全ての行が `TREE_LINE` に当たり、罫線を持つ行が 1 つ以上あるものの言語を `tree` にする
      4. 値の全体が番号付きの箇条書き（全ての行が `{数}. ` で始まるか、その字下げの続き）なら、`<!-- steps -->`・箇条書き・`<!-- /steps -->` にする
      5. コードブロックの外で、`ISSUE_NUMBER` を `[#{番号}]({issue_url}{番号})` にする（`issue_url` が `None` なら書き換えない）
      6. コードブロック・行内のコードの外で、`ID_LINK` を `[{名前}]({リンク先})` にする。リンク先は参照のリンクと同じ相対パスとアンカー（`{文書の ID}#{項目のパス}` を参照のリンクの引き方で引く）。`links` に無い ID のリンクは書き換えない
    unit_tests:
      - name: test_rewrite_text_when_mermaid
        case: 正常
        summary: 中の図を部品にする
        condition: '前後に段落を持つ、```mermaid の `sequenceDiagram` のコードブロック'
        mock: なし
        expected: '前後の段落が残り、コードブロックが map の範囲（`<!-- map: … -->` 〜 `<!-- /map -->`）に替わる'
      - name: test_rewrite_text_when_tree
        case: 正常
        summary: ファイルツリー
        condition: '`src/`・`├── a.py`・`└── b.py` の言語の無いコードブロック'
        mock: なし
        expected: コードブロックの言語が `tree`
      - name: test_rewrite_text_when_steps
        case: 正常
        summary: 手順
        condition: '`1. 開く`・`2. 読む` の 2 行'
        mock: なし
        expected: '`<!-- steps -->` と `<!-- /steps -->` で囲んだ箇条書き'
      - name: test_rewrite_text_when_issue
        case: 正常
        summary: Issue 番号
        condition: '`#26 で直す` と、行内のコード `` `#27` ``、`issue_url` が `https://github.com/o/r/issues/`'
        mock: なし
        expected: '`[#26](https://github.com/o/r/issues/26) で直す` で、`` `#27` `` は書き換えない'
      - name: test_rewrite_text_when_no_issue_url
        case: 正常
        summary: Issue の URL が無い
        condition: '`#26`、`issue_url` が `None`'
        mock: なし
        expected: '`#26` のまま'
      - name: test_rewrite_text_when_choices
        case: 正常
        summary: 値の選択肢
        condition: '`''planned''（予定） / ''allowed''（許可）`'
        mock: なし
        expected: '`` - `badge:planned` 予定 `` と `` - `badge:allowed` 許可 `` の 2 行'
      - name: test_rewrite_text_when_id_link
        case: 正常
        summary: id のリンク
        condition: '`[A](id:a)`・`[B](id:b#flow)`・`[C](id:zzz)`・行内のコード `` `[D](id:a)` ``、`links` に `a`（パス `dev/a.yaml`）と `b`（パス `dev/b.yaml`）、文書のパスが `dev/c.yaml`、項目の見出しの引き方が `b`・`flow` に `処理の流れ` を返す'
        mock: なし
        expected: '`[A](a.yaml)`・`[B](b.yaml#処理の流れ)`・`[C](id:zzz)`・`` `[D](id:a)` ``'
      - name: test_rewrite_text_when_id_link_no_heading
        case: 正常
        summary: 見出しにならない項目
        condition: '`[B](id:b#no-such)`、項目の見出しの引き方が `None` を返す'
        mock: なし
        expected: '`[B](b.yaml)`'
  - name: link_reference
    title: 参照のリンク
    kind: 関数
    container: features/convert/inline.py
    usecase: 文書の取得
    role: 変換
    summary: 文書の ID・パスを指す参照の値を、文書のタイトル付きのリンクにする
    scope: public
    thread_safe: true
    args:
      - name: value
        title: 値
        type: str
        required: true
        passing: positional
        description: '`{文書の ID}#{項目のパス}` か文書のパス'
      - name: context
        title: 描画の文脈
        type: RenderContext
        required: true
        passing: positional
        description: リンクの引き先と、相対パスの起点
    returns:
      type: str | None
      description: '`[{タイトル}]({相対パス})` か、`[{タイトル} / {項目のパス}]({相対パス}#{アンカー})`。引き先に無ければ `None`'
    process: |-
      1. 値を最初の `#` で文書の ID と項目のパスに分け、`links` を ID で引く
      2. 相対パスは、文書のパスのフォルダからリンクの先の `path` への相対パス（`/` 区切り・URL エンコード）にする
      3. 項目のパスがあれば、文脈の項目の見出しの引き方（`item_heading`）で見出しを引き、見出しがあれば見出しのアンカーを `#` で付ける（無ければ付けない）
    unit_tests:
      - name: test_link_reference
        case: 正常
        summary: 項目を指す参照
        condition: '`dev/a#flows[正常系]`、`links` に `dev/a`（タイトル `A`・パス `dev/a.yaml`）、文書のパスが `dev/b.yaml`'
        mock: なし
        expected: '`[A / flows\[正常系\]](a.yaml)`（リンクの文字の `[`・`]` はエスケープする）'
      - name: test_link_reference_when_heading
        case: 正常
        summary: 見出しになる項目
        condition: '`dev/a#flows[正常系]`、項目の見出しの引き方が `正常系` を返す'
        mock: なし
        expected: '`[A / flows\[正常系\]](a.yaml#正常系)`'
      - name: test_link_reference_when_unknown
        case: 正常
        summary: 引き先に無い
        condition: '`links` に無い ID'
        mock: なし
        expected: '`None`'
  - name: link_decisions
    title: 検討事項のリンク
    kind: 関数
    container: features/convert/inline.py
    usecase: 文書の取得
    role: 変換
    summary: '`decisions` の並びのうち、文脈の `decisions` にある ID を、検討事項の文書の画面へのリンクの Markdown にする'
    scope: public
    thread_safe: true
    args:
      - name: values
        title: 値の並び
        type: Sequence[Any]
        required: true
        passing: positional
        description: '`decisions` のキーの値'
      - name: context
        title: 描画の文脈
        type: RenderContext
        required: true
        passing: positional
        description: リンクにする検討事項と、相対パスの起点
    returns:
      type: list[Any]
      description: 要素ごとに、リンクにする ID は `[{ID}]({相対パス})`、それ以外はそのままの値の並び
    process: |-
      1. 要素が文字列で文脈の `decisions` にあれば、文書のパスのフォルダから `{DECISION_PAGE_PREFIX}{ID}` への相対パス（`/` 区切り・URL エンコード）へのリンクにする
      2. それ以外の要素はそのまま返却する
    unit_tests:
      - name: test_link_decisions
        case: 正常
        summary: リンクにする ID とそれ以外
        condition: '`["D-1", "D-2", 3]`、文脈の `decisions` が `{"D-1"}`、文書のパスが `dev/a/b.yaml`'
        mock: なし
        expected: '`["[D-1](../../_decisions/D-1)", "D-2", 3]`'
  - name: heading_anchor
    title: 見出しのアンカー
    kind: 関数
    container: features/convert/inline.py
    usecase: 文書の取得
    role: 変換
    summary: 見出しの文字列を、その見出しへ飛ぶアンカーにする
    scope: public
    thread_safe: true
    args:
      - name: text
        title: 見出し
        type: str
        required: true
        passing: positional
        description: 見出しの文字列
    returns:
      type: str
      description: アンカー（`#` は付けない）
    process: |-
      1. 前後の空白を除いて小文字にし、`ANCHOR_DROP` に当たる文字を落とし、空白を `-` にする
    unit_tests:
      - name: test_heading_anchor
        case: 正常
        summary: 記号と空白
        condition: '`正常シナリオ（ER 図を読む）`'
        mock: なし
        expected: '`正常シナリオer-図を読む`'
