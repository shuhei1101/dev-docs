id: MOD-155-238
title: 画面 / 共通 / use-scroll-restoration.ts
lead: 文書の画面のサイドバーのスクロール位置を種類のタブごとに `sessionStorage` に保存し、タブを移って戻ったときに戻すフックを受け持ち、共通の use-scroll-restoration.ts を修正するときに参照する。
constants:
  - name: SCROLL_SAVE_INTERVAL_MS
    title: スクロール位置の保存の間引き
    container: shared/hooks/use-scroll-restoration.ts
    usecase: 共通
    summary: スクロールの間に `sessionStorage` へ書き込む間隔（ミリ秒）。移る前と `pagehide` で必ず書き込むので、間引きの間の位置は失わない。書き込みは同期で 1 回 1 ミリ秒未満のため、入力の応答の目安（100 ミリ秒）の 2 倍で間引く
    value: '200'
functions:
  - name: useScrollRestoration
    title: スクロール位置のキーごとの復元
    kind: 関数
    container: shared/hooks/use-scroll-restoration.ts
    usecase: 共通
    role: フック
    summary: 要素の縦のスクロール位置をキーごとに `sessionStorage` に保存し、キーが変わったときに新しいキーの位置へ戻す
    scope: public
    args:
      - name: ref
        type: RefObject<HTMLElement | null>
        required: true
        passing: positional
        description: スクロールの領域
      - name: key
        type: string
        required: true
        passing: positional
        description: 保存のキー（画面設計の `retained_state` の `key`。`dev-docs:v1:doc-view:sidebar:{source}:{tab}:scroll`）
    returns:
      type: void
      description: 何も返却しない
    process: |-
      1. スクロールのたびに `SCROLL_SAVE_INTERVAL_MS` で間引いて `scrollTop` を `key` に書き込み、`key` が変わる前と `pagehide` ではその時点の `scrollTop` を書き込む
      2. `key` が変わったときだけ、描いた後の次のフレーム（`requestAnimationFrame`。ルーターの復元の後）で、新しい `key` に値があればその値を、無ければ 0 を `scrollTop` に設定する
      3. 初めて描いたときは戻さない（再読み込みと戻る・進むはルーターの `scrollRestoration` が戻す）
    unit_tests:
      - name: test_use_scroll_restoration_when_key_changed
        case: 正常
        summary: キーが変わったら保存した位置に戻す
        condition: キー A で `scrollTop` を 300 にし、キー B（`sessionStorage` に 120）に変え、続けてキー A に戻す
        mock: '`requestAnimationFrame`（すぐに呼ぶ偽物）'
        expected: B に変えた後の `scrollTop` が 120、A に戻した後が 300
      - name: test_use_scroll_restoration_when_first_render
        case: 正常
        summary: 初めて描いたときは戻さない
        condition: キーに 480 がある状態で初めて描く
        mock: '`requestAnimationFrame`（すぐに呼ぶ偽物）'
        expected: '`scrollTop` を設定しない'
      - name: test_use_scroll_restoration_when_new_key
        case: 正常
        summary: 保存が無いキーは一番上から
        condition: '`scrollTop` を 300 にして、`sessionStorage` に値の無いキーに変える'
        mock: '`requestAnimationFrame`（すぐに呼ぶ偽物）'
        expected: '`scrollTop` が 0'
    notes:
      ルーターとの分担: TanStack Router の `scrollRestoration` は履歴の項目ごとに位置を持ち、新しい履歴へは直前の場所にある要素の位置だけを引き継ぐ。種類のタブを移って戻るときは新しい履歴になり、前のタブのサイドバーの位置を持たないため、タブごとの位置はこのフックで戻す。キーが変わらないとき（同じタブの中の移動・再読み込み・戻る・進む）はこのフックは戻さず、ルーターの復元に任せるので、同じ要素を 2 つの仕組みが同時に戻すことは無い。キーが変わったときは、ルーターが引き継いだ位置を次のフレームでこのフックが上書きする
tags:
  - name: topic:スクロール
    main: true
  - name: action:保存
  - name: topic:画面
test_files:
  - tests/unit/frontend/src/shared/hooks/use-scroll-restoration.test.tsx
