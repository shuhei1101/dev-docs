id: MOD-155-212
title: "画面 / 文書の画面 / tables.ts"
lead: 本文の Markdown の表と、文書の取得の表のキーを対にする関数を受け持ち、文書の画面の tables.ts を修正するときに参照する。
functions:
  - name: findTables
    title: 本文の表と表のキーの対
    kind: 関数
    container: features/docs/doc-view/tables.ts
    usecase: 文書を参照する
    role: 変換
    summary: Markdown の表を出る順に表のキーと対にし、直前の表のマーカーと、列の表示・非表示の機能を持つかを返却する
    scope: public
    args:
      - name: params
        type: '{markdown: string; tableKeys: string[]}'
        required: true
        passing: positional
        description: '`markdown` は描く本文、`tableKeys` は文書の取得の `tableKeys`（サーバーが本文の表の出る順に並べたもの）'
    returns:
      type: '{key: string; marker: {start: number; end: number; text: string} | null; columns: boolean}[]'
      description: 表ごとの表のキー・直前の表のマーカーの範囲（開始と終了の行。無ければ null）とその文字列・列の表示・非表示の機能を持つ表か
    process: |-
      1. 行を先頭から確認して、コードブロック（```・~~~）の中は飛ばす
      2. `|` で始まる行で表の中でなく、次の行が区切りの行（`---` の並び）なら表の始まりにし、`tableKeys` の同じ番号のキーと対にする（サーバーの表のキーの数え方と同じ）
      3. 表の始まりより前の、空行でない最後のまとまりが表のマーカー（`<!-- table:` から次の `-->` まで。複数行を含む）なら、その範囲をマーカーにする
      4. `columns` は、マーカーの名前の後ろが `{` で始まるときは JSON として読み込み、`features.columns.enabled` が `false` でなく、かつ `features.columns` があるか、どれかの列の `hidden` が `true` なら真にする（JSON として読み込めなければ偽）。それ以外の記載方法は、マーカーが `+columns` を持てば真にする
      5. `tableKeys` より表が多いときは、余った表を返却しない
    unit_tests:
      - name: test_find_tables
        case: 正常
        summary: 列の表示・非表示の機能を持つ表と持たない表
        condition: 'マーカーの無い表、`<!-- table: data +columns -->` の表、コードブロックの中の表の順の本文と、`tableKeys` の `[t1, t2]`'
        mock: なし
        expected: '`[{key: t1, marker: null, columns: false}, {key: t2, marker: {…}, columns: true}]`'
      - name: test_find_tables_when_json_marker
        case: 正常
        summary: JSON の記載の表のマーカー
        condition: '`{"kind": "data", "features": {"columns": {}}}` の表、3 行にわたる `{"kind": "data", "columns": {"備考": {"hidden": true}}}` の表、`{"kind": "data", "features": {"columns": {"enabled": false}}, "columns": {"備考": {"hidden": true}}}` の表、`{"kind": "data"}` の表の順の本文と、`tableKeys` の `[t1, t2, t3, t4]`'
        mock: なし
        expected: '`columns` が `[true, true, false, false]` で、2 つ目の表の `marker` の範囲が 3 行'
  - name: applyHiddenColumns
    title: 隠す列の書き込み
    kind: 関数
    container: features/docs/doc-view/tables.ts
    usecase: 文書を参照する
    role: 変換
    summary: 保存した隠す列を、列の表示・非表示の機能を持つ表のマーカーへ書き込む
    scope: public
    args:
      - name: params
        type: '{markdown: string; tableKeys: string[]; columns: Record<string, string[]>}'
        required: true
        passing: positional
        description: '`columns` は文書の取得の `columns`（表のキー → 隠す列）'
    returns:
      type: string
      description: 隠す列を書き込んだ Markdown
    process: |-
      1. `findTables` で表を取得する
      2. `columns` が真で、`columns` にその表のキーがある表のマーカーを書き換える
         - JSON のマーカーは、全ての列の `hidden` を `columns[key]` と一致させ（`columns[key]` に無い列の `hidden` は削除し、`columns` に設定の無くなった列は削除し、列が無くなった `columns` は削除する）、`hidden` が `true` の列が無くなるときは `features.columns` の `{}` を追加する。マーカーの範囲を 1 行の JSON に置き換える
         - 前の記載方法のマーカーは、`columns[key]` が空でないときだけ、行の末尾（`-->` の前）に ` hide={列名をカンマでつないだもの}` を入れる
    unit_tests:
      - name: test_apply_hidden_columns
        case: 正常
        summary: 前の記載方法の `+columns` の表のキーで隠す列を書き込む
        condition: 'マーカーの無い表の後に `+columns` の表がある本文、`tableKeys` の `[t1, t2]`、`columns` の `{t1: [a], t2: [備考]}`'
        mock: なし
        expected: 2 つ目の表のマーカーだけに `hide=備考` が入り、1 つ目の表は変わらない
      - name: test_apply_hidden_columns_when_json_marker
        case: 正常
        summary: JSON のマーカーの隠す列を保存した列で置き換える
        condition: '3 行にわたる `{"kind": "data", "columns": {"説明": {"hidden": true, "width": {"mode": "nowrap"}}}}` の表と `{"kind": "data", "columns": {"ID": {"hidden": true}}}` の表、`tableKeys` の `[t1, t2]`、`columns` の `{t1: [備考], t2: []}`'
        mock: なし
        expected: '1 つ目のマーカーが 1 行の `{"kind": "data", "columns": {"説明": {"width": {"mode": "nowrap"}}, "備考": {"hidden": true}}}`、2 つ目のマーカーが `{"kind": "data", "features": {"columns": {}}}`'
  - name: columnTableKeys
    title: 列の表示・非表示の機能を持つ表のキー
    kind: 関数
    container: features/docs/doc-view/tables.ts
    usecase: 文書を参照する
    role: 変換
    summary: 列の表示・非表示の機能を持つ表のキーだけを出る順に並べる（mdmark の `tableIndex` の番号に対応する）
    scope: public
    args:
      - name: params
        type: '{markdown: string; tableKeys: string[]}'
        required: true
        passing: positional
        description: '`findTables` と同じ'
    returns:
      type: string[]
      description: 列の表示・非表示の機能を持つ表のキーの並び
    process: |-
      1. `findTables` の結果のうち `columns` が真の表の `key` を出る順に返却する
    unit_tests:
      - name: test_column_table_keys
        case: 正常
        summary: 列の表示・非表示の機能を持つ表だけを返却する
        condition: '`test_find_tables` と同じ本文'
        mock: なし
        expected: '`[t2]`'
refs:
  - SCR-155-1#elements[列の表示のメニュー]
test_files:
  - tests/unit/frontend/src/features/docs/doc-view/tables.test.ts
