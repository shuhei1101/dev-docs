id: MOD-155-77
title: "画面 / 文書の画面"
lead: 文書の画面・見つからない画面と、両方が使用する検索・コメントの構成を受け持つ文書の画面の分類のファイルの並びと決まりを定め、この分類のファイルを追加・移動するときに参照する。
diagrams:
  - name: 文書の画面
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class 文書のルート
        class 文書の問い合わせ
        class 文書の画面
        class 本文
        class mdmarkの読み込み
        class コメントのストア
        class コメントのパネル
        class 検索のダイアログ
        class サイドバー
        class 本文の領域
        class 文書の画面の移動
        class 配信中の配信元の取り出し
        文書のルート --> 文書の問い合わせ : loader
        文書の画面 --> 文書の問い合わせ
        文書の画面 --> サイドバー
        文書の画面 --> 本文の領域
        文書の画面 --> 文書の画面の移動
        文書の画面 --> 配信中の配信元の取り出し
        本文の領域 --> 本文
        文書の画面 --> 検索のダイアログ
        文書の画面 --> コメントのパネル
        本文 --> mdmarkの読み込み
        本文 --> コメントのストア : commentStore
        コメントのパネル --> コメントのストア
      ```
  - name: 見つからない画面
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class 見つからない画面
        class 見つからない画面の内容
        class 見つからなかったものの説明
        class 配信中の配信元の取り出し
        class 次のリンク
        class 検索のダイアログ
        見つからない画面 --> 見つからない画面の内容
        見つからない画面 --> 次のリンク
        見つからない画面 --> 検索のダイアログ
        見つからない画面の内容 --> 見つからなかったものの説明
        見つからない画面の内容 --> 配信中の配信元の取り出し
      ```
