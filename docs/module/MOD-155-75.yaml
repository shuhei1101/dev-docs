id: MOD-155-75
title: "画面 / アプリとルート"
lead: 画面（`frontend/src`）のエントリーポイント・プロバイダ・ルーター・ルートの構成を受け持つアプリとルートの分類のファイルの並びと決まりを定め、この分類のファイルを追加・移動するときに参照する。
diagrams:
  - name: 全体
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class 入口
        class プロバイダ
        class ルーター
        class 全画面の枠
        class 文書のルート
        class 設定のルート
        class 文書の画面
        class 設定画面
        class 見つからない画面
        入口 --> プロバイダ
        入口 --> ルーター
        ルーター --> 全画面の枠
        全画面の枠 --> 文書のルート
        全画面の枠 --> 設定のルート
        全画面の枠 --> 見つからない画面 : notFoundComponent
        文書のルート --> 文書の画面
        設定のルート --> 設定画面
      ```
