id: MOD-155-187
title: 開発ドキュメントサーバー / 共通 / paths.py
lead: パスの正規化。
test_files:
  - tests/unit/dev_docs/shared/test_paths.py
functions:
  - name: normalize_path
    title: パスの正規化
    kind: 関数
    container: shared/paths.py
    usecase: 共通
    role: 変換
    summary: '`~` の展開・`..` の解決・末尾の `/` の除去をした絶対パスにする'
    scope: public
    thread_safe: true
    args:
      - name: path
        title: パス
        type: str | Path
        required: true
        passing: positional
        description: 正規化するパス
    returns:
      type: Path
      description: 絶対パス。シンボリックリンクは解かない
    process: 1. `expanduser` で `~` を展開し、`os.path.abspath` で `..` を解いた `Path` を返す
    unit_tests:
      - name: test_normalize_path
        case: 正常
        summary: '`..` と末尾の `/` を除く'
        condition: '`/r/a/../b/`'
        mock: なし
        expected: '`Path("/r/b")`'
