id: MOD-155-35
title: 画面 / 文書の画面 / comment-panel.tsx
lead: 溜めたコメントの一覧と、コピー・起票を受け持ち、文書の画面の comment-panel.tsx を修正するときに参照する。
test_files:
  - tests/unit/frontend/src/features/docs/shared/comments/comment-panel.test.tsx
components:
  - name: CommentPanel
    title: コメントのパネル
    kind: コンポーネント
    container: features/docs/shared/comments/comment-panel.tsx
    usecase: コメントを溜める
    role: 部品
    summary: コメントのストアの一覧を並べ、選択・修正・削除・コピー・起票をする（狭い幅では shadcn/ui の `Sheet` を下から出す。幅はメディアクエリの判定）
    props:
      - name: open
        type: boolean
        required: true
        description: 開いているか
      - name: onOpenChange
        type: '(open: boolean) => void'
        required: true
        description: 開閉（閉じたらトップバーのコメントのボタンへフォーカスを戻す）
      - name: github
        type: GitHubTarget | null
        required: true
        description: 起票先（null は「Issue を作成」を出さない）
      - name: onLocate
        type: '(comment: DocComment) => void'
        required: true
        description: コメントの場所を押したとき（画面がその文書を開き、`DocBody` が本文のコメントの箇所へ移る）
    state:
      - name: editingId
        type: string | null
        initial: 'null'
        description: 修正中のコメント
        notes: '`useState`。修正欄で Esc を押すと、イベントをパネルへ伝えず（`stopPropagation`）null に戻す'
    description: 修正・削除はコメントの配置先の `update`・`remove` を呼ぶ（本文のマーカーは `DocBody` が配置先の変化を受けて再描画する）。コピーは `navigator.clipboard.writeText(formatComments(選んだコメント))`。起票は全文をコピーしてから `buildIssueUrl` の URL を `window.open(url, "_blank", "noopener")` で開く。結果は sonner の通知で出す（文言は画面設計の通知）
    unit_tests:
      - name: test_comment_panel
        case: 正常
        summary: 選んだコメントをコピーする
        condition: 3 件のうち 1 件の選択を除外して「選択 2 件をコピー」
        mock: '`navigator.clipboard`（偽物）・sonner の `toast`（`vi.mock`）'
        expected: '`writeText` に 2 件分の本文、通知が `選択 2 件をクリップボードにコピーしました。`'
      - name: test_comment_panel_when_indeterminate
        case: 正常
        summary: 一部だけ選んだとき
        condition: 3 件のうち 1 件だけ選ぶ
        mock: なし
        expected: 「すべて選択」が途中の状態（`aria-checked="mixed"`）
      - name: test_comment_panel_when_clipboard_failed
        case: 異常
        summary: コピーの失敗
        condition: '`writeText` が失敗する'
        mock: '`navigator.clipboard`（例外を送信する偽物）・sonner の `toast`'
        expected: 通知が `クリップボードにコピーできませんでした。`
      - name: test_comment_panel_when_deleted
        case: 正常
        summary: 削除を取り消す
        condition: 3 件のうち 2 件目の削除のボタンを押し、通知の `元に戻す` を押す
        mock: sonner の `toast`（`vi.mock`、操作を記録する偽物）
        expected: 押した後は一覧が 2 件で通知が `コメントを削除しました。`、`元に戻す` の後は 3 件が削除する前と同じ並び
      - name: test_comment_panel_when_accessible_name
        case: 正常
        summary: アイコンだけのボタンの読み上げ名
        condition: 2 件のコメントを並べる
        mock: なし
        expected: 2 件目のボタンの読み上げ名が `2 件目のコメントを修正`・`2 件目のコメントを削除`
    notes:
      削除の取り消し: 削除のボタンで `useCommentStore` の `remove` を呼び、戻り値があれば sonner の `toast` で `コメントを削除しました。` と操作 `元に戻す` を出す。`元に戻す` で `restore` を呼び、mdmark の `reloadComments` で本文のマーカーを描き直す
      読み上げ名: 修正・削除のアイコンだけのボタンは `{順番} 件目のコメントを修正`・`{順番} 件目のコメントを削除` を `aria-label` に持ち、shadcn/ui の `Tooltip` で `修正`・`削除` を出す
tags:
  - name: topic:文書
    main: true
  - name: topic:画面
  - name: topic:コメント
  - name: topic:ストア
  - name: action:コピー
  - name: action:起票
