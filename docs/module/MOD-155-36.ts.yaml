id: MOD-155-36
title: 画面 / 文書の画面 / comment-store.ts
lead: このブラウザのタブで溜めたコメントの配置先を受け持ち、文書の画面の comment-store.ts を修正するときに参照する。
test_files:
  - tests/unit/frontend/src/features/docs/shared/comments/comment-store.test.ts
data_models:
  - name: DocComment
    title: コメント
    container: features/docs/shared/comments/comment-store.ts
    usecase: コメントを溜める
    role: DTO
    summary: 本文の文字列に付けた 1 件のコメント
    properties:
      - name: id
        type: string
        description: '`crypto.randomUUID()`'
      - name: docId
        type: string
        description: '`{source}@{ref}:{path}`'
      - name: source
        type: string
        description: 配信元の ID
      - name: ref
        type: string | null
        description: コメントしたリビジョン
      - name: path
        type: string
        description: 文書のパス
      - name: docTitle
        type: string
        description: 文書の名前
      - name: headings
        type: string[]
        description: 直前の見出しの並び（無ければ空）
      - name: quote
        type: string
        description: 選んだ文字列
      - name: prefix
        type: string
        description: 引用の前の文字列（mdmark）
      - name: suffix
        type: string
        description: 引用の後の文字列（mdmark）
      - name: body
        type: string
        description: 記載したコメント
      - name: selected
        type: boolean
        description: コピー・起票に含めるか（追加したときは true）
      - name: createdAt
        type: string
        description: ISO 8601
functions:
  - name: commentsOf
    title: 文書のコメント
    kind: 関数
    container: features/docs/shared/comments/comment-store.ts
    usecase: コメントを溜める
    role: 変換
    summary: mdmark の `commentStore.load` が返却する、`docId` のコメントの並び
    scope: public
    args:
      - name: comments
        type: DocComment[]
        required: true
        passing: positional
        description: ストアの一覧
      - name: docId
        type: string
        required: true
        passing: positional
        description: 文書
    returns:
      type: '{id: string; quote: string; prefix: string; suffix: string; body: string}[]'
      description: 追加した順
    process: 1. `docId` が一致するコメントを mdmark の形式にして返却する
    unit_tests:
      - name: test_comments_of
        case: 正常
        summary: 文書で絞る
        condition: 2 つの文書のコメントが 3 件
        mock: なし
        expected: 指定した `docId` の分だけ、追加した順
  - name: docIdOf
    title: 文書の ID
    container: features/docs/shared/comments/comment-store.ts
    usecase: コメントを溜める
    role: 変換
    summary: コメントと mdmark の `docId` に使用する、文書を指す文字列
    kind: 関数
    scope: public
    args:
      - name: doc
        type: '{source: string; ref?: string | null; path: string}'
        required: true
        passing: positional
        description: 配信元・リビジョン・文書のパス
    returns:
      type: string
      description: '`{source}@{ref}:{path}`（`ref` が無ければ空）'
    process: 1. `DocBody` と `useLocating` が同じ文字列で文書を比べるため、`{source}@{ref ?? ""}:{path}` を返却する
stores:
  - name: useCommentStore
    title: コメントのストア
    container: features/docs/shared/comments/comment-store.ts
    usecase: コメントを溜める
    role: ストア
    summary: Zustand の `persist`（`sessionStorage`、キー `dev-docs:v1:doc-view:comments`、`version` 1。旧キー `dev-docs:comments` は `legacyKeyStorage` で移し替える）で保存するコメントの一覧
    state:
      - name: comments
        type: DocComment[]
        initial: '[]'
        description: 追加した順
    actions:
      - name: add
        title: コメントの追加
        kind: 関数
        summary: コメントを末尾に加え、追加したコメントを返却する（mdmark の `commentStore.save`）
        scope: public
        args:
          - name: input
            type: Omit<DocComment, "id" | "selected" | "createdAt">
            required: true
            passing: positional
            description: 中身
        returns:
          type: DocComment
          description: 追加したコメント
        process: '1. `id`・`selected: true`・`createdAt` を付けて末尾に加える'
      - name: update
        title: コメントの修正
        kind: 関数
        summary: コメントの本文を書き換える
        scope: public
        args:
          - name: id
            type: string
            required: true
            passing: positional
            description: コメント
          - name: body
            type: string
            required: true
            passing: positional
            description: 新しい本文
        returns:
          type: void
          description: 何も返却しない
        process: 1. `id` のコメントの `body` を書き換える
      - name: remove
        title: コメントの削除
        kind: 関数
        summary: コメントを削除し、削除したコメントと一覧の中の位置を返却する（通知の `元に戻す` で `restore` に指定する）
        scope: public
        args:
          - name: id
            type: string
            required: true
            passing: positional
            description: コメント
        returns:
          type: '{comment: DocComment; index: number} | null'
          description: 削除したコメントと削除する前の位置。`id` が無ければ `null`
        process: |-
          1. `id` のコメントと位置を探し、無ければ `null` を返却する
          2. そのコメントを除き、コメントと位置を返却する
        unit_tests:
          - name: test_remove
            case: 正常
            summary: 削除したコメントと位置を返却する
            condition: 3 件のうち 2 件目を削除する
            mock: なし
            expected: 一覧が 2 件で、戻り値が 2 件目のコメントと `index` 1
          - name: test_remove_when_missing
            case: 異常
            summary: 無いコメント
            condition: 一覧に無い `id` を削除する
            mock: なし
            expected: 一覧が変わらず、戻り値が `null`
      - name: setSelected
        title: 選択の切り替え
        kind: 関数
        summary: 1 件か全て（`id` が null）の選択を切り替える
        scope: public
        args:
          - name: id
            type: string | null
            required: true
            passing: positional
            description: コメント（null は全て）
          - name: selected
            type: boolean
            required: true
            passing: positional
            description: 選ぶか
        returns:
          type: void
          description: 何も返却しない
        process: 1. 対象の `selected` を書き換える
      - name: restore
        title: 削除の取り消し
        kind: 関数
        summary: 削除したコメントを削除する前の位置に戻す（通知の `元に戻す`）
        scope: public
        args:
          - name: comment
            type: DocComment
            required: true
            passing: positional
            description: '`remove` が返却したコメント'
          - name: index
            type: number
            required: true
            passing: positional
            description: '`remove` が返却した位置'
        returns:
          type: void
          description: 何も返却しない
        process: |-
          1. 同じ `id` のコメントがあれば何もしない
          2. `index` を一覧の長さに収めた位置にコメントを差し込む
        unit_tests:
          - name: test_restore
            case: 正常
            summary: 削除した位置に戻す
            condition: 3 件の 2 件目を `remove` し、戻り値で `restore` する
            mock: なし
            expected: 一覧が削除する前と同じ並び
          - name: test_restore_when_exists
            case: 正常
            summary: 二重に戻さない
            condition: 同じコメントを 2 回 `restore` する
            mock: なし
            expected: 一覧に 1 件だけある
tags:
  - name: topic:文書
    main: true
  - name: topic:画面
  - name: topic:コメント
  - name: topic:タブ
  - name: topic:ストア
