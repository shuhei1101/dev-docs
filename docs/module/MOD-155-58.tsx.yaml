id: MOD-155-58
title: 画面 / 共通 / shortcut-dialog.tsx
lead: '`?` で開くショートカットの一覧を受け持ち、共通の shortcut-dialog.tsx を修正するときに参照する。'
test_files:
  - tests/unit/frontend/src/shared/components/shortcut-dialog/shortcut-dialog.test.tsx
components:
  - name: ShortcutDialog
    title: ショートカットの一覧
    kind: コンポーネント
    container: shared/components/shortcut-dialog/shortcut-dialog.tsx
    usecase: 共通
    role: 部品
    summary: 画面で使用できるキーを `shortcutsFor` から並べるダイアログ（shadcn/ui の `Dialog`、`Kbd`）
    props:
      - name: open
        type: boolean
        required: true
        description: 開いているか
      - name: onOpenChange
        type: '(open: boolean) => void'
        required: true
        description: 開閉
      - name: screen
        type: ScreenId
        required: true
        description: 画面
      - name: singleKey
        type: boolean
        required: true
        description: 1 文字のショートカットを受けるか
    unit_tests:
      - name: test_shortcut_dialog
        case: 正常
        summary: 画面のキーを並べる
        condition: '`screen` が `doc-view`、`singleKey` が `false`'
        mock: なし
        expected: 検索の行に Ctrl+K だけがあり `/` と `?` の行が無い
refs:
  - to: CMP-155-1
    type: requires
    when: ショートカットの一覧の描き方を変えるときに、ショートカットの一覧の引数と状態と突き合わせる。
notes:
  補足: 引数・状態は部品設計『ショートカットの一覧』が持つ。
tags:
  - name: topic:ユーティリティ
    main: true
  - name: topic:ショートカット
