id: MOD-155-158
title: 開発ドキュメントサーバー / 画面のAPI / columns.py
lead: 表の列の設定の読み書きを受け持ち、画面のAPIの columns.py を修正するときに参照する。
test_files:
  - tests/unit/dev_docs/features/view/test_columns.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        画面のエントリーポイント ..> 表の列の設定
        文書の取得 ..> 表の列の設定
        class 画面のエントリーポイント {
          <<function>>
        }
        class 文書の取得 {
          <<function>>
        }
        class 表の列の設定 {
          <<class>>
        }
        click 画面のエントリーポイント href "./MOD-155-162.py.yaml#画面のエントリーポイント"
        click 文書の取得 href "./MOD-155-159.py.yaml#文書の取得"
classes:
  - name: ColumnSettings
    title: 表の列の設定
    container: features/view/columns.py
    usecase: 表の列の設定の保存
    role: リポジトリ
    summary: 配信元・表ごとの隠す列を `state_dir` の JSON に読み書きする
    properties:
      - name: dir
        title: フォルダ
        type: Path
        access: 公開
        description: '`{state_dir}/{COLUMNS_DIR}`'
      - name: _lock
        title: 書き込みの排他
        type: threading.Lock
        access: 内部 (_)
        description: 参照して書き戻す間を 1 つずつにする
    methods:
      - name: get
        title: 列の設定を読む
        kind: メソッド
        summary: 配信元の表のキー → 隠す列を返却する
        scope: public
        thread_safe: true
        args:
          - name: source_id
            title: 配信元の ID
            type: str
            required: true
            passing: positional
            description: 配信元
        returns:
          type: dict[str, list[str]]
          description: ファイルが無い・読み込めないときは空（参照できないときは `[warning]` 列の設定を読み込めない（パス・理由）を記載する）
        process: 1. `{dir}/{source_id}.json` を参照して返却する
      - name: save
        title: 列の設定を書き込む
        kind: メソッド
        summary: 1 つの表の隠す列を記載し、他の表の設定は残す
        scope: public
        thread_safe: true
        side_effects: '`{dir}/{source_id}.json` を書き換える'
        args:
          - name: source_id
            title: 配信元の ID
            type: str
            required: true
            passing: positional
            description: 配信元
          - name: table
            title: 表のキー
            type: str
            required: true
            passing: positional
            description: 記載する表
          - name: hidden
            title: 隠す列
            type: list[str]
            required: true
            passing: positional
            description: 空なら表のキーを削除する
        returns:
          type: None
          description: '-'
        process: |-
          1. ロックを握り、今の設定を読み込む
          2. `hidden` が空なら表のキーを削除し、そうでなければ重複を除いて配置する
          3. フォルダを作り、ファイルの置き換え（共通）で書き込む
        unit_tests:
          - name: test_save
            case: 正常
            summary: 他の表を残す
            condition: '`a:x` を記載した後に `a:y` を記載し、`a:x` を空で記載する'
            mock: なし（一時フォルダ）
            expected: '`get` が `{"a:y": [...]}`'
constants:
  - name: COLUMNS_DIR
    title: 表の列の設定のフォルダ
    container: features/view/columns.py
    usecase: 表の列の設定の保存
    summary: '`state_dir` の下の、配信元ごとの列の設定（`{source}.json`）を配置するフォルダ'
    value: '"columns"'
tags:
  - name: topic:api
    main: true
  - name: topic:画面
  - name: topic:表
  - name: topic:列
