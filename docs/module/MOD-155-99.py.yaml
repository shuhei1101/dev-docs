id: MOD-155-99
title: 開発ドキュメントサーバー / 変換 / service.py
lead: 変換の選択と、表のキーの取り出し。
test_files:
  - tests/unit/dev_docs/features/convert/test_service.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        文書の取得 ..> 変換
        変換 ..> スキーマ駆動の変換 : converter が無い
        変換 ..> 埋め込みの展開
        変換 ..> 変換の結果 : 返す
        class 文書の取得 {
          <<function>>
        }
        class 変換 {
          +描画する(配信元, 文書の詳細, 文書) str
          +仕上げる(Markdown, 種類, 埋め込む値) 変換の結果
        }
        class スキーマ駆動の変換 {
          <<function>>
        }
        class 埋め込みの展開 {
          <<function>>
        }
        class 変換の結果 {
          +Markdown: str
        }
        click 文書の取得 href "./MOD-155-159.py.yaml#文書の取得"
        click スキーマ駆動の変換 href "./MOD-155-97.py.yaml#スキーマ駆動の変換"
        click 埋め込みの展開 href "./MOD-155-94.py.yaml#埋め込みの展開"
        click 変換の結果 href "./MOD-155-100.py.yaml#変換の結果"
classes:
  - name: ConvertService
    title: 変換
    container: features/convert/service.py
    usecase: 文書の取得
    role: サービス
    summary: 文書の行の設定で変換を選んで Markdown を描き、埋め込みを展開して表のキーを取り出す
    description: '`converters[]` のスクリプトは project-index が実行して結果を返すため、dev-docs はスクリプトを動かさず、変換の結果も控えない（状態を持たない）。'
    kind: クラス
    methods:
      - name: render
        title: 描画する
        kind: メソッド
        summary: 1 件の文書を、埋め込みのマーカーを残した Markdown にする
        scope: public
        thread_safe: true
        args:
          - name: view
            title: 配信元の表示の設定
            type: SourceView
            required: true
            passing: positional
            description: 文書の行・GitHub のリポジトリ
          - name: detail
            title: 文書の詳細
            type: DocumentDetail
            required: true
            passing: positional
            description: project-index が返した文書の詳細
          - name: documents
            title: 文書
            type: Sequence[IndexedDocument]
            required: true
            passing: positional
            description: 同じリビジョンの全ての文書（本文の id のリンクと見出しの引き当てに使う）
          - name: linkable
            title: リンクにできる検討事項
            type: Collection[str]
            required: true
            passing: keyword
            description: 検討事項の一覧の `linkable`
        returns:
          type: str | ConvertFailure
          description: Markdown か変換の失敗
        process: |-
          1. `detail.failure` があれば、同じフィールドの `ConvertFailure` を返す
          2. `detail.markdown` があれば（`converters[]` を指す行の文書）、それを返す
          3. 文書の行（`view.row(document.kind)`）を引き、Markdownの本文かが `True` なら `document.body` を返す
          4. それ以外は、スキーマ駆動の変換（スキーマは行の `schema`）の結果を返す。描画の文脈は、`links` を `documents` の文書ごとに ID・`path`・`body_path` から `DocumentLink`（タイトルはメタデータの `name`、パスは `path`）を引く辞書、`issue_url` を `view.github_repository` から作った URL（無ければ `None`）、`path` を文書の `path`、`item_heading` を「ID の文書を `documents` から引き、その値と行の `schema` で項目の見出しを返す関数（ID の文書が無ければ `None`）」、`decisions` を `linkable` にする
        unit_tests:
          - name: test_convert_service_render
            case: 正常
            summary: スキーマ駆動
            condition: '`converter` の無い YAML の行の文書'
            mock: なし
            expected: '`# {name}` で始まる Markdown'
          - name: test_convert_service_render_when_converter
            case: 正常
            summary: project-index の変換の結果を使う
            condition: '`markdown` が `# 変換した` の文書の詳細'
            mock: なし
            expected: '`# 変換した` で、スキーマ駆動の変換を呼ばない'
          - name: test_convert_service_render_when_failure
            case: 正常
            summary: project-index の変換の失敗
            condition: '`failure` が `reason: timeout`・`script: python conv.py` の文書の詳細'
            mock: なし
            expected: '`ConvertFailure` で `reason` が `timeout`、`script` が `python conv.py`'
          - name: test_convert_service_render_when_markdown
            case: 正常
            summary: Markdown の本文
            condition: '`records: files`・`body_file: path` の行の、`body_path` が `.md` の文書と `.py` の文書'
            mock: なし
            expected: '`.md` の文書は本文と同じ。`.py` の文書はスキーマ駆動の変換（`# {name}` で始まる）'
          - name: test_convert_service_render_when_records
            case: 正常
            summary: records の行の要素を 1 行のスキーマで変換する
            condition: '行 `notes`（`records: files`、`schema` が 1 要素のスキーマ）の要素 `{path: a.md, summary: 説明}` の文書'
            mock: なし
            expected: Markdown に `path`・`summary` の値が出る
          - name: test_convert_service_render_when_id_link
            case: 正常
            summary: 本文の id のリンクを他の文書の見出しへ解決する
            condition: '本文に `[B](id:b#flow)` を持つ文書 a と、スキーマで `flow` が `x-heading: 処理の流れ` の文書 b'
            mock: なし
            expected: 文書 a の Markdown に、文書 b の相対パスに `#処理の流れ` を付けたリンクがある
      - name: finish
        title: 仕上げる
        kind: メソッド
        summary: 埋め込みを展開し、表のキーを取り出した変換の結果にする
        scope: public
        thread_safe: true
        args:
          - name: markdown
            title: Markdown
            type: str
            required: true
            passing: positional
            description: 描画するの結果
          - name: kind
            title: 種類
            type: str
            required: true
            passing: positional
            description: 文書の行の ID
          - name: embedded
            title: 埋め込む値
            type: Mapping[str, Any | None]
            required: true
            passing: positional
            description: 埋め込みのパスの取り出しのパス → 文書の値（取れなかったパスは `None`）
        returns:
          type: Converted
          description: Markdown と表のキー
        process: |-
          1. 埋め込みの展開（`embedded`）をする
          2. コードブロックの外の表を出る順にたどり、直前に `TABLE_KEY_PATTERN` の行があればそのキー、無ければ `{種類}:table[{n}]`（`n` は本文の中の 0 始まりの順）を表のキーにする。マーカーの行を取り除いた Markdown と表のキーを返す
        unit_tests:
          - name: test_convert_service_finish
            case: 正常
            summary: 表のキーを取り出す
            condition: '`<!-- dev-docs-table: sample:items -->` の後の表と、マーカーの無い表を持つ Markdown'
            mock: なし
            expected: '`dev-docs-table` の行が無く、`table_keys` が `[sample:items, sample:table[1]]`'
          - name: test_convert_service_finish_when_embed
            case: 正常
            summary: 埋め込んだ表のキー
            condition: '`<!-- embed: data/list.yaml#items -->` と、`embedded` の `data/list.yaml` の `items` が 2 行'
            mock: なし
            expected: 2 行の表があり、`table_keys` に `embed:data/list.yaml#items`
constants:
  - name: TABLE_KEY_PATTERN
    title: 表のキーのマーカー
    container: features/convert/service.py
    usecase: 文書の取得
    summary: 表の組み立てが表の前に置き、変換の最後に取り除く行に当てる正規表現
    value: '`r"^<!-- dev-docs-table: (?P<key>.+) -->$"`'
refs:
  - IF-155-10#
