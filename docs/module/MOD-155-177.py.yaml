test_files:
  - tests/unit/dev_docs/server/test_lifespan.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        アプリの組み立て ..> アプリの寿命
        class アプリの組み立て {
          <<function>>
        }
        class アプリの寿命 {
          <<function>>
        }
        click アプリの組み立て href "./MOD-155-175.py.yaml#アプリの組み立て"
functions:
  - name: build_lifespan
    title: アプリの寿命
    kind: 関数
    container: server/lifespan.py
    usecase: 起動
    role: 寿命
    summary: マウントした MCP のセッションの管理を親のアプリの寿命で動かし、止まるときに project-indexの呼び出しを閉じる
    scope: public
    args:
      - name: mcps
        title: MCP
        type: Sequence[MCPServer]
        required: true
        passing: positional
        description: 管理の MCP
      - name: project_index
        title: project-indexの呼び出し
        type: ProjectIndexClient
        required: true
        passing: keyword
        description: 止まるときに閉じる
    returns:
      type: Callable[[FastAPI], AbstractAsyncContextManager[None]]
      description: FastAPI の `lifespan` に渡す関数
    process: |-
      1. 返す関数は、`contextlib.AsyncExitStack` に各 MCP の `session_manager.run()` を入れる（マウントした子のアプリの寿命は動かないため）。`project_index.aclose` をスタックの後始末に入れる
      2. `yield` し、止まるときにスタックを閉じる
    unit_tests:
      - name: test_build_lifespan
        case: 正常
        summary: MCP のセッションの管理を動かし、止まるときに閉じる
        condition: 管理の MCP を渡して寿命に入り、出る
        mock: MCP（`session_manager.run()` が入った・出たを記録する偽物）・project-indexの呼び出し（`aclose` を数える偽物）
        expected: 入ると run が入り、出ると run が出て `aclose` が 1 回呼ばれる
