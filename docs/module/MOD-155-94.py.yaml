id: MOD-155-94
title: 開発ドキュメントサーバー / 変換 / embed.py
lead: 埋め込みのマーカーのパスの取り出しと、表への展開。
test_files:
  - tests/unit/dev_docs/features/convert/test_embed.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        変換 ..> 埋め込みの展開
        埋め込みの展開 ..> 表の組み立て
        class 変換 {
          +描画する(配信元, 文書の詳細, 文書) str
          +仕上げる(Markdown, 種類, 埋め込む値) 変換の結果
        }
        class 表の組み立て {
          <<function>>
        }
        class 埋め込みの展開 {
          <<function>>
        }
        click 変換 href "./MOD-155-99.py.yaml#変換"
        click 表の組み立て href "./MOD-155-97.py.yaml#表の組み立て"
constants:
  - name: EMBED_PATTERN
    title: 埋め込みのマーカー
    container: features/convert/embed.py
    usecase: 文書の取得
    summary: '埋め込みのマーカーに当てる正規表現（mdmark の `<!-- 名前: 引数 -->` の書式で、名前は mdmark の予約名と重ならない `embed`）'
    value: '`r"<!--\s*embed:\s*(?P<path>[^#\s]+)(?:#(?P<item>\S+))?\s*-->"`'
functions:
  - name: embed_paths
    title: 埋め込みのパスの取り出し
    kind: 関数
    container: features/convert/embed.py
    usecase: 文書の取得
    role: 変換
    summary: Markdown のコードブロックの外にある埋め込みのマーカーのパスを返す
    scope: public
    thread_safe: true
    args:
      - name: markdown
        title: Markdown
        type: str
        required: true
        passing: positional
        description: 描画した Markdown
    returns:
      type: list[str]
      description: 出る順の重ならないパス。`..` を含むパスと絶対パスは除く（配信元の外を指すため）
    process: 1. 埋め込みの展開と同じ行をたどり、`path` を出る順に重ねずに集める。`..` の要素を持つか `/` で始まるパスは除く
    unit_tests:
      - name: test_embed_paths
        case: 正常
        summary: 重ねず、配信元の外とコードブロックを除く
        condition: '`data/a.yaml#x`・`data/a.yaml#y`・`../x.yaml`・```text の中の `data/b.yaml`'
        mock: なし
        expected: '`["data/a.yaml"]`'
  - name: expand_embeds
    title: 埋め込みの展開
    kind: 関数
    container: features/convert/embed.py
    usecase: 文書の取得
    role: 変換
    summary: Markdown の中の埋め込みのマーカーを、指した YAML の値の表に置き換える
    scope: public
    thread_safe: true
    args:
      - name: markdown
        title: Markdown
        type: str
        required: true
        passing: positional
        description: 変換した Markdown
      - name: embedded
        title: 埋め込む値
        type: Mapping[str, Any | None]
        required: true
        passing: positional
        description: マーカーのパス → project-index が返した文書の値。取れなかったパスは `None`
    returns:
      type: str
      description: マーカーを置き換えた Markdown
    process: |-
      1. コードブロックの外の `EMBED_PATTERN` に当たる行ごとに置き換える
      2. `embedded` の `path` の値が `None` か無い場合は、`> [!WARNING]` の囲みに `埋め込めません: {path}` を置く
      3. `item` があれば項目の取得で値を取り出す（無ければ同じ囲みで `{path}#{item} がありません`）
      4. 値がオブジェクトのリストなら表の組み立て（表のキーは `embed:{path}#{item}`）、オブジェクトならキーと値の 2 列の表、スカラーならその値を置く
      5. 埋め込んだ値の中のマーカーは展開しない
    unit_tests:
      - name: test_expand_embeds
        case: 正常
        summary: 表に置き換える
        condition: '`<!-- embed: data/list.yaml#items -->` と、`embedded` の `data/list.yaml` が `items` 2 行の値'
        mock: なし
        expected: 2 行の表があり、マーカーの文字列が無い
      - name: test_expand_embeds_when_in_code_block
        case: 正常
        summary: コードブロックの中は置き換えない
        condition: '```text の中のマーカー'
        mock: なし
        expected: そのまま残る
      - name: test_expand_embeds_when_missing
        case: 正常
        summary: 取れなかったパス
        condition: '`<!-- embed: none.yaml -->` と、`embedded` の `none.yaml` が `None`'
        mock: なし
        expected: '`埋め込めません: none.yaml` の囲み'
