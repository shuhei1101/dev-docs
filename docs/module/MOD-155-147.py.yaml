id: MOD-155-147
title: 開発ドキュメントサーバー / 端末の設定 / route.py
lead: 端末の設定のルーター（`GET`・`PUT /_api/settings/sources`）。
test_files:
  - tests/unit/dev_docs/features/settings/test_route.py
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction TD
        端末の設定の入口 ..> 配信元の保存 : PUT
        端末の設定の入口 ..> 同じオリジンの確認 : PUT の前
        class 端末の設定の入口 {
          <<function>>
        }
        class 配信元の保存 {
