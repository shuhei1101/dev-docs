id: MOD-155-180
title: 開発ドキュメントサーバー / 管理のMCP / result.py
lead: ツールの結果・エラーの変換と、管理の MCP のツール名とプロンプトの ID。
test_files:
  - tests/unit/dev_docs/server/mcp/test_result.py
diagrams:
  - name: 管理の MCP
    diagram: |-
      classDiagram
        direction TD
        管理の MCP の組み立て ..> ツールの結果
        管理の MCP の組み立て ..> ツールのエラーの変換
        class 管理の MCP の組み立て {
          <<function>>
        }
        class ツールの結果 {
          <<function>>
        }
        class ツールのエラーの変換 {
          <<function>>
        }
        click 管理の MCP の組み立て href "./MOD-155-178.py.yaml#管理の MCP の組み立て"
constants:
  - name: TOOL_ANNOTATIONS
    title: ツールの注釈
    container: server/mcp/result.py
    usecase: 共通
    summary: ツールごとの `ToolAnnotations`
    entries:
      - key: status
        value: '`readOnlyHint=True`'
        description: インターフェース定義『状態の取得』
      - key: restart
        value: '`readOnlyHint=False`・`destructiveHint=True`'
        description: インターフェース定義『再起動』
      - key: update
        value: '`readOnlyHint=False`・`destructiveHint=True`'
        description: インターフェース定義『更新』
  - name: ADMIN_TOOL_NAMES
    title: 管理の MCP のツール名
    container: server/mcp/result.py
    usecase: 共通
    summary: 管理の MCP が登録するツールの名前（登録の順）
    value: ("status", "restart", "update")
functions:
  - name: to_tool_result
    title: ツールの結果
    kind: 関数
    container: server/mcp/result.py
    usecase: 共通
    role: 変換
    summary: サービスの結果を `format` に合わせて MCP の `CallToolResult` にする
    scope: public
    thread_safe: true
    args:
      - name: result
        title: 結果
        type: Any
        required: true
        passing: positional
        description: サービスの結果（dataclass）
      - name: fmt
        title: 形式
        type: Literal['markdown', 'json']
        required: true
        passing: positional
        description: 要求の `format`
      - name: render
        title: Markdown の組み立て
        type: Callable[[Any], str] | None
        required: true
        passing: positional
        description: '`render_*_markdown`。`None` は常に JSON（書き込み・削除）'
    returns:
      type: mcp.types.CallToolResult
      description: ツールの結果
    process: |-
      1. `fmt` が `markdown` で `render` がある場合、`content` に `render(result)` の text を 1 つ入れ、`structuredContent` を持たない結果を返す
      2. それ以外は、結果を JSON にできる辞書にし（`dataclasses.asdict`、`None` のキーは落とす）、`structuredContent` にその辞書を、`content` に同じ JSON の text を入れる
    unit_tests:
      - name: test_to_tool_result
        case: 正常
        summary: markdown
        condition: '`fmt="markdown"`、`render` が `"# x"` を返す'
        mock: なし
        expected: '`content[0].text` が `"# x"`、`structuredContent` が無い'
      - name: test_to_tool_result_when_json
        case: 正常
        summary: json
        condition: '`fmt="json"`'
        mock: なし
        expected: '`structuredContent` と `json.loads(content[0].text)` が同じ'
  - name: tool_error
    title: ツールのエラーの変換
    kind: 関数
    container: server/mcp/result.py
    usecase: 共通
    role: 変換
    summary: '`DevDocsError` と要求のモデルの検証の誤りを `isError: true` の結果にする'
    scope: public
    thread_safe: true
    args:
      - name: error
        title: エラー
        type: DevDocsError | pydantic.ValidationError
        required: true
        passing: positional
        description: サービスか要求のモデルが送った例外
    returns:
      type: mcp.types.CallToolResult
      description: '`isError: true` の結果'
    process: |-
      1. `DevDocsError` の場合、text の 1 行目を `{name}: {message}`、次に `details()` を YAML で、最後に `next_steps` を `- ` の行で並べる
      2. `pydantic.ValidationError` の場合、`InvalidArgumentError` として、誤りごとに `{loc を . で繋いだパス}: {msg}` の行を並べる
      3. どちらも `isError=True` で返す（`ToolError` は送らない。内容を text に残すため）
    unit_tests:
      - name: test_tool_error
        case: 正常
        summary: DevDocsError
        condition: '`ProjectIndexUnreachableError(address="http://127.0.0.1:8786", reason="接続を拒否されました（Connection refused）")`'
        mock: なし
        expected: '`isError` が `True`、text の 1 行目が `ProjectIndexUnreachableError: project-index（http://127.0.0.1:8786）に接続できませんでした。…`、`address` と `reason` を含む'
      - name: test_tool_error_when_validation
        case: 正常
        summary: 引数の誤り
        condition: '`FormatRequest(format="x")` の検証の誤り'
        mock: なし
        expected: text に `format:` の行
  - name: tool_prompt_id
    title: ツールのプロンプトの ID
    kind: 関数
    container: server/mcp/result.py
    usecase: 共通
    role: 変換
    summary: ツールの description を描画するプロンプトの ID を作る
    scope: public
    is_async: false
    thread_safe: true
    args:
      - name: server
        title: MCP
        type: str
        required: true
        passing: positional
        description: 管理の MCP の `admin`
      - name: tool
        title: ツール名
        type: str
        required: true
        passing: positional
        description: '`ADMIN_TOOL_NAMES` の名前'
    returns:
      type: str
      description: '`mcp/{server}/tools/{ツール名の _ を - にした名前}`'
    process: 1. ツール名の `_` を `-` にして `mcp/{server}/tools/` に続ける（プロンプトの `id` は小文字とハイフンだけを許す）
    unit_tests:
      - name: test_tool_prompt_id
        case: 正常
        summary: ツール名をハイフンにする
        condition: '`tool_prompt_id("admin", "status")`'
        mock: なし
        expected: '`mcp/admin/tools/status`'
  - name: mcp_prompt_ids
    title: MCP のプロンプトの ID
    kind: 関数
    container: server/mcp/result.py
    usecase: 共通
    role: 変換
    summary: 管理の MCP が描画するプロンプトの ID を並べる（起動の `required` に渡す）
    scope: public
    is_async: false
    thread_safe: true
    returns:
      type: list[str]
      description: '`ADMIN_TOOL_NAMES` のツールごとの `tool_prompt_id`'
    process: 1. `ADMIN_TOOL_NAMES` の `tool_prompt_id("admin", …)` を並べる
    unit_tests:
      - name: test_mcp_prompt_ids
        case: 正常
        summary: 3 つのツール
        condition: 引数なし
        mock: なし
        expected: '`[mcp/admin/tools/status, mcp/admin/tools/restart, mcp/admin/tools/update]`'
