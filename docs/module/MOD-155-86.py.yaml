id: MOD-155-86
title: 開発ドキュメントサーバー / 管理 / service.py
lead: 管理の MCP の `status` の中身。端末の設定を読み、配信元の状態は project-index から取る。
test_files:
  - tests/unit/dev_docs/features/admin/test_service.py
functions:
  - name: get_status
    title: 状態の取得
    kind: 関数
    container: features/admin/service.py
    usecase: 状態の取得
    role: サービス
    summary: 待ち受けのアドレス・バージョン・project-index への接続と、project-index が返した配信元ごとの状態を返す
    scope: public
    is_async: true
    thread_safe: true
    args:
      - name: handlers
        title: 部品
        type: Handlers
        required: true
        passing: positional
        description: 起動時に作った部品
      - name: env
        title: 環境変数
        type: Mapping[str, str]
        required: true
        passing: keyword
        description: '`DEV_DOCS_PORT` を引く環境変数（入口は `os.environ`）'
    returns:
      type: ServerStatus
      description: サーバーの状態
    process: |-
      1. アドレスを `http://{terminal.bind}:{ポート}/` にする（待ち受けのポートの決定）
      2. バージョンを 起動時に読んだ値（動いているバージョン。更新で配布のメタデータが入れ替わっても変わらない）、プロセス ID を `os.getpid()` で得る
      3. 端末の設定の `version` を `SETTINGS_VERSION` と比べる（バージョンの新旧）
      4. project-indexの呼び出し.配信元の状態の一覧 を呼ぶ
         - 応答したら `project_index.reachable` を `True`、`sources` を状態ごとの `SourceState`（`errors` は `{path}: {rule}`）にする
         - `ProjectIndexUnreachableError` なら `reachable` を `False`、`error` を `reason`、`sources` を空にする。`ProjectIndexResponseError` も同じく `error` を要約にする（例外を送らずに返す）
      5. `leftover_sources` を端末の設定の `leftover_sources` にする
    exceptions:
      - name: TerminalConfigInvalidError
        condition: '`DEV_DOCS_PORT` がポートの範囲の外'
        message: 待ち受けのポートの決定のメッセージ
    unit_tests:
      - name: test_get_status
        case: 正常
        summary: project-index が返した配信元を並べる
        condition: project-index が `serving`・`not_served`（`errors[]` 1 件）・`disabled` の 3 つを返す、`env` は空
        mock: project-indexの呼び出し（状態を返すか例外を送る偽物）
        expected: '`address` が `http://127.0.0.1:{port}/`、`project_index.reachable` が `True`、`sources` が 3 件で `not_served` の `errors` が `{path}: {rule}` の 1 件'
      - name: test_get_status_when_port_env
        case: 正常
        summary: '`DEV_DOCS_PORT` のポートをアドレスに使う'
        condition: '`env` が `{"DEV_DOCS_PORT": "8799"}`'
        mock: project-indexの呼び出し（状態を返すか例外を送る偽物）
        expected: '`address` が `http://127.0.0.1:8799/`'
      - name: test_get_status_when_unreachable
        case: 正常
        summary: project-index につながらなくても返す
        condition: 偽物が `ProjectIndexUnreachableError(reason="接続を拒否されました（Connection refused）")` を送る
        mock: project-indexの呼び出し（状態を返すか例外を送る偽物）
        expected: 例外を送らず、`project_index.reachable` が `False`、`error` が理由、`sources` が空
      - name: test_get_status_when_leftover_sources
        case: 正常
        summary: 残った配信元
        condition: 端末の設定の `leftover_sources` が `[sample]`
        mock: project-indexの呼び出し（状態を返すか例外を送る偽物）
        expected: '`leftover_sources` が `[sample]`'
    callers:
      - MOD-155-178#functions[build_admin_mcp]
    callees:
      - '#functions[version_state]'
      - MOD-155-215#classes[ProjectIndexClient]
  - name: version_state
    title: バージョンの新旧
    kind: 関数
    container: features/admin/service.py
    usecase: 共通
    role: 変換
    summary: 設定のバージョンを dev-docs が読めるバージョンと比べる
    scope: public
    is_async: false
    thread_safe: true
    args:
      - name: mine
        title: 設定のバージョン
        type: str
        required: true
        passing: positional
        description: 設定の `version`
      - name: current
        title: 読めるバージョン
        type: str
        required: true
        passing: positional
        description: '`SETTINGS_VERSION`'
    returns:
      type: VersionState
      description: 同じなら `current`、小さいなら `old`、大きいなら `newer`
    process: 1. 両方を整数にして比べる
    exceptions:
      - name: ValueError
        condition: どちらかが整数にできない
        message: 標準のメッセージ
    unit_tests:
      - name: test_version_state
        case: 正常
        summary: 同じ・古い・新しいを分ける
        condition: '`("1", "1")`・`("1", "2")`・`("3", "2")`'
        mock: なし
        expected: '`current`・`old`・`newer`'
      - name: test_version_state_when_not_integer
        case: 異常
        summary: 整数でない
        condition: '`("a", "1")`'
        mock: なし
        expected: '`ValueError`'
        exception: 整数にできない
    callers:
      - '#functions[get_status]'
