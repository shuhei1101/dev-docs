constants:
  - name: MAX_HEADING_LEVEL
    title: 見出しの深さの上限
    container: features/convert/markdown.py
    usecase: 文書の取得
    summary: これより深い見出しは `######` で止める
    value: '6'
  - name: HEADING_KEYS
    title: 見出しにするキー
    container: features/convert/markdown.py
    usecase: 文書の取得
    summary: 先頭の `#` の見出しにするキー。最初に値を持つキーを使う
    value: '`title`・`name`'
  - name: LEAD_KEYS
    title: リードにするキー
    container: features/convert/markdown.py
    usecase: 文書の取得
    summary: 見出しの下の段落にするキー。最初に値を持つキーを使う
    value: '`lead`・`description`'
  - name: ATTRIBUTE_MIN
    title: 属性の表にする数
    container: features/convert/markdown.py
    usecase: 文書の取得
    summary: オブジェクトの子に、見出しも `x-shape` も持たないスカラーがこの数以上続けば「項目 / 値」の表にする
    value: '3'
  - name: LONG_VALUE_CHARS
    title: 長い値の文字数
    container: features/convert/markdown.py
    usecase: 文書の取得
    summary: 「項目 / 値」の表で、これを超える値と改行を含む値は行の詳細（`<!-- row-detail -->`）に入れる
    value: '100'
  - name: WIDE_KEYS
    title: 幅を広く取る列のキー
    container: features/convert/markdown.py
    usecase: 文書の取得
    summary: 表の `wide=` に記載する説明の列のキー
    value: '`description`・`summary`・`notes`'
  - name: LABEL_KEYS
    title: 図の元データの先頭の列のキー
    container: features/convert/markdown.py
    usecase: 文書の取得
    summary: 図の元データの表で先頭へ移す、読み手向けの列のキー。最初に表にあるキーを使う
    value: '`label`・`name`'
  - name: DIAGRAM_HIDDEN_KEYS
    title: 図の元データで隠す列のキー
    container: features/convert/markdown.py
    usecase: 文書の取得
    summary: 図の元データの表の `+columns hide=` に記載する列のキー（先頭の列にしたものは除く）
    value: '`id`'
  - name: TEST_FILE_KEYS
    title: 対応テストファイルのキー
    container: features/convert/markdown.py
    usecase: 文書の取得
    summary: 値を閉じた表のリンクにするキー
    value: '`test_file`・`test_files`'
  - name: EXAMPLE_SUFFIX
    title: 例のキーの末尾
    container: features/convert/markdown.py
    usecase: 文書の取得
    summary: 同じオブジェクトの中で続くこの末尾のキーの値を、1 つのタブの部品にまとめる
    value: '`_example`'
  - name: CHECK_MARK
    title: 真の値の印
    container: features/convert/markdown.py
    usecase: 文書の取得
    summary: 真偽の値の `True` に出す文字。`False` は空にする
    value: ✓
functions:
  - name: schema_to_markdown
    title: スキーマ駆動の変換
    kind: 関数
    container: features/convert/markdown.py
    usecase: 文書の取得
    role: 変換
    summary: YAML の文書を、スキーマの `x-heading`・`x-shape`・`x-key`・`x-diagram`・`x-hidden`・`title` に沿って、mdmark の記法の Markdown にする
    description: 表示の順はスキーマの `properties` の順、見出しと表の列名はスキーマの `title`。スキーマに無いキーは末尾に `title` 無しのキーの名前で出す。
    scope: public
    thread_safe: true
    args:
      - name: document
        title: 文書
        type: IndexedDocument
        required: true
        passing: positional
        description: YAML の文書（`records` の行は要素）
      - name: schema
        title: スキーマ
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 種類のスキーマ（`$ref` は project-index が解いた後のもの）。空なら全ての値を `x-shape` 無しとして組み立てる
      - name: context
        title: 描画の文脈
        type: RenderContext
        required: true
        passing: positional
        description: 参照のリンクの引き先と Issue の URL
    returns:
      type: str
      description: Markdown
    process: |-
      1. 先頭に `# {見出し}`（`HEADING_KEYS` のうち最初に値を持つキー。無ければ文書のメタデータの `name`）を置き、`LEAD_KEYS` のうち最初に値を持つキーの値を本文の書き換えにかけて段落にする。使った 2 つのキーは本文の組み立てから除く。`x-key` を持つ `sections` の要素の `title` と見出しの組を文脈の `anchors` に集める。文書の `tables` の値をテーブルの論理名の引き方にかけ、文脈の `table_titles` にする
      2. スキーマの `properties` の順に値を組み立てる（値が空のキーと、スキーマに `x-hidden: true` を持つキーは飛ばす）
         - `x-heading` を持つ値は、深さ 2 から始まる見出し（`x-heading` の文字列、要素なら `x-key` の値）を置く。深さは `MAX_HEADING_LEVEL` で止める
         - 見出しも `x-shape` も持たないスカラーが `ATTRIBUTE_MIN` 以上続く間は、まとめて属性の表の組み立てにかける
         - `x-shape` で本文を組み立てる（`Shape`）。`table` は表の組み立て、`diagram` は図の組み立て（見出しの `title` は項目の `title`、`scope` は文書の見出し、`updated` は文書の `updated` の日付。`x-diagram: er` は文書の `tables` の値を `tables` に渡す）と、値の中のオブジェクトのリストごとの図の元データの表、`sections` は子を 1 つ深い見出しで再帰、`attributes` は属性の表の組み立て
         - `TEST_FILE_KEYS` の値は、項目の `title` を列名にした 1 列の閉じた表（`<!-- table: plain closed -->`）にし、セルは引き先にあればリンク、無ければ行内のコードにする
         - キーが `EXAMPLE_SUFFIX` で終わる値が続く間は、`<!-- tabs -->` の範囲に、値ごとに今の深さの見出し（項目の `title`）と本文の書き換えにかけた値を置く
         - `x-shape` が無いスカラーは、参照のリンクに当たればそのリンクを、当たらなければ本文の書き換えにかけた値を使う。改行を含むか ``` で始まる値は `**{title}**` の行の次のブロックに、それ以外は `**{title}**: {値}` の段落にする
         - 文字列のリストは、要素ごとに参照のリンクか本文の書き換えにかけた箇条書き、オブジェクトは子を順に組み立てる
         - キーが `DECISIONS_KEY` のリストは、先に検討事項のリンクにかけてから組み立てる
      3. 図の元データの表は、閉じた表（`closed=True`）にし、`LABEL_KEYS` の列を先頭へ移し、`DIAGRAM_HIDDEN_KEYS` のうちその表にある列を `hidden` にする
      4. 行を空行で繋いで返す
    unit_tests:
      - name: test_schema_to_markdown
        case: 正常
        summary: 見出しと表
        condition: '`x-heading: 一覧`・`x-shape: table` の `items`（要素の `properties` が `id`・`name`、`title` が `ID`・`名前`）を持つ文書'
        mock: なし
        expected: '`# {name}`、`## 一覧`、列名が `ID`・`名前` の表がこの順にある'
      - name: test_schema_to_markdown_when_sections
        case: 正常
        summary: 節の見出しの深さ
        condition: '`x-shape: sections`・`x-key: name` のリストの中に、さらに `x-heading` を持つ項目'
        mock: なし
        expected: 要素の見出しが `###`、その中の見出しが `####`
      - name: test_schema_to_markdown_when_no_schema
        case: 正常
        summary: スキーマが無い
        condition: スキーマが空で、文字列が 2 つ・リスト・オブジェクトを持つ文書
        mock: なし
        expected: キーの名前の段落と箇条書きで全ての値が出る
      - name: test_schema_to_markdown_when_title_and_lead
        case: 正常
        summary: 見出しとリードのキー
        condition: '`title: A`・`lead: B` を持つ文書'
        mock: なし
        expected: '`# A` と段落 `B` があり、`**title**`・`**lead**` の行が無い'
      - name: test_schema_to_markdown_when_hidden
        case: 正常
        summary: 内部向けのキー
        condition: '`x-hidden: true` の項目と、`x-hidden: true` の列を持つ表'
        mock: なし
        expected: その項目の値と列名が Markdown に無い
      - name: test_schema_to_markdown_when_attributes
        case: 正常
        summary: スカラーの並び
        condition: スカラーが 3 つ続く文書と、スカラーが 2 つの文書
        mock: なし
        expected: '3 つは「項目 / 値」の表、2 つは `**{title}**: {値}` の段落'
      - name: test_schema_to_markdown_when_multiline
        case: 正常
        summary: 複数行の値
        condition: '``` で始まる値を持つスカラー（並びは 1 つ）'
        mock: なし
        expected: '`**{title}**` の行と、次のブロックのコードブロック。ラベルとフェンスが同じ行に無い'
      - name: test_schema_to_markdown_when_diagram
        case: 正常
        summary: 図と元データの表
        condition: '`x-shape: diagram`・`x-diagram: flowchart` の `nodes`（`id`・`label`・`kind`）と `edges`'
        mock: なし
        expected: '`<!-- flow -->` の範囲、先頭の列が `label` の `title` で `+columns hide=` に `id` の `title` だけを持つ閉じたノードの表（`kind` の列は隠さない）、`hide=` の無い閉じた辺の表'
      - name: test_schema_to_markdown_when_test_files
        case: 正常
        summary: 対応テストファイル
        condition: '`test_file` が引き先にあるパスの文書'
        mock: なし
        expected: '`<!-- table: plain closed -->` の 1 列の表で、セルがその文書へのリンク'
      - name: test_schema_to_markdown_when_examples
        case: 正常
        summary: リクエスト例とレスポンス例
        condition: '`request_example`・`response_example` を持つ文書'
        mock: なし
        expected: '`<!-- tabs -->` の範囲に `リクエスト例`・`レスポンス例` の見出しが 1 つずつある'
      - name: test_schema_to_markdown_when_er
        case: 正常
        summary: ER 図にテーブルの列を渡す
        condition: '`x-shape: diagram`・`x-diagram: er` の `er`（`columns` を持たない実体 `顧客`）と、`title: 顧客` のテーブルを持つ `tables`'
        mock: なし
        expected: '`<!-- er -->` の範囲の JSON の `顧客` の `columns` が `tables` のテーブルの列'
      - name: test_schema_to_markdown_when_decisions
        case: 正常
        summary: 箇条書きの検討事項のリンク
        condition: '`decisions: [D-1, D-2]`（`x-shape` 無し）と `tags: [D-1]`、文脈の `decisions` が `{"D-1"}`'
        mock: なし
        expected: '`decisions` の `D-1` だけが `[D-1](…_decisions/D-1)` で、`D-2` と `tags` の `D-1` は文字のまま'
  - name: item_heading
    title: 項目の見出し
    kind: 関数
    container: features/convert/markdown.py
    usecase: 文書の取得
    role: 変換
    summary: 文書の項目のパスが、スキーマ駆動の変換で見出しになる項目を指すとき、その見出しの文字列を返す
    scope: public
    thread_safe: true
    args:
      - name: data
        title: 文書の値
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: リンク先の文書の値
      - name: schema
        title: スキーマ
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: リンク先の文書の種類のスキーマ
      - name: item
        title: 項目のパス
        type: str
        required: true
        passing: positional
        description: '`{キー}`・`{キー}[{x-key の値}]` を `.` で繋いだ項目のパス（型 `ref` の `#` 以降と同じ書き方）'
    returns:
      type: str | None
      description: 見出しの文字列。見出しにならない項目・無い項目は `None`
    process: |-
      1. 項目のパスを `.` で区切り（`[` と `]` の中の `.` では区切らない）、最上位からスキーマの `properties` と値を 1 段ずつたどる
         - `{キー}[{値}]` は、キーのスキーマが `x-shape: sections`・`x-key` を持つ配列のとき、`x-key` が値に当たる要素へ進む（当たらなければ `None`）
      2. 最後の段が `{キー}[{値}]` なら、その要素の見出し（`x-key` の値）を返す。`{キー}` なら、キーのスキーマの `x-heading` を返す（無ければ `None`）
    unit_tests:
      - name: test_item_heading
        case: 正常
        summary: x-heading を持つ項目
        condition: '`flow` のスキーマが `x-heading: 処理の流れ`、項目のパス `flow`'
        mock: なし
        expected: '`処理の流れ`'
      - name: test_item_heading_when_section
        case: 正常
        summary: sections の要素
        condition: '`scenarios` が `x-shape: sections`・`x-key: name` で、`name: 正常シナリオ` の要素を持つ。項目のパス `scenarios[正常シナリオ]`'
        mock: なし
        expected: '`正常シナリオ`'
      - name: test_item_heading_when_not_heading
        case: 正常
        summary: 見出しにならない項目と無い項目
        condition: '`x-heading` を持たない `name` と、`scenarios[無い]`'
        mock: なし
        expected: どちらも `None`
  - name: render_table
    title: 表の組み立て
    kind: 関数
    container: features/convert/markdown.py
    usecase: 文書の取得
    role: 変換
    summary: オブジェクトのリストを、mdmark の表のマーカーつきの Markdown の表にする
    scope: public
    thread_safe: true
    args:
      - name: rows
        title: 行
        type: Sequence[Mapping[str, Any]]
        required: true
        passing: positional
        description: 表にする要素
      - name: item_schema
        title: 要素のスキーマ
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 列の順と列名を決める。空なら要素のキーの出た順で、列名はキーの名前
      - name: table_key
        title: 表のキー
        type: str
        required: true
        passing: keyword
        description: '`{種類}:{項目のパス}`。表の列の設定の保存の `table`'
      - name: context
        title: 描画の文脈
        type: RenderContext | None
        required: false
        default: None
        passing: keyword
        description: 参照のリンクの引き先。`None`（埋め込みの展開）なら参照のリンクを張らない
      - name: closed
        title: 閉じる
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: '`True` なら表のマーカーに `closed` を付ける'
      - name: first
        title: 先頭の列
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 先頭へ移す列のキー
      - name: hidden
        title: 隠す列
        type: Sequence[str]
        required: false
        default: ()
        passing: keyword
        description: '`+columns hide=` に記載する列のキー。表に無いキーと先頭の列は除く'
    returns:
      type: str
      description: '表のキーのマーカーと、`<!-- table: data … -->` で囲んだ表'
    process: |-
      1. 列をスキーマの `properties` の順に決める（要素のどれも値を持たない列と、スキーマに `x-hidden: true` を持つ列は除く）。`first` が列にあれば先頭へ移す
      2. セルは、真偽の値は `CHECK_MARK` か空、参照のリンクに当たる文字列はリンク、それ以外のスカラーはそのまま（`|` はエスケープ、改行は `<br>`）、文字列のリストは `・` で繋ぐ（列のキーが `DECISIONS_KEY` のリストは、先に検討事項のリンクにかける）。`table` を持つオブジェクト（外部キー）は、`table` の値を最後の `.` でテーブルとカラムに分け、テーブルが `{分類}/{テーブル}` なら同じフォルダの `{分類}.yaml` の文書へのリンク、そうでなければ、テーブル名を `table_titles` で論理名にし（当たらなければテーブル名のまま）、`anchors` でその論理名から引いた見出しのアンカー（見出しのアンカー）へのリンク（どちらも引けなければ値の文字のまま）、それ以外のオブジェクトは `{キー}: {値}` を `、` で繋ぎ、オブジェクトのリストは要素ごとのセルを `<br>` で繋ぐ
      3. 表のマーカーの引数は、`data` に、`closed` なら `closed`、隠す列があれば `+columns hide={列名,…}`、`WIDE_KEYS` の列があれば `wide={列名,…}` を続ける（空白を含む列名は記載しない）
      4. `<!-- dev-docs-table: {table_key} -->`・表のマーカー・見出しの行・区切りの行・データの行・`<!-- /table -->` の順に置いて返す
    unit_tests:
      - name: test_schema_to_markdown_when_foreign_key
        case: 正常
        summary: 同じ文書のテーブルへの外部キー
        condition: '`x-shape: sections`・`x-key: name` の `tables` に、`name: tasks`・`title: タスク` のテーブルと、`foreign_key: {table: タスク.ID}` のカラムを持つテーブルがある文書'
        mock: なし
        expected: カラムの表に `[タスク.ID](#tasks)` のセルがある
      - name: test_schema_to_markdown_when_foreign_key_physical_name
        case: 正常
        summary: 物理名で書いた同じ文書のテーブルへの外部キー
        condition: '`test_schema_to_markdown_when_foreign_key` と同じ文書で、`foreign_key` が `{table: tasks.id}`'
        mock: なし
        expected: カラムの表に `[tasks.id](#tasks)` のセルがある
      - name: test_render_table
        case: 正常
        summary: セルの書き方
        condition: '`|` と改行を含む文字列・文字列のリスト・真偽の値の `True` と `False` を持つ 2 行'
        mock: なし
        expected: '`\|`・`<br>`・`a・b`・`✓`・空のセルと、表の前の `<!-- dev-docs-table: {表のキー} -->`'
      - name: test_render_table_when_objects
        case: 正常
        summary: オブジェクトのリストのセル
        condition: '`anchors` が `{タスク: tasks}`、`links` に `dev/er/ユーザー.yaml` を持つ文脈で、`foreign_key` が `{table: タスク.ID}`・`{table: ユーザー/ユーザー.ID, on_delete: CASCADE}`・`{table: 不明.ID}` の行と、`{a: 1, b: 2}` のオブジェクトの行'
        mock: なし
        expected: '`[タスク.ID](#tasks)`・`[ユーザー/ユーザー.ID](ユーザー.yaml)`・`不明.ID` と `a: 1、b: 2` のセルで、`件` のセルが無い'
      - name: test_render_table_when_physical_name
        case: 正常
        summary: 物理名で書いた同じ文書のテーブルへの外部キー
        condition: '`anchors` が `{タスク: tasks}`、`table_titles` が `{tasks: タスク, タスク: タスク}` の文脈で、`foreign_key` が `{table: tasks.id}` の行'
        mock: なし
        expected: '`[tasks.id](#tasks)` のセル'
      - name: test_render_table_when_closed_and_hidden
        case: 正常
        summary: 閉じた表と隠す列
        condition: '`closed=True`・`first="label"`・`hidden=["id", "shape"]` で、`id`・`label`・`shape`・`kind` の列の行'
        mock: なし
        expected: '先頭の列が `label` の列で、マーカーが `<!-- table: data closed +columns hide={id の列名},{shape の列名} -->`（`kind` の列は隠さない）'
      - name: test_render_table_when_wide
        case: 正常
        summary: 説明の列
        condition: '`name`・`description` の列の行'
        mock: なし
        expected: 'マーカーに `wide={description の列名}` がある'
      - name: test_render_table_when_decisions
        case: 正常
        summary: 表のセルの検討事項のリンク
        condition: '`decisions` の列の値が `[D-1, D-2]` の行、文脈の `decisions` が `{"D-1"}`'
        mock: なし
        expected: 'セルが `[D-1](…_decisions/D-1)・D-2`'
  - name: render_attributes
    title: 属性の表の組み立て
    kind: 関数
    container: features/convert/markdown.py
    usecase: 文書の取得
    role: 変換
    summary: 項目の名前と値の組を、「項目 / 値」の 2 列の表にする
    scope: public
    thread_safe: true
    args:
      - name: pairs
        title: 組
        type: Sequence[tuple[str, Any]]
        required: true
        passing: positional
        description: 項目の `title` とスカラーの値の組
      - name: context
        title: 描画の文脈
        type: RenderContext
        required: true
        passing: positional
        description: 参照のリンクの引き先と Issue の URL
      - name: head
        title: 図の見出し
        type: DiagramHead
        required: true
        passing: positional
        description: 行の詳細の値を本文の書き換えにかけるときの見出し
    returns:
      type: str
      description: '`<!-- table: plain -->` で囲んだ表と、長い値の行の詳細'
    process: |-
      1. 列名を `項目`・`値` にし、組ごとに 1 行を置く。真偽の値は `CHECK_MARK` か空、参照のリンクに当たる値はリンクにする
      2. `LONG_VALUE_CHARS` を超える値と改行を含む値は、セルに最初の行の先頭 `LONG_VALUE_CHARS` 文字と `…` を置き、表の後ろの `<!-- row-detail: {行の位置} -->` 〜 `<!-- /row-detail -->` に本文の書き換えにかけた値を置く
    unit_tests:
      - name: test_render_attributes
        case: 正常
        summary: 項目と値
        condition: '`(種類, A)`・`(必須, True)`・`(上限, 3)`'
        mock: なし
        expected: '列名が `項目`・`値` で、`✓` のセルを持つ 3 行の表'
      - name: test_render_attributes_when_long
        case: 正常
        summary: 長い値
        condition: 120 文字の値と、改行を含む値
        mock: なし
        expected: '2 つのセルが `…` で終わり、表の後ろに `<!-- row-detail: 1 -->` と `<!-- row-detail: 2 -->` の範囲に全文がある'
