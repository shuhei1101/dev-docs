id: MOD-155-50
title: 画面 / index.css
lead: 画面全体の CSS。Tailwind の読み込みと色のトークンに加え、mdmark が描く本文への上書きを持つ。
styles:
  - name: mdmark-html
    title: HTML ブロックの上書き
    container: index.css
    summary: 本文の `<!-- html -->` ブロックの `<pre>` を画面幅で折り返す
    description: プロンプトの文書のテンプレートと描画の結果は `<mark>`・`<span data-hint>` を含むため HTML の `<pre>` で出す。長い行で横スクロールさせない。
    values:
      - class_name: .mdmark-html pre
        target: HTML ブロックの整形済みテキスト
        value: '`white-space: pre-wrap; overflow-wrap: anywhere`'
  - name: mdmark-sticky-top
    title: mdmark の固定の位置
    container: index.css
    summary: mdmark が右側の目次・見出しの移り先・表の見出し行を留める位置を、トップバーと種類のタブの下にする
    description: 画面設計『文書の画面』の要素『目次』の `固定の位置`。値は文書の画面のサイドバーの固定の位置（`top-24`）と同じ式にし、トップバー（`h-12`）と種類のタブ（`sticky top-12`）の下端に合わせる。mdmark は既定値を層 `mdmark` の `:root` に持つため、層に属さない `:root` で上書きする
    values:
      - class_name: :root
        target: mdmark の CSS 変数 `--mdmark-sticky-top`
        value: '`calc(var(--spacing) * 24)`'
    refs:
      - SCR-155-1#elements[目次]
