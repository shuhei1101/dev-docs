id: MOD-155-11
title: 画面 / 文書の画面 / doc-breadcrumb.tsx
lead: 開いている文書の階層のパンくずを受け持ち、文書の画面の doc-breadcrumb.tsx を修正するときに参照する。
components:
  - name: DocBreadcrumb
    title: パンくず
    kind: コンポーネント
    container: features/docs/doc-view/components/doc-breadcrumb.tsx
    usecase: 文書を参照する
    role: 部品
    summary: '`{配信元の ID}` / `{タブ名}` / `{外側の group}` / … / `{内側の group}` / `{文書の名前}` を shadcn/ui の `Breadcrumb` で並べる（group は `active.groups` の順）。配信元とタブだけをリンクにする。文書の無いタブを選んでいれば `{配信元の ID}` / `{そのタブ名}` だけを並べ、タブ名をリンクにしない末尾の項目（`aria-current="page"`）にする'
    props:
      - name: source
        type: string
        required: true
        description: 配信元の ID
      - name: active
        type: ActivePage
        required: true
        description: 開いているページ
      - name: emptyTab
        type: NavTab | null
        required: true
        description: 文書の無いタブを選んだときのタブ
      - name: search
        type: DocViewSearch
        required: true
        description: 保つ `rev`・`base`・`tab`（`tab` はタブ名のリンクだけ）
    unit_tests:
      - name: test_doc_breadcrumb
        case: 正常
        summary: 文書の階層
        condition: '`emptyTab` が null、`active` がタブ `設計`・`groups` `["設計"]`・page `A`'
        mock: なし
        expected: '`s` / `設計` / `設計` / `A` が並び、`s` とタブ名がリンク、`A` が `aria-current="page"`'
      - name: test_doc_breadcrumb_when_nested_group
        case: 正常
        summary: 入れ子の group
        condition: '`emptyTab` が null、`active` がタブ `設計`・`groups` `["設計書", "画面"]`・page `A`'
        mock: なし
        expected: '`s` / `設計` / `設計書` / `画面` / `A` の順に並び、`設計書`・`画面` はリンクでなく、`A` が `aria-current="page"`'
      - name: test_doc_breadcrumb_when_empty_tab
        case: 正常
        summary: 文書の無いタブ
        condition: '`emptyTab` に `items` が空のタブ `規約`、`active` は文書を開いていたタブ `設計` の page `A`'
        mock: なし
        expected: '`s` / `規約` だけが並び、`規約` はリンクでなく `aria-current="page"`。`設計` と `A` は出ない'
tags:
  - name: topic:文書
    main: true
  - name: topic:画面
  - name: topic:パンくず
test_files:
  - tests/unit/frontend/src/features/docs/doc-view/components/doc-breadcrumb.test.tsx
