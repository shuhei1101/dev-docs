id: MOD-155-106
title: 開発ドキュメントサーバー / 文書 / aliases.py
lead: エイリアスのキーの検証と、エイリアスの集め。
test_files:
  - tests/unit/dev_docs/features/documents/test_aliases.py
constants:
  - name: ALIAS_SCHEMA_PATH
    title: 取り込んだエイリアスのスキーマ
    container: features/documents/aliases.py
    usecase: 共通
    summary: 配布に同梱する alias-inject の「エイリアスの元の行」のスキーマのパス（`importlib.resources` で引く）。alias-inject の `schemas/aliases.schema.yaml` を書き換えずに置く
    value: '"schemas/aliases.schema.yaml"'
  - name: ALIAS_REQUIRED_KEYS
    title: 引用の種類ごとの必須のキー
    container: features/documents/aliases.py
    usecase: 共通
    summary: 取り込んだスキーマの `metadata` の各キーの説明に書かれた必須を、引用の種類ごとに並べたもの。`env` の `("url", "port")` は 1 つ以上が必須
    value: '{"term": ("id", "name", "description"), "doc": ("id", "name", "description"), "command": ("id", "name", "command"), "url": ("id", "name", "url"), "skill": ("id", "name", "skill"), "tool": ("id", "name", "tool"), "path": ("id", "name", "path"), "env": ("id", "name", ("url", "port")), "avoid": ("id", "name", "replacement")}'
  - name: ALIAS_LIST_KEYS
    title: 文字列か文字列の並びのキー
    container: features/documents/aliases.py
    usecase: 共通
    summary: 値に文字列か文字列の並びを許すエイリアスのキー。返すときは文字列 1 つを要素 1 つの並びにする
    value: ("aliases", "avoid")
functions:
  - name: alias_schema
    title: 取り込んだエイリアスのスキーマ
    kind: 関数
    container: features/documents/aliases.py
    usecase: 共通
    role: 読み込み
    summary: 同梱した `ALIAS_SCHEMA_PATH` を YAML として読んで返す
    scope: public
    thread_safe: true
    returns:
      type: dict[str, Any]
      description: スキーマ（`functools.cache` で 1 回だけ読む）
    process: |-
      1. `importlib.resources.files("dev_docs") / ALIAS_SCHEMA_PATH` を YAML として読む（YAMLの読み込み）
      2. 返す
    unit_tests:
      - name: test_alias_schema
        case: 正常
        summary: 同梱したスキーマ
        condition: 引数なし
        mock: なし
        expected: '`$defs.alias.properties.metadata.properties` に `name`・`aliases`・`description`・`avoid`・`replacement` があり、`$defs.alias.properties.alias_type` の `enum` が 9 個'
  - name: check_alias_document
    title: エイリアスのキーの検証
    kind: 関数
    container: features/documents/aliases.py
    usecase: 共通
    role: 検証
    summary: '`alias_type` を持つ行の文書 1 件のエイリアスのキーの値を、取り込んだスキーマのキーと引用の種類の必須で検証する'
    scope: public
    thread_safe: true
    args:
      - name: document
        title: 文書
        type: IndexedDocument
        required: true
        passing: positional
        description: '`metadata` に `alias_type` を持つ文書'
    returns:
      type: list[Violation]
      description: 違反。`path` はエイリアスのキー、`doc` は文書のパス（配信元の直下から）
    process: |-
      1. 取り込んだエイリアスのスキーマの `$defs.alias.properties.metadata.properties` のキーをエイリアスのキーにする
      2. `ALIAS_REQUIRED_KEYS` の `metadata["alias_type"]` のキーごとに、値が無いか空文字なら `必須のキーが無い` の違反を加える。組（`("url", "port")`）は全て無いときに、組の先頭のキーのパスで `{キー} のどれか 1 つが要ります` の違反を加える
      3. 値を持つエイリアスのキーごとに型を確かめる
         - `ALIAS_LIST_KEYS` は文字列か、空でない文字列の並びでなければ `文字列か文字列の並びではありません`
         - `related` は並びで、要素が文字列か `to` を文字列で持つ辞書でなければ `related の要素は文書の ID か to を持つ辞書です`
         - `port` は整数か文字列でなければ `整数か文字列ではありません`
         - それ以外のキーは文字列でなければ `文字列ではありません`
      4. 違反を返す
    unit_tests:
      - name: test_check_alias_document
        case: 正常
        summary: 通る用語
        condition: '`alias_type: term`・`name: 作業範囲`・`aliases: [scope, 担当範囲]`・`description` あり'
        mock: なし
        expected: 違反が空
      - name: test_check_alias_document_when_aliases_number
        case: 異常
        summary: 別名が数値
        condition: '`alias_type: term`・`aliases: 3`'
        mock: なし
        expected: 違反が 1 件で、`path` が `aliases`、`rule` が `文字列か文字列の並びではありません`、`doc` が文書のパス
      - name: test_check_alias_document_when_required_missing
        case: 異常
        summary: 引用の種類の必須が無い
        condition: '`alias_type: command` で `command` が無い文書と、`alias_type: env` で `url`・`port` が無い文書'
        mock: なし
        expected: 1 つ目は `path` が `command` の `必須のキーが無い`、2 つ目は `path` が `url` の `url・port のどれか 1 つが要ります`
      - name: test_check_alias_document_when_aliases_string
        case: 正常
        summary: 別名が文字列
        condition: '`alias_type: doc`・`aliases: settings`・`description` あり'
        mock: なし
        expected: 違反が空
  - name: collect_aliases
    title: エイリアスの集め
    kind: 関数
    container: features/documents/aliases.py
    usecase: 文書の取得
    role: 変換
    summary: 文書のうち `alias_type` を持つ行の文書を検証し、通った文書のエイリアスと違反を返す
    scope: public
    thread_safe: true
    args:
      - name: view
        title: 配信元の表示の設定
        type: SourceView
        required: true
        passing: positional
        description: documents の行の `alias_type` を読む
      - name: documents
        title: 文書
        type: Sequence[IndexedDocument]
        required: true
        passing: positional
        description: project-index が返した文書
    returns:
      type: AliasCollection
      description: エイリアスと違反
    process: |-
      1. `view.documents` の行に `alias_type` を持つ行があるかを `has_alias_rows` にする
      2. `metadata` に `alias_type` を持つ文書ごとにエイリアスのキーの検証をする
         - 違反があれば `violations` に加え、エイリアスにしない
         - 違反が無ければ `ALIAS_LIST_KEYS` の文字列を要素 1 つの並びにし、`AliasEntry` にして `entries` に加える（`extra` は取り込んだスキーマの `metadata` のキーのうち `AliasEntry` の項目以外で値を持つもの）
      3. `AliasCollection` を返す
    unit_tests:
      - name: test_collect_aliases
        case: 正常
        summary: 用語と文書の別名と違反
        condition: '`alias_type: term` の行の「作業範囲」（`aliases: [scope, 担当範囲]`・`avoid: [担当領域]`）と「壊れた用語」（`aliases: 3`）、`alias_type: doc` の行の「設定のリファレンス」（`aliases: settings`）、`alias_type` の無い行の文書'
        mock: なし
        expected: '`entries` が 2 件（作業範囲の `avoid` が `[担当領域]`、設定のリファレンスの `aliases` が `[settings]` で `avoid` が `None`）、`violations` が 1 件で `doc` が壊れた用語のパス、`has_alias_rows` が `True`'
      - name: test_collect_aliases_when_no_alias_rows
        case: 正常
        summary: エイリアスの行が無い
        condition: '`alias_type` を持つ行が無い配信元'
        mock: なし
        expected: '`entries`・`violations` が空で、`has_alias_rows` が `False`'
