id: MOD-155-76
title: "画面 / 共通"
lead: 画面の間で共通に使用する型・エラー・API のクライアント・フック・ストア・部品と、テストの MSW のハンドラを受け持つ共通の分類のファイルの並びと決まりを定め、この分類のファイルを追加・移動するときに参照する。
diagrams:
  - name: 全体
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class APIのクライアント
        class AppError
        class 失敗の通知
        class 問題のスキーマ
        class ショートカットの定義
        class ショートカットの登録
        class 好みのストア
        class トップバー
        class ショートカットの一覧
        APIのクライアント --> AppError : fromResponse
        AppError --> 問題のスキーマ
        失敗の通知 --> AppError
        ショートカットの登録 --> ショートカットの定義
        ショートカットの登録 --> 好みのストア : singleKey
        ショートカットの一覧 --> ショートカットの定義
        トップバー --> 好みのストア : colorScheme
      ```
notes:
  依存の向き: '`shared/` は `features/`・`app/`・`routes/` を import しない（eslint-plugin-boundaries で検査する）'
