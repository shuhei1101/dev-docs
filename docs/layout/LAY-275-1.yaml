id: LAY-275-1
title: dev-docs
repository: shuhei1101/dev-docs
lead: |-
  サーバーのコードは `src/dev_docs/`、画面のコードは `frontend/`、管理用プラグインは `plugins/dev-docs/`、テストは `tests/` に分ける。
  文書の原本は `docs/` の種類のフォルダ、MCP のプロンプトは `content/prompts/` に配置する。
entries:
  - type: folder
    name: .claude-plugin
    contents: マーケットプレースの定義
    children:
      - type: file
        name: marketplace.json
        contents: 管理用プラグインを配るマーケットプレースの定義
  - type: folder
    name: .github
    contents: GitHub の設定
    children:
      - type: folder
        name: workflows
        contents: GitHub Pages への配信と、テストをランナーで回すワークフロー
        children:
          - type: file
            name: pages.yml
            contents: develop への push で build_pages.py を実行し、出力を Pages へ配信するワークフロー
          - type: file
            name: test.yml
            contents: テストの層をランナーで回すワークフロー
  - type: folder
    name: content
    contents: コードではない原本
    children:
      - type: folder
        name: prompts
        contents: MCP のプロンプト
        children:
          - type: folder
            name: mcp
            contents: MCP のサーバーごとのプロンプト
            children:
              - type: folder
                name: admin
                contents: 管理の MCP のプロンプト
                children:
                  - type: folder
                    name: tools
                    contents: '管理の MCP のツールの description（kind: tool）'
                    naming:
                      - '{tool}.yaml'
                    used_by:
                      - MOD-155-198#
  - type: folder
    name: docs
    contents: 文書（種類ごとのフォルダ・guide/・pr/・mock/）
    children:
      - type: file
        name: README.md
        contents: トップの目次（index.yaml から生成する）
      - type: file
        name: index.yaml
        contents: トップの目次の原本
      - type: file
        name: design-policy.md
        contents: デザイン方針
      - type: folder
        name: '{kind}'
        contents: 種類ごとの文書（architecture・layout・module・scenario など。中はフラットで、目次の index.yaml と README.md を持つ）
      - type: folder
        name: guide
        contents: 公開ドキュメント（Markdown）と files.yml
      - type: folder
        name: mock
        contents: モック画面（画面 1 つ = 1 フォルダ）
      - type: folder
        name: pr
        contents: PR ドキュメント（PR 1 件 = 1 フォルダ）
  - type: folder
    name: frontend
    contents: 画面（React の SPA）
    children:
      - type: folder
        name: .storybook
        contents: Storybook の設定
      - type: folder
        name: scripts
        contents: 画面のビルドで使用するスクリプト
        children:
          - type: file
            name: export_openapi.py
            contents: サーバーの画面の API の OpenAPI を書き出す
      - type: folder
        name: src
        contents: 画面のコード
        children:
          - type: file
            name: main.tsx
            contents: MSW の起動（開発のみ）と描画の開始
          - type: file
            name: index.css
            contents: Tailwind のトークンと全体のスタイル
          - type: file
            name: preflight-outside-mdmark.css
            contents: Tailwind の preflight を mdmark の本文の外だけに当てるコピー
            generated_from:
              source: npm:tailwindcss@4.3.3
              tracked: 画面のビルドが読み込む
          - type: folder
            name: app
            contents: プロバイダ・ルーター・最初の読み込みとエラーの表示
            used_by:
              - MOD-155-75#
            children:
              - type: file
                name: query-client.ts
                contents: TanStack Query の QueryClient
              - type: file
                name: router.tsx
                contents: ルーターの生成とルートの文脈
              - type: file
                name: providers.tsx
                contents: QueryClient・テーマ・通知・確認ダイアログのプロバイダ
              - type: file
                name: confirm-dialog.tsx
                contents: 確認ダイアログのプロバイダとフック
              - type: file
                name: error-fallback.tsx
                contents: ルートのエラーの表示
              - type: file
                name: error-fallback.stories.tsx
                contents: ルートのエラーの表示のストーリー
              - type: file
                name: initial-loading.tsx
                contents: 最初の読み込みの表示
              - type: file
                name: pending.ts
                contents: 読み込み中の表示を出すまでの待ち時間
          - type: folder
            name: routes
            contents: TanStack Router のファイルベースのルート
            used_by:
              - MOD-155-75#
            children:
              - type: file
                name: __root.tsx
                contents: 全画面の枠・notFoundComponent・errorComponent
              - type: file
                name: index.tsx
                contents: / を先頭の配信元へ転送
              - type: file
                name: '[_]settings.tsx'
                contents: /_settings
              - type: folder
                name: $source
                contents: 配信元ごとのルート
                children:
                  - type: file
                    name: index.tsx
                    contents: /{source} の配信元のトップ
                  - type: file
                    name: $.tsx
                    contents: /{source}/{path} の文書
          - type: file
            name: route-tree.gen.ts
            contents: '@tanstack/router-plugin の生成物'
            generated_from:
              path: frontend/src/routes/
              command: CMD-155-1#categories[ビルド・生成]
              tracked: 型検査とテストが生成済みのルートの木を import する
          - type: folder
            name: shared
            contents: 画面の間で共通に使用する型・エラー・API のクライアント・フック・ストア・部品
            used_by:
              - MOD-155-76#
            children:
              - type: folder
                name: lib
                contents: 表示の整形とロガー
                children:
                  - type: file
                    name: format.ts
                    contents: 日時の表示（JST）
                  - type: file
                    name: logger.ts
                    contents: コンソールのロガー
                  - type: file
                    name: utils.ts
                    contents: shadcn/ui が配置した cn
              - type: folder
                name: core
                contents: スキーマ・エラー・ショートカットの定義
                children:
                  - type: file
                    name: schema.ts
                    contents: 生成しない zod のスキーマ（problem・missing）
                  - type: file
                    name: app-error.ts
                    contents: AppError とその派生
                  - type: file
                    name: handle-app-error.ts
                    contents: 失敗の通知とログ
                  - type: file
                    name: shortcuts.ts
                    contents: ショートカットの定義
              - type: folder
                name: adapters
                contents: API のクライアントの接続
                children:
                  - type: file
                    name: api-client.ts
                    contents: orval の fetch の mutator
              - type: folder
                name: api
                contents: 画面の API のクライアント
                children:
                  - type: folder
                    name: generated
                    contents: orval の生成物（API の関数・型・zod・MSW のハンドラ）
                    generated_from:
                      path: frontend/openapi.json
                      command: CMD-155-1#categories[ビルド・生成]
                      tracked: 型検査とテストが生成済みのクライアントを import する
              - type: folder
                name: hooks
                contents: 画面の間で共通のフック
                children:
                  - type: file
                    name: use-shortcut.ts
                    contents: ショートカットの登録
                  - type: file
                    name: use-delayed-flag.ts
                    contents: 遅らせた読み込み中の判定
                  - type: file
                    name: use-media-query.ts
                    contents: メディアクエリの判定
              - type: folder
                name: stores
                contents: ブラウザに保存する状態
                children:
                  - type: file
                    name: preferences.ts
                    contents: ブラウザに保存する好み
                  - type: file
                    name: last-doc.ts
                    contents: 直前に開いていた文書の画面の URL
              - type: folder
                name: components
                contents: 画面の間で共通の部品と Storybook のストーリー（*.stories.tsx）
                children:
                  - type: folder
                    name: topbar
                    contents: トップバー
                  - type: folder
                    name: shortcut-dialog
                    contents: ショートカットの一覧
                  - type: file
                    name: skip-link.tsx
                    contents: 本文へのスキップ
                  - type: file
                    name: project-index-unreachable.tsx
                    contents: project-index につながらないときの表示
                  - type: file
                    name: project-index-unreachable.stories.tsx
                    contents: project-index につながらないときの表示のストーリー
                  - type: folder
                    name: ui
                    contents: shadcn/ui が配置した部品（配置した後に手で修正している）
          - type: folder
            name: features
            contents: 画面ごとの機能
            children:
              - type: folder
                name: docs
                contents: 文書の画面・見つからない画面と、両方が使用する検索・コメント
                used_by:
                  - MOD-155-77#
                children:
                  - type: folder
                    name: doc-view
                    contents: 文書の画面
                    children:
                      - type: file
                        name: search.ts
                        contents: URL の search の検証
                      - type: file
                        name: queries.ts
                        contents: 文書の問い合わせとルートの loader
                      - type: file
                        name: nav.ts
                        contents: ナビゲーションからの開いているページ・タイトル
                      - type: file
                        name: tables.ts
                        contents: 本文の表のマーカーと表の区切りの読み取り
                      - type: file
                        name: doc-view-screen.tsx
                        contents: 文書の画面
                      - type: folder
                        name: hooks
                        contents: mdmark の読み込みと文書の画面の移動
                      - type: folder
                        name: components
                        contents: サイドバー・タブ・パンくず・見出し・差分の帯・変換の失敗・空のタブ・本文・読み込み中・ドロワー・本文の領域
                  - type: folder
                    name: not-found
                    contents: 見つからない画面
                    children:
                      - type: file
                        name: missing.ts
                        contents: 見つからなかったものの説明
                      - type: folder
                        name: hooks
                        contents: 見つからない画面の内容
                      - type: folder
                        name: components
                        contents: 次のリンク
                      - type: file
                        name: not-found-screen.tsx
                        contents: 見つからない画面
                      - type: file
                        name: not-found-screen.stories.tsx
                        contents: 見つからない画面のストーリー
                  - type: folder
                    name: shared
                    contents: 文書の画面と見つからない画面が使用するもの
                    children:
                      - type: file
                        name: serving-sources.ts
                        contents: 配信中の配信元の取り出し
                      - type: folder
                        name: search-dialog
                        contents: 検索のダイアログと、一致した箇所の分割
                      - type: folder
                        name: comments
                        contents: コメントのストア（sessionStorage）・コピーの本文と Issue の URL・コメントのパネル
              - type: folder
                name: settings
                contents: 設定画面
                children:
                  - type: folder
                    name: settings
                    contents: 設定画面
                    used_by:
                      - MOD-155-78#
                    children:
                      - type: file
                        name: form.ts
                        contents: 入力のスキーマと sources[] への反映
                      - type: file
                        name: problem-errors.ts
                        contents: 422 の errors[] の振り分け
                      - type: file
                        name: queries.ts
                        contents: 端末の設定の保存の mutation
                      - type: folder
                        name: hooks
                        contents: 配信元のフォーム
                      - type: file
                        name: settings-screen.tsx
                        contents: 設定画面
                      - type: file
                        name: settings-screen.stories.tsx
                        contents: 設定画面のストーリー
                      - type: folder
                        name: components
                        contents: 配信元の一覧・状態のバッジ・配信元のダイアログ・削除の確認のダイアログ・配信元の一覧の読み込み中の表示
          - type: folder
            name: testing
            contents: テストの MSW のハンドラと単体テストの共通の準備
            used_by:
              - MOD-155-76#
            children:
              - type: folder
                name: msw
                contents: テストの既定のハンドラ（handlers.ts）
              - type: file
                name: setup-tests.ts
                contents: 単体テストの共通の準備
      - type: file
        name: openapi.json
        contents: orval の入力にする画面の API の OpenAPI
        generated_from:
          path: src/dev_docs/
          command: CMD-155-1#categories[ビルド・生成]
          tracked: orval の生成の入力にする
      - type: file
        name: index.html
        contents: Vite の入口の HTML
      - type: file
        name: orval.config.ts
        contents: orval の設定
      - type: file
        name: tsconfig.json
        contents: TypeScript の設定
      - type: file
        name: vite.config.ts
        contents: Vite の設定
      - type: file
        name: vitest.config.ts
        contents: Vitest の設定
      - type: file
        name: files.yaml
        contents: 画面のコードの files.yaml の行
  - type: folder
    name: plugins
    contents: Claude Code のプラグイン
    children:
      - type: folder
        name: dev-docs
        contents: 管理用プラグイン
        children:
          - type: folder
            name: .claude-plugin
            contents: プラグインの定義（plugin.json）
          - type: file
            name: .mcp.json
            contents: 管理の MCP の接続先
          - type: folder
            name: hooks
            contents: フックの登録とフックのスクリプト
            used_by:
              - MOD-155-80#
            children:
              - type: file
                name: hooks.json
                contents: SessionStart（timeout 2）の登録
              - type: file
                name: session_start.py
                contents: セッション開始のフック
          - type: folder
            name: skills
            contents: プラグインのスキル（global-setup）
  - type: folder
    name: scripts
    contents: 反映作業のスクリプトが呼ぶ共通のスクリプトと、Pages の公開ページの生成のスクリプトと、常駐サーバーを起動し直すスクリプト
    used_by:
      - MOD-192-1#
      - MOD-266-1#
    children:
      - type: file
        name: build_pages.py
        contents: 公開の Markdown と判定フローチャートを mdmark の build で 1 枚の HTML にまとめる
      - type: file
        name: dev-docs-restart-resident.sh
        contents: 常駐サーバーを起動し直す
      - type: file
        name: dev-docs-server-wait.sh
        contents: 再起動の後にサーバーの待ち受けを待つ
  - type: folder
    name: src
    contents: サーバーのコード（src レイアウトのため、パッケージ 1 つだけを配置する）
    children:
      - type: folder
        name: dev_docs
        contents: 開発ドキュメントサーバー
        used_by:
          - MOD-155-193#
          - MOD-155-207#
        children:
          - type: file
            name: __init__.py
            contents: DIST_NAME（配布名）
          - type: file
            name: __main__.py
            contents: 引数の組み立てと main
          - type: file
            name: main.py
            contents: Handlers / build_handlers / announce_sources / run_serve / run_migrate / PortInUseError
          - type: folder
            name: shared
            contents: どの分類からも使用する例外の階層・YAML の読み書き・内容のハッシュ・パスの正規化
            used_by:
              - MOD-155-194#
            children:
              - type: file
                name: __init__.py
                contents: パッケージの宣言
              - type: file
                name: errors.py
                contents: DevDocsError と MCP・画面が返すエラーの階層
              - type: file
                name: api_model.py
                contents: ApiModel（画面の API の DTO の基底。キーは camelCase）
              - type: file
                name: yaml_io.py
                contents: YAML の読み込み・往復編集の読み書き・YamlLoadError
              - type: file
                name: hashing.py
                contents: 内容のハッシュ（文書のバージョン）
              - type: file
                name: paths.py
                contents: パスの正規化
              - type: file
                name: files.py
                contents: 一時ファイルからのファイルの置き換え
              - type: file
                name: schema_check.py
                contents: JSON Schema の違反を項目のパスつきの Violation にする
              - type: file
                name: version.py
                contents: 動いているプロセスが起動した時点の dev-docs のバージョン
          - type: folder
            name: features
            contents: 機能ごとの処理
            children:
              - type: file
                name: __init__.py
                contents: パッケージの宣言
              - type: folder
                name: admin
                contents: 管理の MCP のツールの処理
              - type: folder
                name: changes
                contents: 2 つの値の変わったキーの比べ方
                used_by:
                  - MOD-155-196#
                children:
                  - type: file
                    name: __init__.py
                    contents: 公開する関数の再エクスポート
                  - type: file
                    name: compare.py
                    contents: changed_keys
              - type: folder
                name: convert
                contents: 文書を文書の取得で返却する Markdown にする処理
                used_by:
                  - MOD-155-195#
                children:
                  - type: file
                    name: __init__.py
                    contents: 公開する型と関数の再エクスポート
                  - type: file
                    name: types.py
                    contents: Converted / ConvertFailure / Shape / DiagramKind
                  - type: file
                    name: decisions.py
                    contents: decision_page_id（検討事項の文書のパス）
                  - type: file
                    name: markdown.py
                    contents: schema_to_markdown / render_table（スキーマ駆動の変換）
                  - type: file
                    name: diagrams.py
                    contents: render_diagram（x-diagram の map の範囲）
                  - type: file
                    name: embed.py
                    contents: embed_paths / expand_embeds（埋め込みのマーカーのパスと、表への展開）
                  - type: file
                    name: inline.py
                    contents: 文字列の値の本文の書き換えと、参照の値のリンクへの組み立て
                  - type: file
                    name: service.py
                    contents: ConvertService（変換の選択・表のキーの取り出し）
              - type: folder
                name: documents
                contents: 文書の項目のパスの値とエイリアス
                used_by:
                  - MOD-155-199#
                children:
                  - type: file
                    name: __init__.py
                    contents: 公開する型と関数の再エクスポート
                  - type: file
                    name: types.py
                    contents: AliasType / AliasEntry / AliasCollection
                  - type: file
                    name: fields.py
                    contents: ArraySelector / parse_field_path / get_field / is_markdown_body
                  - type: file
                    name: aliases.py
                    contents: alias_schema / check_alias_document / collect_aliases（エイリアスのキーの検証と集め）
              - type: folder
                name: filter
                contents: nav の auto の filter の条件の木の確認と文書への照合
                used_by:
                  - MOD-155-202#
                children:
                  - type: file
                    name: __init__.py
                    contents: 公開する型と関数の再エクスポート
                  - type: file
                    name: types.py
                    contents: Condition / Group / Heading
                  - type: file
                    name: fields.py
                    contents: field_values / known_fields / heading_lines（項目の値・計算項目・使用できる項目・見出しの行）
                  - type: file
                    name: filters.py
                    contents: check_filter / match_filter / compile_regex / normalize / parse_compare_value
              - type: folder
                name: lifecycle
                contents: サーバーの再起動と更新
              - type: folder
                name: migrate
                contents: 端末の設定の移し替え
                used_by:
                  - MOD-155-120#
              - type: folder
                name: prompt_doc
                contents: プロンプトの文書の変換
              - type: folder
                name: settings
                contents: 端末の設定 settings.yaml のスキーマでの検証と参照
                used_by:
                  - MOD-155-205#
                children:
                  - type: file
                    name: __init__.py
                    contents: 公開する型と関数の再エクスポート
                  - type: file
                    name: types.py
                    contents: TerminalConfig / SourceEntry / SourceScope / SettingsSourceRow / SettingsSourcesView / SettingsSourcesRequest / SettingsSourcesResponse
                  - type: file
                    name: query.py
                    contents: config_path / load_terminal_config / listen_port
                  - type: file
                    name: service.py
                    contents: save_sources（project-index へ保存を依頼する）
                  - type: file
                    name: route.py
                    contents: build_settings_router（GET・PUT /_api/settings/sources）
              - type: folder
                name: view
                contents: 画面が呼ぶ画面の API
                used_by:
                  - MOD-155-204#
                children:
                  - type: file
                    name: __init__.py
                    contents: 公開する型と関数の再エクスポート
                  - type: file
                    name: types.py
                    contents: NavItem / NavTab / ConversionError / GitHubTarget / AliasItem / DocumentResponse / DocumentDiff / ScreenSearchItem / ScreenSearchResult / ColumnsRequest
                  - type: file
                    name: paths.py
                    contents: page_path / find_page
                  - type: file
                    name: nav.py
                    contents: build_nav / first_page / mark_nav_changes
                  - type: file
                    name: columns.py
                    contents: ColumnSettings
                  - type: file
                    name: search.py
                    contents: screen_search
                  - type: file
                    name: document.py
                    contents: get_document / not_found_fields
                  - type: file
                    name: route.py
                    contents: build_view_router（/_api/sources/{source}/docs・search・refs・columns）
          - type: folder
            name: integrations
            contents: 外部システムの呼び出し
            children:
              - type: file
                name: __init__.py
                contents: パッケージの宣言
              - type: folder
                name: project_index
                contents: project-index の API を制限時間つきの HTTP で呼ぶ処理
                used_by:
                  - MOD-155-213#
                children:
                  - type: file
                    name: __init__.py
                    contents: 公開する型と ProjectIndexClient の再エクスポート
                  - type: file
                    name: types.py
                    contents: IndexedDocument / DocumentRow / SourceView / DocumentList / DocumentDetail / IndexFailure / SourceState / DecisionIndex / SearchHits / RefList / SettingsSourcesView
                  - type: file
                    name: client.py
                    contents: ProjectIndexClient（要求ごとに問い合わせ、dev-docs の中に控えない）
          - type: folder
            name: migrations
            contents: 設定の移し替えの手順
            used_by:
              - MOD-155-120#
            children:
              - type: folder
                name: settings
                contents: 端末の設定をバージョンへ上げる手順
                children:
                  - type: folder
                    name: '{version}'
                    contents: そのバージョンへ上げる手順
                    naming:
                      - steps.yaml
              - type: folder
                name: dev-docs
                contents: 配信元の設定をバージョンへ上げる手順
                children:
                  - type: folder
