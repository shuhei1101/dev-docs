gitignore:
  - pattern: docs/generated/
    reason: 以前の YAML の設計書から生成した Markdown の出力先（今は生成するコマンドが無い）
  - pattern: .venv/
    reason: uv が作る仮想環境
  - pattern: __pycache__/
    reason: Python のキャッシュ
  - pattern: .pytest_cache/
    reason: pytest のキャッシュ
  - pattern: .claude/worktrees/
    reason: 作業ブランチの worktree
  - pattern: .mypy_cache/
    reason: mypy のキャッシュ
  - pattern: .ruff_cache/
    reason: ruff のキャッシュ
  - pattern: node_modules/
    reason: npm の依存
  - pattern: tmp/storybook-static/
    reason: Storybook のビルドの出力
  - pattern: tmp/pages/
    reason: 公開ページのビルドの出力
  - pattern: test-results/
    reason: Playwright のテストの出力
  - pattern: playwright-report/
    reason: Playwright のテストのレポート
refs:
  - to: ARCH-155-1
    type: references
    when: フォルダをどのサブシステムに属させるかを決めるとき。
tags:
  - name: topic:フォルダ
    main: true
  - name: topic:構成
  - name: topic:リポジトリ
