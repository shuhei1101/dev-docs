id: LAY-275-1
title: dev-docs
repository: shuhei1101/dev-docs
lead: |-
  サーバーのコードは `src/dev_docs/`、画面のコードは `frontend/`、管理用プラグインは `plugins/dev-docs/`、テストは `tests/` に分ける。
  文書の原本は `docs/` の種類のフォルダ、MCP のプロンプトは `content/prompts/` に配置する。
entries:
  - type: folder
    name: .claude-plugin
    contents: マーケットプレースの定義
    children:
      - type: file
        name: marketplace.json
        contents: 管理用プラグインを配るマーケットプレースの定義
  - type: folder
    name: .github
    contents: GitHub の設定
    children:
      - type: folder
        name: workflows
        contents: GitHub Pages への配信と、テストをランナーで回すワークフロー
        children:
          - type: file
            name: pages.yml
            contents: develop への push で build_pages.py を実行し、出力を Pages へ配信するワークフロー
          - type: file
            name: test.yml
            contents: テストの層をランナーで回すワークフロー
  - type: folder
    name: content
    contents: コードではない原本
    children:
      - type: folder
        name: prompts
        contents: MCP のプロンプト
        children:
          - type: folder
            name: mcp
            contents: MCP のサーバーごとのプロンプト
            children:
              - type: folder
                name: admin
                contents: 管理の MCP のプロンプト
                children:
                  - type: folder
                    name: tools
                    contents: '管理の MCP のツールの description（kind: tool）'
                    naming:
                      - '{tool}.yaml'
                    used_by:
                      - MOD-155-198#
  - type: folder
    name: docs
    contents: 文書（種類ごとのフォルダ・guide/・pr/・mock/）
    children:
      - type: file
        name: README.md
        contents: トップの目次（index.yaml から生成する）
      - type: file
        name: index.yaml
        contents: トップの目次の原本
      - type: file
        name: design-policy.md
        contents: デザイン方針
      - type: folder
        name: '{kind}'
        contents: 種類ごとの文書（architecture・layout・module・scenario など。中はフラットで、目次の index.yaml と README.md を持つ）
      - type: folder
        name: guide
        contents: 公開ドキュメント（Markdown）と files.yml
      - type: folder
        name: mock
        contents: モック画面（画面 1 つ = 1 フォルダ）
      - type: folder
        name: pr
        contents: PR ドキュメント（PR 1 件 = 1 フォルダ）
  - type: folder
    name: frontend
    contents: 画面（React の SPA）
    children:
      - type: folder
        name: .storybook
        contents: Storybook の設定
      - type: folder
        name: scripts
        contents: 画面のビルドで使用するスクリプト
        children:
          - type: file
            name: export_openapi.py
            contents: サーバーの画面の API の OpenAPI を書き出す
      - type: folder
        name: src
        contents: 画面のコード
        convention: react-core-folder-structure
        children:
          - type: file
            name: route-tree.gen.ts
            contents: '@tanstack/router-plugin の生成物'
            generated_from:
              path: frontend/src/routes/
              command: CMD-155-1#categories[ビルド・生成]
              tracked: 型検査とテストが生成済みのルートの木を import する
          - type: folder
            name: shared
            contents: 画面の間で共通に使用する型・エラー・API のクライアント・フック・ストア・部品
            children:
              - type: folder
                name: api
                contents: 画面の API のクライアント
                children:
                  - type: folder
                    name: generated
                    contents: orval の生成物（API の関数・型・zod・MSW のハンドラ）
                    generated_from:
                      path: frontend/openapi.json
                      command: CMD-155-1#categories[ビルド・生成]
                      tracked: 型検査とテストが生成済みのクライアントを import する
              - type: folder
                name: styles
                contents: トークン・要素の既定・Tailwind の読み込み
                children:
                  - type: file
                    name: preflight-outside-mdmark.css
                    contents: Tailwind の preflight を mdmark の本文の外だけに当てるコピー
                    generated_from:
                      source: npm:tailwindcss@4.3.3
                      tracked: 画面のビルドが読み込む
      - type: file
        name: openapi.json
        contents: orval の入力にする画面の API の OpenAPI
        generated_from:
          path: src/dev_docs/
          command: CMD-155-1#categories[ビルド・生成]
          tracked: orval の生成の入力にする
      - type: file
        name: index.html
        contents: Vite の入口の HTML
      - type: file
        name: orval.config.ts
        contents: orval の設定
      - type: file
        name: tsconfig.json
        contents: TypeScript の設定
      - type: file
        name: vite.config.ts
        contents: Vite の設定
      - type: file
        name: vitest.config.ts
        contents: Vitest の設定
      - type: file
        name: files.yaml
        contents: 画面のコードの files.yaml の行
  - type: folder
    name: plugins
    contents: Claude Code のプラグイン
    children:
      - type: folder
        name: dev-docs
        contents: 管理用プラグイン
        children:
          - type: folder
            name: .claude-plugin
            contents: プラグインの定義（plugin.json）
          - type: file
            name: .mcp.json
            contents: 管理の MCP の接続先
          - type: folder
            name: hooks
            contents: フックの登録とフックのスクリプト
            used_by:
              - MOD-155-80#
            children:
              - type: file
                name: hooks.json
                contents: SessionStart（timeout 2）の登録
              - type: file
                name: session_start.py
                contents: セッション開始のフック
          - type: folder
            name: skills
            contents: プラグインのスキル（global-setup）
  - type: folder
    name: scripts
    contents: 反映作業のスクリプトが呼ぶ共通のスクリプトと、Pages の公開ページの生成のスクリプトと、常駐サーバーを起動し直すスクリプト
    used_by:
      - MOD-192-1#
      - MOD-266-1#
    children:
      - type: file
        name: build_pages.py
        contents: 公開の Markdown と判定フローチャートを mdmark の build で 1 枚の HTML にまとめる
      - type: file
        name: dev-docs-restart-resident.sh
        contents: 常駐サーバーを起動し直す
      - type: file
        name: dev-docs-server-wait.sh
        contents: 再起動の後にサーバーの待ち受けを待つ
  - type: folder
    name: src
    contents: サーバーのコード（src レイアウトのため、パッケージ 1 つだけを配置する）
    children:
      - type: folder
        name: dev_docs
        contents: 開発ドキュメントサーバー
        used_by:
          - MOD-155-193#
          - MOD-155-207#
        convention: python-architecture-layout
        children:
          - type: folder
            name: schemas
            contents: 端末の設定・エイリアスの元の行のスキーマ
            children:
              - type: file
                name: aliases.schema.yaml
                contents: エイリアスの元の行のスキーマの複製
                generated_from:
                  source: shuhei1101/alias-inject@v0.3.0:schemas/aliases.schema.yaml
                  tracked: サーバーが実行時に参照する
          - type: folder
            name: screen
            contents: 画面のビルドの成果物
            generated_from:
              path: frontend/
              command: CMD-155-1#categories[ビルド・生成]
              tracked: サーバーが配信し、利用者の導入でビルドしない
      - type: file
        name: files.yaml
        contents: サーバーのコードの files.yaml の行
  - type: folder
    name: templates
    contents: 配信元のプロンプトのスキーマと、端末へ書き出す設定の雛形
  - type: folder
    name: tests
    contents: テスト
    children:
      - type: folder
        name: unit
        contents: 単体テスト（サーバー・画面・管理用プラグイン・開発用のスクリプト）
      - type: folder
        name: integration
        contents: 結合テスト（サーバー・画面・管理用プラグイン）
      - type: folder
        name: e2e
        contents: E2E（ワークフロー）
      - type: file
        name: files.yaml
        contents: テストの files.yaml の行
      - type: file
        name: conftest.py
        contents: 全てのテストの共通の準備
  - type: folder
    name: tmp
    contents: レビューのスクリーンショットと、Storybook・公開ページのビルドの出力
    children:
      - type: file
        name: .gitignore
        contents: '`tmp/` の中身を全て Git の管理から除外する `*` だけのパターン'
  - type: file
    name: .gitignore
    contents: Git で管理しないもの
  - type: file
    name: .python-version
    contents: uv が使用する Python のバージョン
  - type: file
    name: CLAUDE.md
    contents: エージェント向けの作業の決まり
  - type: file
    name: README.md
    contents: dev-docs の概要
  - type: file
    name: ai-monitor-version.ini
    contents: 追従している AI Monitor の配布物のバージョン
  - type: file
    name: components.json
    contents: shadcn/ui の設定
  - type: file
    name: eslint.config.js
    contents: ESLint の設定
  - type: file
    name: files.yaml
    contents: リポジトリの設定とスクリプトの files.yaml の行
  - type: file
    name: lefthook.yml
    contents: Git のフックの設定
  - type: file
    name: mdmark.config.yaml
    contents: mdmark の設定
  - type: file
    name: package.json
    contents: 画面のパッケージの定義
  - type: file
    name: package-lock.json
    contents: 画面の依存のロックファイル
  - type: file
    name: project-index.yaml
    contents: 配信元の設定
  - type: file
    name: pyproject.toml
    contents: サーバーのパッケージの定義
  - type: file
    name: rules.yaml
    contents: rule-inject のルールの索引
  - type: file
    name: uv.lock
    contents: サーバーの依存のロックファイル
  - type: file
    name: version.ini
    contents: dev-docs のバージョン
gitignore:
  - pattern: .venv/
    reason: uv が作る仮想環境
  - pattern: __pycache__/
    reason: Python のキャッシュ
  - pattern: .pytest_cache/
    reason: pytest のキャッシュ
  - pattern: .claude/worktrees/
    reason: 作業ブランチの worktree
  - pattern: .mypy_cache/
    reason: mypy のキャッシュ
  - pattern: .ruff_cache/
    reason: ruff のキャッシュ
  - pattern: node_modules/
    reason: npm の依存
  - pattern: test-results/
    reason: Playwright のテストの出力
  - pattern: playwright-report/
    reason: Playwright のテストのレポート
refs:
  - to: ARCH-155-1
    type: references
    when: フォルダをどのサブシステムに属させるかを決めるとき。
tags:
  - name: topic:フォルダ
    main: true
  - name: topic:構成
  - name: topic:リポジトリ
