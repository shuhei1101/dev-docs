summary: dev-docs の使い方（はじめに・使い方・リファレンス）
items:
- page: コアコンセプト-配信元と権限.md
  summary: 配信元と、dev-docs の画面の入口・読むリビジョン。権限と設定のマージは project-index
- page: コアコンセプト-管理用プラグイン.md
  summary: プラグインが配る .mcp.json・フック・スキルと起動の仕組み、project-index のプラグインとの分担
- page: コアコンセプト-文書のメタデータ.md
  summary: dev-docs の画面が使う共通のメタデータ。メタデータの解決は project-index
- page: dev-docsを入れる.md
  summary: プラグインを入れ、global-setup で端末の設定と起動を用意して、/mcp につなぐ手順
- page: 配信元を配信する.md
  summary: project-index.yaml を記載して project-index に配信元を登録し、dev-docs の画面で読む手順
- page: dev-docsを更新する.md
  summary: update と dev-docs migrate で dev-docs を更新し、端末の設定を移し替える手順
- page: 画面で読む.md
  summary: 文書の画面で配信元の文書を読み、コメントを渡し、設定画面で配信元を追加する手順
- page: 文書のMCP.md
  summary: 文書の MCP のリファレンスの案内
- page: 管理のMCP.md
  summary: 管理の MCP の 3 つのツールの引数・返す内容・エラーの一覧
- page: CLI.md
  summary: dev-docs serve・dev-docs migrate のサブコマンド・引数・終了コード
- page: 設定.md
  summary: 端末の設定のキーと、画面が読む project-index.yaml のキーの一覧
- page: 用語集.md
  summary: 配信元・作業中の配信元・種類（kind）・バージョンなどの用語
