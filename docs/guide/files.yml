files:
- path: コアコンセプト-配信元と権限.md
  visibility: public
  category: はじめに
  name: 配信元と権限
  description: 配信元と、dev-docs の画面の入口・参照するリビジョン・権限と設定のマージの分担を説明し、配信元の単位や画面で参照するリビジョンを確認するときに参照する。
  tags: [topic:配信元, topic:権限, topic:リビジョン, tool:project-index]
- path: コアコンセプト-管理用プラグイン.md
  visibility: public
  category: はじめに
  name: 管理用プラグイン
  description: プラグインが配る .mcp.json・フック・スキルと起動の仕組み、project-index のプラグインとの分担を説明し、プラグインの起動や配るものを確認するときに参照する。
  tags: [topic:プラグイン, topic:フック, topic:起動, tool:claude-code, tool:project-index]
- path: コアコンセプト-文書のメタデータ.md
  visibility: public
  category: はじめに
  name: 文書のメタデータ
  description: dev-docs の画面が使用する共通のメタデータ（name・description・tags など）の使い方を説明し、画面に出る名前や検索の結果がどのメタデータから来るかを確認するときに参照する。
  tags: [topic:メタデータ, topic:画面, tool:project-index]
- path: dev-docsを入れる.md
  visibility: public
  category: 使い方
  name: dev-docsを入れる
  description: プラグインを入れ、global-setup で端末の設定と起動を用意して /mcp につなぐ手順を説明し、端末に dev-docs を入れるときに参照する。
  tags: [topic:インストール, topic:端末の設定, topic:プラグイン]
- path: 配信元を配信する.md
  visibility: public
  category: 使い方
  name: 配信元を配信する
  description: project-index.yaml を記載して project-index に配信元を登録し、dev-docs の画面で参照する手順を説明し、リポジトリを配信元にするときに参照する。
  tags: [topic:配信元, topic:配信元の設定, tool:project-index]
- path: dev-docsを更新する.md
  visibility: public
  category: 使い方
  name: dev-docsを更新する
  description: update と dev-docs migrate で dev-docs を更新し端末の設定を移し替える手順を説明し、dev-docs のバージョンを上げるときに参照する。
  tags: [topic:更新, topic:移行, topic:端末の設定]
- path: 新しく作るか修正するかの判定.md
  visibility: public
  category: 使い方
  name: 新しく作るか修正するかの判定
  description: 同じ話題の文書を検索して、新しく作るか既存の文書を修正するかを判定し、文書を記載する前に参照する。
  tags: [topic:判定フローチャート, topic:文書の作成]
- path: documentsの行の判定.md
  visibility: public
  category: 使い方
  name: documentsの行の判定
  description: 文書を既存の documents の行に入れるか、新しい行（新しいスキーマ）を作るかを判定し、配信元の設定に文書の種類を追加するときに参照する。
  tags: [topic:判定フローチャート, topic:documents, topic:配信元の設定]
- path: 画面で読む.md
  visibility: public
  category: 使い方
  name: 画面で読む
  description: 文書の画面で配信元の文書を参照し、コメントを送信し、設定画面で配信元を追加する手順を説明し、画面の操作を確認するときに参照する。
  tags: [topic:画面, topic:検索, topic:差分, topic:コメント, topic:設定画面]
- path: 文書のMCP.md
  visibility: public
  category: リファレンス
  name: 文書のMCP
  description: 文書の MCP のリファレンスが project-index にあることを案内し、文書の検索・書き込みのツールを探すときに参照する。
  tags: [topic:mcp, tool:project-index]
- path: 管理のMCP.md
  visibility: public
  category: リファレンス
  name: 管理のMCP
  description: 管理の MCP の status・restart・update の引数・返却する内容・エラーを定め、サーバーの状態の確認・再起動・更新を MCP で行うときに参照する。
  tags: [topic:mcp, topic:管理, topic:再起動, topic:更新]
- path: CLI.md
  visibility: public
  category: リファレンス
  name: CLI
  description: dev-docs serve・dev-docs migrate のサブコマンド・引数・終了コードを定め、コマンドでサーバーを起動するときや設定を移し替えるときに参照する。
  tags: [topic:cli, topic:起動, topic:移行]
- path: 設定.md
  visibility: public
  category: リファレンス
  name: 設定
  description: dev-docs の端末の設定のキーと、画面が参照する project-index.yaml のキーを定め、端末の設定や配信元の設定の値を確認するときに参照する。
  tags: [topic:端末の設定, topic:配信元の設定, topic:環境変数]
- path: 用語集.md
  visibility: public
  category: リファレンス
  name: 用語集
  description: 配信元・作業中の配信元・種類（kind）・バージョンなど dev-docs の用語の意味を定め、文書に出る用語の意味を確認するときに参照する。
  tags: [topic:用語集]
