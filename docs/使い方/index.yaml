summary: 導入と使い方の手順
items:
  - page: dev-docsを入れる.md
    summary: プラグインを入れ、global-setup で端末の設定と起動を用意して、/mcp につなぐ手順
  - page: 配信元を配信する.md
    summary: 端末の設定と dev-docs.yaml を記載して dev-docs serve で配信し、文書の MCP で読む手順
  - page: dev-docsを更新する.md
    summary: update と dev-docs migrate で dev-docs を更新し、端末の設定を移し替える手順
  - page: 新しく作るか修正するかの判定.md
    summary: 文書を記載する前に、同じ話題の文書を検索で引き、新しく作るか既存の文書を修正するかを決める判定フローチャート
  - page: documentsの行の判定.md
    summary: 文書を既存の documents の行に入れるか、新しい行（新しいスキーマ）を作るかを決める判定フローチャート
