# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/project-index/develop/schemas/project-index.schema.json
version: "3"
name: dev-docs
default_ref: develop
worktrees:
  - ./.claude/worktrees/*
description: project-index の文書を画面で出す開発ドキュメントサーバーの設計書・公開ドキュメント・デザイン方針・モック
github:
  repository: shuhei1101/dev-docs
documents:
  - id: architecture
    title: アーキテクチャ図
    paths: ["docs/architecture/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/architecture.schema.yaml
      ref: design-schemas/v9.2.2
    metadata:
      related: refs
      name: title
      description: lead
      tags: tags[].name
      main_tags: tags[main].name
  - id: layout
    title: フォルダ構成
    paths: ["docs/layout/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/layout.schema.yaml
      ref: design-schemas/v9.2.2
    metadata:
      related: refs
      name: title
      description: lead
      tags: tags[].name
      main_tags: tags[main].name
  - id: nonfunctional
    title: 非機能要件
    paths: ["docs/nonfunctional/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/nonfunctional.schema.yaml
      ref: design-schemas/v9.2.2
    metadata:
      related: refs
      name: title
      description: lead
      tags: tags[].name
      main_tags: tags[main].name
  - id: scenario
    title: シナリオ
    paths: ["docs/scenario/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/scenario.schema.yaml
      ref: design-schemas/v9.2.2
    metadata:
      related: refs
      name: title
      description: lead
      tags: tags[].name
      main_tags: tags[main].name
  - id: interface
    title: インターフェース定義
    paths: ["docs/interface/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/interface.schema.yaml
      ref: design-schemas/v9.2.2
    metadata:
      related: refs
      name: title
      description: lead
      tags: tags[].name
      main_tags: tags[main].name
  - id: module
    title: モジュール構成
    paths: ["docs/module/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/module.schema.yaml
      ref: design-schemas/v9.2.2
    metadata:
      related: refs
      name: title
      description: lead
      tags: tags[].name
      main_tags: tags[main].name
  - id: screen
    title: 画面設計
    paths: ["docs/screen/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/screen.schema.yaml
      ref: design-schemas/v9.2.2
    metadata:
      related: refs
      name: title
      description: lead
      tags: tags[].name
      main_tags: tags[main].name
  - id: component
    title: 部品設計
    paths: ["docs/component/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/component.schema.yaml
      ref: design-schemas/v9.2.2
    metadata:
      related: refs
      name: title
      description: lead
      tags: tags[].name
      main_tags: tags[main].name
  - id: config
    title: 設定
    paths: ["docs/config/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/config.schema.yaml
      ref: design-schemas/v9.2.2
    metadata:
      related: refs
      name: title
      description: lead
      tags: tags[].name
      main_tags: tags[main].name
  - id: api
    title: 外部API
    paths: ["docs/external-api/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/external_api.schema.yaml
      ref: design-schemas/v9.2.2
    metadata:
      related: refs
      name: title
      description: lead
      tags: tags[].name
      main_tags: tags[main].name
  - id: library
    title: 外部ライブラリ
    paths: ["docs/library/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/library.schema.yaml
      ref: design-schemas/v9.2.2
    metadata:
      related: refs
      name: title
      description: lead
      tags: tags[].name
      main_tags: tags[main].name
  - id: test_procedure
    title: テスト実行方法
    paths: ["docs/test-procedure/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/test_procedure.schema.yaml
      ref: design-schemas/v9.2.2
    metadata:
      related: refs
      name: title
      description: lead
      tags: tags[].name
      main_tags: tags[main].name
  - id: dev_command
    title: 開発コマンド
    paths: ["docs/dev-command/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/dev_command.schema.yaml
      ref: design-schemas/v9.2.2
    metadata:
      related: refs
      name: title
      description: lead
      tags: tags[].name
      main_tags: tags[main].name
  - id: flowchart
    title: 判定フローチャート
    paths: ["docs/flowchart/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/flowchart.schema.yaml
      ref: design-schemas/v9.2.2
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: index
    title: 目次
    paths:
      - docs/index.yaml
      - "docs/*/index.yaml"
    schema:
      source: knowledge
      path: schemas/design/index.schema.yaml
      ref: design-schemas/v9.2.2
    metadata:
      description: summary
  - id: files_guide
    title: 公開ドキュメントの Markdown
    paths: ["docs/guide/files.yml"]
    exclude: ["*.yaml", README.md]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v9.2.2
    records: files
    body_file: path
    metadata:
      visibility: visibility
      category: category
  - id: files_mock
    title: モックの Markdown
    paths: ["docs/mock/files.yml"]
    exclude: ["*.html", "*.js", "*.css"]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v9.2.2
    records: files
    body_file: path
  - id: root
    title: リポジトリの設定とスクリプト
    paths: [files.yaml]
    exclude: [.git, "docs/pr/**", "docs/**/README.md", package-lock.json, uv.lock]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v9.2.2
    records: files
    body_file: path
  - id: src
    title: サーバーのコード
    paths: [src/files.yaml]
    exclude: ["src/dev_docs/screen/**"]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v9.2.2
    records: files
    body_file: path
  - id: frontend
    title: 画面のコード
    paths: [frontend/files.yaml]
    exclude: ["frontend/src/shared/api/generated/**", route-tree.gen.ts, mockServiceWorker.js]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v9.2.2
    records: files
    body_file: path
  - id: tests
    title: テスト
    paths: [tests/files.yaml]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v9.2.2
    records: files
    body_file: path
  - id: prompts
    title: プロンプト
    paths: [content/prompts/**/*.yaml]
    schema: templates/prompt.schema.yaml
    converter: prompt-doc
    metadata:
      name: name
      description: description
      tags: tags
converters:
  - id: prompt-doc
    run: [project-index, prompt-doc]
nav:
  tabs:
    - title: はじめに
      items:
        - {page: root/README.md, title: 概要}
        - group: コアコンセプト
          items:
            - page: files_guide/docs/guide/コアコンセプト-配信元と権限.md
            - page: files_guide/docs/guide/コアコンセプト-管理用プラグイン.md
            - page: files_guide/docs/guide/コアコンセプト-文書のメタデータ.md
    - title: 使い方
      items:
        - group: 導入と更新
          items:
            - page: files_guide/docs/guide/dev-docsを導入する.md
            - page: files_guide/docs/guide/配信元を配信する.md
            - page: files_guide/docs/guide/dev-docsを更新する.md
        - group: 画面
          items:
            - page: files_guide/docs/guide/画面で参照する.md
    - title: 設計書
      items:
        - group: 全体
          items:
            - page: architecture
            - page: layout
            - page: nonfunctional
            - page: config
            - {page: root/docs/design-policy.md, title: デザイン方針}
        - group: シナリオ
          items:
            - page: scenario/SC-155-13
            - page: scenario/SC-155-2
            - page: scenario/SC-155-10
            - page: scenario/SC-155-7
            - page: scenario/SC-155-6
            - page: scenario/SC-155-12
            - page: scenario/SC-155-11
            - page: scenario/SC-155-3
            - auto: {document: scenario}
        - group: インターフェース定義
          items:
            - auto: {document: interface}
        - group: 画面設計
          items:
            - auto: {document: screen}
        - group: 部品設計
          items:
            - auto: {document: component}
        - group: モジュール構成 / 画面
          items:
            - auto:
                document: module
                filter: {field: name, op: prefix, values: ['画面 / ']}
        - group: モジュール構成 / 開発ドキュメントサーバー
          items:
            - auto:
                document: module
                filter: {field: name, op: prefix, values: ['開発ドキュメントサーバー / ']}
        - group: モジュール構成 / 管理用プラグイン・開発用のスクリプト
          items:
            - auto:
                document: module
                filter:
                  or:
                    - {field: name, op: prefix, values: ['管理用プラグイン / ']}
                    - {field: name, op: prefix, values: ['開発用のスクリプト / ']}
        - group: 外部 API・外部ライブラリ
          items:
            - page: api
            - auto: {document: library}
        - group: テスト・開発コマンド
          items:
            - page: test_procedure
            - page: dev_command
        - group: モック
          items:
            - auto: {document: files_mock}
    - title: 規約
      items:
        - group: 判定フローチャート
          items:
            - auto: {document: flowchart}
    - title: コード
      items:
        - group: サーバー
          items:
            - auto: {document: src}
        - group: 画面
          items:
            - auto: {document: frontend}
        - group: テスト / 単体
          items:
            - auto:
                document: tests
                filter: {field: id, op: prefix, values: [tests/unit/]}
        - group: テスト / 結合・E2E
          items:
            - auto:
                document: tests
                filter:
                  not: {field: id, op: prefix, values: [tests/unit/]}
        - group: リポジトリの設定とスクリプト
          items:
            - auto:
                document: root
                filter:
                  not: {field: id, op: eq, values: [docs/design-policy.md, README.md]}
        - group: プロンプト
          items:
            - auto: {document: prompts, group_by: kind}
    - title: リファレンス
      items:
        - group: MCP とコマンド
          items:
            - page: files_guide/docs/guide/管理のMCP.md
            - page: files_guide/docs/guide/文書のMCP.md
            - page: files_guide/docs/guide/CLI.md
        - group: 設定
          items:
            - page: files_guide/docs/guide/設定.md
    - title: 用語集
      items:
        - page: files_guide/docs/guide/用語集.md
