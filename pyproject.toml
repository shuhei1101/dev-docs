[project]
name = "dev-docs"
version = "0.0.0"
description = "各リポジトリの YAML の開発ドキュメントを、人には画面で、AI には MCP で出すサーバー"
requires-python = ">=3.14"

[project.scripts]
dev-docs = "dev_docs.__main__:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib", "--strict-markers", "--strict-config", "-W", "error"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["dev", "docs"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "SIM", "RUF",
    "PLR2004",
    "BLE001",
    "TRY400",
    "DTZ",
    "ASYNC",
    "S101",
    "S602", "S604",
    "S301", "S506",
    "PT011", "PT012",
]
ignore = [
    "E501",
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["dev_docs"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
pretty = true
